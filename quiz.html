<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
<script>window.__loadErrs=[];window.addEventListener('error',e=>window.__loadErrs.push((e.message||'')+' @'+(e.filename||'')+':'+(e.lineno||'')));</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>法語抽考 · A1</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f0ee;
      color: #2c2c2c;
      padding: 24px 20px;
      max-width: 600px;
      margin: 0 auto;
    }

    h1 { font-size: 1.15rem; font-weight: 700; margin-bottom: 2px; }
    .meta { font-size: 0.75rem; color: #aaa; margin-bottom: 10px; }
    .meta a { color: #aaa; text-decoration: none; border-bottom: 1px solid #ddd; }

    /* ── XP / streak bar ── */
    .stat-bar {
      display: flex; gap: 10px; align-items: center;
      margin-bottom: 18px; flex-wrap: wrap;
    }
    .stat-chip {
      font-size: 0.72rem; font-weight: 700;
      padding: 3px 10px; border-radius: 99px;
      background: #fff; border: 1.5px solid #e0e0de; color: #555;
    }
    .stat-chip.fire  { border-color: #f5a623; color: #c07000; }
    .stat-chip.star  { border-color: #9b59b6; color: #7b39a6; }
    .stat-chip.weak  { border-color: #e74c3c; color: #c00; cursor: pointer; }
    .stat-chip.weak:hover { background: #fff0f0; }

    /* ── Mode row ── */
    .mode-row {
      display: flex; gap: 6px; margin-bottom: 10px;
    }
    .mode-btn {
      flex: 1; border: 1.5px solid #ddd; background: #fff; border-radius: 8px;
      padding: 7px 8px; font-size: 0.72rem; font-weight: 600;
      cursor: pointer; color: #777; transition: all 0.15s; text-align: center;
    }
    .mode-btn:hover { background: #f8f8f6; }
    .mode-btn.active         { border-color: #2c2c2c; color: #2c2c2c; background: #f0f0ee; }
    .mode-btn.active.m-weak  { border-color: #e74c3c; color: #c00; background: #fff8f8; }
    .mode-btn.active.m-mixed { border-color: #2a7a4f; color: #1a5a3a; background: #f4fbf6; }

    /* ── 篩選列 ── */
    .filter-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .ctrl-btn {
      border: 1.5px solid #ddd; background: #fff; border-radius: 8px;
      padding: 6px 12px; font-size: 0.75rem; font-weight: 600;
      cursor: pointer; color: #666; transition: all 0.15s;
    }
    .ctrl-btn:hover { background: #f8f8f6; }
    .ctrl-btn.active { border-color: #2c2c2c; color: #2c2c2c; background: #f0f0ee; }
    .ctrl-btn.shuffle { margin-left: auto; }

    /* ── 進度 ── */
    .progress-bar-wrap { background: #e4e4e2; border-radius: 99px; height: 5px; margin-bottom: 18px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: #2c2c2c; border-radius: 99px; transition: width 0.3s; }
    .progress-text { font-size: 0.72rem; color: #aaa; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .score-chip { display: flex; gap: 8px; }
    .score-chip span { font-size: 0.7rem; font-weight: 600; padding: 2px 8px; border-radius: 99px; }
    .chip-ok { background: #e6f4ea; color: #1a6b2a; }
    .chip-no { background: #fde8e8; color: #c00; }

    /* ── 題卡 ── */
    .card {
      background: #fff; border-radius: 16px; padding: 22px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07); margin-bottom: 14px;
    }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
    .qtype {
      font-size: 0.62rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; color: #fff; padding: 2px 8px;
      border-radius: 5px; display: inline-block;
    }
    .type-fill   { background: #3b6fd4; }
    .type-trans  { background: #2a7a4f; }
    .type-gender { background: #8b44c2; }
    .type-choose { background: #c05a00; }

    .review-badge {
      font-size: 0.6rem; font-weight: 700; padding: 2px 8px;
      border-radius: 5px; background: #fff0e0; color: #c05a00;
      border: 1px solid #f0c080;
    }
    .weak-indicator {
      font-size: 0.68rem; color: #e74c3c; font-weight: 600;
    }

    .question { font-size: 1rem; font-weight: 600; line-height: 1.6; margin-bottom: 6px; }
    .hint { font-size: 0.78rem; color: #888; margin-bottom: 14px; }
    .hint-btn {
      font-size: 0.75rem; color: #aaa; background: none; border: 1.5px dashed #ddd;
      border-radius: 8px; padding: 4px 12px; cursor: pointer; margin-bottom: 14px;
      font-family: inherit; transition: all 0.15s;
    }
    .hint-btn:hover { color: #666; border-color: #aaa; }

    /* ── 輸入 ── */
    .input-row { display: flex; gap: 8px; margin-bottom: 4px; }
    .answer-input {
      flex: 1; border: 1.5px solid #e0e0de; border-radius: 10px;
      padding: 10px 14px; font-size: 0.95rem; outline: none;
      font-family: inherit; transition: border-color 0.15s;
      background: #fafaf8;
    }
    .answer-input:focus { border-color: #2c2c2c; background: #fff; }
    .answer-input.correct { border-color: #2a7a4f; background: #f4fbf6; }
    .answer-input.wrong   { border-color: #c00;    background: #fff8f8; }
    .answer-input:disabled { opacity: 0.7; }

    .btn-submit {
      border: none; border-radius: 10px; padding: 10px 18px;
      font-size: 0.88rem; font-weight: 600; cursor: pointer;
      background: #2c2c2c; color: #fff; white-space: nowrap;
      transition: opacity 0.15s;
    }
    .btn-submit:disabled { opacity: 0.4; cursor: default; }

    /* ── 結果 ── */
    .result { margin-top: 14px; display: none; }
    .result.show { display: block; }
    .result-banner {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.9rem; font-weight: 700; margin-bottom: 10px;
    }
    .result-banner.ok { color: #1a6b2a; }
    .result-banner.no { color: #c00; }
    .correct-ans {
      background: #f8f8f6; border-left: 3px solid #2c2c2c;
      border-radius: 0 8px 8px 0; padding: 10px 14px;
      font-size: 0.9rem; margin-bottom: 10px;
    }
    .correct-ans .label { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #bbb; margin-bottom: 4px; }
    .correct-ans .fr-ans { font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .ans-note { font-size: 0.8rem; color: #888; line-height: 1.6; margin-top: 6px; }

    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .btn {
      border: none; border-radius: 10px; padding: 9px 16px;
      font-size: 0.84rem; font-weight: 600; cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-next    { background: #2c2c2c; color: #fff; flex: 1; }
    .btn-claude   { background: #f0f0ee; color: #555; border: 1.5px solid #ddd; }
    .btn-override { background: none; color: #888; border: 1.5px solid #ccc; font-size: 0.8rem; }
    .btn-override:hover { border-color: #2a7a4f; color: #2a7a4f; background: #f2fbf6; }

    /* ── 心聲筆記 ── */
    .qvoice-row { display: flex; align-items: center; gap: 8px; margin: 8px 0 2px; flex-wrap: wrap; }
    .btn-voice { background: none; border: 1.5px solid #e0ddd8; border-radius: 20px; padding: 4px 12px; font-size: 0.75rem; color: #aaa; cursor: pointer; font-family: inherit; transition: all 0.15s; white-space: nowrap; }
    .btn-voice:hover { border-color: #4a90d9; color: #4a90d9; }
    .btn-voice.has-note { border-color: #4a90d9; color: #4a90d9; background: #f0f7ff; }
    .qvoice-preview { font-size: 0.75rem; color: #999; font-style: italic; }
    .qvoice-area { background: #f8f8f6; border-radius: 8px; padding: 8px 10px; margin: 4px 0 6px; display: none; }
    .qvoice-area textarea { width: 100%; min-height: 52px; border: 1.5px solid #e0ddd8; border-radius: 6px; padding: 6px 8px; font-size: 0.82rem; font-family: inherit; resize: none; outline: none; background: #fff; color: #333; line-height: 1.5; }
    .qvoice-area textarea:focus { border-color: #4a90d9; }
    .voice-btns { display: flex; gap: 6px; margin-top: 6px; }
    .voice-save-btn { flex: 1; padding: 6px; background: #1d5035; color: #60d090; border: none; border-radius: 6px; font-size: 0.78rem; cursor: pointer; font-family: inherit; }
    .voice-cancel-btn { padding: 6px 10px; background: none; color: #aaa; border: 1.5px solid #e0ddd8; border-radius: 6px; font-size: 0.78rem; cursor: pointer; font-family: inherit; }

    .tts-btn {
      border: none; background: none; cursor: pointer;
      font-size: 1.1rem; padding: 4px 6px; opacity: 0.7;
      border-radius: 6px; transition: opacity 0.15s; flex-shrink: 0;
    }
    .tts-btn:hover { opacity: 1; }
    .tts-btn.playing { opacity: 1; }

    /* ── 複習分隔畫面 ── */
    .review-divider {
      background: #fff8f0; border-radius: 16px; padding: 28px 22px;
      text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,0.07);
      border: 2px solid #f0c080;
    }
    .review-divider h2 { font-size: 1.1rem; color: #c05a00; margin-bottom: 8px; }
    .review-divider p  { font-size: 0.88rem; color: #888; margin-bottom: 20px; }
    .review-list { text-align: left; margin-bottom: 20px; }
    .review-list-item {
      font-size: 0.82rem; padding: 6px 0;
      border-bottom: 1px solid #f0e8d8; color: #555;
    }
    .btn-review { background: #c05a00; color: #fff; width: 100%; padding: 11px; border-radius: 10px; border: none; font-size: 0.92rem; font-weight: 600; cursor: pointer; }
    .btn-skip   { background: #f0f0ee; color: #888; width: 100%; padding: 9px; border-radius: 10px; border: 1.5px solid #ddd; font-size: 0.82rem; font-weight: 600; cursor: pointer; margin-top: 8px; }

    /* ── 完成 ── */
    .done-card {
      background: #fff; border-radius: 16px; padding: 32px 22px;
      text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,0.07);
    }
    .done-card h2 { font-size: 1.2rem; margin-bottom: 4px; }
    .done-big { font-size: 2.4rem; font-weight: 800; margin: 12px 0 4px; }
    .done-sub { font-size: 0.88rem; color: #888; margin-bottom: 6px; }
    .xp-gain  { font-size: 0.78rem; font-weight: 700; color: #7b39a6; margin-bottom: 20px; }

    .weak-section { text-align: left; margin: 18px 0; }
    .weak-section-title { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #bbb; margin-bottom: 8px; }
    .weak-item {
      display: flex; align-items: baseline; justify-content: space-between;
      padding: 7px 0; border-bottom: 1px solid #f0f0ee; gap: 10px;
    }
    .weak-item-q   { font-size: 0.82rem; color: #444; flex: 1; }
    .weak-item-cnt { font-size: 0.7rem; font-weight: 700; color: #e74c3c; white-space: nowrap; }

    .done-btns { display: flex; gap: 8px; margin-top: 18px; }
    .btn-restart { background: #2c2c2c; color: #fff; flex: 1; padding: 11px; border-radius: 10px; border: none; font-size: 0.92rem; font-weight: 600; cursor: pointer; }
    .btn-do-weak { background: #fff0f0; color: #c00; flex: 1; padding: 11px; border-radius: 10px; border: 1.5px solid #f0b0b0; font-size: 0.88rem; font-weight: 600; cursor: pointer; }
    .btn-do-weak:disabled { opacity: 0.35; cursor: default; }

    .mode-btn.active.m-drill { border-color: #c05a00; color: #c05a00; background: #fff8f0; }

    /* ── ⚡ 快速測驗 ── */
    .drill-card { background: #fff; border-radius: 16px; padding: 24px 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
    .drill-top { display: flex; align-items: center; margin-bottom: 18px; gap: 10px; }
    .drill-count { font-size: 0.72rem; font-weight: 700; color: #aaa; white-space: nowrap; }
    .drill-pbar { flex: 1; height: 5px; background: #eee; border-radius: 99px; overflow: hidden; }
    .drill-pbar-fill { height: 100%; background: #c05a00; border-radius: 99px; transition: width 0.3s; }
    .drill-q { font-size: 1.05rem; font-weight: 600; line-height: 1.7; margin-bottom: 20px; text-align: center; min-height: 54px; }
    .drill-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .drill-opt {
      border: 2px solid #e8e8e6; background: #fafaf8; border-radius: 12px;
      padding: 14px 8px; font-size: 0.92rem; font-weight: 600; cursor: pointer;
      transition: all 0.15s; font-family: inherit; color: #2c2c2c;
      text-align: center; line-height: 1.4;
    }
    .drill-opt:hover:not(:disabled) { border-color: #2c2c2c; background: #f0f0ee; }
    .drill-opt.correct { border-color: #2a7a4f !important; background: #e8f5ee !important; color: #1a5a2a !important; }
    .drill-opt.wrong   { border-color: #c00 !important;    background: #fde8e8 !important; color: #900 !important; }
    .drill-opt.reveal  { border-color: #2a7a4f; background: #f0fbf5; color: #2a7a4f; }
    .drill-opt:disabled { cursor: default; }
    .drill-note { font-size: 0.8rem; color: #666; line-height: 1.6; padding: 8px 12px;
      background: #f8f8f6; border-radius: 8px; border-left: 3px solid #ccc;
      min-height: 34px; opacity: 0; transition: opacity 0.2s; }
    .drill-note.show { opacity: 1; }
    .drill-note.ok  { border-left-color: #2a7a4f; }
    .drill-note.bad { border-left-color: #c00; }
    .drill-done { background: #fff; border-radius: 16px; padding: 32px 22px;
      text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
    .drill-done h2 { font-size: 1.1rem; margin-bottom: 4px; }
    .drill-done-big { font-size: 3rem; font-weight: 800; margin: 10px 0 2px; }
    .drill-done-pct { font-size: 0.9rem; color: #888; margin-bottom: 6px; }
    .drill-done-msg { font-size: 0.85rem; color: #555; margin-bottom: 22px; line-height: 1.6; }
    .drill-next  { background: #2c2c2c; color: #fff; width: 100%; padding: 12px; border-radius: 10px;
      border: none; font-size: 0.92rem; font-weight: 600; cursor: pointer; margin-top: 12px;
      display: none; }
    .drill-next.show { display: block; }
    .drill-override-btn {
      display: block; width: 100%; padding: 9px; margin-bottom: 8px;
      background: none; border: 1.5px solid #ccc; border-radius: 10px;
      color: #888; font-size: 0.82rem; font-weight: 600; cursor: pointer;
      font-family: inherit; transition: all 0.15s;
    }
    .drill-override-btn:hover { border-color: #2a7a4f; color: #2a7a4f; background: #f2fbf6; }
    .drill-hard-badge  { display: inline-block; font-size: 0.62rem; font-weight: 700;
      background: #fff0e0; color: #c05a00; border: 1px solid #f0c080;
      padding: 1px 7px; border-radius: 5px; margin-bottom: 8px; }
    .drill-chain-badge { display: inline-block; font-size: 0.62rem; font-weight: 700;
      background: #e8f0fe; color: #1a56db; border: 1px solid #b8d0f8;
      padding: 1px 7px; border-radius: 5px; margin-bottom: 8px; }
    .drill-review-banner { background: #fff8f0; border: 1.5px solid #f0c080; border-radius: 8px;
      padding: 6px 12px; font-size: 0.75rem; font-weight: 600; color: #c05a00;
      margin-bottom: 10px; text-align: center; }
    .drill-retry { background: #c05a00; color: #fff; width: 100%; padding: 12px; border-radius: 10px;
      border: none; font-size: 0.92rem; font-weight: 600; cursor: pointer; margin-bottom: 8px; }
    .drill-back  { background: #f0f0ee; color: #555; width: 100%; padding: 10px; border-radius: 10px;
      border: 1.5px solid #ddd; font-size: 0.84rem; font-weight: 600; cursor: pointer; }

    /* ── 學習曲線 / topic sprint ── */
    .curve-wrap { background: #fafaf8; border-radius: 10px; padding: 12px 14px; margin-bottom: 18px; }
    .curve-label { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #bbb; margin-bottom: 6px; }
    .curve-chart { width: 100%; height: 72px; display: block; }
    .topic-sprint-btn {
      font-size: 0.68rem; font-weight: 700; padding: 2px 8px; border-radius: 5px;
      background: #fff0e0; color: #c05a00; border: 1.5px solid #f0c080;
      cursor: pointer; white-space: nowrap; flex-shrink: 0; font-family: inherit;
    }
    .topic-sprint-btn:hover { background: #ffe4c0; }
    .topic-delta { font-size: 0.72rem; font-weight: 700; white-space: nowrap; margin-left: 4px; }
    .topic-delta.up   { color: #2a7a4f; }
    .topic-delta.down { color: #c00; }
    .topic-delta.same { color: #bbb; }
    .note-link {
      font-size: 0.72rem; color: #3b6fd4; text-decoration: none;
      border-bottom: 1px dashed #b0c4f0; margin-left: 6px;
    }
    .note-link:hover { color: #1a4fb0; }

    /* ── 疑慮旗標按鈕 ── */
    .drill-flag-btn {
      width: 20px; height: 20px; border-radius: 50%;
      border: 2px solid #ddd; background: #fafaf8; cursor: pointer;
      flex-shrink: 0; transition: all 0.15s; padding: 0;
    }
    .drill-flag-btn:hover { border-color: #e74c3c; background: #fff0f0; }
    .drill-flag-btn.flagged { border-color: #e74c3c; background: #e74c3c; }

    /* ── 練習回饋 ── */
    .drill-feedback-section {
      margin-top: 18px; text-align: left;
      border-top: 1px solid #f0f0ee; padding-top: 14px;
    }
    .drill-feedback-label {
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; color: #bbb; margin-bottom: 8px;
    }
    .drill-feedback-area {
      width: 100%; border: 1.5px solid #e0e0de; border-radius: 10px;
      padding: 10px 14px; font-size: 0.88rem; font-family: inherit;
      resize: vertical; min-height: 80px; outline: none;
      background: #fafaf8; box-sizing: border-box;
    }
    .drill-feedback-area:focus { border-color: #2c2c2c; background: #fff; }
    .drill-feedback-save {
      background: #2c2c2c; color: #fff; border: none; border-radius: 8px;
      padding: 8px 16px; font-size: 0.82rem; font-weight: 600; cursor: pointer;
    }
.drill-flagged-list { margin-bottom: 12px; }
    .drill-flagged-item {
      font-size: 0.82rem; color: #666; padding: 5px 0;
      border-bottom: 1px solid #f0f0ee; line-height: 1.4;
    }

    /* toast */
    .toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      background: #2c2c2c; color: #fff; padding: 9px 20px; border-radius: 99px;
      font-size: 0.82rem; font-weight: 600; opacity: 0; pointer-events: none;
      transition: opacity 0.2s; white-space: nowrap;
    }
    .toast.show { opacity: 1; }

    /* ── 📊 能力地圖 ── */
    .topic-row { padding: 10px 0; border-bottom: 1px solid #f0f0ee; }
    .topic-row-top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .topic-name { flex: 1; font-size: 0.85rem; font-weight: 600; color: #333; min-width: 0; }
    .topic-sub  { font-size: 0.68rem; color: #aaa; margin-bottom: 4px; }
    .topic-pct  { font-size: 0.85rem; font-weight: 800; white-space: nowrap; min-width: 40px; text-align: right; flex-shrink: 0; }
    .topic-pct.weak { color: #c00; }
    .topic-pct.mid  { color: #c07000; }
    .topic-pct.ok   { color: #1a6b2a; }
    .topic-pct.none { color: #bbb; font-weight: 600; }
    .topic-bar-wrap { width: 50px; height: 5px; background: #eee; border-radius: 99px; overflow: hidden; flex-shrink: 0; }
    .topic-bar-fill { height: 100%; border-radius: 99px; }
    .topic-links { display: flex; gap: 5px; flex-wrap: wrap; }
    .topic-note-link {
      font-size: 0.68rem; color: #3b6fd4; text-decoration: none; white-space: nowrap;
      border: 1px solid #cdd9f5; border-radius: 6px; padding: 2px 7px; flex-shrink: 0;
    }
    .topic-note-link:hover { background: #f0f4ff; }
    .export-btn {
      background: #f0f4ff; color: #2a4fa0; border: 1.5px solid #cdd9f5; border-radius: 10px;
      padding: 9px 14px; font-size: 0.82rem; font-weight: 600; cursor: pointer; width: 100%;
      margin-top: 10px; font-family: inherit;
    }
    .export-hint { font-size: 0.7rem; color: #aaa; margin-top: 6px; line-height: 1.5; }
  </style>
</head>
<body>

<h1>法語抽考 · A1</h1>
<p class="meta">筆記 → <a href="french_notes.html">french_notes.html</a> &nbsp;·&nbsp; 表格填空 → <a href="table_drill.html">table_drill.html</a></p>

<div class="stat-bar" id="statBar">
  <span class="stat-chip fire" id="chipStreak">🔥 —</span>
  <span class="stat-chip star" id="chipXP">⭐ —</span>

  </button>

  <div style="font-size:2rem;margin-bottom:8px">⏸</div>

  <div style="font-size:0.8rem;color:#aaa;margin-bottom:20px">題目已鎖定，隨時繼續</div>
  <button onclick="togglePause()"
    style="background:#2c2c2c;color:#fff;border:none;border-radius:10px;padding:12px 32px;font-size:0.9rem;font-weight:700;cursor:pointer;font-family:inherit;">
    ▶ 繼續練習
  </button>

<script src="questions.js"></script>
<script>
// ── TTS ──────────────────────────────────────────────────────
let frVoice = null, activeTtsEl = null;
function initVoice() {
  const vs = speechSynthesis.getVoices().filter(v => v.lang.toLowerCase().startsWith('fr'));
  frVoice = vs.find(v => /am[eé]lie|thomas/i.test(v.name))
         || vs.find(v => /premium|enhanced|amélior|plus/i.test(v.name))
         || vs.find(v => v.localService === false)
         || vs.find(v => v.lang === 'fr-FR')
         || vs[0] || null;
}
speechSynthesis.onvoiceschanged = initVoice;
initVoice();
function ttsSpeak(text, btn) {
  speechSynthesis.cancel();
  if (activeTtsEl) activeTtsEl.classList.remove('playing');
  const cleaned = text.replace(/ \/ /g, ', ');
  const utt = new SpeechSynthesisUtterance(cleaned);
  utt.lang = 'fr-FR'; utt.rate = 0.7;
  if (frVoice) utt.voice = frVoice;
  activeTtsEl = btn;
  btn.classList.add('playing');
  utt.onend = utt.onerror = () => btn.classList.remove('playing');
  speechSynthesis.speak(utt);
}

// ── 比對 ─────────────────────────────────────────────────────
function norm(s) {
  return s.toLowerCase().trim().replace(/[.,!?'`'']/g, '').replace(/\s+/g, ' ').trim();
}
function isCorrect(input, answer) {
  const n = norm(input);
  return answer.split('|').some(a => norm(a) === n);
}

// ── SRS / localStorage ────────────────────────────────────────
function getSRS(id) {
  try { return JSON.parse(localStorage.getItem('clb7_' + id)) || { w:0, c:0, last:0 }; }
  catch(e) { return { w:0, c:0, last:0 }; }
}
function setSRS(id, data) {
  try { localStorage.setItem('clb7_' + id, JSON.stringify(data)); } catch(e) {}
}
function recordResult(q, ok) {
  const id = qId(q);
  const srs = getSRS(id);
  if (ok) srs.c++; else srs.w++;
  srs.last = Date.now();
  setSRS(id, srs);
  if (!ok) logWrong({ src:'quiz', q: q.q, a: q.a.split('|')[0], note: q.aNote || '', hint: q.hint || '', topic: q.topic });
}

// ── 心聲筆記（每題）資料層——renderCard 會用到，必須在主 script ──
const QNOTES_KEY = 'clb7_qnotes';
let lastOk = false;
function loadQNotes() { try { return JSON.parse(localStorage.getItem(QNOTES_KEY)) || []; } catch { return []; } }
function saveQNotesArr(d) { localStorage.setItem(QNOTES_KEY, JSON.stringify(d)); }

// ── 今日錯題本（dashboard 讀 clb7_wrong_log）──────────────────
function logWrong(entry) {
  try {
    const log = JSON.parse(localStorage.getItem('clb7_wrong_log')) || [];
    const d = new Date().toLocaleDateString('zh-TW', {year:'numeric',month:'2-digit',day:'2-digit'});
    const dup = log.find(e => e.d === d && e.src === entry.src && e.q === entry.q);
    if (dup) { dup.n = (dup.n||1) + 1; dup.t = Date.now(); }
    else log.push({ ...entry, d, t: Date.now(), n: 1 });
    localStorage.setItem('clb7_wrong_log', JSON.stringify(log.slice(-300)));
  } catch(e) {}
}
// ── 每日完成歷史（供 dashboard 統計「最常漏掉哪一步」）──────────
// key 例如 clb7_warmup_log / clb7_quiz_log：陣列存日期字串，每天最多一筆
function logDailyDone(key, dateStr) {
  try {
    const log = JSON.parse(localStorage.getItem(key)) || [];
    if (!log.includes(dateStr)) log.push(dateStr);
    localStorage.setItem(key, JSON.stringify(log.slice(-90)));
  } catch(e) {}
}
function unlogWrong(src, qText) {
  try {
    const log = JSON.parse(localStorage.getItem('clb7_wrong_log')) || [];
    const d = new Date().toLocaleDateString('zh-TW', {year:'numeric',month:'2-digit',day:'2-digit'});
    const idx = log.findIndex(e => e.d === d && e.src === src && e.q === qText);
    if (idx !== -1) {
      if ((log[idx].n||1) > 1) log[idx].n--; else log.splice(idx, 1);
      localStorage.setItem('clb7_wrong_log', JSON.stringify(log));
    }
  } catch(e) {}
}
function weakScore(q) {
  const { w, c } = getSRS(qId(q));
  if (w + c === 0) return 0;
  return w / (w + c);
}
function wrongCount(q) {
  return getSRS(qId(q)).w;
}
function isWeak(q) { return wrongCount(q) >= 2; }

// ── Game state (XP + streak) ──────────────────────────────────
function getGame() {
  try { return JSON.parse(localStorage.getItem('clb7_game')) || { xp:0, streak:0, lastDate:'' }; }
  catch(e) { return { xp:0, streak:0, lastDate:'' }; }
}
function saveGame(g) {
  try { localStorage.setItem('clb7_game', JSON.stringify(g)); } catch(e) {}
}
function touchStreak() {
  const g = getGame();
  const today = new Date().toISOString().slice(0, 10);
  if (g.lastDate === today) return;
  const yd = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
  g.streak = (g.lastDate === yd) ? g.streak + 1 : 1;
  g.lastDate = today;
  saveGame(g);
}
function addXP(n) {
  const g = getGame();
  g.xp += n;
  saveGame(g);
}
function renderStats() {
  const g = getGame();
  document.getElementById('chipStreak').textContent = `🔥 ${g.streak} 天連續`;
  document.getElementById('chipXP').textContent     = `⭐ ${g.xp} XP`;
  const wc = BANK.filter(q => isWeak(q)).length;
  document.getElementById('chipWeak').textContent   = `🎯 ${wc} 弱點`;
}

// ── 狀態 ──────────────────────────────────────────────────────
let queue = [];
let current = 0, scoreOk = 0, scoreNo = 0, answered = false;
let filterType = 'all', filterLesson = 'all', filterMode = 'normal';
let sessionXP = 0;
const SESSION_SIZE = 20;
const TYPE_LABEL = { fill:'動詞填空', trans:'翻譯', gender:'陰陽性', choose:'判斷' };
const TYPE_CLASS  = { fill:'type-fill', trans:'type-trans', gender:'type-gender', choose:'type-choose' };

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildLessonButtons() {
  const lessons = [...new Set(BANK.map(q => q.lesson))].sort((a,b) => a-b);
  const row = document.getElementById('lessonRow');
  row.innerHTML = `<button class="ctrl-btn active" id="btnLessonAll" onclick="setLesson('all')">全部課堂</button>`;
  lessons.forEach(l => {
    const label = l === 0 ? '🧩 框架庫' : `第${l}課`;
    row.innerHTML += `<button class="ctrl-btn" id="btnLesson${l}" onclick="setLesson(${l})">${label}</button>`;
  });
}

function setType(type) {
  filterType = type;
  ['all','fill','trans','gender','choose'].forEach(t => {
    const id = 'btn' + t.charAt(0).toUpperCase() + t.slice(1);
    document.getElementById(id)?.classList.toggle('active', t === type);
  });
  restart();
}

function setLesson(lesson) {
  filterLesson = lesson;
  document.querySelectorAll('#lessonRow .ctrl-btn').forEach(btn => btn.classList.remove('active'));
  const id = lesson === 'all' ? 'btnLessonAll' : `btnLesson${lesson}`;
  document.getElementById(id)?.classList.add('active');
  restart();
}

function setMode(mode) {
  filterMode = mode;
  ['normal','weak','mixed','drill'].forEach(m => {
    const el = document.getElementById('m' + m.charAt(0).toUpperCase() + m.slice(1));
    if (el) el.classList.toggle('active', m === mode);
  });
  const isDrill = mode === 'drill';
  ['typeRow','lessonRow','progressText','progressBarWrap'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.display = isDrill ? 'none' : '';
  });
  if (isDrill) startDrill();
  else restart();
}

function getPool() {
  let pool = BANK;
  if (filterType   !== 'all') pool = pool.filter(q => q.type   === filterType);
  if (filterLesson !== 'all') pool = pool.filter(q => q.lesson === filterLesson);

  if (filterMode === 'weak') {
    const weak = pool.filter(q => isWeak(q));
    return weak.length > 0 ? weak : pool; // fallback to all if no weak yet
  }
  if (filterMode === 'mixed') {
    const weak = pool.filter(q => isWeak(q));
    const rest = pool.filter(q => !isWeak(q));
    // Sort weak by worst first, take up to half the pool
    const weakSorted = weak.sort((a, b) => weakScore(b) - weakScore(a));
    const halfN = Math.ceil(pool.length / 2);
    const weakPart = weakSorted.slice(0, halfN);
    const restPart = shuffle(rest).slice(0, pool.length - weakPart.length);
    return shuffle([...weakPart, ...restPart]);
  }
  return pool;
}

function buildSession(pool) {
  if (pool.length <= SESSION_SIZE) return shuffle(pool);
  // 分層抽樣：按 type 比例，確保每種都有機會出現
  const types = [...new Set(pool.map(q => q.type))];
  const slots = {};
  let filled = 0;
  // 先給每種 type 至少 1 個保底位
  types.forEach(t => { slots[t] = 1; filled += 1; });
  // 剩餘名額按題量比例分配
  const remain = SESSION_SIZE - filled;
  types.forEach(t => {
    const extra = Math.floor((pool.filter(q => q.type === t).length / pool.length) * remain);
    slots[t] += extra;
    filled += extra;
  });
  // 補齊剩餘零頭（可能因 floor 少幾個）
  let leftover = SESSION_SIZE - filled;
  for (const t of shuffle(types)) {
    if (leftover <= 0) break;
    slots[t]++; leftover--;
  }
  // 從各 type 中隨機取對應數量
  const result = [];
  types.forEach(t => {
    const group = shuffle(pool.filter(q => q.type === t));
    result.push(...group.slice(0, slots[t]));
  });
  return shuffle(result);
}

const FILTER_IDS = ['mode-row', 'typeRow', 'lessonRow'];
function lockFilters() {
  document.querySelector('.mode-row')?.style.setProperty('pointer-events','none');
  document.querySelector('.mode-row')?.style.setProperty('opacity','0.35');
  ['typeRow','lessonRow'].forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.style.pointerEvents = 'none'; el.style.opacity = '0.35'; }
  });
}
function unlockFilters() {
  document.querySelector('.mode-row')?.style.removeProperty('pointer-events');
  document.querySelector('.mode-row')?.style.removeProperty('opacity');
  ['typeRow','lessonRow'].forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.style.pointerEvents = ''; el.style.opacity = ''; }
  });
}

function restart() {
  queue = buildSession(getPool());
  current = 0; scoreOk = 0; scoreNo = 0; answered = false; sessionXP = 0;
  updateProgress();
  renderCard();
}

function updateProgress() {
  const total = queue.length, done = current;
  const remaining = total - done;
  document.getElementById('progressLabel').textContent =
    total === 0 ? '沒有題目' : `第 ${Math.min(done + 1, total)} 題 / 共 ${total} 題`;
  document.getElementById('progressFill').style.width =
    total === 0 ? '0%' : `${(done / total) * 100}%`;
  document.getElementById('scoreOk').textContent = `✓ ${scoreOk}`;
  document.getElementById('scoreNo').textContent = `✗ ${scoreNo}`;
}

function renderCard() {
  const area = document.getElementById('quizArea');

  if (current >= queue.length) { showDoneCard(); return; }
  lockFilters();

  const q = queue[current];
  const isReviewQ = q._review === true;
  answered = false;
  const displayA = q.a.split('|')[0];
  const wc = wrongCount(q);

  area.innerHTML = `
    <div class="card">
      <div class="card-top">
        <div class="qtype ${TYPE_CLASS[q.type]}">${TYPE_LABEL[q.type]}</div>
        <div style="display:flex;gap:6px;align-items:center">
          ${wc >= 2 ? `<span class="weak-indicator">⚠ 錯過 ${wc} 次</span>` : ''}
          ${isReviewQ ? `<span class="review-badge">🔁 複習</span>` : ''}
        </div>
      </div>
      <div class="question">${q.q}</div>
      ${q.hint ? `
      <button class="hint-btn" id="hintBtn" onclick="revealHint()">💡 提示</button>
      <div class="hint" id="hintBox" style="display:none">提示：${q.hint}</div>` : ''}
      ${q.opts ? `
      <div class="drill-opts" id="bankOpts">
        ${q.opts.map((opt,i) => `
          <button class="drill-opt bank-opt" id="bopt${i}"
            data-opt="${opt.replace(/"/g,'&quot;').replace(/'/g,'&#39;')}"
            onclick="pickBankOpt(this, this.dataset.opt)">${opt}</button>`).join('')}
      </div>` : `
      <div class="input-row">
        <input class="answer-input" id="ansInput" type="text"
               placeholder="輸入答案，按 Enter 確認" autocomplete="off" autocorrect="off"
               spellcheck="false">
        <button class="btn-submit" id="btnSubmit" onclick="checkAnswer()">確認</button>
      </div>`}
      <div class="result" id="result">
        <div class="result-banner" id="resultBanner">
          <span id="resultText"></span>
          <button class="tts-btn" id="ttsBtn" title="播放發音">🔊</button>
        </div>
        <div class="correct-ans" id="correctAns" style="display:none">
          <div class="label">正確答案</div>
          <div class="fr-ans">${displayA}</div>
          ${q.aNote ? `<div class="ans-note">📌 ${q.aNote}</div>` : ''}
          <div style="margin-top:6px">
            ${(() => {
              const ta = q.topic && TOPIC_NOTE_ANCHORS[q.topic];
              const anchor = ta || (q.lesson === 0 ? 'frame-lib' : 'lesson-' + q.lesson);
              const lbl = ta ? (TOPIC_LABELS[q.topic] || q.topic) : (q.lesson === 0 ? '框架庫' : `第${q.lesson}課`);
              return `<a class="note-link" href="french_notes.html#${anchor}" target="_blank">📖 複習：${lbl}</a>`;
            })()}
          </div>
        </div>
        ${(() => {
          const existing = loadQNotes().find(n => n.qid === qId(q));
          return `<div class="qvoice-row">
            <button class="btn-voice${existing ? ' has-note' : ''}" id="btnVoice" onclick="toggleQVoice()">${existing ? '💬 已記心聲' : '💬 加心聲'}</button>
            ${existing ? `<span class="qvoice-preview">${existing.note.slice(0,28)}${existing.note.length > 28 ? '…' : ''}</span>` : ''}
          </div>
          <div class="qvoice-area" id="qvoiceArea">
            <textarea id="qvoiceTxt" placeholder="這題哪裡卡？老師說了什麼？想到什麼…">${existing ? existing.note : ''}</textarea>
            <div class="voice-btns">
              <button class="voice-save-btn" onclick="saveQVoice()">存下來</button>
              <button class="voice-cancel-btn" onclick="document.getElementById('qvoiceArea').style.display='none'">取消</button>
            </div>
          </div>`;
        })()}
        <div class="btn-row">
          ${q.askClaude ? `<button class="btn btn-claude" onclick="askClaude()">問 Claude</button>` : ''}
          <button class="btn btn-override" id="btnOverride" onclick="overrideCorrect()" style="display:none">其實對 ✓</button>
          <button class="btn btn-next" onclick="nextQ()">下一題 →</button>
        </div>
      </div>
    </div>`;

  const input = document.getElementById('ansInput');
  if (input) {
    let composing = false;
    input.addEventListener('compositionstart', () => composing = true);
    input.addEventListener('compositionend',   () => composing = false);
    input.addEventListener('keydown', e => { if (e.key === 'Enter' && !composing) checkAnswer(); });
    input.focus();
  }

  const ttsBtn = document.getElementById('ttsBtn');
  if (ttsBtn) {
    const frText = displayA.replace(/（.*?）/g, '').trim();
    ttsBtn.addEventListener('click', e => { e.stopPropagation(); ttsSpeak(frText, ttsBtn); });
  }
}

function checkAnswer() {
  if (answered) return;
  const input = document.getElementById('ansInput');
  const val = input.value.trim();
  if (!val) return;

  answered = true;
  const q = queue[current];
  const ok = isCorrect(val, q.a);
  lastOk = ok;

  input.disabled = true;
  document.getElementById('btnSubmit').disabled = true;
  input.classList.add(ok ? 'correct' : 'wrong');

  const banner = document.getElementById('resultBanner');
  banner.className = 'result-banner ' + (ok ? 'ok' : 'no');
  document.getElementById('resultText').textContent = ok ? '✓ 正確！' : '✗ 再想想';
  if (!ok) document.getElementById('correctAns').style.display = 'block';
  document.getElementById('result').classList.add('show');

  // SRS tracking
  recordResult(q, ok);

  if (ok) {
    scoreOk++;
    const xp = q._review ? 5 : 10;
    sessionXP += xp;
    addXP(xp);
  } else {
    scoreNo++;
    // 答錯 → 直接加到隊列尾巴，直到答對為止
    queue.push({ ...q, _review: true });
    // Show override button
    const ob = document.getElementById('btnOverride');
    if (ob) ob.style.display = '';
  }

  updateProgress();
  renderStats();
}

function overrideCorrect() {
  const q = queue[current];
  // 修正 SRS：撤銷一次錯誤，補記一次正確
  const id = qId(q);
  const srs = getSRS(id);
  if (srs.w > 0) srs.w--;
  srs.c++;
  setSRS(id, srs);
  unlogWrong('quiz', q.q);   // 錯題本同步移除
  // 修正本次分數
  scoreOk++; scoreNo--;
  const xp = q._review ? 5 : 10;
  sessionXP += xp;
  addXP(xp);
  // 從後方隊列移除（答對了，不用再考一次）
  const next = queue.findIndex((r, i) => i > current && r.q === q.q && r._review);
  if (next !== -1) queue.splice(next, 1);
  // 更新 UI
  const inp = document.getElementById('ansInput');
  if (inp) { inp.classList.remove('wrong'); inp.classList.add('correct'); }
  const banner = document.getElementById('resultBanner');
  if (banner) banner.className = 'result-banner ok';
  const rt = document.getElementById('resultText');
  if (rt) rt.textContent = '✓ 已更正為正確';
  const ca = document.getElementById('correctAns');
  if (ca) ca.style.display = 'none';
  document.getElementById('btnOverride').style.display = 'none';
  updateProgress();
  renderStats();
}

function revealHint() {
  const btn = document.getElementById('hintBtn');
  const box = document.getElementById('hintBox');
  if (btn) btn.style.display = 'none';
  if (box) box.style.display = '';
}

function pickBankOpt(btn, chosen) {
  if (answered) return;
  answered = true;
  const q = queue[current];
  const ok = isCorrect(chosen, q.a);
  lastOk = ok;

  document.querySelectorAll('.bank-opt').forEach(b => b.disabled = true);

  if (ok) {
    btn.classList.add('correct');
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.bank-opt').forEach(b => {
      if (isCorrect(b.dataset.opt, q.a)) b.classList.add('reveal');
    });
  }

  const banner = document.getElementById('resultBanner');
  banner.className = 'result-banner ' + (ok ? 'ok' : 'no');
  document.getElementById('resultText').textContent = ok ? '✓ 正確！' : '✗ 再想想';
  if (!ok) document.getElementById('correctAns').style.display = 'block';
  document.getElementById('result').classList.add('show');

  recordResult(q, ok);

  if (ok) {
    scoreOk++;
    const xp = q._review ? 5 : 10;
    sessionXP += xp;
    addXP(xp);
  } else {

    queue.push({ ...q, _review: true });
    const ob = document.getElementById('btnOverride');

  updateProgress();
  renderStats();
}

// ── Drill SRS（常錯多出現）──────────────────────────────────────
function getDrillSRS(q) {
  try { return JSON.parse(localStorage.getItem('clb7_'+drillQId(q))) || {w:0,c:0}; }
  catch(e) { return {w:0,c:0}; }
}
function recordDrillResult(q, ok) {
  const srs = getDrillSRS(q);
  if (ok) srs.c++; else srs.w++;
  try { localStorage.setItem('clb7_'+drillQId(q), JSON.stringify(srs)); } catch(e) {}
}
// 加權取樣：答錯越多次，出現機率越高（最多 4 倍）
function weightedSample(arr, n) {
  const pool = [];
  arr.forEach(q => {
    const w = Math.min(getDrillSRS(q).w, 3);
    for (let i = 0; i < 1 + w; i++) pool.push(q);
  });
  const shuffled = shuffle(pool);
  const seen = new Set();
  const result = [];
  for (const q of shuffled) {
    if (!seen.has(q.q)) { seen.add(q.q); result.push({...q}); }
    if (result.length >= n) break;
  }
  if (result.length < n) {
    for (const q of shuffle(arr)) {
      if (!seen.has(q.q)) { seen.add(q.q); result.push({...q}); }
      if (result.length >= n) break;
    }
  }
  return result;
}

// ── Drill 疑慮旗標 ───────────────────────────────────────────────
function getDrillFlags() {
  try { return new Set(JSON.parse(localStorage.getItem('clb7_drill_flags')) || []); }
  catch(e) { return new Set(); }
}
function saveDrillFlags(flags) {
  try { localStorage.setItem('clb7_drill_flags', JSON.stringify([...flags])); } catch(e) {}
}
function toggleDrillFlag() {
  const q = drillQueue[drillIdx];
  if (!q) return;
  const qid = drillQId(q);
  const flags = getDrillFlags();
  if (flags.has(qid)) flags.delete(qid); else flags.add(qid);
  saveDrillFlags(flags);
  const btn = document.getElementById('drillFlagBtn');
  if (btn) {
    btn.classList.toggle('flagged', flags.has(qid));
    btn.title = flags.has(qid) ? '已標記疑慮（再按取消）' : '標記此題有疑慮';
  }
}

// ── Drill 練習回饋 ───────────────────────────────────────────────
function saveDrillFeedback() {
  const text = (document.getElementById('drillFeedbackText') || {}).value || '';
  if (!text.trim()) { showToast('請先輸入回饋內容'); return; }
  const sessions = JSON.parse(localStorage.getItem('clb7_drill_sessions') || '[]');
  const flags = getDrillFlags();
  sessions.unshift({
    date: new Date().toISOString(),
    mainScore: drillMainScore, mainTotal: drillMainTotal,
    feedback: text.trim(), flagged: [...flags]
  });
  if (sessions.length > 50) sessions.length = 50;
  localStorage.setItem('clb7_drill_sessions', JSON.stringify(sessions));
  document.getElementById('drillFeedbackText').value = '';
  showToast('回饋已儲存！');

// ── Drill 狀態 ──────────────────────────────────────────────────
let drillQueue = [], drillIdx = 0, drillScore = 0, drillWrong = [];
let drillPhase = 'main'; // 'main' | 'review'
let drillMainScore = 0, drillMainTotal = 20;
let drillReviewWrong = []; // 當前複習子輪的錯題，累積到子輪結束才重考
const DRILL_TOTAL = 20;

function startDrill() {
  drillQueue = weightedSample(AGREE_BANK, DRILL_TOTAL);
  drillIdx = 0; drillScore = 0; drillWrong = [];
  drillPhase = 'main'; drillMainScore = 0; drillMainTotal = DRILL_TOTAL;
  drillReviewWrong = [];
  renderDrill();
}

function renderDrill() {
  const area = document.getElementById('quizArea');

  if (drillIdx >= drillQueue.length) {
    if (drillPhase === 'main') {
      drillMainScore = drillScore;
      drillMainTotal = drillQueue.length;
      if (drillWrong.length > 0) {
        drillPhase = 'review';
        drillQueue = shuffle(drillWrong).map(q => ({...q}));
        drillWrong = []; drillIdx = 0; drillScore = 0; drillReviewWrong = [];
        // fall through to render first review question
      } else { renderDrillDone(); return; }
    } else {
      // 複習子輪結束：有新錯題就再開一輪，否則完成
      if (drillReviewWrong.length > 0) {
        drillQueue = shuffle(drillReviewWrong).map(q => ({...q}));
        drillReviewWrong = []; drillIdx = 0; drillScore = 0;
        // fall through to render first question of new sub-round
      } else { renderDrillDone(); return; }
    }
  }

  const q = drillQueue[drillIdx];
  const inReview = drillPhase === 'review';
  const flags = getDrillFlags();
  const isFlagged = flags.has(drillQId(q));
  const pct = Math.round((drillIdx / drillQueue.length) * 100);

  const topLabel   = inReview ? `🔁 複習 ${drillIdx + 1}/${drillQueue.length}` : `⚡ ${drillIdx + 1}/20`;
  const scoreLabel = inReview ? `主輪 ${drillMainScore}/${drillMainTotal}` : `${drillScore} ✓`;
  const badge = q.chain ? '<div class="drill-chain-badge">🔗 情境推理</div>'
              : q.hard  ? '<div class="drill-hard-badge">🔥 進階</div>' : '';
  const reviewBanner = inReview ? `
    <div class="drill-review-banner">🔁 複習輪 &nbsp;·&nbsp; 主輪得分 ${drillMainScore} / ${drillMainTotal}</div>` : '';

  area.innerHTML = `
    <div class="drill-card">
      <div class="drill-top">
        <div class="drill-count">${topLabel}</div>
        <div class="drill-pbar"><div class="drill-pbar-fill" style="width:${pct}%"></div></div>
        <div class="drill-count">${scoreLabel}</div>
        <button class="drill-flag-btn${isFlagged ? ' flagged' : ''}" id="drillFlagBtn"
          onclick="toggleDrillFlag()" title="${isFlagged ? '已標記疑慮（再按取消）' : '標記此題有疑慮'}"></button>
      </div>
      ${reviewBanner}${badge}
      <div class="drill-q" style="white-space:pre-line">${q.q}</div>
      <div class="drill-opts" id="drillOpts">
        ${q.opts.map((opt,i) => `
          <button class="drill-opt" id="dopt${i}" data-opt="${opt.replace(/"/g,'&quot;').replace(/'/g,'&#39;')}"
            onclick="pickOpt(this, this.dataset.opt)">${opt}</button>`).join('')}
      </div>
      <div class="drill-note" id="drillNote"></div>
      <div id="drillOverrideWrap" style="display:none">
        <button class="drill-override-btn" onclick="overrideDrillCorrect()">其實對 ✓</button>
      </div>
      <button class="drill-next" id="drillNext" onclick="nextDrillQ()">下一題 →</button>
    </div>`;
}

function pickOpt(btn, chosen) {
  const q = drillQueue[drillIdx];
  document.querySelectorAll('.drill-opt').forEach(b => b.disabled = true);

  const correct = chosen.trim() === q.a.trim();
  recordDrillResult(q, correct);

  if (correct) {
    drillScore++;
    btn.classList.add('correct');
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.drill-opt').forEach(b => {
      if (b.textContent.trim() === q.a.trim()) b.classList.add('reveal');
    });
    if (drillPhase === 'main') {
      if (!drillWrong.find(x => x.q === q.q)) drillWrong.push({...q});
    } else {
      // 複習輪：只有一題的子輪答錯 → 原題重試（下一題按鈕不推進 drillIdx）
      // 多題子輪答錯 → 累積到子輪結束後再考
      if (drillQueue.length > 1) {
        if (!drillReviewWrong.find(x => x.q === q.q)) drillReviewWrong.push({...q});
      }
    }
    // 顯示「其實對」按鈕
    const ow = document.getElementById('drillOverrideWrap');
    if (ow) ow.style.display = '';
  }

  const note = document.getElementById('drillNote');
  note.textContent = q.note;
  note.className = 'drill-note show ' + (correct ? 'ok' : 'bad');

  const nextBtn = document.getElementById('drillNext');
  if (nextBtn) {
    // 只有一題的複習子輪答錯：按鈕重試而非推進
    if (!correct && drillPhase === 'review' && drillQueue.length === 1) {
      nextBtn.textContent = '↺ 重試此題';
      nextBtn.onclick = () => renderDrill();
    } else {
      nextBtn.textContent = '下一題 →';
      nextBtn.onclick = nextDrillQ;
    }
    nextBtn.classList.add('show');
  }
}

function overrideDrillCorrect() {
  const q = drillQueue[drillIdx];
  // 修正 drill SRS：撤銷一次錯誤
  const srs = getDrillSRS(q);
  if (srs.w > 0) srs.w--;
  srs.c++;
  try { localStorage.setItem('clb7_'+drillQId(q), JSON.stringify(srs)); } catch(e) {}
  // 修正分數
  drillScore++;
  // 從錯題隊列移除
  drillWrong = drillWrong.filter(x => x.q !== q.q);
  drillReviewWrong = drillReviewWrong.filter(x => x.q !== q.q);
  // 更新 UI
  document.getElementById('drillOverrideWrap').style.display = 'none';
  const note = document.getElementById('drillNote');
  if (note) note.className = 'drill-note show ok';
  const nextBtn = document.getElementById('drillNext');
  if (nextBtn) { nextBtn.textContent = '下一題 →'; nextBtn.onclick = nextDrillQ; }
}

function nextDrillQ() { drillIdx++; renderDrill(); }

function renderDrillDone() {
  const pct = drillMainTotal > 0 ? Math.round(drillMainScore / drillMainTotal * 100) : 100;
  const hadReview = drillPhase === 'review';
  const emoji = pct === 100 ? '🎯' : pct >= 80 ? '💪' : pct >= 60 ? '📖' : '🔁';
  const msg   = pct === 100 ? '完美！一題不差！'
              : hadReview   ? '錯題全清，加油！'
              : pct >= 80   ? '很不錯，繼續練！' : '再多跑幾輪！';

  const flags = getDrillFlags();
  const flaggedHtml = flags.size > 0
    ? `<div class="drill-feedback-label" style="margin-top:16px">⚑ 標記疑慮的題目（${flags.size} 題）</div>
       <div class="drill-flagged-list">${
         [...flags].map(id => {
           const fq = AGREE_BANK.find(x => drillQId(x) === id);
           return fq ? `<div class="drill-flagged-item">❓ ${fq.q}</div>` : '';
         }).join('')
       }</div>` : '';

  document.getElementById('quizArea').innerHTML = `
    <div class="drill-done">
      <h2>${emoji} 完成！</h2>
      <div class="drill-done-big">${drillMainScore} / ${drillMainTotal}</div>
      <div class="drill-done-pct">答對率 ${pct}%${hadReview ? '　（已完成錯題複習）' : ''}</div>
      <div class="drill-done-msg">${msg}</div>
      ${flaggedHtml}
      <div class="drill-feedback-section">
        <div class="drill-feedback-label">這次練習的筆記 / 回饋</div>
        <textarea class="drill-feedback-area" id="drillFeedbackText"
          placeholder="記錄目標、哪裡卡住、下次想練什麼..."></textarea>
        <button class="drill-feedback-save" style="margin-top:8px" onclick="saveDrillFeedback()">儲存回饋</button>
      </div>
      <button class="drill-retry" onclick="startDrill()" style="margin-top:16px">🔄 新的 20 題</button>
      <button class="drill-back" style="border-color:#9b59b6;color:#7b39a6;margin-top:8px"
        onclick="renderDrillWeakAnalysis()">📊 弱點分析</button>
      <button class="drill-back"  onclick="setMode('normal')">← 離開</button>
    </div>`;
}

// ── 弱點分析 ─────────────────────────────────────────────────────
function renderDrillWeakAnalysis() {
  const stats = [];
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (!key.startsWith('clb7_dq_')) continue;
    try {
      const data = JSON.parse(localStorage.getItem(key));
      if (!data || (data.w === 0 && data.c === 0)) continue;
      const qid = key.replace('clb7_', '');
      const q = AGREE_BANK.find(x => drillQId(x) === qid);
      if (q) stats.push({ q: q.q, a: q.a, note: q.note || '', w: data.w, c: data.c, total: data.w + data.c });
    } catch(e) {}
  }

  if (stats.length === 0) {
    document.getElementById('quizArea').innerHTML = `
      <div class="drill-done"><h2>📊 弱點分析</h2>
        <div class="drill-done-msg" style="margin-bottom:20px">還沒有足夠的答題紀錄，多練幾輪再來看！</div>
        <button class="drill-back" onclick="renderDrillDone()">← 返回</button>
      </div>`;
    return;
  }

  stats.sort((a, b) => b.w - a.w || b.total - a.total);
  const totalQ = stats.length;
  const totalAttempts = stats.reduce((s, x) => s + x.total, 0);
  const totalWrong   = stats.reduce((s, x) => s + x.w, 0);
  const overallPct   = Math.round((totalAttempts - totalWrong) / totalAttempts * 100);

  const sessions = JSON.parse(localStorage.getItem('clb7_drill_sessions') || '[]');
  const recentSess  = sessions.slice(0, 5);
  const sessionHtml = recentSess.length > 0
    ? recentSess.map(s => {
        const d = new Date(s.date);
        const label = `${d.getMonth()+1}/${d.getDate()} ${s.mainScore}/${s.mainTotal}`;
        const fb = s.feedback ? ' — ' + s.feedback.slice(0, 35) + (s.feedback.length > 35 ? '…' : '') : '';
        return `<div class="drill-flagged-item">${label}${fb}</div>`;
      }).join('')
    : '<div class="drill-flagged-item" style="color:#bbb">無回饋記錄</div>';

  const top = stats.slice(0, 15);
  const topHtml = top.map(s => {
    const ep = Math.round(s.w / s.total * 100);
    return `<div class="drill-flagged-item">
      <span style="color:#e74c3c;font-weight:700;width:36px;display:inline-block">錯${s.w}</span>
      <span style="color:#bbb;font-size:0.7rem;margin-right:8px">${ep}%</span>${s.q}
    </div>`;
  }).join('');

  const flags = getDrillFlags();
  const flagLines = flags.size > 0
    ? [...flags].map(id => { const fq = AGREE_BANK.find(x => drillQId(x) === id); return fq ? `⚑ ${fq.q}` : ''; }).filter(Boolean)
    : ['（無旗標）'];

  const copyText = [
    `=== 弱點分析 ${new Date().toLocaleDateString('zh-TW')} ===`,
    `練習過 ${totalQ} 題，共答 ${totalAttempts} 次，整體答對率 ${overallPct}%`,
    '',
    '【錯最多的題 Top 15】',
    ...top.map((s, i) => `${i+1}. 錯${s.w}次（${Math.round(s.w/s.total*100)}%）　${s.q}　→ ${s.a}`),
    '',
    '【最近練習回饋】',
    ...recentSess.map(s => {
      const d = new Date(s.date);
      return `${d.getMonth()+1}/${d.getDate()} ${s.mainScore}/${s.mainTotal} — ${s.feedback || '（無回饋）'}`;
    }),
    '',
    '【被旗標的疑慮題目】',
    ...flagLines
  ].join('\n');

  document.getElementById('quizArea').innerHTML = `
    <div class="drill-done" style="text-align:left">
      <h2 style="text-align:center">📊 弱點分析</h2>
      <div style="text-align:center;margin-bottom:16px">
        <div class="drill-done-big" style="font-size:2.2rem">${overallPct}%</div>
        <div class="drill-done-pct">整體答對率 &nbsp;·&nbsp; ${totalQ} 題已練習 &nbsp;·&nbsp; 共 ${totalAttempts} 次</div>
      </div>
      <div class="drill-feedback-label">錯最多的題目（Top 15）</div>
      <div class="drill-flagged-list">${topHtml}</div>
      <div class="drill-feedback-label" style="margin-top:14px">最近練習回饋</div>
      <div class="drill-flagged-list">${sessionHtml}</div>
      <div class="drill-feedback-label" style="margin-top:14px">複製給 Claude 分析</div>
      <textarea class="drill-feedback-area" id="analysisText"
        style="min-height:120px;font-size:0.75rem;font-family:monospace" readonly>${copyText}</textarea>
      <button class="drill-feedback-save" style="margin-top:8px" onclick="
        const ta = document.getElementById('analysisText');
        ta.select(); ta.setSelectionRange(0,99999);
        try { document.execCommand('copy'); showToast('已複製！貼給 Claude 分析'); }
        catch(e) { showToast('請手動全選複製'); }
      ">📋 複製全部</button>
      <button class="drill-retry" onclick="renderDrillDone()" style="margin-top:12px">← 返回</button>
    </div>`;
}

function getOverallPct() {
  let w = 0, c = 0;
  BANK.forEach(q => { const s = getSRS(qId(q)); w += s.w; c += s.c; });
  const total = w + c;
  return total > 0 ? Math.round(c / total * 100) : null;
}

// ⚠️ 每日 topic 快照用 clb7_topic_snapshots；clb7_snapshots 屬於 dashboard 週趨勢（{week:...} 格式），
//    兩者格式不同，混在同一個 key 會讓 dashboard 載入時整頁掛掉
function migrateSnapshots() {
  try {
    const raw = JSON.parse(localStorage.getItem('clb7_snapshots')) || [];
    const topicSnaps = raw.filter(s => s && !s.week && s.date);
    if (!topicSnaps.length) return;
    const existing = JSON.parse(localStorage.getItem('clb7_topic_snapshots')) || [];
    const dates = new Set(existing.map(s => s.date));
    topicSnaps.forEach(s => { if (!dates.has(s.date)) existing.push(s); });
    existing.sort((a,b) => a.date.localeCompare(b.date));
    localStorage.setItem('clb7_topic_snapshots', JSON.stringify(existing.slice(-60)));
    localStorage.setItem('clb7_snapshots', JSON.stringify(raw.filter(s => s && s.week)));
  } catch(e) {}
}

function saveSnapshot() {
  // 本地日期，不用 toISOString()（UTC 會讓早上的快照記成前一天）
  const d = new Date();
  const today = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const snaps = JSON.parse(localStorage.getItem('clb7_topic_snapshots') || '[]');
  if (snaps.length && snaps[snaps.length - 1].date === today) return;
  const topics = computeTopicStats().map(s => ({ topic: s.topic, pct: s.pct, attempts: s.attempts }));
  snaps.push({ date: today, overallPct: getOverallPct(), topics });
  if (snaps.length > 60) snaps.shift();
  localStorage.setItem('clb7_topic_snapshots', JSON.stringify(snaps));
}

function computeTopicStats() {
  const byTopic = {};
  BANK.forEach(q => {
    const t = q.topic || 'misc';
    if (!byTopic[t]) byTopic[t] = { w:0, c:0, lessons:new Set(), total:0 };
    const srs = getSRS(qId(q));
    byTopic[t].w += srs.w;
    byTopic[t].c += srs.c;
    byTopic[t].lessons.add(q.lesson);
    byTopic[t].total++;
  });
  AGREE_BANK.forEach(q => {
    if (!q.topic) return;
    const t = q.topic;
    if (!byTopic[t]) byTopic[t] = { w:0, c:0, lessons:new Set(), total:0 };
    const srs = getDrillSRS(q);
    byTopic[t].w += srs.w;
    byTopic[t].c += srs.c;
    byTopic[t].total++;
  });
  return Object.entries(byTopic).map(([topic, d]) => {
    const attempts = d.w + d.c;
    const pct = attempts > 0 ? Math.round((d.c / attempts) * 100) : null;
    return {
      topic, pct, attempts, totalQ: d.total,
      lessons: [...d.lessons].sort((a,b)=>a-b),
    };
  }).sort((a, b) => {
    // 沒練過的排最後；有練過的依正確率由低到高（最弱排前面）
    if (a.pct === null && b.pct === null) return 0;
    if (a.pct === null) return 1;
    if (b.pct === null) return -1;
    return a.pct - b.pct;
  });
}

function buildCurveChart(snaps) {
  const pts = snaps.filter(s => s.overallPct !== null);
  if (pts.length < 2) return '<div style="font-size:0.75rem;color:#bbb;text-align:center;padding:16px 0">資料不足（需至少 2 天練習紀錄）</div>';
  const W = 400, H = 64, PAD = 8;
  const vals = pts.map(s => s.overallPct);
  const min = Math.max(0, Math.min(...vals) - 5);
  const max = Math.min(100, Math.max(...vals) + 5);
  const xStep = (W - PAD * 2) / (pts.length - 1);
  const toX = i => PAD + i * xStep;
  const toY = v => H - PAD - ((v - min) / (max - min || 1)) * (H - PAD * 2);
  const pathD = pts.map((s, i) => `${i === 0 ? 'M' : 'L'}${toX(i).toFixed(1)},${toY(s.overallPct).toFixed(1)}`).join(' ');
  const dots = pts.map((s, i) => `<circle cx="${toX(i).toFixed(1)}" cy="${toY(s.overallPct).toFixed(1)}" r="3" fill="#3b6fd4"/><title>${s.date}: ${s.overallPct}%</title>`).join('');
  const firstDate = pts[0].date.slice(5);
  const lastDate  = pts[pts.length-1].date.slice(5);
  const trend = vals[vals.length-1] - vals[0];
  const trendStr = trend > 0 ? `↑ +${trend}%` : trend < 0 ? `↓ ${trend}%` : '持平';
  const trendColor = trend > 0 ? '#2a7a4f' : trend < 0 ? '#c00' : '#aaa';
  return `
    <svg class="curve-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <line x1="${PAD}" y1="${toY(60).toFixed(1)}" x2="${W-PAD}" y2="${toY(60).toFixed(1)}" stroke="#f0c080" stroke-width="1" stroke-dasharray="3,3"/>
      <path d="${pathD}" fill="none" stroke="#3b6fd4" stroke-width="2" stroke-linejoin="round"/>
      ${dots}
      <text x="${PAD}" y="${H-1}" font-size="9" fill="#bbb">${firstDate}</text>
      <text x="${W-PAD}" y="${H-1}" font-size="9" fill="#bbb" text-anchor="end">${lastDate}</text>
    </svg>
    <div style="font-size:0.72rem;color:${trendColor};font-weight:700;text-align:right">${trendStr}（${pts.length} 天紀錄）</div>`;
}

    if (s.pct !== null && prevSnap && prevMap[s.topic] !== undefined && prevMap[s.topic] !== null) {

      if (diff > 0) deltaHtml = `<span class="topic-delta up">↑${diff}%</span>`;

function exportAllData() {
  const data = {
    exportedAt: new Date().toISOString(),
    srs: {}, drillSrs: {}, game: null, drillSessions: null, drillFlags: null,
  };
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (!key || !key.startsWith('clb7_')) continue;
    let val;
    try { val = JSON.parse(localStorage.getItem(key)); } catch(e) { val = localStorage.getItem(key); }
    if (key.startsWith('clb7_dq_')) data.drillSrs[key] = val;
    else if (key.startsWith('clb7_q_')) data.srs[key] = val;
    else if (key === 'clb7_game') data.game = val;
    else if (key === 'clb7_drill_sessions') data.drillSessions = val;
    else if (key === 'clb7_drill_flags') data.drillFlags = val;
    else data[key] = val;
  }
  // 附上每個 topic 目前的統計快照，方便不寫程式就能看到摘要
  data.topicSummary = computeTopicStats().map(s => ({
    topic: s.topic, label: TOPIC_LABELS[s.topic] || s.topic,
    pct: s.pct, attempts: s.attempts, totalQuestions: s.totalQ, lessons: s.lessons,
  }));

  const stamp = data.exportedAt.replace(/[:.]/g, '-');
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `clb7_export_${stamp}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('已下載！把檔案傳給 Claude 分析進度');
}

// ── 自動計時：練習時間自動記入 clb7_tracker（type: auto-quiz）────
// 頁面可見＋60 秒內有操作才累計；切走/關頁自動寫入（≥30 秒才記）
(function(){
  const TYPE='quiz', TICK=15, IDLE_MS=60000;
  let acc=0, lastAct=Date.now();
  ['keydown','pointerdown','scroll','touchstart'].forEach(ev =>
    document.addEventListener(ev, () => lastAct=Date.now(), {passive:true}));
  setInterval(() => {
    if (document.visibilityState==='visible' && Date.now()-lastAct < IDLE_MS) acc += TICK;
  }, TICK*1000);
  function flushTime(){
    if (window.ClbSession && window.ClbSession.isActive()) { acc = 0; return; } // session 進行中由 session_timer 統一計時，避免雙重計入
    if (acc < 30) return;
    try {
      const d = new Date();
      const data = JSON.parse(localStorage.getItem('clb7_tracker')) || [];
      data.push({ ts: Date.now(),
        date: `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`,
        type: 'auto-'+TYPE, sec: acc });
      localStorage.setItem('clb7_tracker', JSON.stringify(data));
      acc = 0;
    } catch(e) {}
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState==='hidden') flushTime(); });
  window.addEventListener('pagehide', flushTime);
})();

        <div style="flex:1;font-size:0.78rem;color:#666">${qCount} 題</div>
        <a href="french_notes.html#lesson-${l}"
           style="padding:5px 10px;background:#f4f4f0;border:1px solid #ddd;border-radius:6px;font-size:0.72rem;color:#555;text-decoration:none;white-space:nowrap;">
          📖 複習筆記
        </a>
        <a href="quiz.html?lesson=${l}${guided?'&guided=1':''}"
           style="padding:5px 10px;background:#2c2c2c;border:none;border-radius:6px;font-size:0.72rem;color:#fff;text-decoration:none;white-space:nowrap;">
          ▶ 開始 Quiz
        </a>
      </div>`;
  }).join('');

  document.getElementById('quizArea').innerHTML = `
    <div class="done-card" style="padding:20px">
      <h2>熱身完成 🔥</h2>
      <div class="done-big">${warmupScore} / ${warmupTotal}</div>
      <div class="done-sub" style="margin-bottom:20px">選一課複習筆記，然後做該課 Quiz</div>
      <div style="text-align:left">${rows}</div>
      ${backLink}
    </div>`;
}

// ── 步驟②「研讀＋專項」策略選課器（quiz.html?guided=1 直接進入）──────
// 策略：沒練過的課最優先 → 錯誤率高 → 練習量少 → 久沒複習。事半功倍。
function lessonStats() {
  const lessons = [...new Set(BANK.map(q => q.lesson))].filter(l => l > 0).sort((a,b)=>a-b);
  const arr = lessons.map(l => {
    const qs = BANK.filter(q => q.lesson === l);
    let c=0, w=0, lastMax=0;
    qs.forEach(q => { const s = getSRS(qId(q)); c += s.c; w += s.w; if (s.last) lastMax = Math.max(lastMax, s.last); });
    const attempts = c + w;
    return { l, qCount: qs.length, attempts, wrong: w,
             errRate: attempts ? w/attempts : null,
             daysSince: lastMax ? Math.floor((Date.now()-lastMax)/86400000) : null };
  });
  const maxAtt = Math.max(1, ...arr.map(s => s.attempts));
  arr.forEach(s => {
    if (s.attempts === 0) { s.score = 1.5; s.reason = '還沒練過，先建資料'; s.tag = '新'; }
    else {
      const errPart = s.errRate || 0;
      const lowPart = 1 - s.attempts / maxAtt;
      s.score = errPart * 0.6 + lowPart * 0.4;
      if (s.errRate >= 0.4)                 { s.reason = `錯誤率 ${Math.round(s.errRate*100)}%，最該加強`; s.tag = '弱'; }
      else if (s.attempts <= maxAtt * 0.3)  { s.reason = `只練過 ${s.attempts} 次，量偏少`; s.tag = '少'; }
      else if (s.daysSince != null && s.daysSince >= 5) { s.reason = `${s.daysSince} 天沒複習`; s.tag = '久'; }
      else                                  { s.reason = `正確率 ${Math.round((1-s.errRate)*100)}%，維持`; s.tag = ''; }
    }
  });
  return arr;
}

function showStudyPicker() {
  // 隱藏 quiz 的篩選列與進度／暫停（選課器不是在做題）
  document.querySelectorAll('.mode-row, #typeRow, #lessonRow, #progressText, #progressBarWrap, #pauseBtn')
    .forEach(el => { if (el) el.style.display = 'none'; });
  const ranked = lessonStats().sort((a,b) => b.score - a.score);
  const rows = ranked.map((s, i) => {
    const top = i === 0;
    const tagColor = s.tag === '弱' ? '#e05520' : s.tag === '新' ? '#2c7fb8' : s.tag === '少' ? '#d4a017' : s.tag === '久' ? '#b8572c' : '#8a8a86';
    const tagBadge = s.tag ? `<span style="background:${tagColor};color:#fff;font-size:0.62rem;padding:1px 6px;border-radius:8px;margin-left:6px;">${s.tag}</span>` : '';
    return `
      <div style="display:flex;align-items:center;gap:8px;padding:11px 10px;border-radius:8px;margin-bottom:6px;
                  ${top ? 'background:#fff8e6;border:1.5px solid #f0c060;' : 'border-bottom:1px solid #f0f0ee;'}">
        <div style="min-width:52px;font-size:0.75rem;font-weight:700;color:#333">第${s.l}課${tagBadge}</div>
        <div style="flex:1;font-size:0.7rem;color:#777;line-height:1.35">
          ${top ? '<b style="color:#c08010">👉 建議先練</b> · ' : ''}${s.reason}<br>
          <span style="color:#aaa">${s.qCount} 題${s.attempts ? ` · 已練 ${s.attempts} 次` : ''}</span>
        </div>
        <a href="french_notes.html#lesson-${s.l}"
           style="padding:5px 9px;background:#f4f4f0;border:1px solid #ddd;border-radius:6px;font-size:0.7rem;color:#555;text-decoration:none;white-space:nowrap;">📖 筆記</a>
        <a href="quiz.html?lesson=${s.l}&guided=1"
           style="padding:5px 9px;background:${top ? '#c08010' : '#2c2c2c'};border:none;border-radius:6px;font-size:0.7rem;color:#fff;text-decoration:none;white-space:nowrap;">▶ 做題</a>
      </div>`;
  }).join('');

  document.getElementById('quizArea').innerHTML = `
    <div class="done-card" style="padding:20px">
      <h2 style="margin-bottom:4px">研讀 + 專項 📚</h2>
      <div class="done-sub" style="margin-bottom:16px">先開筆記研讀，再做該課題目。順序已按「最該練」排好</div>
      <div style="text-align:left">${rows}</div>
      <a href="dashboard.html" style="display:block;text-align:center;margin-top:16px;color:#aaa;font-size:0.78rem;">↩ 回指揮中心</a>
    </div>`;
}
</script>

<button id="qnoteBtn" title="快速筆記">📝</button>
<div id="qnotePanel">
  <div id="qnoteTitle">快速筆記（存給 Claude 看）</div>
  <textarea id="qnoteTxt" placeholder="記下問題、想法、bug…"></textarea>
  <button id="qnoteSave">儲存筆記</button>
  <div id="qnoteCount"></div>
  <button id="qnoteCopy" style="margin-top:6px;width:100%;padding:7px;background:#1a2438;color:#60a0d0;border:none;border-radius:8px;font-size:0.78rem;cursor:pointer;font-family:inherit;">📋 複製全部給 Claude</button>
</div>
<script>
// ── 心聲筆記（每題）UI ─────────────────────────────────────────
// ⚠️ QNOTES_KEY / lastOk / loadQNotes / saveQNotesArr 定義在主 script（renderCard 載入時就要用，
//    放這裡會 ReferenceError 讓初始渲染整個掛掉——warmup 模式曾因此完全空白）
function toggleQVoice() {
  const area = document.getElementById('qvoiceArea');
  if (!area) return;
  const isHidden = getComputedStyle(area).display === 'none';
  area.style.display = isHidden ? 'block' : 'none';
  if (isHidden) {
    const ta = document.getElementById('qvoiceTxt');
    if (ta) ta.focus();
  }
}

function saveQVoice() {
  const q = queue[current];
  const ta = document.getElementById('qvoiceTxt');
  if (!ta) return;
  const note = ta.value.trim();
  if (!note) return;
  const qid = qId(q);
  const d = new Date();
  const notes = loadQNotes().filter(n => n.qid !== qid);
  notes.push({ qid, q: q.q, topic: q.topic || '', lesson: q.lesson || 0, ok: lastOk, note,
    date: d.toLocaleDateString('zh-TW') });
  saveQNotesArr(notes);
  const area = document.getElementById('qvoiceArea');
  if (area) area.style.display = 'none';
  const btn = document.getElementById('btnVoice');
  if (btn) { btn.textContent = '💬 已記心聲'; btn.classList.add('has-note'); }
}

(function(){
  const KEY='clb7_quick_notes';
  const page=location.pathname.split('/').pop()||'unknown';
  function loadNotes(){try{return JSON.parse(localStorage.getItem(KEY))||[];}catch{return[];}}
  function saveNotes(d){localStorage.setItem(KEY,JSON.stringify(d));}
  function updateCount(){const n=loadNotes();document.getElementById('qnoteCount').textContent=n.length?`共 ${n.length} 則筆記`:'還沒有筆記';}
  document.getElementById('qnoteBtn').addEventListener('click',()=>{
    document.getElementById('qnotePanel').classList.toggle('open');
    updateCount();
  });
  document.getElementById('qnoteSave').addEventListener('click',()=>{
    const txt=document.getElementById('qnoteTxt').value.trim();
    if(!txt)return;
    const notes=loadNotes();
    const d=new Date();
    // 抓當前題目文字與 lesson/topic
    let qContext='';
    try {
      const q = typeof queue!=='undefined' && queue[current];
      if(q) qContext=`[題目：${q.q}｜第${q.lesson}課 ${q.topic}] `;
    } catch(e){}
    notes.push({date:`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`,time:`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`,page,note:qContext+txt});
    saveNotes(notes);
    document.getElementById('qnoteTxt').value='';
    updateCount();
  });
  document.getElementById('qnoteCopy').addEventListener('click',()=>{
    const quick=loadNotes();
    const qnotes=loadQNotes();
    if(!quick.length && !qnotes.length){alert('還沒有筆記');return;}
    const lines=[];
    if(quick.length){
      lines.push('=== 快速筆記 ===');
      quick.forEach(n=>lines.push(`[${n.date} ${n.time}] ${n.note}`));
    }
    if(qnotes.length){
      lines.push('');
      lines.push('=== 每題心聲（題目・對錯・心得）===');
      qnotes.forEach(n=>lines.push(`[${n.date}|L${n.lesson} ${n.topic}|${n.ok?'✓':'✗'}] ${n.q}\n  → ${n.note}`));
    }
    navigator.clipboard.writeText(lines.join('\n')).then(()=>{
      document.getElementById('qnoteCopy').textContent='✓ 已複製！';
      setTimeout(()=>document.getElementById('qnoteCopy').textContent='📋 複製全部給 Claude',2000);
    });
  });
})();
</script>

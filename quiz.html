<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>法語抽考 · A1</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f0ee;
      color: #2c2c2c;
      padding: 24px 20px;
      max-width: 600px;
      margin: 0 auto;
    }

    h1 { font-size: 1.15rem; font-weight: 700; margin-bottom: 2px; }
    .meta { font-size: 0.75rem; color: #aaa; margin-bottom: 10px; }
    .meta a { color: #aaa; text-decoration: none; border-bottom: 1px solid #ddd; }

    /* ── XP / streak bar ── */
    .stat-bar {
      display: flex; gap: 10px; align-items: center;
      margin-bottom: 18px; flex-wrap: wrap;
    }
    .stat-chip {
      font-size: 0.72rem; font-weight: 700;
      padding: 3px 10px; border-radius: 99px;
      background: #fff; border: 1.5px solid #e0e0de; color: #555;
    }
    .stat-chip.fire  { border-color: #f5a623; color: #c07000; }
    .stat-chip.star  { border-color: #9b59b6; color: #7b39a6; }
    .stat-chip.weak  { border-color: #e74c3c; color: #c00; cursor: pointer; }
    .stat-chip.weak:hover { background: #fff0f0; }

    /* ── Mode row ── */
    .mode-row {
      display: flex; gap: 6px; margin-bottom: 10px;
    }
    .mode-btn {
      flex: 1; border: 1.5px solid #ddd; background: #fff; border-radius: 8px;
      padding: 7px 8px; font-size: 0.72rem; font-weight: 600;
      cursor: pointer; color: #777; transition: all 0.15s; text-align: center;
    }
    .mode-btn:hover { background: #f8f8f6; }
    .mode-btn.active         { border-color: #2c2c2c; color: #2c2c2c; background: #f0f0ee; }
    .mode-btn.active.m-weak  { border-color: #e74c3c; color: #c00; background: #fff8f8; }
    .mode-btn.active.m-mixed { border-color: #2a7a4f; color: #1a5a3a; background: #f4fbf6; }

    /* ── 篩選列 ── */
    .filter-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .ctrl-btn {
      border: 1.5px solid #ddd; background: #fff; border-radius: 8px;
      padding: 6px 12px; font-size: 0.75rem; font-weight: 600;
      cursor: pointer; color: #666; transition: all 0.15s;
    }
    .ctrl-btn:hover { background: #f8f8f6; }
    .ctrl-btn.active { border-color: #2c2c2c; color: #2c2c2c; background: #f0f0ee; }
    .ctrl-btn.shuffle { margin-left: auto; }

    /* ── 進度 ── */
    .progress-bar-wrap { background: #e4e4e2; border-radius: 99px; height: 5px; margin-bottom: 18px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: #2c2c2c; border-radius: 99px; transition: width 0.3s; }
    .progress-text { font-size: 0.72rem; color: #aaa; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .score-chip { display: flex; gap: 8px; }
    .score-chip span { font-size: 0.7rem; font-weight: 600; padding: 2px 8px; border-radius: 99px; }
    .chip-ok { background: #e6f4ea; color: #1a6b2a; }
    .chip-no { background: #fde8e8; color: #c00; }

    /* ── 題卡 ── */
    .card {
      background: #fff; border-radius: 16px; padding: 22px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07); margin-bottom: 14px;
    }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
    .qtype {
      font-size: 0.62rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; color: #fff; padding: 2px 8px;
      border-radius: 5px; display: inline-block;
    }
    .type-fill   { background: #3b6fd4; }
    .type-trans  { background: #2a7a4f; }
    .type-gender { background: #8b44c2; }
    .type-choose { background: #c05a00; }

    .review-badge {
      font-size: 0.6rem; font-weight: 700; padding: 2px 8px;
      border-radius: 5px; background: #fff0e0; color: #c05a00;
      border: 1px solid #f0c080;
    }
    .weak-indicator {
      font-size: 0.68rem; color: #e74c3c; font-weight: 600;
    }

    .question { font-size: 1rem; font-weight: 600; line-height: 1.6; margin-bottom: 6px; }
    .hint { font-size: 0.78rem; color: #bbb; margin-bottom: 14px; }

    /* ── 輸入 ── */
    .input-row { display: flex; gap: 8px; margin-bottom: 4px; }
    .answer-input {
      flex: 1; border: 1.5px solid #e0e0de; border-radius: 10px;
      padding: 10px 14px; font-size: 0.95rem; outline: none;
      font-family: inherit; transition: border-color 0.15s;
      background: #fafaf8;
    }
    .answer-input:focus { border-color: #2c2c2c; background: #fff; }
    .answer-input.correct { border-color: #2a7a4f; background: #f4fbf6; }
    .answer-input.wrong   { border-color: #c00;    background: #fff8f8; }
    .answer-input:disabled { opacity: 0.7; }

    .btn-submit {
      border: none; border-radius: 10px; padding: 10px 18px;
      font-size: 0.88rem; font-weight: 600; cursor: pointer;
      background: #2c2c2c; color: #fff; white-space: nowrap;
      transition: opacity 0.15s;
    }
    .btn-submit:disabled { opacity: 0.4; cursor: default; }

    /* ── 結果 ── */
    .result { margin-top: 14px; display: none; }
    .result.show { display: block; }
    .result-banner {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.9rem; font-weight: 700; margin-bottom: 10px;
    }
    .result-banner.ok { color: #1a6b2a; }
    .result-banner.no { color: #c00; }
    .correct-ans {
      background: #f8f8f6; border-left: 3px solid #2c2c2c;
      border-radius: 0 8px 8px 0; padding: 10px 14px;
      font-size: 0.9rem; margin-bottom: 10px;
    }
    .correct-ans .label { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #bbb; margin-bottom: 4px; }
    .correct-ans .fr-ans { font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .ans-note { font-size: 0.8rem; color: #888; line-height: 1.6; margin-top: 6px; }

    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .btn {
      border: none; border-radius: 10px; padding: 9px 16px;
      font-size: 0.84rem; font-weight: 600; cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-next    { background: #2c2c2c; color: #fff; flex: 1; }
    .btn-claude  { background: #f0f0ee; color: #555; border: 1.5px solid #ddd; }

    .tts-btn {
      border: none; background: none; cursor: pointer;
      font-size: 1.1rem; padding: 4px 6px; opacity: 0.7;
      border-radius: 6px; transition: opacity 0.15s; flex-shrink: 0;
    }
    .tts-btn:hover { opacity: 1; }
    .tts-btn.playing { opacity: 1; }

    /* ── 複習分隔畫面 ── */
    .review-divider {
      background: #fff8f0; border-radius: 16px; padding: 28px 22px;
      text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,0.07);
      border: 2px solid #f0c080;
    }
    .review-divider h2 { font-size: 1.1rem; color: #c05a00; margin-bottom: 8px; }
    .review-divider p  { font-size: 0.88rem; color: #888; margin-bottom: 20px; }
    .review-list { text-align: left; margin-bottom: 20px; }
    .review-list-item {
      font-size: 0.82rem; padding: 6px 0;
      border-bottom: 1px solid #f0e8d8; color: #555;
    }
    .btn-review { background: #c05a00; color: #fff; width: 100%; padding: 11px; border-radius: 10px; border: none; font-size: 0.92rem; font-weight: 600; cursor: pointer; }
    .btn-skip   { background: #f0f0ee; color: #888; width: 100%; padding: 9px; border-radius: 10px; border: 1.5px solid #ddd; font-size: 0.82rem; font-weight: 600; cursor: pointer; margin-top: 8px; }

    /* ── 完成 ── */
    .done-card {
      background: #fff; border-radius: 16px; padding: 32px 22px;
      text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,0.07);
    }
    .done-card h2 { font-size: 1.2rem; margin-bottom: 4px; }
    .done-big { font-size: 2.4rem; font-weight: 800; margin: 12px 0 4px; }
    .done-sub { font-size: 0.88rem; color: #888; margin-bottom: 6px; }
    .xp-gain  { font-size: 0.78rem; font-weight: 700; color: #7b39a6; margin-bottom: 20px; }

    .weak-section { text-align: left; margin: 18px 0; }
    .weak-section-title { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #bbb; margin-bottom: 8px; }
    .weak-item {
      display: flex; align-items: baseline; justify-content: space-between;
      padding: 7px 0; border-bottom: 1px solid #f0f0ee; gap: 10px;
    }
    .weak-item-q   { font-size: 0.82rem; color: #444; flex: 1; }
    .weak-item-cnt { font-size: 0.7rem; font-weight: 700; color: #e74c3c; white-space: nowrap; }

    .done-btns { display: flex; gap: 8px; margin-top: 18px; }
    .btn-restart { background: #2c2c2c; color: #fff; flex: 1; padding: 11px; border-radius: 10px; border: none; font-size: 0.92rem; font-weight: 600; cursor: pointer; }
    .btn-do-weak { background: #fff0f0; color: #c00; flex: 1; padding: 11px; border-radius: 10px; border: 1.5px solid #f0b0b0; font-size: 0.88rem; font-weight: 600; cursor: pointer; }
    .btn-do-weak:disabled { opacity: 0.35; cursor: default; }

    .mode-btn.active.m-drill { border-color: #c05a00; color: #c05a00; background: #fff8f0; }

    /* ── ⚡ 快速測驗 ── */
    .drill-card { background: #fff; border-radius: 16px; padding: 24px 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
    .drill-top { display: flex; align-items: center; margin-bottom: 18px; gap: 10px; }
    .drill-count { font-size: 0.72rem; font-weight: 700; color: #aaa; white-space: nowrap; }
    .drill-pbar { flex: 1; height: 5px; background: #eee; border-radius: 99px; overflow: hidden; }
    .drill-pbar-fill { height: 100%; background: #c05a00; border-radius: 99px; transition: width 0.3s; }
    .drill-q { font-size: 1.05rem; font-weight: 600; line-height: 1.7; margin-bottom: 20px; text-align: center; min-height: 54px; }
    .drill-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .drill-opt {
      border: 2px solid #e8e8e6; background: #fafaf8; border-radius: 12px;
      padding: 14px 8px; font-size: 0.92rem; font-weight: 600; cursor: pointer;
      transition: all 0.15s; font-family: inherit; color: #2c2c2c;
      text-align: center; line-height: 1.4;
    }
    .drill-opt:hover:not(:disabled) { border-color: #2c2c2c; background: #f0f0ee; }
    .drill-opt.correct { border-color: #2a7a4f !important; background: #e8f5ee !important; color: #1a5a2a !important; }
    .drill-opt.wrong   { border-color: #c00 !important;    background: #fde8e8 !important; color: #900 !important; }
    .drill-opt.reveal  { border-color: #2a7a4f; background: #f0fbf5; color: #2a7a4f; }
    .drill-opt:disabled { cursor: default; }
    .drill-note { font-size: 0.8rem; color: #666; line-height: 1.6; padding: 8px 12px;
      background: #f8f8f6; border-radius: 8px; border-left: 3px solid #ccc;
      min-height: 34px; opacity: 0; transition: opacity 0.2s; }
    .drill-note.show { opacity: 1; }
    .drill-note.ok  { border-left-color: #2a7a4f; }
    .drill-note.bad { border-left-color: #c00; }
    .drill-done { background: #fff; border-radius: 16px; padding: 32px 22px;
      text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
    .drill-done h2 { font-size: 1.1rem; margin-bottom: 4px; }
    .drill-done-big { font-size: 3rem; font-weight: 800; margin: 10px 0 2px; }
    .drill-done-pct { font-size: 0.9rem; color: #888; margin-bottom: 6px; }
    .drill-done-msg { font-size: 0.85rem; color: #555; margin-bottom: 22px; line-height: 1.6; }
    .drill-next  { background: #2c2c2c; color: #fff; width: 100%; padding: 12px; border-radius: 10px;
      border: none; font-size: 0.92rem; font-weight: 600; cursor: pointer; margin-top: 12px;
      display: none; }
    .drill-next.show { display: block; }
    .drill-hard-badge  { display: inline-block; font-size: 0.62rem; font-weight: 700;
      background: #fff0e0; color: #c05a00; border: 1px solid #f0c080;
      padding: 1px 7px; border-radius: 5px; margin-bottom: 8px; }
    .drill-chain-badge { display: inline-block; font-size: 0.62rem; font-weight: 700;
      background: #e8f0fe; color: #1a56db; border: 1px solid #b8d0f8;
      padding: 1px 7px; border-radius: 5px; margin-bottom: 8px; }
    .drill-review-banner { background: #fff8f0; border: 1.5px solid #f0c080; border-radius: 8px;
      padding: 6px 12px; font-size: 0.75rem; font-weight: 600; color: #c05a00;
      margin-bottom: 10px; text-align: center; }
    .drill-retry { background: #c05a00; color: #fff; width: 100%; padding: 12px; border-radius: 10px;
      border: none; font-size: 0.92rem; font-weight: 600; cursor: pointer; margin-bottom: 8px; }
    .drill-back  { background: #f0f0ee; color: #555; width: 100%; padding: 10px; border-radius: 10px;
      border: 1.5px solid #ddd; font-size: 0.84rem; font-weight: 600; cursor: pointer; }

    /* toast */
    .toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      background: #2c2c2c; color: #fff; padding: 9px 20px; border-radius: 99px;
      font-size: 0.82rem; font-weight: 600; opacity: 0; pointer-events: none;
      transition: opacity 0.2s; white-space: nowrap;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

<h1>法語抽考 · A1</h1>
<p class="meta">筆記 → <a href="french_notes.html">french_notes.html</a></p>

<div class="stat-bar" id="statBar">
  <span class="stat-chip fire" id="chipStreak">🔥 —</span>
  <span class="stat-chip star" id="chipXP">⭐ —</span>
  <span class="stat-chip weak" id="chipWeak" onclick="setMode('weak')">🎯 — 弱點</span>
</div>

<div class="mode-row">
  <button class="mode-btn active" id="mNormal" onclick="setMode('normal')">📚 一般練習</button>
  <button class="mode-btn m-weak"  id="mWeak"   onclick="setMode('weak')">🎯 弱點模式</button>
  <button class="mode-btn m-mixed" id="mMixed"  onclick="setMode('mixed')">🔀 混合複習</button>
  <button class="mode-btn m-drill" id="mDrill"  onclick="setMode('drill')">⚡ 快速測驗</button>
</div>

<div class="filter-row" id="typeRow">
  <button class="ctrl-btn active" id="btnAll"    onclick="setType('all')">全部類型</button>
  <button class="ctrl-btn"        id="btnFill"   onclick="setType('fill')">動詞填空</button>
  <button class="ctrl-btn"        id="btnTrans"  onclick="setType('trans')">翻譯</button>
  <button class="ctrl-btn"        id="btnGender" onclick="setType('gender')">陰陽性</button>
  <button class="ctrl-btn"        id="btnChoose" onclick="setType('choose')">判斷</button>
  <button class="ctrl-btn shuffle" onclick="restart()">🔀 洗牌</button>
</div>
<div class="filter-row" id="lessonRow"></div>

<div class="progress-text" id="progressText">
  <span id="progressLabel">第 1 題</span>
  <div class="score-chip">
    <span class="chip-ok" id="scoreOk">✓ 0</span>
    <span class="chip-no" id="scoreNo">✗ 0</span>
  </div>
</div>
<div class="progress-bar-wrap" id="progressBarWrap">
  <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
</div>

<div id="quizArea"></div>
<div class="toast" id="toast"></div>

<script>
// ── TTS ──────────────────────────────────────────────────────
let frVoice = null, activeTtsEl = null;
function initVoice() {
  frVoice = speechSynthesis.getVoices().find(v => /thomas/i.test(v.name))
         || speechSynthesis.getVoices().find(v => /am[eé]lie/i.test(v.name))
         || speechSynthesis.getVoices().find(v => v.lang === 'fr-FR')
         || null;
}
speechSynthesis.onvoiceschanged = initVoice;
initVoice();
function ttsSpeak(text, btn) {
  speechSynthesis.cancel();
  if (activeTtsEl) activeTtsEl.classList.remove('playing');
  const cleaned = text.replace(/ \/ /g, ', ');
  const utt = new SpeechSynthesisUtterance(cleaned);
  utt.lang = 'fr-FR'; utt.rate = 0.7;
  if (frVoice) utt.voice = frVoice;
  activeTtsEl = btn;
  btn.classList.add('playing');
  utt.onend = utt.onerror = () => btn.classList.remove('playing');
  speechSynthesis.speak(utt);
}

// ── 比對 ─────────────────────────────────────────────────────
function norm(s) {
  return s.toLowerCase().trim().replace(/[.,!?'`'']/g, '').replace(/\s+/g, ' ').trim();
}
function isCorrect(input, answer) {
  const n = norm(input);
  return answer.split('|').some(a => norm(a) === n);
}

// ── SRS / localStorage ────────────────────────────────────────
function qId(q) {
  // Stable ID from question text (first 30 chars, base64-ish)
  return 'q_' + q.q.slice(0, 30).replace(/[^a-zA-Z0-9一-鿿]/g, '_');
}
function getSRS(id) {
  try { return JSON.parse(localStorage.getItem('clb7_' + id)) || { w:0, c:0, last:0 }; }
  catch(e) { return { w:0, c:0, last:0 }; }
}
function setSRS(id, data) {
  try { localStorage.setItem('clb7_' + id, JSON.stringify(data)); } catch(e) {}
}
function recordResult(q, ok) {
  const id = qId(q);
  const srs = getSRS(id);
  if (ok) srs.c++; else srs.w++;
  srs.last = Date.now();
  setSRS(id, srs);
}
function weakScore(q) {
  const { w, c } = getSRS(qId(q));
  if (w + c === 0) return 0;
  return w / (w + c);
}
function wrongCount(q) {
  return getSRS(qId(q)).w;
}
function isWeak(q) { return wrongCount(q) >= 2; }

// ── Game state (XP + streak) ──────────────────────────────────
function getGame() {
  try { return JSON.parse(localStorage.getItem('clb7_game')) || { xp:0, streak:0, lastDate:'' }; }
  catch(e) { return { xp:0, streak:0, lastDate:'' }; }
}
function saveGame(g) {
  try { localStorage.setItem('clb7_game', JSON.stringify(g)); } catch(e) {}
}
function touchStreak() {
  const g = getGame();
  const today = new Date().toISOString().slice(0, 10);
  if (g.lastDate === today) return;
  const yd = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
  g.streak = (g.lastDate === yd) ? g.streak + 1 : 1;
  g.lastDate = today;
  saveGame(g);
}
function addXP(n) {
  const g = getGame();
  g.xp += n;
  saveGame(g);
}
function renderStats() {
  const g = getGame();
  document.getElementById('chipStreak').textContent = `🔥 ${g.streak} 天連續`;
  document.getElementById('chipXP').textContent     = `⭐ ${g.xp} XP`;
  const wc = BANK.filter(q => isWeak(q)).length;
  document.getElementById('chipWeak').textContent   = `🎯 ${wc} 弱點`;
}

// ── 題庫 ─────────────────────────────────────────────────────
const BANK = [
  // 動詞填空 ── être
  { lesson:1, type:'fill', q:'Je _____ (être) taïwanais.',          hint:'être 現在式', a:'Je suis taïwanais|suis', aNote:'être → je suis' },
  { lesson:1, type:'fill', q:'Tu _____ (être) français ?',           hint:'être 現在式', a:'Tu es français|es', aNote:'être → tu es' },
  { lesson:1, type:'fill', q:'Elle _____ (être) coréenne.',          hint:'être 現在式', a:'Elle est coréenne|est', aNote:'être → il/elle est' },
  { lesson:1, type:'fill', q:'Nous _____ (être) canadiens.',         hint:'être 現在式', a:'Nous sommes canadiens|sommes', aNote:'être → nous sommes' },
  { lesson:1, type:'fill', q:'Vous _____ (être) professeur ?',       hint:'être 現在式', a:'Vous êtes professeur|êtes', aNote:'être → vous êtes' },
  { lesson:1, type:'fill', q:'Ils _____ (être) italiens.',           hint:'être 現在式', a:'Ils sont italiens|sont', aNote:'être → ils/elles sont' },
  // 動詞填空 ── avoir
  { lesson:1, type:'fill', q:"J'_____ (avoir) 25 ans.",              hint:'avoir 現在式（年齡）', a:"J'ai 25 ans|ai", aNote:"avoir → j'ai　⚠️ 年齡用 avoir 不用 être" },
  { lesson:1, type:'fill', q:'Tu _____ (avoir) des enfants ?',       hint:'avoir 現在式', a:'Tu as des enfants|as', aNote:'avoir → tu as' },
  { lesson:1, type:'fill', q:'Elle _____ (avoir) onze mois.',        hint:'avoir 現在式', a:'Elle a onze mois|a', aNote:'avoir → il/elle a' },

// ── 狀態 ──────────────────────────────────────────────────────
let queue = [], resurface = [], resurfaceDone = false;
let current = 0, scoreOk = 0, scoreNo = 0, answered = false;
let filterType = 'all', filterLesson = 'all', filterMode = 'normal';
let sessionXP = 0;
const TYPE_LABEL = { fill:'動詞填空', trans:'翻譯', gender:'陰陽性', choose:'判斷' };
const TYPE_CLASS  = { fill:'type-fill', trans:'type-trans', gender:'type-gender', choose:'type-choose' };

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildLessonButtons() {
  const lessons = [...new Set(BANK.map(q => q.lesson))].sort((a,b) => a-b);
  const row = document.getElementById('lessonRow');
  row.innerHTML = `<button class="ctrl-btn active" id="btnLessonAll" onclick="setLesson('all')">全部課堂</button>`;
  lessons.forEach(l => {
    row.innerHTML += `<button class="ctrl-btn" id="btnLesson${l}" onclick="setLesson(${l})">第${l}課</button>`;
  });
}

function setType(type) {
  filterType = type;
  ['all','fill','trans','gender','choose'].forEach(t => {
    const id = 'btn' + t.charAt(0).toUpperCase() + t.slice(1);
    document.getElementById(id)?.classList.toggle('active', t === type);
  });
  restart();
}

function setLesson(lesson) {
  filterLesson = lesson;
  document.querySelectorAll('#lessonRow .ctrl-btn').forEach(btn => btn.classList.remove('active'));
  const id = lesson === 'all' ? 'btnLessonAll' : `btnLesson${lesson}`;
  document.getElementById(id)?.classList.add('active');
  restart();
}

function setMode(mode) {
  filterMode = mode;
  ['normal','weak','mixed','drill'].forEach(m => {
    const el = document.getElementById('m' + m.charAt(0).toUpperCase() + m.slice(1));
    if (el) el.classList.toggle('active', m === mode);
  });
  const isDrill = mode === 'drill';
  ['typeRow','lessonRow','progressText','progressBarWrap'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.display = isDrill ? 'none' : '';
  });
  if (isDrill) startDrill();
  else restart();
}

function getPool() {
  let pool = BANK;
  if (filterType   !== 'all') pool = pool.filter(q => q.type   === filterType);
  if (filterLesson !== 'all') pool = pool.filter(q => q.lesson === filterLesson);

  if (filterMode === 'weak') {
    const weak = pool.filter(q => isWeak(q));
    return weak.length > 0 ? weak : pool; // fallback to all if no weak yet
  }
  if (filterMode === 'mixed') {
    const weak = pool.filter(q => isWeak(q));
    const rest = pool.filter(q => !isWeak(q));
    // Sort weak by worst first, take up to half the pool
    const weakSorted = weak.sort((a, b) => weakScore(b) - weakScore(a));
    const halfN = Math.ceil(pool.length / 2);
    const weakPart = weakSorted.slice(0, halfN);
    const restPart = shuffle(rest).slice(0, pool.length - weakPart.length);
    return shuffle([...weakPart, ...restPart]);
  }
  return pool;
}

function restart() {
  resurface = []; resurfaceDone = false;
  queue = shuffle(getPool());
  current = 0; scoreOk = 0; scoreNo = 0; answered = false; sessionXP = 0;
  updateProgress();
  renderCard();
}

function updateProgress() {
  const total = queue.length, done = current;
  const inReview = resurfaceDone === false && resurface.length > 0 && current >= queue.length;
  document.getElementById('progressLabel').textContent =
    total === 0 ? '沒有題目' : `第 ${Math.min(done + 1, total)} 題 / 共 ${total} 題`;
  document.getElementById('progressFill').style.width =
    total === 0 ? '0%' : `${(done / total) * 100}%`;
  document.getElementById('scoreOk').textContent = `✓ ${scoreOk}`;
  document.getElementById('scoreNo').textContent = `✗ ${scoreNo}`;
}

function renderCard() {
  const area = document.getElementById('quizArea');

  // All done — check for resurface round
  if (current >= queue.length) {
    if (resurface.length > 0 && !resurfaceDone) {
      showReviewDivider();
      return;
    }
    showDoneCard();
    return;
  }

  const q = queue[current];
  const isReviewQ = q._review === true;
  answered = false;
  const displayA = q.a.split('|')[0];
  const wc = wrongCount(q);

  area.innerHTML = `
    <div class="card">
      <div class="card-top">
        <div class="qtype ${TYPE_CLASS[q.type]}">${TYPE_LABEL[q.type]}</div>
        <div style="display:flex;gap:6px;align-items:center">
          ${wc >= 2 ? `<span class="weak-indicator">⚠ 錯過 ${wc} 次</span>` : ''}
          ${isReviewQ ? `<span class="review-badge">🔁 複習</span>` : ''}
        </div>
      </div>
      <div class="question">${q.q}</div>
      ${q.hint ? `<div class="hint">提示：${q.hint}</div>` : ''}
      <div class="input-row">
        <input class="answer-input" id="ansInput" type="text"
               placeholder="輸入答案，按 Enter 確認" autocomplete="off" autocorrect="off"
               spellcheck="false">
        <button class="btn-submit" id="btnSubmit" onclick="checkAnswer()">確認</button>
      </div>
      <div class="result" id="result">
        <div class="result-banner" id="resultBanner">
          <span id="resultText"></span>
          <button class="tts-btn" id="ttsBtn" title="播放發音">🔊</button>
        </div>
        <div class="correct-ans" id="correctAns" style="display:none">
          <div class="label">正確答案</div>
          <div class="fr-ans">${displayA}</div>
          ${q.aNote ? `<div class="ans-note">📌 ${q.aNote}</div>` : ''}
        </div>
        <div class="btn-row">
          ${q.askClaude ? `<button class="btn btn-claude" onclick="askClaude()">問 Claude</button>` : ''}
          <button class="btn btn-next" onclick="nextQ()">下一題 →</button>
        </div>
      </div>
    </div>`;

  const input = document.getElementById('ansInput');
  input.addEventListener('keydown', e => { if (e.key === 'Enter') checkAnswer(); });
  input.focus();

  const ttsBtn = document.getElementById('ttsBtn');
  if (ttsBtn) {
    const frText = displayA.replace(/（.*?）/g, '').trim();
    ttsBtn.addEventListener('click', e => { e.stopPropagation(); ttsSpeak(frText, ttsBtn); });
  }
}

function checkAnswer() {
  if (answered) return;
  const input = document.getElementById('ansInput');
  const val = input.value.trim();
  if (!val) return;

  answered = true;
  const q = queue[current];
  const ok = isCorrect(val, q.a);

  input.disabled = true;
  document.getElementById('btnSubmit').disabled = true;
  input.classList.add(ok ? 'correct' : 'wrong');

  const banner = document.getElementById('resultBanner');
  banner.className = 'result-banner ' + (ok ? 'ok' : 'no');
  document.getElementById('resultText').textContent = ok ? '✓ 正確！' : '✗ 再想想';
  if (!ok) document.getElementById('correctAns').style.display = 'block';
  document.getElementById('result').classList.add('show');

  // SRS tracking
  recordResult(q, ok);

  if (ok) {
    scoreOk++;
    const xp = q._review ? 5 : 10;
    sessionXP += xp;
    addXP(xp);
  } else {
    scoreNo++;
    // Queue for resurface (once only, not if already a review card)
    if (!q._review && !resurface.find(r => r.q === q.q)) {
      resurface.push({ ...q, _review: true });
    }
  }

  updateProgress();
  renderStats();
}

function nextQ() {
  current++;
  updateProgress();
  renderCard();
}

function showReviewDivider() {
  const area = document.getElementById('quizArea');
  const list = resurface.map(q => `<div class="review-list-item">・${q.q}</div>`).join('');
  area.innerHTML = `
    <div class="review-divider">
      <h2>🔁 複習錯題 (${resurface.length} 題)</h2>
      <p>剛才這些題目答錯了，再試一次吧！</p>
      <div class="review-list">${list}</div>
      <button class="btn-review" onclick="startReview()">開始複習</button>
      <button class="btn-skip"   onclick="skipReview()">跳過，直接看結果</button>
    </div>`;
}

function startReview() {
  resurfaceDone = true;
  queue = shuffle(resurface);
  resurface = [];
  current = 0;
  updateProgress();
  renderCard();
}

function skipReview() {
  resurface = [];
  resurfaceDone = true;
  showDoneCard();
}

function showDoneCard() {
  // Award session completion bonus
  const bonus = scoreOk >= queue.length * 0.8 ? 50 : 20;
  addXP(bonus); sessionXP += bonus;
  touchStreak();
  renderStats();

  // Top weak questions across whole bank
  const weakList = BANK
    .filter(q => wrongCount(q) > 0)
    .sort((a, b) => wrongCount(b) - wrongCount(a))
    .slice(0, 5);

  const weakHTML = weakList.length > 0 ? `
    <div class="weak-section">
      <div class="weak-section-title">累計最弱題目</div>
      ${weakList.map(q => `
        <div class="weak-item">
          <span class="weak-item-q">${q.q}</span>
          <span class="weak-item-cnt">✗ ${wrongCount(q)} 次</span>
        </div>`).join('')}
    </div>` : '';

  const hasWeak = BANK.some(q => isWeak(q));
  const pct = queue.length > 0 ? Math.round(scoreOk / queue.length * 100) : 0;

  document.getElementById('quizArea').innerHTML = `
    <div class="done-card">
      <h2>全部完成 🎉</h2>
      <div class="done-big">${scoreOk} / ${queue.length}</div>
      <div class="done-sub">答對率 ${pct}%　複習 ${scoreNo} 題</div>
      <div class="xp-gain">＋${sessionXP} XP 本場獲得</div>
      ${weakHTML}
      <div class="done-btns">
        <button class="btn-restart" onclick="restart()">🔀 再來一次</button>
        <button class="btn-do-weak" onclick="setMode('weak')" ${hasWeak ? '' : 'disabled'}>🎯 練習弱點</button>
      </div>
    </div>`;
}

function askClaude() {
  const q = queue[current];
  const userInput = document.getElementById('ansInput').value.trim();
  const prompt = `我在學法語（A1），請幫我判斷這個翻譯是否正確：\n\n題目：${q.q}\n我的答案：${userInput || '（空白）'}\n\n請告訴我答案是否可以接受，如果不對請用中文解釋。`;
  navigator.clipboard.writeText(prompt).then(() => {
    showToast('題目已複製！去 claude.ai 貼上');
    setTimeout(() => window.open('https://claude.ai', '_blank'), 600);
  }).catch(() => {
    showToast('請手動複製：' + prompt.slice(0, 40) + '…');
  });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ── Drill SRS（常錯多出現）──────────────────────────────────────
function drillQId(q) {
  return 'dq_' + q.q.slice(0,25).replace(/[^a-zA-Z0-9一-鿿]/g,'_');
}
function getDrillSRS(q) {
  try { return JSON.parse(localStorage.getItem('clb7_'+drillQId(q))) || {w:0,c:0}; }
  catch(e) { return {w:0,c:0}; }
}
function recordDrillResult(q, ok) {
  const srs = getDrillSRS(q);
  if (ok) srs.c++; else srs.w++;
  try { localStorage.setItem('clb7_'+drillQId(q), JSON.stringify(srs)); } catch(e) {}
}
// 加權取樣：答錯越多次，出現機率越高（最多 4 倍）
function weightedSample(arr, n) {
  const pool = [];
  arr.forEach(q => {
    const w = Math.min(getDrillSRS(q).w, 3);
    for (let i = 0; i < 1 + w; i++) pool.push(q);
  });
  const shuffled = shuffle(pool);
  const seen = new Set();
  const result = [];
  for (const q of shuffled) {
    if (!seen.has(q.q)) { seen.add(q.q); result.push({...q}); }
    if (result.length >= n) break;
  }
  if (result.length < n) {
    for (const q of shuffle(arr)) {
      if (!seen.has(q.q)) { seen.add(q.q); result.push({...q}); }
      if (result.length >= n) break;
    }
  }
  return result;
}

// ── Drill 狀態 ──────────────────────────────────────────────────
let drillQueue = [], drillIdx = 0, drillScore = 0, drillWrong = [];
let drillPhase = 'main'; // 'main' | 'review'
let drillMainScore = 0, drillMainTotal = 20, drillRetrying = false;
const DRILL_TOTAL = 20;

function startDrill() {
  drillQueue = weightedSample(AGREE_BANK, DRILL_TOTAL);
  drillIdx = 0; drillScore = 0; drillWrong = [];
  drillPhase = 'main'; drillMainScore = 0; drillMainTotal = DRILL_TOTAL; drillRetrying = false;
  renderDrill();
}

function renderDrill() {
  const area = document.getElementById('quizArea');

  // 判斷是否進入複習或結束
  if (drillIdx >= drillQueue.length) {
    if (drillPhase === 'main') {
      drillMainScore = drillScore;
      drillMainTotal = drillQueue.length;
      if (drillWrong.length > 0) {
        // 直接銜接錯題，不顯示中間畫面
        drillPhase = 'review';
        drillQueue = shuffle(drillWrong).map(q => ({...q}));
        drillWrong = []; drillIdx = 0; drillScore = 0; drillRetrying = false;
        // fall through
      } else { renderDrillDone(); return; }
    } else { renderDrillDone(); return; }
  }

  const q = drillQueue[drillIdx];
  const inReview = drillPhase === 'review';
  const pct = Math.round((drillIdx / drillQueue.length) * 100);

  const topLabel   = inReview ? `🔁 複習 ${drillIdx + 1}/${drillQueue.length}` : `⚡ ${drillIdx + 1}/20`;
  const scoreLabel = inReview ? `主輪 ${drillMainScore}/${drillMainTotal}` : `${drillScore} ✓`;
  const badge = q.chain ? '<div class="drill-chain-badge">🔗 情境推理</div>'
              : q.hard  ? '<div class="drill-hard-badge">🔥 進階</div>' : '';
  const reviewBanner = inReview ? `
    <div class="drill-review-banner">
      ${drillRetrying ? '↺ 答錯了，再試一次' : '🔁 答對才能繼續'}
      &nbsp;·&nbsp; 主輪得分 ${drillMainScore} / ${drillMainTotal}
    </div>` : '';

  area.innerHTML = `
    <div class="drill-card">
      <div class="drill-top">
        <div class="drill-count">${topLabel}</div>
        <div class="drill-pbar"><div class="drill-pbar-fill" style="width:${pct}%"></div></div>
        <div class="drill-count">${scoreLabel}</div>
      </div>
      ${reviewBanner}${badge}
      <div class="drill-q" style="white-space:pre-line">${q.q}</div>
      <div class="drill-opts" id="drillOpts">
        ${q.opts.map((opt,i) => `
          <button class="drill-opt" id="dopt${i}" data-opt="${opt.replace(/"/g,'&quot;').replace(/'/g,'&#39;')}"
            onclick="pickOpt(this, this.dataset.opt)">${opt}</button>`).join('')}
      </div>
      <div class="drill-note" id="drillNote"></div>
      ${!inReview ? '<button class="drill-next" id="drillNext" onclick="nextDrillQ()">下一題 →</button>' : ''}
    </div>`;
}

function pickOpt(btn, chosen) {
  const q = drillQueue[drillIdx];
  document.querySelectorAll('.drill-opt').forEach(b => b.disabled = true);

  const correct = chosen.trim() === q.a.trim();
  recordDrillResult(q, correct);

  if (correct) {
    drillScore++;
    btn.classList.add('correct');
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.drill-opt').forEach(b => {
      if (b.textContent.trim() === q.a.trim()) b.classList.add('reveal');
    });
    if (drillPhase === 'main' && !drillWrong.find(x => x.q === q.q)) drillWrong.push({...q});
  }

  const note = document.getElementById('drillNote');
  note.textContent = q.note;
  note.className = 'drill-note show ' + (correct ? 'ok' : 'bad');

  if (drillPhase === 'main') {
    document.getElementById('drillNext').classList.add('show');
  } else {
    // 複習模式：自動跳題
    if (correct) {
      drillRetrying = false;
      setTimeout(() => { drillIdx++; renderDrill(); }, 900);
    } else {
      drillRetrying = true;
      setTimeout(() => { renderDrill(); }, 1500); // 同題再來
    }
  }
}

function nextDrillQ() { drillIdx++; renderDrill(); }

function renderDrillDone() {
  const pct = drillMainTotal > 0 ? Math.round(drillMainScore / drillMainTotal * 100) : 100;
  const hadReview = drillPhase === 'review';
  const emoji = pct === 100 ? '🎯' : pct >= 80 ? '💪' : pct >= 60 ? '📖' : '🔁';
  const msg   = pct === 100 ? '完美！一題不差！'
              : hadReview   ? '錯題全清，加油！'
              : pct >= 80   ? '很不錯，繼續練！' : '再多跑幾輪！';

  document.getElementById('quizArea').innerHTML = `
    <div class="drill-done">
      <h2>${emoji} 完成！</h2>
      <div class="drill-done-big">${drillMainScore} / ${drillMainTotal}</div>
      <div class="drill-done-pct">答對率 ${pct}%${hadReview ? '　（已完成錯題複習）' : ''}</div>
      <div class="drill-done-msg">${msg}</div>
      <button class="drill-retry" onclick="startDrill()">🔄 新的 20 題</button>
      <button class="drill-back"  onclick="setMode('normal')">← 離開</button>
    </div>`;
}

// 啟動
buildLessonButtons();
renderStats();
restart();
</script>
</body>
</html>

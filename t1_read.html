<title>T1 讀懂 · CLB7</title>
<style>

body { background:#0b0a10; color:#e6e0d2; font-family:'Segoe UI',system-ui,sans-serif;

.howto { background:#12101a; border:1px solid #322a3e; border-left:3px solid #c9a227;

  color:#9a917c; line-height:1.8; }

/* 段落選單 */
.pick { background:#12101a; border:1px solid #322a3e; border-radius:14px; padding:12px; margin-bottom:14px; }
.pick h3 { font-size:.66rem; color:#5a5344; letter-spacing:1.5px; margin-bottom:10px;

.pick h3 .tog:hover { border-color:#7fa8c9; background:#141c26; }

.nowSeg small { color:#6a6250; font-size:.7rem; margin-left:8px; }
.srow { display:flex; align-items:center; gap:9px; background:#1a1624; border:1px solid #3a3048;

.srow.done { border-color:#2f5a3f; }
.srow .tick { flex:0 0 auto; width:18px; text-align:center; font-size:.8rem; }
.srow .nm { flex:1; font-size:.84rem; color:#e8dcc0; line-height:1.5; }
.srow .nm small { display:block; font-size:.68rem; color:#6a6250; margin-top:2px; }
.srow .meta { flex:0 0 auto; font-size:.64rem; color:#5a5344; }

/* 文本 */
.text { background:#12101a; border:1px solid #322a3e; border-radius:14px;
  padding:20px 18px; margin-bottom:14px; }
.ask { font-size:.72rem; color:#7a8fa0; margin-bottom:14px; padding-bottom:12px;
  border-bottom:1px dashed #2a2436; line-height:1.7; }
.para { font-size:1.06rem; line-height:2.5; font-family:Georgia,serif; color:#efe7d4; margin-bottom:14px; }
.para:last-child { margin-bottom:0; }

  border-radius:3px; transition:background .15s, border-color .15s; }
.bk:hover { background:#1e1a2a; border-bottom-color:#c9a227; }
.bk.open { background:#221c14; border-bottom:1px solid #e0c060; }
.bk.hasPt { border-bottom-style:solid; border-bottom-color:#6a5a30; }
.gap { color:#efe7d4; }

/* 展開的解析 */
.rv { display:block; margin:6px 0 10px; padding:11px 13px; background:#171320;
  border:1px solid #3a3048; border-left:3px solid #e0c060; border-radius:8px;
  font-family:'Segoe UI',system-ui,sans-serif; font-size:.86rem; line-height:1.8; }
.rv .zh { display:block; color:#d8d0bc; font-size:.92rem; }
.rv .pt { display:block; margin-top:9px; padding-top:9px; border-top:1px dashed #3a3048;
  font-size:.8rem; color:#9a917c; }
.rv .pt .frag { color:#e0c060; font-family:Georgia,serif; }
.rv .cx { display:inline-block; margin-top:7px; font-size:.72rem; color:#7fa8c9;
  text-decoration:none; border:1px solid #2a3a4a; border-radius:20px; padding:2px 10px; }
.rv .cx:hover { border-color:#7fa8c9; background:#141c26; }
.rv .nocx { display:inline-block; margin-top:7px; font-size:.7rem; color:#6a6250; }

.whole { margin-top:14px; padding-top:13px; border-top:1px dashed #2a2436; }
.whole .wbtn { font-size:.74rem; color:#8a8270; background:none; border:1px dashed #3a3048;
  border-radius:7px; padding:6px 13px; cursor:pointer; font-family:inherit; }
.whole .wbtn:hover { color:#e0c060; border-color:#c9a227; }
.whole .wbody { margin-top:11px; }

/* 今天練這幾段 */
.today { background:#12101a; border:1px solid #322a3e; border-left:3px solid #c9a227;
  border-radius:12px; padding:14px 16px; margin-bottom:14px; }
.today h3 { font-size:.7rem; color:#5a5344; letter-spacing:1.5px; margin-bottom:11px;
  display:flex; justify-content:space-between; align-items:center; }
.today h3 .hint { color:#4a4436; letter-spacing:0; font-size:.66rem; }
.trow { display:flex; align-items:center; gap:10px; background:#1a1624; border:1px solid #3a3048;
  border-radius:9px; padding:9px 12px; margin-bottom:6px; cursor:pointer; transition:border-color .15s; }
.trow:hover { border-color:#c9a227; }
.trow .st { flex:0 0 auto; font-size:.62rem; color:#12101a; background:#c9a227;
  border-radius:5px; padding:2px 7px; font-weight:700; }
.trow .nm { flex:1; font-size:.84rem; color:#e8dcc0; line-height:1.4; }
.trow .nm small { display:block; font-size:.66rem; color:#6a6250; margin-top:2px; }
.trow .ago { flex:0 0 auto; font-size:.66rem; color:#5a5344; }
.today .none { color:#4a4436; font-size:.8rem; line-height:1.8; }

.modebar { display:flex; gap:8px; margin-bottom:14px; }
.mbtn { flex:1; background:#12101a; border:1px solid #322a3e; border-radius:10px;
  padding:10px 8px; text-align:center; cursor:pointer; transition:all .15s; font-size:.82rem; color:#8a8270; }
.mbtn:hover { border-color:#c9a227; }
.mbtn.on { border-color:#e0c060; background:#221c14; color:#e0c060; }
.mbtn small { display:block; font-size:.64rem; color:#5a5344; margin-top:3px; }

/* 填空 */
.stg { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
.stg .s { font-size:.68rem; padding:5px 10px; border-radius:20px; cursor:pointer;
  border:1px solid #2a2436; color:#5a5344; background:none; font-family:inherit; }
.stg .s:hover { border-color:#c9a227; color:#8a8270; }
.stg .s.on { border-color:#e0c060; color:#e0c060; background:#221c14; }
.stg .s.done { border-color:#2f5a3f; color:#6fd09a; }
.stgNote { font-size:.72rem; color:#6a6250; line-height:1.7; margin-bottom:12px;
  padding-left:10px; border-left:2px solid #322a3e; }

.cz { font-size:1.02rem; line-height:2.7; font-family:Georgia,serif; color:#efe7d4; }
.cz input { background:#1a1624; border:none; border-bottom:1px solid #6a5a30;
  color:#e0c060; font-size:.96rem; font-family:Georgia,serif; padding:2px 5px;
  border-radius:4px 4px 0 0; text-align:center; }
.cz input:focus { outline:none; border-bottom-color:#e0c060; background:#221c14; }
.cz input.ok   { color:#6fd09a; border-bottom-color:#2f5a3f; }
.cz input.warn { color:#e0c060; border-bottom-color:#c9a227; }
.cz input.bad  { color:#e08070; border-bottom-color:#7a3028; }
.cz .zhcue { font-size:.72rem; color:#6a6250; font-family:'Segoe UI',system-ui,sans-serif; }
.cz .blk { display:inline-block; border-bottom:1px dashed #6a5a30; min-width:90px;
  text-align:center; color:#5a5344; font-size:.76rem;
  font-family:'Segoe UI',system-ui,sans-serif; }

.acc { display:flex; gap:4px; flex-wrap:wrap; margin:12px 0; }
.acc button { background:#1a1624; border:1px solid #322a3e; color:#c9b98a;
  border-radius:6px; padding:5px 9px; font-size:.9rem; cursor:pointer; font-family:Georgia,serif; }
.acc button:hover { border-color:#c9a227; }

.czArea textarea { width:100%; background:#141220; border:1px solid #322a3e; border-radius:10px;
  color:#efe7d4; font-size:1rem; padding:12px; min-height:150px; line-height:1.9;
  font-family:Georgia,serif; resize:vertical; }
.czArea textarea:focus { outline:none; border-color:#e0c060; }
.cmp { margin-top:12px; }
.cmp .row { display:flex; gap:9px; align-items:baseline; padding:7px 0;
  border-bottom:1px solid #1d1828; font-size:.86rem; }
.cmp .row:last-child { border-bottom:none; }
.cmp .mk { flex:0 0 auto; width:18px; text-align:center; }
.cmp .fr { flex:1; font-family:Georgia,serif; color:#c8c0ac; }
.cmp .zh { flex:0 0 auto; font-size:.72rem; color:#5a5344; max-width:38%; text-align:right; }
.cmp .row.hit .fr { color:#6fd09a; }
.cmp .row.miss .fr { color:#e08070; }

.score { font-size:.86rem; margin:12px 0; color:#8a8270; }
.score b { font-size:1.2rem; }

.bar { display:flex; gap:9px; flex-wrap:wrap; margin-bottom:14px; }
button { padding:9px 15px; border-radius:8px; border:none; font-size:.8rem;
  cursor:pointer; font-family:inherit; transition:opacity .15s, transform .1s; }
button:active { transform:scale(.97); }
.b-all { background:#1a2438; color:#7fa8c9; }
.b-done { background:#1d4a33; color:#6fd09a; }
.b-done.is { background:#2a2436; color:#6a6250; }
.b-next { background:#3a2e10; color:#e0c060; }

.mirror { background:#12101a; border:1px solid #322a3e; border-radius:14px;
  padding:14px 16px; font-size:.78rem; color:#9a917c; line-height:1.9; }
.mirror h3 { font-size:.66rem; color:#5a5344; letter-spacing:1.5px; margin-bottom:9px; }
.mirror .hot { color:#e0c060; font-family:Georgia,serif; }
.empty { text-align:center; color:#4a4436; font-size:.82rem; padding:22px 0; }
.toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px);
  background:#1d4a33; color:#6fd09a; padding:10px 22px; border-radius:24px;
  font-size:.8rem; transition:transform .25s ease; pointer-events:none; z-index:99; }
.toast.show { transform:translateX(-50%) translateY(0); }
</style>

<body>

<div class="header">
  <a class="back" href="dashboard.html">← 大腦</a>
  <h1>T1 讀懂</h1>
  <div class="sub">進 Anki 之前的那一步 — 一段只要做一次</div>
</div>

<div class="howto">
  <b>怎麼用：</b>先自己讀法文，⛔ 不要急著找中文。<br>
  讀到哪一塊卡住 → <b>點那一塊</b>，中文跟文法點才出現。<br>
  ⭐ 你點了哪幾塊就是你真正的卡點，系統會記下來 —— <b>那比事後回想準</b>。<br>
  整段都通了 → 按「讀懂了」，然後換到 <b>✏️ 填空</b>。<br>
  ⭐ 填空五階：<b>內容詞 → 功能詞 → 整塊 → 只剩提示詞 → 全空</b>，
  最後一階寫得出來，就是真的背起來了。
</div>

<div class="count" id="count"></div>

<div class="today" id="today"></div>

<div class="pick" id="pick">
  <h3><span>選一段</span><span class="tog" id="togList">展開清單</span></h3>
  <div class="nowSeg" id="nowSeg"></div>
  <div id="segList"></div>
</div>

<div class="modebar" id="modebar"></div>
<div id="stage"></div>

<div class="mirror" id="mirror"></div>

<div class="toast" id="toast"></div>

<script src="t1_stock.js"></script>
<script src="t1_gloss.js"></script>
<script>
/* ============================================================
   t1_read.html — T1 25 段的「讀懂」層
   2026-09-05 建立。
   ⚠️ 這頁存在的理由（Owen 2026-09-05 回報）：
     「我看到中文想不出法文後，我先點進去看答案，
       結果我看到法文也不懂為什麼是長這樣。」
   ⭐ 診斷：SRS 的前提是「你已經懂了」，它只排「什麼時候再考你」。
     「第一次搞懂」是另一個動作，而且只需要做一次。
     把解析塞進 Anki 卡背 = 每次 rep 都夾帶說明書 → 拖慢回想又讀不進去。
     → 六層框架（L0 有東西可講 → L1 背得起來）中間缺的就是這一層。

   ⭐ 三個刻意的設計：
   1. 中文預設不出現，點了才給（feedback_french_only_ui：中文當開關不當預設）
   2. ⭐⭐ 點擊本身就是資料 —— 他點哪幾塊 = 真正的卡點分布，比事後回想準
   3. ⛔ 不顯示分母（階梯制）。只顯示「讀懂了幾段」往上長
   ============================================================ */

var LS = 'clb7_t1_read';
var segs = [], cur = null, showAll = false, listOpen = false;

function load() { try { return JSON.parse(localStorage.getItem(LS) || '{}'); } catch(e){ return {}; } }
function save(d) { localStorage.setItem(LS, JSON.stringify(d)); }
function rec(key) { var d = load(); if (!d[key]) d[key] = { done:false, taps:{} }; return d[key]; }

/* ⚠️⚠️ 2026-09-09：所有寫入一律走這裡，⭐ 因為它會蓋上 `last` 時間戳。
   sync_supabase.js 的合併規則是：
     out[k] = (b.last || 0) >= (a.last || 0) ? b : a;   // b＝雲端　a＝本地
   ⛔ **沒有 last 的記錄 → 0 >= 0 恆真 → 永遠取雲端版本，不管本地多新。**
   建這頁時漏了這個欄位，實測時真的看到本地狀態被舊的雲端資料蓋掉。
   ⭐ `last` 是全站約定（quiz／review／sentence_drill／gram_trainer／tense_lens／roleplay 都有）。 */
function edit(key, fn) {
  var d = load();
  if (!d[key]) d[key] = { done:false, taps:{} };
  fn(d[key]);
  d[key].last = Date.now();
  save(d);
  return d[key];
}
function esc(s) { return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('show');
                   setTimeout(function(){ t.classList.remove('show'); },2000); }

function buildSegs() {
  segs = [];
  if (typeof T1_OPENING !== 'undefined')
    segs.push({ key:'opening', name:'開場（自我介紹）', fr:T1_OPENING.fr, sec:T1_OPENING.sec,
                ask:null, cues:T1_OPENING.cues });
  if (typeof T1_STOCK !== 'undefined')
    T1_STOCK.filter(function(s){ return !s.gap; }).forEach(function(s){
      // ⚠️ key ＝ hook+'/'+src，⭐ 光靠 src 不唯一
      segs.push({ key:s.hook + '/' + s.src, name:s.hook, fr:s.fr, sec:s.sec,
                  ask:s.q_fr, askZh:s.q_zh, level:s.level, cues:s.cues });
    });
}

function gloss(key) {
  return (typeof T1_GLOSS !== 'undefined' && T1_GLOSS[key]) ? T1_GLOSS[key] : null;
}

function renderList() {
  var d = load();
  document.getElementById('segList').innerHTML = segs.map(function(s, i){
    var r = d[s.key] || {};
    return '<div class="srow ' + (cur===i?'on ':'') + (r.done?'done':'') + '" data-i="' + i + '">' +
      '<span class="tick">' + (r.done ? '✓' : '·') + '</span>' +
      '<span class="nm">' + esc(s.name) +
        (s.askZh ? '<small>' + esc(s.askZh) + '</small>' : '<small>主動開場</small>') + '</span>' +
      '<span class="meta">' + (s.sec||'') + 's</span></div>';
  }).join('');
  Array.prototype.forEach.call(document.querySelectorAll('.srow'), function(el){
    el.addEventListener('click', function(){
      cur = +el.dataset.i; showAll = false; listOpen = false;
      renderList(); renderModebar(); renderStage();
      window.scrollTo({ top:0, behavior:'smooth' });
    });
  });
  // ⚠️ 25 列清單會把畫面吃光（手機更糟）→ 選了段就收合，只留一行顯示目前在哪一段
  var pick = document.getElementById('pick');
  var fold = cur !== null && !listOpen;
  pick.classList.toggle('fold', fold);
  document.getElementById('togList').textContent = fold ? '換一段' : '收起清單';
  document.getElementById('nowSeg').innerHTML = fold
    ? esc(segs[cur].name) + '<small>' + esc(segs[cur].askZh || '主動開場') + '</small>' : '';

  var done = segs.filter(function(s){ return (d[s.key]||{}).done; }).length;
  // ⛔ 不顯示分母 —— 只顯示往上長的那個數字
  document.getElementById('count').innerHTML = done
    ? '讀懂了 <b>' + done + '</b> 段'
    : '<span style="color:#4a4436">還沒開始 — 挑一段吧</span>';
}

/* ⭐ 把原文切成「可點的塊」＋「塊之間的原文」，
   ⛔ 一個字都不能漏 —— 只顯示 blocks 會讓原文缺字。 */
function segment(fr, blocks) {
  var out = [], pos = 0;
  (blocks||[]).forEach(function(b, bi){
    var at = fr.indexOf(b.fr, pos);
    if (at < 0) return;                       // 對不上就跳過（檢查器會抓）
    if (at > pos) out.push({ t:'gap', s:fr.slice(pos, at) });
    out.push({ t:'bk', s:b.fr, i:bi });
    pos = at + b.fr.length;
  });
  if (pos < fr.length) out.push({ t:'gap', s:fr.slice(pos) });
  return out;
}

/* 哪些文法點屬於這一塊：points[].fr 落在這塊裡面就算 */
function ptsFor(g, blockText) {
  return (g && g.points || []).filter(function(p){ return blockText.indexOf(p.fr) >= 0; });
}

/* ⭐ 有些文法點是**跨整段**的（例如「這段為什麼整段用未來式」：je devrai / ce sera / je ferai），
   對不到任何單一塊。⚠️ 2026-09-05 實測發現有 12 個這種點，原本會永遠不顯示。
   → 它們其實是最有價值的一類（回答「為什麼這一段是這個時態」），單獨放在段層級。 */
function ptsWhole(g) {
  if (!g) return [];
  return (g.points || []).filter(function(p){
    return !(g.blocks || []).some(function(b){ return b.fr.indexOf(p.fr) >= 0; });
  });
}

function ptHtml(pt) {
  return '<span class="pt"><span class="frag">' + esc(pt.fr) + '</span> — ' + esc(pt.note) +
    (pt.n ? '<br><a class="cx" href="map.html#cx-' + esc(pt.n) + '" target="_blank">📍 ' + esc(pt.n) + ' 去宮殿看</a>'
          : '<br><span class="nocx">📍 codex 還沒有這一條</span>') + '</span>';
}

/* ════════════════════════════════════════════════════════════
   填空模式（2026-09-09 Owen 提的，已拍板）
   ------------------------------------------------------------
   > 「語言島變口說可能也是類似成翻譯填空慢慢轉換成一整段背誦。
   >   這樣的循序漸進比較能背得起來，也可以利用填空的框架做訓練。」

   ⭐ 為什麼這個設計是對的（三條，都有依據）：
   1. 它正好補上他卡住的那一階：六步進程「②翻譯法文 → ③背起來」中間沒有橋，
      而他自己說「我根本沒有背起來的那段」。填空是連續的橋：挖一個詞 → 挖半句 → 全空＝背誦。
   2. ⭐⭐ 它是研究裡可靠度最高的回饋型態。2026-09-06 研究結論：
      自學唯一可靠的機制是「**有答案鍵的二元比對**」——填空天生有答案鍵，
      對錯是二元的，⛔ 不需要他有判斷力（而自評的實測命中率只有 25%）。
   3. ⭐⭐⭐ 燃料已經存在：t1_gloss.js 的 blocks 本來是為「讀懂」做的，
      但它同時就是填空的天然單位——每塊有中文、有法文、而且是**有意義的語塊**
      （⛔ 不是隨機挖字）。做這個不需要新內容。

   ⭐ 五階，刻意不是「挖的比例從 20% 長到 100%」：
     1 內容詞   靠中文意思就想得出來 → 最低門檻
     2 功能詞   ⭐ 冠詞/介系詞/變位——**內容詞你靠中文能猜，功能詞不行**，而扣分的往往是後者
     3 整塊     用 gloss 的 blocks 當單位
     4 只剩提示詞  cues（本來就有的支架）
     5 全空     ＝ 背誦
   ⚠️ 每階的空格數比照 table_drill 的教訓上限 ~8 格（Owen：一頁五格最剛好，至多十格）。
   ⭐ 每次重做會重新抽要挖哪幾格 —— 那是刻意的「變異排程」
     （2026-09-06 研究：同段可以練很多次，但問題不是次數多，是每次做同一件事）。
   ════════════════════════════════════════════════════════════ */

var mode = 'read';           // 'read' | 'cloze'
var MAX_BLANKS = 8;
var STAGES = [
  { n:1, name:'內容詞',   note:'挖掉名詞、動詞這些「有意思」的字。⭐ 靠中文想得出來，先建立信心。' },
  { n:2, name:'功能詞',   note:'⭐ 改挖冠詞、介系詞、變位。這些中文提示幫不了你——而扣分的往往正是這些。' },
  { n:3, name:'整塊',     note:'一次挖掉一整個語塊，只留中文提示。⭐ 這一階開始練「組裝」不是「填字」。' },
  { n:4, name:'只剩提示詞', note:'只看幾個關鍵詞，把整段寫出來。⭐ 這就是你六步裡的「看提示詞快速講完」。' },
  { n:5, name:'全空',     note:'什麼都不給，直接寫。⭐ 寫得出來 ＝ 這段真的背起來了。' }
];

/* 法文的功能詞（封閉集合，⭐ 所以可以硬寫，不需要詞性標註器）。
   ⚠️ 不在這張表裡的字一律視為內容詞。 */
var FUNC = new Set(('le la les l un une des du de d au aux ' +
  'a à en dans sur sous avec pour par chez entre vers depuis pendant avant après sans contre ' +
  'je j tu il elle on nous vous ils elles me m te t se s lui leur y moi toi eux ' +
  'qui que qu où dont ce c cet cette ces celui celle ceux ' +
  'mon ma mes ton ta tes son sa ses notre nos votre vos leurs ' +
  'et mais ou donc car ni quand si comme lorsque puisque ' +
  'suis es est sommes êtes sont ai as avons avez ont ' +
  'étais était étions étiez étaient avais avait avions aviez avaient ' +
  'serai sera serons serez seront aurai aura aurons aurez auront été eu ' +
  'ne n pas plus jamais rien personne aucun aucune ' +
  'très bien aussi tout tous toute toutes même encore déjà toujours peu trop ' +
  'plusieurs quelques chaque autre autres').split(' '));

function deacc(x){ return String(x).normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function norm(x){ return deacc(String(x)).toLowerCase().replace(/[^a-z0-9']/g,''); }

/** 是不是功能詞：拆撇號，⭐ 全部都是功能詞才算功能詞（l'ami → ami 是內容詞） */
function isFunc(tok){
  var parts = norm(tok).split("'").filter(Boolean);
  if (!parts.length) return false;
  return parts.every(function(p){ return FUNC.has(p) || FUNC.has(deacc(p)); });
}

/** 把法文切成 token（保留原始間隔與標點） */
function tokenize(fr){
  var out = [], re = /[A-Za-zÀ-ÿ]+(?:[''][A-Za-zÀ-ÿ]+)*/g, last = 0, m;
  while ((m = re.exec(fr))) {
    if (m.index > last) out.push({ t:fr.slice(last, m.index), w:false });
    out.push({ t:m[0], w:true });
    last = m.index + m[0].length;
  }
  if (last < fr.length) out.push({ t:fr.slice(last), w:false });
  return out;
}

function shuffleIdx(a){
  a = a.slice();
  for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}

function czStage(key){
  var d = load();
  return (d[key] && d[key].cz) || 1;
}
function setCzStage(key, n){
  edit(key, function(r){ r.cz = n; if (!r.czPassed) r.czPassed = {}; });
}
function czPassed(key){ var d = load(); return (d[key] && d[key].czPassed) || {}; }
function markCzPassed(key, n){
  edit(key, function(r){ if (!r.czPassed) r.czPassed = {}; r.czPassed[n] = true; });
}

/* ════════════════════════════════════════════════════════════
   今天練哪幾段（2026-09-09）
   ⚠️ Owen：「這個背誦填表格對我來說滿有效的，跟 anki 差不多方便，可以成為輸入主力。」
   ⭐⭐ 但填空缺的正是 Anki 有的那一半：**排程**。
     Anki 真正的價值不是卡片，是「今天該複習哪幾張」。
     25 段 × 5 階靠腦袋記是不可能的 → ⛔ 沒有排程，這個工具一個禮拜後就會廢掉。

   ⛔ 刻意不做完整 SRS —— 那是 Anki 的工作，重複做沒有意義。
   ⭐ 只做一條規則：**階數低的先，同階則最久沒碰的先。**

   ⚠️ 只排「已讀懂」的段 —— 那是他自己確認過的依賴（不懂的字串填了也是背字串）。
   ⛔ 不顯示分母、不顯示落後（階梯制）；⛔ 措辭不催促（「上次 5 天前」，不是「你 5 天沒練了！」）
   ════════════════════════════════════════════════════════════ */
var TODAY_N = 5;   // ⭐ 跟純生成卡的每日上限一致（memory feedback_production_vs_recognition_load）

function agoText(days){
  if (days >= 999) return '還沒練過';
  if (days <= 0) return '今天練過';
  if (days === 1) return '昨天';
  return days + ' 天前';
}

function todayList(n){
  var d = load();
  var rows = segs.map(function(s, i){
    var r = d[s.key] || {};
    var passed = r.czPassed || {};
    var last = r.czAt || 0;
    return {
      i: i, s: s,
      st: r.cz || 1,
      done5: !!passed[5],
      days: last ? Math.floor((Date.now() - last) / 864e5) : 999,
      read: !!r.done
    };
  });
  var pool = rows.filter(function(x){ return x.read; })
                 // ⭐ 已經走完第 5 階的，隔 7 天以上才回來（分散練習，⛔ 不是永遠消失）
                 .filter(function(x){ return !x.done5 || x.days >= 7; });
  pool.sort(function(a, b){
    if (a.st !== b.st) return a.st - b.st;
    return b.days - a.days;
  });
  return { list: pool.slice(0, n), unread: rows.filter(function(x){ return !x.read; }).length };
}

function renderToday(){
  var el = document.getElementById('today');
  var t = todayList(TODAY_N);
  if (!t.list.length) {
    el.innerHTML = '<h3><span>今天練這幾段</span></h3>' +
      '<div class="none">' +
      (t.unread
        ? '還沒有讀懂任何一段。⭐ 先挑一段用 <b>📖 讀懂</b> 看過，按「讀懂了」，它就會出現在這裡。'
        : '都走完了 —— ⭐ 過幾天再回來，那是刻意的（分散練習）。') +
      '</div>';
    return;
  }
  el.innerHTML =
    '<h3><span>今天練這幾段</span><span class="hint">階數低的先 · 同階最久沒碰的先</span></h3>' +
    t.list.map(function(x){
      return '<div class="trow" data-i="' + x.i + '">' +
        '<span class="st">' + x.st + ' ' + STAGES[x.st-1].name + '</span>' +
        '<span class="nm">' + esc(x.s.name) +
          '<small>' + esc(x.s.askZh || '主動開場') + '</small></span>' +
        '<span class="ago">' + agoText(x.days) + '</span></div>';
    }).join('') +
    (t.unread ? '<div class="none" style="margin-top:9px;font-size:.72rem">⭐ 還有 ' + t.unread +
       ' 段沒讀懂 —— 讀懂之後才會排進來</div>' : '');
  Array.prototype.forEach.call(el.querySelectorAll('.trow'), function(r){
    r.addEventListener('click', function(){
      cur = +r.dataset.i; mode = 'cloze'; listOpen = false; showAll = false;
      renderList(); renderModebar(); renderStage();
      window.scrollTo({ top:0, behavior:'smooth' });
    });
  });
}

function renderModebar(){
  var el = document.getElementById('modebar');
  if (cur === null) { el.innerHTML = ''; return; }
  var s = segs[cur], r = rec(s.key), st = czStage(s.key);
  el.innerHTML =
    '<div class="mbtn ' + (mode==='read'?'on':'') + '" data-m="read">📖 讀懂' +
      '<small>' + (r.done ? '✓ 已讀懂' : '先把這段看懂') + '</small></div>' +
    '<div class="mbtn ' + (mode==='cloze'?'on':'') + '" data-m="cloze">✏️ 填空' +
      '<small>第 ' + st + ' 階 · ' + STAGES[st-1].name + '</small></div>';
  Array.prototype.forEach.call(el.querySelectorAll('.mbtn'), function(b){
    b.addEventListener('click', function(){ mode = b.dataset.m; renderModebar(); renderStage(); });
  });
}

var czState = null;   // { kind, items:[...], stage }

function renderCloze(){
  var host = document.getElementById('stage');
  var s = segs[cur], g = gloss(s.key);
  if (!g) { host.innerHTML = '<div class="text"><div class="empty">這一段還沒有解析，填空需要它</div></div>'; return; }
  var st = czStage(s.key), spec = STAGES[st-1], passed = czPassed(s.key);

  var head = '<div class="stg">' + STAGES.map(function(x){
    return '<button class="s ' + (x.n===st?'on ':'') + (passed[x.n]?'done':'') +
           '" data-s="' + x.n + '">' + x.n + ' ' + x.name + '</button>';
  }).join('') + '</div><div class="stgNote">' + spec.note + '</div>';

  var body = '';
  czState = { stage:st, items:[] };

  if (st === 1 || st === 2) {
    // ── 詞層填空：挑「內容詞」或「功能詞」，⭐ 每次重抽（變異排程）
    var toks = tokenize(s.fr);
    var cand = [];
    toks.forEach(function(t, i){
      if (!t.w) return;
      var f = isFunc(t.t);
      if ((st === 1 && !f) || (st === 2 && f)) cand.push(i);
    });
    var pick = shuffleIdx(cand).slice(0, MAX_BLANKS).sort(function(a,b){ return a-b; });
    var bi = 0;
    body = '<div class="cz">' + toks.map(function(t, i){
      if (pick.indexOf(i) >= 0) {
        czState.items.push({ id:'cz'+bi, ans:t.t });
        var w = Math.max(56, t.t.length * 13);
        return '<input id="cz' + (bi++) + '" style="width:' + w + 'px" autocomplete="off" ' +
               'autocorrect="off" autocapitalize="none" spellcheck="false">';
      }
      return esc(t.t).replace(/\n\n/g, '<br><br>');
    }).join('') + '</div>';
  }
  else if (st === 3) {
    // ── 塊層填空：用 gloss 的 blocks 當單位，⭐ 只留中文提示
    var parts = segment(s.fr, g.blocks);
    var bIdx = parts.map(function(p, i){ return p.t === 'bk' ? i : -1; }).filter(function(i){ return i >= 0; });
    var take = shuffleIdx(bIdx).slice(0, Math.max(2, Math.ceil(bIdx.length / 2)))
                 .sort(function(a,b){ return a-b; });
    var k = 0;
    body = '<div class="cz">' + parts.map(function(p, i){
      if (p.t === 'gap') return esc(p.s).replace(/\n\n/g, '<br><br>');
      var b = g.blocks[p.i];
      if (take.indexOf(i) < 0) return esc(b.fr);
      czState.items.push({ id:'cz'+k, ans:b.fr, zh:b.zh });
      return '<span class="zhcue">〔' + esc(b.zh) + '〕</span> ' +
             '<input id="cz' + (k++) + '" style="width:' + Math.max(120, b.fr.length*9) + 'px" ' +
             'autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">';
    }).join('') + '</div>';
  }
  else {
    // ── 4：只剩提示詞　5：全空　→ ⭐ 整段寫，用 blocks 逐塊比對（不是自由比對）
    var cueHtml = '';
    if (st === 4) {
      var cues = s.cues || [];
      cueHtml = cues.length
        ? '<div class="cz" style="line-height:2.1;font-size:.92rem">' +
          cues.map(function(c){ return '<span class="blk">' + esc(c) + '</span>'; }).join(' ') + '</div>'
        : '<div class="stgNote">這一段沒有提示詞，等同第 5 階</div>';
    }
    body = cueHtml + '<div class="czArea" style="margin-top:12px">' +
           '<textarea id="czText" placeholder="把整段寫出來…"></textarea></div>';
    g.blocks.forEach(function(b, i){ czState.items.push({ id:'blk'+i, ans:b.fr, zh:b.zh }); });
  }

  var ACC = ['é','è','ê','à','â','ç','ù','û','î','ï','ô','œ'];
  var accBar = '<div class="acc">' + ACC.map(function(a){
    return '<button data-a="' + a + '">' + a + '</button>'; }).join('') + '</div>';

  host.innerHTML = '<div class="text">' +
      (s.ask ? '<div class="ask">（考官問）' + esc(s.ask) + '</div>' : '') +
      head + body + accBar +
      '<div class="score" id="czScore"></div>' +
      '<div class="cmp" id="czCmp"></div>' +
    '</div>' +
    '<div class="bar">' +
      '<button class="b-done" id="czCheck">對答案</button>' +
      '<button class="b-all" id="czAgain">🔁 換一批再來</button>' +
      (st < 5 ? '<button class="b-next" id="czUp">下一階 →</button>' : '') +
    '</div>';

  Array.prototype.forEach.call(host.querySelectorAll('.stg .s'), function(b){
    b.addEventListener('click', function(){ setCzStage(s.key, +b.dataset.s); renderModebar(); renderStage(); renderToday(); });
  });
  Array.prototype.forEach.call(host.querySelectorAll('.acc button'), function(b){
    b.addEventListener('click', function(){
      var el = document.activeElement;
      if (!el || (el.tagName !== 'INPUT' && el.tagName !== 'TEXTAREA')) return;
      var p = el.selectionStart;
      el.value = el.value.slice(0,p) + b.dataset.a + el.value.slice(el.selectionEnd);
      el.selectionStart = el.selectionEnd = p + 1; el.focus();
    });
  });
  document.getElementById('czCheck').addEventListener('click', checkCloze);
  document.getElementById('czAgain').addEventListener('click', renderStage);
  var up = document.getElementById('czUp');
  if (up) up.addEventListener('click', function(){
    setCzStage(s.key, Math.min(5, st + 1)); renderModebar(); renderStage(); renderToday();
    window.scrollTo({ top:0, behavior:'smooth' });
  });
}

/* ⭐ 對答案：二元比對，⛔ 不需要他判斷。
   ⚠️ 缺重音算「對，但重音」（黃色）不算錯——這一階練的是想得起來，不是拼字；
   但也不能靜靜放過，不然會養成習慣（寫作的 orthographe 是實扣的）。 */
function checkCloze(){
  if (!czState) return;
  var s = segs[cur], ok = 0, warn = 0, rows = '';
  // ⭐ 記下「這一段今天碰過了」——排程只靠這個
  edit(s.key, function(r){ r.czAt = Date.now(); });

  if (czState.stage <= 3) {
    czState.items.forEach(function(it){
      var el = document.getElementById(it.id);
      if (!el) return;
      var v = el.value.trim();
      var exact = norm(v) === norm(it.ans) && deacc(v).toLowerCase() === deacc(it.ans).toLowerCase()
                  && v.toLowerCase() === it.ans.toLowerCase();
      var loose = norm(v) === norm(it.ans);
      el.className = exact ? 'ok' : (loose ? 'warn' : 'bad');
      if (exact) ok++;
      else if (loose) { warn++; el.value = it.ans; }
      else el.value = v ? v + ' → ' + it.ans : it.ans;
    });
    var tot = czState.items.length;
    document.getElementById('czScore').innerHTML =
      '<b>' + ok + '</b> / ' + tot + ' 全對' +
      (warn ? '　<span style="color:#e0c060">' + warn + ' 個只差重音（已幫你補上）</span>' : '');
    if (ok + warn === tot) {
      markCzPassed(s.key, czState.stage);
      toast('✓ 這一階過了');
      renderModebar(); renderToday();
    }
    return;
  }

  // 第 4／5 階：逐塊比對 ——⭐ 用 blocks 當欄位，⛔ 不是「自己看哪裡不一樣」
  //   （2026-09-06 研究：自由比對的注意力 71.94% 會跑到詞彙、只有 8.39% 在文法）
  var typed = norm(document.getElementById('czText').value);
  czState.items.forEach(function(it){
    var hit = typed.indexOf(norm(it.ans)) >= 0;
    if (hit) ok++;
    rows += '<div class="row ' + (hit ? 'hit' : 'miss') + '">' +
            '<span class="mk">' + (hit ? '✓' : '✗') + '</span>' +
            '<span class="fr">' + esc(it.ans) + '</span>' +
            '<span class="zh">' + esc(it.zh || '') + '</span></div>';
  });
  document.getElementById('czScore').innerHTML =
    '<b>' + ok + '</b> / ' + czState.items.length + ' 塊寫出來了';
  document.getElementById('czCmp').innerHTML = rows;
  if (ok === czState.items.length) { markCzPassed(s.key, czState.stage); toast('✓ 這一階過了'); renderModebar(); renderToday(); }
}

function renderStage() {
  var host = document.getElementById('stage');
  if (cur === null) { host.innerHTML = ''; document.getElementById('modebar').innerHTML=''; renderMirror(); return; }
  if (mode === 'cloze') { renderCloze(); renderMirror(); return; }
  var s = segs[cur], g = gloss(s.key), r = rec(s.key);

  var head = '';
  if (s.ask) head = '<div class="ask">（考官問）' + esc(s.ask) +
                    '<br><span style="color:#5a5344">' + esc(s.askZh||'') + '</span></div>';

  var body;
  if (!g) {
    body = '<div class="empty">這一段還沒有解析<br><span style="font-size:.72rem">（跑 tools/gen 之後會出現）</span></div>' +
           '<div class="para">' + esc(s.fr).replace(/\n\n/g,'</div><div class="para">') + '</div>';
  } else {
    var parts = segment(s.fr, g.blocks);
    var html = '', open = 0;
    parts.forEach(function(p){
      if (p.t === 'gap') {
        html += '<span class="gap">' + esc(p.s).replace(/\n\n/g, '</div><div class="para">') + '</span>';
      } else {
        var b = g.blocks[p.i];
        var pts = ptsFor(g, b.fr);
        var isOpen = showAll || r.taps['b' + p.i];
        if (isOpen) open++;
        html += '<span class="bk ' + (pts.length?'hasPt ':'') + (isOpen?'open':'') +
                '" data-b="' + p.i + '">' + esc(b.fr) + '</span>';
        if (isOpen) {
          html += '<span class="rv"><span class="zh">' + esc(b.zh) + '</span>';
          pts.forEach(function(pt){ html += ptHtml(pt); });
          html += '</span>';
        }
      }
    });
    body = '<div class="para">' + html + '</div>';
    var wp = ptsWhole(g);
    if (wp.length) {
      var wOpen = showAll || r.whole;
      body += '<div class="whole"><button class="wbtn">' +
        (wOpen ? '收起' : '這一段整體還有 ' + wp.length + ' 個文法點（時態、句型的整體用法）') +
        '</button>' + (wOpen ? '<div class="wbody rv">' + wp.map(ptHtml).join('') + '</div>' : '') + '</div>';
    }
  }

  host.innerHTML = '<div class="text">' + head + body + '</div>' +
    '<div class="bar">' +
      '<button class="b-all">' + (showAll ? '收起全部' : '全部展開') + '</button>' +
      '<button class="b-done ' + (r.done?'is':'') + '">' + (r.done ? '✓ 已標記讀懂' : '讀懂了') + '</button>' +
      '<button class="b-next">下一段 →</button>' +
    '</div>';

  Array.prototype.forEach.call(host.querySelectorAll('.bk'), function(el){
    el.addEventListener('click', function(){
      var k = 'b' + el.dataset.b;
      edit(s.key, function(r){
        // ⭐ 點開＝記一次卡點；再點收起但**不扣次數**（卡過就是卡過）
        if (r.taps[k]) delete r.taps[k]; else r.taps[k] = (r.taps[k]||0) + 1;
        if (!r.hits) r.hits = {};
        r.hits[k] = (r.hits[k]||0) + 1;
      });
      renderStage();
    });
  });
  var wb = host.querySelector('.wbtn');
  if (wb) wb.addEventListener('click', function(){
    edit(s.key, function(r){ r.whole = !r.whole; });
    renderStage();
  });
  host.querySelector('.b-all').addEventListener('click', function(){ showAll = !showAll; renderStage(); });
  host.querySelector('.b-done').addEventListener('click', function(){
    var r = edit(s.key, function(r){ r.done = !r.done; });
    toast(r.done ? '✓ 這段可以進 Anki 了' : '取消標記');
    renderList(); renderStage(); renderMirror(); renderToday();
  });
  host.querySelector('.b-next').addEventListener('click', function(){
    cur = (cur + 1) % segs.length; showAll = false; listOpen = false;
    renderList(); renderModebar(); renderStage();
    window.scrollTo({ top:0, behavior:'smooth' });
  });
  renderMirror();
}

/* ⭐ 鏡子：你點最多的是哪幾塊 —— ⛔ 不是分數、不是責備，是卡點分布 */
function renderMirror() {
  var d = load(), all = [];
  segs.forEach(function(s){
    var r = d[s.key]; if (!r || !r.hits) return;
    var g = gloss(s.key); if (!g) return;
    Object.keys(r.hits).forEach(function(k){
      var i = +k.slice(1), b = (g.blocks||[])[i];
      if (b) all.push({ fr:b.fr, n:r.hits[k], seg:s.name });
    });
  });
  all.sort(function(a,b){ return b.n - a.n; });
  var el = document.getElementById('mirror');
  if (!all.length) {
    el.innerHTML = '<h3>你的卡點</h3><div class="empty">還沒有資料 — 點開幾塊之後這裡會長出來</div>';
    return;
  }
  el.innerHTML = '<h3>你的卡點（點開最多次的）</h3>' +
    all.slice(0, 8).map(function(x){
      return '<div><span class="hot">' + esc(x.fr) + '</span>　<span style="color:#5a5344">' +
             esc(x.seg) + '　' + x.n + ' 次</span></div>';
    }).join('') +
    '<div style="margin-top:10px;font-size:.72rem;color:#5a5344">⭐ 同一塊反覆點開＝那個結構還沒進去，' +
    '⛔ 不是你笨。這份清單就是該優先補的文法點。</div>';
}

document.getElementById('togList').addEventListener('click', function(){
  listOpen = !listOpen; renderList();
});

buildSegs();
renderList();
renderToday();
</script>

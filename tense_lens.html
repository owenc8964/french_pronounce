<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

<script src="tense_lens.js"></script>
<script>
// ── 常數 ─────────────────────────────────────────────────────
const INTERVALS = [1, 3, 7, 14, 30];
const NEW_PER_DAY = 8;      // 感知塊要常遇到，給得比造句(5)寬
const ROUND_SIZE  = 12;

const SW_LABEL = {
  1: { reel:'報告現實', dist:'保留距離', stance:'表達立場', act:'推動對方行動' },
  2: { passe:'過去', present:'現在', futur:'未來', na:'由主句決定' },
  3: { event:'完整事件', scene:'展開中的畫面', na:'這題不適用' },
  4: { direct:'直接看它', done:'已經完成' },
};

// ── localStorage ─────────────────────────────────────────────
function getSrs()   { try { return JSON.parse(localStorage.getItem('clb7_lens_srs')) || {}; } catch { return {}; } }
function saveSrs(s) { localStorage.setItem('clb7_lens_srs', JSON.stringify(s)); }
function getSessions() { try { return JSON.parse(localStorage.getItem('clb7_lens_sessions')) || []; } catch { return []; } }
function todayStr() {
  return new Date().toLocaleDateString('zh-TW', {year:'numeric',month:'2-digit',day:'2-digit'});
}
function dayStart(d = new Date()) { const t = new Date(d); t.setHours(0,0,0,0); return t.getTime(); }
function newCountToday() {
  try {
    const v = JSON.parse(localStorage.getItem('clb7_lens_newcount'));
    return (v && v.date === todayStr()) ? v.n : 0;
  } catch { return 0; }
}
function bumpNewCount() {
  localStorage.setItem('clb7_lens_newcount', JSON.stringify({ date: todayStr(), n: newCountToday() + 1 }));
}
function isGraduated(rec) { return rec && (rec.days||[]).length >= 3 && rec.iv >= 3; }

// ── 等級篩選 ─────────────────────────────────────────────────
function getLevelMode() { return localStorage.getItem('lens_level') === 'learned' ? 'learned' : 'all'; }
function setLevelMode(m) { localStorage.setItem('lens_level', m); }

// ?cx=5-4-1 → 只練這個座標（從 map.html 的記憶宮殿條目直接跳過來用）
// 收兩種：題目自己的 cx，以及題目所屬格子的 cx（例如 5-4-1 要收得到全部 pqp 題）
const FOCUS_CX = new URLSearchParams(location.search).get('cx');
function inFocus(c) {
  if (!FOCUS_CX) return true;
  return c.cx === FOCUS_CX || (CELLS[c.cell] && CELLS[c.cell].cx === FOCUS_CX);
}
function pool() {
  const base = getLevelMode() === 'learned'
    ? LENS.filter(c => c.lvl === 'A1' || c.lvl === 'A2')
    : LENS;
  const f = base.filter(inFocus);
  // 聚焦後如果一題都不剩（例如只練已學但那條是 B2），就不要給空白畫面，退回全部等級
  if (FOCUS_CX && !f.length) return LENS.filter(inFocus);
  return f;
}

// ── 🔴 不熟旗標（跟 review/sentence_drill 共用 clb7_hard_flags；TL_ 前綴不會撞）
const FLAG_BONUS_MAX = 2;
function getFlags() { try { return JSON.parse(localStorage.getItem('clb7_hard_flags')) || {}; } catch { return {}; } }
function saveFlags(f) { localStorage.setItem('clb7_hard_flags', JSON.stringify(f)); }
function flagCard(id) {
  const f = getFlags(); const r = f[id] || { count: 0 };
  r.count++; r.last = todayStr(); f[id] = r; saveFlags(f); return r.count;
}
function renderFlagBadge(id) {
  const f = getFlags(); const n = f[id] ? f[id].count : 0;
  document.getElementById('flagCount').textContent = n > 0 ? ('×' + n) : '';
  document.getElementById('btnFlag').classList.toggle('flagged', n > 0);
}
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function dueCards() {
  const srs = getSrs(), now = dayStart();
  const list = pool().filter(c => srs[c.id] && srs[c.id].due <= now && !isGraduated(srs[c.id]));
  return shuffle(list).sort((a,b) => srs[a.id].due - srs[b.id].due);
}
function newCards() {
  const srs = getSrs();
  // 新題：先把已學等級跑熟再往上，等級內亂序（避免照題庫順序＝可預測的模式，見 FRENCH_OS 設計鐵律）
  const rank = { A1:0, A2:1, B1:2, B2:3 };
  return shuffle(pool().filter(c => !srs[c.id])).sort((a,b) => rank[a.lvl] - rank[b.lvl]);
}
function gradCount() { const srs = getSrs(); return pool().filter(c => isGraduated(srs[c.id])).length; }
function bonusFlagged(exclude = new Set()) {
  const flags = getFlags(), srs = getSrs(), now = dayStart();
  const naturallyDue = c => srs[c.id] && srs[c.id].due <= now && !isGraduated(srs[c.id]);
  return pool()
    .filter(c => flags[c.id] && flags[c.id].count > 0 && !naturallyDue(c) && !exclude.has(c.id))
    .sort((a,b) => flags[b.id].count - flags[a.id].count)
    .slice(0, FLAG_BONUS_MAX);
}

// ── 發音（跟全站同一套語音優先序）─────────────────────────────
let frVoice = null;
function pickVoice() {
  const vs = speechSynthesis.getVoices().filter(v => v.lang.toLowerCase().startsWith('fr'));
  frVoice = vs.find(v => /am[eé]lie|thomas/i.test(v.name))
         || vs.find(v => /premium|enhanced|amélior|plus/i.test(v.name))
         || vs.find(v => v.localService === false)
         || vs.find(v => v.lang === 'fr-FR') || vs[0] || null;
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/\(.*?\)/g, '').trim());
  u.lang = 'fr-FR'; u.rate = 0.9;
  if (frVoice) u.voice = frVoice;
  speechSynthesis.speak(u);
}

// ── 錯題本 ───────────────────────────────────────────────────
function logWrong(entry) {
  try {
    const log = JSON.parse(localStorage.getItem('clb7_wrong_log')) || [];
    const d = todayStr();
    const dup = log.find(e => e.d === d && e.src === entry.src && e.q === entry.q);
    if (dup) { dup.n = (dup.n||1) + 1; dup.t = Date.now(); }
    else log.push({ ...entry, d, t: Date.now(), n: 1 });
    localStorage.setItem('clb7_wrong_log', JSON.stringify(log.slice(-300)));
  } catch(e) {}
}

// ── 狀態 ─────────────────────────────────────────────────────
let packet = [], idx = 0, answers = {}, revealed = false;
let firstTryOk = 0, firstTryTotal = 0, attempted = new Set();
let missed = [], retryQueue = [], inRetry = false;

function buildPacket() {
  // 聚焦模式是「從條目跳過來想馬上練這條」，不受每日新題上限與到期排程限制
  if (FOCUS_CX) return shuffle(pool().map(c => ({ card: c, isNew: false }))).slice(0, ROUND_SIZE);
  const due = dueCards().map(c => ({ card: c, isNew: false }));
  const room = Math.max(0, NEW_PER_DAY - newCountToday());
  if (room > 0) newCards().slice(0, room).forEach(c => due.push({ card: c, isNew: true }));
  const already = new Set(due.map(p => p.card.id));
  bonusFlagged(already).forEach(c => due.push({ card: c, isNew: false, isBonus: true }));
  return shuffle(due).slice(0, ROUND_SIZE);
}

// ── 畫面 ─────────────────────────────────────────────────────
function escapeHtml(s) {
  return s.replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
}
// target 可能用直/彎撇號，比對時正規化，但輸出保留原字串
function highlight(fr, target) {
  const norm = x => x.replace(/[’‘]/g, "'");
  const nf = norm(fr), nt = norm(target);
  const i = nf.indexOf(nt);
  if (i < 0) return escapeHtml(fr);
  return escapeHtml(fr.slice(0, i)) + '<mark>' + escapeHtml(fr.slice(i, i + target.length)) + '</mark>' + escapeHtml(fr.slice(i + target.length));
}

function renderStart() {
  const srs = getSrs();
  if (FOCUS_CX) {
    const n = pool().length;
    // 標籤要抓「座標對應的那個格子」，不是池子第一題的格子——
    // 5-4-1 的雙動詞句同時含 pc，抓第一題會顯示成 passé composé
    const key = Object.keys(CELLS).find(k => CELLS[k].cx === FOCUS_CX);
    const lab = key ? CELLS[key].label : '';
    document.getElementById('focusBox').style.display = 'block';
    document.getElementById('focusTxt').textContent =
      '🎯 聚焦 codex ' + FOCUS_CX + (lab ? '（' + lab + '）' : '') + '：這一輪只出這條的 ' + n + ' 題，不受每日新題上限與到期排程限制。';
  }
  document.getElementById('stDue').textContent  = dueCards().length;
  document.getElementById('stNew').textContent  = Math.max(0, NEW_PER_DAY - newCountToday());
  document.getElementById('stGrad').textContent = gradCount() + '/' + pool().length;
  const mode = getLevelMode();
  document.getElementById('lvlLearned').classList.toggle('on', mode === 'learned');
  document.getElementById('lvlAll').classList.toggle('on', mode === 'all');
  document.getElementById('lvlNote').textContent = mode === 'learned'
    ? '只出課本教過的時態（présent / passé composé / imparfait / futur proche / passé récent），共 ' + pool().length + ' 題。'
    : '含還沒教到的 B1–B2 時態（PQP／futur simple／conditionnel／subjonctif／passé simple），共 ' + pool().length + ' 題。這些是「只認不產」——先讓鏡頭認得出來，等課本教到再要求你自己造。';
  document.getElementById('startBtn').disabled = pool().length === 0;
}

function renderCard() {
  const { card } = packet[idx];
  answers = {}; revealed = false;
  document.getElementById('sentZh').textContent = card.zh;
  document.getElementById('sentFr').innerHTML = highlight(card.fr, card.target);
  document.getElementById('revealBox').innerHTML = '';
  [1,2,3,4].forEach(n => {
    const box = document.getElementById('sw' + n);
    box.classList.remove('locked'); box.classList.add('active');
    box.querySelectorAll('.sw-opt').forEach(b => {
      b.disabled = false;
      b.classList.remove('picked','right','wrong');
    });
  });
  document.getElementById('pkPos').textContent =
    (inRetry ? '複習輪 ' : '') + (idx + 1) + ' / ' + packet.length + (packet[idx].isNew ? '　·　新' : '');
  document.getElementById('pkScore').textContent =
    firstTryTotal ? firstTryOk + '/' + firstTryTotal : '';
  renderFlagBadge(card.id);
}

function onPick(e) {
  if (revealed) return;
  const btn = e.currentTarget;
  const s = btn.dataset.s;
  answers[s] = btn.dataset.v;
  const box = document.getElementById('sw' + s);
  box.querySelectorAll('.sw-opt').forEach(b => b.classList.remove('picked'));
  btn.classList.add('picked');
  if (answers[1] && answers[2] && answers[3] && answers[4]) doReveal();
}

function doReveal() {
  revealed = true;
  const { card } = packet[idx];
  const cell = CELLS[card.cell];
  const truth = { 1: cell.s1, 2: cell.s2, 3: cell.s3, 4: cell.s4 };
  let allOk = true;
  [1,2,3,4].forEach(n => {
    const box = document.getElementById('sw' + n);
    box.classList.add('locked'); box.classList.remove('active');
    box.querySelectorAll('.sw-opt').forEach(b => {
      b.disabled = true;
      if (b.dataset.v === truth[n]) b.classList.add('right');
      else if (b.dataset.v === answers[n]) b.classList.add('wrong');
    });
    if (answers[n] !== truth[n]) allOk = false;
  });

  const wrongList = [1,2,3,4].filter(n => answers[n] !== truth[n])
    .map(n => '第' + '①②③④'[n-1] + '關：你選「' + SW_LABEL[n][answers[n]] + '」，答案是「' + SW_LABEL[n][truth[n]] + '」');

  document.getElementById('revealBox').innerHTML =
    '<div class="reveal ' + (allOk ? 'ok' : 'no') + '">' +
      '<div class="rv-verdict ' + (allOk ? 'ok' : 'no') + '">' +
        (allOk ? '✓ 四關全對' : '✗ ' + wrongList.join('　／　')) + '</div>' +
      '<div class="rv-cell">' + escapeHtml(cell.label) + '</div>' +
      '<div class="rv-cx">codex <a href="map.html#cx-' + card.cx + '">' + card.cx + '</a>　·　' + card.lvl + '</div>' +
      '<div class="rv-why">' + escapeHtml(card.why) + '</div>' +
    '</div>' +
    '<button class="next-btn" id="nextBtn">' + (idx + 1 >= packet.length ? '看結果 →' : '下一題 →') + '</button>';
  document.getElementById('nextBtn').addEventListener('click', nextCard);

  // 計分＋SRS 一律只看「首答」——複習輪的目的是當日至少成功一次，
  // 不該把首答錯的題目往上推間隔（設計依據見 HANDOFF「複習卡系統設計依據」）
  if (!attempted.has(card.id)) {
    attempted.add(card.id);
    firstTryTotal++;
    if (allOk) firstTryOk++;
    else {
      missed.push({ card, wrongList });
      logWrong({
        src: 'lens',
        q: card.fr + '　→　' + card.target,
        a: cell.label,
        note: wrongList.join('；'),
        title: 'codex ' + card.cx,
      });
    }
    updateSrs(card, allOk);
  }
  // 答錯就回鍋（含複習輪再錯），直到當天答對一次為止
  if (!allOk) retryQueue.push({ card, isNew: false });
  document.getElementById('pkScore').textContent = firstTryOk + '/' + firstTryTotal;
}

function updateSrs(card, ok) {
  const srs = getSrs();
  const rec = srs[card.id] || { iv: 0, days: [], ok: 0, no: 0 };
  const today = todayStr();
  if (ok) {
    rec.ok = (rec.ok||0) + 1;
    if (!rec.days.includes(today)) rec.days.push(today);
    rec.iv = INTERVALS[Math.min(rec.days.length - 1, INTERVALS.length - 1)] || 1;
  } else {
    rec.no = (rec.no||0) + 1;
    rec.iv = 1;
  }
  rec.last = today;
  rec.due = dayStart() + rec.iv * 86400000;
  if (!srs[card.id] && packet[idx].isNew) bumpNewCount();
  srs[card.id] = rec;
  saveSrs(srs);
}

function nextCard() {
  idx++;
  if (idx < packet.length) { renderCard(); window.scrollTo(0,0); return; }
  if (retryQueue.length) {
    inRetry = true; packet = shuffle(retryQueue); retryQueue = []; idx = 0;
    renderCard(); window.scrollTo(0,0); return;
  }
  finish();
}

function finish() {
  const pct = firstTryTotal ? Math.round(firstTryOk / firstTryTotal * 100) : 0;
  const ses = getSessions();
  ses.push({ date: todayStr(), cards: firstTryTotal, ok: firstTryOk, ts: Date.now() });
  localStorage.setItem('clb7_lens_sessions', JSON.stringify(ses.slice(-100)));
  localStorage.setItem('clb7_lens_done', todayStr());
  try {
    const log = JSON.parse(localStorage.getItem('clb7_lens_log')) || [];
    if (log[log.length-1] !== todayStr()) log.push(todayStr());
    localStorage.setItem('clb7_lens_log', JSON.stringify(log.slice(-90)));
  } catch(e) {}

  document.getElementById('drillView').style.display = 'none';
  const dv = document.getElementById('doneView');
  dv.style.display = 'block';
  dv.innerHTML =
    '<div class="card-box done-box">' +
      '<h2>這輪跑完了</h2>' +
      '<div class="done-score">' + pct + '%</div>' +
      '<div class="done-sub">首答 ' + firstTryOk + ' / ' + firstTryTotal + ' 題四關全對</div>' +
      (missed.length
        ? '<div class="miss-list">' + missed.map(m =>
            '<div class="miss-item"><b>' + escapeHtml(m.card.fr) + '</b><br>' +
            escapeHtml(CELLS[m.card.cell].label) + '　·　' + escapeHtml(m.wrongList.join('；')) + '</div>').join('') +
          '</div>'
        : '<div class="done-sub">沒有漏接的。</div>') +
      '<button class="start-btn" onclick="location.reload()">再跑一輪</button>' +
      '<a href="dashboard.html" style="display:block;margin-top:10px;color:#445060;font-size:0.74rem;text-decoration:none;">← 回儀表板</a>' +
    '</div>';
  window.scrollTo(0,0);
}

// ── 事件 ─────────────────────────────────────────────────────
document.querySelectorAll('.sw-opt').forEach(b => b.addEventListener('click', onPick));
document.getElementById('lvlLearned').addEventListener('click', () => { setLevelMode('learned'); renderStart(); });
document.getElementById('lvlAll').addEventListener('click', () => { setLevelMode('all'); renderStart(); });
document.getElementById('startBtn').addEventListener('click', () => {
  packet = buildPacket();
  if (!packet.length) { alert('今天沒有到期的題目了。可以切「全部到 B2」拿新題，或明天再來。'); return; }
  idx = 0; firstTryOk = 0; firstTryTotal = 0; attempted = new Set();
  missed = []; retryQueue = []; inRetry = false;
  document.getElementById('startView').style.display = 'none';
  document.getElementById('drillView').style.display = 'block';
  renderCard();
});
document.getElementById('btnSpeak').addEventListener('click', () => speak(packet[idx].card.fr));
document.getElementById('btnFlag').addEventListener('click', () => {
  flagCard(packet[idx].card.id); renderFlagBadge(packet[idx].card.id);
});

renderStart();
</script>

<script>
(function(){
  const KEY='clb7_quick_notes';
  const page='tense_lens.html';
  let noteTag = null;
  function loadNotes(){try{return JSON.parse(localStorage.getItem(KEY))||[];}catch{return[];}}
  function saveNotes(d){localStorage.setItem(KEY,JSON.stringify(d));}
  function updateCount(){const n=loadNotes();document.getElementById('qnoteCount').textContent=n.length?`共 ${n.length} 則筆記`:'還沒有筆記';}
  function openPanel(tag){
    noteTag = tag || null;
    const tagEl = document.getElementById('qnoteTag');
    if (noteTag) { tagEl.textContent = '📍 ' + noteTag; tagEl.style.display = 'block'; }
    else { tagEl.style.display = 'none'; }
    document.getElementById('qnotePanel').classList.add('open');
    updateCount();
    document.getElementById('qnoteTxt').focus();
  }
  document.getElementById('qnoteBtn').addEventListener('click', () => {
    document.getElementById('qnotePanel').classList.toggle('open');
    updateCount();
  });
  document.getElementById('btnConfused').addEventListener('click', () => {
    let tag = '';
    try { const c = packet[idx].card; tag = `[codex ${c.cx}] ${c.fr} → ${c.target}`; } catch(e) {}
    openPanel(tag || '這題');
  });
  document.getElementById('qnoteSave').addEventListener('click', () => {
    const txt = document.getElementById('qnoteTxt').value.trim();
    if (!txt) return;
    const notes = loadNotes();
    const d = new Date();
    const prefix = noteTag ? `${noteTag}｜` : '';
    notes.push({
      date: `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`,
      time: `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`,
      page, note: prefix + txt
    });
    saveNotes(notes);
    document.getElementById('qnoteTxt').value = '';
    noteTag = null;
    document.getElementById('qnoteTag').style.display = 'none';
    updateCount();
  });
  document.getElementById('qnoteCopy').addEventListener('click', () => {
    const notes = loadNotes();
    if (!notes.length) { alert('還沒有筆記'); return; }
    const text = '【CLB7 快速筆記】\n' + notes.map(n => `[${n.date} ${n.time} @ ${n.page}] ${n.note}`).join('\n');
    navigator.clipboard.writeText(text).then(() => {
      document.getElementById('qnoteCopy').textContent = '✓ 已複製！';
      setTimeout(() => document.getElementById('qnoteCopy').textContent = '📋 複製全部給 Claude', 2000);
    });
  });
})();
</script>

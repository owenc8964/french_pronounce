<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>時數追蹤 — CLB7</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #07080f;
  color: #ddd8cc;
  font-family: 'Segoe UI', system-ui, sans-serif;
  min-height: 100vh;
  padding: 28px 16px 60px;
  max-width: 680px;
  margin: 0 auto;
}
h1 {
  font-size: 1.5rem; letter-spacing: 2px; color: #f0c060;
  text-shadow: 0 0 20px rgba(240,192,96,0.4);
  text-align: center; margin-bottom: 4px;
}
.sub { text-align: center; font-size: 0.75rem; color: #445060; margin-bottom: 28px; letter-spacing: 1px; }

nav { text-align: center; margin-bottom: 20px; }
nav a { color: #445060; font-size: 0.75rem; text-decoration: none; margin: 0 10px; }
nav a:hover { color: #f0c060; }

/* Countdown */
.countdown-box {
  background: #0d1020; border: 1px solid #1a2438;
  border-radius: 12px; padding: 20px; text-align: center; margin-bottom: 16px;
}
.countdown-days { font-size: 3rem; font-weight: 700; color: #f0c060;
  text-shadow: 0 0 24px rgba(240,192,96,0.4); line-height: 1; }
.countdown-label { font-size: 0.72rem; color: #445060; letter-spacing: 1px; text-transform: uppercase; margin-top: 6px; }
.countdown-date { font-size: 0.8rem; color: #334050; margin-top: 4px; }

/* Progress bar */
.prog-section { background: #0d1020; border: 1px solid #1a2438; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
.prog-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.prog-label { font-size: 0.72rem; color: #445060; text-transform: uppercase; letter-spacing: 1px; }
.prog-val { font-size: 0.95rem; color: #f0c060; font-weight: 700; }
.prog-track { background: #141928; border-radius: 4px; height: 10px; overflow: hidden; margin-bottom: 8px; }
.prog-fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg, #2a5a7a, #60a0d0); transition: width 0.8s ease; }
.prog-sub { font-size: 0.72rem; color: #334050; text-align: right; }

/* Stats grid */
.stats-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.stat-box { background: #0d1020; border: 1px solid #1a2438; border-radius: 10px; padding: 14px 12px; text-align: center; }
.stat-val { font-size: 1.5rem; font-weight: 700; color: #60a0d0; }
.stat-label { font-size: 0.65rem; color: #445060; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

/* Timer */
.timer-card { background: #0d1020; border: 1px solid #1a2438; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
.card-title { font-size: 0.72rem; color: #445060; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px; }
.type-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.type-btn {
  padding: 7px 14px; border-radius: 20px; border: 1px solid #1a2438;
  background: #141928; color: #667080; font-size: 0.8rem; cursor: pointer;
  font-family: inherit; transition: all 0.15s;
}
.type-btn.active { background: #1a2438; color: #f0c060; border-color: #f0c060; }

.timer-display {
  font-size: 3.5rem; font-weight: 700; text-align: center;
  color: #ddd8cc; letter-spacing: 4px; margin-bottom: 16px;
  font-variant-numeric: tabular-nums;
}
.timer-display.running { color: #60d090; text-shadow: 0 0 20px rgba(96,208,144,0.3); }

.btn-row { display: flex; gap: 10px; justify-content: center; }
button {
  padding: 12px 28px; border-radius: 8px; border: none;
  font-size: 0.9rem; cursor: pointer; font-family: inherit;
  transition: opacity 0.15s, transform 0.1s;
}
button:active { transform: scale(0.97); }
.btn-start { background: #1d5035; color: #60d090; }
.btn-stop  { background: #4a1a18; color: #d07060; }
.btn-log   { background: #1a2a4a; color: #60a0d0; }
.btn-reset { background: #141928; color: #445060; }
button:hover { opacity: 0.85; }
button:disabled { opacity: 0.35; cursor: not-allowed; }

/* Log */
.log-title { font-size: 0.72rem; color: #445060; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
.log-entry {
  display: flex; justify-content: space-between; align-items: center;
  background: #0d1020; border: 1px solid #1a2438;
  border-radius: 8px; padding: 10px 14px; margin-bottom: 8px;
}
.log-left { display: flex; flex-direction: column; gap: 3px; }
.log-date { font-size: 0.7rem; color: #445060; }
.log-type { font-size: 0.82rem; color: #ddd8cc; }
.log-dur  { font-size: 1rem; font-weight: 700; color: #60a0d0; }
.log-right { display: flex; align-items: center; gap: 10px; }
.log-actions { display: flex; gap: 4px; }
.log-actions button {
  background: none; border: none; cursor: pointer; font-size: 0.85rem;
  padding: 4px 6px; border-radius: 6px; opacity: 0.55; transition: opacity 0.15s;
}
.log-actions button:hover { opacity: 1; background: #1a2438; }
.empty { text-align: center; color: #334050; font-size: 0.85rem; padding: 32px 0; }

.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
  background: #1d5035; color: #60d090; padding: 10px 22px;
  border-radius: 24px; font-size: 0.82rem; transition: transform 0.25s ease;
  pointer-events: none; z-index: 99;
}
.toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<h1>⏱ 時數追蹤</h1>
<p class="sub">每次學習都計時 · 對準 700 小時目標</p>

<nav>
  <a href="quiz.html">Quiz</a>
  <a href="map.html">地圖</a>
  <a href="writing.html">造句</a>
  <a href="french_notes.html">筆記</a>
</nav>

<!-- Countdown -->
<div class="countdown-box">
  <div class="countdown-days" id="daysLeft">—</div>
  <div class="countdown-label">距離考試剩餘天數</div>
  <div class="countdown-date">目標：2027年6月1日考過 CLB 7</div>
</div>

<!-- Progress to 700h -->
<div class="prog-section">
  <div class="prog-header">
    <span class="prog-label">累積時數進度</span>
    <span class="prog-val" id="hoursVal">0 / 700 小時</span>
  </div>
  <div class="prog-track"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
  <div class="prog-sub" id="progSub">還需要 700 小時</div>
</div>

<!-- Stats -->
<div class="stats-row">
  <div class="stat-box">
    <div class="stat-val" id="statToday">0h</div>
    <div class="stat-label">今天</div>
  </div>
  <div class="stat-box">
    <div class="stat-val" id="statWeek">0h</div>
    <div class="stat-label">本週</div>
  </div>
  <div class="stat-box">
    <div class="stat-val" id="statTotal">0h</div>
    <div class="stat-label">累積總計</div>
  </div>
</div>

<!-- Timer -->
<div class="timer-card">
  <div class="card-title">本次 Session 計時</div>
  <div class="type-row" id="typeRow">
    <button class="type-btn active" data-type="Quiz">🃏 Quiz</button>
    <button class="type-btn" data-type="筆記複習">📖 筆記複習</button>
    <button class="type-btn" data-type="口說">🗣 口說</button>
    <button class="type-btn" data-type="聽力">🎧 聽力</button>
    <button class="type-btn" data-type="造句">✍️ 造句</button>
  </div>
  <div class="timer-display" id="timerDisplay">00:00:00</div>
  <div class="btn-row">
    <button class="btn-start" id="btnStart">▶ 開始</button>
    <button class="btn-stop"  id="btnStop"  disabled>⏹ 暫停</button>
    <button class="btn-log"   id="btnLog"   disabled>✅ 記錄</button>
    <button class="btn-reset" id="btnReset">↺ 重置</button>
  </div>
</div>

<!-- Log -->
<div class="log-title">學習記錄</div>
<div id="logList"></div>

<div class="toast" id="toast"></div>

<script>
const KEY = 'clb7_tracker';
const GOAL_H = 700;
const EXAM_DATE = new Date('2027-06-01T00:00:00');

function load() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } }
function save(d) { localStorage.setItem(KEY, JSON.stringify(d)); }

// Countdown
function updateCountdown() {
  const now = new Date(); now.setHours(0,0,0,0);
  const diff = Math.ceil((EXAM_DATE - now) / 86400000);
  document.getElementById('daysLeft').textContent = diff > 0 ? diff : 0;
}

// Stats
function fmtH(sec) {
  const h = sec / 3600;
  return h < 10 ? h.toFixed(1) + 'h' : Math.round(h) + 'h';
}

function updateStats() {
  const data = load();
  const totalSec = data.reduce((s, e) => s + e.sec, 0);
  const totalH = totalSec / 3600;

  // Today
  const todayStr = new Date().toLocaleDateString('zh-TW');
  const todaySec = data.filter(e => e.date === todayStr).reduce((s, e) => s + e.sec, 0);

  // This week
  const now = new Date();
  const weekStart = new Date(now); weekStart.setDate(now.getDate() - now.getDay());
  weekStart.setHours(0,0,0,0);
  const weekSec = data.filter(e => new Date(e.ts) >= weekStart).reduce((s, e) => s + e.sec, 0);

  document.getElementById('statToday').textContent = fmtH(todaySec);
  document.getElementById('statWeek').textContent  = fmtH(weekSec);
  document.getElementById('statTotal').textContent = fmtH(totalSec);

  const pct = Math.min(100, totalH / GOAL_H * 100);
  document.getElementById('progFill').style.width = pct.toFixed(1) + '%';
  document.getElementById('hoursVal').textContent  = `${totalH.toFixed(1)} / ${GOAL_H} 小時`;
  const remain = Math.max(0, GOAL_H - totalH);
  document.getElementById('progSub').textContent = remain > 0
    ? `還需要 ${remain.toFixed(1)} 小時`
    : '✓ 已達目標！';
}

function renderLog() {
  const data = load().slice().reverse().slice(0, 30);
  const el = document.getElementById('logList');
  if (data.length === 0) { el.innerHTML = '<div class="empty">還沒有記錄 — 計時後按「記錄」儲存</div>'; return; }
  el.innerHTML = data.map(e => {
    const m = Math.floor(e.sec / 60), h = Math.floor(m / 60), rm = m % 60;
    const dur = h > 0 ? `${h}h ${rm}m` : `${m}m`;
    return `<div class="log-entry">
      <div class="log-left">
        <span class="log-date">${e.date}</span>
        <span class="log-type">${e.type}</span>
      </div>
      <div class="log-right">
        <span class="log-dur">${dur}</span>
        <div class="log-actions">
          <button onclick="editLogEntry(${e.ts})" title="改時長">✏️</button>
          <button onclick="deleteLogEntry(${e.ts})" title="刪除這筆">🗑</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

// 記錄記錯了：改時長（分鐘）或整筆刪除——用 ts 當唯一鍵定位
function editLogEntry(ts) {
  const data = load();
  const rec = data.find(e => e.ts === ts);
  if (!rec) return;
  const curMin = Math.round(rec.sec / 60);
  const input = prompt(`「${rec.date} · ${rec.type}」目前 ${curMin} 分鐘，改成幾分鐘？`, curMin);
  if (input === null) return;
  const min = parseInt(input, 10);
  if (!Number.isFinite(min) || min <= 0) { showToast('請輸入大於 0 的分鐘數'); return; }
  rec.sec = min * 60;
  save(data);
  if (window.ClbSync) ClbSync.push();
  updateStats();
  renderLog();
  showToast('✓ 已更新這筆記錄');
}
function deleteLogEntry(ts) {
  const data = load();
  const rec = data.find(e => e.ts === ts);
  if (!rec) return;
  if (!confirm(`確定要刪除「${rec.date} · ${rec.type}」這筆記錄嗎？`)) return;
  save(data.filter(e => e.ts !== ts));
  if (window.ClbSync) ClbSync.push();
  updateStats();
  renderLog();
  showToast('✓ 已刪除');
}

// Timer
let elapsed = 0, interval = null;
let selectedType = 'Quiz';

function fmtTimer(sec) {
  const h = String(Math.floor(sec / 3600)).padStart(2,'0');
  const m = String(Math.floor((sec % 3600) / 60)).padStart(2,'0');
  const s = String(sec % 60).padStart(2,'0');
  return `${h}:${m}:${s}`;
}

document.getElementById('typeRow').addEventListener('click', e => {
  const btn = e.target.closest('.type-btn');
  if (!btn) return;
  document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selectedType = btn.dataset.type;
});

function timerRunning() { return interval !== null; }

function startTimer() {
  if (timerRunning()) return;
  interval = setInterval(() => {
    elapsed++;
    document.getElementById('timerDisplay').textContent = fmtTimer(elapsed);
  }, 1000);
  document.getElementById('timerDisplay').classList.add('running');
  document.getElementById('btnStart').disabled = true;
  document.getElementById('btnStop').disabled = false;
  document.getElementById('btnLog').disabled = false;
}

function pauseTimer() {
  if (!timerRunning()) return;
  clearInterval(interval); interval = null;
  document.getElementById('timerDisplay').classList.remove('running');
  document.getElementById('btnStart').disabled = false;
  document.getElementById('btnStop').disabled = true;
}

document.getElementById('btnStart').addEventListener('click', startTimer);

document.getElementById('btnStop').addEventListener('click', pauseTimer);

document.getElementById('btnLog').addEventListener('click', () => {
  if (elapsed < 60) { showToast('至少計時 1 分鐘才能記錄'); return; }
  pauseTimer();
  const data = load();
  data.push({
    ts: Date.now(),
    date: new Date().toLocaleDateString('zh-TW', {year:'numeric',month:'2-digit',day:'2-digit'}),
    type: selectedType,
    sec: elapsed
  });
  save(data);
  elapsed = 0;
  document.getElementById('timerDisplay').textContent = '00:00:00';
  document.getElementById('btnLog').disabled = true;
  updateStats();
  renderLog();
  showToast('✓ 已記錄！繼續加油');
});

document.getElementById('btnReset').addEventListener('click', () => {
  pauseTimer();
  elapsed = 0;
  document.getElementById('timerDisplay').textContent = '00:00:00';
  document.getElementById('btnLog').disabled = true;
});

// 切換分頁/離開頁面自動暫停
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    pauseTimer();
  }
});

// autostart=1 從 dashboard 帶過來時自動開始
if (new URLSearchParams(location.search).get('autostart') === '1') {
  startTimer();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

updateCountdown();
updateStats();
renderLog();
</script>
<!-- 懸浮快速筆記 -->
<style>
#qnoteBtn{position:fixed;bottom:20px;right:20px;width:44px;height:44px;border-radius:50%;background:#1a2438;border:1px solid #2a3858;color:#f0c060;font-size:1.2rem;cursor:pointer;z-index:999;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px rgba(0,0,0,0.5);transition:transform 0.15s;}
#qnoteBtn:hover{transform:scale(1.1);}
#qnotePanel{position:fixed;bottom:72px;right:20px;width:280px;background:#0d1020;border:1px solid #2a3858;border-radius:12px;padding:14px;z-index:998;display:none;box-shadow:0 4px 20px rgba(0,0,0,0.6);}
#qnotePanel.open{display:block;}
#qnoteTitle{font-size:0.7rem;color:#445060;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
#qnoteTxt{width:100%;background:#141928;border:1px solid #1a2438;border-radius:8px;color:#ddd8cc;font-size:0.85rem;padding:8px;resize:none;height:80px;font-family:inherit;}
#qnoteTxt:focus{outline:none;border-color:#f0c060;}
#qnoteSave{margin-top:8px;width:100%;padding:8px;background:#1d5035;color:#60d090;border:none;border-radius:8px;font-size:0.82rem;cursor:pointer;font-family:inherit;}
#qnoteCount{font-size:0.68rem;color:#334050;margin-top:6px;text-align:right;}
</style>
<button id="qnoteBtn" title="快速筆記">📝</button>
<div id="qnotePanel">
  <div id="qnoteTitle">快速筆記（存給 Claude 看）</div>
  <textarea id="qnoteTxt" placeholder="記下問題、想法、bug…"></textarea>
  <button id="qnoteSave">儲存筆記</button>
  <div id="qnoteCount"></div>
  <button id="qnoteCopy" style="margin-top:6px;width:100%;padding:7px;background:#1a2438;color:#60a0d0;border:none;border-radius:8px;font-size:0.78rem;cursor:pointer;font-family:inherit;">📋 複製全部給 Claude</button>
</div>
<script>
(function(){
  const KEY='clb7_quick_notes';
  const page=location.pathname.split('/').pop()||'unknown';
  function loadNotes(){try{return JSON.parse(localStorage.getItem(KEY))||[];}catch{return[];}}
  function saveNotes(d){localStorage.setItem(KEY,JSON.stringify(d));}
  function updateCount(){const n=loadNotes();document.getElementById('qnoteCount').textContent=n.length?`共 ${n.length} 則筆記`:'還沒有筆記';}
  document.getElementById('qnoteBtn').addEventListener('click',()=>{
    document.getElementById('qnotePanel').classList.toggle('open');
    updateCount();
  });
  document.getElementById('qnoteSave').addEventListener('click',()=>{
    const txt=document.getElementById('qnoteTxt').value.trim();
    if(!txt)return;
    const notes=loadNotes();
    const d=new Date();
    notes.push({date:`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`,time:`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`,page,note:txt});
    saveNotes(notes);
    document.getElementById('qnoteTxt').value='';
    updateCount();
  });
  document.getElementById('qnoteCopy').addEventListener('click',()=>{
    const notes=loadNotes();
    if(!notes.length){alert('還沒有筆記');return;}
    const text='【CLB7 快速筆記】\n'+notes.map(n=>`[${n.date} ${n.time} @ ${n.page}] ${n.note}`).join('\n');
    navigator.clipboard.writeText(text).then(()=>{
      document.getElementById('qnoteCopy').textContent='✓ 已複製！';
      setTimeout(()=>document.getElementById('qnoteCopy').textContent='📋 複製全部給 Claude',2000);
    });
  });
})();
</script>
<script src="sync_supabase.js"></script>
</body>
</html>

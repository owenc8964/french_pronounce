<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日造句 — CLB7</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #07080f;
  color: #ddd8cc;
  font-family: 'Segoe UI', system-ui, sans-serif;
  min-height: 100vh;
  padding: 28px 16px 60px;
  max-width: 680px;
  margin: 0 auto;
}
h1 {
  font-size: 1.5rem;
  letter-spacing: 2px;
  color: #f0c060;
  text-shadow: 0 0 20px rgba(240,192,96,0.4);
  text-align: center;
  margin-bottom: 4px;
}
.sub { text-align: center; font-size: 0.75rem; color: #445060; margin-bottom: 28px; letter-spacing: 1px; }

/* Stats */
.stats-row {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  gap: 10px; margin-bottom: 28px;
}
.stat-box {
  background: #0d1020; border: 1px solid #1a2438;
  border-radius: 10px; padding: 14px 12px; text-align: center;
}
.stat-val { font-size: 1.6rem; font-weight: 700; color: #f0c060; }
.stat-label { font-size: 0.65rem; color: #445060; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

/* Form */
.card {
  background: #0d1020; border: 1px solid #1a2438;
  border-radius: 12px; padding: 20px; margin-bottom: 16px;
}
.card-title { font-size: 0.72rem; color: #445060; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 14px; }
.date-display { font-size: 1rem; color: #f0c060; margin-bottom: 14px; }
textarea {
  width: 100%; background: #141928; border: 1px solid #1a2438;
  border-radius: 8px; color: #ddd8cc; font-size: 1rem;
  padding: 12px; resize: vertical; min-height: 64px;
  font-family: inherit; margin-bottom: 10px;
  transition: border-color 0.15s;
}
textarea:focus { outline: none; border-color: #f0c060; }
textarea::placeholder { color: #334050; }

.prompt-box {
  background: #0a0c18; border: 1px solid #1a2438;
  border-radius: 8px; padding: 14px;
  font-size: 0.82rem; color: #667080;
  line-height: 1.7; white-space: pre-wrap; margin-bottom: 14px;
  font-family: 'Courier New', monospace;
}
.prompt-box .s1 { color: #60d090; }
.prompt-box .s2 { color: #60a0d0; }

.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
button {
  padding: 10px 20px; border-radius: 8px; border: none;
  font-size: 0.88rem; cursor: pointer; font-family: inherit;
  transition: opacity 0.15s, transform 0.1s;
}
button:active { transform: scale(0.97); }
.btn-copy { background: #1a2438; color: #60a0d0; }
.btn-copy:hover { opacity: 0.85; }
.btn-save { background: #1d5035; color: #60d090; }
.btn-save:hover { opacity: 0.85; }
.btn-save:disabled { opacity: 0.4; cursor: not-allowed; }

.score-row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.score-row label { font-size: 0.82rem; color: #667080; white-space: nowrap; }
input[type=number] {
  width: 72px; background: #141928; border: 1px solid #1a2438;
  border-radius: 8px; color: #f0c060; font-size: 1.1rem;
  padding: 8px 12px; text-align: center; font-family: inherit;
}
input[type=number]:focus { outline: none; border-color: #f0c060; }
.score-preview { font-size: 0.88rem; margin: 8px 0 12px; min-height: 20px; }

/* History */
.history-title {
  font-size: 0.72rem; color: #445060; text-transform: uppercase;
  letter-spacing: 1px; margin-bottom: 12px;
}
.entry {
  background: #0d1020; border: 1px solid #1a2438;
  border-radius: 10px; padding: 14px 16px; margin-bottom: 10px;
}
.entry-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.entry-date { font-size: 0.75rem; color: #445060; }
.entry-score { font-size: 1.1rem; font-weight: 700; }
.score-hi { color: #60d090; }
.score-mid { color: #f0c060; }
.score-lo { color: #d07060; }
.entry-sentences { font-size: 0.88rem; color: #9090a0; line-height: 1.7; }
.entry-sentences span { display: block; }
.empty { text-align: center; color: #334050; font-size: 0.85rem; padding: 32px 0; }
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
  background: #1d5035; color: #60d090; padding: 10px 22px;
  border-radius: 24px; font-size: 0.82rem; transition: transform 0.25s ease;
  pointer-events: none; z-index: 99;
}
.toast.show { transform: translateX(-50%) translateY(0); }

nav { text-align: center; margin-bottom: 20px; }
nav a { color: #445060; font-size: 0.75rem; text-decoration: none; margin: 0 10px; }
nav a:hover { color: #f0c060; }
</style>
</head>
<body>

<h1>✍️ 每日造句</h1>
<p class="sub">每天 2 句 · 記錄分數 · 追蹤進步</p>

<nav>
  <a href="quiz.html">Quiz</a>
  <a href="map.html">地圖</a>
  <a href="tracker.html">時數</a>
  <a href="french_notes.html">筆記</a>
</nav>

<!-- Stats -->
<div class="stats-row">
  <div class="stat-box">
    <div class="stat-val" id="statCount">0</div>
    <div class="stat-label">累積次數</div>
  </div>
  <div class="stat-box">
    <div class="stat-val" id="statAvg">—</div>
    <div class="stat-label">平均分數</div>
  </div>
  <div class="stat-box">
    <div class="stat-val" id="statStreak">0</div>
    <div class="stat-label">連續天數</div>
  </div>
</div>

<!-- Form -->
<div class="card">
  <div class="card-title">今日造句</div>
  <div class="date-display" id="todayDate"></div>

  <textarea id="s1" placeholder="句子 1：用今天複習的語法造一句…"></textarea>
  <textarea id="s2" placeholder="句子 2：再造一句，不同情境…"></textarea>

  <div class="btn-row" style="margin-bottom:18px;">
    <button class="btn-copy" id="btnEval">🚀 送給 Claude 評分</button>
  </div>

  <div id="pasteSection" style="display:none;">
    <div class="card-title" style="margin-bottom:8px;">貼上 Claude 的回覆</div>
    <textarea id="claudeReply" placeholder="把 Claude 的回覆整段貼在這裡…" style="min-height:120px;"></textarea>
    <div class="score-preview" id="scorePreview"></div>
    <div class="btn-row">
      <button class="btn-save" id="btnSave" disabled>✅ 記錄</button>
    </div>
  </div>
</div>

<!-- History -->
<div class="history-title">歷史記錄</div>
<div id="historyList"></div>

<div class="toast" id="toast"></div>

<script>
const KEY = 'clb7_writing';

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; }
}
function save(data) {
  localStorage.setItem(KEY, JSON.stringify(data));
  if (window.ClbSync) ClbSync.push(); // 存完立刻嘗試同步，不等debounce
}

function todayStr() {
  return new Date().toLocaleDateString('zh-TW', { year:'numeric', month:'2-digit', day:'2-digit' });
}

function updateStats() {
  const data = load();
  document.getElementById('statCount').textContent = data.length;
  if (data.length === 0) {
    document.getElementById('statAvg').textContent = '—';
  } else {
    const avg = data.reduce((s, e) => s + e.score, 0) / data.length;
    document.getElementById('statAvg').textContent = avg.toFixed(1);
  }
  // streak
  let streak = 0;
  const today = new Date(); today.setHours(0,0,0,0);
  const dates = [...new Set(data.map(e => e.date))].sort().reverse();
  let check = new Date(today);
  for (const d of dates) {
    const dDate = new Date(d.replace(/\//g,'-'));
    dDate.setHours(0,0,0,0);
    const diff = (check - dDate) / 86400000;
    if (diff <= 1) { streak++; check = dDate; }
    else break;
  }
  document.getElementById('statStreak').textContent = streak;
}

function buildPrompt() {
  const s1 = document.getElementById('s1').value.trim();
  const s2 = document.getElementById('s2').value.trim();
  const line1 = s1 || '（句子 1）';
  const line2 = s2 || '（句子 2）';
  return `你是法語 A1/A2 老師。請評估以下學生寫的法文句子：\n\n${line1}\n${line2}\n\n請用以下格式回覆（不要多說）：\n分數：X/10\n錯誤：（沒有就寫「無」）\n正確版：\n建議：（一句話）`;
}

function updatePrompt() {
  const s1 = document.getElementById('s1').value.trim();
  const s2 = document.getElementById('s2').value.trim();
  const box = document.getElementById('promptPreview');
  if (!s1 && !s2) {
    box.textContent = '（輸入句子後，提示會自動更新）';
    return;
  }
  const line1 = s1 || '（句子 1）';
  const line2 = s2 || '（句子 2）';
  box.innerHTML = `你是法語 A1/A2 老師。請評估以下學生寫的法文句子：\n\n<span class="s1">${escHtml(line1)}</span>\n<span class="s2">${escHtml(line2)}</span>\n\n請用以下格式回覆（不要多說）：\n分數：X/10\n錯誤：（沒有就寫「無」）\n正確版：\n建議：（一句話）`;
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function scoreClass(s) {
  if (s >= 8) return 'score-hi';
  if (s >= 5) return 'score-mid';
  return 'score-lo';
}

function renderHistory() {
  const data = load().slice().reverse();
  const el = document.getElementById('historyList');
  if (data.length === 0) {
    el.innerHTML = '<div class="empty">還沒有記錄 — 今天開始吧！</div>';
    return;
  }
  el.innerHTML = data.map(e => `
    <div class="entry">
      <div class="entry-header">
        <span class="entry-date">${e.date}</span>
        <span class="entry-score ${scoreClass(e.score)}">${e.score}/10</span>
      </div>
      <div class="entry-sentences">
        <span>① ${escHtml(e.s1 || '')}</span>
        <span>② ${escHtml(e.s2 || '')}</span>
      </div>
    </div>
  `).join('');
}

function parseScore(text) {
  const m = text.match(/分數[：:]\s*(\d+(?:\.\d+)?)\s*\/\s*10/);
  return m ? parseFloat(m[1]) : null;
}

// Init
document.getElementById('todayDate').textContent = todayStr();

document.getElementById('btnEval').addEventListener('click', () => {
  const s1 = document.getElementById('s1').value.trim();
  const s2 = document.getElementById('s2').value.trim();
  if (!s1 && !s2) { showToast('請先輸入至少一句句子'); return; }
  const text = buildPrompt();
  navigator.clipboard.writeText(text).then(() => {
    window.open('https://claude.ai', '_blank');
    document.getElementById('pasteSection').style.display = 'block';
    document.getElementById('claudeReply').value = '';
    document.getElementById('scorePreview').textContent = '';
    document.getElementById('btnSave').disabled = true;
    showToast('✓ 已複製提示，claude.ai 已開啟！');
  });
});

document.getElementById('claudeReply').addEventListener('input', () => {
  const text = document.getElementById('claudeReply').value;
  const score = parseScore(text);
  const preview = document.getElementById('scorePreview');
  if (score !== null) {
    preview.textContent = `偵測到分數：${score}/10`;
    preview.className = 'score-preview ' + scoreClass(score);
    document.getElementById('btnSave').disabled = false;
  } else {
    preview.textContent = text.length > 10 ? '找不到「分數：X/10」格式，請確認 Claude 有照格式回覆' : '';
    preview.className = 'score-preview';
    document.getElementById('btnSave').disabled = true;
  }
});

document.getElementById('btnSave').addEventListener('click', () => {
  const s1 = document.getElementById('s1').value.trim();
  const s2 = document.getElementById('s2').value.trim();
  const reply = document.getElementById('claudeReply').value;
  const score = parseScore(reply);
  if (score === null) { showToast('找不到分數，請確認貼上的內容正確'); return; }

  const data = load();
  data.push({ date: todayStr(), s1, s2, score, reply });
  save(data);

  document.getElementById('s1').value = '';
  document.getElementById('s2').value = '';
  document.getElementById('claudeReply').value = '';
  document.getElementById('scorePreview').textContent = '';
  document.getElementById('pasteSection').style.display = 'none';
  document.getElementById('btnSave').disabled = true;
  updateStats();
  renderHistory();
  showToast(`✓ 已記錄 ${score}/10 分！`);

  const guided = new URLSearchParams(location.search).get('guided') === '1';
  if (guided) {
    setTimeout(() => { location.href = 'dashboard.html'; }, 1200);
  }
});

updateStats();
renderHistory();
</script>
<!-- 懸浮快速筆記 -->
<style>
#qnoteBtn{position:fixed;bottom:20px;right:20px;width:44px;height:44px;border-radius:50%;background:#1a2438;border:1px solid #2a3858;color:#f0c060;font-size:1.2rem;cursor:pointer;z-index:999;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px rgba(0,0,0,0.5);transition:transform 0.15s;}
#qnoteBtn:hover{transform:scale(1.1);}
#qnotePanel{position:fixed;bottom:72px;right:20px;width:280px;background:#0d1020;border:1px solid #2a3858;border-radius:12px;padding:14px;z-index:998;display:none;box-shadow:0 4px 20px rgba(0,0,0,0.6);}
#qnotePanel.open{display:block;}
#qnoteTitle{font-size:0.7rem;color:#445060;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
#qnoteTxt{width:100%;background:#141928;border:1px solid #1a2438;border-radius:8px;color:#ddd8cc;font-size:0.85rem;padding:8px;resize:none;height:80px;font-family:inherit;}
#qnoteTxt:focus{outline:none;border-color:#f0c060;}
#qnoteSave{margin-top:8px;width:100%;padding:8px;background:#1d5035;color:#60d090;border:none;border-radius:8px;font-size:0.82rem;cursor:pointer;font-family:inherit;}
#qnoteCount{font-size:0.68rem;color:#334050;margin-top:6px;text-align:right;}
</style>
<button id="qnoteBtn" title="快速筆記">📝</button>
<div id="qnotePanel">
  <div id="qnoteTitle">快速筆記（存給 Claude 看）</div>
  <textarea id="qnoteTxt" placeholder="記下問題、想法、bug…"></textarea>
  <button id="qnoteSave">儲存筆記</button>
  <div id="qnoteCount"></div>
  <button id="qnoteCopy" style="margin-top:6px;width:100%;padding:7px;background:#1a2438;color:#60a0d0;border:none;border-radius:8px;font-size:0.78rem;cursor:pointer;font-family:inherit;">📋 複製全部給 Claude</button>
</div>
<script>
(function(){
  const KEY='clb7_quick_notes';
  const page=location.pathname.split('/').pop()||'unknown';
  function loadNotes(){try{return JSON.parse(localStorage.getItem(KEY))||[];}catch{return[];}}
  function saveNotes(d){localStorage.setItem(KEY,JSON.stringify(d));}
  function updateCount(){const n=loadNotes();document.getElementById('qnoteCount').textContent=n.length?`共 ${n.length} 則筆記`:'還沒有筆記';}
  document.getElementById('qnoteBtn').addEventListener('click',()=>{
    document.getElementById('qnotePanel').classList.toggle('open');
    updateCount();
  });
  document.getElementById('qnoteSave').addEventListener('click',()=>{
    const txt=document.getElementById('qnoteTxt').value.trim();
    if(!txt)return;
    const notes=loadNotes();
    const d=new Date();
    notes.push({date:`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`,time:`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`,page,note:txt});
    saveNotes(notes);
    document.getElementById('qnoteTxt').value='';
    updateCount();
  });
  document.getElementById('qnoteCopy').addEventListener('click',()=>{
    const notes=loadNotes();
    if(!notes.length){alert('還沒有筆記');return;}
    const text='【CLB7 快速筆記】\n'+notes.map(n=>`[${n.date} ${n.time} @ ${n.page}] ${n.note}`).join('\n');
    navigator.clipboard.writeText(text).then(()=>{
      document.getElementById('qnoteCopy').textContent='✓ 已複製！';
      setTimeout(()=>document.getElementById('qnoteCopy').textContent='📋 複製全部給 Claude',2000);
    });
  });
})();
</script>
<script src="session_timer.js"></script>
<script src="sync_supabase.js"></script>
</body>
</html>

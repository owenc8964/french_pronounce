<style>

  .train-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }

  .rule-points { list-style:none; }
  .rule-points li { font-size:0.8rem; line-height:1.65; padding-left:1.1em; text-indent:-1.1em; margin-bottom:4px; }
  .rule-points li::before { content:'▸ '; color:#c0a030; }
  .rule-ex { margin-top:8px; border-top:1px dashed #e8d890; padding-top:8px; }

  .rule-ex-row .fr { font-weight:600; color:#2c2c2c; cursor:pointer; }
  .rule-ex-row .fr:hover { color:#3b6fd4; }
  .rule-ex-row .zh { color:#888; }
  .peek-btn {
    width:100%; padding:10px; background:#fff; border:2px dashed #e0d8b0; border-radius:12px;
    color:#a09040; font-size:0.8rem; cursor:pointer; font-family:inherit; margin-bottom:14px;
  }
  .card {
    background:#fff; border-radius:16px; padding:20px 18px; border:1.5px solid #e8e8e4;
    box-shadow:0 1px 4px rgba(0,0,0,0.07); margin-bottom:14px;
  }

  .retry-badge { color:#c05a00; font-weight:700; }

    font-size:0.85rem; color:#555; background:#f4f6fb; border-left:3px solid #3b6fd4;
    border-radius:4px; padding:6px 10px; margin-bottom:10px; line-height:1.5;
  }
  .q-hint { font-size:0.75rem; color:#999; margin-bottom:10px; }
  .input-row { display:flex; gap:8px; }
  .answer-input {
    flex:1; padding:12px 14px; font-size:0.95rem; border:2px solid #ddd; border-radius:10px;
    font-family:inherit; outline:none;
  }
  .answer-input:focus { border-color:#3b6fd4; }
  .btn-submit {
    padding:12px 20px; background:#2c2c2c; color:#fff; border:none; border-radius:10px;
    font-size:0.88rem; font-weight:700; cursor:pointer; font-family:inherit;
  }
  .result { display:none; margin-top:14px; }
  .result.show { display:block; }
  .result-banner { font-size:0.95rem; font-weight:700; padding:10px 14px; border-radius:10px; margin-bottom:10px;
    display:flex; align-items:center; justify-content:space-between; }
  .result-banner.ok { background:#e8f8ee; color:#2a7a4f; }
  .result-banner.no { background:#fdeaea; color:#c0392b; }
  .tts-btn { background:none; border:none; font-size:1.1rem; cursor:pointer; }
  .correct-ans { background:#f8f8f6; border-radius:10px; padding:12px 14px; margin-bottom:10px; }
  .correct-ans .label { font-size:0.65rem; color:#aaa; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:4px; }
  .correct-ans .fr-ans { font-size:1rem; font-weight:700; }
  .ans-note { font-size:0.78rem; color:#777; margin-top:6px; line-height:1.5; }
  .rule-remind { font-size:0.78rem; color:#8a6d00; background:#fffbe8; border-radius:8px; padding:8px 10px; margin-top:8px; line-height:1.5; }
  .btn-row { display:flex; gap:8px; margin-top:10px; }
  .btn { flex:1; padding:11px; border-radius:10px; border:none; font-size:0.85rem; font-weight:700; cursor:pointer; font-family:inherit; }
  .btn-next { background:#2c2c2c; color:#fff; }
  .btn-flag { flex:0 0 auto; background:#fff; border:1.5px solid #e0c0c0; color:#c0392b; padding:11px 14px; }
  .skip-row { text-align:center; margin-top:6px; }
  .skip-row button { background:none; border:none; color:#bbb; font-size:0.72rem; cursor:pointer; font-family:inherit; text-decoration:underline; }

  /* ── 總結 ── */
  .summary { text-align:center; padding:30px 16px; }
  .summary .big { font-size:2.2rem; margin-bottom:8px; }
  .summary h2 { font-size:1.05rem; margin-bottom:8px; }
  .summary p { font-size:0.82rem; color:#777; line-height:1.7; margin-bottom:16px; }
  .summary .btn { max-width:280px; margin:0 auto 8px; display:block; width:100%; }
  .btn-again { background:#fff; border:2px solid #2c2c2c; color:#2c2c2c; }

  /* ── 懸浮回饋 ── */
  #qnoteBtn{position:fixed;bottom:20px;right:20px;width:44px;height:44px;border-radius:50%;background:#fff;border:1.5px solid #ddd;color:#c0a030;font-size:1.2rem;cursor:pointer;z-index:999;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px rgba(0,0,0,0.12);}
  #qnotePanel{position:fixed;bottom:72px;right:20px;width:280px;background:#fff;border:1.5px solid #ddd;border-radius:12px;padding:14px;z-index:998;display:none;box-shadow:0 4px 20px rgba(0,0,0,0.15);}
  #qnotePanel.open{display:block;}
  #qnoteTitle{font-size:0.7rem;color:#999;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
  #qnoteTxt{width:100%;background:#f8f8f6;border:1px solid #e0e0dc;border-radius:8px;color:#2c2c2c;font-size:0.85rem;padding:8px;resize:none;height:80px;font-family:inherit;}
  #qnoteSave{margin-top:8px;width:100%;padding:8px;background:#2a7a4f;color:#fff;border:none;border-radius:8px;font-size:0.82rem;cursor:pointer;font-family:inherit;}
  #qnoteCount{font-size:0.68rem;color:#bbb;margin-top:6px;text-align:right;}
</style>

<body>

<div class="top-nav">
  <a href="dashboard.html">← 儀表板</a> ·
  <a href="map.html">文法大局觀</a>
</div>
<h1>📐 文法路徑</h1>
<div class="subtitle" id="subtitle">先讀規則 → 半開卷 → 遮規則 → 才進考題</div>

<div id="app"></div>

<button id="qnoteBtn" title="快速筆記">📝</button>
<div id="qnotePanel">
  <div id="qnoteTitle">快速筆記（存給 Claude 看）</div>
  <textarea id="qnoteTxt" placeholder="記下問題、想法、bug…"></textarea>
  <button id="qnoteSave">儲存筆記</button>
  <div id="qnoteCount"></div>
</div>

<script src="questions.js"></script>
<script src="gram_rules.js"></script>
<script src="codex.js"></script>
<script>
/* ============================================================
   文法路徑練習器 — 階段2（半開卷）/ 階段3（遮規則）
   設計依據見 PRD.md。重點：
   - 只出打字題（!q.opts），杜絕選擇題錯誤選項污染記憶
   - 答錯排到本輪最後重考，磨到全對；首次作答 ≥80% 才升階
   - 階段2規則卡全程可見，不寫 clb7_<qid> SRS（開卷成績不能
     灌進 quiz 的精熟統計）；階段3遮規則，寫 SRS（真提取）
   - 完成一輪寫 clb7_quiz_done / clb7_quiz_log（= 今日處方步驟②）
   ============================================================ */

const ROUND_SIZE = 6;

// ── TTS（與 quiz.html 同一套優先序） ──
let frVoice = null;
function initVoice() {
  const vs = speechSynthesis.getVoices().filter(v => v.lang.toLowerCase().startsWith('fr'));
  frVoice = vs.find(v => /am[eé]lie|thomas/i.test(v.name))
         || vs.find(v => /premium|enhanced|amélior|plus/i.test(v.name))
         || vs.find(v => v.localService === false)
         || vs.find(v => v.lang === 'fr-FR')
         || vs[0] || null;
}
speechSynthesis.onvoiceschanged = initVoice;
initVoice();
function speak(text) {
  speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text.replace(/ \/ /g, ', '));
  utt.lang = 'fr-FR'; utt.rate = 0.7;
  if (frVoice) utt.voice = frVoice;
  speechSynthesis.speak(utt);
}

// ── 比對（與 quiz.html 相同） ──
function norm(s) {
  return s.toLowerCase().trim().replace(/[.,!?'`'']/g, '').replace(/\s+/g, ' ').trim();
}
function isCorrect(input, answer) {
  const n = norm(input);
  return answer.split('|').some(a => norm(a) === n);
}

// ── 錯題本（與 quiz.html 相同格式） ──
function logWrong(entry) {
  try {
    const log = JSON.parse(localStorage.getItem('clb7_wrong_log')) || [];
    const d = new Date().toLocaleDateString('zh-TW', {year:'numeric',month:'2-digit',day:'2-digit'});
    const dup = log.find(e => e.d === d && e.src === entry.src && e.q === entry.q);
    if (dup) { dup.n = (dup.n||1) + 1; dup.t = Date.now(); }
    else log.push({ ...entry, d, t: Date.now(), n: 1 });
    localStorage.setItem('clb7_wrong_log', JSON.stringify(log.slice(-300)));
  } catch(e) {}
}
function logDailyDone(key, dateStr) {
  try {
    const log = JSON.parse(localStorage.getItem(key)) || [];
    if (!log.includes(dateStr)) log.push(dateStr);
    localStorage.setItem(key, JSON.stringify(log.slice(-90)));
  } catch(e) {}
}
// 階段3才寫 SRS（見檔頭說明）
function recordSRS(q, ok) {
  const id = qId(q);
  let srs;
  try { srs = JSON.parse(localStorage.getItem('clb7_' + id)) || { w:0, c:0, last:0 }; }
  catch(e) { srs = { w:0, c:0, last:0 }; }
  if (ok) srs.c++; else srs.w++;
  srs.last = Date.now();
  try { localStorage.setItem('clb7_' + id, JSON.stringify(srs)); } catch(e) {}
}

// ── 每點的題池與錯誤率（推薦排序用） ──
function poolOf(point) {
  const flagged = gramFlaggedIds();
  return BANK.filter(q => !q.opts && point.topics.indexOf(q.topic) >= 0 && flagged.indexOf(qId(q)) < 0);
}
function errRateOf(point) {
  let w = 0, c = 0;
  BANK.filter(q => point.topics.indexOf(q.topic) >= 0).forEach(q => {
    try {
      const s = JSON.parse(localStorage.getItem('clb7_' + qId(q)));
      if (s) { w += s.w || 0; c += s.c || 0; }
    } catch(e) {}
  });
  return (w + c) === 0 ? 0 : w / (w + c);
}
// 推薦點：階段最低優先，同階段錯誤率高優先
function recommendedPoint() {
  const active = GRAM_POINTS.filter(p => p.unlocked && poolOf(p).length > 0);
  active.sort((a, b) => {
    const sa = gramStageOf(a.id), sb = gramStageOf(b.id);
    if (sa !== sb) return sa - sb;
    return errRateOf(b) - errRateOf(a);
  });
  return active[0] || null;
}

// ── 狀態 ──
let point = null, stage = 2;
let queue = [], cur = 0, firstTry = {}, answered = false, roundTotal = 0;

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* ── 畫面：選點 ── */
function renderPicker() {
  const app = document.getElementById('app');
  const cats = Object.keys(GRAM_CATS);
  let html = '';
  cats.forEach(cat => {
    const pts = GRAM_POINTS.filter(p => p.unlocked && p.cat === cat);
    if (!pts.length) return;
    html += `<div class="cat-block"><div class="cat-title">${GRAM_CATS[cat].icon} ${GRAM_CATS[cat].label}</div>`;
    pts.forEach(p => {
      const st = gramStageOf(p.id);
      const info = GRAM_STAGES[st];
      const pool = poolOf(p);
      html += `
      <div class="point-row" onclick="startPoint('${p.id}')">
        <div class="p-icon">${p.icon}</div>
        <div class="p-name">${p.name}<small>第 ${p.lessons.join('、')} 課 · ${pool.length} 題</small></div>
        <div class="stage-badge sb-${Math.min(st,5)}">${info.icon} ${info.label}</div>
      </div>`;
    });
    html += '</div>';
  });
  app.innerHTML = html;
}

/* ── 開始某點 ── */
function startPoint(pid) {
  point = GRAM_POINTS.find(p => p.id === pid);
  if (!point) return;
  // 記錄「今天念哪一課」（07-12，取該點最新課次，writing.html 依課出題用）
  if (point.lessons && point.lessons.length) {
    try { localStorage.setItem('clb7_last_lesson', JSON.stringify({ lesson: point.lessons[point.lessons.length - 1], d: new Date().toLocaleDateString('zh-TW', {year:'numeric',month:'2-digit',day:'2-digit'}) })); } catch(e) {}
  }
  stage = gramStageOf(pid);
  if (stage < 2) stage = 2;
  if (stage > 3) {
    // 已到考題階段：提示去 quiz，但允許回鍋練
    if (!confirm(`「${point.name}」已在 ${GRAM_STAGES[stage].icon}${GRAM_STAGES[stage].label} 階段。\n還是要回鍋做一輪遮規則練習嗎？`)) {
      location.href = `quiz.html`;
      return;
    }
    stage = 3;
  }
  const pool = shuffle(poolOf(point).slice());
  queue = pool.slice(0, ROUND_SIZE);
  roundTotal = queue.length;
  cur = 0; firstTry = {};
  renderQuestion();
}

/* ── 畫面：一題 ── */
function renderQuestion() {
  const app = document.getElementById('app');
  if (cur >= queue.length) { renderSummary(); return; }
  const q = queue[cur];
  answered = false;
  const isRetry = firstTry[qId(q)] === false && cur >= roundTotal;
  const open = (stage === 2);
  const r = point.rule;
  const ruleHtml = `
    <div class="rule-card${open ? '' : ' hidden-rule'}" id="ruleCard">
      <div class="rule-title">📐 ${r.title}</div>
      ${r.why ? `<div class="rule-why">🧭 ${r.why}</div>` : ''}
      <ul class="rule-points">${r.points.map(p => `<li>${p}</li>`).join('')}</ul>
      <div class="rule-ex">${r.examples.map(e =>
        `<div class="rule-ex-row"><span class="fr" onclick="speak(this.textContent)">🔊 ${e.fr}</span><span class="zh">${e.zh}</span></div>`).join('')}
      </div>
    </div>
    ${open ? '' : `<button class="peek-btn" id="peekBtn" onclick="peekRule()">🫣 忘了規則？偷看一下（不影響成績，誠實面對自己就好）</button>`}`;

  app.innerHTML = `
    <div class="train-head">
      <div class="train-title">${point.icon} ${point.name}</div>
      <div class="stage-badge sb-${stage}">${GRAM_STAGES[stage].icon} ${GRAM_STAGES[stage].label}</div>
    </div>
    ${ruleHtml}
    <div class="card">
      <div class="q-progress">
        <span>第 ${cur + 1} / ${queue.length} 題</span>
        ${isRetry ? '<span class="retry-badge">🔁 重考（剛剛答錯的）</span>' : ''}
      </div>
      <div class="question">${q.q}</div>
      ${q.zh ? `<div class="q-zh">🈶 ${q.zh}</div>` : ''}
      ${q.hint ? `<div class="q-hint">💡 ${q.hint}</div>` : ''}
      <div class="input-row">
        <input class="answer-input" id="ansInput" type="text"
               placeholder="輸入答案，按 Enter 確認" autocomplete="off" autocorrect="off" spellcheck="false">
        <button class="btn-submit" onclick="checkAnswer()">確認</button>
      </div>
      <div class="result" id="result">
        <div class="result-banner" id="resultBanner">
          <span id="resultText"></span>
          <button class="tts-btn" onclick="speak(queue[cur].a.split('|')[0])">🔊</button>
        </div>
        <div class="correct-ans">
          <div class="label">正確答案</div>
          <div class="fr-ans">${q.a.split('|')[0]}</div>
          ${q.aNote ? `<div class="ans-note">📌 ${q.aNote}</div>` : ''}
          ${(() => {                          // 📍記憶宮殿門牌（07-11 codex）
            const cx = q.topic && codexLocate(q.topic);
            return cx ? `<div style="margin-top:6px"><a href="map.html#cx-${cx.num}" target="_blank" style="font-size:0.72rem;color:#3b6fd4;text-decoration:none">📍 ${cx.num} ${cx.name} — 打開資料庫門牌</a></div>` : '';
          })()}
          <div class="rule-remind" id="ruleRemind" style="display:none"></div>
        </div>
        <div class="btn-row">
          <button class="btn btn-flag" onclick="flagThis()" title="這題有問題，停用待Claude審核">🚩</button>
          <button class="btn btn-next" onclick="nextQ()">下一題 →</button>
        </div>
      </div>
    </div>
    <div class="skip-row">
      <button onclick="skipStage()">這個文法點我已經熟了，跳過${GRAM_STAGES[stage].label}階段 →</button>
    </div>`;

  const input = document.getElementById('ansInput');
  input.focus();
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !answered) { checkAnswer(); e.stopPropagation(); }  // 不讓同一下Enter冒泡到document直接跳題
  });
}

// 答完後 input 已 disabled，Enter 換下一題要掛在 document 上
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && answered && queue.length && document.getElementById('result')) nextQ();
});

function peekRule() {
  document.getElementById('ruleCard').classList.remove('hidden-rule');
  const b = document.getElementById('peekBtn');
  if (b) b.style.display = 'none';
}

function checkAnswer() {
  if (answered) return;
  const q = queue[cur];
  const input = document.getElementById('ansInput').value;
  if (!input.trim()) return;
  answered = true;
  const ok = isCorrect(input, q.a);
  const id = qId(q);
  if (!(id in firstTry)) firstTry[id] = ok;   // 只記首次作答
  if (stage === 3) recordSRS(q, ok);           // 階段3才寫SRS（見檔頭）

  const banner = document.getElementById('resultBanner');
  const txt = document.getElementById('resultText');
  document.getElementById('result').classList.add('show');
  document.getElementById('ansInput').disabled = true;

  if (ok) {
    banner.classList.add('ok'); txt.textContent = '✓ 正確！';
  } else {
    banner.classList.add('no'); txt.textContent = '✗ 再想想';
    // 答錯：排到本輪最後重考（磨到全對）
    queue.push(q);
    logWrong({ src:'gram', q: q.q, a: q.a.split('|')[0], note: q.aNote || '', hint: q.hint || '', topic: q.topic });
    // 答錯示範規則怎麼套用：遮規則模式自動翻開規則卡＋顯示提醒
    if (stage === 3) peekRule();
    const remind = document.getElementById('ruleRemind');
    remind.style.display = 'block';
    remind.textContent = '📐 回頭看上面的規則卡：' + point.rule.title;
    speak(q.a.split('|')[0]);  // 正解唸一次（正確資訊再輸入腦袋）
  }
}

function flagThis() {
  const q = queue[cur];
  if (!confirm('確定檢舉這題？它會立刻從所有出題池移除，等 Claude 審核修復後才放回來。')) return;
  gramFlagQuestion(qId(q), 'gram', q.q);
  if (window.ClbSync) ClbSync.push();
  // 這題不計入本輪：從 firstTry 移除、從佇列中拔掉所有複本
  delete firstTry[qId(q)];
  const flaggedId = qId(q);
  queue = queue.filter((x, i) => i === cur || qId(x) !== flaggedId);
  nextQ();
}

function nextQ() {
  cur++;
  renderQuestion();
}

function skipStage() {
  if (!confirm(`確定跳過「${point.name}」的${GRAM_STAGES[stage].label}階段？\n（誠實面對自己：真的熟了才跳）`)) return;
  gramSetStage(point.id, stage + 1, null);
  if (window.ClbSync) ClbSync.push();
  if (stage + 1 <= 3) { startPoint(point.id); }
  else { renderAfterSkip(); }
}
function renderAfterSkip() {
  document.getElementById('app').innerHTML = `
    <div class="summary">
      <div class="big">⏭️</div>
      <h2>已跳到 🧪 考題階段</h2>
      <p>「${point.name}」現在開放混考，之後在 quiz.html 用正確率累積精熟（≥75% 且 ≥5 題次）。</p>
      <button class="btn btn-next" onclick="location.href='quiz.html'">去考題 →</button>
      <button class="btn btn-again" onclick="renderPicker()">← 回文法點列表</button>
    </div>`;
}

/* ── 總結 ── */
function renderSummary() {
  const ids = Object.keys(firstTry);
  const okN = ids.filter(id => firstTry[id]).length;
  const total = ids.length;
  const acc = total === 0 ? 0 : okN / total;
  const passed = acc >= 0.8;

  // 07-16：改用專屬key，不再共用clb7_quiz_done——Owen要求「複習一課+quiz」
  // 跟「文法路徑」分開追蹤，兩個都要做，不是做其中一個就算數
  const d = new Date().toLocaleDateString('zh-TW', {year:'numeric',month:'2-digit',day:'2-digit'});
  localStorage.setItem('clb7_gramtrainer_done', d);
  logDailyDone('clb7_gramtrainer_log', d);

  let stageMsg = '';
  if (passed) {
    const next = stage + 1;
    gramSetStage(point.id, next, Math.round(acc * 100));
    stageMsg = next === 3
      ? '升階！下一輪開始<b>遮規則</b>：規則卡收起來，答錯才會翻開。'
      : '升階！「' + point.name + '」開放進 <b>🧪 考題</b>混考，之後用 quiz 正確率累積精熟。';
  } else {
    gramSetStage(point.id, stage, Math.round(acc * 100));  // 記錄歷史但不升階
    stageMsg = '首次作答未達 80%，這個階段再練一輪（答錯的題剛剛都磨到對了，睡前記得掃錯題本）。';
  }
  if (window.ClbSync) ClbSync.push();

  document.getElementById('app').innerHTML = `
    <div class="summary">
      <div class="big">${passed ? '🎉' : '💪'}</div>
      <h2>首次作答 ${okN} / ${total}（${Math.round(acc * 100)}%）</h2>
      <p>${stageMsg}</p>
      <button class="btn btn-next" onclick="startPoint('${point.id}')">${passed && stage + 1 > 3 ? '回鍋再練一輪' : '再練一輪 →'}</button>
      <button class="btn btn-again" onclick="renderPicker()">← 回文法點列表</button>
      <button class="btn btn-again" onclick="location.href='dashboard.html'">回儀表板</button>
    </div>`;
}

/* ── 入口 ── */
(function init() {
  const params = new URLSearchParams(location.search);
  const pid = params.get('point');
  if (pid && GRAM_POINTS.some(p => p.id === pid && p.unlocked)) {
    startPoint(pid);
  } else if (params.get('guided') === '1') {
    const rec = recommendedPoint();
    if (rec) startPoint(rec.id); else renderPicker();
  } else {
    renderPicker();
  }
})();
</script>

<script>
/* ── 懸浮回饋（clb7_quick_notes，與其他頁一致） ── */
(function(){
  const KEY='clb7_quick_notes';
  const page='gram_trainer.html';
  function loadNotes(){try{return JSON.parse(localStorage.getItem(KEY))||[];}catch(e){return[];}}
  function updateCount(){const n=loadNotes();document.getElementById('qnoteCount').textContent=n.length?`共 ${n.length} 則筆記`:'還沒有筆記';}
  document.getElementById('qnoteBtn').addEventListener('click', () => {
    document.getElementById('qnotePanel').classList.toggle('open');
    updateCount();
  });
  document.getElementById('qnoteSave').addEventListener('click', () => {
    const txt = document.getElementById('qnoteTxt').value.trim();
    if (!txt) return;
    const notes = loadNotes();
    const d = new Date();
    let tag = '';
    try { if (point) tag = `[${point.name}·階段${stage}]`; } catch(e) {}
    notes.push({
      date: `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`,
      time: `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`,
      page, note: (tag ? tag + '｜' : '') + txt
    });
    localStorage.setItem(KEY, JSON.stringify(notes));
    document.getElementById('qnoteTxt').value = '';
    updateCount();
  });
})();
</script>

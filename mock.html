<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 加到主畫面（PWA，2026-10-12） -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/app/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>TCF Canada · Examen blanc</title>
<style>
/* ─────────────────────────────────────────────────────────────
   風格沿用 reading.html / quiz.html：深藍底、金色標題、
   #0d1020 卡片、#1a2438 邊框、綠對紅錯。不另發明配色。
   ⚠️ 本頁完全獨立：不載入 sync_supabase.js，
      所有 localStorage key 一律 tcfmock_ 前綴，不寫 clb7_*。
   ───────────────────────────────────────────────────────────── */
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #07080f; color: #ddd8cc;
  font-family: 'Segoe UI', system-ui, sans-serif;
  min-height: 100vh; padding: 24px 16px 90px;
  max-width: 680px; margin: 0 auto;
}

/* Header */
.header { text-align: center; margin-bottom: 20px; }
.header h1 { font-size: 1.2rem; letter-spacing: 2px; color: #f0c060;
  text-shadow: 0 0 20px rgba(240,192,96,0.35); }
.header .back { font-size: 0.72rem; color: #445060; text-decoration: none;
  display: inline-block; margin-bottom: 8px; }
.header .back:hover { color: #f0c060; }
.header .sub { font-size: 0.68rem; color: #445060; margin-top: 6px; }

/* Generic card */
.card {
  background: #0d1020; border: 1px solid #1a2438;
  border-radius: 12px; padding: 16px 18px; margin-bottom: 16px;
}
.card-title { font-size: 0.65rem; color: #445060; text-transform: uppercase;
  letter-spacing: 1.5px; margin-bottom: 12px; }

/* Skill switch */
.skill-row { display: flex; gap: 10px; margin-bottom: 12px; }
.skill-btn {
  flex: 1; padding: 12px; border-radius: 9px; cursor: pointer;
  background: #141928; border: 1.5px solid #1a2438; color: #aaa8a0;
  font-family: inherit; font-size: 0.86rem; transition: all .12s;
}
.skill-btn:hover { border-color: #445060; color: #ddd8cc; }
.skill-btn.on { border-color: #f0c060; color: #f0c060; background: #1a1800; font-weight: 700; }

/* Toggles */
.toggle-row {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 0; border-bottom: 1px solid #141928;
}
.toggle-row:last-child { border-bottom: none; }
.toggle-row label { flex: 1; font-size: 0.8rem; color: #aaa8a0; cursor: pointer; }
.toggle-row .hint { display: block; font-size: 0.68rem; color: #445060; margin-top: 3px; line-height: 1.5; }
.toggle-row input { width: 18px; height: 18px; accent-color: #f0c060; margin-top: 2px; cursor: pointer; }

/* Test grid */
.test-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; }
.test-btn {
  background: #141928; border: 1.5px solid #1a2438; border-radius: 8px;
  padding: 10px 4px; cursor: pointer; color: #ddd8cc;
  font-family: inherit; font-size: 0.8rem; transition: all .12s; text-align: center;
}
.test-btn:hover { border-color: #445060; transform: translateY(-1px); }
.test-btn .tb-sub { display: block; font-size: 0.6rem; color: #445060; margin-top: 3px; }
.test-btn.done { border-color: #1a4a1a; }
.test-btn.done .tb-sub { color: #60d090; }

/* Sticky exam bar */
.exam-bar {
  position: sticky; top: 0; z-index: 20;
  background: #0d1020; border: 1px solid #1a2438; border-radius: 10px;
  padding: 10px 14px; margin-bottom: 14px;
}
.bar-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.bar-label { font-size: 0.62rem; color: #445060; text-transform: uppercase; letter-spacing: 1px; }
.bar-val { font-size: 1.15rem; font-weight: 700; color: #60a0d0; font-variant-numeric: tabular-nums; }
.bar-progress { font-size: 0.82rem; color: #aaa8a0; font-weight: 700; }
.bar-mode { font-size: 0.62rem; color: #d07060; letter-spacing: 1px; }
audio { width: 100%; margin-top: 10px; filter: invert(0.9) hue-rotate(180deg); }
.audio-note { font-size: 0.66rem; color: #445060; margin-top: 6px; line-height: 1.5; }
.play-once {
  width: 100%; margin-top: 10px; padding: 12px;
  background: linear-gradient(135deg, #1d3550, #2a5a7a); color: #60a0d0;
  border: none; border-radius: 9px; font-family: inherit;
  font-size: 0.88rem; font-weight: 700; cursor: pointer;
}
.play-once:disabled { opacity: .4; cursor: default; }

/* Question card */
.q-card { background: #0d1020; border: 1px solid #1a2438; border-radius: 12px;
  padding: 18px; margin-bottom: 14px; }
.q-num { font-size: 0.65rem; color: #445060; letter-spacing: 1px; margin-bottom: 8px;
  display: flex; justify-content: space-between; align-items: center; }
.flag-btn { background: none; border: none; cursor: pointer; font-size: 1rem;
  color: #445060; font-family: inherit; padding: 0 4px; }
.flag-btn.on { color: #f0c060; }
.doc-img {
  width: 100%; border-radius: 8px; background: #fff; margin-bottom: 14px;
  display: block; border: 1px solid #1a2438;
}
.q-text { font-size: 0.95rem; font-weight: 600; color: #ddd8cc;
  margin-bottom: 14px; line-height: 1.55; }
.options { display: flex; flex-direction: column; gap: 8px; }
.opt-btn {
  background: #141928; border: 1.5px solid #1a2438; border-radius: 8px;
  padding: 11px 14px; font-size: 0.85rem; color: #aaa8a0; font-family: inherit;
  cursor: pointer; text-align: left; transition: all .12s; line-height: 1.45;
}
.opt-btn:hover:not(:disabled) { border-color: #445060; color: #ddd8cc; }
.opt-btn.selected { border-color: #f0c060; color: #f0c060; background: #1a1800; }
.opt-btn.correct  { border-color: #60d090; color: #60d090; background: #0a1a0c; }
.opt-btn.wrong    { border-color: #d07060; color: #d07060; background: #1a0a08; }
.opt-btn:disabled { cursor: default; }
.opt-letter { font-weight: 700; margin-right: 8px; opacity: .7; }

/* Nav */
.nav-row { display: flex; gap: 10px; margin-bottom: 14px; }
.nav-btn {
  flex: 1; padding: 13px; background: #141928; color: #ddd8cc;
  border: 1px solid #1a2438; border-radius: 10px;
  font-size: 0.85rem; cursor: pointer; font-family: inherit; transition: border-color .15s;
}
.nav-btn:hover:not(:disabled) { border-color: #445060; }
.nav-btn:disabled { opacity: .35; cursor: default; }
.submit-btn {
  width: 100%; padding: 14px;
  background: linear-gradient(135deg, #1d5035, #2a7a50);
  color: #60d090; border: none; border-radius: 10px;
  font-size: 0.95rem; font-weight: 700; cursor: pointer; font-family: inherit;
  margin-bottom: 14px;
}
.submit-btn:hover { opacity: .9; }
.quit-btn {
  width: 100%; padding: 11px; background: none; color: #445060;
  border: 1px solid #1a2438; border-radius: 10px;
  font-size: 0.78rem; cursor: pointer; font-family: inherit;
}
.quit-btn:hover { color: #d07060; border-color: #4a1a18; }

/* Jump grid */
.jump-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; }
.jump-cell {
  aspect-ratio: 1; border-radius: 6px; border: 1px solid #1a2438;
  background: #141928; color: #445060; font-size: 0.66rem;
  cursor: pointer; font-family: inherit; display: flex;
  align-items: center; justify-content: center; padding: 0;
}
.jump-cell.answered { color: #ddd8cc; border-color: #445060; }
.jump-cell.now { border-color: #f0c060; color: #f0c060; }
.jump-cell.flagged { background: #1a1800; }
.jump-cell.ok   { border-color: #1a4a1a; color: #60d090; background: #0a1a0c; }
.jump-cell.bad  { border-color: #4a1a18; color: #d07060; background: #1a0a08; }

/* Result */
.result-head { text-align: center; padding: 22px 18px; }
.result-score { font-size: 3rem; font-weight: 700; color: #f0c060; }
.result-label { font-size: 0.72rem; color: #445060; text-transform: uppercase;
  letter-spacing: 1px; margin-bottom: 14px; }
.result-time { font-size: 0.82rem; color: #60a0d0; margin-bottom: 12px; }
.result-band { font-size: 0.92rem; color: #ddd8cc; line-height: 1.7; }
.result-band b { color: #60d090; }
.lv-table { margin: 14px auto 0; max-width: 300px; font-size: 0.78rem; color: #aaa8a0; }
.lv-row { display: flex; justify-content: space-between; padding: 4px 2px; border-bottom: 1px solid #1c2430; }
.lv-row b { color: #ddd8cc; font-weight: 700; }
.q-play { display: flex; gap: 8px; margin: 10px 0 2px; }
.q-play button.mark { border-color: #3a4656; background: none; color: #aaa8a0; font-weight: 400; }
.mark-note { min-height: 1.2em; font-size: 0.74rem; color: #aaa8a0; }
.mark-note a { color: #60a0d0; cursor: pointer; text-decoration: underline; }
.q-play button { flex: 1; padding: 11px 8px; border-radius: 9px; border: 1px solid #f0c060; background: #1a1800;
  color: #f0c060; font: inherit; font-size: 0.86rem; font-weight: 700; cursor: pointer; }
.caveat { font-size: 0.68rem; color: #445060; line-height: 1.6; margin-top: 12px; }

/* Review */
.rev-item { border-bottom: 1px solid #141928; padding: 14px 0; }
.rev-item:last-child { border-bottom: none; }
.rev-head { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; margin-bottom: 8px; }
.rev-mark { font-weight: 700; }
.rev-mark.ok { color: #60d090; }
.rev-mark.bad { color: #d07060; }
.rev-q { flex: 1; color: #ddd8cc; font-size: 0.82rem; line-height: 1.45; }
.rev-line { font-size: 0.78rem; color: #aaa8a0; margin: 3px 0; line-height: 1.5; }
.rev-line .k { color: #445060; }
.rev-toggle {
  background: none; border: 1px solid #1a2438; border-radius: 6px;
  color: #60a0d0; font-size: 0.7rem; padding: 4px 10px; cursor: pointer;
  font-family: inherit; margin-top: 6px;
}
.rev-detail { display: none; margin-top: 8px; padding: 10px 12px;
  background: #0a0c16; border-radius: 7px; }
.rev-detail.show { display: block; }
.voice-btn { margin-top: 8px; padding: 6px 12px; border-radius: 8px; border: 1px solid #333c48; background: transparent; color: #aaa8a0; font: inherit; font-size: .8rem; cursor: pointer; }
.seek-row { display: flex; flex-wrap: wrap; gap: 8px; }
.q-report { margin-top: 10px; display: flex; align-items: center; justify-content: flex-end; gap: 8px; font-size: .75rem; color: #808890; }
.q-report button { padding: 4px 10px; border-radius: 8px; border: 1px solid #333c48; background: transparent; color: #808890; font: inherit; cursor: pointer; }
.voice-btn.on { border-color: #f0c060; color: #f0c060; }
.single-res { margin-top: 12px; font-weight: 700; font-size: 1rem; }
.single-res.ok { color: #60d090; } .single-res.bad { color: #d07060; } .single-res.none { color: #aaa8a0; font-weight: 400; }
.single-next { width: 100%; margin-top: 12px; padding: 13px; border-radius: 10px; border: 0; background: #f0c060; color: #1a1408; font: inherit; font-weight: 700; cursor: pointer; }
.single-skip { display: block; margin: 12px 0 0 auto; padding: 6px 12px; border-radius: 8px; border: 1px solid #333c48; background: transparent; color: #aaa8a0; font: inherit; font-size: .8rem; cursor: pointer; }
.jump-cell.skipped { color: #808890; border-style: dashed; }
.rev-detail h4 { font-size: 0.68rem; color: #f0c060; text-transform: uppercase;
  letter-spacing: 1px; margin: 10px 0 4px; }
.rev-detail h4:first-child { margin-top: 0; }
/* 詳解旁的大按鈕：貼在畫面下緣，邊讀詳解邊倒退重聽（11-10 Owen） */
.big-ctl { position: sticky; bottom: 10px; z-index: 5; display: flex; gap: 8px; margin: 2px 0 10px;
  padding: 6px; background: #0a0c16; border-radius: 10px; }
.big-ctl button { flex: 1; padding: 14px 4px; border-radius: 9px; border: 1.5px solid #2a5a7a; background: #12223a;
  color: #cfe6f7; font: inherit; font-size: 0.95rem; font-weight: 700; cursor: pointer; }
.rev-detail p { font-size: 0.78rem; color: #aaa8a0; line-height: 1.65; white-space: pre-wrap; }
.rev-detail img { width: 100%; border-radius: 6px; background: #fff; margin-bottom: 8px; }

/* History */
.hist-row { display: flex; gap: 10px; align-items: center; padding: 7px 0;
  border-bottom: 1px solid #141928; font-size: 0.76rem; }
.hist-row:last-child { border-bottom: none; }
.h-date { color: #445060; min-width: 74px; }
.h-name { flex: 1; color: #aaa8a0; }
.h-score { font-weight: 700; min-width: 46px; text-align: right; }
.h-score.good { color: #60d090; }
.h-score.mid  { color: #c09040; }
.h-score.low  { color: #d07060; }

.panel { display: none; }
.panel.active { display: block; }
.msg { font-size: 0.8rem; color: #445060; line-height: 1.6; }
.err { color: #d07060; }

/* ── 課本聽力（11-10 從 book_listen.html 併進來，Owen：「跟 TCF 放在同個頁面，往下滑就好」） ── */
#bookCard .book-row { display: flex; gap: 8px; margin-bottom: 14px; }
#bookCard .book-btn { flex: 1; padding: 11px 6px; border-radius: 9px; cursor: pointer; background: #141928;
  border: 1.5px solid #1a2438; color: #aaa8a0; font-family: inherit; font-size: 0.84rem; }
#bookCard .book-btn.on { border-color: #f0c060; color: #f0c060; background: #1a1800; font-weight: 700; }
#bookCard .go-btn { width: 100%; padding: 13px; border: none; border-radius: 9px; font-family: inherit; font-size: 0.92rem;
  font-weight: 700; cursor: pointer; background: linear-gradient(135deg, #1d3550, #2a5a7a); color: #cfe6f7; margin-bottom: 14px; }
#bookCard .unit { margin-bottom: 14px; }
#bookCard .unit-head { display: flex; justify-content: space-between; align-items: center; font-size: 0.78rem;
  color: #f0c060; margin: 0 2px 6px; }
#bookCard .unit-head .later { color: #445060; font-size: 0.68rem; margin-left: 6px; }
#bookCard .unit-skip { background: none; border: 1px solid #1a2438; color: #6a7488; border-radius: 6px; font-family: inherit;
  font-size: 0.66rem; padding: 3px 8px; cursor: pointer; }
#bookCard .trk { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: #0d1020; border: 1px solid #1a2438;
  border-radius: 9px; margin-bottom: 6px; cursor: pointer; }
#bookCard .trk:hover { border-color: #445060; }
#bookCard .trk .no { font-size: 0.68rem; color: #445060; width: 30px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
#bookCard .trk .tt { flex: 1; font-size: 0.82rem; line-height: 1.4; }
#bookCard .trk .meta { font-size: 0.64rem; color: #445060; }
#bookCard .badge { font-size: 0.64rem; padding: 2px 7px; border-radius: 10px; white-space: nowrap; }
#bookCard .b-ok { color: #8fd0a8; border: 1px solid #2a5a3a; }
#bookCard .b-again { color: #e0b060; border: 1px solid #5a4a20; }
#bookCard .b-skip { color: #7a8090; border: 1px solid #2a3040; }
#bookCard .p-title { font-size: 0.95rem; font-weight: 700; line-height: 1.5; }
#bookCard .p-meta { font-size: 0.68rem; color: #445060; margin-top: 4px; }
#bookCard .steps { display: flex; gap: 6px; margin: 14px 0 4px; }
#bookCard .step { flex: 1; text-align: center; padding: 8px 4px; border-radius: 8px; font-size: 0.74rem; background: #141928;
  border: 1.5px solid #1a2438; color: #6a7488; cursor: pointer; font-family: inherit; }
#bookCard .step.on { border-color: #f0c060; color: #f0c060; font-weight: 700; }
#bookCard audio { width: 100%; margin-top: 12px; filter: invert(0.9) hue-rotate(180deg); }
#bookCard .seek-row { display: flex; gap: 8px; margin-top: 8px; }
#bookCard .seek-row button { flex: 1; padding: 10px; background: #141928; border: 1.5px solid #1a2438; border-radius: 8px;
  color: #aaa8a0; font-family: inherit; font-size: 0.82rem; cursor: pointer; }
#bookCard .hint { font-size: 0.8rem; color: #8a92a4; line-height: 1.6; margin: 14px 0 10px; }
#bookCard .script { background: #090b16; border: 1px solid #1a2438; border-radius: 9px; padding: 12px 14px; margin: 12px 0;
  font-size: 0.92rem; line-height: 1.75; color: #e6e1d4; max-height: 52vh; overflow-y: auto; }
#bookCard .script p { margin-bottom: 8px; }
#bookCard .script .spk { color: #60a0d0; font-size: 0.8rem; }
#bookCard .ocr-note { font-size: 0.66rem; color: #6a7488; margin-top: -4px; margin-bottom: 8px; }
#bookCard .main-btn { width: 100%; padding: 13px; border-radius: 9px; border: none; font-family: inherit; font-size: 0.9rem;
  font-weight: 700; cursor: pointer; background: linear-gradient(135deg, #1d3550, #2a5a7a); color: #cfe6f7; margin-top: 4px; }
#bookCard .pair { display: flex; gap: 8px; margin-top: 4px; }
#bookCard .pair button { flex: 1; padding: 13px; border-radius: 9px; font-family: inherit; font-size: 0.9rem; font-weight: 700; cursor: pointer; }
#bookCard .btn-ok { background: #13281c; border: 1.5px solid #2a5a3a; color: #8fd0a8; }
#bookCard .btn-again { background: #241e0c; border: 1.5px solid #5a4a20; color: #e0b060; }
#bookCard .exits { display: flex; gap: 8px; margin-top: 16px; padding-top: 12px; border-top: 1px solid #141928; }
#bookCard .exits button { flex: 1; padding: 9px; background: none; border: 1px solid #1a2438; border-radius: 8px; color: #7a8090;
  font-family: inherit; font-size: 0.76rem; cursor: pointer; }
#bookCard .back { background: none; border: none; color: #60a0d0; font-family: inherit; font-size: 0.78rem; cursor: pointer; margin-bottom: 10px; }
#bookCard .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #1a2438; color: #ddd8cc;
  padding: 9px 16px; border-radius: 20px; font-size: 0.8rem; opacity: 0; transition: opacity .2s; pointer-events: none; }
#bookCard .toast.on { opacity: 1; }
#bookCard .err { color: #d07060; font-size: 0.82rem; line-height: 1.6; }
#bookCard .rlabel { font-size: 0.68rem; color: #f0c060; letter-spacing: 1px; margin: 14px 0 6px; }
#bookCard .qbox { background: #090b16; border: 1px solid #1a2438; border-radius: 9px; padding: 11px 13px; margin-bottom: 8px; }
#bookCard .qtext { font-size: 0.9rem; line-height: 1.55; color: #e6e1d4; }
#bookCard .zh-btn { background: none; border: 1px solid #1a2438; color: #6a7488; border-radius: 5px; font-size: 0.66rem;
  padding: 1px 6px; margin-left: 6px; cursor: pointer; font-family: inherit; vertical-align: middle; }
#bookCard .zh { display: none; font-size: 0.76rem; color: #8a92a4; margin-top: 4px; }
#bookCard .zh.on { display: block; }

  color: #ddd8cc; padding: 8px 10px; font-family: inherit; font-size: 0.84rem; }
#bookCard .opt { display: block; width: 100%; text-align: left; margin-top: 6px; padding: 9px 12px; background: #141928;
  border: 1.5px solid #1a2438; border-radius: 8px; color: #aaa8a0; font-family: inherit; font-size: 0.84rem; cursor: pointer; }
#bookCard .opt.sel { border-color: #60a0d0; color: #cfe6f7; }
#bookCard .opt.right { border-color: #2a5a3a; color: #8fd0a8; }
#bookCard .opt.wrong { border-color: #5a3a2a; color: #d09070; }
#bookCard .mine { font-size: 0.78rem; color: #8a92a4; margin-top: 6px; }
#bookCard .ans { font-size: 0.86rem; color: #cfe6f7; margin-top: 8px; line-height: 1.55; }
#bookCard .qnote { font-size: 0.72rem; color: #8a92a4; margin-top: 4px; line-height: 1.5; }

#bookCard .qmark button { flex: 1; padding: 7px; border-radius: 7px; background: none; border: 1px solid #1a2438; color: #7a8090;
  font-family: inherit; font-size: 0.74rem; cursor: pointer; }

#bookCard .qmark button.on[data-m=miss] { border-color: #5a4a20; color: #e0b060; }

#bookCard details.full summary, #bookCard details.rest summary { cursor: pointer; font-size: 0.78rem; color: #60a0d0; }
#bookCard details.rest { margin-top: 10px; }
#bookCard .qcount { font-size: 0.64rem; color: #60a0d0; margin-left: 6px; }

</style>
</head>
<body>

<div class="header">
  <a class="back" href="dashboard.html">← Retour au tableau de bord</a>
  <h1>🎯 TCF CANADA · EXAMEN BLANC</h1>
  <div class="sub">閱讀 39 題 · 聽力 39 題 · 真題題庫（2025-10～11）</div>
  <div class="sub"><a href="#bookCard" style="color:#60a0d0;text-decoration:none">🎧 課本聽力在最下面（A2 課本・練習本・B1）↓</a></div>
</div>

<!-- ══ 選單 ══ -->
<div class="panel active" id="setupPanel">
  <div class="card">
    <div class="card-title">Compétence</div>
    <div class="skill-row">
      <button class="skill-btn on" id="skReading" onclick="setSkill('reading')">📖 Compréhension écrite</button>
      <button class="skill-btn" id="skListening" onclick="setSkill('listening')">🎧 Compréhension orale</button>
    </div>
    <div class="toggle-row">
      <input type="checkbox" id="mockMode">
      <label for="mockMode">模擬考模式
        <span class="hint">聽力音檔只播一次、不能倒帶或暫停；作答中不顯示正解。關掉就是練習模式（可重聽、可回頭改）。</span>
      </label>
    </div>
    <div class="toggle-row">
      <input type="checkbox" id="instantMode">
      <label for="instantMode">單題模式：寫完一題馬上看解析
        <span class="hint">答完立刻對答案、看翻譯和解析，再按下一題。可以跳題，中途離開下次接著做，不換算分數。看過答案的套題就不能當模考用，Test 35–44 建議留到診斷考前。</span>
      </label>
    </div>
  </div>

  <div class="card">
    <div class="card-title" id="testListTitle">Choisir un test</div>

    <div class="msg" id="setupMsg" style="margin-top:12px"></div>
  </div>

  <div class="card" id="flagCard" style="display:none">
    <div class="card-title">Questions marquées</div>
    <div id="flagList"></div>
  </div>

  <div class="card" id="histCard" style="display:none">
    <div class="card-title">Historique</div>
    <div id="histRows"></div>
  </div>

  <div class="card" id="bookCard">
    <div class="card-title">課本聽力 · Édito A2／B1</div>
    <div id="blApp"></div>
    <div class="toast" id="blToast"></div>
  </div>
</div>

<!-- ══ 作答 ══ -->
<div class="panel" id="examPanel">
  <div class="exam-bar">
    <div class="bar-top">

        <div class="bar-label">Temps</div>

<div class="panel" id="resultPanel">
  <div class="card result-head">
    <div class="result-score" id="resScore"></div>
    <div class="result-label">Réponses correctes</div>
    <div class="result-time" id="resTime"></div>
    <div class="result-band" id="resBand"></div>
    <div class="lv-table" id="resLevels"></div>
    <div class="caveat" id="resCaveat"></div>
  </div>

  <div class="card">
    <div class="card-title">Navigation</div>
    <div class="jump-grid" id="resGrid"></div>
  </div>

    <div class="card-title">Correction détaillée</div>
    <div id="revList"></div>
  </div>

  <button class="submit-btn" onclick="backToSetup()">← Retour à la liste</button>

<script src="assets/tcf/exam/index.js"></script>
<script src="assets/tcf/exam/cues.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════
   TCF Canada 模擬考。資料來自 assets/tcf/exam/（本地，不進 repo）。
   ⛔ 只寫 tcfmock_* 的 localStorage key。
   ═══════════════════════════════════════════════════════════════ */
const LS_FLAGS = 'tcfmock_flags';
const LS_HIST  = 'tcfmock_history';
const LS_SET   = 'tcfmock_settings';
const LS_SINGLE = 'tcfmock_single';   // 單題模式的進度：{ 套題id: {answers, skipped, idx, last} }
const DATA_DIR = 'assets/tcf/exam/';

/* 題號 → 等級與配分（2026-11-09）。題目本來就依 A1→C2 排列。
   ⚠️ 配分是補習班通用的估算（4／6／9／10／6／4 題，滿分剛好 699），官方沒有公開；
   官方手冊 p.18 只說：答對 1、答錯或空白 0，再依題目難度換算成 100–699，而且每個版本不同。 */
const LEVELS = [['A1',1,4,3],['A2',5,10,9],['B1',11,19,15],['B2',20,29,21],['C1',30,35,26],['C2',36,39,33]];
const levelOf = n => LEVELS.find(l => n >= l[1] && n <= l[2]);

/* CLB 對照表（抽自題庫 PDF 首頁） */
const CLB_TABLE = {
  reading:   [[549,699,'10+'],[524,548,'9'],[499,523,'8'],[453,498,'7'],[406,452,'6'],[375,405,'5'],[342,374,'4']],
  listening: [[549,699,'10+'],[523,548,'9'],[503,522,'8'],[458,502,'7'],[398,457,'6'],[369,397,'5'],[331,368,'4']]
};

let skill = 'reading';
let cache = {};              // id -> test object
let cur = null;              // { test, answers[], flags:Set, idx, t0, submitted }
let timerId = null;

/* ── storage helpers ─────────────────────────────────────────── */
function lsGet(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function getFlags() { return new Set(lsGet(LS_FLAGS, [])); }
function setFlags(s) { lsSet(LS_FLAGS, [...s]); }
function getHist() { return lsGet(LS_HIST, []); }

/* ── settings ────────────────────────────────────────────────── */
function loadSettings() {
  const s = lsGet(LS_SET, {});
  voiceOn = !!s.voice;
  document.getElementById('mockMode').checked = !!s.mock;
  document.getElementById('instantMode').checked = !!s.instant && !s.mock;
  if (s.skill) setSkill(s.skill);
}
function saveSettings() {
  lsSet(LS_SET, {
    mock: document.getElementById('mockMode').checked,
    instant: document.getElementById('instantMode').checked,
    voice: voiceOn,
    skill
  });
}
/* 模擬考與單題模式互斥：以前兩個都勾時單題會默默失效 */
['mockMode', 'instantMode'].forEach((id, n, all) => document.getElementById(id).addEventListener('change', e => {
  if (e.target.checked) document.getElementById(all[1 - n]).checked = false;
  saveSettings(); renderTestGrid();
}));

/* ── panels ──────────────────────────────────────────────────── */
function show(id) {
  ['setupPanel', 'examPanel', 'resultPanel'].forEach(p =>
    document.getElementById(p).classList.toggle('active', p === id));
  window.scrollTo(0, 0);
}

/* ── skill / test list ───────────────────────────────────────── */
function setSkill(s) {
  skill = s;
  document.getElementById('skReading').classList.toggle('on', s === 'reading');
  document.getElementById('skListening').classList.toggle('on', s === 'listening');
  saveSettings();
  renderTestGrid();
}

function renderTestGrid() {
  const grid = document.getElementById('testGrid');
  const msg  = document.getElementById('setupMsg');
  const idx = (window.TCF_INDEX || {})[skill] || [];
  if (!idx.length) {
    grid.innerHTML = '';
    msg.innerHTML = '<span class="err">找不到題庫資料。' +
      '請確認 assets/tcf/exam/index.js 存在，且這個頁面是用 http 伺服器開的。</span>';
    return;
  }
  const hist = getHist();
  const best = {};
  hist.forEach(h => { if (h.single) return; if (!(h.id in best) || h.correct > best[h.id]) best[h.id] = h.correct; });
  const going = document.getElementById('instantMode').checked ? lsGet(LS_SINGLE, {}) : {};
  grid.innerHTML = idx.map(t =>
    `<button class="test-btn${t.id in best ? ' done' : ''}" onclick="startTest('${t.id}')">` +
    `${t.label}<span class="tb-sub">${going[t.id] ? '接著做' : t.id in best ? best[t.id] + '/' + t.n : t.n + ' q'}</span></button>`
  ).join('');
  msg.textContent = idx.length + ' 套 · 每套 39 題' +
    (skill === 'listening' ? ' · 音檔約 30 分鐘' : '');
  renderFlagCard();
  renderHist();
}

/* ── data loading (script tag → works on file:// too) ─────────── */
window.TCF_LOAD = function (id, data) { cache[id] = data; };
function loadTest(id, cb) {
  if (cache[id]) { cb(cache[id]); return; }
  const s = document.createElement('script');
  s.src = DATA_DIR + 'data/' + id + '.js';
  s.onload = () => cache[id] ? cb(cache[id]) : cb(null);
  s.onerror = () => cb(null);
  document.head.appendChild(s);
}

/* ── start ───────────────────────────────────────────────────── */
function startTest(id) {
  if (window.BL) BL.stop();
  loadTest(id, t => {
    if (!t) { alert('讀不到 ' + id + ' 的題目檔。'); return; }
    cur = { test: t, answers: new Array(t.questions.length).fill(null),
            idx: 0, t0: Date.now(), submitted: false,
            mock: document.getElementById('mockMode').checked,
            instant: document.getElementById('instantMode').checked && !document.getElementById('mockMode').checked,
            skipped: new Set() };
    if (cur.instant) {            // 單題模式：中途離開過就接著做
      const old = lsGet(LS_SINGLE, {})[id];
      if (old && Array.isArray(old.answers) && old.answers.length === t.questions.length) {
        cur.answers = old.answers; cur.idx = Math.min(old.idx || 0, t.questions.length - 1); cur.skipped = new Set(old.skipped || []);
      }
    }
    document.getElementById('examTitle').textContent = t.label;
    document.getElementById('modeTag').textContent = cur.mock ? '模擬考模式' : cur.instant ? '單題模式' : '';
    document.getElementById('submitBtn').textContent = cur.instant ? '看總結' : 'Terminer et corriger';
    document.getElementById('quitBtn').textContent = cur.instant ? '先離開，下次接著做' : '放棄這次，回選單';
    buildAudio(t);
    renderQ(); renderJump(); startTimer();
    show('examPanel');
  });
}

/* ── audio ───────────────────────────────────────────────────── */
let audioEl = null, maxPlayed = 0;
function buildAudio(t) {
  const slot = document.getElementById('audioSlot');
  audioEl = null; maxPlayed = 0;
  if (t.skill !== 'listening' || !t.audio) { slot.innerHTML = ''; return; }
  const src = DATA_DIR + t.audio;
  if (cur.mock) {
    slot.innerHTML =
      '<button class="play-once" id="playOnce">▶ 開始播放（只播一次，不能倒帶）</button>' +
      '<audio id="au" preload="metadata" src="' + src + '"></audio>' +
      '<div class="audio-note">真考的音檔連續播完 39 題，中途不能停。按下去就開始。</div>';
    audioEl = document.getElementById('au');
    const btn = document.getElementById('playOnce');
    btn.onclick = () => { audioEl.play(); btn.disabled = true; btn.textContent = '▶ 播放中…'; };
    // 只准往前：任何倒帶都拉回已播最遠處
    on('timeupdate', el => { if (el.currentTime > maxPlayed) maxPlayed = el.currentTime; });
    // ⚠️ 修正動作本身也會再發一次 seeking。若那次 seek 落不了地（音檔還沒緩衝到、
    //    或伺服器不支援 Range），就會 seeking→改時間→seeking… 無限迴圈把分頁卡死。
    //    實測 1.5 秒內發了 85 萬次事件。fixing 閘門把修正壓成每 400ms 最多一次。
    let fixing = false;
    on('seeking', el => {
      if (fixing || el.currentTime >= maxPlayed - 0.6) return;
      fixing = true;
      el.currentTime = maxPlayed;
      setTimeout(() => { fixing = false; }, 400);
    });
    on('pause',      el => { if (!el.ended) el.play().catch(() => {}); });
  } else {
    slot.innerHTML =
      '<audio id="au" controls preload="metadata" src="' + voiceSrc(t) + '"></audio>' +
      '<div class="seek-row"><button class="voice-btn" onclick="seekBy(-5)">⏪ 5 秒</button>' +
      '<button class="voice-btn" onclick="seekBy(5)">5 秒 ⏩</button>' +
      '<button class="voice-btn" id="voiceBtn" onclick="toggleVoice()"></button></div>' +
      '<div class="audio-note">練習模式：可暫停、可倒帶重聽。想模擬真考就回選單打開「模擬考模式」。</div>';
    audioEl = document.getElementById('au');
    paintVoice();
    on('timeupdate', checkQEnd);
    on('seeking', el => { if (qEnd !== null && (el.currentTime >= qEnd || el.currentTime < qEnd - 400)) qEnd = null; });
  }
  on('error', el => {
    if (el.src.includes('audio_voice/')) {   // 加強版還沒做好：退回原音，不要讓他沒聲音
      voiceOn = false; saveSettings(); el.src = src; paintVoice();
      return;
    }
    document.getElementById('audioSlot').innerHTML =
      '<div class="audio-note err">音檔載入失敗：' + src + '</div>';
  });

  /* ⭐ 所有音檔事件都要走這個閘：只有「還是現役那一顆 <audio>」的事件算數。
     不閘的話，上一套題被 stopAudio() 停掉時進入空狀態所發的 error，
     會在下一套題已經登場之後才飛進來，把新的播放器蓋成「音檔載入失敗」；
     mock 模式的 pause 監聽器還會在 audioEl 已經是 null 時丟 TypeError。
     （2026-09-01 首次實跑時踩到：聽力放棄一次→再進下一套，必複現） */
  function on(evt, fn) {
    const el = audioEl;
    el.addEventListener(evt, () => { if (el === audioEl) fn(el); });
  }
}
/* ── 人聲加強（11-09 Owen：Test 3 聲音好模糊）─────────────────
   ⛔ 不要改回 Web Audio（createMediaElementSource）：11-10 Owen 的 iPad 因此整段沒聲音，關掉並重新整理才恢復。
   現在是事先做好一份加強版音檔（tools/tcf_voice_audio.py → audio_voice/），開關只是換檔，
   iPad 上走的是一般 <audio>；長度相同，所以逐題起點不變。模擬考模式一律用原音。 */
let voiceOn = false;
function voiceSrc(t) { return DATA_DIR + (voiceOn ? t.audio.replace(/^audio\//, 'audio_voice/') : t.audio); }
function paintVoice() {
  const b = document.getElementById('voiceBtn'); if (!b) return;
  b.textContent = '🔊 人聲加強：' + (voiceOn ? '開' : '關'); b.classList.toggle('on', voiceOn);
}
function seekBy(d) {
  if (!audioEl) return;
  audioEl.currentTime = Math.max(0, Math.min(audioEl.duration || Infinity, audioEl.currentTime + d));
}
function toggleVoice() {
  if (!audioEl) return;
  const el = audioEl, t0 = el.currentTime, playing = !el.paused, end = qEnd;
  voiceOn = !voiceOn; saveSettings(); paintVoice();
  el.src = voiceSrc(cur.test);
  if (playing) el.play().catch(() => {});       // 要在點按當下呼叫，iPad 才准播
  el.addEventListener('loadedmetadata', () => { if (t0) el.currentTime = t0; qEnd = end; }, { once: true });
}

function stopAudio() {
  const el = audioEl;
  audioEl = null;                       // 先退位，接下來這顆發的事件就都不算數了
  if (el) {
    try { el.pause(); } catch (e) {}
    el.removeAttribute('src');          // ≠ src=''（那會去載頁面本身並丟 error）
    try { el.load(); } catch (e) {}
  }
  document.getElementById('audioSlot').innerHTML = '';
}

/* ── 逐題播放（練習模式）2026-11-09 ─────────────────────────────
   音檔還是整份一個檔，這裡只是跳到該題的起點、播到下一題前自動停。
   起點來自 tools/tcf_listening_cues.py（音檔自己報題號的位置）；找不到的題不顯示按鈕。
   ⛔ 模擬考模式不走這段：真考是連續播完、不能倒帶。 */
let qEnd = null;
let manualCues = {};   // Owen 手動標的分割點（存在 Mac mini 的 cues_manual.json），優先於自動結果
fetch('assets/tcf/exam/cues_manual.json', { cache: 'no-store' })
  .then(r => r.ok ? r.json() : {}).then(j => { manualCues = j || {}; }).catch(() => {});
function practising() { return cur && !cur.mock && cur.test.skill === 'listening'; }
function cueList() {
  const base = (window.TCF_CUES || {})[cur.test.id] || [], m = manualCues[cur.test.id] || {};
  return Array.from({ length: 39 }, (_, i) => m[i + 1] ? m[i + 1].t : (typeof base[i] === 'number' ? base[i] : null));
}
function cueOf(i) { return practising() ? cueList()[i] : null; }
function clock(t) { return Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0'); }
function saveCue(t, q) {
  return fetch('api/mock-cue', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ test: cur.test.id, q, t }) }).then(r => { if (!r.ok) throw 0; });
}
function markCue() {
  if (!audioEl || audioEl.currentTime < 0.5) { document.getElementById('markNote').textContent = '先播音檔，聽到這題開頭時再按'; return; }
  const q = cur.test.questions[cur.idx].q, id = cur.test.id, t = Math.max(0, audioEl.currentTime - 0.5);   // 扣掉按下去的反應時間
  saveCue(t, q).then(() => { (manualCues[id] = manualCues[id] || {})[q] = { t }; renderQ(); })
    .catch(() => { document.getElementById('markNote').textContent = '沒有存到，再按一次看看'; });
}
function undoCue() {
  const q = cur.test.questions[cur.idx].q, id = cur.test.id;
  saveCue(null, q).then(() => { delete (manualCues[id] || {})[q]; renderQ(); })
    .catch(() => { document.getElementById('markNote').textContent = '沒有復原成功，再按一次看看'; });
}
function playQuestion() {
  const start = cueOf(cur.idx);
  if (start === null || !audioEl) return;
  const next = cueList().slice(cur.idx + 1).find(x => typeof x === 'number' && x > start);
  qEnd = typeof next === 'number' ? next : null;   // 最後一題：播到結尾
  audioEl.currentTime = start;
  audioEl.play().catch(() => {});
}
function checkQEnd() {
  if (audioEl && qEnd !== null && audioEl.currentTime >= qEnd) { qEnd = null; audioEl.pause(); }
}

/* ── render one question ─────────────────────────────────────── */
function renderQ() {
  const t = cur.test, q = t.questions[cur.idx];
  const flags = getFlags(), fid = t.id + '#' + q.q;
  const picked = cur.answers[cur.idx];
  const revealed = cur.instant && picked !== null;
  const letters = ['A', 'B', 'C', 'D'];

  let html = `<div class="q-num"><span>Question ${q.q} / ${t.questions.length}</span>
    <button class="flag-btn${flags.has(fid) ? ' on' : ''}" onclick="toggleFlag()"
      title="標記這題">${flags.has(fid) ? '★' : '☆'}</button></div>`;
  if (practising()) {
    const mine = (manualCues[t.id] || {})[q.q];
    html += `<div class="q-play">${cueOf(cur.idx) !== null ? '<button onclick="playQuestion()">▶ 播這一題</button>' : ''}
      <button class="mark" onclick="markCue()">📍 這裡是第 ${q.q} 題開頭</button></div>
      <div class="mark-note" id="markNote">${mine ? '已標記在 ' + clock(mine.t) + ' · <a onclick="undoCue()">復原</a>' + (mine.chk ? '<br>' + (mine.chk === 'ok' ? '✅ 已核對' : '🔎 ' + esc(mine.msg || '請再聽一次確認')) : '') : '要標的是這題對話開始的地方；題號常在對話播完才念'}</div>`;
  }
  if (q.img) html += `<img class="doc-img" src="${DATA_DIR}${q.img}" alt="document">`;
  html += `<div class="q-text">${esc(q.stem)}</div><div class="options">`;
  q.opts.forEach((o, i) => {
    let cls = '';
    if (revealed) {
      if (letters[i] === q.answer) cls = ' correct';
      else if (i === picked) cls = ' wrong';
    } else if (i === picked) cls = ' selected';
    html += `<button class="opt-btn${cls}" ${revealed ? 'disabled' : ''} onclick="pick(${i})">
      <span class="opt-letter">${letters[i]}</span>${esc(o)}</button>`;
  });
  html += '</div>';
  if (revealed) {
    const ok = letters[picked] === q.answer, last = cur.idx === t.questions.length - 1;
    html += q.answer ? `<div class="single-res ${ok ? 'ok' : 'bad'}">${ok ? '✓ 答對' : '✗ 正解是 ' + q.answer}</div>`
                     : '<div class="single-res none">這題沒有正解資料</div>';
    html += detailHtml(q, t, true);
    html += `<button class="single-next" onclick="nextSingle()">${last ? '看總結' : '下一題 →'}</button>`;
  } else if (cur.instant) {
    html += '<button class="single-skip" onclick="skipSingle()">⏭ 這題跳過</button>';
  }
  html += '<div class="q-report"><span id="repNote"></span><button onclick="reportQ()">🚩 回報這題</button></div>';
  document.getElementById('qCard').innerHTML = html;

  document.getElementById('prevBtn').disabled = cur.idx === 0;
  document.getElementById('nextBtn').disabled = cur.idx === t.questions.length - 1;
  const done = cur.answers.filter(a => a !== null).length;
  document.getElementById('progVal').textContent = done + ' / ' + t.questions.length;
  renderJump();
}

function pick(i) {
  if (cur.instant && cur.answers[cur.idx] !== null) return;
  cur.answers[cur.idx] = i;
  if (cur.instant) {
    cur.skipped.delete(cur.idx); saveSingle();
    qEnd = null; if (audioEl) audioEl.pause();     // 看解析時不要繼續播到下一題
  }
  renderQ();
  if (cur.instant) { const r = document.querySelector('.single-res'); if (r) r.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
}
function go(d) {
  const n = cur.test.questions.length;
  cur.idx = Math.max(0, Math.min(n - 1, cur.idx + d));
  qEnd = null; if (audioEl && !cur.mock) audioEl.pause();
  saveSingle(); renderQ(); window.scrollTo(0, 0);
}
function jump(i) { cur.idx = i; qEnd = null; if (audioEl && !cur.mock) audioEl.pause(); saveSingle(); renderQ(); window.scrollTo(0, 0); }

/* ── 單題模式 2026-11-09（Owen：「我想每題寫完做解析」）──────────────
   跳過不計分、不算錯，有記下來但之後點回去還是可以作答。 */
function saveSingle() {
  if (!cur || !cur.instant) return;
  const all = lsGet(LS_SINGLE, {});
  all[cur.test.id] = { answers: cur.answers, skipped: [...cur.skipped], idx: cur.idx, last: Date.now() };
  lsSet(LS_SINGLE, all);
}
function clearSingle(id) { const all = lsGet(LS_SINGLE, {}); delete all[id]; lsSet(LS_SINGLE, all); }
function nextSingle() { if (cur.idx >= cur.test.questions.length - 1) submitExam(); else go(1); }
function skipSingle() { cur.skipped.add(cur.idx); saveSingle(); nextSingle(); }
function reportQ() {
  const q = cur.test.questions[cur.idx], note = window.prompt('第 ' + q.q + ' 題哪裡有問題？（直接打，會傳給 Claude）');
  if (!note || !note.trim()) return;
  const say = m => { const e = document.getElementById('repNote'); if (e) e.textContent = m; };
  fetch('api/mock-report', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ test: cur.test.id, q: q.q, note: note.trim().slice(0, 1000), t: audioEl ? Math.round(audioEl.currentTime) : null }) })
    .then(r => { if (!r.ok) throw 0; say('已送出'); }).catch(() => say('沒有送到，再按一次看看'));
}
function toggleFlag() {
  const fid = cur.test.id + '#' + cur.test.questions[cur.idx].q;
  const f = getFlags();
  f.has(fid) ? f.delete(fid) : f.add(fid);
  setFlags(f); renderQ();
}

function renderJump() {
  const t = cur.test, flags = getFlags();
  document.getElementById('jumpGrid').innerHTML = t.questions.map((q, i) => {
    let c = 'jump-cell';
    if (cur.answers[i] !== null) c += cur.instant && q.answer ? (['A', 'B', 'C', 'D'][cur.answers[i]] === q.answer ? ' ok' : ' bad') : ' answered';
    else if (cur.skipped.has(i)) c += ' skipped';
    if (i === cur.idx) c += ' now';
    if (flags.has(t.id + '#' + q.q)) c += ' flagged';
    return `<button class="${c}" onclick="jump(${i})">${q.q}</button>`;
  }).join('');
}

/* ── timer ───────────────────────────────────────────────────── */
function startTimer() {
  clearInterval(timerId);
  timerId = setInterval(() => {
    const s = Math.floor((Date.now() - cur.t0) / 1000);
    document.getElementById('timerVal').textContent =
      Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }, 500);
}

/* ── submit ──────────────────────────────────────────────────── */
function submitExam() {
  const t = cur.test;
  const blank = cur.answers.filter(a => a === null).length;
  if (blank && !cur.instant && !confirm('還有 ' + blank + ' 題沒作答，要現在交卷嗎？')) return;
  clearInterval(timerId);
  stopAudio();
  cur.submitted = true;
  const secs = Math.floor((Date.now() - cur.t0) / 1000);
  const letters = ['A', 'B', 'C', 'D'];
  let correct = 0, scorable = 0, points = 0;
  const byLevel = {};
  t.questions.forEach((q, i) => {
    if (!q.answer) return;              // 正解抽不到的題不計分
    if (cur.instant && cur.answers[i] === null) return;   // 單題模式：跳過或沒做到的不算
    scorable++;
    const lv = levelOf(q.q);
    const row = byLevel[lv[0]] = byLevel[lv[0]] || { ok: 0, n: 0 };
    row.n++;
    if (cur.answers[i] !== null && letters[cur.answers[i]] === q.answer) { correct++; row.ok++; points += lv[3]; }
  });

  document.getElementById('resScore').textContent = correct + ' / ' + scorable;
  document.getElementById('resTime').textContent =
    '用時 ' + Math.floor(secs / 60) + ' 分 ' + String(secs % 60).padStart(2, '0') + ' 秒' +
    (blank && !cur.instant ? ' · 空白 ' + blank + ' 題' : '');

  const est = Math.max(100, points);   // 官方分數範圍 100–699
  const cefr = ['A1','A2','B1','B2','C1','C2'][Math.min(5, Math.floor(est / 100) - 1)];
  const band = (CLB_TABLE[t.skill] || []).find(b => est >= b[0] && est <= b[1]);
  document.getElementById('resBand').innerHTML =
    '粗估 <b>' + est + '</b> 分 · 約 <b>' + cefr + '</b> · CLB <b>' + (band ? band[2] : '4 以下') + '</b>';
  if (cur.instant) document.getElementById('resBand').textContent = '單題模式看過解析，不換算分數';
  document.getElementById('resLevels').innerHTML = LEVELS.filter(l => byLevel[l[0]]).map(l =>
    '<div class="lv-row"><span>' + l[0] + '（第 ' + l[1] + '–' + l[2] + ' 題）</span><b>' + byLevel[l[0]].ok + ' / ' + byLevel[l[0]].n + '</b></div>').join('');
  document.getElementById('resCaveat').textContent = cur.instant ? '' :
    '粗估用補習班常見的每題配分（A1 3、A2 9、B1 15、B2 21、C1 26、C2 33），官方沒有公開，真正的換算每個版本不同，只能當方向參考。' +
    '做過或看過的題目分數會偏高。CLB 7 的門檻：' +
    (t.skill === 'reading' ? '閱讀 453 分' : '聽力 458 分') + '。';

  document.getElementById('resGrid').innerHTML = t.questions.map((q, i) => {
    if (cur.instant && cur.answers[i] === null) return `<button class="jump-cell skipped">${q.q}</button>`;
    const ok = q.answer && cur.answers[i] !== null && letters[cur.answers[i]] === q.answer;
    return `<button class="jump-cell ${ok ? 'ok' : 'bad'}" onclick="scrollRev(${i})">${q.q}</button>`;
  }).join('');

  const flags = getFlags();
  document.getElementById('revList').innerHTML = t.questions.map((q, i) => {
    if (cur.instant && cur.answers[i] === null) return '';
    const pickedL = cur.answers[i] === null ? null : letters[cur.answers[i]];
    const ok = q.answer && pickedL === q.answer;
    const fid = t.id + '#' + q.q;
    return `<div class="rev-item" id="rev${i}">
      <div class="rev-head">
        <span class="rev-mark ${ok ? 'ok' : 'bad'}">${ok ? '✓' : '✗'}</span>
        <span class="rev-q">${q.q}. ${esc(q.stem)}</span>
        <button class="flag-btn${flags.has(fid) ? ' on' : ''}" onclick="revFlag('${fid}',this)">
          ${flags.has(fid) ? '★' : '☆'}</button>
      </div>
      <div class="rev-line"><span class="k">你選：</span>${pickedL ? pickedL + '. ' + esc(q.opts[cur.answers[i]]) : '（空白）'}</div>
      <div class="rev-line"><span class="k">正解：</span>${q.answer ? q.answer + '. ' + esc(q.opts['ABCD'.indexOf(q.answer)] || '') : '（此題正解未能從原始檔抽出）'}</div>
      <button class="rev-toggle" onclick="this.nextElementSibling.classList.toggle('show')">解析 ▾</button>
      ${detailHtml(q, t)}
    </div>`;
  }).join('');

  const hist = getHist();
  if (!cur.instant || scorable) hist.push({ ts: Date.now(), id: t.id, label: t.label, skill: t.skill,
              correct, n: scorable, secs, mock: cur.mock, est, single: !!cur.instant });
  lsSet(LS_HIST, hist.slice(-200));
  if (cur.instant) clearSingle(t.id);

  show('resultPanel');
}

function scrollRev(i) {
  const el = document.getElementById('rev' + i);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
function revFlag(fid, btn) {
  const f = getFlags();
  f.has(fid) ? f.delete(fid) : f.add(fid);
  setFlags(f);
  btn.textContent = f.has(fid) ? '★' : '☆';
  btn.classList.toggle('on', f.has(fid));
}

/* ── explanation block ───────────────────────────────────────── */
/* 聽力逐字稿：原檔是 PDF 換行（一行斷在句子中間、換人說話卻接在同一行）→ 先接回去，再一句一行。
   11-10 Owen 回報 co_3 Q11「C'est vrai 應該已經換行了」。 */
function reflowFr(s) {
  return String(s || '').split('\n').map(l => l.trim()).filter(Boolean).join(' ')
    .replace(/([.?!…])\s+(?=[«"A-ZÀ-Ý–—-])/g, '$1\n')
    .replace(/\s+(Question\s*\d)/g, '\n$1');
}
function togglePlay() { if (audioEl) audioEl.paused ? audioEl.play() : audioEl.pause(); }
function detailHtml(q, t, inline) {   // inline：單題模式直接展開，圖片上面已經有了不重複
  const open = inline ? '<div class="rev-detail show">' : '<div class="rev-detail">';
  let h = open;
  if (t.skill === 'reading') {
    if (q.img && !inline) h += `<img src="${DATA_DIR}${q.img}" alt="document">`;
    if (q.src_zh)  h += '<h4>原文翻譯</h4><p>' + esc(q.src_zh) + '</p>';
    if (q.q_zh)    h += '<h4>題目翻譯</h4><p>' + esc(q.q_zh) + '</p>';
    if (q.key_zh)  h += '<h4>關鍵點解析</h4><p>' + esc(q.key_zh) + '</p>';
    if (q.opt_zh)  h += '<h4>選項分析</h4><p>' + esc(q.opt_zh) + '</p>';
  } else {
    /* 11-10 Owen 回報：詳解旁要有大的前進後退＋暫停（練習／單題才有，模考模式不會走到 inline） */
    if (inline) h += '<div class="big-ctl"><button onclick="seekBy(-5)">⏪ 5 秒</button>' +
      '<button onclick="togglePlay()">⏯ 播放／暫停</button><button onclick="seekBy(5)">5 秒 ⏩</button></div>';
    /* 選項翻譯（11-10 Owen 回報「答案也要翻譯」；佔位選項 Proposition a–d 那種沒有 opts_zh） */
    if (q.opts_zh) h += '<h4>選項翻譯</h4><p>' + q.opts_zh.map((z, i) => {
      const L = 'ABCD'[i], line = L + '. ' + esc(z);
      return L === q.answer ? '<b style="color:#60d090">' + line + '　← 正解</b>' : line;
    }).join('\n') + '</p>';
    if (q.script_fr) h += '<h4>Transcription</h4><p>' + esc(reflowFr(q.script_fr)) + '</p>';
    if (q.script_zh) h += '<h4>翻譯與解析</h4><p>' + esc(q.script_zh) + '</p>';
  }
  if (h === open) h += '<p>（這題沒有附解析）</p>';
  return h + '</div>';
}

/* ── setup extras ────────────────────────────────────────────── */
function renderFlagCard() {
  const f = [...getFlags()];
  const card = document.getElementById('flagCard');
  if (!f.length) { card.style.display = 'none'; return; }
  card.style.display = '';
  const byTest = {};
  f.forEach(x => { const [id, q] = x.split('#'); (byTest[id] = byTest[id] || []).push(q); });
  document.getElementById('flagList').innerHTML = Object.keys(byTest).sort().map(id => {
    const meta = findMeta(id);
    return `<div class="hist-row"><span class="h-name">${meta ? meta.label : id}
      <span style="color:#445060"> · ${meta ? (meta.skill === 'reading' ? '閱讀' : '聽力') : ''}</span></span>
      <span class="h-score mid">${byTest[id].sort((a, b) => a - b).join(', ')}</span></div>`;
  }).join('') +
  '<div class="msg" style="margin-top:10px">★ 標記存在本機（tcfmock_flags），重開這頁還在。</div>';
}
function findMeta(id) {
  for (const s of ['reading', 'listening'])
    for (const t of ((window.TCF_INDEX || {})[s] || []))
      if (t.id === id) return { ...t, skill: s };
  return null;
}
function renderHist() {
  const h = getHist().slice().reverse().slice(0, 12);
  const card = document.getElementById('histCard');
  if (!h.length) { card.style.display = 'none'; return; }
  card.style.display = '';
  document.getElementById('histRows').innerHTML = h.map(r => {
    const p = r.correct / r.n;
    const cls = p >= 0.8 ? 'good' : p >= 0.6 ? 'mid' : 'low';
    const d = new Date(r.ts);
    return `<div class="hist-row">
      <span class="h-date">${d.getMonth() + 1}/${d.getDate()}</span>
      <span class="h-name">${(r.skill === 'reading' ? '📖 ' : '🎧 ') + r.label}${r.mock ? ' · 模擬' : r.single ? ' · 單題' : ''}</span>
      <span class="h-score ${cls}">${r.correct}/${r.n}</span></div>`;
  }).join('');
}

/* ── misc ────────────────────────────────────────────────────── */
function quitExam() {
  if (cur.instant) saveSingle();
  else if (!confirm('放棄這次作答？不會留下紀錄。')) return;
  clearInterval(timerId); stopAudio(); cur = null; backToSetup();
}
function backToSetup() { renderTestGrid(); show('setupPanel'); }
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}


/* ══ 課本聽力（11-10 併入；原 book_listen.html，規格 PRD_textbook_listen.md）══
   ⚠️ 包在 IIFE 裡：lsGet／seekBy／audioEl 等名字跟模考的重複，對外只開 window.BL。
   ⛔ 只寫 tcfbook_* key。 */
(function () {
const LS_PROG = 'tcfbook_progress';   // { "a2/002": {s:'ok'|'again'|'skip', n, last} }
const LS_SET  = 'tcfbook_settings';   // { book, last:{a2:idx} }
const BOOKS = [
  { id: 'a2',  name: 'A2 課本' },
  { id: 'a2c', name: 'A2 練習本', ocr: true },
  { id: 'b1',  name: 'B1 課本' },
];
const B1_DONE = 3;   // B1 上到第幾單元（11-06 第49課進 Unité 3）；之後的單元照樣能聽，只標「還沒上」
const STATUS = { ok: ['聽懂了', 'b-ok'], again: ['還要再聽', 'b-again'], skip: ['跳過', 'b-skip'] };

function lsGet(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let DATA = {}, QS = {}, set = lsGet(LS_SET, {}), book = set.book || 'a2', idx = -1, step = 1, audioEl = null;
let mine = {};   // 這一軌這一輪的作答：{ qi: 文字 或 選項 index }（不存檔，只在畫面上對答案用）
/* 題目：assets/didier/_local/questions_<book>.json（課本原題＋中文答案＋逐字稿原句，見 PRD_textbook_listen.md） */
const qsOf = t => QS[book] && QS[book][String(t.track)];
const flatQs = q => q.rounds.flatMap(r => r.qs);
const keyOf = t => t.f.replace(/\.m4a$/, '');
const prog = () => lsGet(LS_PROG, {});
const fmt = s => Math.floor(s / 60) + ':' + String(Math.round(s % 60)).padStart(2, '0');

function toast(m) { const t = document.getElementById('blToast'); t.textContent = m; t.classList.add('on');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 1600); }

async function load(b) {
  if (DATA[b]) return DATA[b];
  const r = await fetch('assets/didier/_local/' + b + '.json');
  if (!r.ok) throw new Error(r.status);
  try { const q = await fetch('assets/didier/_local/questions_' + b + '.json'); QS[b] = q.ok ? await q.json() : {}; }
  catch (e) { QS[b] = {}; }
  // ⛔ 沒有逐字稿的軌不列（11-10 Owen：「沒有附逐字稿…我大概也不會聽」，A2 課本 35 軌）
  return (DATA[b] = (await r.json()).filter(t => t.text));
}

function mark(t, s) {
  const p = prog(), r = p[keyOf(t)] || { n: 0 };
  r.s = s; r.n = (r.n || 0) + 1; r.last = Date.now();
  p[keyOf(t)] = r; lsSet(LS_PROG, p);
}
/* 每題自評：got 抓到了／miss 沒抓到／skip 跳過（跳過不算錯，照專案鐵律） */
function markQ(qi, m) {
  const t = DATA[book][idx], p = prog(), r = p[keyOf(t)] || { n: 0 };
  r.q = r.q || {}; r.q[qi] = m; r.qlast = Date.now();
  p[keyOf(t)] = r; lsSet(LS_PROG, p);
  document.querySelectorAll(`.qmark[data-q="${qi}"] button`).forEach(b => b.classList.toggle('on', b.dataset.m === m));
}

/* 下一軌：沒有紀錄或標了「還要再聽」的，從 from 往後找，繞一圈；⭐ 有題目的軌優先 */
function nextPending(list, from) {
  const p = prog(), pending = i => { const r = p[keyOf(list[i])]; return !r || !r.s || r.s === 'again'; };
  for (const needQ of [true, false])
    for (let k = 1; k <= list.length; k++) {
      const i = (from + k + list.length) % list.length;
      if (pending(i) && (!needQ || qsOf(list[i]))) return i;
    }
  return -1;
}

/* ── 列表 ───────────────────────────────────────────── */
async function renderList() {
  stopAudio(); idx = -1;
  const app = document.getElementById('blApp');
  app.innerHTML = '<div class="book-row">' + BOOKS.map(b =>
    `<button class="book-btn ${b.id === book ? 'on' : ''}" onclick="BL.pickBook('${b.id}')">${b.name}</button>`).join('') + '</div><div id="lst">載入中…</div>';
  let list;
  try { list = await load(book); }
  catch (e) { document.getElementById('lst').innerHTML = '<div class="card err">讀不到課本音檔清單。這頁要從 Mac mini 開（7799），正式站上沒有課本檔案。</div>'; return; }
  const p = prog();
  const units = idxs => {
    const groups = [];
    idxs.forEach(i => {
      const u = list[i].unit || 0, g = groups.find(x => x.u === u) || (groups.push({ u, items: [] }), groups[groups.length - 1]);
      g.items.push(i);
    });
    groups.sort((a, b) => (a.u || 99) - (b.u || 99));
    return groups.map(g => {
      const later = book === 'b1' && g.u > B1_DONE;
      return `<div class="unit"><div class="unit-head"><span>${g.u ? 'Unité ' + g.u : '其他'}${later ? '<span class="later">還沒上</span>' : ''}</span>
        <button class="unit-skip" onclick="BL.skipUnit(${g.u})">跳過這單元還沒聽的</button></div>` +
        g.items.map(i => {
          const t = list[i], r = p[keyOf(t)], st = r && STATUS[r.s], q = qsOf(t);
          return `<div class="trk" onclick="BL.openTrack(${i})"><span class="no">${t.track}</span>
            <span class="tt">${esc(t.title || '（沒有標題）')}${q ? `<span class="qcount">${flatQs(q).length} 題</span>` : ''}
            <div class="meta">${t.page ? 'p.' + t.page + ' · ' : ''}${fmt(t.dur)}</div></span>
            ${st ? `<span class="badge ${st[1]}">${st[0]}</span>` : ''}</div>`;
        }).join('') + '</div>';
    }).join('');
  };
  const all = list.map((_, i) => i), withQ = all.filter(i => qsOf(list[i])), rest = all.filter(i => !qsOf(list[i]));
  let html = '<button class="go-btn" onclick="BL.resume()">▶ 接著聽</button>';
  if (withQ.length) {
    html += units(withQ) + `<details class="rest"><summary>其他軌（題目還沒搬上來，只能盲聽＋對逐字稿）</summary><div style="margin-top:10px">${units(rest)}</div></details>`;
  } else {
    html += '<div class="note-top">這本的題目還沒搬上來，先只能盲聽＋對逐字稿。</div>' + units(all);
  }
  document.getElementById('lst').innerHTML = html;
}
function pickBook(b) { book = b; set.book = b; lsSet(LS_SET, set); renderList(); }
function resume() {
  const list = DATA[book], last = (set.last || {})[book] ?? -1;
  const i = nextPending(list, last);
  if (i < 0) { toast('這本都有紀錄了，點任一軌可以再聽'); return; }
  openTrack(i);
}
function skipUnit(u) {
  const list = DATA[book], p = prog(); let n = 0;
  list.forEach(t => { if ((t.unit || 0) === u && !p[keyOf(t)]) { mark(t, 'skip'); n++; } });
  toast(n ? '先跳過了，之後想聽隨時點' : '這單元的每一軌都有紀錄了');
  renderList();
}

/* ── 播放 ───────────────────────────────────────────── */
function stopAudio() { if (audioEl) { audioEl.pause(); audioEl = null; } }
function openTrack(i) {
  stopAudio(); idx = i; step = 1; mine = {};
  document.getElementById('bookCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
  set.last = set.last || {}; set.last[book] = i; lsSet(LS_SET, set);
  const t = DATA[book][i], bk = BOOKS.find(b => b.id === book), hasQ = !!qsOf(t);
  const r = prog()[keyOf(t)], st = r && STATUS[r.s];
  document.getElementById('blApp').innerHTML = `
    <button class="back" onclick="BL.renderList()">← ${bk.name}列表</button>
    <div class="card">
      <div class="p-title">${esc(t.title || '第 ' + t.track + ' 軌')}</div>
      <div class="p-meta">${bk.name} · 第 ${t.track} 軌${t.unit ? ' · Unité ' + t.unit : ''}${t.page ? ' · p.' + t.page : ''} · ${fmt(t.dur)}${st ? ' · 上次：' + st[0] : ''}</div>
      <div class="steps">
        <button class="step" data-s="1" onclick="BL.goStep(1)">${hasQ ? '① 聽＋答題' : '① 盲聽'}</button>
        <button class="step" data-s="2" onclick="BL.goStep(2)">${hasQ ? '② 對答案' : '② 對逐字稿'}</button>
        <button class="step" data-s="3" onclick="BL.goStep(3)">③ 再聽一次</button>
      </div>
      <audio id="au" controls preload="metadata" src="assets/didier/m4a/${t.f}"></audio>
      <div class="seek-row">
        <button onclick="BL.seekBy(-5)">⏪ 5 秒</button>
        <button onclick="BL.seekBy(5)">5 秒 ⏩</button>
        <button onclick="BL.seekTo0()">⏮ 從頭</button>
      </div>
      <div id="stepBody"></div>
      <div class="exits">
        <button onclick="BL.finish('ok')">會了</button>
        <button onclick="BL.finish('skip')">這軌跳過</button>
      </div>
    </div>`;
  audioEl = document.getElementById('au');
  audioEl.onerror = () => { document.getElementById('stepBody').innerHTML = '<div class="hint err">音檔讀不到，按「這軌跳過」先往下。</div>'; };
  paintStep();
}
function seekBy(d) { if (audioEl) audioEl.currentTime = Math.max(0, Math.min(audioEl.duration || Infinity, audioEl.currentTime + d)); }
function seekTo0() { if (audioEl) audioEl.currentTime = 0; }
function goStep(s) {
  if (s === 3 && step !== 3 && audioEl) { audioEl.pause(); audioEl.currentTime = 0; }
  step = s; paintStep();
}

/* 逐字稿排版：PDF 換行接回去，說話人另起一段；練習本把「a. … - b. …」拆成一行一題 */
function scriptHtml(t) {
  let txt = String(t.text || '');
  if (book === 'a2c') txt = txt.replace(/\s+-\s*\n?\s*(?=[a-z]\.\s)/g, '\n§');
  const paras = [];
  txt.split('\n').forEach(line => {
    line = line.trim(); if (!line) return;
    const isNew = /^§/.test(line) || /^[A-ZÀ-Ý][^:\n]{0,38}\s?:/.test(line) || /^[a-z]\.\s/.test(line) || !paras.length;
    line = line.replace(/^§/, '');
    if (isNew) paras.push(line);
    else paras[paras.length - 1] += (/-$/.test(paras[paras.length - 1]) ? '' : ' ') + line;
  });
  return paras.map(p => {
    const m = p.match(/^([A-ZÀ-Ý][^:]{0,38}?)\s?:\s?(.*)$/);
    return m && !/^[a-z]\./.test(p) ? `<p><span class="spk">${esc(m[1])}：</span>${esc(m[2])}</p>` : `<p>${esc(p)}</p>`;
  }).join('');
}

/* ── 有題目的軌：① 聽＋答題 ② 對答案 ─────────────────── */
function qHead(q, qi) {
  return `<div class="qtext">${esc(q.q)}<button class="zh-btn" onclick="this.parentNode.nextElementSibling.classList.toggle('on')">中</button></div>
    <div class="zh">${esc(q.zh || '')}</div>`;
}
function paintQuestions(body, t) {
  let qi = 0, html = '<div class="hint">先看題目再聽。可以打幾個關鍵字（不打也行），想好了就對答案。</div>';
  qsOf(t).rounds.forEach(r => {
    html += `<div class="rlabel">${esc(r.label)}</div>`;
    r.qs.forEach(q => {
      const k = qi++;
      html += `<div class="qbox">${qHead(q, k)}` + (q.opts
        ? q.opts.map((o, j) => `<button class="opt ${mine[k] === j ? 'sel' : ''}" onclick="BL.pickOpt(${k},${j},this)">${'ABCDEFGHIJ'[j]}. ${esc(o)}</button>`).join('')
        : `<input placeholder="關鍵字（可空白）" value="${esc(mine[k] || '')}" oninput="BL.setMine(${k},this.value)">`) + '</div>';
    });
  });
  body.innerHTML = html + '<button class="main-btn" onclick="BL.goStep(2)">對答案 →</button>';
}
function pickOpt(k, j, el) {
  mine[k] = j;
  el.parentNode.querySelectorAll('.opt').forEach(b => b.classList.remove('sel'));
  el.classList.add('sel');
}
function paintAnswers(body, t) {
  const rec = (prog()[keyOf(t)] || {}).q || {};
  let qi = 0, html = '';
  qsOf(t).rounds.forEach(r => {
    html += `<div class="rlabel">${esc(r.label)}</div>`;
    r.qs.forEach(q => {
      const k = qi++;
      html += `<div class="qbox">${qHead(q, k)}`;
      if (q.opts) {
        html += q.opts.map((o, j) => `<div class="opt ${j === q.ans ? 'right' : mine[k] === j ? 'wrong' : ''}">${'ABCDEFGHIJ'[j]}. ${esc(o)}</div>`).join('');
      } else if (mine[k] && mine[k].trim()) {
        html += `<div class="mine">你寫的：${esc(mine[k])}</div>`;
      }
      html += `<div class="ans">${esc(q.a)}</div>` + (q.note ? `<div class="qnote">${esc(q.note)}</div>` : '') +
        q.ev.map(e => `<div class="ev">${esc(e)}</div>`).join('');
      if (!q.opts) html += `<div class="qmark" data-q="${k}">` +
        [['got', '抓到了'], ['miss', '沒抓到'], ['skip', '跳過']].map(([m, l]) =>
          `<button data-m="${m}" class="${rec[k] === m ? 'on' : ''}" onclick="BL.markQ(${k},'${m}')">${l}</button>`).join('') + '</div>';
      html += '</div>';
    });
  });
  body.innerHTML = html +
    `<details class="full"><summary>看整篇逐字稿</summary><div class="script">${scriptHtml(t)}</div></details>` +
    '<button class="main-btn" onclick="BL.goStep(3)">下一步：再聽一次不看字 →</button>';
  /* 選擇題自動記對錯；沒選的不記（不算錯） */
  qi = 0;
  qsOf(t).rounds.forEach(r => r.qs.forEach(q => { const k = qi++; if (q.opts && mine[k] !== undefined) markQ(k, mine[k] === q.ans ? 'got' : 'miss'); }));
}

function paintStep() {
  document.querySelectorAll('.step').forEach(b => b.classList.toggle('on', +b.dataset.s === step));
  const t = DATA[book][idx], body = document.getElementById('stepBody');
  if (step === 1 && qsOf(t)) paintQuestions(body, t);
  else if (step === 2 && qsOf(t)) paintAnswers(body, t);
  else if (step === 1) {
    body.innerHTML = `<div class="hint">先不看字聽一次。卡住的地方可以倒退 5 秒，不用每個字都聽懂。</div>
      <button class="main-btn" onclick="BL.goStep(2)">下一步：看逐字稿 →</button>`;
  } else if (step === 2) {
    body.innerHTML = t.text
      ? `<div class="script">${scriptHtml(t)}</div>${BOOKS.find(b => b.id === book).ocr ? '<div class="ocr-note">練習本的逐字稿是掃描辨識的，偶爾會有錯字或漏字。</div>' : ''}
         <div class="hint" style="margin-top:4px">邊聽邊看，找出剛剛沒聽出來的地方。</div>
         <button class="main-btn" onclick="BL.goStep(3)">下一步：再聽一次不看字 →</button>`
      : `<div class="hint">這一軌課本沒有附逐字稿，直接再聽一次就好。</div>
         <button class="main-btn" onclick="BL.goStep(3)">下一步：再聽一次 →</button>`;
  } else {
    body.innerHTML = `<div class="hint">字收起來了，從頭再聽一次。聽完選一個：</div>
      <div class="pair"><button class="btn-ok" onclick="BL.finish('ok')">聽懂了</button>
      <button class="btn-again" onclick="BL.finish('again')">還要再聽</button></div>`;
  }
}

function finish(s) {
  const list = DATA[book];
  mark(list[idx], s);
  toast(s === 'ok' ? '記下了：聽懂了' : s === 'again' ? '記下了，之後會再排到' : '先跳過了');
  const n = nextPending(list, idx);
  if (n < 0 || n === idx) { renderList(); return; }
  openTrack(n);
}

document.addEventListener('keydown', e => {
  if (!audioEl || e.target.tagName === 'INPUT' || !document.getElementById('setupPanel').classList.contains('active')) return;
  if (e.key === 'ArrowLeft') seekBy(-5);
  else if (e.key === 'ArrowRight') seekBy(5);
  else if (e.key === ' ') { e.preventDefault(); audioEl.paused ? audioEl.play() : audioEl.pause(); }
});
renderList();
window.BL = { pickBook, openTrack, resume, skipUnit, renderList, goStep, seekBy, seekTo0, finish, pickOpt, markQ, stop: stopAudio, setMine: (k, v) => { mine[k] = v; } };
})();

/* ── boot ────────────────────────────────────────────────────── */
loadSettings();
renderTestGrid();
</script>
</body>

<style>

/* Done */

<!-- Start -->

<!-- Session -->

  </div>
  <div class="flashcard" id="flashcard">

    <div class="fc-think" id="fcThink">🧠 先回想法文，唸出聲，再翻開</div>

<!-- Done -->
<div id="doneScreen" class="hidden">
  <div class="card-box">
    <div class="done-big" id="doneScore">—</div>
    <div class="done-label">一次答對 / 總卡數</div>

    <div class="done-line" id="doneDue"></div>
  </div>
  <div class="btn-row">
    <button class="btn-again" id="againBtn">📦 再做一包</button>
    <a class="btn-home" href="dashboard.html">回指揮中心</a>
  </div>
</div>

<script src="chunks.js"></script>
<script>
// ── SRS 設定（successive relearning：3 個不同天答對＋間隔 ≥14 天 = 畢業）──
const INTERVALS = [1, 3, 7, 14, 30];   // 天
const PACKET_SIZE = 10;
const NEW_PER_DAY = 10;

// ── localStorage ─────────────────────────────────────────────
function getSrs()   { try { return JSON.parse(localStorage.getItem('clb7_chunk_srs')) || {}; } catch { return {}; } }
function saveSrs(s) { localStorage.setItem('clb7_chunk_srs', JSON.stringify(s)); }
function getSessions() { try { return JSON.parse(localStorage.getItem('clb7_review_sessions')) || []; } catch { return []; } }
function todayStr() {
  return new Date().toLocaleDateString('zh-TW', {year:'numeric',month:'2-digit',day:'2-digit'});
}
function dayStart(d = new Date()) { const t = new Date(d); t.setHours(0,0,0,0); return t.getTime(); }

function newCountToday() {
  try {
    const v = JSON.parse(localStorage.getItem('clb7_chunk_newcount'));
    return (v && v.date === todayStr()) ? v.n : 0;
  } catch { return 0; }
}
function bumpNewCount() {
  localStorage.setItem('clb7_chunk_newcount', JSON.stringify({ date: todayStr(), n: newCountToday() + 1 }));
}

function isGraduated(rec) {
  return rec && (rec.days||[]).length >= 3 && rec.iv >= 3;
}
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function dueCards() {
  const srs = getSrs(), now = dayStart();
  const list = CHUNKS.filter(c => srs[c.id] && srs[c.id].due <= now && !isGraduated(srs[c.id]));
  // 先洗牌再依到期時間排序：到期時間不同的還是嚴格照時間排（早到期優先，SRS核心原則不變），
  // 但同一個到期時間點的一批卡，每次順序都不同——否則到期卡數量超過一包時，
  // 每天永遠拿到「同一批、同樣順序」的前幾張，感覺像整包重複（Owen 07-07 回報）
  return shuffle(list).sort((a,b) => srs[a.id].due - srs[b.id].due);
}
function newCards() {
  const srs = getSrs();
  // 新卡：新課優先（13 → 1），課內照筆記順序
  return CHUNKS.filter(c => !srs[c.id]).sort((a,b) => b.lesson - a.lesson);
}
function gradCount() {
  const srs = getSrs();
  return CHUNKS.filter(c => isGraduated(srs[c.id])).length;
}

// ── 發音（TTS）──────────────────────────────────────────────
// 優先順序：Amélie/Thomas（macOS內建高品質）→ 名字含 premium/enhanced/amélior（使用者另外下載的加強版）
// → 非本機服務的雲端語音（localService===false 通常代表品質較好）→ 隨便一個 fr 語音
let frVoice = null;
function pickVoice() {
  const vs = speechSynthesis.getVoices().filter(v => v.lang.toLowerCase().startsWith('fr'));
  frVoice = vs.find(v => /am[eé]lie|thomas/i.test(v.name))
         || vs.find(v => /premium|enhanced|amélior|plus/i.test(v.name))
         || vs.find(v => v.localService === false)
         || vs.find(v => v.lang === 'fr-FR')
         || vs[0] || null;
}
if ('speechSynthesis' in window) {
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function speak(text) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  // 去掉括號注記與斜線變體，只唸主要法文
  const clean = text.replace(/\(.*?\)/g, '').split('/')[0].trim();
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = 'fr-FR'; u.rate = 0.9;
  if (frVoice) u.voice = frVoice;
  speechSynthesis.speak(u);
}

// ── 錯題本 ───────────────────────────────────────────────────
function logWrong(entry) {
  try {
    const log = JSON.parse(localStorage.getItem('clb7_wrong_log')) || [];
    const d = todayStr();
    const dup = log.find(e => e.d === d && e.src === entry.src && e.q === entry.q);
    if (dup) { dup.n = (dup.n||1) + 1; dup.t = Date.now(); }
    else log.push({ ...entry, d, t: Date.now(), n: 1 });
    localStorage.setItem('clb7_wrong_log', JSON.stringify(log.slice(-300)));
  } catch(e) {}
}

// ── Session state ────────────────────────────────────────────
let packet = [];        // [{card, isNew}]
let idx = 0;
let flipped = false;
let firstTryOk = 0, firstTryTotal = 0;
let attempted = new Set();  // 本包第一次見過的卡（判斷 first-try）

function buildPacket() {
  const due = dueCards();
  const packet_ = due.slice(0, PACKET_SIZE).map(c => ({ card: c, isNew: false }));
  if (packet_.length < PACKET_SIZE) {
    const room = Math.min(PACKET_SIZE - packet_.length, NEW_PER_DAY - newCountToday());
    if (room > 0) newCards().slice(0, room).forEach(c => packet_.push({ card: c, isNew: true }));
  }
  return packet_;
}

function renderStart() {
  const due = dueCards().length;
  const newLeft = Math.max(0, NEW_PER_DAY - newCountToday());
  document.getElementById('stDue').textContent = due;
  document.getElementById('stNew').textContent = newLeft;
  document.getElementById('stGrad').textContent = gradCount() + '/' + CHUNKS.length;
  const total = due + Math.min(newLeft, Math.max(0, PACKET_SIZE - due));
  const btn = document.getElementById('startBtn');
  if (due === 0 && (newLeft === 0 || newCards().length === 0)) {
    btn.disabled = true;
    btn.textContent = '✅ 今天的卡都做完了';
    document.getElementById('startHint').textContent = '明天會有新的到期卡。想加練可以去 Quiz 或反射衝刺。';
  } else {
    btn.disabled = false;
    btn.textContent = `▶ 做一包（${Math.min(PACKET_SIZE, due + newLeft)} 張）`;
    document.getElementById('startHint').textContent =
      due > PACKET_SIZE ? `到期 ${due} 張，建議今天多做幾包清掉` : '一包約 3–5 分鐘';
  }
}

function startPacket() {
  packet = buildPacket();
  if (!packet.length) return;
  idx = 0; firstTryOk = 0; firstTryTotal = 0;
  attempted = new Set();
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('doneScreen').classList.add('hidden');
  document.getElementById('sessionScreen').classList.remove('hidden');
  renderCard();
}

function renderCard() {
  if (idx >= packet.length) { finishPacket(); return; }
  const { card, isNew } = packet[idx];
  flipped = false;
  document.getElementById('pkProgress').textContent = `${Math.min(idx+1, packet.length)} / ${packet.length}`;
  document.getElementById('pkPhase').textContent = isNew ? '🆕 新卡' : '🔁 複習';
  document.getElementById('pkScore').textContent = `✓ ${firstTryOk}`;
  document.getElementById('fcLesson').textContent = `第 ${card.lesson} 課`;
  document.getElementById('fcZh').textContent = card.zh;
  document.getElementById('fcThink').classList.remove('hidden');
  document.getElementById('fcFr').classList.add('hidden');
  document.getElementById('fcNote').classList.add('hidden');
  document.getElementById('fcSpeak').classList.add('hidden');
  document.getElementById('flipBtn').classList.remove('hidden');
  document.getElementById('gradeRow').classList.add('hidden');
}

function flip() {
  if (flipped || idx >= packet.length) return;
  flipped = true;
  const { card } = packet[idx];
  document.getElementById('fcThink').classList.add('hidden');
  const fr = document.getElementById('fcFr');
  fr.textContent = card.fr; fr.classList.remove('hidden');
  if (card.note) {
    const n = document.getElementById('fcNote');
    n.textContent = card.note; n.classList.remove('hidden');
  }
  document.getElementById('fcSpeak').classList.remove('hidden');
  document.getElementById('flipBtn').classList.add('hidden');
  document.getElementById('gradeRow').classList.remove('hidden');
  speak(card.fr);   // 翻開自動發音 — 眼睛＋耳朵同步輸入
}

function grade(ok) {
  if (!flipped || idx >= packet.length) return;
  const { card, isNew } = packet[idx];
  const first = !attempted.has(card.id);
  if (first) {
    attempted.add(card.id);
    firstTryTotal++;
    if (ok) firstTryOk++;
  }

  const srs = getSrs();
  const today = todayStr();
  let rec = srs[card.id];
  if (!rec) {
    rec = { iv: 0, due: 0, days: [], ok: 0, no: 0 };
    if (isNew) bumpNewCount();
  }
  if (ok) {
    rec.ok++;
    if (!rec.days.includes(today)) rec.days.push(today);
    rec.days = rec.days.slice(-10);
    if (!first) { /* 包內重試成功：間隔不再前進，維持原 due（今天已排 +1）*/ }
    else rec.iv = Math.min(rec.iv + (rec.due ? 1 : 0), INTERVALS.length - 1);
    rec.due = dayStart() + INTERVALS[rec.iv] * 86400000;
  } else {
    rec.no++;
    rec.iv = 0;
    rec.due = dayStart() + 86400000;   // 明天再來
    packet.push(packet[idx]);           // 包尾重試（successive relearning：當日至少一次答對）
    logWrong({ src: 'review', q: card.zh, a: card.fr, note: card.note || '', title: `第 ${card.lesson} 課` });
  }
  rec.last = Date.now();
  srs[card.id] = rec;
  saveSrs(srs);

  idx++;
  renderCard();
}

function finishPacket() {
  document.getElementById('sessionScreen').classList.add('hidden');
  document.getElementById('doneScreen').classList.remove('hidden');
  document.getElementById('doneScore').textContent = `${firstTryOk} / ${firstTryTotal}`;

  const ses = getSessions();
  ses.push({ date: todayStr(), cards: firstTryTotal, ok: firstTryOk, ts: Date.now() });
  localStorage.setItem('clb7_review_sessions', JSON.stringify(ses.slice(-100)));
  if (window.ClbSync) ClbSync.push(); // 做完一包立刻嘗試同步，不等debounce，減少切裝置來不及的機率

  const todayPk = ses.filter(s => s.date === todayStr());
  const todayCards = todayPk.reduce((s,x) => s + x.cards, 0);
  document.getElementById('doneToday').textContent =
    `今天已做 ${todayPk.length} 包 · ${todayCards} 張卡`;
  const due = dueCards().length;
  document.getElementById('doneDue').textContent = due > 0
    ? `還有 ${due} 張到期卡 — 有空再做一包` : '今日到期卡全部清空 ✅';
  document.getElementById('againBtn').style.display =
    (due === 0 && (newCountToday() >= NEW_PER_DAY || newCards().length === 0)) ? 'none' : '';
}

// ── 事件 ─────────────────────────────────────────────────────
document.getElementById('startBtn').addEventListener('click', startPacket);
document.getElementById('againBtn').addEventListener('click', startPacket);
document.getElementById('flipBtn').addEventListener('click', flip);
document.getElementById('gradeNo').addEventListener('click', () => grade(false));
document.getElementById('gradeOk').addEventListener('click', () => grade(true));
document.getElementById('fcSpeak').addEventListener('click', () => speak(packet[idx].card.fr));
document.addEventListener('keydown', e => {
  if (document.getElementById('sessionScreen').classList.contains('hidden')) return;
  if (e.key === ' ') { e.preventDefault(); flip(); }
  if (e.key === '1') grade(false);
  if (e.key === '2') grade(true);
});

// ── 自動計時：練習時間自動記入 clb7_tracker（type: auto-review）──
(function(){
  const TYPE='review', TICK=15, IDLE_MS=60000;
  let acc=0, lastAct=Date.now();
  ['keydown','pointerdown','scroll','touchstart'].forEach(ev =>
    document.addEventListener(ev, () => lastAct=Date.now(), {passive:true}));
  setInterval(() => {
    if (document.visibilityState==='visible' && Date.now()-lastAct < IDLE_MS) acc += TICK;
  }, TICK*1000);
  function flushTime(){
    if (window.ClbSession && window.ClbSession.isActive()) { acc = 0; return; } // session 進行中由 session_timer 統一計時，避免雙重計入
    if (acc < 30) return;
    try {
      const d = new Date();
      const data = JSON.parse(localStorage.getItem('clb7_tracker')) || [];
      data.push({ ts: Date.now(),
        date: `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`,
        type: 'auto-'+TYPE, sec: acc });
      localStorage.setItem('clb7_tracker', JSON.stringify(data));
      acc = 0;
    } catch(e) {}
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState==='hidden') flushTime(); });
  window.addEventListener('pagehide', flushTime);
})();

// ── 初始化 ────────────────────────────────────────────────────
renderStart();
if (new URLSearchParams(location.search).get('guided') === '1') startPacket();
</script>

<!-- 懸浮回饋（review.html 原本沒有，補上；卡片旁的「🤔語意不清」會自動標記當前卡） -->
<style>
#qnoteBtn{position:fixed;bottom:20px;right:20px;width:44px;height:44px;border-radius:50%;background:#1a2438;border:1px solid #2a3858;color:#f0c060;font-size:1.2rem;cursor:pointer;z-index:999;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px rgba(0,0,0,0.5);transition:transform 0.15s;}
#qnoteBtn:hover{transform:scale(1.1);}
#qnotePanel{position:fixed;bottom:72px;right:20px;width:280px;background:#0d1020;border:1px solid #2a3858;border-radius:12px;padding:14px;z-index:998;display:none;box-shadow:0 4px 20px rgba(0,0,0,0.6);}
#qnotePanel.open{display:block;}
#qnoteTitle{font-size:0.7rem;color:#445060;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
#qnoteTag{font-size:0.7rem;color:#f0c060;margin-bottom:6px;display:none;}
#qnoteTxt{width:100%;background:#141928;border:1px solid #1a2438;border-radius:8px;color:#ddd8cc;font-size:0.85rem;padding:8px;resize:none;height:80px;font-family:inherit;}
#qnoteTxt:focus{outline:none;border-color:#f0c060;}
#qnoteSave{margin-top:8px;width:100%;padding:8px;background:#1d5035;color:#60d090;border:none;border-radius:8px;font-size:0.82rem;cursor:pointer;font-family:inherit;}
#qnoteCount{font-size:0.68rem;color:#334050;margin-top:6px;text-align:right;}
</style>
<button id="qnoteBtn" title="快速筆記">📝</button>
<div id="qnotePanel">
  <div id="qnoteTitle">快速筆記（存給 Claude 看）</div>
  <div id="qnoteTag"></div>
  <textarea id="qnoteTxt" placeholder="記下問題、想法、bug…"></textarea>
  <button id="qnoteSave">儲存筆記</button>
  <div id="qnoteCount"></div>
  <button id="qnoteCopy" style="margin-top:6px;width:100%;padding:7px;background:#1a2438;color:#60a0d0;border:none;border-radius:8px;font-size:0.78rem;cursor:pointer;font-family:inherit;">📋 複製全部給 Claude</button>
</div>
<script>
(function(){
  const KEY='clb7_quick_notes';
  const page='review.html';
  let noteTag = null; // 「🤔這張卡語意不清」點擊時會記錄目前卡片內容
  function loadNotes(){try{return JSON.parse(localStorage.getItem(KEY))||[];}catch{return[];}}
  function saveNotes(d){localStorage.setItem(KEY,JSON.stringify(d));}
  function updateCount(){const n=loadNotes();document.getElementById('qnoteCount').textContent=n.length?`共 ${n.length} 則筆記`:'還沒有筆記';}
  function openPanel(tag){
    noteTag = tag || null;
    const tagEl = document.getElementById('qnoteTag');
    if (noteTag) { tagEl.textContent = '📍 ' + noteTag; tagEl.style.display = 'block'; }
    else { tagEl.style.display = 'none'; }
    document.getElementById('qnotePanel').classList.add('open');
    updateCount();
    document.getElementById('qnoteTxt').focus();
  }
  document.getElementById('qnoteBtn').addEventListener('click', () => {
    document.getElementById('qnotePanel').classList.toggle('open');
    updateCount();
  });
  document.getElementById('fcConfusedBtn').addEventListener('click', () => {
    // 抓目前這張卡的中文提示/法文答案/課次，方便之後批次修 chunks.js
    let tag = '';
    try {
      const { card } = packet[idx];
      tag = `[第${card.lesson}課] ${card.zh} → ${card.fr}`;
    } catch(e) {}
    openPanel(tag || '這張卡');
  });
  document.getElementById('qnoteSave').addEventListener('click', () => {
    const txt = document.getElementById('qnoteTxt').value.trim();
    if (!txt) return;
    const notes = loadNotes();
    const d = new Date();
    const prefix = noteTag ? `${noteTag}｜` : '';
    notes.push({
      date: `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`,
      time: `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`,
      page, note: prefix + txt
    });
    saveNotes(notes);
    document.getElementById('qnoteTxt').value = '';
    noteTag = null;
    document.getElementById('qnoteTag').style.display = 'none';
    updateCount();
  });
  document.getElementById('qnoteCopy').addEventListener('click', () => {
    const notes = loadNotes();
    if (!notes.length) { alert('還沒有筆記'); return; }
    const text = '【CLB7 快速筆記】\n' + notes.map(n => `[${n.date} ${n.time} @ ${n.page}] ${n.note}`).join('\n');
    navigator.clipboard.writeText(text).then(() => {
      document.getElementById('qnoteCopy').textContent = '✓ 已複製！';
      setTimeout(() => document.getElementById('qnoteCopy').textContent = '📋 複製全部給 Claude', 2000);
    });
  });
})();
</script>
<script src="session_timer.js"></script>
<script src="sync_supabase.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>今日地城 · CLB7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
<!--
  quest.html — 今日地城（2026-09-12）
  ════════════════════════════════════════════════════════════════
  ⚠️ 第一版被 Owen 打回：「太陽春了 畫面很不到位 好像還是在選東西填表單的感覺
     我希望是真的有 RPG 的感覺」。
  ⭐ 所以第二版換的不是皮，是**戰鬥結構**：
     ① 像素場景（牆＋地板圖塊）＋ 敵人立繪 ＋ 英雄站位 —— 有「場」才有 RPG
     ② **指令選單**（攻擊／法術／藥水／逃跑）：先選指令再出招，
        ⛔ 不是一進去就丟四個選項給你填 —— 那就是他說的「填表單」
     ③ 回合制：你出招 → 敵人反擊 → 打字機對白敘述戰況
     ④ 資源有限：藥水有數量、法術要花金幣 → 選擇才有後果
     ⑤ 等級與經驗值：打完會變強（跨日保留），⛔ 不是每天回到原點
  素材：Kenney「Tiny Dungeon」＋「Interface Sounds」，皆 CC0（公共領域，無須署名）
       字體 Cinzel／Cormorant Garamond，SIL OFL
  ⛔ 零懲罰不變：倒下＝撤退，戰利品、等級、圖鑑全留（CLAUDE.md 練習頁鐵律）
  ════════════════════════════════════════════════════════════════
-->
<style>
:root{
  --bg:#090b10; --panel:#11151f; --panel2:#171d2b; --line:#252c3d; --line2:#3a465f;
  --ink:#e9ecf3; --dim:#8592ab; --faint:#59melon; --faint:#5a6580;
  --gold:#d9b45e; --gold2:#f3dc9a; --ember:#e0763c;
  --red:#d8574f; --green:#5cc48b; --blue:#63a9e8; --purple:#9d7ede;
  --shadow:0 12px 34px rgba(0,0,0,.6);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; background:var(--bg)}
body{
  color:var(--ink); padding:0 0 34px; overscroll-behavior:none;
  font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;
  background:radial-gradient(950px 480px at 50% -10%,#1a2132 0%,rgba(26,33,50,0) 60%),var(--bg);
  background-attachment:fixed;
}
img{image-rendering:pixelated; image-rendering:crisp-edges}
.wrap{max-width:600px; margin:0 auto; padding:0 14px}

/* ── HUD ───────────────────────────────────────────────── */
.hud{position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:11px;
     padding:10px 15px; backdrop-filter:blur(10px);
     background:linear-gradient(180deg,rgba(9,11,16,.97) 62%,rgba(9,11,16,0));
     border-bottom:1px solid rgba(217,180,94,.10)}
.hud .lv{font-family:'Cinzel',serif; font-size:.74rem; color:var(--gold); letter-spacing:.1em}
.hearts{display:flex; gap:3px}
.hearts svg{width:16px; height:16px; display:block; filter:drop-shadow(0 0 5px rgba(216,87,79,.45))}
.hearts .dead{opacity:.16; filter:none}
.stat{display:flex; align-items:center; gap:4px; font-size:.8rem; font-weight:700}
.stat svg{width:15px; height:15px; display:block}
.coin{color:var(--gold)} .lootn{color:var(--purple)}
.hud .sp{flex:1}
.hud a{color:var(--dim); font-size:.7rem; text-decoration:none; border:1px solid var(--line);
       padding:5px 10px; border-radius:9px}
.xpwrap{height:3px; background:#0a0d14; position:sticky; top:41px; z-index:29}
.xpwrap i{display:block; height:100%; background:linear-gradient(90deg,#4a7fc0,var(--blue));
          box-shadow:0 0 9px rgba(99,169,232,.5); transition:width .5s}

/* ── 標題 ───────────────────────────────────────────────── */
.title{margin:20px 0 2px; text-align:center}
.title .en{font-family:'Cinzel',serif; font-size:.68rem; letter-spacing:.42em; color:var(--gold); opacity:.8}
.title h1{font-size:1.5rem; margin:5px 0 0; letter-spacing:.16em; font-weight:600;
  background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,#9d7f3c);
  -webkit-background-clip:text; background-clip:text; color:transparent}
.rule{height:1px; margin:12px auto 0; max-width:220px; position:relative;
      background:linear-gradient(90deg,transparent,rgba(217,180,94,.5),transparent)}
.rule:after{content:'◆'; position:absolute; left:50%; top:-8px; transform:translateX(-50%);
            color:var(--gold); font-size:.58rem; background:var(--bg); padding:0 6px}
.sub{color:var(--dim); font-size:.78rem; margin:13px 0 18px; line-height:1.85; text-align:center}
.sub b{color:var(--gold2)}

/* ── 地圖 ───────────────────────────────────────────────── */
.floor{display:flex; align-items:center; gap:9px; margin:0 0 8px; color:var(--faint);
       font-size:.64rem; letter-spacing:.3em; font-family:'Cinzel',serif}
.floor:after{content:''; flex:1; height:1px; background:linear-gradient(90deg,rgba(58,70,95,.55),transparent)}
.row{display:flex; gap:10px; margin-bottom:18px}
.node{flex:1; position:relative; cursor:pointer; border-radius:14px; padding:13px 6px 11px;
      text-align:center; transition:transform .16s,border-color .25s,box-shadow .25s;
      background:linear-gradient(180deg,var(--panel2),var(--panel)); border:1px solid var(--line);
      box-shadow:var(--shadow)}
.node img{width:38px; height:38px; display:block; margin:0 auto 6px}
.node .nm{font-size:.71rem; color:var(--faint); letter-spacing:.08em}
.node.can{border-color:rgba(217,180,94,.55); animation:breathe 2.6s ease-in-out infinite}
.node.can .nm{color:var(--gold2)}
@keyframes breathe{0%,100%{box-shadow:var(--shadow)}50%{box-shadow:var(--shadow),0 0 26px rgba(217,180,94,.2)}}
.node.can:active{transform:scale(.965)}
.node.done{opacity:.3} .node.locked{opacity:.24; cursor:default}
.node.done:after{content:'✓'; position:absolute; top:7px; right:9px; color:var(--green); font-size:.75rem}

/* ── 戰鬥場景 ───────────────────────────────────────────── */
.scene{
  position:relative; border-radius:16px 16px 0 0; overflow:hidden; height:250px;
  border:1px solid var(--line); border-bottom:none;
  background-color:#1b1410;
  background-image:
    linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 32%,rgba(0,0,0,.45) 100%),
    var(--wall), var(--floor);
  background-repeat:repeat-x, repeat-x, repeat;
  background-position:center top, center top, center bottom;
  background-size:auto, 48px 48px, 48px 48px;
}
.scene:after{content:''; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(circle at 50% 42%,rgba(255,214,150,.10),transparent 58%)}
.foe{position:absolute; left:50%; top:42%; transform:translate(-50%,-50%); text-align:center}
.foe img{width:104px; height:104px; animation:idle 2.4s ease-in-out infinite;
         filter:drop-shadow(0 10px 14px rgba(0,0,0,.75))}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.foe.hit img{animation:hurt .34s}
@keyframes hurt{0%,100%{transform:translateX(0); filter:none}
  15%{transform:translateX(-11px); filter:brightness(3) saturate(0)}
  55%{transform:translateX(9px); filter:brightness(3) saturate(0)}}
.foe.die img{animation:die .6s forwards}
@keyframes die{to{transform:translateY(16px) scale(.7); opacity:0; filter:brightness(2)}}
.foename{position:absolute; top:10px; left:50%; transform:translateX(-50%); text-align:center;
  background:linear-gradient(180deg,rgba(8,10,15,.92),rgba(8,10,15,.72)); padding:7px 18px 9px;
  border-radius:12px; border:1px solid rgba(217,180,94,.28); backdrop-filter:blur(3px)}
.foename .n{font-size:.88rem; font-weight:700; letter-spacing:.04em}
.foename .t{font-family:'Cinzel',serif; font-size:.58rem; color:var(--gold); letter-spacing:.18em; margin-top:2px}
.fbar{width:150px; height:7px; margin:6px auto 0; background:rgba(0,0,0,.65);
      border:1px solid rgba(255,255,255,.18); border-radius:4px; overflow:hidden}
.fbar i{display:block; height:100%; background:linear-gradient(90deg,#8f2f2a,var(--red),var(--ember));
        transition:width .45s cubic-bezier(.3,1,.4,1)}
.hero{position:absolute; left:16px; bottom:12px}
.hero img{width:76px; height:76px; filter:drop-shadow(0 8px 10px rgba(0,0,0,.7));
          animation:idle 3.1s ease-in-out infinite}
.hero.act img{animation:lunge .4s}
@keyframes lunge{0%,100%{transform:translateX(0)}45%{transform:translateX(46px) scale(1.06)}}
.hero.ouch img{animation:ouch .35s}
@keyframes ouch{0%,100%{transform:translateX(0)}30%{transform:translateX(-10px); filter:brightness(2.4) saturate(.2)}}
.dmg{position:absolute; left:50%; top:14%; transform:translateX(-50%); pointer-events:none;
     font-family:'Cinzel',serif; font-weight:700; font-size:1.8rem; color:var(--gold2);
     text-shadow:0 3px 10px #000,0 0 18px rgba(217,180,94,.7); animation:fly .95s ease-out forwards}
.dmg.you{left:20%; color:#ff8a80}
@keyframes fly{0%{opacity:0; transform:translate(-50%,10px) scale(.6)}
  22%{opacity:1; transform:translate(-50%,-12px) scale(1.3)}
  100%{opacity:0; transform:translate(-50%,-62px) scale(1)}}
.flash{position:fixed; inset:0; pointer-events:none; z-index:40; background:rgba(255,240,200,.16); animation:fade .3s forwards}
@keyframes fade{to{opacity:0}}

/* ── 對白框與指令 ───────────────────────────────────────── */
.box{border:1px solid var(--line); border-top:1px solid rgba(217,180,94,.3); border-radius:0 0 16px 16px;
     background:linear-gradient(180deg,#141926,#0f131d); padding:15px 16px 16px; box-shadow:var(--shadow)}
.talk{min-height:52px; font-size:.92rem; line-height:1.75}
.talk .cursor{color:var(--gold); animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.talk .fr{font-family:'Cormorant Garamond',Georgia,serif; font-style:italic; font-size:1.16rem; color:var(--gold2)}
.talk .zh{color:var(--dim); font-size:.78rem; margin-top:4px}
.talk button{background:none; border:1px solid rgba(217,180,94,.3); color:var(--gold);
             border-radius:7px; cursor:pointer; font-size:.7rem; padding:1px 7px; margin-left:6px}
.cmds{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:14px}
.cmd{display:flex; align-items:center; gap:9px; padding:12px 13px; border-radius:12px; cursor:pointer;
     background:linear-gradient(180deg,#1a2130,#131824); border:1px solid var(--line2);
     color:var(--ink); font-family:inherit; font-size:.88rem; font-weight:600; transition:.15s; text-align:left}
.cmd img{width:22px; height:22px}
.cmd:hover:not(:disabled){border-color:var(--gold); transform:translateY(-1px)}
.cmd:active:not(:disabled){transform:scale(.98)}
.cmd:disabled{opacity:.35; cursor:default}
.cmd small{display:block; font-weight:400; font-size:.68rem; color:var(--faint)}
.q{margin:4px 0 12px; font-size:.95rem; line-height:1.7}
.q .hint{display:block; color:var(--faint); font-size:.74rem; margin-top:6px}
.opts{display:grid; gap:9px}
.opt{text-align:left; padding:12px 14px; border-radius:12px; cursor:pointer; font-family:inherit;
     font-size:.88rem; line-height:1.5; color:var(--ink); transition:.14s;
     background:linear-gradient(180deg,#141926,#10141e); border:1px solid var(--line)}
.opt:hover:not(:disabled){border-color:var(--line2); transform:translateX(2px)}
.opt.ok{border-color:var(--green); background:linear-gradient(180deg,#12291d,#0e2018)}
.opt.no{border-color:var(--red); background:linear-gradient(180deg,#2a1414,#1e0f0f)}
.opt:disabled{cursor:default}
.next{width:100%; margin-top:13px; padding:13px; border-radius:12px; cursor:pointer;
      font-family:'Cinzel',-apple-system,serif; font-size:.88rem; font-weight:700; letter-spacing:.12em;
      color:#1a1406; background:linear-gradient(180deg,var(--gold2),var(--gold) 60%,#b3913f);
      border:1px solid rgba(243,220,154,.5); box-shadow:0 6px 16px rgba(217,180,94,.2)}
.next:active{transform:translateY(1px)}
.fb{margin-top:12px; font-size:.82rem; line-height:1.8; color:var(--dim)}
.fb b{color:var(--ink)}

/* ── 戰利品／圖鑑 ───────────────────────────────────────── */
.loot{border-radius:17px; padding:19px 17px; margin-top:12px;
      background:linear-gradient(180deg,#1c2130,#12161f); border:1px solid rgba(217,180,94,.42);
      box-shadow:0 0 40px rgba(217,180,94,.1),var(--shadow); animation:pop .38s cubic-bezier(.2,.9,.3,1.25)}
@keyframes pop{0%{transform:scale(.93) translateY(8px); opacity:0}100%{transform:none; opacity:1}}
.loot h3{margin:0 0 12px; font-family:'Cinzel',serif; font-size:.8rem; color:var(--gold);
         letter-spacing:.24em; text-align:center}
.card{background:linear-gradient(180deg,#141926,#0f131c); border:1px solid var(--line);
      border-left:2px solid rgba(217,180,94,.5); border-radius:11px; padding:11px 13px; margin-bottom:8px;
      animation:deal .45s cubic-bezier(.2,.9,.3,1.2) backwards}
@keyframes deal{0%{transform:translateY(12px) rotate(-1.5deg); opacity:0}100%{transform:none; opacity:1}}
.card .fr{font-family:'Cormorant Garamond',Georgia,serif; font-size:1.05rem; line-height:1.5; color:var(--gold2)}
.card .zh{color:var(--dim); font-size:.77rem; margin-top:3px}
.card button{background:none; border:1px solid rgba(217,180,94,.3); color:var(--gold);
             border-radius:7px; cursor:pointer; font-size:.68rem; padding:1px 7px; margin-left:6px}
.sec{margin-top:28px}
.sec h2{font-family:'Cinzel',serif; font-size:.68rem; color:var(--faint); letter-spacing:.3em;
        margin:0 0 11px; font-weight:500; display:flex; align-items:center; gap:9px}
.sec h2:after{content:''; flex:1; height:1px; background:linear-gradient(90deg,rgba(58,70,95,.5),transparent)}
.dex{display:grid; grid-template-columns:repeat(auto-fill,minmax(62px,1fr)); gap:8px}
.cell{aspect-ratio:1; border-radius:12px; display:flex; flex-direction:column; align-items:center;
      justify-content:center; padding:4px; background:linear-gradient(180deg,var(--panel2),var(--panel));
      border:1px solid rgba(217,180,94,.3)}
.cell img{width:30px; height:30px}
.cell small{font-size:.5rem; color:var(--dim); margin-top:2px; text-align:center; line-height:1.1}
.cell.empty{background:repeating-linear-gradient(45deg,#0d1016,#0d1016 5px,#0f1219 5px,#0f1219 10px);
            border:1px dashed var(--line); color:var(--faint); font-size:.8rem}
.tabs{display:flex; gap:6px; margin:14px 0 4px}
.tcard{display:flex; align-items:center; gap:13px; padding:15px 14px; margin-bottom:11px; border-radius:15px;
  background:linear-gradient(180deg,var(--panel2),var(--panel)); border:1px solid var(--line); box-shadow:var(--shadow)}
.tcard.did{border-color:rgba(92,196,139,.45)}
.tleft img{width:40px; height:40px}
.tmid{flex:1; min-width:0}
.ten{font-family:'Cinzel',serif; font-size:.6rem; color:var(--gold); letter-spacing:.24em}
.tname{font-size:1rem; font-weight:700; margin-top:2px}
.tval{font-family:'Cinzel',serif; color:var(--gold2); font-size:1.15rem}
.twhat{font-size:.76rem; color:var(--dim); margin-top:3px}
.teff{font-size:.74rem; color:var(--green); margin-top:4px}
.tgo{flex:none; padding:10px 14px; border-radius:11px; text-decoration:none; font-size:.8rem; font-weight:700;
  color:#1a1406; background:linear-gradient(180deg,var(--gold2),var(--gold) 60%,#b3913f); border:1px solid rgba(243,220,154,.5)}
.tcard.did .tgo{color:var(--gold2); background:none; border-color:rgba(217,180,94,.4)}
.tab{flex:1; padding:10px 4px; border-radius:11px; cursor:pointer; font-family:inherit; font-size:.84rem;
  font-weight:600; color:var(--dim); background:linear-gradient(180deg,#141926,#10141e); border:1px solid var(--line)}
.tab.on{color:var(--gold2); border-color:rgba(217,180,94,.5); box-shadow:0 0 18px rgba(217,180,94,.1)}
.conflict{color:var(--dim); font-size:.82rem; line-height:1.95; padding:13px 15px; margin-bottom:18px;
  border-left:2px solid rgba(217,180,94,.4); background:linear-gradient(90deg,rgba(217,180,94,.05),transparent)}
.conflict b{color:var(--gold2)}
.snode{display:flex; gap:12px; align-items:flex-start; padding:13px 14px; margin-bottom:10px; border-radius:13px;
  background:linear-gradient(180deg,var(--panel2),var(--panel)); border:1px solid var(--line); transition:.18s}
.snode.can{border-color:rgba(217,180,94,.55); cursor:pointer; animation:breathe 2.6s ease-in-out infinite}
.snode.can:active{transform:scale(.985)}
.snode.done{opacity:.4}
.snode .sicon img{width:30px; height:30px}
.stype{font-family:'Cinzel',serif; font-size:.62rem; color:var(--gold); letter-spacing:.2em; margin-bottom:5px}
.stext{font-size:.85rem; line-height:1.85; color:var(--ink)}
.snode.done .stext{color:var(--faint)}
.clearbox{margin-top:20px; padding:15px 16px; border-radius:14px; border:1px solid rgba(217,180,94,.28);
  background:linear-gradient(180deg,rgba(217,180,94,.06),transparent)}
.cl-h{font-family:'Cinzel',serif; font-size:.64rem; color:var(--gold); letter-spacing:.22em; margin-bottom:7px}
.cl-t{font-size:.86rem; line-height:1.9}
.cl-x{margin-top:9px; font-size:.73rem; color:var(--faint); line-height:1.7}
.ans{width:100%; padding:13px 15px; border-radius:12px; font-family:'Cormorant Garamond',Georgia,serif;
  font-size:1.18rem; color:var(--gold2); background:rgba(0,0,0,.3); border:1px solid var(--line2); outline:none}
.ans:focus{border-color:var(--gold); box-shadow:0 0 18px rgba(217,180,94,.12)}
.accbar{margin-top:9px; display:flex; flex-wrap:wrap; gap:6px}
.accbar button{padding:6px 11px; border-radius:9px; cursor:pointer; font-size:1rem;
  background:linear-gradient(180deg,#1a2130,#131824); border:1px solid var(--line); color:var(--gold2)}
.accbar button:active{transform:scale(.94)}
.built{min-height:52px; padding:11px 12px; border-radius:12px; border:1px dashed var(--line2);
  background:rgba(0,0,0,.25); margin-bottom:11px; line-height:2.3}
.built .ph{color:var(--faint); font-size:.8rem}
.bank{line-height:2.4}
.tok{display:inline-block; margin:0 6px 7px 0; padding:7px 13px; border-radius:10px; cursor:pointer;
  font-family:'Cormorant Garamond',Georgia,serif; font-size:1.06rem; color:var(--ink);
  background:linear-gradient(180deg,#1a2130,#131824); border:1px solid var(--line2); transition:.13s}
.tok:hover{border-color:var(--gold); transform:translateY(-1px)}
.tok:active{transform:scale(.95)}
.tok.on{border-color:rgba(217,180,94,.6); color:var(--gold2)}
.tok.spent{opacity:.22; pointer-events:none}
.aff{margin-top:5px; font-size:.6rem; letter-spacing:.12em}
.aff .pip{color:#3f4659; margin-right:1px}
.aff .pip.on{color:var(--red); text-shadow:0 0 7px rgba(216,87,79,.6)}
.aff .afftxt{color:var(--gold); margin-left:6px; font-size:.58rem; letter-spacing:.1em}
.npcrow{display:flex; align-items:center; gap:11px; padding:10px 12px; margin-bottom:8px;
  border-radius:12px; background:linear-gradient(180deg,var(--panel2),var(--panel)); border:1px solid var(--line)}
.npcrow img{width:32px; height:32px}
.npcname{flex:1; font-size:.84rem; font-weight:600}
.npcname small{display:block; font-family:'Cormorant Garamond',Georgia,serif; font-style:italic;
  font-size:.8rem; color:var(--faint); font-weight:400}
.toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(18px); opacity:0;
       background:linear-gradient(180deg,#1d2434,#151a26); border:1px solid var(--line2);
       padding:10px 18px; border-radius:11px; font-size:.8rem; transition:.28s; pointer-events:none; z-index:50}
.toast.on{opacity:1; transform:translateX(-50%) translateY(0)}
.credit{margin-top:30px; text-align:center; color:#39425a; font-size:.62rem; letter-spacing:.06em; line-height:1.8}
.eximg{margin:2px 0 12px; border-radius:11px; overflow:hidden; background:#f4f1ea; min-height:90px;
  display:flex; flex-direction:column; align-items:center; justify-content:center}
.eximg img{width:100%; display:block; cursor:zoom-in}
.eximg .fb{color:#6b6457; padding:0 12px}
.exhint{font-size:.62rem; color:#6b6457; padding:3px 0 5px}
.exzoom{position:fixed; inset:0; z-index:70; background:rgba(5,7,12,.94); overflow:auto; -webkit-overflow-scrolling:touch; cursor:zoom-out}
.exzoom img{display:block; width:max(100vw,820px); max-width:none}
.exin{margin-top:9px; font-family:inherit; font-size:1rem}
.consigne{display:block; font-family:'Cormorant Garamond',Georgia,serif; font-style:italic; font-size:1.02rem; color:var(--gold); margin-bottom:3px}
.hintd{margin-top:7px; font-size:.74rem; color:var(--faint)}

/* ── 狀態 ───────────────────────────────────────────────── */
var LS='clb7_quest';

                   clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('on');},1800); }
function seedOf(){ var d=new Date(); return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate(); }
var _r=seedOf();
function rnd(){ _r=(_r*1103515245+12345)&0x7fffffff; return _r/0x7fffffff; }
function pick(a){ return a[Math.floor(rnd()*a.length)]; }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(rnd()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }

/* 等級：經驗值跨日累積 —— ⭐ 打完會變強，⛔ 不是每天回到原點 */
function lvOf(xp){ return Math.floor(Math.sqrt((xp||0)/45)) + 1; }
function xpInLv(xp){ var lv=lvOf(xp), base=(lv-1)*(lv-1)*45, next=lv*lv*45; return {cur:(xp||0)-base, need:next-base}; }
function maxHpOf(lv){ return 3 + Math.floor((lv-1)/2) + (typeof trainBonus==='function' ? trainBonus().hp : 0); }   /* 智力加體力上限 */

/* ── 敵人與關主 ─────────────────────────────────────────── */
function recentLessons(n){
  var ls={}; BANK.forEach(function(q){ if(q.lesson) ls[q.lesson]=1; });
  return Object.keys(ls).map(Number).sort(function(a,b){return b-a;}).slice(0,n);
}
function questionsFor(ls){
  return BANK.filter(function(q){ return q.type==='choose' && q.opts && q.opts.length>=3 && ls.indexOf(q.lesson)>=0; });
}
/* ════════════════════════════════════════════════════════════════
   招式（2026-09-12）
   ⚠️ Owen：「沒有人會擔心好玩的遊戲沒人玩，主要是不好玩，或玩起來很挫折壓力很大」
   ⭐ 所以招式的設計重點不是「更難」，是**難得有選擇、卡住有出口**：
     · 傷害高的招式＝產出型題目（填空、中翻法）——考試分數就在那裡
     · 大招／詠唱要自己打字（09-12 Owen：「不用像 duolinguo 那樣選字，不夠扎實」），附重音符號列
     · 重音不計較（少 é 算對，只提醒）
     · 隨時可以「改用普通攻擊」降級，⛔ 不扣血不羞辱
   題庫現況：choose 549／fill 413／trans 185／gender 51 —— 原本只用了 choose。
   ════════════════════════════════════════════════════════════════ */
var MOVES={
  hit:  {id:'hit',  name:'普通攻擊', dmg:1,   type:'choose', sec:'12 秒', why:'選項裡挑一個'},
  heavy:{id:'heavy',name:'重擊',    dmg:1.5, type:'gender', sec:'20 秒', why:'陰陽性，錯一個字母就不算'},
  blast:{id:'blast',name:'大招',    dmg:2,   type:'fill',   sec:'30 秒', why:'把空格打出來'},
  chant:{id:'chant',name:'詠唱',    dmg:3,   type:'trans',  sec:'60 秒', why:'中翻法，整句自己打'},
  ear:  {id:'ear',  name:'看破',    dmg:1.5, type:'listen', sec:'20 秒', why:'只聽，不看字'},
  read: {id:'read', name:'解讀',    dmg:1,   type:'exam',   sec:'不限時', why:'讀懂文件，選出答案'},   /* 只在考試之塔 */
};
/* ⭐ 聽辨題是**現場合成**的：從 sentences.js 抽一句唸出來，選項是別句的中文。
   → 句庫增加，聽辨題自動增加（⛔ 不需要另建題庫）。
   ⚠️ Owen 的聽力是全系統最弱的一塊（日誌 57 天沒紀錄、研究也指出 TTS 永遠 0.78×
      等於沒練真實語速）——這裡至少讓「聽」進入每天的迴圈。 */
function listenQuestion(lessons){
  var pool=(typeof SENTENCES!=='undefined'?SENTENCES:[]).filter(function(x){
    return (!lessons||!lessons.length||lessons.indexOf(x.lesson)>=0) && x.fr && x.zh && x.fr.length>10; });
  if(pool.length<4) pool=(typeof SENTENCES!=='undefined'?SENTENCES:[]).filter(function(x){ return x.fr&&x.zh&&x.fr.length>10; });
  if(pool.length<4) return null;
  var right=pool[Math.floor(Math.random()*pool.length)];
  var others=pool.filter(function(x){ return x.id!==right.id; });
  var opts=[right.zh];
  while(opts.length<4 && others.length){
    var o=others.splice(Math.floor(Math.random()*others.length),1)[0];
    if(opts.indexOf(o.zh)<0) opts.push(o.zh);
  }
  return { type:'listen', q:'（只有聲音）聽牠說了什麼？', a:right.zh, opts:opts,
           fr:right.fr, aNote:'原句：<b>'+right.fr+'</b>', lesson:right.lesson };
}
function movePool(ls, t){
  return BANK.filter(function(q){
    if(q.type!==t || ls.indexOf(q.lesson)<0) return false;
    if(t==='choose') return q.opts && q.opts.length>=2;
    if(t==='gender' && q.opts && q.opts.length>=2) return true;   /* ⚠️ 09-14 修：陰陽性 51 題全是打字題（沒有 opts），原本這裡要 opts → 重擊在整個遊戲裡從沒出現過 */
    return typeof q.a==='string' && q.a.length>1;   /* 多解答的先不用 */
  });
}
/* 拆詞塊：答案照空白切，再混進同一課別句的干擾詞 */
function tokensFor(ans, ls){
  var real=ans.replace(/\s+/g,' ').trim().split(' ');
  var bag=[];
  BANK.forEach(function(q){
    if(ls.indexOf(q.lesson)<0 || typeof q.a!=='string') return;
    q.a.split(/\s+/).forEach(function(w){ if(w.length>1 && real.indexOf(w)<0) bag.push(w); });
  });
  var extra=[]; var want=Math.min(4, Math.max(2, Math.round(real.length*0.5)));
  for(var i=0;i<want && bag.length;i++){
    var j=Math.floor(Math.random()*bag.length);
    if(extra.indexOf(bag[j])<0) extra.push(bag[j]);
  }
  return { real:real, all:shuffle(real.concat(extra)) };
}
/* ⚠️ 09-14 修：題庫有 14 題選擇題的正解是「A|B」多解（如 le premier|premier），
   原本拿整串跟選項比 → 這 14 題在地城、副本、街坊、塔裡**永遠判錯**。 */
function isAns(q,o){ return String(q.a).split('|').indexOf(o)>=0; }
function shownAns(q){ var alts=String(q.a).split('|'), hit=(q.opts||[]).filter(function(o){ return alts.indexOf(o)>=0; });
  return hit.length ? hit.join(' / ') : alts[0]; }
function deacc(x){ return String(x).normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function normAns(x){ return deacc(String(x)).toLowerCase().replace(/[.,!?;:«»"']/g,'').replace(/\s+/g,' ').trim(); }
function identityOf(topic, lesson){
  var sit = (typeof SITUATIONS!=='undefined') ? SITUATIONS.filter(function(x){ return (x.topics||[]).indexOf(topic)>=0; })[0] : null;
  if (sit) return { name:sit.zh, fr:sit.fr };
  var g = (typeof GRAM_POINTS!=='undefined') ? GRAM_POINTS.filter(function(p){ return (p.topics||[]).indexOf(topic)>=0; })[0] : null;
  if (g) return { name:g.name, fr:(g.rule&&g.rule.title)||'' };
  return { name:'第 '+lesson+' 課的守衛', fr:'' };
}
function bossOfToday(){
  var newest=recentLessons(1)[0], qs=questionsFor([newest]), topics={};
  qs.forEach(function(q){ topics[q.topic]=(topics[q.topic]||0)+1; });
  var best=Object.keys(topics).sort(function(a,b){return topics[b]-topics[a];})[0];
  var idt=identityOf(best,newest);
  return { id:'boss_'+best, sprite:pick(BOSSES), name:idt.name, fr:idt.fr,
           title:'第 '+newest+' 課 · 守護者', topic:best, lesson:newest,
           qs:shuffle(qs.filter(function(q){return q.topic===best;})).slice(0,4) };
}
function bossLine(lesson){
  var pool=(typeof SENTENCES!=='undefined'?SENTENCES:[]).filter(function(s){return s.lesson===lesson;});
  return pool.length ? pool[Math.floor(rnd()*pool.length)] : null;
}
var FOE_NAMES=['迷路的小妖','走廊的看守','石縫裡的東西','發抖的小鬼','舊書堆的守衛'];

/* ════════════════════════════════════════════════════════════════
   街坊（關係養成，2026-09-12）
   ⚠️ Owen：「至少我想養一隻很厲害的東東，或是養成某段關係」
   ⭐ NPC 直接用 situations.js 的生活情境當身分（藥師、店員、房東…），
     他們講的法文一律取自 sentences.js 的該課句子 —— ⛔ Claude 不自創法文（教材鐵律）。
   ⭐ 熟悉度會改變稱呼：陌生用 vous，熟了改用 tu —— 那是真實的法文文化差異。
   ⛔ 久沒見不懲罰他本人，只是 NPC 會說「好久不見」
     （見 memory feedback_stakes_on_character_not_person）。
   ════════════════════════════════════════════════════════════════ */
var NPC_SPRITES=['0085','0086','0087','0099','0100','0084'].map(function(n){return T+n+'.png';});
/* ⚠️ 這裡只是角色的名字與身分（遊戲用），⛔ 不是教材——他們講的法文一律取自 sentences.js。
   ⭐ Baptiste 沿用第 32 課漫畫〈L'effet placebo du soignant〉裡那位急診實習醫生。 */
var NPC_WHO={
  'se-presenter':{n:'Camille',  r:'剛搬來的鄰居', s:0},
  'famille':     {n:'Mme Bonnet',r:'樓下的太太',  s:3},
  'decrire-qqn': {n:'Lucas',    r:'咖啡館的常客', s:2},
  'logement':    {n:'M. Rivet', r:'房東',        s:5},
  'courses':     {n:'Sophie',   r:'市場的攤販',   s:3},
  'restaurant':  {n:'Étienne',  r:'餐廳老闆',     s:4},
  'se-deplacer': {n:'Karim',    r:'公車司機',     s:2},
  'sante':       {n:'Baptiste', r:'急診實習醫生', s:5},
  'rendez-vous': {n:'Léa',      r:'語言交換夥伴', s:3},
  'travail':     {n:'Mme Fabre',r:'面試官',       s:1},
  'etudes':      {n:'Hugo',     r:'大學同學',     s:2},
  'meteo':       {n:'Papy Jean',r:'公園裡的老先生',s:5},
  'vacances':    {n:'Chloé',    r:'旅行社櫃台',   s:3},
  'loisirs':     {n:'Théo',     r:'球場上的朋友', s:4},
  'passe':       {n:'Mamie Odette',r:'愛講往事的阿嬤',s:3},
  'opinion':     {n:'Julien',   r:'嘴很利的同事', s:2},
  'canada':      {n:'Marie-Ève',r:'魁北克來的移民官',s:0},
};
function whoOf(sit){ return NPC_WHO[sit.id] || {n:sit.zh, r:sit.zh, s:0}; }
var AFF_LV=[
  {at:0,  name:'陌生',   note:'他對你點了個頭'},
  {at:3,  name:'認得你', note:'他記得你來過'},
  {at:8,  name:'熟了',   note:'他改口用 tu 稱呼你了'},
  {at:15, name:'朋友',   note:'他願意跟你聊自己的事'},
];
function affLv(a){ var r=AFF_LV[0]; AFF_LV.forEach(function(x){ if((a||0)>=x.at) r=x; }); return r; }
function npcPool(){
  if (typeof SITUATIONS==='undefined') return [];
  return SITUATIONS.filter(function(x){
    var hasQ = BANK.some(function(q){ return q.type==='choose' && q.opts && (x.topics||[]).indexOf(q.topic)>=0; });
    var hasS = (typeof SENTENCES!=='undefined') && SENTENCES.some(function(s){ return (x.lessons||[]).indexOf(s.lesson)>=0; });
    return hasQ && hasS;
  });
}
function npcLine(sit, aff){
  var pool=(typeof SENTENCES!=='undefined'?SENTENCES:[]).filter(function(s){ return (sit.lessons||[]).indexOf(s.lesson)>=0; });
  if(!pool.length) return null;
  var want = (aff>=8) ? /\btu\b|\bte\b|\bton\b|\bta\b/i : /\bvous\b|\bvotre\b/i;
  var pref = pool.filter(function(s){ return want.test(s.fr); });
  var use = pref.length ? pref : pool;
  return use[Math.floor(rnd()*use.length)];
}

/* B2 選路後果（2026-09-15）：同一層的節點＝三條路只能選一條（打完一個就進下一層，其他兩個不會再回頭）
   ⭐ tag 是給玩家「選路前看得出差異」的提示（renderMap 只在 can 狀態顯示），實際數值差異在 win() 裡 */
var TYPES={ foe:{ic:SP.sword,nm:'小怪',tag:'一般戰鬥'}, elite:{ic:SP.skull,nm:'精英',tag:'較硬・雙倍戰利品'},
            chest:{ic:SP.chest,nm:'寶箱',tag:'穩拿補給・無戰鬥'}, shop:{ic:SP.potion,nm:'商人',tag:'花錢回血'},
            npc:{ic:NPC_SPRITES[0],nm:'街坊',tag:'零風險・練交情'}, boss:{ic:SP.crown,nm:'守護者'} };
/* B6 動態難度（2026-09-16，依 research/2026-09-16_動態難度調整.md 的公式與門檻）
   ⭐ 只在「進地城前」評估一次（buildMap 是每次開新地城的入口），戰鬥中途不變
     ——Sepulveda et al. 2020：難度變化要挑玩家沒感知的時間點做
   ⭐ 遲滯不對稱：連續 3 次 Performance>1.2 才升階；1 次 Performance<0.8 就降階
     ——保護不被連續卡關擊垮，比「一路往上加壓」更安全
   ⛔ 不顯示任何難度數字/階級給 Owen（畫面只呈現怪物本身）
   tier 0＝現有預設值（不動舊玩家體感），只在表現明顯超標時才往上調 */
var DDA_TIER=[ {foe:2,elite:3,boss:4}, {foe:3,elite:4,boss:5}, {foe:4,elite:5,boss:6} ];
function ddaTrack(ok){
  if(!S) return;
  S.dda = S.dda || {tier:0, upStreak:0, hist:[]};
  S.dda.hist.push(ok?1:0);
  if(S.dda.hist.length>10) S.dda.hist.shift();
  save(S);
}
function ddaEvaluate(){
  if(!S) return;
  S.dda = S.dda || {tier:0, upStreak:0, hist:[]};
  var h=S.dda.hist;
  if(h.length<5) return;   /* 資料不足：維持現有階級，不用少量樣本亂調 */
  var acc=h.reduce(function(a,b){ return a+b; },0)/h.length;
  var perf=acc/0.75;   /* 0.75＝dashboard 既有的 CLB 達標門檻 */
  if(perf>1.2){
    S.dda.upStreak=(S.dda.upStreak||0)+1;
    if(S.dda.upStreak>=3 && S.dda.tier<DDA_TIER.length-1){ S.dda.tier++; S.dda.upStreak=0; }
  } else if(perf<0.8){
    S.dda.upStreak=0;
    if(S.dda.tier>0) S.dda.tier--;
  } else {
    S.dda.upStreak=0;
  }
  save(S);
}
function ddaHp(type){
  var tier=(S && S.dda && S.dda.tier)||0, t=DDA_TIER[tier];
  return type==='boss'?t.boss:(type==='elite'?t.elite:t.foe);
}
/* 低階多辨識型（choose/gender）、高階多產出型（fill/trans）；缺其中一種就不硬湊，退回原本隨機 */
function pickWeightedQs(pool, n, tier){
  var w=[[0.7,0.3],[0.5,0.5],[0.3,0.7]][tier]||[0.5,0.5];
  var recog=shuffle(pool.filter(function(q){ return q.type==='choose'||q.type==='gender'; }));
  var prod=shuffle(pool.filter(function(q){ return q.type==='fill'||q.type==='trans'; }));
  if(!recog.length || !prod.length) return shuffle(pool).slice(0,n);
  var out=[];
  for(var i=0;i<n;i++){
    var useRecog = rnd() < w[0];
    var src = useRecog ? recog : prod;
    if(!src.length) src = useRecog ? prod : recog;
    if(!src.length) break;
    out.push(src.shift());
  }
  return out;
}
function buildMap(){
  ddaEvaluate();
  return { floors:[ shuffle(['foe','chest','npc']).slice(0,3),
                    shuffle(['foe','shop','npc','elite']).slice(0,3), ['boss'] ],
           pool: questionsFor(recentLessons(4)) };
}
function lootCard(state, prefer){
  var owned=state.cards||{}, ls=recentLessons(4);
  if (prefer){
    var mine=(typeof SENTENCES!=='undefined'?SENTENCES:[]).filter(function(x){ return x.lesson===prefer && !owned['S:'+x.id]; });
    if (mine.length){ var m=mine[Math.floor(Math.random()*mine.length)]; return {key:'S:'+m.id,fr:m.fr,zh:m.zh}; }
  }
  var pool=(typeof SENTENCES!=='undefined'?SENTENCES:[]).filter(function(s){ return ls.indexOf(s.lesson)>=0 && !owned['S:'+s.id]; });
  if(!pool.length && typeof CHUNKS!=='undefined')
    pool=CHUNKS.filter(function(c){ return ls.indexOf(c.lesson)>=0 && !owned['C:'+c.id] && c.fr.length>12; });
  if(!pool.length) return null;
  var c=pool[Math.floor(Math.random()*pool.length)];
  return { key:(c.id.indexOf('S_')===0?'S:':'C:')+c.id, fr:c.fr, zh:c.zh };
}

  });

/* ════════════════════════════════════════════════════════════════
   試煉之塔（B1，2026-09-14）
   ⭐ Owen 09-14 拍板雙版本：這裡是**手機版＝所有筆記內容**（questions.js＋sentences.js，全部課次）。
     考試原題版之後接 Supabase 私人空間（登入才讀得到），⛔ 題目不進 repo。
   ⭐ 一層一種招式：選擇 → 陰陽性 → 聽辨 → 填空 → 中翻法，塔頂所有招式都能用。
     往上爬＝從「認得」走到「自己產出」，考試分數在上面幾層。
   ⛔ 跳過三層出口（CLAUDE.md 練習頁鐵律）：
     這題跳過（記進 clb7_tower_known，降低出現頻率但⛔不刪）／這層跳過（照樣往上）／離開塔（進度留著）
   ⛔ 後果放角色身上：倒下只是回營地整裝，**已經爬到的樓層不會掉**。
   ════════════════════════════════════════════════════════════════ */
/* ── B8 自適應練習密度（2026-09-14）─────────────────────────────
   ⚠️ Owen 09-14：「看完一個環節其實沒練到幾題，還都很簡單」，題數要「用結果回推」。
   ⭐ 塔的每一層＝一個**他最近常卡住的結構**（topic），最卡的在塔頂。弱點大腦讀：
     clb7_topic_snapshots（練習頁正確率）＋clb7_wrong_log（近 30 天各工具錯題）＋塔自己的過關紀錄（tower.res）
   ⭐ 過關：**連續打中 3 下**牠就倒。依據 Rawson & Dunlosky (2011, JEP: General 140(3), 283–302)：
     練到答對 3 次、之後隔開重練 3 次。⚠️ 研究講的是「同一題」，這裡延伸到「同一個結構」；
     所以過關的結構 2 天內不排進塔，之後會回來；隔開過關 3 次且最近沒錯才降下去。
   ⭐ 一直沒打中：答錯牠恢復，**最多 8 題**就退回塔裡（照樣往上，⛔ 不擋路），下次還會排到。
   ⭐ 題型往產出傾斜：結構有填空／陰陽性／中翻法就只有這些算連擊；選擇題（普通攻擊）只當卡住的出口。
   ⛔ 塔裡答錯不扣血——後果放在怪物身上（牠恢復）。已經穩的題（對 3 次沒錯過）少出、錯過的多出。
   遊戲每一題對錯寫回 clb7_<qId>（跟 quiz.html 同一份）＋clb7_wrong_log（src:'quest'），dashboard 讀得到。
   ──────────────────────────────────────────────────────────────── */
var TOWER_SIZE=6, TOWER_NEED=3, TOWER_CAP=8;
var TOWER_KNOWN='clb7_tower_known';
var TYPE_MOVE={ fill:'blast', gender:'heavy', trans:'chant' };
function lsObj(k,d){ try{ var v=JSON.parse(localStorage.getItem(k)); return v==null?d:v; }catch(e){ return d; } }
function allLessons(){ var ls={}; BANK.forEach(function(q){ if(q.lesson) ls[q.lesson]=1; }); return Object.keys(ls).map(Number); }
function towerState(){
  S.tower=S.tower||{floor:0, climbs:0, marks:{}, last:0};
  S.tower.marks=S.tower.marks||{}; S.tower.res=S.tower.res||{};
  return S.tower;
}
function towerKnown(){ try{ return JSON.parse(localStorage.getItem(TOWER_KNOWN))||{}; }catch(e){ return {}; } }
/* 物件形狀＋last，配合 sync_supabase.js 的物件合併慣例 */
function towerMarkKnown(key){
  if(!key) return;
  var k=towerKnown(), r=k[key]||{n:0};
  r.n++; r.last=Date.now(); k[key]=r;
  try{ localStorage.setItem(TOWER_KNOWN, JSON.stringify(k)); }catch(e){}
}
function usableQ(q,t){
  if(q.type!==t) return false;
  if(t==='choose') return !!(q.opts && q.opts.length>=2);
  if(t==='gender' && q.opts && q.opts.length>=2) return true;
  return typeof q.a==='string' && q.a.length>1;
}
function srsOf(q){ return (typeof qId==='function') ? lsObj('clb7_'+qId(q),{w:0,c:0}) : {w:0,c:0}; }
function topicName(tp){
  if(typeof TOPIC_LABELS_FR!=='undefined' && TOPIC_LABELS_FR[tp]) return TOPIC_LABELS_FR[tp];
  var idt=identityOf(tp,0); return (idt && idt.fr) || tp;
}
function towerMoves(tp){
  var have={}; BANK.forEach(function(q){ if(q.topic===tp && usableQ(q,q.type)) have[q.type]=1; });
  var mv=['fill','gender','trans'].filter(function(t){ return have[t]; }).map(function(t){ return TYPE_MOVE[t]; });
  return mv.length ? mv : (have.choose ? ['hit'] : []);
}
function topicWeakness(){
  var snaps=lsObj('clb7_topic_snapshots',[]), raw=(snaps.length&&snaps[snaps.length-1].topics)||{}, last={};
  if(Array.isArray(raw)) raw.forEach(function(x){ if(x&&x.topic) last[x.topic]=x; });   /* ⚠️ quiz.html 存的是陣列 [{topic,pct,attempts}] */
  else last=raw;
  var cut=Date.now()-30*864e5, wrong={};
  lsObj('clb7_wrong_log',[]).forEach(function(e){ if(e&&e.topic&&(e.t||0)>=cut) wrong[e.topic]=(wrong[e.topic]||0)+(e.n||1); });
  var res=towerState().res, info={};
  BANK.forEach(function(q){ if(!q.topic) return; var x=info[q.topic]=info[q.topic]||{lesson:0}; x.lesson=Math.max(x.lesson,q.lesson||0); });
  return Object.keys(info).map(function(tp){
    var s=last[tp], r=res[tp]||{}, sc=0;
    if(s && s.attempts>=3) sc+=Math.max(0,70-s.pct)/35;          /* 正確率越低越前面（70% 以上不加） */
    else sc+=0.6;                                                 /* 樣本太少：值得探一探 */
    sc+=Math.min(1.5,(wrong[tp]||0)*0.25);                        /* 近 30 天各工具常錯 */
    if(r.lastPass && Date.now()-r.lastPass<2*864e5) sc-=5;        /* 剛過關：隔開再練 */
    else if((r.passes||0)>=3 && !wrong[tp]) sc-=1.5;              /* 隔開過關 3 次、最近沒錯＝穩了 */
    if(r.lastRetreat && (!r.lastPass || r.lastRetreat>r.lastPass)) sc+=0.5;   /* 上次沒打倒的 */
    sc+=info[tp].lesson/1000;                                     /* 同分時新課優先 */
    return { topic:tp, score:sc };
  }).filter(function(x){ return towerMoves(x.topic).length; })
    .sort(function(a,b){ return b.score-a.score; });
}
function towerPlan(){
  var t=towerState();
  if(!t.plan || !t.plan.length){
    t.plan=topicWeakness().slice(0,TOWER_SIZE).map(function(x){ return x.topic; }).reverse();   /* 最卡的放塔頂 */
    t.floor=0; t.marks={}; t.last=Date.now(); save(S);
  }
  return t.plan;
}
function weightedPick(arr, w){
  var sum=w.reduce(function(a,b){ return a+b; },0), r=Math.random()*sum;
  for(var i=0;i<arr.length;i++){ r-=w[i]; if(r<=0) return arr[i]; }
  return arr[arr.length-1];
}
/* 題目說明走法文（用語取自課本 Édito 的 consigne）；中文提示收進開關（memory feedback_french_only_ui） */
var CONSIGNE={ choose:'Choisissez la bonne réponse.', fill:'Complétez.', gender:'Au féminin :' };
function consigne(q){ var c=CONSIGNE[q.type]; return c ? '<span class="consigne">'+c+'</span>' : ''; }
function stemOf(q){
  if(q.type==='gender'){ var mm=String(q.q).match(/^(.*?)\s*→\s*女性形？?\s*$/); if(mm) return mm[1]; }
  return q.q;
}
function hintHtml(q){ return q.hint ? '<details class="hintd"><summary>提示</summary>'+esc(q.hint)+'</details>' : ''; }
/* 遊戲裡的作答寫回每題紀錄與錯題本（格式同 quiz.html 的 recordResult／logWrong） */
function gameRecord(q, ok){
  if(!q || !q.topic || !q.q || typeof qId!=='function') return;

  var counts = m.type!=='choose' || B.towerMoves[0]==='hit', clean = loose && !retried;
  B.asked++;

    B.streak++; B.hp=Math.max(0,TOWER_NEED-B.streak);
    if(hero){ hero.classList.add('act'); setTimeout(function(){ hero.classList.remove('act'); },420); }
    setTimeout(function(){
      if(foe){ foe.classList.add('hit'); setTimeout(function(){ foe.classList.remove('hit'); },340); }
      sfx('confirmation_001'); floatDmg('-1');
    },180);
    S.run.coin+=Math.round(m.dmg*2)+Math.max(0,B.streak-1);
    S.xp=(S.xp||0)+Math.round(m.dmg*6);
  } else if(loose){

    setTimeout(function(){ sfx('error_004'); floatDmg('+'+TOWER_NEED); },160);

    panel.innerHTML='<div class="fb">'+
      (clean&&counts ? '<b style="color:var(--green)">'+esc(m.name)+' 命中！</b>'+(B.streak>1?'　連續 ×'+B.streak:'')
       : clean ? '<b style="color:var(--green)">打中了</b><br><span style="color:var(--gold)">普通攻擊打不倒這一層的守衛——換回招式才算連擊</span>'
       : loose ? '<b style="color:var(--gold)">想起來了</b>——這一下不算，連擊還在'
       : '<b style="color:var(--red)">沒打中，牠恢復了</b><br>正解：<b>'+esc(shownAns(q))+'</b>')+
      (loose&&!exact ? '<br><span style="color:var(--gold)">⚠️ 重音沒對上，正確寫法：<b>'+esc(shownAns(q))+'</b></span>' : '')+
      (!clean&&q.aNote ? '<br>'+q.aNote : '')+'</div>'+
      '<button class="next" id="nx">'+(done?'牠倒下了':(out?'牠退回塔裡了':'下一題'))+'</button>';

/* B3 戰利品一鍵進 Anki（2026-09-15，依 research/2026-09-15_遊戲到長期記憶的交接.md）

   ⭐ 欄位對齊 tools/gen_anki_lesson.py 的 24 欄格式，⛔ 匯入前務必跑 tools/anki_precheck.py（撞號檢查） */
function cleanTsv(t){ return String(t==null?'':t).replace(/<[^>]+>/g,'').replace(/[\t\n]/g,' ').trim(); }
function exportLootAnki(){
  var r=S.run, pool=(r.loot||[]).filter(function(c){ return !((r.lootExported||{})[c.key]); });
  if(!pool.length){ toast('今天的戰利品都匯出過了'); return; }
  var batch=pool.slice(0,5);
  var rows=batch.map(function(c){
    var isS=c.key.charAt(0)==='S', srcId=c.key.slice(2);
    var src=isS?(typeof SENTENCES!=='undefined'?SENTENCES:[]):(typeof CHUNKS!=='undefined'?CHUNKS:[]);
    var obj=src.filter(function(x){ return x.id===srcId; })[0]||{};
    var f=new Array(24).fill('');
    f[0]='FR_QUEST_'+srcId;                          /* ID */
    f[1]=cleanTsv(c.fr); f[2]=cleanTsv(c.zh);         /* Sentence／Translation */
    f[7]='第'+(obj.lesson||'?')+'課 · 今日地城戰利品';  /* Source */
    f[9]='quest 戰利品';                              /* KeyChunk */
    f[12]=cleanTsv(c.zh); f[13]=cleanTsv(c.fr);       /* ProductionPrompt／ProductionAnswer */
    f[15]=cleanTsv(obj.note||'');                     /* UsageNotes */
    f[19]='A2'; f[20]='y'; f[22]='approved';          /* Level／只出 Production／approved */
    f[23]='fr::src::quest fr::lesson::l'+(obj.lesson||'0')+' fr::task::phrase fr::tier::production';
    return f.join('\t');
  });
  var blob=new Blob([rows.join('\n')+'\n'], {type:'text/tab-separated-values'});
  var url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download='anki_quest_loot_'+todayStr().replace(/\//g,'-')+'.tsv'; document.body.appendChild(a);
  a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  r.lootExported=r.lootExported||{};
  batch.forEach(function(c){ r.lootExported[c.key]=1; });
  save(S);
  toast('匯出了 '+batch.length+' 張到桌面——匯入前先跑 anki_precheck.py'+(pool.length>5?'（還有 '+(pool.length-5)+' 張留到下次）':''));
  renderMap();
}

var N=null;
function meetNpc(key, sitForced, lineForced, textForced){
  var pool=npcPool();
  if(!pool.length && !sitForced){ S.run.cleared[key]=1; save(S); return advance(); }
  S.npc=S.npc||{};
  var sorted=pool.slice().sort(function(a,b){
    var aa=(S.npc[a.id]||{}).aff||0, bb=(S.npc[b.id]||{}).aff||0;
    if(aa===0&&bb>0) return 1; if(bb===0&&aa>0) return -1;
    return aa-bb;
  });

function type(html, done){

  var plain=html.replace(/<[^>]+>/g,''), i=0;
  el.innerHTML='';
  var t=setInterval(function(){

  }, 22);

/* 選了招式 → 抽那個題型的題目（⛔ 不重複抽剛做過的） */
function useMove(k){
  sfx('click_001');
  var m=MOVES[k], ls=(B&&B.tower)?allLessons():recentLessons(4);
  if(m.type==='exam'){                                      /* 考試之塔：照題號一題一題來 */
    B.move=m; if(B.i>=B.qs.length) return win();
    var eq=B.qs[B.i]; B.i++; return askExam(eq,m);
  }
  if(B && B.tt){                                            /* 塔（B8）：只出這個結構的題 */
    var tpool=BANK.filter(function(x){ return x.topic===B.topic && usableQ(x,m.type); });
    if(!tpool.length) tpool=movePool(B.lessons, m.type);
    if(!tpool.length) tpool=movePool(allLessons(), m.type);
    if(!tpool.length){ toast('這一招沒有題目'); return showCmds(); }
    var fr=tpool.filter(function(x){ return (B.used||[]).indexOf(x.q)<0; });
    if(fr.length) tpool=fr; else B.used=[];
    var kn=towerKnown();
    var tq=weightedPick(tpool, tpool.map(function(x){
      var s=srsOf(x), r=kn[x.q], wt=((s.c||0)>=3 && !s.w) ? 0.15 : 1;   /* 已經穩的題少出 */
      if(s.w) wt+=Math.min(2, s.w*0.5);                                  /* 錯過的多出 */
      if(r) wt*=1/(1+2*r.n);                                             /* 按過「這題跳過」少出，⛔ 不刪 */
      return wt;
    }));
    B.used=(B.used||[]).concat([tq.q]); B.move=m;
    if(m.type==='choose'||(m.type==='gender'&&tq.opts&&tq.opts.length>=2)) return askChoice(tq,m);
    return askType(tq,m);
  }
  if(m.type==='listen'){
    var lq=listenQuestion(B&&B.lessons?B.lessons:ls);
    if(!lq){ toast('句庫還不夠出聽辨題'); return; }
    B.move=m; return askListen(lq,m);
  }
  /* ⚠️ 主線節點有指定 topic 時要先用它的題 ——
     否則第 1 章（自我介紹）會跑出第 29 課的量詞題，劇情跟練習就脫節了（09-12 實測踩到）。
     ⭐ 該 topic 沒有這種題型時才退回最近四課，⛔ 不要因此讓玩家卡住。 */
  var pool=[];
  if(B && B.topic){
    pool=BANK.filter(function(q){
      if(q.topic!==B.topic || q.type!==m.type) return false;
      if(m.type==='choose') return q.opts && q.opts.length>=2;
      if(m.type==='gender' && q.opts && q.opts.length>=2) return true;
      return typeof q.a==='string' && q.a.length>1;
    });
  }
  /* ⭐ 2026-09-13 止血（STORY.md「節點題量健檢」：54 節點中 19 個 choose<4、4 個沒有產出題）
     節點 topic 題量不夠時，**先補同一課的題**（topic 出現過的課次＋本章課次），
     ⛔ 不直接跳去最近四課——那樣第 4 章關主會抽到第 32 課的題，劇情又脫節。 */
  var need=(m.type==='choose'||m.type==='gender') ? 4 : 1;
  if(B && B.topic && pool.length<need){
    var tl={};
    BANK.forEach(function(q){ if(q.topic===B.topic && q.lesson) tl[q.lesson]=1; });
    (B.lessons||[]).forEach(function(l){ tl[l]=1; });
    if(B.story){ var cc=curChapter(); ((cc&&cc.lessons)||[]).forEach(function(l){ tl[l]=1; }); }
    var same=movePool(Object.keys(tl).map(Number), m.type);
    pool=pool.concat(same.filter(function(q){ return pool.indexOf(q)<0; }));
  }
  if(!pool.length) pool=movePool(ls,m.type);
  var fresh=pool.filter(function(q){ return (B.used||[]).indexOf(q.q)<0; });
  if(fresh.length) pool=fresh;
  if(B && B.tower){   /* 塔：跳過過的題降低出現頻率，⛔ 不刪（自評不準，r≈.46） */
    var kn=towerKnown();
    var less=pool.filter(function(q){ var r=kn[q.q]; return !r || Math.random()<1/(1+2*r.n); });
    if(less.length) pool=less;
  }
  var q=pool[Math.floor(Math.random()*pool.length)];
  B.used=(B.used||[]).concat([q.q]); B.move=m;
  if(m.type==='choose'||(m.type==='gender'&&q.opts&&q.opts.length>=2)) return askChoice(q,m);   /* 陰陽性沒有選項 → 打字 */
  return askType(q,m);
}

/* ⚠️ 2026-09-12：改寫招式時，舊的 resolve() 被我連同點詞塊那一段刪掉了，
   造成**選擇題點了完全沒反應**（實測抓到：怪物血量不動、按鈕也不 disable）。
   ⭐ 現在統一走 resolveMove()，選擇題就是傷害 ×1 的普通攻擊。 */
function resolveChoice(btn,q,m){
  var ok=isAns(q,btn.dataset.o);
  Array.prototype.forEach.call(document.querySelectorAll('#opts .opt'),function(x){
    x.disabled=true;
    if(isAns(q,x.dataset.o)) x.classList.add('ok');
    else if(x===btn) x.classList.add('no');
  });
  resolveMove(ok, ok, q, m||MOVES.hit, false);
}

/* ── 大招／詠唱：自己打出來 ─────────────────────────────────
   ⚠️ 2026-09-12 Owen：「打字 ok 不用像 duolinguo 那樣選字 不夠扎實」
     → ⛔ 拿掉點詞塊，改成真的打。但把三個防挫折機制做滿：
       ① 重音不計較（少 é 算對，只提醒正確寫法）
       ② 答錯可以再試一次，第二次答對給**安慰獎**（半傷害，⛔ 不扣血）
       ③ 連續答對有補償（傷害加成、金幣加成、連 5 回一顆心）
       ④ 隨時可以「改用普通攻擊」降級，⛔ 不扣血不羞辱
   ──────────────────────────────────────────────────────────── */
var ACCENTS=['é','è','ê','à','â','ç','ù','û','î','ï','ô','œ'];
function askType(q,m){
  B.curQ=q; B.curM=m; B.retrying=false;
  var panel=document.getElementById('panel');
  panel.innerHTML='<div class="q">'+consigne(q)+esc(stemOf(q))+
      hintHtml(q)+'</div>'+
    '<input class="ans" id="ansBox" autocomplete="off" autocorrect="off" autocapitalize="none" '+
      'spellcheck="false" placeholder="'+(m.type==='trans'?'把整句打出來…':'打出答案…')+'">'+
    '<div class="accbar">'+ACCENTS.map(function(a){
      return '<button onclick="ins(\''+a+'\')">'+a+'</button>'; }).join('')+'</div>'+
    '<div id="retry"></div>'+
    '<div class="cmds" style="margin-top:12px">'+
      '<button class="cmd" onclick="typeCheck()">'+img(SP.sword)+'<span>出招<small>'+m.name+' ×'+m.dmg+'</small></span></button>'+
      '<button class="cmd" onclick="buildDown()">'+img(SP.shield)+'<span>改用普通攻擊<small>卡住沒關係，不扣血</small></span></button>'+
      qSkipBtn()+
    '</div>'+qSkipRow();
  var box=document.getElementById('ansBox');
  box.focus();
  box.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); typeCheck(); } });
}
function ins(a){
  var box=document.getElementById('ansBox'); if(!box) return;
  var st=box.selectionStart||box.value.length, en=box.selectionEnd||st;
  box.value=box.value.slice(0,st)+a+box.value.slice(en);
  box.selectionStart=box.selectionEnd=st+1; box.focus();
}
function buildDown(){ toast('改用普通攻擊'); useMove('hit'); }   /* ⭐ 卡住的出口 */
function typeCheck(){
  var q=B.curQ, m=B.curM, box=document.getElementById('ansBox');
  var mine=(box?box.value:'').trim();
  if(!mine){ toast('先打點東西再出招'); return; }
  var alts=String(q.a).split('|');                /* 多解答（A|B）任一個都算 */
  var exact = alts.some(function(a){ return mine.replace(/\s+/g,' ')===a.replace(/\s+/g,' ').trim(); });
  var loose = alts.some(function(a){ return normAns(mine)===normAns(a); });      /* 重音／標點／大小寫不計較 */
  if(loose) return resolveMove(true, exact, q, m, B.retrying);
  if(!B.retrying){                                /* ⭐ 第一次錯：再給一次，⛔ 這次不扣血 */
    B.retrying=true; sfx('bong_001');
    var a=String(q.a).split('|')[0], peek=a.slice(0, Math.max(1, Math.ceil(a.length*0.25)));
    document.getElementById('retry').innerHTML=
      '<div class="fb" style="color:var(--gold)">還沒中——再試一次（這次不扣血）。開頭是：<b>'+esc(peek)+'…</b></div>';
    if(box){ box.focus(); box.select(); }
    return;
  }
  resolveMove(false, false, q, m, true);
}

/* 傷害數字（⚠️ 2026-09-12：改寫招式時被我連帶刪掉，console 會噴 floatDmg is not defined） */
function floatDmg(txt, mine){
  var scene=document.querySelector('.scene'); if(!scene) return;
  var d=document.createElement('div'); d.className='dmg'+(mine?' you':''); d.textContent=txt;
  scene.appendChild(d); setTimeout(function(){ d.remove(); },950);
}

/* 招式結算：loose＝答對（重音不計較）；exact＝完全一樣；retried＝第二次才對（安慰獎） */
function resolveMove(loose, exact, q, m, retried){
  if(B && B.exam && q.key) examRecord(q.key, loose);
  if(B && B.tt) return towerResolve(loose, exact, q, m, retried);
  if(B && !B.exam && q && q.topic) gameRecord(q, loose && !retried);
  if(B && !B.exam && !B.tower && q && q.topic) ddaTrack(loose && !retried);   /* B6：塔已有自己的連擊節奏（B8）不混進來；地城/副本/主線戰鬥都算進「近期整體表現」，只拿來調地城怪物 */
  var hero=document.getElementById('hero'), foe=document.getElementById('foe');
  if(loose){
    B.combo++;
    /* ⭐ 安慰獎：第二次才答對 → 半傷害，但⛔ 不扣血、連擊不歸零、經驗照給
       ⭐ 連擊補償：3 連以上傷害 +1；5 連回一顆心（Owen 09-12 指定） */
    var base = retried ? m.dmg*0.5 : m.dmg;
    var dmg=B.exam ? 1 : Math.round((base + (B.combo>=3?1:0) + trainBonus().dmg)*10)/10;   /* 考試題一題一格，⛔ 不能提早打倒害後面的題沒做 */   /* 力量加傷害 */
    if(B.combo===5){
      var lvNow=lvOf(S.xp);
      if(S.run.hp<maxHpOf(lvNow)){ S.run.hp++; toast('5 連擊——喘了一口氣，回復一顆心'); sfx('glass_002'); }
      else { S.run.coin+=10; toast('5 連擊——撿到 10 枚金幣'); }
    }
    hero.classList.add('act'); setTimeout(function(){hero.classList.remove('act');},420);
    setTimeout(function(){
      foe.classList.add('hit'); sfx('confirmation_001'); floatDmg('-'+dmg);
      if(m.dmg>=2){ var f=document.createElement('div'); f.className='flash'; document.body.appendChild(f);
                    setTimeout(function(){f.remove();},320); }
      B.hp=Math.max(0,B.hp-dmg);
      var bar=document.getElementById('fbar'); if(bar) bar.style.width=Math.round(B.hp/B.maxHp*100)+'%';
      setTimeout(function(){ foe.classList.remove('hit'); },340);
    },180);
    S.run.coin+=Math.round(m.dmg*2)+Math.max(0,B.combo-1);   /* 連越多，金幣越多 */
    S.xp=(S.xp||0)+Math.round(m.dmg*6);
  } else {
    B.combo=0;
    setTimeout(function(){
      hero.classList.add('ouch'); sfx('error_004'); if(!B.exam) floatDmg('-1',true);
      setTimeout(function(){hero.classList.remove('ouch');},360);
    },160);
    if(!B.exam) S.run.hp=Math.max(0,S.run.hp-1);   /* 考試題：錯了只是沒打中，⛔ 不扣血 */
    S.xp=(S.xp||0)+2;
  }
  save(S); renderHud();
  var panel=document.getElementById('panel');
  setTimeout(function(){
    panel.innerHTML='<div class="fb">'+
      (loose ? '<b style="color:var(--green)">'+esc(m.name)+(retried?' 命中（第二次）':' 命中！')+'</b>'+
               (B.combo>1?'　連擊 ×'+B.combo:'')+
               (retried?'<br><span style="color:var(--gold)">想起來了就算數——半個傷害，沒有扣血</span>':'')+
               (exact?'':'<br><span style="color:var(--gold)">⚠️ 重音沒對上，正確寫法：<b>'+esc(shownAns(q))+'</b></span>')
             : '<b style="color:var(--red)">'+(B.exam?'沒打中':'沒組對，被反擊了')+'</b><br>正解：<b>'+esc(shownAns(q))+'</b>')+
      (q.aNote&&(!q.zhOnlyWrong||!loose)?'<br>'+q.aNote:'')+'</div>'+
      '<button class="next" id="nx">'+(S.run.hp<=0?'你倒下了…':(B.exam?(B.i>=B.qs.length?'這一層做完了':'下一題'):(B.hp<=0?'牠倒下了':'繼續')))+'</button>';
    document.getElementById('nx').addEventListener('click',function(){
      sfx('click_001');
      if(S.run.hp<=0){ S.run.lostCoin=S.run.coin; S.run.coin=0;
        if(B.tower){ S.towerCur=null; save(S); renderHud(); renderTower(); return; }   /* 塔：回塔下，樓層不掉 */
        save(S); renderHud(); renderMap(); return; }
      if(B.exam) return (B.i>=B.qs.length) ? win() : useMove('read');
      if(B.hp<=0) return win();
      type(esc(B.name)+' 還站著。', showCmds);
    });
  }, 700);
}

function win(){
  var r=S.run, foe=document.getElementById('foe');
  if(foe) foe.classList.add('die');
  sfx('maximize_001');
  if(!B.tower) r.cleared[B.key]=1;   /* 塔的勝利不寫進今日地城的格子 */
  /* B2 選路後果：精英比小怪硬（movePool 的 maxHp 3 vs 2），獎勵也要跟著高——
     不然「精英路線」單純是風險沒有報酬 */
  var isElite=B.type==='elite', gainCoin=B.isBoss?20:(isElite?9:5), gainXp=B.isBoss?40:(isElite?20:12);
  r.coin+=gainCoin;
  S.xp=(S.xp||0)+gainXp;
  var before=lvOf(S.xp-gainXp), after=lvOf(S.xp), levelled=after>before;
  var storyCh = B.story ? curChapter() : null;
  var cards=[]; for(var i=0;i<(B.isBoss?2:(isElite?2:1));i++){
    /* ⚠️ 主線關主要掉「那一章」的句子，⛔ 不是今日地城關主那一課的（09-12 實測踩到） */
    var c=lootCard(S, B.raid ? B.lesson : (B.story ? ((storyCh&&storyCh.lessons||[])[0]||null) : (B.isBoss?BOSS.lesson:null)));
    if(c){ cards.push(c); r.loot.push(c); (S.cards=S.cards||{})[c.key]={last:Date.now()}; }
  }
  if(B.raid){                                    /* 副本戰績（⛔ 不進守護者圖鑑，那是主線與今日關主的位置） */
    S.raid=S.raid||{}; var rr=S.raid[B.lesson]||{wins:0};
    rr.wins++; rr.last=Date.now(); S.raid[B.lesson]=rr;
  }
  if(B.isBoss && !B.raid && !B.tower){
    S.dex=S.dex||{};
    /* ⭐ 主線關主用「章」的身分進圖鑑，⛔ 不要混進今日地城的關主 */
    var dexId = B.story ? ('ch'+(storyCh?storyCh.ch:'?')) : BOSS.id;
    var e=S.dex[dexId]||{wins:0};
    e.wins++; e.last=Date.now();
    e.sprite = B.story ? B.sprite : BOSS.sprite;
    e.name   = B.story ? ('第'+(storyCh?storyCh.ch:'?')+'章 '+(storyCh?storyCh.title:'')) : BOSS.name;
    S.dex[dexId]=e;
  }
  if(levelled){ r.hp=maxHpOf(after); }
  save(S); renderHud();
  setTimeout(function(){
    document.getElementById('view').innerHTML=sceneHtml().replace('<div class="foe"','<div class="foe" style="display:none"')+
      '<div class="box"><div class="loot" style="margin:0;border:none;box-shadow:none;background:none">'+
        '<h3>'+(B.isBoss?'LE GARDIEN EST TOMBÉ':'VICTOIRE')+'</h3>'+
        (levelled?'<div class="fb" style="text-align:center;color:var(--gold2)">★ 升到 Lv '+after+'！體力上限提高了</div>':'')+
        '<div class="fb" style="text-align:center">經驗 +'+gainXp+'　金幣 +'+gainCoin+'</div>'+
        (B.isBoss&&!B.tower?'<div class="fb" style="text-align:center">「'+esc(B.story?((storyCh?storyCh.title:'')+' 的關主'):BOSS.name)+'」已收進圖鑑</div>':'')+
        '<div style="margin-top:12px">'+cards.map(cardHtml).join('')+'</div>'+
        '<button class="next" onclick="advance()">'+(B.tower?(B.isBoss?'登頂':'往上走'):(B.isBoss?'回營地':'繼續前進'))+'</button>'+
      '</div></div>';
  }, 620);
}
function advance(){
  if(S.towerCur) return towerAdvance(false);     /* 塔：打完往上一層 */
  if(S.raidCur){                                  /* 副本：打完回副本清單 */
    S.raidCur=null; save(S); renderRaids(); window.scrollTo({top:0,behavior:'smooth'}); return;
  }
  if(S.storyCur) return storyAdvance();          /* 主線模式：回主線推進 */
  var r=S.run;
  if(r.floor<MAP.floors.length-1) r.floor++;
  save(S); renderMap(); window.scrollTo({top:0,behavior:'smooth'});
}
function retreat(to){
  var d=load(); d.run=freshRun(lvOf(d.xp||0)); save(d); S=d; MAP=buildMap();
  sfx('confirmation_001'); renderHud(); if(to==='tower') renderTower(); else renderMap(); toast('整裝完畢，再來一次');
}
init();
</script>

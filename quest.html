<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>今日地城 · CLB7</title>
<!--
  quest.html — 今日地城（roguelike 原型，2026-09-12）
  ════════════════════════════════════════════════════════════════
  ⚠️ 為什麼做這個：Owen 09-12
    「我們系統要更好玩累計更多，我就算沒事也想點進來，那才是重點」
    「（roleplay）那個就很難玩啊…那是角色扮演學習，完全不像在玩遊戲」
    「我們之前一直在堆素材，現在素材應該超多了，做個好玩的遊戲應該不難」

  ⭐⭐ 設計鐵律（跟 roleplay.html 失敗的差別就在這裡）：
    **先是遊戲，題目只是出招的方式。**
    ⛔ 不是把練習包上遊戲名字 —— 那是 roleplay 的死因。
    所以一定要有：資源（血/金幣）、選擇有後果（選路）、運氣（隨機遭遇）、
    即時回饋（傷害數字、震動、連擊）、短期目標（打完三層）、長期收集（圖鑑）。

  ⛔ 明確不要（依 CLAUDE.md 練習頁鐵律與 feedback_fun_is_the_engine）：
    扣血懲罰隔夜、連勝斷掉的羞辱、排行榜、分母、「你還有 N 題沒做」。
    失敗只說「撤退」，戰利品照留，明天新地城。

  素材全部用既有的（⛔ 不新增題庫）：
    questions.js BANK（出招）／sentences.js＋chunks.js（戰利品卡）／
    gram_rules.js GRAM_POINTS（關主身分）／tts_reader.js（敵人講法文）
  ════════════════════════════════════════════════════════════════
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
<style>
/* ════════════════════════════════════════════════════════════════
   視覺系統（2026-09-12 改版，Owen：「頁面要高級一點喔！」）
   ⭐ 方向：黑曜石＋燙金的「古籍／地城」質感，⛔ 不是童趣塑膠感的 gamification。
   字體：Cinzel（拉丁標題）＋ Cormorant Garamond（法文台詞）——都是 OFL 開源。
   圖示：手繪 SVG（本檔自己畫的線條圖），⛔ 不用 emoji 當主要圖示。
   ════════════════════════════════════════════════════════════════ */
:root{
  --bg:#0a0c11; --bg2:#070910;
  --panel:#11151f; --panel2:#161b28;
  --line:#252c3d; --line2:#39435c;
  --ink:#e9ecf3; --dim:#8592ab; --faint:#5b667e;
  --gold:#d9b45e; --gold2:#f3dc9a; --ember:#e0763c;
  --red:#d8574f; --green:#5cc48b; --purple:#9d7ede;
  --shadow:0 10px 30px rgba(0,0,0,.55);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; background:var(--bg)}
body{
  color:var(--ink); padding:0 0 40px; overscroll-behavior:none;
  font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;
  background:
    radial-gradient(1100px 520px at 50% -8%, #1b2233 0%, rgba(27,34,51,0) 62%),
    radial-gradient(700px 420px at 100% 108%, #1a1723 0%, rgba(26,23,35,0) 60%),
    var(--bg);
  background-attachment:fixed;
}
/* 細微顆粒（內嵌 SVG，不外連） */
body:before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.30;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.4'/></svg>");
  mix-blend-mode:overlay;
}
.wrap{max-width:580px; margin:0 auto; padding:0 16px; position:relative; z-index:1}

/* ── 頂部狀態列 ─────────────────────────────────────────── */
.hud{
  position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:12px;
  padding:11px 16px 10px; backdrop-filter:blur(10px);
  background:linear-gradient(180deg,rgba(10,12,17,.96) 62%,rgba(10,12,17,0));
  border-bottom:1px solid rgba(217,180,94,.10);
}
.hud .stat{display:flex; align-items:center; gap:5px; font-size:.82rem; font-weight:700; letter-spacing:.3px}
.hud .stat svg{width:15px; height:15px; display:block}
.hearts{display:flex; gap:3px}
.hearts svg{width:17px; height:17px; filter:drop-shadow(0 0 5px rgba(216,87,79,.45))}
.hearts .dead{opacity:.18; filter:none}
.hearts .low{animation:beat 1s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.16)}}
.coin{color:var(--gold)} .lootn{color:var(--purple)}
.hud .sp{flex:1}
.hud a{
  color:var(--dim); font-size:.72rem; text-decoration:none; letter-spacing:.5px;
  border:1px solid var(--line); padding:5px 11px; border-radius:9px; transition:.2s;
}
.hud a:hover{border-color:var(--line2); color:var(--ink)}

/* ── 標題 ───────────────────────────────────────────────── */
.title{margin:22px 0 4px; text-align:center}
.title .en{
  font-family:'Cinzel',serif; font-size:.72rem; letter-spacing:.42em; color:var(--gold);
  text-transform:uppercase; opacity:.85;
}
.title h1{
  font-size:1.55rem; margin:5px 0 0; letter-spacing:.14em; font-weight:600;
  background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,#9d7f3c);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  text-shadow:0 0 26px rgba(217,180,94,.18);
}
.rule{
  height:1px; margin:13px auto 0; max-width:230px;
  background:linear-gradient(90deg,transparent,rgba(217,180,94,.55),transparent);
  position:relative;
}
.rule:after{
  content:'◆'; position:absolute; left:50%; top:-8px; transform:translateX(-50%);
  color:var(--gold); font-size:.6rem; background:var(--bg); padding:0 7px;
}
.sub{color:var(--dim); font-size:.79rem; margin:14px 0 20px; line-height:1.85; text-align:center}
.sub b{color:var(--gold2); font-weight:600}

/* ── 地圖 ───────────────────────────────────────────────── */
.floor{
  display:flex; align-items:center; gap:10px; margin:0 0 9px;
  color:var(--faint); font-size:.66rem; letter-spacing:.3em; font-family:'Cinzel',serif;
}
.floor:after{content:''; flex:1; height:1px; background:linear-gradient(90deg,rgba(57,67,92,.6),transparent)}
.row{display:flex; gap:11px; margin-bottom:20px}
.node{
  flex:1; position:relative; cursor:pointer; border-radius:15px; padding:16px 8px 13px;
  text-align:center; transition:transform .16s, box-shadow .25s, border-color .25s;
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--line); box-shadow:var(--shadow);
}
.node .ic{width:34px; height:34px; margin:0 auto 7px; color:var(--dim); transition:.25s}
.node .ic svg{width:100%; height:100%; display:block}
.node .nm{font-size:.73rem; color:var(--faint); letter-spacing:.1em; transition:.25s}
.node.can{border-color:rgba(217,180,94,.55)}
.node.can .ic{color:var(--gold); filter:drop-shadow(0 0 8px rgba(217,180,94,.35))}
.node.can .nm{color:var(--gold2)}
.node.can:before{
  content:''; position:absolute; inset:-1px; border-radius:15px; pointer-events:none;
  box-shadow:0 0 22px rgba(217,180,94,.18) inset, 0 0 24px rgba(217,180,94,.10);
  animation:breathe 2.6s ease-in-out infinite;
}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.node.can:active{transform:scale(.965)}
.node.done{opacity:.32}
.node.done:after{
  content:''; position:absolute; top:9px; right:10px; width:13px; height:13px;
  background:no-repeat center/contain url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235cc48b' stroke-width='3' stroke-linecap='round'><path d='M4 13l5 5L20 6'/></svg>");
}
.node.locked{opacity:.26; cursor:default}
.node.boss{padding:20px 8px 16px}
.node.boss .medal{
  width:62px; height:62px; font-size:1.9rem; margin:0 auto 8px; border-radius:50%; display:flex;
  align-items:center; justify-content:center; font-size:1.6rem;
  background:radial-gradient(circle at 35% 30%,#2a3145,#141824);
  border:1px solid rgba(217,180,94,.4); box-shadow:0 0 20px rgba(217,180,94,.14) inset;
}

/* ── 戰鬥 ───────────────────────────────────────────────── */
.battle{
  border-radius:19px; padding:20px 18px 18px; margin-top:8px; position:relative; overflow:hidden;
  background:linear-gradient(180deg,var(--panel2),var(--panel) 65%);
  border:1px solid var(--line); box-shadow:var(--shadow);
}
.battle:before{
  content:''; position:absolute; inset:0 0 auto; height:1px;
  background:linear-gradient(90deg,transparent,rgba(217,180,94,.55),transparent);
}
.foe{text-align:center; position:relative; padding:4px 0 12px}
.foe .art{
  width:86px; height:86px; margin:0 auto; border-radius:50%; display:flex;
  align-items:center; justify-content:center; font-size:2.7rem;
  background:radial-gradient(circle at 36% 28%,#2b3247,#12161f 72%);
  border:1px solid var(--line2); box-shadow:0 0 34px rgba(0,0,0,.6), 0 0 22px rgba(217,180,94,.10) inset;
  animation:enter .45s cubic-bezier(.2,.9,.3,1.3);
}
.foe .art svg{width:46px; height:46px; color:var(--dim)}
@keyframes enter{0%{transform:scale(.72) translateY(10px); opacity:0}100%{transform:none; opacity:1}}
.foe.hit .art{animation:shake .34s}
@keyframes shake{
  0%,100%{transform:translateX(0) rotate(0)}
  18%{transform:translateX(-10px) rotate(-7deg)}
  46%{transform:translateX(9px) rotate(6deg)}
  74%{transform:translateX(-4px) rotate(-2deg)}
}
.foe .nm{font-size:1.02rem; font-weight:700; margin-top:11px; letter-spacing:.06em}
.foe .ttl{font-family:'Cinzel',serif; font-size:.66rem; color:var(--gold); letter-spacing:.22em; margin-top:4px; opacity:.9}
.bar{
  height:7px; margin:12px auto 0; max-width:220px; border-radius:5px; overflow:hidden;
  background:#080a10; border:1px solid var(--line); box-shadow:0 0 10px rgba(0,0,0,.5) inset;
}
.bar i{display:block; height:100%; transition:width .45s cubic-bezier(.3,1,.4,1);
       background:linear-gradient(90deg,#8f2f2a,var(--red) 55%,var(--ember));
       box-shadow:0 0 12px rgba(224,118,60,.45)}
.combo{color:var(--gold); font-size:.74rem; margin-top:8px; height:1.15em; letter-spacing:.08em}

/* 關主台詞：古籍紙頁感 */
.say{
  margin-top:14px; padding:13px 15px; border-radius:13px; position:relative;
  background:linear-gradient(180deg,rgba(217,180,94,.07),rgba(217,180,94,.02));
  border:1px solid rgba(217,180,94,.22);
}
.say .fr{
  font-family:'Cormorant Garamond',Georgia,serif; font-style:italic;
  font-size:1.12rem; line-height:1.55; color:var(--gold2);
}
.say .zh{color:var(--dim); font-size:.76rem; margin-top:6px}
.say button, .card button{
  background:none; border:1px solid rgba(217,180,94,.3); color:var(--gold);
  border-radius:8px; cursor:pointer; font-size:.7rem; padding:2px 8px; margin-left:7px; transition:.2s;
}
.say button:hover, .card button:hover{background:rgba(217,180,94,.12)}

.q{margin:18px 0 13px; font-size:.97rem; line-height:1.7}
.q .hint{display:block; color:var(--faint); font-size:.75rem; margin-top:6px; letter-spacing:.02em}
.opts{display:grid; gap:10px}
.opt{
  position:relative; text-align:left; padding:13px 15px; border-radius:13px; cursor:pointer;
  font-family:inherit; font-size:.89rem; line-height:1.55; color:var(--ink); transition:.15s;
  background:linear-gradient(180deg,#141926,#10141e); border:1px solid var(--line);
}
.opt:hover:not(:disabled){border-color:var(--line2); transform:translateX(2px)}
.opt:active:not(:disabled){transform:scale(.988)}
.opt.ok{border-color:var(--green); background:linear-gradient(180deg,#12291d,#0e2018);
        box-shadow:0 0 20px rgba(92,196,139,.14)}
.opt.no{border-color:var(--red); background:linear-gradient(180deg,#2a1414,#1e0f0f)}
.opt:disabled{cursor:default}
.fb{margin-top:14px; font-size:.83rem; line-height:1.8; color:var(--dim)}
.fb b{color:var(--ink)}
.next{
  width:100%; margin-top:15px; padding:14px; border-radius:13px; cursor:pointer;
  font-family:'Cinzel',-apple-system,"PingFang TC",serif; font-size:.9rem; font-weight:700; letter-spacing:.12em;
  color:#1a1406; background:linear-gradient(180deg,var(--gold2),var(--gold) 60%,#b3913f);
  border:1px solid rgba(243,220,154,.5); box-shadow:0 6px 18px rgba(217,180,94,.22);
  transition:.18s;
}
.next:active{transform:translateY(1px); box-shadow:0 3px 10px rgba(217,180,94,.2)}

/* 傷害數字 */
.dmg{
  position:absolute; left:50%; top:16%; transform:translateX(-50%); pointer-events:none;
  font-family:'Cinzel',serif; font-weight:700; font-size:1.7rem; color:var(--gold2);
  text-shadow:0 0 18px rgba(217,180,94,.6); animation:fly .9s ease-out forwards;
}
@keyframes fly{
  0%{opacity:0; transform:translate(-50%,8px) scale(.6)}
  22%{opacity:1; transform:translate(-50%,-14px) scale(1.25)}
  100%{opacity:0; transform:translate(-50%,-58px) scale(1)}
}
.flash{position:fixed; inset:0; pointer-events:none; z-index:40; background:rgba(243,220,154,.10); animation:fade .32s ease-out forwards}
@keyframes fade{to{opacity:0}}

/* ── 戰利品／結算 ───────────────────────────────────────── */
.loot{
  border-radius:19px; padding:20px 18px; margin-top:14px; position:relative; overflow:hidden;
  background:linear-gradient(180deg,#1c2130,#12161f);
  border:1px solid rgba(217,180,94,.42); box-shadow:0 0 40px rgba(217,180,94,.10), var(--shadow);
  animation:pop .38s cubic-bezier(.2,.9,.3,1.25);
}
@keyframes pop{0%{transform:scale(.93) translateY(8px); opacity:0}100%{transform:none; opacity:1}}
.loot h3{
  margin:0 0 13px; font-family:'Cinzel',serif; font-size:.82rem; color:var(--gold);
  letter-spacing:.24em; text-align:center;
}
.card{
  background:linear-gradient(180deg,#141926,#0f131c); border:1px solid var(--line);
  border-left:2px solid rgba(217,180,94,.5); border-radius:12px; padding:12px 14px; margin-bottom:9px;
  animation:deal .45s cubic-bezier(.2,.9,.3,1.2) backwards;
}
.card:nth-child(3){animation-delay:.1s}
@keyframes deal{0%{transform:translateY(14px) rotate(-1.5deg); opacity:0}100%{transform:none; opacity:1}}
.card .fr{font-family:'Cormorant Garamond',Georgia,serif; font-size:1.06rem; line-height:1.5; color:var(--gold2)}
.card .zh{color:var(--dim); font-size:.78rem; margin-top:4px}

/* ── 圖鑑 ───────────────────────────────────────────────── */
.sec{margin-top:32px}
.sec h2{
  font-family:'Cinzel',serif; font-size:.7rem; color:var(--faint); letter-spacing:.32em;
  margin:0 0 12px; font-weight:500; display:flex; align-items:center; gap:10px;
}
.sec h2:after{content:''; flex:1; height:1px; background:linear-gradient(90deg,rgba(57,67,92,.5),transparent)}
.dex{display:grid; grid-template-columns:repeat(auto-fill,minmax(64px,1fr)); gap:9px}
.cell{
  aspect-ratio:1; border-radius:13px; display:flex; flex-direction:column; align-items:center;
  justify-content:center; font-size:1.4rem; padding:4px;
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid rgba(217,180,94,.3); box-shadow:0 0 16px rgba(217,180,94,.07) inset;
}
.cell small{font-size:.53rem; color:var(--dim); margin-top:3px; line-height:1.15; text-align:center}
.cell.empty{
  background:repeating-linear-gradient(45deg,#0d1016,#0d1016 5px,#0f1219 5px,#0f1219 10px);
  border:1px dashed var(--line); color:var(--faint); font-size:.85rem; box-shadow:none;
}
.toast{
  position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(18px); opacity:0;
  background:linear-gradient(180deg,#1d2434,#151a26); border:1px solid var(--line2);
  padding:11px 19px; border-radius:12px; font-size:.82rem; transition:.28s; pointer-events:none;
  z-index:50; box-shadow:var(--shadow);
}
.toast.on{opacity:1; transform:translateX(-50%) translateY(0)}
.credit{margin-top:34px; text-align:center; color:#3c4557; font-size:.64rem; letter-spacing:.1em}
</style>
</head>
<body>

<div class="hud">
  <span class="hearts" id="hp"></span>
  <span class="stat coin" id="coin"></span>
  <span class="stat lootn" id="lootN"></span>
  <span class="sp"></span>
  <a href="dashboard.html">← 指揮中心</a>
</div>

<div class="wrap">
  <div id="view"></div>
</div>

<div class="toast" id="toast"></div>

<script src="tts_reader.js"></script>
<script src="questions.js"></script>
<script src="sentences.js"></script>
<script src="chunks.js"></script>
<script src="gram_rules.js"></script>
<script src="situations.js"></script>
<script>
/* ── 圖示庫：本檔自己畫的 SVG（⛔ 不外連、無授權問題）──────────────
   ⚠️ 為什麼不用 emoji 當主要圖示：emoji 在每台裝置長得都不一樣，
     而且它是「訊息符號」不是「美術」——要有遊戲感就要有一致的線條語言。
   ⭐ 只有關主保留 emoji（那是情境身分，來自 situations.js 的 icon）。 */
var I = {
  heart:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-8-5.2-8-11a4.6 4.6 0 018-3 4.6 4.6 0 018 3c0 5.8-8 11-8 11z"/></svg>',
  coin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 7v10M9.5 9.5h4a1.8 1.8 0 010 3.6h-3a1.8 1.8 0 000 3.6h4" stroke-linecap="round"/></svg>',
  cards:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="7" y="4" width="11" height="15" rx="2"/><path d="M4.5 7v10a2 2 0 001.5 1.9" stroke-linecap="round"/></svg>',
  sword:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l2.2 3.3v8.4h-4.4V5.8z"/><path d="M8 14.2h8M12 14.2v5M9.8 19.2h4.4"/></svg>',
  chest:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M3.5 11a8.5 8.5 0 0117 0"/><rect x="3.5" y="11" width="17" height="9" rx="1.4"/><path d="M3.5 14.4h17"/><rect x="10.6" y="12.6" width="2.8" height="3.6" rx=".7"/></svg>',
  fountain:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 4h11l-1 5.2a4.6 4.6 0 01-9 0z"/><path d="M12 14v5M8.6 19.5h6.8"/></svg>',
  skull:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3a7 7 0 00-7 7v3l2 1.5V18a1 1 0 001 1h8a1 1 0 001-1v-3.5L19 13v-3a7 7 0 00-7-7z"/><circle cx="9.3" cy="11" r="1.4"/><circle cx="14.7" cy="11" r="1.4"/></svg>',
  crown:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M4 18h16M4.5 18l-1.2-9 5 3.4L12 5l3.7 7.4 5-3.4L19.5 18z"/></svg>',
};

/* ════════════════════════════════════════════════════════════════
   狀態：clb7_quest
   形狀（配合 sync_supabase.js 的物件合併：每個 key 一個 last 欄位）
     { run:{date,seed,hp,coin,floor,picked:{},loot:[]},
       dex:{ <bossId>:{last,wins} }, cards:{ <cardId>:{last} } }
   ⚠️ 陣列只用在 run.loot（當天的），跨裝置不需要合併 —— 其餘一律物件。
   ════════════════════════════════════════════════════════════════ */
var LS = 'clb7_quest';
function load(){ try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch(e){ return {}; } }
function save(d){ try { localStorage.setItem(LS, JSON.stringify(d)); } catch(e){} }
function todayStr(){ return new Date().toLocaleDateString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit'}); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('on');
                   clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('on');},1800); }

/* 每日固定亂數：同一天進來地城一樣（⛔ 不能重刷換簡單的），隔天自動換 */
function seedOf(){ var d=new Date(); return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate(); }
var _r = seedOf();
function rnd(){ _r = (_r*1103515245 + 12345) & 0x7fffffff; return _r / 0x7fffffff; }
function pick(a){ return a[Math.floor(rnd()*a.length)] ; }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(rnd()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }

/* ── 敵人圖鑑：關主取自「已解鎖的文法點」，小怪取自最近課次 ───────── */
var FOE_ART = ['👺','🐍','🦇','🕷️','🐗','👻','🦂','🐺'];
var BOSS_ART = ['🧙‍♂️','👑','🐉','🦉','🧛'];

function recentLessons(n){
  var ls = {};
  BANK.forEach(function(q){ if(q.lesson) ls[q.lesson]=1; });
  return Object.keys(ls).map(Number).sort(function(a,b){return b-a;}).slice(0,n);
}
function questionsFor(lessons){
  return BANK.filter(function(q){
    return q.type==='choose' && q.opts && q.opts.length>=3 && lessons.indexOf(q.lesson)>=0;
  });
}
/* 關主的身分：⭐ 先找「生活情境」（situations.js 有 icon／中文名／法文名／考試用途），
   找不到才退回文法點的名字（gram_rules.js）。
   ⛔ 絕對不要把 raw topic id 印在畫面上——那就是 roleplay 失敗的味道：像系統不像遊戲。 */
function identityOf(topic, lesson){
  var sit = (typeof SITUATIONS!=='undefined')
    ? SITUATIONS.filter(function(x){ return (x.topics||[]).indexOf(topic)>=0; })[0] : null;
  if (sit) return { art:sit.icon, name:sit.zh, fr:sit.fr, why:sit.exam || '' };
  var g = (typeof GRAM_POINTS!=='undefined')
    ? GRAM_POINTS.filter(function(p){ return (p.topics||[]).indexOf(topic)>=0; })[0] : null;
  if (g) return { art:g.icon || '📐', name:g.name, fr:(g.rule&&g.rule.title)||'', why:'' };
  return { art:'👑', name:'第 '+lesson+' 課', fr:'', why:'' };
}
/* 關主＝最新一課題目最多的那個 topic；牠的弱點就是那一課的內容 */
function bossOfToday(){
  var newest = recentLessons(1)[0];
  var qs = questionsFor([newest]);
  var topics = {};
  qs.forEach(function(q){ topics[q.topic]=(topics[q.topic]||0)+1; });
  var best = Object.keys(topics).sort(function(a,b){return topics[b]-topics[a];})[0];
  var idt = identityOf(best, newest);
  return {
    id: 'boss_' + best,
    art: idt.art, name: idt.name, fr: idt.fr, why: idt.why,
    title: '第 ' + newest + ' 課 · 關主',
    topic: best, lesson: newest,
    qs: shuffle(qs.filter(function(q){ return q.topic===best; })).slice(0,3),
  };
}
/* 關主開場會講一句法文（⭐ 真的法文輸入，不是裝飾）——取自該課的句庫 */
function bossLine(lesson){
  var pool = (typeof SENTENCES!=='undefined' ? SENTENCES : []).filter(function(s){ return s.lesson===lesson; });
  return pool.length ? pool[Math.floor(rnd()*pool.length)] : null;
}

/* ── 地圖：3 層，每層 2–3 個節點 ───────────────────────────────── */
var TYPES = {
  foe:   { ic:I.sword,    nm:'小怪',   hp:2 },
  elite: { ic:I.skull,    nm:'精英',   hp:3 },
  chest: { ic:I.chest,    nm:'寶箱',   hp:0 },
  shop:  { ic:I.fountain, nm:'泉水',   hp:0 },
  boss:  { ic:I.crown,    nm:'關主',   hp:4 },
};
function buildMap(){
  var pool = questionsFor(recentLessons(4));
  var floors = [
    shuffle(['foe','chest','foe']).slice(0,3),
    shuffle(['foe','shop','elite']).slice(0,3),
    ['boss'],
  ];
  return { floors: floors, pool: pool };
}

/* ── 戰利品卡：優先給「最近課次」的句子（⛔ 不重複給同一張）────────── */
function lootCard(state, preferLesson){
  var owned = state.cards || {};
  var ls = recentLessons(4);
  // ⭐ 關主掉的卡優先來自牠自己那一課 —— 獎勵要跟剛剛打的東西有關係
  if (preferLesson) {
    var mine = (typeof SENTENCES!=='undefined' ? SENTENCES : []).filter(function(x){
      return x.lesson===preferLesson && !owned['S:'+x.id]; });
    if (mine.length) {
      var m = mine[Math.floor(Math.random()*mine.length)];
      return { key:'S:'+m.id, fr:m.fr, zh:m.zh, note:m.note||'' };
    }
  }
  var pool = (typeof SENTENCES!=='undefined' ? SENTENCES : []).filter(function(s){
    return ls.indexOf(s.lesson)>=0 && !owned['S:'+s.id];
  });
  if (!pool.length && typeof CHUNKS!=='undefined')
    pool = CHUNKS.filter(function(c){ return ls.indexOf(c.lesson)>=0 && !owned['C:'+c.id] && c.fr.length>12; });
  if (!pool.length) return null;
  var c = pool[Math.floor(Math.random()*pool.length)];
  return { key:(c.id.indexOf('S_')===0?'S:':'C:')+c.id, fr:c.fr, zh:c.zh, note:c.note||'' };
}

/* ════════════════════════════════════════════════════════════════
   遊戲流程
   ════════════════════════════════════════════════════════════════ */
var S = null, MAP = null, BOSS = null, battle = null;

function freshRun(){
  return { date:todayStr(), hp:3, coin:0, floor:0, picked:{}, loot:[], cleared:{} };
}
function init(){
  var d = load();
  if (!d.run || d.run.date !== todayStr()) { d.run = freshRun(); save(d); }
  S = d;
  MAP = buildMap();
  BOSS = bossOfToday();
  renderHud(); renderMap();
}
function renderHud(){
  var r = S.run;
  document.getElementById('hp').innerHTML = [0,1,2].map(function(i){
    var alive = i < r.hp;
    return '<span style="color:var(--red)" class="' + (alive ? (r.hp===1?'low':'') : 'dead') + '">' + I.heart + '</span>';
  }).join('');
  document.getElementById('coin').innerHTML  = I.coin + '<span>' + r.coin + '</span>';
  document.getElementById('lootN').innerHTML = I.cards + '<span>' + (r.loot||[]).length + '</span>';
}

function renderMap(){
  var r = S.run, v = document.getElementById('view');
  var dead = r.hp <= 0;
  var done = r.cleared['2-0'];
  var html = '<div class="title"><div class="en">Le Donjon du Jour</div><h1>今 日 地 城</h1><div class="rule"></div></div>' +
    '<div class="sub">' + (dead
      ? '你撤退了。戰利品都留著，明天是新的地城。'
      : done
        ? '今天的關主已經倒下。可以再逛，也可以明天再來。'
        : '選一條路走下去。<b>答對就是出招</b>，答錯只扣一顆心——倒下沒有任何損失，明天再來。') +
    '</div>';

  MAP.floors.forEach(function(nodes, fi){
    var reachable = (fi === r.floor) && !dead;
    html += '<div class="floor">第 ' + (fi+1) + ' 層' + (fi===2?' · 關主':'') + '</div><div class="row">';
    nodes.forEach(function(t, ni){
      var key = fi+'-'+ni, cleared = !!r.cleared[key];
      var passed = fi < r.floor;
      var cls = cleared ? 'done' : (reachable ? 'can pulse' : (passed ? 'done' : 'locked'));
      var isBoss = t==='boss';
      html += '<div class="node ' + cls + (isBoss?' boss':'') + '" data-k="' + key + '" data-t="' + t + '">' +
                (isBoss ? '<div class="medal">' + BOSS.art + '</div>'
                        : '<div class="ic">' + TYPES[t].ic + '</div>') +
                '<div class="nm">' + (isBoss ? esc(BOSS.name) : TYPES[t].nm) + '</div>' +
              '</div>';
    });
    html += '</div>';
  });

  if (dead) html += '<button class="next" onclick="retreat()">收拾戰利品，回營地</button>';

  // 今天撿到的卡
  if ((r.loot||[]).length) {
    html += '<div class="sec"><h2>今天撿到的</h2>' + r.loot.map(function(c){
      return '<div class="card"><div class="fr">' + esc(c.fr) +
             '<button onclick="say(this.parentNode.textContent)">🔊</button></div>' +
             '<div class="zh">' + esc(c.zh) + '</div></div>'; }).join('') + '</div>';
  }
  html += dexHtml();
  html += '<div class="credit">字體 Cinzel · Cormorant Garamond（SIL Open Font License）</div>';
  v.innerHTML = html;

  Array.prototype.forEach.call(v.querySelectorAll('.node.can'), function(n){
    n.addEventListener('click', function(){ enter(n.dataset.k, n.dataset.t); });
  });
}

function dexHtml(){
  var dex = S.dex || {};
  var ids = Object.keys(dex);
  var cells = ids.map(function(id){
    var e = dex[id];
    return '<div class="cell">' + (e.art||'👑') + '<small>' + esc(e.name||'') + '</small></div>';
  });
  // ⭐ 空格子刻意留著：Zeigarnik（缺角會催人回來）。⛔ 但不寫「N/M」分母。
  var blanks = Math.max(3, 8 - cells.length);
  for (var i=0;i<blanks;i++) cells.push('<div class="cell empty">?</div>');
  return '<div class="sec"><h2>關主圖鑑</h2><div class="dex">' + cells.join('') + '</div></div>';
}

function say(t){ if (window.TtsReader && TtsReader.supported) TtsReader.speak(String(t).replace(/🔊/g,'').trim()); }

/* ── 進入節點 ───────────────────────────────────────────────── */
function enter(key, type){
  var r = S.run;
  if (type === 'chest') {
    var c = lootCard(S);
    r.cleared[key] = 1; r.coin += 5;
    if (c) { r.loot.push(c); (S.cards = S.cards || {})[c.key] = { last: Date.now() }; }
    save(S); renderHud();
    document.getElementById('view').innerHTML =
      '<div class="loot"><h3>COFFRE</h3>' +
      (c ? '<div class="card"><div class="fr">' + esc(c.fr) + '<button onclick="say(this.parentNode.textContent)">🔊</button></div>' +
           '<div class="zh">' + esc(c.zh) + '</div></div>' +
           '<div class="fb">已經收進今天的戰利品，也進了你的複習卡庫</div>'
         : '<div class="fb">寶箱裡是 5 枚金幣</div>') +
      '<button class="next" onclick="advance()">繼續 →</button></div>';
    return;
  }
  if (type === 'shop') {
    r.cleared[key] = 1;
    var healed = r.hp < 3;
    if (healed) r.hp = Math.min(3, r.hp + 1);
    r.coin += 3; save(S); renderHud();
    document.getElementById('view').innerHTML =
      '<div class="loot"><h3>FONTAINE</h3><div class="fb">' +
      (healed ? '喝了一口，<b>回復一顆心</b>' : '你的心是滿的，撿到 3 枚金幣') +
      '</div><button class="next" onclick="advance()">繼續 →</button></div>';
    return;
  }
  // 戰鬥
  var isBoss = (type === 'boss');
  var qs;
  if (isBoss) qs = BOSS.qs;
  else {
    var n = (type === 'elite') ? 2 : 1;
    qs = shuffle(MAP.pool).slice(0, n);
  }
  if (!qs.length) { toast('這一區沒有題目'); r.cleared[key]=1; save(S); advance(); return; }
  battle = {
    key:key, type:type, isBoss:isBoss, qs:qs, i:0, combo:0,
    maxHp:(isBoss?BOSS.qs.length:qs.length), hp:(isBoss?BOSS.qs.length:qs.length),
    art:(isBoss?BOSS.art:pick([I.sword,I.skull])),
    name:(isBoss?BOSS.name:(type==='elite'?'精英':'小怪')),
    title:(isBoss?BOSS.title:''), fr:(isBoss?BOSS.fr:''),
    line:(isBoss?bossLine(BOSS.lesson):null)
  };
  renderBattle();
}

function renderBattle(){
  var b = battle, q = b.qs[b.i];
  var pctW = Math.round(b.hp / b.maxHp * 100);
  // ⭐ 關主出場先講一句法文 —— 這是真的輸入，不是裝飾（點 🔊 可以聽）
  var sayHtml = '';
  if (b.isBoss && b.line) {
    sayHtml = '<div class="say"><span class="fr">« ' + esc(b.line.fr) + ' »' +
              '<button onclick="say(\'' + esc(b.line.fr).replace(/'/g,"\\'") + '\')">🔊</button></span>' +
              '<div style="color:var(--dim);font-size:.76rem;margin-top:4px">' + esc(b.line.zh) + '</div></div>';
  }
  document.getElementById('view').innerHTML =
    '<div class="battle">' +
      '<div class="foe" id="foe">' +
        '<div class="art">' + (b.isBoss ? b.art : b.art) + '</div>' +
        '<div class="nm">' + esc(b.name) + '</div>' +
        (b.title ? '<div class="ttl">' + esc(b.title) + (b.fr ? ' · ' + esc(b.fr) : '') + '</div>' : '') +
        '<div class="bar"><i id="foeBar" style="width:' + pctW + '%"></i></div>' +
        '<div class="combo" id="combo">' + (b.combo>1 ? '連擊 ×' + b.combo : '') + '</div>' +
      '</div>' + sayHtml +
      '<div class="q">' + esc(q.q) + (q.hint ? '<span class="hint">提示：' + esc(q.hint) + '</span>' : '') + '</div>' +
      '<div class="opts" id="opts">' +
        shuffle(q.opts).map(function(o,i){
          return '<button class="opt" data-o="' + esc(o) + '">' + esc(o) + '</button>'; }).join('') +
      '</div>' +
      '<div class="fb" id="fb"></div>' +
    '</div>';
  Array.prototype.forEach.call(document.querySelectorAll('#opts .opt'), function(btn){
    btn.addEventListener('click', function(){ strike(btn); });
  });
}

function strike(btn){
  var b = battle, q = b.qs[b.i];
  var chosen = btn.dataset.o, ok = (chosen === q.a);
  Array.prototype.forEach.call(document.querySelectorAll('#opts .opt'), function(x){
    x.disabled = true;
    if (x.dataset.o === q.a) x.classList.add('ok');
    else if (x === btn) x.classList.add('no');
  });
  var foe = document.getElementById('foe');
  if (ok) {
    b.combo++;
    var dmg = 1 + (b.combo >= 3 ? 1 : 0);          // ⭐ 連擊到 3 開始傷害加倍
    b.hp = Math.max(0, b.hp - dmg);
    foe.classList.add('hit'); setTimeout(function(){ foe.classList.remove('hit'); }, 340);
    var d = document.createElement('div'); d.className='dmg'; d.textContent='-'+dmg; foe.appendChild(d);
    setTimeout(function(){ d.remove(); }, 900);
    if (dmg > 1) {                                  // ⭐ 連擊加倍時整個畫面閃一下（juice）
      var fl = document.createElement('div'); fl.className='flash'; document.body.appendChild(fl);
      setTimeout(function(){ fl.remove(); }, 340);
    }
    document.getElementById('foeBar').style.width = Math.round(b.hp/b.maxHp*100) + '%';
    document.getElementById('combo').textContent = b.combo>1 ? '連擊 ×'+b.combo+(dmg>1?' — 傷害加倍':'') : '';
    S.run.coin += 2;
  } else {
    b.combo = 0;
    S.run.hp = Math.max(0, S.run.hp - 1);
    document.getElementById('combo').textContent = '';
  }
  save(S); renderHud();
  // ⭐ 回饋一定要給（研究：沒有回饋的提取，效果掉一大半）
  document.getElementById('fb').innerHTML =
    (ok ? '<b style="color:var(--green)">命中！</b> ' : '<b style="color:var(--red)">被擋下</b>　正解：<b>' + esc(q.a) + '</b>　') +
    (q.aNote ? esc(q.aNote) : '') +
    '<button class="next" id="nx">' + (S.run.hp<=0 ? '你倒下了…' : (b.hp<=0 ? '擊倒！' : '下一招 →')) + '</button>';
  document.getElementById('nx').addEventListener('click', afterStrike);
}

function afterStrike(){
  var b = battle, r = S.run;
  if (r.hp <= 0) { save(S); renderMap(); return; }
  if (b.hp <= 0) return win();
  b.i++;
  if (b.i >= b.qs.length) {                 // 題目出完了但沒打死 → 補一題（小怪不會無限拖）
    b.qs = b.qs.concat(shuffle(MAP.pool).slice(0,1));
  }
  renderBattle();
}

function win(){
  var b = battle, r = S.run;
  r.cleared[b.key] = 1;
  r.coin += b.isBoss ? 20 : 5;
  var cards = [];
  var n = b.isBoss ? 2 : (b.type==='elite' ? 1 : 1);
  for (var i=0;i<n;i++){
    var c = lootCard(S, b.isBoss ? BOSS.lesson : null);
    if (c) { cards.push(c); r.loot.push(c); (S.cards = S.cards || {})[c.key] = { last: Date.now() }; }
  }
  if (b.isBoss) {
    S.dex = S.dex || {};
    var e = S.dex[BOSS.id] || { wins:0 };
    e.wins++; e.last = Date.now(); e.art = BOSS.art; e.name = BOSS.name;
    S.dex[BOSS.id] = e;
  }
  save(S); renderHud();
  document.getElementById('view').innerHTML =
    '<div class="loot">' +
      '<h3>' + (b.isBoss ? 'LE GARDIEN EST TOMBÉ' : 'VICTOIRE') + '</h3>' +
      (b.isBoss ? '<div class="fb" style="margin-bottom:12px;text-align:center">「' + esc(BOSS.name) + '」已收進圖鑑</div>' : '') +
      cards.map(function(c){
        return '<div class="card"><div class="fr">' + esc(c.fr) +
               '<button onclick="say(this.parentNode.textContent)">🔊</button></div>' +
               '<div class="zh">' + esc(c.zh) + '</div></div>'; }).join('') +
      '<button class="next" onclick="advance()">' + (b.isBoss ? '回營地' : '繼續前進') + '</button>' +
    '</div>';
}

function advance(){
  var r = S.run;
  // 這一層走完一個節點就往下一層（roguelike：選了就不能回頭）
  if (r.floor < MAP.floors.length - 1) r.floor++;
  save(S); renderMap();
  window.scrollTo({top:0,behavior:'smooth'});
}
function retreat(){
  var d = load(); d.run = freshRun(); d.run.date = todayStr(); d.run.hp = 3;
  // ⚠️ 撤退不扣任何東西 —— 戰利品與圖鑑都在 d.cards／d.dex，不碰
  save(d); S = d; MAP = buildMap(); renderHud(); renderMap();
  toast('整裝完畢，再來一次');
}

init();
</script>

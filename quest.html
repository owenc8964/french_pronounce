<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>今日地城 · CLB7</title>
<!--
  quest.html — 今日地城（roguelike 原型，2026-09-12）
  ════════════════════════════════════════════════════════════════
  ⚠️ 為什麼做這個：Owen 09-12
    「我們系統要更好玩累計更多，我就算沒事也想點進來，那才是重點」
    「（roleplay）那個就很難玩啊…那是角色扮演學習，完全不像在玩遊戲」
    「我們之前一直在堆素材，現在素材應該超多了，做個好玩的遊戲應該不難」

  ⭐⭐ 設計鐵律（跟 roleplay.html 失敗的差別就在這裡）：
    **先是遊戲，題目只是出招的方式。**
    ⛔ 不是把練習包上遊戲名字 —— 那是 roleplay 的死因。
    所以一定要有：資源（血/金幣）、選擇有後果（選路）、運氣（隨機遭遇）、
    即時回饋（傷害數字、震動、連擊）、短期目標（打完三層）、長期收集（圖鑑）。

  ⛔ 明確不要（依 CLAUDE.md 練習頁鐵律與 feedback_fun_is_the_engine）：
    扣血懲罰隔夜、連勝斷掉的羞辱、排行榜、分母、「你還有 N 題沒做」。
    失敗只說「撤退」，戰利品照留，明天新地城。

  素材全部用既有的（⛔ 不新增題庫）：
    questions.js BANK（出招）／sentences.js＋chunks.js（戰利品卡）／
    gram_rules.js GRAM_POINTS（關主身分）／tts_reader.js（敵人講法文）
  ════════════════════════════════════════════════════════════════
-->
<style>
:root{
  --bg:#0b0f16; --panel:#121826; --line:#1e2738; --ink:#e8ecf4; --dim:#7d89a1;
  --gold:#f0c060; --red:#e05a5a; --green:#5fcf8e; --blue:#62aef2; --purple:#a97bd8;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
body{margin:0; background:var(--bg); color:var(--ink);
     font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;
     padding:0 0 30px; overscroll-behavior:none}
.wrap{max-width:560px; margin:0 auto; padding:0 14px}

/* ── 頂部狀態列（永遠看得到資源）── */
.hud{position:sticky; top:0; z-index:20; background:linear-gradient(#0b0f16 70%,rgba(11,15,22,.75));
     padding:10px 14px 8px; display:flex; align-items:center; gap:10px; backdrop-filter:blur(6px)}
.hp{font-size:1.05rem; letter-spacing:1px}
.hp .dead{opacity:.25}
.coin{color:var(--gold); font-size:.88rem; font-weight:700}
.loot-n{color:var(--purple); font-size:.88rem; font-weight:700}
.hud .sp{flex:1}
.hud a{color:var(--dim); font-size:.72rem; text-decoration:none; border:1px solid var(--line);
       padding:4px 9px; border-radius:8px}

h1{font-size:1.12rem; margin:14px 0 2px; letter-spacing:.5px}
.sub{color:var(--dim); font-size:.76rem; margin-bottom:14px; line-height:1.7}

/* ── 地圖 ── */
.floor{margin:0 0 6px; color:var(--dim); font-size:.7rem; letter-spacing:2px}
.row{display:flex; gap:10px; margin-bottom:14px}
.node{flex:1; background:var(--panel); border:1px solid var(--line); border-radius:14px;
      padding:13px 8px; text-align:center; cursor:pointer; transition:.15s; position:relative}
.node .ic{font-size:1.7rem; line-height:1.3}
.node .nm{font-size:.74rem; color:var(--dim); margin-top:3px}
.node.can{border-color:var(--gold); box-shadow:0 0 0 1px rgba(240,192,96,.25),0 0 18px rgba(240,192,96,.12)}
.node.can .nm{color:var(--gold)}
.node.can:active{transform:scale(.96)}
.node.done{opacity:.3}
.node.done:after{content:'✓'; position:absolute; top:6px; right:9px; color:var(--green); font-size:.8rem}
.node.locked{opacity:.32; cursor:default}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

/* ── 戰鬥 ── */
.battle{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px; margin-top:6px}
.foe{text-align:center; position:relative; padding:6px 0 14px}
.foe .art{font-size:3.4rem; display:inline-block; transition:.08s}
.foe.hit .art{animation:shake .32s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px) rotate(-6deg)}
                 50%{transform:translateX(8px) rotate(5deg)}80%{transform:translateX(-4px)}}
.foe .nm{font-size:.95rem; font-weight:700; margin-top:4px}
.foe .ttl{font-size:.7rem; color:var(--dim)}
.bar{height:9px; background:#0a0e15; border:1px solid var(--line); border-radius:6px;
     overflow:hidden; margin:9px auto 0; max-width:230px}
.bar i{display:block; height:100%; background:linear-gradient(90deg,var(--red),#f08a5a); transition:width .3s}
.say{margin-top:10px; background:#0d1320; border:1px solid var(--line); border-radius:12px;
     padding:10px 12px; font-size:.9rem; line-height:1.6}
.say .fr{color:var(--ink)}
.say button{background:none; border:1px solid var(--line); color:var(--gold); border-radius:7px;
            cursor:pointer; font-size:.74rem; padding:1px 7px; margin-left:6px}
.q{margin:14px 0 10px; font-size:.95rem; line-height:1.65}
.q .hint{display:block; color:var(--dim); font-size:.74rem; margin-top:5px}
.opts{display:grid; gap:9px}
.opt{background:#0d1320; border:1px solid var(--line); color:var(--ink); text-align:left;
     padding:12px 13px; border-radius:12px; font-size:.88rem; cursor:pointer; transition:.12s;
     font-family:inherit; line-height:1.5}
.opt:active{transform:scale(.985)}
.opt.ok{border-color:var(--green); background:#10261b}
.opt.no{border-color:var(--red); background:#261212}
.opt:disabled{cursor:default}
.fb{margin-top:11px; font-size:.82rem; line-height:1.7; color:var(--dim)}
.fb b{color:var(--ink)}
.next{width:100%; margin-top:13px; padding:13px; border-radius:12px; border:1px solid var(--gold);
      background:#1c1810; color:var(--gold); font-size:.92rem; font-weight:700; cursor:pointer; font-family:inherit}

/* 傷害數字（juice） */
.dmg{position:absolute; left:50%; top:22%; transform:translateX(-50%); font-weight:800;
     font-size:1.5rem; color:var(--gold); pointer-events:none; animation:fly .85s ease-out forwards}
@keyframes fly{0%{opacity:0; transform:translate(-50%,6px) scale(.7)}
               25%{opacity:1; transform:translate(-50%,-10px) scale(1.15)}
               100%{opacity:0; transform:translate(-50%,-46px) scale(1)}}
.combo{color:var(--gold); font-size:.78rem; margin-top:6px; height:1.1em}

/* ── 戰利品／結算 ── */
.loot{background:linear-gradient(#161b2b,#121826); border:1px solid var(--gold);
      border-radius:16px; padding:15px; margin-top:12px; animation:pop .3s ease-out}
@keyframes pop{0%{transform:scale(.9); opacity:0}100%{transform:scale(1); opacity:1}}
.loot h3{margin:0 0 9px; font-size:.86rem; color:var(--gold); letter-spacing:1px}
.card{background:#0d1320; border:1px solid var(--line); border-radius:11px; padding:10px 12px; margin-bottom:8px}
.card .fr{font-size:.9rem; line-height:1.55}
.card .zh{color:var(--dim); font-size:.78rem; margin-top:3px}
.card button{background:none; border:1px solid var(--line); color:var(--gold); border-radius:7px;
             cursor:pointer; font-size:.72rem; padding:1px 7px; margin-left:6px}

/* ── 圖鑑 ── */
.dex{display:grid; grid-template-columns:repeat(auto-fill,minmax(58px,1fr)); gap:8px; margin-top:10px}
.cell{aspect-ratio:1; border:1px solid var(--line); border-radius:11px; display:flex; flex-direction:column;
      align-items:center; justify-content:center; background:var(--panel); font-size:1.35rem}
.cell.empty{opacity:.22; font-size:.9rem; color:var(--dim)}
.cell small{font-size:.54rem; color:var(--dim); margin-top:2px; line-height:1.1; text-align:center}
.sec{margin-top:26px}
.sec h2{font-size:.82rem; color:var(--dim); letter-spacing:2px; margin:0 0 4px; font-weight:600}
.toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(20px); opacity:0;
       background:#1c2436; border:1px solid var(--line); padding:9px 16px; border-radius:11px;
       font-size:.82rem; transition:.25s; pointer-events:none; z-index:50}
.toast.on{opacity:1; transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="hud">
  <span class="hp" id="hp">❤️❤️❤️</span>
  <span class="coin" id="coin">💰 0</span>
  <span class="loot-n" id="lootN">🃏 0</span>
  <span class="sp"></span>
  <a href="dashboard.html">← 指揮中心</a>
</div>

<div class="wrap">
  <div id="view"></div>
</div>

<div class="toast" id="toast"></div>

<script src="tts_reader.js"></script>
<script src="questions.js"></script>
<script src="sentences.js"></script>
<script src="chunks.js"></script>
<script src="gram_rules.js"></script>
<script src="situations.js"></script>
<script>
/* ════════════════════════════════════════════════════════════════
   狀態：clb7_quest
   形狀（配合 sync_supabase.js 的物件合併：每個 key 一個 last 欄位）
     { run:{date,seed,hp,coin,floor,picked:{},loot:[]},
       dex:{ <bossId>:{last,wins} }, cards:{ <cardId>:{last} } }
   ⚠️ 陣列只用在 run.loot（當天的），跨裝置不需要合併 —— 其餘一律物件。
   ════════════════════════════════════════════════════════════════ */
var LS = 'clb7_quest';
function load(){ try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch(e){ return {}; } }
function save(d){ try { localStorage.setItem(LS, JSON.stringify(d)); } catch(e){} }
function todayStr(){ return new Date().toLocaleDateString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit'}); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('on');
                   clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('on');},1800); }

/* 每日固定亂數：同一天進來地城一樣（⛔ 不能重刷換簡單的），隔天自動換 */
function seedOf(){ var d=new Date(); return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate(); }
var _r = seedOf();
function rnd(){ _r = (_r*1103515245 + 12345) & 0x7fffffff; return _r / 0x7fffffff; }
function pick(a){ return a[Math.floor(rnd()*a.length)] ; }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(rnd()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }

/* ── 敵人圖鑑：關主取自「已解鎖的文法點」，小怪取自最近課次 ───────── */
var FOE_ART = ['👺','🐍','🦇','🕷️','🐗','👻','🦂','🐺'];
var BOSS_ART = ['🧙‍♂️','👑','🐉','🦉','🧛'];

function recentLessons(n){
  var ls = {};
  BANK.forEach(function(q){ if(q.lesson) ls[q.lesson]=1; });
  return Object.keys(ls).map(Number).sort(function(a,b){return b-a;}).slice(0,n);
}
function questionsFor(lessons){
  return BANK.filter(function(q){
    return q.type==='choose' && q.opts && q.opts.length>=3 && lessons.indexOf(q.lesson)>=0;
  });
}
/* 關主的身分：⭐ 先找「生活情境」（situations.js 有 icon／中文名／法文名／考試用途），
   找不到才退回文法點的名字（gram_rules.js）。
   ⛔ 絕對不要把 raw topic id 印在畫面上——那就是 roleplay 失敗的味道：像系統不像遊戲。 */
function identityOf(topic, lesson){
  var sit = (typeof SITUATIONS!=='undefined')
    ? SITUATIONS.filter(function(x){ return (x.topics||[]).indexOf(topic)>=0; })[0] : null;
  if (sit) return { art:sit.icon, name:sit.zh, fr:sit.fr, why:sit.exam || '' };
  var g = (typeof GRAM_POINTS!=='undefined')
    ? GRAM_POINTS.filter(function(p){ return (p.topics||[]).indexOf(topic)>=0; })[0] : null;
  if (g) return { art:g.icon || '📐', name:g.name, fr:(g.rule&&g.rule.title)||'', why:'' };
  return { art:'👑', name:'第 '+lesson+' 課', fr:'', why:'' };
}
/* 關主＝最新一課題目最多的那個 topic；牠的弱點就是那一課的內容 */
function bossOfToday(){
  var newest = recentLessons(1)[0];
  var qs = questionsFor([newest]);
  var topics = {};
  qs.forEach(function(q){ topics[q.topic]=(topics[q.topic]||0)+1; });
  var best = Object.keys(topics).sort(function(a,b){return topics[b]-topics[a];})[0];
  var idt = identityOf(best, newest);
  return {
    id: 'boss_' + best,
    art: idt.art, name: idt.name, fr: idt.fr, why: idt.why,
    title: '第 ' + newest + ' 課 · 關主',
    topic: best, lesson: newest,
    qs: shuffle(qs.filter(function(q){ return q.topic===best; })).slice(0,3),
  };
}
/* 關主開場會講一句法文（⭐ 真的法文輸入，不是裝飾）——取自該課的句庫 */
function bossLine(lesson){
  var pool = (typeof SENTENCES!=='undefined' ? SENTENCES : []).filter(function(s){ return s.lesson===lesson; });
  return pool.length ? pool[Math.floor(rnd()*pool.length)] : null;
}

/* ── 地圖：3 層，每層 2–3 個節點 ───────────────────────────────── */
var TYPES = {
  foe:   { ic:'⚔️', nm:'小怪',   hp:2 },
  elite: { ic:'💀', nm:'精英',   hp:3 },
  chest: { ic:'🎁', nm:'寶箱',   hp:0 },
  shop:  { ic:'⛲', nm:'泉水',   hp:0 },
  boss:  { ic:'👑', nm:'關主',   hp:4 },
};
function buildMap(){
  var pool = questionsFor(recentLessons(4));
  var floors = [
    shuffle(['foe','chest','foe']).slice(0,3),
    shuffle(['foe','shop','elite']).slice(0,3),
    ['boss'],
  ];
  return { floors: floors, pool: pool };
}

/* ── 戰利品卡：優先給「最近課次」的句子（⛔ 不重複給同一張）────────── */
function lootCard(state, preferLesson){
  var owned = state.cards || {};
  var ls = recentLessons(4);
  // ⭐ 關主掉的卡優先來自牠自己那一課 —— 獎勵要跟剛剛打的東西有關係
  if (preferLesson) {
    var mine = (typeof SENTENCES!=='undefined' ? SENTENCES : []).filter(function(x){
      return x.lesson===preferLesson && !owned['S:'+x.id]; });
    if (mine.length) {
      var m = mine[Math.floor(Math.random()*mine.length)];
      return { key:'S:'+m.id, fr:m.fr, zh:m.zh, note:m.note||'' };
    }
  }
  var pool = (typeof SENTENCES!=='undefined' ? SENTENCES : []).filter(function(s){
    return ls.indexOf(s.lesson)>=0 && !owned['S:'+s.id];
  });
  if (!pool.length && typeof CHUNKS!=='undefined')
    pool = CHUNKS.filter(function(c){ return ls.indexOf(c.lesson)>=0 && !owned['C:'+c.id] && c.fr.length>12; });
  if (!pool.length) return null;
  var c = pool[Math.floor(Math.random()*pool.length)];
  return { key:(c.id.indexOf('S_')===0?'S:':'C:')+c.id, fr:c.fr, zh:c.zh, note:c.note||'' };
}

/* ════════════════════════════════════════════════════════════════
   遊戲流程
   ════════════════════════════════════════════════════════════════ */
var S = null, MAP = null, BOSS = null, battle = null;

function freshRun(){
  return { date:todayStr(), hp:3, coin:0, floor:0, picked:{}, loot:[], cleared:{} };
}
function init(){
  var d = load();
  if (!d.run || d.run.date !== todayStr()) { d.run = freshRun(); save(d); }
  S = d;
  MAP = buildMap();
  BOSS = bossOfToday();
  renderHud(); renderMap();
}
function renderHud(){
  var r = S.run;
  document.getElementById('hp').innerHTML =
    [0,1,2].map(function(i){ return '<span class="'+(i<r.hp?'':'dead')+'">❤️</span>'; }).join('');
  document.getElementById('coin').textContent = '💰 ' + r.coin;
  document.getElementById('lootN').textContent = '🃏 ' + (r.loot||[]).length;
}

function renderMap(){
  var r = S.run, v = document.getElementById('view');
  var dead = r.hp <= 0;
  var done = r.cleared['2-0'];
  var html = '<h1>今日地城</h1>' +
    '<div class="sub">' + (dead
      ? '你撤退了 —— ⭐ 戰利品都留著，明天是新的地城。'
      : done
        ? '今天的關主已經倒下 👑 ⭐ 可以再逛，也可以明天再來。'
        : '選一條路走下去。<b>答對＝出招</b>，答錯只扣一顆心——⛔ 沒有懲罰，倒下就是明天再來。') +
    '</div>';

  MAP.floors.forEach(function(nodes, fi){
    var reachable = (fi === r.floor) && !dead;
    html += '<div class="floor">第 ' + (fi+1) + ' 層' + (fi===2?' · 關主':'') + '</div><div class="row">';
    nodes.forEach(function(t, ni){
      var key = fi+'-'+ni, cleared = !!r.cleared[key];
      var passed = fi < r.floor;
      var cls = cleared ? 'done' : (reachable ? 'can pulse' : (passed ? 'done' : 'locked'));
      var isBoss = t==='boss';
      html += '<div class="node ' + cls + '" data-k="' + key + '" data-t="' + t + '">' +
                '<div class="ic">' + (isBoss ? BOSS.art : TYPES[t].ic) + '</div>' +
                '<div class="nm">' + (isBoss ? esc(BOSS.name) : TYPES[t].nm) + '</div>' +
              '</div>';
    });
    html += '</div>';
  });

  if (dead) html += '<button class="next" onclick="retreat()">🏕️ 收拾戰利品，回營地</button>';

  // 今天撿到的卡
  if ((r.loot||[]).length) {
    html += '<div class="sec"><h2>今天撿到的</h2>' + r.loot.map(function(c){
      return '<div class="card"><div class="fr">' + esc(c.fr) +
             '<button onclick="say(this.parentNode.textContent)">🔊</button></div>' +
             '<div class="zh">' + esc(c.zh) + '</div></div>'; }).join('') + '</div>';
  }
  html += dexHtml();
  v.innerHTML = html;

  Array.prototype.forEach.call(v.querySelectorAll('.node.can'), function(n){
    n.addEventListener('click', function(){ enter(n.dataset.k, n.dataset.t); });
  });
}

function dexHtml(){
  var dex = S.dex || {};
  var ids = Object.keys(dex);
  var cells = ids.map(function(id){
    var e = dex[id];
    return '<div class="cell">' + (e.art||'👑') + '<small>' + esc(e.name||'') + '</small></div>';
  });
  // ⭐ 空格子刻意留著：Zeigarnik（缺角會催人回來）。⛔ 但不寫「N/M」分母。
  var blanks = Math.max(3, 8 - cells.length);
  for (var i=0;i<blanks;i++) cells.push('<div class="cell empty">?</div>');
  return '<div class="sec"><h2>關主圖鑑</h2><div class="dex">' + cells.join('') + '</div></div>';
}

function say(t){ if (window.TtsReader && TtsReader.supported) TtsReader.speak(String(t).replace(/🔊/g,'').trim()); }

/* ── 進入節點 ───────────────────────────────────────────────── */
function enter(key, type){
  var r = S.run;
  if (type === 'chest') {
    var c = lootCard(S);
    r.cleared[key] = 1; r.coin += 5;
    if (c) { r.loot.push(c); (S.cards = S.cards || {})[c.key] = { last: Date.now() }; }
    save(S); renderHud();
    document.getElementById('view').innerHTML =
      '<div class="loot"><h3>🎁 寶箱</h3>' +
      (c ? '<div class="card"><div class="fr">' + esc(c.fr) + '<button onclick="say(this.parentNode.textContent)">🔊</button></div>' +
           '<div class="zh">' + esc(c.zh) + '</div></div>' +
           '<div class="fb">這張卡已經收進今天的戰利品 ⭐ 也已經在你的複習卡庫裡</div>'
         : '<div class="fb">寶箱裡是 5 枚金幣 💰</div>') +
      '<button class="next" onclick="advance()">繼續 →</button></div>';
    return;
  }
  if (type === 'shop') {
    r.cleared[key] = 1;
    var healed = r.hp < 3;
    if (healed) r.hp = Math.min(3, r.hp + 1);
    r.coin += 3; save(S); renderHud();
    document.getElementById('view').innerHTML =
      '<div class="loot"><h3>⛲ 泉水</h3><div class="fb">' +
      (healed ? '喝了一口，<b>回復一顆心 ❤️</b>' : '你的心是滿的，撿到 3 枚金幣 💰') +
      '</div><button class="next" onclick="advance()">繼續 →</button></div>';
    return;
  }
  // 戰鬥
  var isBoss = (type === 'boss');
  var qs;
  if (isBoss) qs = BOSS.qs;
  else {
    var n = (type === 'elite') ? 2 : 1;
    qs = shuffle(MAP.pool).slice(0, n);
  }
  if (!qs.length) { toast('這一區沒有題目'); r.cleared[key]=1; save(S); advance(); return; }
  battle = {
    key:key, type:type, isBoss:isBoss, qs:qs, i:0, combo:0,
    maxHp:(isBoss?BOSS.qs.length:qs.length), hp:(isBoss?BOSS.qs.length:qs.length),
    art:(isBoss?BOSS.art:pick(FOE_ART)),
    name:(isBoss?BOSS.name:(type==='elite'?'精英':'小怪')),
    title:(isBoss?BOSS.title:''), fr:(isBoss?BOSS.fr:''),
    line:(isBoss?bossLine(BOSS.lesson):null)
  };
  renderBattle();
}

function renderBattle(){
  var b = battle, q = b.qs[b.i];
  var pctW = Math.round(b.hp / b.maxHp * 100);
  // ⭐ 關主出場先講一句法文 —— 這是真的輸入，不是裝飾（點 🔊 可以聽）
  var sayHtml = '';
  if (b.isBoss && b.line) {
    sayHtml = '<div class="say"><span class="fr">« ' + esc(b.line.fr) + ' »' +
              '<button onclick="say(\'' + esc(b.line.fr).replace(/'/g,"\\'") + '\')">🔊</button></span>' +
              '<div style="color:var(--dim);font-size:.76rem;margin-top:4px">' + esc(b.line.zh) + '</div></div>';
  }
  document.getElementById('view').innerHTML =
    '<div class="battle">' +
      '<div class="foe" id="foe">' +
        '<div class="art">' + b.art + '</div>' +
        '<div class="nm">' + esc(b.name) + '</div>' +
        (b.title ? '<div class="ttl">' + esc(b.title) + (b.fr ? ' · ' + esc(b.fr) : '') + '</div>' : '') +
        '<div class="bar"><i id="foeBar" style="width:' + pctW + '%"></i></div>' +
        '<div class="combo" id="combo">' + (b.combo>1 ? '🔥 連擊 ×' + b.combo : '') + '</div>' +
      '</div>' + sayHtml +
      '<div class="q">' + esc(q.q) + (q.hint ? '<span class="hint">提示：' + esc(q.hint) + '</span>' : '') + '</div>' +
      '<div class="opts" id="opts">' +
        shuffle(q.opts).map(function(o,i){
          return '<button class="opt" data-o="' + esc(o) + '">' + esc(o) + '</button>'; }).join('') +
      '</div>' +
      '<div class="fb" id="fb"></div>' +
    '</div>';
  Array.prototype.forEach.call(document.querySelectorAll('#opts .opt'), function(btn){
    btn.addEventListener('click', function(){ strike(btn); });
  });
}

function strike(btn){
  var b = battle, q = b.qs[b.i];
  var chosen = btn.dataset.o, ok = (chosen === q.a);
  Array.prototype.forEach.call(document.querySelectorAll('#opts .opt'), function(x){
    x.disabled = true;
    if (x.dataset.o === q.a) x.classList.add('ok');
    else if (x === btn) x.classList.add('no');
  });
  var foe = document.getElementById('foe');
  if (ok) {
    b.combo++;
    var dmg = 1 + (b.combo >= 3 ? 1 : 0);          // ⭐ 連擊到 3 開始傷害加倍
    b.hp = Math.max(0, b.hp - dmg);
    foe.classList.add('hit'); setTimeout(function(){ foe.classList.remove('hit'); }, 340);
    var d = document.createElement('div'); d.className='dmg'; d.textContent='-'+dmg; foe.appendChild(d);
    setTimeout(function(){ d.remove(); }, 900);
    document.getElementById('foeBar').style.width = Math.round(b.hp/b.maxHp*100) + '%';
    document.getElementById('combo').textContent = b.combo>1 ? '🔥 連擊 ×'+b.combo+(dmg>1?'（傷害加倍）':'') : '';
    S.run.coin += 2;
  } else {
    b.combo = 0;
    S.run.hp = Math.max(0, S.run.hp - 1);
    document.getElementById('combo').textContent = '';
  }
  save(S); renderHud();
  // ⭐ 回饋一定要給（研究：沒有回饋的提取，效果掉一大半）
  document.getElementById('fb').innerHTML =
    (ok ? '<b style="color:var(--green)">命中！</b> ' : '<b style="color:var(--red)">被擋下</b>　正解：<b>' + esc(q.a) + '</b>　') +
    (q.aNote ? esc(q.aNote) : '') +
    '<button class="next" id="nx">' + (S.run.hp<=0 ? '你倒下了…' : (b.hp<=0 ? '擊倒！' : '下一招 →')) + '</button>';
  document.getElementById('nx').addEventListener('click', afterStrike);
}

function afterStrike(){
  var b = battle, r = S.run;
  if (r.hp <= 0) { save(S); renderMap(); return; }
  if (b.hp <= 0) return win();
  b.i++;
  if (b.i >= b.qs.length) {                 // 題目出完了但沒打死 → 補一題（小怪不會無限拖）
    b.qs = b.qs.concat(shuffle(MAP.pool).slice(0,1));
  }
  renderBattle();
}

function win(){
  var b = battle, r = S.run;
  r.cleared[b.key] = 1;
  r.coin += b.isBoss ? 20 : 5;
  var cards = [];
  var n = b.isBoss ? 2 : (b.type==='elite' ? 1 : 1);
  for (var i=0;i<n;i++){
    var c = lootCard(S, b.isBoss ? BOSS.lesson : null);
    if (c) { cards.push(c); r.loot.push(c); (S.cards = S.cards || {})[c.key] = { last: Date.now() }; }
  }
  if (b.isBoss) {
    S.dex = S.dex || {};
    var e = S.dex[BOSS.id] || { wins:0 };
    e.wins++; e.last = Date.now(); e.art = BOSS.art; e.name = BOSS.name;
    S.dex[BOSS.id] = e;
  }
  save(S); renderHud();
  document.getElementById('view').innerHTML =
    '<div class="loot">' +
      '<h3>' + (b.isBoss ? '👑 關主倒下！' : '⚔️ 擊倒') + '</h3>' +
      (b.isBoss ? '<div class="fb" style="margin-bottom:10px">「' + esc(BOSS.name) + '」進了你的圖鑑 ⭐</div>' : '') +
      cards.map(function(c){
        return '<div class="card"><div class="fr">' + esc(c.fr) +
               '<button onclick="say(this.parentNode.textContent)">🔊</button></div>' +
               '<div class="zh">' + esc(c.zh) + '</div></div>'; }).join('') +
      '<button class="next" onclick="advance()">' + (b.isBoss ? '回營地 🏕️' : '繼續前進 →') + '</button>' +
    '</div>';
}

function advance(){
  var r = S.run;
  // 這一層走完一個節點就往下一層（roguelike：選了就不能回頭）
  if (r.floor < MAP.floors.length - 1) r.floor++;
  save(S); renderMap();
  window.scrollTo({top:0,behavior:'smooth'});
}
function retreat(){
  var d = load(); d.run = freshRun(); d.run.date = todayStr(); d.run.hp = 3;
  // ⚠️ 撤退不扣任何東西 —— 戰利品與圖鑑都在 d.cards／d.dex，不碰
  save(d); S = d; MAP = buildMap(); renderHud(); renderMap();
  toast('整裝完畢，再來一次');
}

init();
</script>
<script src="sync_supabase.js"></script>
</body>
</html>

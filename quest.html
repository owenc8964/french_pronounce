<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>今日地城 · CLB7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
<!--
  quest.html — 今日地城（2026-09-12）
  ════════════════════════════════════════════════════════════════
  ⚠️ 第一版被 Owen 打回：「太陽春了 畫面很不到位 好像還是在選東西填表單的感覺
     我希望是真的有 RPG 的感覺」。
  ⭐ 所以第二版換的不是皮，是**戰鬥結構**：
     ① 像素場景（牆＋地板圖塊）＋ 敵人立繪 ＋ 英雄站位 —— 有「場」才有 RPG
     ② **指令選單**（攻擊／法術／藥水／逃跑）：先選指令再出招，
        ⛔ 不是一進去就丟四個選項給你填 —— 那就是他說的「填表單」
     ③ 回合制：你出招 → 敵人反擊 → 打字機對白敘述戰況
     ④ 資源有限：藥水有數量、法術要花金幣 → 選擇才有後果
     ⑤ 等級與經驗值：打完會變強（跨日保留），⛔ 不是每天回到原點
  素材：Kenney「Tiny Dungeon」＋「Interface Sounds」，皆 CC0（公共領域，無須署名）
       字體 Cinzel／Cormorant Garamond，SIL OFL
  ⛔ 零懲罰不變：倒下＝撤退，戰利品、等級、圖鑑全留（CLAUDE.md 練習頁鐵律）
  ════════════════════════════════════════════════════════════════
-->
<style>
:root{
  --bg:#090b10; --panel:#11151f; --panel2:#171d2b; --line:#252c3d; --line2:#3a465f;
  --ink:#e9ecf3; --dim:#8592ab; --faint:#59melon; --faint:#5a6580;
  --gold:#d9b45e; --gold2:#f3dc9a; --ember:#e0763c;
  --red:#d8574f; --green:#5cc48b; --blue:#63a9e8; --purple:#9d7ede;
  --shadow:0 12px 34px rgba(0,0,0,.6);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; background:var(--bg)}
body{
  color:var(--ink); padding:0 0 34px; overscroll-behavior:none;
  font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;
  background:radial-gradient(950px 480px at 50% -10%,#1a2132 0%,rgba(26,33,50,0) 60%),var(--bg);
  background-attachment:fixed;
}
img{image-rendering:pixelated; image-rendering:crisp-edges}
.wrap{max-width:600px; margin:0 auto; padding:0 14px}

/* ── HUD ───────────────────────────────────────────────── */
.hud{position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:11px;
     padding:10px 15px; backdrop-filter:blur(10px);
     background:linear-gradient(180deg,rgba(9,11,16,.97) 62%,rgba(9,11,16,0));
     border-bottom:1px solid rgba(217,180,94,.10)}
.hud .lv{font-family:'Cinzel',serif; font-size:.74rem; color:var(--gold); letter-spacing:.1em}
.hearts{display:flex; gap:3px}
.hearts svg{width:16px; height:16px; display:block; filter:drop-shadow(0 0 5px rgba(216,87,79,.45))}
.hearts .dead{opacity:.16; filter:none}
.stat{display:flex; align-items:center; gap:4px; font-size:.8rem; font-weight:700}
.stat svg{width:15px; height:15px; display:block}
.coin{color:var(--gold)} .lootn{color:var(--purple)}
.hud .sp{flex:1}
.hud a{color:var(--dim); font-size:.7rem; text-decoration:none; border:1px solid var(--line);
       padding:5px 10px; border-radius:9px}
.xpwrap{height:3px; background:#0a0d14; position:sticky; top:41px; z-index:29}
.xpwrap i{display:block; height:100%; background:linear-gradient(90deg,#4a7fc0,var(--blue));
          box-shadow:0 0 9px rgba(99,169,232,.5); transition:width .5s}

/* ── 標題 ───────────────────────────────────────────────── */
.title{margin:20px 0 2px; text-align:center}
.title .en{font-family:'Cinzel',serif; font-size:.68rem; letter-spacing:.42em; color:var(--gold); opacity:.8}
.title h1{font-size:1.5rem; margin:5px 0 0; letter-spacing:.16em; font-weight:600;
  background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,#9d7f3c);
  -webkit-background-clip:text; background-clip:text; color:transparent}
.rule{height:1px; margin:12px auto 0; max-width:220px; position:relative;
      background:linear-gradient(90deg,transparent,rgba(217,180,94,.5),transparent)}
.rule:after{content:'◆'; position:absolute; left:50%; top:-8px; transform:translateX(-50%);
            color:var(--gold); font-size:.58rem; background:var(--bg); padding:0 6px}
.sub{color:var(--dim); font-size:.78rem; margin:13px 0 18px; line-height:1.85; text-align:center}
.sub b{color:var(--gold2)}

/* ── 地圖 ───────────────────────────────────────────────── */
.floor{display:flex; align-items:center; gap:9px; margin:0 0 8px; color:var(--faint);
       font-size:.64rem; letter-spacing:.3em; font-family:'Cinzel',serif}
.floor:after{content:''; flex:1; height:1px; background:linear-gradient(90deg,rgba(58,70,95,.55),transparent)}
.row{display:flex; gap:10px; margin-bottom:18px}
.node{flex:1; position:relative; cursor:pointer; border-radius:14px; padding:13px 6px 11px;
      text-align:center; transition:transform .16s,border-color .25s,box-shadow .25s;
      background:linear-gradient(180deg,var(--panel2),var(--panel)); border:1px solid var(--line);
      box-shadow:var(--shadow)}
.node img{width:38px; height:38px; display:block; margin:0 auto 6px}
.node .nm{font-size:.71rem; color:var(--faint); letter-spacing:.08em}
.node.can{border-color:rgba(217,180,94,.55); animation:breathe 2.6s ease-in-out infinite}
.node.can .nm{color:var(--gold2)}
@keyframes breathe{0%,100%{box-shadow:var(--shadow)}50%{box-shadow:var(--shadow),0 0 26px rgba(217,180,94,.2)}}
.node.can:active{transform:scale(.965)}
.node.done{opacity:.3} .node.locked{opacity:.24; cursor:default}
.node.done:after{content:'✓'; position:absolute; top:7px; right:9px; color:var(--green); font-size:.75rem}

/* ── 戰鬥場景 ───────────────────────────────────────────── */
.scene{
  position:relative; border-radius:16px 16px 0 0; overflow:hidden; height:250px;
  border:1px solid var(--line); border-bottom:none;
  background-color:#1b1410;
  background-image:
    linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 32%,rgba(0,0,0,.45) 100%),
    var(--wall), var(--floor);
  background-repeat:repeat-x, repeat-x, repeat;
  background-position:center top, center top, center bottom;
  background-size:auto, 48px 48px, 48px 48px;
}
.scene:after{content:''; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(circle at 50% 42%,rgba(255,214,150,.10),transparent 58%)}
.foe{position:absolute; left:50%; top:42%; transform:translate(-50%,-50%); text-align:center}
.foe img{width:104px; height:104px; animation:idle 2.4s ease-in-out infinite;
         filter:drop-shadow(0 10px 14px rgba(0,0,0,.75))}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.foe.hit img{animation:hurt .34s}
@keyframes hurt{0%,100%{transform:translateX(0); filter:none}
  15%{transform:translateX(-11px); filter:brightness(3) saturate(0)}
  55%{transform:translateX(9px); filter:brightness(3) saturate(0)}}
.foe.die img{animation:die .6s forwards}
@keyframes die{to{transform:translateY(16px) scale(.7); opacity:0; filter:brightness(2)}}
.foename{position:absolute; top:10px; left:50%; transform:translateX(-50%); text-align:center;
  background:linear-gradient(180deg,rgba(8,10,15,.92),rgba(8,10,15,.72)); padding:7px 18px 9px;
  border-radius:12px; border:1px solid rgba(217,180,94,.28); backdrop-filter:blur(3px)}
.foename .n{font-size:.88rem; font-weight:700; letter-spacing:.04em}
.foename .t{font-family:'Cinzel',serif; font-size:.58rem; color:var(--gold); letter-spacing:.18em; margin-top:2px}
.fbar{width:150px; height:7px; margin:6px auto 0; background:rgba(0,0,0,.65);
      border:1px solid rgba(255,255,255,.18); border-radius:4px; overflow:hidden}
.fbar i{display:block; height:100%; background:linear-gradient(90deg,#8f2f2a,var(--red),var(--ember));
        transition:width .45s cubic-bezier(.3,1,.4,1)}
.hero{position:absolute; left:16px; bottom:12px}
.hero img{width:76px; height:76px; filter:drop-shadow(0 8px 10px rgba(0,0,0,.7));
          animation:idle 3.1s ease-in-out infinite}
.hero.act img{animation:lunge .4s}
@keyframes lunge{0%,100%{transform:translateX(0)}45%{transform:translateX(46px) scale(1.06)}}
.hero.ouch img{animation:ouch .35s}
@keyframes ouch{0%,100%{transform:translateX(0)}30%{transform:translateX(-10px); filter:brightness(2.4) saturate(.2)}}
.dmg{position:absolute; left:50%; top:14%; transform:translateX(-50%); pointer-events:none;
     font-family:'Cinzel',serif; font-weight:700; font-size:1.8rem; color:var(--gold2);
     text-shadow:0 3px 10px #000,0 0 18px rgba(217,180,94,.7); animation:fly .95s ease-out forwards}
.dmg.you{left:20%; color:#ff8a80}
@keyframes fly{0%{opacity:0; transform:translate(-50%,10px) scale(.6)}
  22%{opacity:1; transform:translate(-50%,-12px) scale(1.3)}
  100%{opacity:0; transform:translate(-50%,-62px) scale(1)}}
.flash{position:fixed; inset:0; pointer-events:none; z-index:40; background:rgba(255,240,200,.16); animation:fade .3s forwards}
@keyframes fade{to{opacity:0}}

/* ── 對白框與指令 ───────────────────────────────────────── */
.box{border:1px solid var(--line); border-top:1px solid rgba(217,180,94,.3); border-radius:0 0 16px 16px;
     background:linear-gradient(180deg,#141926,#0f131d); padding:15px 16px 16px; box-shadow:var(--shadow)}
.talk{min-height:52px; font-size:.92rem; line-height:1.75}
.talk .cursor{color:var(--gold); animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.talk .fr{font-family:'Cormorant Garamond',Georgia,serif; font-style:italic; font-size:1.16rem; color:var(--gold2)}
.talk .zh{color:var(--dim); font-size:.78rem; margin-top:4px}
.talk button{background:none; border:1px solid rgba(217,180,94,.3); color:var(--gold);
             border-radius:7px; cursor:pointer; font-size:.7rem; padding:1px 7px; margin-left:6px}
.cmds{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:14px}
.cmd{display:flex; align-items:center; gap:9px; padding:12px 13px; border-radius:12px; cursor:pointer;
     background:linear-gradient(180deg,#1a2130,#131824); border:1px solid var(--line2);
     color:var(--ink); font-family:inherit; font-size:.88rem; font-weight:600; transition:.15s; text-align:left}
.cmd img{width:22px; height:22px}
.cmd:hover:not(:disabled){border-color:var(--gold); transform:translateY(-1px)}
.cmd:active:not(:disabled){transform:scale(.98)}
.cmd:disabled{opacity:.35; cursor:default}
.cmd small{display:block; font-weight:400; font-size:.68rem; color:var(--faint)}
.q{margin:4px 0 12px; font-size:.95rem; line-height:1.7}
.q .hint{display:block; color:var(--faint); font-size:.74rem; margin-top:6px}
.opts{display:grid; gap:9px}
.opt{text-align:left; padding:12px 14px; border-radius:12px; cursor:pointer; font-family:inherit;
     font-size:.88rem; line-height:1.5; color:var(--ink); transition:.14s;
     background:linear-gradient(180deg,#141926,#10141e); border:1px solid var(--line)}
.opt:hover:not(:disabled){border-color:var(--line2); transform:translateX(2px)}
.opt.ok{border-color:var(--green); background:linear-gradient(180deg,#12291d,#0e2018)}
.opt.no{border-color:var(--red); background:linear-gradient(180deg,#2a1414,#1e0f0f)}
.opt:disabled{cursor:default}
.next{width:100%; margin-top:13px; padding:13px; border-radius:12px; cursor:pointer;
      font-family:'Cinzel',-apple-system,serif; font-size:.88rem; font-weight:700; letter-spacing:.12em;
      color:#1a1406; background:linear-gradient(180deg,var(--gold2),var(--gold) 60%,#b3913f);
      border:1px solid rgba(243,220,154,.5); box-shadow:0 6px 16px rgba(217,180,94,.2)}
.next:active{transform:translateY(1px)}
.fb{margin-top:12px; font-size:.82rem; line-height:1.8; color:var(--dim)}
.fb b{color:var(--ink)}

/* ── 戰利品／圖鑑 ───────────────────────────────────────── */
.loot{border-radius:17px; padding:19px 17px; margin-top:12px;
      background:linear-gradient(180deg,#1c2130,#12161f); border:1px solid rgba(217,180,94,.42);
      box-shadow:0 0 40px rgba(217,180,94,.1),var(--shadow); animation:pop .38s cubic-bezier(.2,.9,.3,1.25)}
@keyframes pop{0%{transform:scale(.93) translateY(8px); opacity:0}100%{transform:none; opacity:1}}
.loot h3{margin:0 0 12px; font-family:'Cinzel',serif; font-size:.8rem; color:var(--gold);
         letter-spacing:.24em; text-align:center}
.card{background:linear-gradient(180deg,#141926,#0f131c); border:1px solid var(--line);
      border-left:2px solid rgba(217,180,94,.5); border-radius:11px; padding:11px 13px; margin-bottom:8px;
      animation:deal .45s cubic-bezier(.2,.9,.3,1.2) backwards}
@keyframes deal{0%{transform:translateY(12px) rotate(-1.5deg); opacity:0}100%{transform:none; opacity:1}}
.card .fr{font-family:'Cormorant Garamond',Georgia,serif; font-size:1.05rem; line-height:1.5; color:var(--gold2)}
.card .zh{color:var(--dim); font-size:.77rem; margin-top:3px}
.card button{background:none; border:1px solid rgba(217,180,94,.3); color:var(--gold);
             border-radius:7px; cursor:pointer; font-size:.68rem; padding:1px 7px; margin-left:6px}
.sec{margin-top:28px}
.sec h2{font-family:'Cinzel',serif; font-size:.68rem; color:var(--faint); letter-spacing:.3em;
        margin:0 0 11px; font-weight:500; display:flex; align-items:center; gap:9px}
.sec h2:after{content:''; flex:1; height:1px; background:linear-gradient(90deg,rgba(58,70,95,.5),transparent)}
.dex{display:grid; grid-template-columns:repeat(auto-fill,minmax(62px,1fr)); gap:8px}
.cell{aspect-ratio:1; border-radius:12px; display:flex; flex-direction:column; align-items:center;
      justify-content:center; padding:4px; background:linear-gradient(180deg,var(--panel2),var(--panel));
      border:1px solid rgba(217,180,94,.3)}
.cell img{width:30px; height:30px}
.cell small{font-size:.5rem; color:var(--dim); margin-top:2px; text-align:center; line-height:1.1}
.cell.empty{background:repeating-linear-gradient(45deg,#0d1016,#0d1016 5px,#0f1219 5px,#0f1219 10px);
            border:1px dashed var(--line); color:var(--faint); font-size:.8rem}
.tabs{display:flex; gap:8px; margin:14px 0 4px}
.tab{flex:1; padding:10px; border-radius:11px; cursor:pointer; font-family:inherit; font-size:.84rem;
  font-weight:600; color:var(--dim); background:linear-gradient(180deg,#141926,#10141e); border:1px solid var(--line)}
.tab.on{color:var(--gold2); border-color:rgba(217,180,94,.5); box-shadow:0 0 18px rgba(217,180,94,.1)}
.conflict{color:var(--dim); font-size:.82rem; line-height:1.95; padding:13px 15px; margin-bottom:18px;
  border-left:2px solid rgba(217,180,94,.4); background:linear-gradient(90deg,rgba(217,180,94,.05),transparent)}
.conflict b{color:var(--gold2)}
.snode{display:flex; gap:12px; align-items:flex-start; padding:13px 14px; margin-bottom:10px; border-radius:13px;
  background:linear-gradient(180deg,var(--panel2),var(--panel)); border:1px solid var(--line); transition:.18s}
.snode.can{border-color:rgba(217,180,94,.55); cursor:pointer; animation:breathe 2.6s ease-in-out infinite}
.snode.can:active{transform:scale(.985)}
.snode.done{opacity:.4}
.snode .sicon img{width:30px; height:30px}
.stype{font-family:'Cinzel',serif; font-size:.62rem; color:var(--gold); letter-spacing:.2em; margin-bottom:5px}
.stext{font-size:.85rem; line-height:1.85; color:var(--ink)}
.snode.done .stext{color:var(--faint)}
.clearbox{margin-top:20px; padding:15px 16px; border-radius:14px; border:1px solid rgba(217,180,94,.28);
  background:linear-gradient(180deg,rgba(217,180,94,.06),transparent)}
.cl-h{font-family:'Cinzel',serif; font-size:.64rem; color:var(--gold); letter-spacing:.22em; margin-bottom:7px}
.cl-t{font-size:.86rem; line-height:1.9}
.cl-x{margin-top:9px; font-size:.73rem; color:var(--faint); line-height:1.7}
.ans{width:100%; padding:13px 15px; border-radius:12px; font-family:'Cormorant Garamond',Georgia,serif;
  font-size:1.18rem; color:var(--gold2); background:rgba(0,0,0,.3); border:1px solid var(--line2); outline:none}
.ans:focus{border-color:var(--gold); box-shadow:0 0 18px rgba(217,180,94,.12)}
.accbar{margin-top:9px; display:flex; flex-wrap:wrap; gap:6px}
.accbar button{padding:6px 11px; border-radius:9px; cursor:pointer; font-size:1rem;
  background:linear-gradient(180deg,#1a2130,#131824); border:1px solid var(--line); color:var(--gold2)}
.accbar button:active{transform:scale(.94)}
.built{min-height:52px; padding:11px 12px; border-radius:12px; border:1px dashed var(--line2);
  background:rgba(0,0,0,.25); margin-bottom:11px; line-height:2.3}
.built .ph{color:var(--faint); font-size:.8rem}
.bank{line-height:2.4}
.tok{display:inline-block; margin:0 6px 7px 0; padding:7px 13px; border-radius:10px; cursor:pointer;
  font-family:'Cormorant Garamond',Georgia,serif; font-size:1.06rem; color:var(--ink);
  background:linear-gradient(180deg,#1a2130,#131824); border:1px solid var(--line2); transition:.13s}
.tok:hover{border-color:var(--gold); transform:translateY(-1px)}
.tok:active{transform:scale(.95)}
.tok.on{border-color:rgba(217,180,94,.6); color:var(--gold2)}
.tok.spent{opacity:.22; pointer-events:none}
.aff{margin-top:5px; font-size:.6rem; letter-spacing:.12em}
.aff .pip{color:#3f4659; margin-right:1px}
.aff .pip.on{color:var(--red); text-shadow:0 0 7px rgba(216,87,79,.6)}
.aff .afftxt{color:var(--gold); margin-left:6px; font-size:.58rem; letter-spacing:.1em}
.npcrow{display:flex; align-items:center; gap:11px; padding:10px 12px; margin-bottom:8px;
  border-radius:12px; background:linear-gradient(180deg,var(--panel2),var(--panel)); border:1px solid var(--line)}
.npcrow img{width:32px; height:32px}
.npcname{flex:1; font-size:.84rem; font-weight:600}
.npcname small{display:block; font-family:'Cormorant Garamond',Georgia,serif; font-style:italic;
  font-size:.8rem; color:var(--faint); font-weight:400}
.toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(18px); opacity:0;
       background:linear-gradient(180deg,#1d2434,#151a26); border:1px solid var(--line2);
       padding:10px 18px; border-radius:11px; font-size:.8rem; transition:.28s; pointer-events:none; z-index:50}
.toast.on{opacity:1; transform:translateX(-50%) translateY(0)}
.credit{margin-top:30px; text-align:center; color:#39425a; font-size:.62rem; letter-spacing:.06em; line-height:1.8}
</style>
</head>
<body>

<div class="hud">
  <span class="lv" id="lv">Lv 1</span>
  <span class="hearts" id="hp"></span>
  <span class="stat coin" id="coin"></span>
  <span class="stat lootn" id="lootN"></span>
  <span class="sp"></span>
  <a href="dashboard.html">← 指揮中心</a>
</div>
<div class="xpwrap"><i id="xpbar" style="width:0%"></i></div>

<div class="wrap"><div id="view"></div></div>
<div class="toast" id="toast"></div>

<script src="tts_reader.js"></script>
<script src="questions.js"></script>
<script src="sentences.js"></script>
<script src="chunks.js"></script>
<script src="gram_rules.js"></script>
<script src="situations.js"></script>
<script src="story.js"></script>
<script>
/* ── 素材（Kenney Tiny Dungeon／Interface Sounds，CC0）────────── */
var T = 'assets/game/tiles/tile_';
/* ⚠️ Tiny Dungeon 這組沒有心形／金幣圖塊，硬挑會挑到箱子跟盾牌。
   ⭐ 所以分工：**遊戲世界（敵人、英雄、場景、道具）用像素圖，HUD 介面用向量圖**。 */
var V = {
  heart:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-8-5.2-8-11a4.6 4.6 0 018-3 4.6 4.6 0 018 3c0 5.8-8 11-8 11z"/></svg>',
  coin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="8"/><path d="M12 7.4v9.2M9.7 9.8h4a1.7 1.7 0 010 3.4h-2.8a1.7 1.7 0 000 3.4h4" stroke-linecap="round"/></svg>',
  card:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="7" y="4" width="11" height="15" rx="2"/><path d="M4.6 7.2v9.6a2 2 0 001.5 1.9" stroke-linecap="round"/></svg>',
};
var SP = {
  card:T+'0066.png',
  sword:T+'0104.png', chest:T+'0089.png', potion:T+'0114.png',

}

/* ── 非戰鬥節點 ─────────────────────────────────────────── */
function enter(key,type){
  var r=S.run;
  if(type==='chest'){
    var c=lootCard(S); r.cleared[key]=1; r.coin+=5;
    if(c){ r.loot.push(c); (S.cards=S.cards||{})[c.key]={last:Date.now()}; }
    save(S); renderHud(); sfx('drop_002');
    document.getElementById('view').innerHTML='<div class="loot"><h3>COFFRE</h3>'+
      (c?cardHtml(c)+'<div class="fb">收進戰利品，也進了你的複習卡庫</div>':'<div class="fb">裡面是 5 枚金幣</div>')+
      '<button class="next" onclick="advance()">繼續前進</button></div>';
    return;
  }
  if(type==='shop'){
    r.cleared[key]=1; save(S); renderHud(); sfx('switch_002');
    S.shopKey = key;
    document.getElementById('view').innerHTML='<div class="loot"><h3>MARCHAND</h3>'+
      '<div class="fb">「要買點什麼嗎？」</div>'+
      '<div class="cmds" style="margin-top:12px">'+
        '<button class="cmd" onclick="buy(\'potion\')" '+(r.coin<10?'disabled':'')+'>'+img(SP.potion)+
          '<span>買藥水<small>10 金幣 · 回一顆心</small></span></button>'+
        '<button class="cmd" onclick="buy(\'heal\')" '+(r.coin<6?'disabled':'')+'><span style="color:var(--red);width:22px">'+V.heart+'</span>'
          '<span>就地休息<small>6 金幣 · 立刻回一顆心</small></span></button>'+
      '</div><button class="next" onclick="advance()">離開</button></div>';
    return;
  }
  if(type==='npc'){ return meetNpc(key); }
  var isBoss=type==='boss', qs;
  if(isBoss) qs=BOSS.qs; else qs=shuffle(MAP.pool).slice(0, type==='elite'?3:2);
  if(!qs.length){ r.cleared[key]=1; save(S); advance(); return; }
  B={ key:key, type:type, isBoss:isBoss, qs:qs, i:0, combo:0,
      maxHp:isBoss?4:(type==='elite'?3:2), hp:isBoss?4:(type==='elite'?3:2),
      sprite:isBoss?BOSS.sprite:pick(MONSTERS),
      name:isBoss?BOSS.name:pick(FOE_NAMES),
      title:isBoss?BOSS.title:(type==='elite'?'精英':''),
      line:isBoss?bossLine(BOSS.lesson):null, topic:(isBoss?BOSS.topic:null), phase:'intro' };
  sfx(isBoss?'bong_001':'switch_002');
  renderBattle('<b>'+esc(B.name)+'</b> 擋住了去路！');
}
function buy(what){
  var r=S.run, lv=lvOf(S.xp);
  if(what==='potion'&&r.coin>=10){ r.coin-=10; r.potion=(r.potion||0)+1; sfx('confirmation_001'); toast('買了一瓶藥水'); }
  else if(what==='heal'&&r.coin>=6){ r.coin-=6; r.hp=Math.min(maxHpOf(lv),r.hp+1); sfx('glass_002'); toast('回復一顆心'); }
  save(S); renderHud();
  /* ⚠️ BUG 修正：原本這裡呼叫 enter(null,'shopRefresh')，
     那個 type 不在任何分支裡 → 直接掉進一場 key=null 的戰鬥（Owen 的紀錄裡就有一個 null 節點）。
     ⭐ 改成重畫商人畫面就好。 */
  enter(S.shopKey, 'shop');
}

/* ── 街坊遭遇 ───────────────────────────────────────────── */
var N=null;
function meetNpc(key, sitForced, lineForced, textForced){
  var pool=npcPool();
  if(!pool.length && !sitForced){ S.run.cleared[key]=1; save(S); return advance(); }
  S.npc=S.npc||{};
  var sorted=pool.slice().sort(function(a,b){
    var aa=(S.npc[a.id]||{}).aff||0, bb=(S.npc[b.id]||{}).aff||0;
    if(aa===0&&bb>0) return 1; if(bb===0&&aa>0) return -1;
    return aa-bb;
  });
  var sit=sitForced || sorted[Math.floor(rnd()*Math.min(3,sorted.length))];
  var rec=S.npc[sit.id]||{aff:0,met:0,last:0};
  var days = rec.last ? Math.floor((Date.now()-rec.last)/864e5) : -1;
  var who=whoOf(sit);
  N={ key:key, sit:sit, rec:rec, who:who, sprite:NPC_SPRITES[who.s % NPC_SPRITES.length],
      qs:shuffle(BANK.filter(function(q){ return q.type==='choose'&&q.opts&&(sit.topics||[]).indexOf(q.topic)>=0; })).slice(0,2),
      i:0, gained:0, line:lineForced||npcLine(sit,rec.aff||0), story:(key==='story') };
  sfx('switch_002');
  var lv=affLv(rec.aff||0);
  var hello = textForced ? esc(textForced)
            : rec.met ? (days>=3 ? '「Ça fait longtemps！」'+esc(who.n)+'看起來很高興你又來了。'
                                 : esc(who.n)+'認出你了。'+lv.note+'。')
                      : esc(who.r)+' '+esc(who.n)+' 站在那裡。他還不認識你。';
  document.getElementById('view').innerHTML =
    '<div class="scene" style="--wall:url('+SP.wall+'); --floor:url('+SP.ground+')">'+
      '<div class="foename"><div class="n">'+esc(who.n)+'　<span style="color:var(--dim);font-size:.72rem;font-weight:400">'+esc(who.r)+'</span></div>'+
        '<div class="t">'+esc(sit.fr)+'</div>'+
        '<div class="aff">'+affPips(rec.aff||0)+'</div></div>'+
      '<div class="foe">'+img(N.sprite)+'</div>'+
      '<div class="hero">'+img(SP.hero)+'</div>'+
    '</div>'+
    '<div class="box"><div class="talk" id="talk"></div><div id="panel"></div></div>';
  type(hello, npcCmds);
}
function affPips(a){
  var lv=affLv(a), idx=AFF_LV.indexOf(lv), out='';
  for(var i=0;i<AFF_LV.length-1;i++) out+='<span class="pip'+(i<idx?' on':'')+'">♥</span>';
  return out+'<span class="afftxt">'+lv.name+'</span>';
}
function npcCmds(){
  var panel=document.getElementById('panel'); if(!panel) return;
  panel.innerHTML='<div class="cmds">'+
    '<button class="cmd" onclick="npcTalk()">'+img(SP.card)+'<span>聊兩句<small>答對就更熟一點</small></span></button>'+
    (N.line?'<button class="cmd" onclick="npcListen()">'+img(SP.wand)+'<span>聽他說<small>他會用法文說一句</small></span></button>':'')+
    '<button class="cmd" onclick="npcLeave()">'+img(SP.shield)+'<span>道別<small>'+(N.story?'回主線':'回到地圖')+'</small></span></button>'+
    (N.story?'<button class="cmd" onclick="storySkip()">'+img(SP.skull)+'<span>這段跳過<small>不擋你，照樣前進</small></span></button>':'')+
  '</div>';
}
function npcListen(){
  sfx('click_001');
  document.getElementById('panel').innerHTML='<div class="talk"><span class="fr">« '+esc(N.line.fr)+' »</span>'+
    '<div class="zh">'+esc(N.line.zh)+'</div></div>'+
    '<div class="fb">'+((N.rec.aff||0)>=8 ? '他用 <b>tu</b> 跟你講話了——法文裡這是關係變近的訊號。'
                                          : '他用 <b>vous</b> 跟你講話——還在客氣的距離。')+'</div>'+

function npcTalk(){
  sfx('click_001');

  document.getElementById('panel').innerHTML='<div class="q">'+esc(q.q)+
      (q.hint?'<span class="hint">提示：'+esc(q.hint)+'</span>':'')+'</div>'+

      return '<button class="opt" data-o="'+esc(o)+'">'+esc(o)+'</button>'; }).join('')+'</div>';

function npcResolve(btn,q){
  var ok=btn.dataset.o===q.a;
  Array.prototype.forEach.call(document.querySelectorAll('#opts .opt'),function(x){
    x.disabled=true; if(x.dataset.o===q.a) x.classList.add('ok'); else if(x===btn) x.classList.add('no');
  });
  if(ok){ N.gained+=2; S.xp=(S.xp||0)+4; sfx('confirmation_001'); }
  else { S.xp=(S.xp||0)+1; sfx('error_004'); }   /* 聊天答錯不扣血：這裡是社交不是戰鬥 */
  save(S); renderHud();
  document.getElementById('panel').innerHTML='<div class="fb">'+
    (ok?'<b style="color:var(--green)">他聽懂了，點點頭</b>':'<b style="color:var(--red)">他愣了一下</b>　正解：<b>'+esc(q.a)+'</b>')+
    (q.aNote?'<br>'+q.aNote:'')+'</div>'+
    '<button class="next" onclick="npcNext()">'+(N.i>=N.qs.length-1?'結束對話':'再聊一句')+'</button>';
}
function npcNext(){ sfx('click_001'); N.i++; if(N.i>=N.qs.length) npcDone(); else npcTalk(); }
function npcDone(){
  var rec=S.npc[N.sit.id]||{aff:0,met:0};
  var before=affLv(rec.aff||0), idxB=AFF_LV.indexOf(before);
  rec.aff=(rec.aff||0)+N.gained; rec.met=(rec.met||0)+1; rec.last=Date.now();
  rec.name=N.who.n; rec.role=N.who.r; rec.fr=N.sit.fr; rec.sprite=N.sprite;
  S.npc[N.sit.id]=rec; S.run.cleared[N.key]=1;
  var after=affLv(rec.aff), idxA=AFF_LV.indexOf(after), up=idxA>idxB, gift=null;
  if(up){ sfx('maximize_001');
    if(idxA>=2){ gift=lootCard(S,(N.sit.lessons||[])[0]);
      if(gift){ S.run.loot.push(gift); (S.cards=S.cards||{})[gift.key]={last:Date.now()}; } }
    else { S.run.potion=(S.run.potion||0)+1; }
  }
  save(S); renderHud();
  document.getElementById('view').innerHTML=
    '<div class="loot"><h3>'+(up?'RELATION APPROFONDIE':'À BIENTÔT')+'</h3>'+
    '<div class="fb" style="text-align:center">'+esc(N.who.n)+'　<span class="aff">'+affPips(rec.aff)+'</span></div>'+
    (up?'<div class="fb" style="text-align:center;color:var(--gold2)">★ 關係進展到「'+after.name+'」——'+after.note+'</div>':'')+
    (gift?'<div style="margin-top:10px">'+cardHtml(gift)+'<div class="fb">他送了你一句話</div></div>'
         :(up?'<div class="fb" style="text-align:center">他塞給你一瓶藥水</div>':''))+
    '<button class="next" onclick="advance()">繼續前進</button></div>';
}
function npcLeave(){ sfx('click_001'); S.run.cleared[N.key]=1; save(S); advance(); }

/* ── 戰鬥畫面（場景 ＋ 對白 ＋ 指令）───────────────────────── */
function sceneHtml(){
  return '<div class="scene" style="--wall:url('+SP.wall+'); --floor:url('+SP.ground+')">'+
    '<div class="foename"><div class="n">'+esc(B.name)+'</div>'+
      (B.title?'<div class="t">'+esc(B.title)+'</div>':'')+
      '<div class="fbar"><i id="fbar" style="width:'+Math.round(B.hp/B.maxHp*100)+'%"></i></div></div>'+
    '<div class="foe" id="foe">'+img(B.sprite)+'</div>'+
    '<div class="hero" id="hero">'+img(SP.hero)+'</div>'+
  '</div>';
}
function renderBattle(text){
  if(B.forceMove && !B.forced){ B.forced=1; }
  document.getElementById('view').innerHTML = sceneHtml()+'<div class="box"><div class="talk" id="talk"></div><div id="panel"></div></div>';
  type(text, showCmds);
}
/* 打字機：⭐ RPG 的敘事節奏，⛔ 不是一次把字倒出來 */
function type(html, done){
  var el=document.getElementById('talk'); if(!el){ if(done)done(); return; }
  var plain=html.replace(/<[^>]+>/g,''), i=0;
  el.innerHTML='';
  var t=setInterval(function(){
    i++; el.innerHTML=esc(plain.slice(0,i))+'<span class="cursor">▍</span>';
    if(i>=plain.length){ clearInterval(t); el.innerHTML=html; if(done) done(); }
  }, 22);
}
function showCmds(){
  var r=S.run, panel=document.getElementById('panel'); if(!panel) return;
  var ls=recentLessons(4);
  if(B.forceMove && !B.forcedShown){    /* 考驗節點：開場就推薦最重的招（⛔ 但不強制，降級鍵還在） */
    B.forcedShown=1;
  }
  var btns=['hit','heavy','blast','chant'].map(function(k){
    var m=MOVES[k], n=movePool(ls,m.type).length;
    if(!n) return '';
    return '<button class="cmd" onclick="useMove(\''+k+'\')">'+img(k==='chant'?SP.wand:(k==='blast'?SP.potion:SP.sword))+
      '<span>'+m.name+' <span style="color:var(--gold);font-size:.72rem">×'+m.dmg+'</span>'+
      '<small>'+m.why+'　'+m.sec+'</small></span></button>';
  }).join('');
  panel.innerHTML='<div class="cmds">'+btns+'</div>'+
   '<div class="cmds" style="margin-top:9px">'+
    '<button class="cmd" onclick="usePotion()" '+((r.potion||0)<1?'disabled':'')+'>'+img(SP.potion)+
      '<span>喝藥水<small>剩 '+(r.potion||0)+' 瓶</small></span></button>'+
    (B.line?'<button class="cmd" onclick="listen()">'+img(SP.card)+'<span>聽牠說<small>法文台詞</small></span></button>'
           :'<button class="cmd" onclick="defend()">'+img(SP.shield)+'<span>觀察<small>看弱點</small></span></button>')+
    (B.story?'<button class="cmd" onclick="storySkip()">'+img(SP.skull)+'<span>這段跳過<small>不擋你，照樣前進</small></span></button>'
            :'<button class="cmd" onclick="flee()">'+img(SP.skull)+'<span>撤退<small>回地圖，不損失</small></span></button>')+
  '</div>';
}
/* 選了招式 → 抽那個題型的題目（⛔ 不重複抽剛做過的） */
function useMove(k){
  sfx('click_001');
  var m=MOVES[k], ls=recentLessons(4);
  /* ⚠️ 主線節點有指定 topic 時要先用它的題 ——
     否則第 1 章（自我介紹）會跑出第 29 課的量詞題，劇情跟練習就脫節了（09-12 實測踩到）。
     ⭐ 該 topic 沒有這種題型時才退回最近四課，⛔ 不要因此讓玩家卡住。 */
  var pool=[];
  if(B && B.topic){
    pool=BANK.filter(function(q){
      if(q.topic!==B.topic || q.type!==m.type) return false;
      if(m.type==='choose'||m.type==='gender') return q.opts && q.opts.length>=2;
      return typeof q.a==='string' && q.a.length>1 && q.a.indexOf('|')<0;
    });
  }
  if(!pool.length) pool=movePool(ls,m.type);
  var fresh=pool.filter(function(q){ return (B.used||[]).indexOf(q.q)<0; });
  if(fresh.length) pool=fresh;
  var q=pool[Math.floor(Math.random()*pool.length)];
  B.used=(B.used||[]).concat([q.q]); B.move=m;
  if(m.type==='choose'||m.type==='gender') return askChoice(q,m);
  return askType(q,m);
}
function listen(){
  sfx('click_001');
  if(B.line){ say(B.line.fr);
    document.getElementById('panel').innerHTML='<div class="talk"><span class="fr">« '+esc(B.line.fr)+' »</span>'+
      '<div class="zh">'+esc(B.line.zh)+'</div></div><button class="next" onclick="showCmds()">回到指令</button>'; }
}
function defend(){
  sfx('click_001');
  var w=(typeof GRAM_POINTS!=='undefined'&&B.isBoss)?identityOf(BOSS.topic,BOSS.lesson).fr:'';
  document.getElementById('panel').innerHTML='<div class="fb">牠的弱點是<b>'+esc(B.isBoss?BOSS.name:'第 '+recentLessons(1)[0]+' 課的內容')+'</b>'+
    (w?'（'+esc(w)+'）':'')+'</div><button class="next" onclick="showCmds()">回到指令</button>';
}
function usePotion(){
  var r=S.run, lv=lvOf(S.xp);
  if((r.potion||0)<1) return;
  r.potion--; r.hp=Math.min(maxHpOf(lv),r.hp+1); save(S); renderHud(); sfx('glass_002');
  type('你喝下藥水，恢復了一顆心。', showCmds);
}
/* ⚠️ BUG 修正（2026-09-12，Owen 實測踩到）：撤退**不算通關**。
   原本這裡直接標 cleared，導致關主格子打勾、地圖顯示「守護者已倒下」，
   但圖鑑是空的、經驗值也沒進——⛔ 逃走就是逃走，那一格要留在原地。 */
function flee(){
  sfx('click_001');
  S.run.fled = S.run.fled || {}; S.run.fled[B.key] = 1;
  save(S); renderMap(); window.scrollTo({top:0,behavior:'smooth'});
  toast('你退開了，牠還站在那裡');
}

function attack(){ return useMove('hit'); }
function askChoice(q,m){
  B.curQ=q; B.curM=m;
  document.getElementById('panel').innerHTML='<div class="q">'+esc(q.q)+
      (q.hint?'<span class="hint">提示：'+esc(q.hint)+'</span>':'')+'</div>'+
    '<div class="opts" id="opts">'+shuffle(q.opts).map(function(o){
        return '<button class="opt" data-o="'+esc(o)+'">'+esc(o)+'</button>'; }).join('')+'</div>';
  Array.prototype.forEach.call(document.querySelectorAll('#opts .opt'),function(btn){
    btn.addEventListener('click',function(){ resolveChoice(btn,q,m); });
  });
}
/* ⚠️ 2026-09-12：改寫招式時，舊的 resolve() 被我連同點詞塊那一段刪掉了，
   造成**選擇題點了完全沒反應**（實測抓到：怪物血量不動、按鈕也不 disable）。
   ⭐ 現在統一走 resolveMove()，選擇題就是傷害 ×1 的普通攻擊。 */
function resolveChoice(btn,q,m){
  var ok=btn.dataset.o===q.a;
  Array.prototype.forEach.call(document.querySelectorAll('#opts .opt'),function(x){
    x.disabled=true;
    if(x.dataset.o===q.a) x.classList.add('ok');
    else if(x===btn) x.classList.add('no');
  });
  resolveMove(ok, ok, q, m||MOVES.hit, false);
}

/* ── 大招／詠唱：自己打出來 ─────────────────────────────────
   ⚠️ 2026-09-12 Owen：「打字 ok 不用像 duolinguo 那樣選字 不夠扎實」
     → ⛔ 拿掉點詞塊，改成真的打。但把三個防挫折機制做滿：
       ① 重音不計較（少 é 算對，只提醒正確寫法）
       ② 答錯可以再試一次，第二次答對給**安慰獎**（半傷害，⛔ 不扣血）
       ③ 連續答對有補償（傷害加成、金幣加成、連 5 回一顆心）
       ④ 隨時可以「改用普通攻擊」降級，⛔ 不扣血不羞辱
   ──────────────────────────────────────────────────────────── */
var ACCENTS=['é','è','ê','à','â','ç','ù','û','î','ï','ô','œ'];
function askType(q,m){
  B.curQ=q; B.curM=m; B.retrying=false;
  var panel=document.getElementById('panel');
  panel.innerHTML='<div class="q">'+esc(q.q)+
      (q.hint?'<span class="hint">提示：'+esc(q.hint)+'</span>':'')+'</div>'+
    '<input class="ans" id="ansBox" autocomplete="off" autocorrect="off" autocapitalize="none" '+
      'spellcheck="false" placeholder="'+(m.type==='trans'?'把整句打出來…':'打出答案…')+'">'+
    '<div class="accbar">'+ACCENTS.map(function(a){
      return '<button onclick="ins(\''+a+'\')">'+a+'</button>'; }).join('')+'</div>'+
    '<div id="retry"></div>'+
    '<div class="cmds" style="margin-top:12px">'+
      '<button class="cmd" onclick="typeCheck()">'+img(SP.sword)+'<span>出招<small>'+m.name+' ×'+m.dmg+'</small></span></button>'+
      '<button class="cmd" onclick="buildDown()">'+img(SP.shield)+'<span>改用普通攻擊<small>卡住沒關係，不扣血</small></span></button>'+
    '</div>';
  var box=document.getElementById('ansBox');
  box.focus();
  box.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); typeCheck(); } });
}
function ins(a){
  var box=document.getElementById('ansBox'); if(!box) return;
  var st=box.selectionStart||box.value.length, en=box.selectionEnd||st;
  box.value=box.value.slice(0,st)+a+box.value.slice(en);
  box.selectionStart=box.selectionEnd=st+1; box.focus();
}
function buildDown(){ toast('改用普通攻擊'); useMove('hit'); }   /* ⭐ 卡住的出口 */
function typeCheck(){
  var q=B.curQ, m=B.curM, box=document.getElementById('ansBox');
  var mine=(box?box.value:'').trim();
  if(!mine){ toast('先打點東西再出招'); return; }
  var exact = mine.replace(/\s+/g,' ')===String(q.a).replace(/\s+/g,' ').trim();
  var loose = normAns(mine)===normAns(q.a);      /* 重音／標點／大小寫不計較 */
  if(loose) return resolveMove(true, exact, q, m, B.retrying);
  if(!B.retrying){                                /* ⭐ 第一次錯：再給一次，⛔ 這次不扣血 */
    B.retrying=true; sfx('bong_001');
    var a=String(q.a), peek=a.slice(0, Math.max(1, Math.ceil(a.length*0.25)));
    document.getElementById('retry').innerHTML=
      '<div class="fb" style="color:var(--gold)">還沒中——再試一次（這次不扣血）。開頭是：<b>'+esc(peek)+'…</b></div>';
    if(box){ box.focus(); box.select(); }
    return;
  }
  resolveMove(false, false, q, m, true);
}

/* 傷害數字（⚠️ 2026-09-12：改寫招式時被我連帶刪掉，console 會噴 floatDmg is not defined） */
function floatDmg(txt, mine){
  var scene=document.querySelector('.scene'); if(!scene) return;
  var d=document.createElement('div'); d.className='dmg'+(mine?' you':''); d.textContent=txt;
  scene.appendChild(d); setTimeout(function(){ d.remove(); },950);
}

/* 招式結算：loose＝答對（重音不計較）；exact＝完全一樣；retried＝第二次才對（安慰獎） */
function resolveMove(loose, exact, q, m, retried){
  var hero=document.getElementById('hero'), foe=document.getElementById('foe');
  if(loose){
    B.combo++;
    /* ⭐ 安慰獎：第二次才答對 → 半傷害，但⛔ 不扣血、連擊不歸零、經驗照給
       ⭐ 連擊補償：3 連以上傷害 +1；5 連回一顆心（Owen 09-12 指定） */
    var base = retried ? m.dmg*0.5 : m.dmg;
    var dmg=Math.round((base + (B.combo>=3?1:0))*10)/10;
    if(B.combo===5){
      var lvNow=lvOf(S.xp);
      if(S.run.hp<maxHpOf(lvNow)){ S.run.hp++; toast('5 連擊——喘了一口氣，回復一顆心'); sfx('glass_002'); }
      else { S.run.coin+=10; toast('5 連擊——撿到 10 枚金幣'); }
    }
    hero.classList.add('act'); setTimeout(function(){hero.classList.remove('act');},420);
    setTimeout(function(){
      foe.classList.add('hit'); sfx('confirmation_001'); floatDmg('-'+dmg);
      if(m.dmg>=2){ var f=document.createElement('div'); f.className='flash'; document.body.appendChild(f);
                    setTimeout(function(){f.remove();},320); }
      B.hp=Math.max(0,B.hp-dmg);
      var bar=document.getElementById('fbar'); if(bar) bar.style.width=Math.round(B.hp/B.maxHp*100)+'%';
      setTimeout(function(){ foe.classList.remove('hit'); },340);
    },180);
    S.run.coin+=Math.round(m.dmg*2)+Math.max(0,B.combo-1);   /* 連越多，金幣越多 */
    S.xp=(S.xp||0)+Math.round(m.dmg*6);
  } else {
    B.combo=0;
    setTimeout(function(){
      hero.classList.add('ouch'); sfx('error_004'); floatDmg('-1',true);
      setTimeout(function(){hero.classList.remove('ouch');},360);
    },160);
    S.run.hp=Math.max(0,S.run.hp-1); S.xp=(S.xp||0)+2;
  }
  save(S); renderHud();
  var panel=document.getElementById('panel');
  setTimeout(function(){
    panel.innerHTML='<div class="fb">'+
      (loose ? '<b style="color:var(--green)">'+esc(m.name)+(retried?' 命中（第二次）':' 命中！')+'</b>'+
               (B.combo>1?'　連擊 ×'+B.combo:'')+
               (retried?'<br><span style="color:var(--gold)">想起來了就算數——半個傷害，沒有扣血</span>':'')+
               (exact?'':'<br><span style="color:var(--gold)">⚠️ 重音沒對上，正確寫法：<b>'+esc(q.a)+'</b></span>')
             : '<b style="color:var(--red)">沒組對，被反擊了</b><br>正解：<b>'+esc(q.a)+'</b>')+
      (q.aNote?'<br>'+q.aNote:'')+'</div>'+
      '<button class="next" id="nx">'+(S.run.hp<=0?'你倒下了…':(B.hp<=0?'牠倒下了':'繼續'))+'</button>';
    document.getElementById('nx').addEventListener('click',function(){
      sfx('click_001');
      if(S.run.hp<=0){ S.run.lostCoin=S.run.coin; S.run.coin=0; save(S); renderHud(); renderMap(); return; }
      if(B.hp<=0) return win();
      type(esc(B.name)+' 還站著。', showCmds);
    });
  }, 700);
}

function win(){
  var r=S.run, foe=document.getElementById('foe');
  if(foe) foe.classList.add('die');
  sfx('maximize_001');
  r.cleared[B.key]=1; r.coin+=B.isBoss?20:5;
  S.xp=(S.xp||0)+(B.isBoss?40:12);
  var before=lvOf(S.xp-(B.isBoss?40:12)), after=lvOf(S.xp), levelled=after>before;
  var storyCh = B.story ? curChapter() : null;
  var cards=[]; for(var i=0;i<(B.isBoss?2:1);i++){
    /* ⚠️ 主線關主要掉「那一章」的句子，⛔ 不是今日地城關主那一課的（09-12 實測踩到） */
    var c=lootCard(S, B.story ? ((storyCh&&storyCh.lessons||[])[0]||null) : (B.isBoss?BOSS.lesson:null));
    if(c){ cards.push(c); r.loot.push(c); (S.cards=S.cards||{})[c.key]={last:Date.now()}; }
  }
  if(B.isBoss){
    S.dex=S.dex||{};
    /* ⭐ 主線關主用「章」的身分進圖鑑，⛔ 不要混進今日地城的關主 */
    var dexId = B.story ? ('ch'+(storyCh?storyCh.ch:'?')) : BOSS.id;
    var e=S.dex[dexId]||{wins:0};
    e.wins++; e.last=Date.now();
    e.sprite = B.story ? B.sprite : BOSS.sprite;
    e.name   = B.story ? ('第'+(storyCh?storyCh.ch:'?')+'章 '+(storyCh?storyCh.title:'')) : BOSS.name;
    S.dex[dexId]=e;
  }
  if(levelled){ r.hp=maxHpOf(after); }
  save(S); renderHud();
  setTimeout(function(){
    document.getElementById('view').innerHTML=sceneHtml().replace('<div class="foe"','<div class="foe" style="display:none"')+
      '<div class="box"><div class="loot" style="margin:0;border:none;box-shadow:none;background:none">'+
        '<h3>'+(B.isBoss?'LE GARDIEN EST TOMBÉ':'VICTOIRE')+'</h3>'+
        (levelled?'<div class="fb" style="text-align:center;color:var(--gold2)">★ 升到 Lv '+after+'！體力上限提高了</div>':'')+
        '<div class="fb" style="text-align:center">經驗 +'+(B.isBoss?40:12)+'　金幣 +'+(B.isBoss?20:5)+'</div>'+
        (B.isBoss?'<div class="fb" style="text-align:center">「'+esc(B.story?((storyCh?storyCh.title:'')+' 的關主'):BOSS.name)+'」已收進圖鑑</div>':'')+
        '<div style="margin-top:12px">'+cards.map(cardHtml).join('')+'</div>'+
        '<button class="next" onclick="advance()">'+(B.isBoss?'回營地':'繼續前進')+'</button>'+
      '</div></div>';
  }, 620);
}
function advance(){
  if(S.storyCur) return storyAdvance();          /* 主線模式：回主線推進 */
  var r=S.run;
  if(r.floor<MAP.floors.length-1) r.floor++;
  save(S); renderMap(); window.scrollTo({top:0,behavior:'smooth'});
}
function retreat(){
  var d=load(); d.run=freshRun(lvOf(d.xp||0)); save(d); S=d; MAP=buildMap();
  sfx('confirmation_001'); renderHud(); renderMap(); toast('整裝完畢，再來一次');
}
init();
</script>

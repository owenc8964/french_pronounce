<!--
  tower.html v2 — 植物大戰殭屍型，2026-10-16
  Owen：「遊戲好玩是要有點動腦——小部分動腦＋法文練習，才不會都在玩遊戲，也不會被法文練習困住」
       「這是植物打殭屍嗎？？」「對，照植物大戰殭屍改，兩種題目都要」（＋「單字題四選一」）
  ⭐ 法文＝引擎：☀️ 陽光只能靠答題賺（動詞打字 50＋快 25／四選一 25＋快 10）
  ⭐ 動腦＝策略：花陽光種 🌵射手／🪨石牆／💣炸彈、選哪條路、⚡ 大招什麼時候放
  ⭐ 題目輪替「打字 1：四選一 2」，⛔ 不讓他挑簡單的（feedback_menu_defaults_to_easiest）
  ⭐ 後果在家（掉心），⛔ 不在他身上；⏭ 跳過不記錯；答錯才出中文（feedback_french_only_ui）
  ⛔ 不自創法文：打字題＝questions.js fill（動詞家族、單一空格、純法文）；四選一＝questions.js 法文挖空選擇題
     ＋ chunks.js 筆記句挖掉名詞（錯誤選項＝課次差 8 課以上的同性別名詞；⛔ 排除 aimer／adorer／détester／préférer／voudrais 這類換什麼都通的句子）
  ⚠️ 遊戲進度只存本機 pvz_v1；⭐ 10-17 起作答與時間記進 clb7_game_time、回報記進 clb7_game_reports（game_log.js，有同步）。v1（打字守塔）在 git 歷史 dd4070b
  素材：Kenney Tiny Dungeon（CC0）、俐方體11號（OFL）；植物＝emoji 即時轉像素圖
-->

<script>
'use strict';
function zh(s){ return /[一-鿿]/.test(s); }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function note(s){ return esc(s).replace(/&lt;(\/?)b&gt;/g,'<$1b>'); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function norm(x){ return String(x).toLowerCase().replace(/[’`]/g,"'").replace(/\s+/g,' ').replace(/[.!?。]+$/,'').trim(); }
function deacc(x){ return x.normalize('NFD').replace(/[̀-ͯ]/g,''); }
function sayOf(qq, ans){ return String(qq).replace(/_{2,}(\s*\([^)]*\))?/, ans).replace(/\s*\([^)]*\)\s*$/,'').replace(/\s+/g,' ').trim(); }

/* ============================================================
   題目 A：打字（動詞）— questions.js fill，不規則加權
   ============================================================ */
var VERB=/passe|imparfait|conditionnel|futur|subjonctif|reflexive|(?<!ad)verbs|etre-avoir|imperative|accord-participe|pouvoir|gerondif|condition-si|discours|ilfaut|recit/;
var IRR=/\((être|avoir|aller|faire|venir|pouvoir|vouloir|devoir|savoir|voir|prendre|mettre|dire|lire|écrire|boire|vivre|partir|sortir|connaître|croire|recevoir|tenir|devenir|revenir|comprendre|apprendre|ouvrir|offrir|courir|mourir|naître|falloir|pleuvoir|s.asseoir|suivre|plaire|rire|conduire|dormir|sentir|servir)[^)]*\)/i;
var TYPE=[];
BANK.forEach(function(q,i){
  if(q.type!=='fill' || !VERB.test(q.topic) || zh(q.q) || q.q.length>110) return;
  if((q.q.match(/_{2,}/g)||[]).length!==1) return;
  var alts=String(q.a).split('|').filter(function(a){ return !zh(a); });
  var short=alts.filter(function(a){ return a.split(' ').length<=3; });
  if(!short.length) return;
  TYPE.push({k:'t'+i, kind:'type', q:q.q, alts:alts, show:short.sort(function(a,b){ return a.length-b.length; })[0], zh:q.zh||'', note:q.aNote||'', irr:IRR.test(q.q), topic:q.topic, lesson:q.lesson||0});
});

/* ============================================================
   題目 B：四選一（單字＋短文法）
   ① questions.js：法文挖空、選項全法文、只有一個正解的選擇題
   ② chunks.js：筆記句子挖掉一個學過的名詞（冠詞留著），錯誤選項＝課次差 8 課以上的同性別名詞
   ============================================================ */
var CHOOSE=[];
BANK.forEach(function(q,i){
  if(q.type!=='choose' || !q.opts || q.opts.length<3 || !/_{2,}/.test(q.q) || q.opts.some(zh)) return;
  var stem=q.q.replace(/^「/,'').replace(/」.*$/,'');
  if(zh(stem)) return;
  var alts=String(q.a).split('|'), right=q.opts.filter(function(o){ return alts.indexOf(o)>=0; });
  if(right.length!==1) return;
  /* ⚠️ 11-03 Owen：「答案有在選項嗎？」連連看題有 5 個選項，舊寫法切前 4 個，正解排第 5 就不見了（3 題）→ 正解一定留著 */
  CHOOSE.push({k:'c'+i, kind:'choose', q:stem, right:right[0], opts:[right[0]].concat(q.opts.filter(function(o){ return o!==right[0]; }).slice(0,3)), zh:q.zh||'', note:q.aNote||'', topic:q.topic, lesson:q.lesson||0});
});
var CHOOSE_BANK=CHOOSE.length;
(function(){
  var W='[a-zàâçéèêëîïôûùüÿœæ-]+', re1=new RegExp('^(un|une|le|la)\\s+('+W+')$'), map={}, bad={};
  var EPICENE={dentiste:1,camarade:1,artiste:1,touriste:1,journaliste:1,'élève':1,'collègue':1,enfant:1,'secrétaire':1};
  CHUNKS.forEach(function(c){ var m=String(c.fr||'').trim().match(re1); if(!m) return; var n=m[2], g=/^(une|la)$/.test(m[1])?'f':'m';
    if(map[n]&&map[n].g!==g) bad[n]=1; if(!map[n]) map[n]={n:n,g:g,lesson:c.lesson||0,zh:String(c.zh||'').split(/[（(]/)[0]}; });
  var nouns=Object.keys(map).filter(function(k){ return !bad[k] && !EPICENE[k] && k.length>=3; }).map(function(k){ return map[k]; });
  var PREF=/\b(aim\w*|ador\w*|détest\w*|préf[eè]r\w*|voudrais|veux|voulez|plaît)\b/i;
  CHUNKS.forEach(function(c){
    var s=String(c.fr||'').trim(); if(zh(s) || s.split(' ').length<5 || s.length>85 || /[\/…=()]/.test(s) || PREF.test(s)) return;
    for(var i=0;i<nouns.length;i++){ var N=nouns[i];
      var re=new RegExp("(^|[\\s'’])(le|la|un|une|du|de la|mon|ma|ton|ta|son|sa|ce|cette|notre|votre)\\s+("+N.n.replace(/-/g,'\\-')+")(?=[\\s.,!?;:]|$)",'i');
      if(!re.test(s)) continue;
      var far=nouns.filter(function(o){ return o.g===N.g && o.n!==N.n && Math.abs((o.lesson||0)-(N.lesson||0))>=8; });
      if(far.length<3) return;
      var ds=shuffle(far).slice(0,3).map(function(o){ return o.n; });
      CHOOSE.push({k:'n'+c.id, kind:'choose', q:s.replace(re, function(all,pre,art){ return pre+art+' _____'; }), right:N.n, opts:[N.n].concat(ds), zh:c.zh||'', note:N.n+'＝'+N.zh, topic:'vocab', lesson:N.lesson||0});
      return;
    }
  });
})();

/* 存檔與出題 */
var KEY='pvz_v1';
var S=(function(){ try{ return JSON.parse(localStorage.getItem(KEY))||null; }catch(e){ return null; } })()||{best:0, rec:{}};
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
/* ⚖️ 11-04 紀錄：鐵砧答對 93%、守園只有 31%（打字 26%），Owen 也說「題目特別難」→ 依最近 12 題調整出題範圍（存檔保留，下一場接著算）
   目標大約七到八成：太低就先出早期課次，並減少打字比例；打得好就全範圍。⛔ 不告訴他在調，也不扣東西 */
function towerRate(){ var a=S.recent||[]; if(a.length<4) return .5; return a.reduce(function(x,y){ return x+y; },0)/a.length; }
function towerCap(){ var r=towerRate(); return r<.4?18:(r<.55?30:(r<.72?42:99)); }
function pick(list, lastTopic, irrBoost){
  var now=Date.now(), best=null, bw=-1, cap=towerCap();
  if(towerRate()<.55) irrBoost=false;
  for(var k=0;k<70;k++){ var c=list[Math.floor(Math.random()*list.length)], r=S.rec[c.k], w=1;
    if(!r) w*=1.5; else if(r.w>r.r) w*=3;
    if(irrBoost && c.irr) w*=2.5;
    if(r && now-r.last<10*60000) w*=.1;
    if(c.topic===lastTopic) w*=.25;
    if(c.lesson>cap) w*=.08;
    w*=Math.random()+.3; if(w>bw){ bw=w; best=c; } }
  return best;
}
function rec(c, ok){ var r=S.rec[c.k]||{r:0,w:0,last:0}; r[ok?'r':'w']++; r.last=Date.now(); S.rec[c.k]=r; (S.recent=S.recent||[]).push(ok?1:0); if(S.recent.length>12) S.recent.shift(); save();
  if(GL) GL.answer(ok, {kind:c.kind==='type'?'守園打字':c.kind==='listen'?'守園聽力':'守園四選一', topic:c.topic, q:c.q, a:c.kind==='type'?c.show:c.right, pick:G&&G.q?G.q.pick:'', src:'tower', ref:c.k, ms:G&&G.q?Math.round((clock-G.q.t0)*1000):0}); }
/* 紀錄層（game_log.js）：嵌在小鎮裡就記進小鎮那一筆（⛔ 同一段時間不算兩次），單獨開才自己開一筆 */
var GL=null;
try{ GL=(new URLSearchParams(location.search).get('embed')==='1' && parent!==window && parent.GameLog) ? parent.GameLog : (window.GameLog||null); }catch(e){ GL=window.GameLog||null; }
if(GL && GL===window.GameLog) GL.start('tower');
else if(GL){ ['pointerdown','keydown'].forEach(function(ev){ window.addEventListener(ev, function(){ GL.ping(); }, {passive:true, capture:true}); }); }
/* 🚩 回報：c.k＝t＋BANK 第幾題（打字）／c＋BANK 第幾題（四選一）／n＋chunks id（筆記句挖名詞） */
function repHtml(c){ return window.GameLog ? '<div>'+GameLog.repBtn({src:'tower', kind:c.kind, ref:c.k, q:c.q, a:c.kind==='type'?c.alts.join('|'):c.right, pick:G&&G.q?G.q.pick:''})+'</div>' : ''; }

/* ============================================================
   像素圖（同 town.html：emoji → 20×20、PICO-8 32 色、外框）
   ============================================================ */
var PAL=[[0,0,0],[29,43,83],[126,37,83],[0,135,81],[171,82,54],[95,87,79],[194,195,199],[255,241,232],[255,0,77],[255,163,0],[255,236,39],[0,228,54],[41,173,255],[131,118,156],[255,119,168],[255,204,170],
  [41,24,20],[17,29,53],[66,33,54],[18,83,89],[116,47,41],[73,51,59],[162,136,121],[243,239,125],[190,18,80],[255,108,36],[168,231,46],[0,181,67],[6,90,181],[117,70,101],[255,110,89],[255,157,129]];
var PIXC={}, PIXN=20;
function pixURL(em){
  if(PIXC[em]) return PIXC[em];
  try{
    var B=document.createElement('canvas'); B.width=B.height=64; var b=B.getContext('2d');
    b.textAlign='center'; b.textBaseline='middle'; b.font='54px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; b.fillText(em,32,36);
    var N=PIXN, C=document.createElement('canvas'); C.width=C.height=N; var c=C.getContext('2d'); c.imageSmoothingEnabled=true; c.drawImage(B,1,1,N-2,N-2);
    var d=c.getImageData(0,0,N,N), p=d.data, op=new Array(N*N);
    for(var i=0;i<N*N;i++){ var a=p[i*4+3]; op[i]=a>=110;
      if(op[i]){ var r=p[i*4]*255/a, g=p[i*4+1]*255/a, bl=p[i*4+2]*255/a, best=0, bd=1e9;
        for(var k=0;k<PAL.length;k++){ var dr=r-PAL[k][0], dg=g-PAL[k][1], db=bl-PAL[k][2], dd=dr*dr*.3+dg*dg*.59+db*db*.11; if(dd<bd){ bd=dd; best=k; } }
        p[i*4]=PAL[best][0]; p[i*4+1]=PAL[best][1]; p[i*4+2]=PAL[best][2]; p[i*4+3]=255; } }
    for(var j=0;j<N*N;j++){ if(op[j]) continue; var x=j%N, y=(j/N)|0;
      var nb=(x>0&&op[j-1])||(x<N-1&&op[j+1])||(y>0&&op[j-N])||(y<N-1&&op[j+N]);
      if(nb){ p[j*4]=24; p[j*4+1]=20; p[j*4+2]=37; p[j*4+3]=255; } else p[j*4+3]=0; }
    c.putImageData(d,0,0); PIXC[em]=C.toDataURL();
  }catch(e){ PIXC[em]=''; }
  return PIXC[em];
}
var PIXIMG={}; function pixImg(em){ if(!PIXIMG[em]){ var im=new Image(); im.src=pixURL(em); PIXIMG[em]=im; } return PIXIMG[em]; }
var IMG={}; function tile(set,i){ var k=set+i; if(!IMG[k]){ var im=new Image(); im.src='assets/game/'+(set==='t'?'town':'tiles')+'/tile_'+String(i).padStart(4,'0')+'.png'; IMG[k]=im; } return IMG[k]; }

/* ============================================================
   植物、殭屍
   ============================================================ */
var PLANTS={
  shoot:{em:'🌵', name:'射手', cost:50,  hp:5,  desc:'自動射擊'},
  wall: {em:'🪨', name:'石牆', cost:50,  hp:36, desc:'很耐咬'},
  bomb: {em:'💣', name:'炸彈', cost:150, hp:99, desc:'炸周圍九格'},
  /* ⬇️ 11-04 Owen：「更多輪、升級武器、選擇武器、來一波大的衝擊，讓我可以練更多題目，甚至聽力也可以一起」→ 這兩個要在波與波之間選到才有 */
  ice:  {em:'❄️', name:'冰霜', cost:75,  hp:5,  desc:'打到的怪變慢'},
  fire: {em:'🔥', name:'火焰', cost:100, hp:5,  desc:'穿過整條路'}
};
/* 🎁 波與波之間三選一（每局不同的打法）：都只在這一局有效；陽光還是只能靠答題 */
var DRAFT=[

/* ⚠️ 11-02 Owen 10-29：「打字的時候上面玩的螢幕會直接卡到最上方，根本看不到」（那場打字 0／10）
   手機鍵盤一開，iOS 把整個畫面往上推；嵌在小鎮時被推走的是 iframe，iframe 裡面收不到鍵盤事件
   → 跟著「看得到的範圍」放：嵌入時調 iframe 的位置與高度、獨立開時調 #app；畫面縮小後 resize() 會把田重畫到放得下 */
var KBMAX=0;
function fitKeyboard(fake){
  var host=null, pv=null; try{ if(window.parent!==window && window.frameElement){ host=window.frameElement; pv=window.parent.visualViewport; } }catch(e){}
  var vv=fake||(host?pv:window.visualViewport); if(!vv) return;
  if(host){ host.style.top=vv.offsetTop+'px'; host.style.bottom='auto'; host.style.height=vv.height+'px'; if(!fake) try{ window.parent.scrollTo(0,0); }catch(e){} }
  else { var a=document.getElementById('app'); document.body.style.height=vv.height+'px'; if(a) a.style.transform=vv.offsetTop?'translateY('+vv.offsetTop+'px)':''; if(!fake) window.scrollTo(0,0); }
  /* ⚠️ 11-03 Owen：「輸入文字會跑到下面，看不到戰爭過程」→ 鍵盤開著時版面縮緊（植物卡變一行、題目區變薄），田留在上面、輸入框捲進看得到的地方 */
  KBMAX=Math.max(KBMAX, vv.height); var kb=vv.height<KBMAX*.8; document.body.classList.toggle('kb', kb);
  resize();
  var qb=document.getElementById('qbox'); if(kb && qb){ qb.scrollTop=qb.scrollHeight; if(!fake) window.scrollTo(0,0); }
}
(function(){ var vv=null; try{ vv=(window.parent!==window && window.frameElement) ? window.parent.visualViewport : window.visualViewport; }catch(e){ vv=window.visualViewport; }
  if(!vv) return; vv.addEventListener('resize', fitKeyboard); vv.addEventListener('scroll', fitKeyboard);
  window.addEventListener('pagehide', function(){ vv.removeEventListener('resize', fitKeyboard); vv.removeEventListener('scroll', fitKeyboard); }); })();

function newGame(){

     不答題仍守不住（一株只顧得了一條路），答對還是陽光的主要來源 */
  G={wave:1, hearts:3, sun:75, combo:0, maxCombo:0, plants:[], zombies:[], queue:[], spawnT:9, sel:null, star:0, starMode:false,
     rot:0, owned:['shoot','wall','bomb'], cost:{}, aimPlus:0, rateMul:1, starNeed:5, thorn:false, earGun:false, won:false, big:false, lastTopic:null, redo:[], waveMiss:[], kills:0, waveKills:0, earned:0, paused:false, over:false, q:null};

function buildWave(){
  var n=G.wave, list=[], cnt=n===1?5:5+2*n;
  /* 🌊 每 3 波一大波：數量多一半、後段一起湧上來、最後一隻蟹王（守夜不套用，規模由小鎮決定） */
  G.big=!RAID && n%3===0; if(G.big) cnt=Math.round(cnt*1.5);
  for(var i=0;i<cnt;i++){ var r=Math.random(), t='walk';
    if(n>=2 && r<.25+.04*n) t='fast'; if(n>=3 && r>.82-.03*n) t='tank'; list.push(t); }
  if(G.big){ list.push('king'); G.bigStart=Math.floor(list.length*.5); floats.push({x:CW/2, y:CELL*1.4, t:0, txt:'⚠️ 一大波來了！', c:'#ffb36a', big:true}); }
  G.queue=list; G.spawnT=n===1?12:6;
}

function plantCost(k){ return (G&&G.cost&&G.cost[k])||PLANTS[k].cost; }
function renderBar(){
  var bar=document.getElementById('bar'), h='';
  Object.keys(PLANTS).forEach(function(k){ var P=PLANTS[k], cost=plantCost(k); if(G&&G.owned&&G.owned.indexOf(k)<0) return;

    else { G.starMode=false; G.sel = G.sel===k ? null : k; if(G.sel && G.sun<plantCost(k)){ flash('陽光不夠——答題賺 ☀️'); G.sel=null; } }

function flash(t){ floats.push({x:CW/2, y:CH*.45, t:0, txt:t, c:'#fff', big:false}); }

/* 點格子：種植物／放大招 */
cv.addEventListener('pointerdown', function(e){
  e.preventDefault(); if(!G || G.paused || G.over) return;
  var r=cv.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top, col=Math.floor((x-OX)/CELL), row=Math.floor(y/CELL);
  if(row<0||row>=ROWS) return;
  if(G.starMode){ strike(row); return; }
  /* 🎯 點怪物＝鎖定，下一題答對就打牠 */
  var tz=G.zombies.filter(function(z){ return !z.dead && z.row===row && Math.abs(OX+z.x*CELL-x)<CELL*.6; })[0];
  if(tz){ G.aim=tz; if(GL) GL.event('tower_aim'); return; }
  var here=G.plants.filter(function(p){ return p.row===row && p.col===col; })[0];
  if(here){ upgrade(here); return; }
  if(!G.sel){ flash('先點下面要種什麼'); return; }
  if(col<0||col>=COLS-1){ flash('這一格種不了'); return; }
  var P=PLANTS[G.sel], pc=plantCost(G.sel); if(G.sun<pc){ flash('陽光不夠'); G.sel=null; renderBar(); return; }
  G.sun-=pc; G.plants.push({k:G.sel, row:row, col:col, hp:P.hp, cd:.6, fuse:G.sel==='bomb'?.8:0, born:clock});
  if(G.sun<pc) G.sel=null; hud();
});
function upgrade(p){
  var L=UPG[p.k==='ice'||p.k==='fire'?'shoot':p.k], lv=p.lv||0; if(!L){ flash('這個不能升級'); return; }
  var U=L[lv]; if(!U){ flash('已經滿級了'); return; }
  if(G.sun<U.cost){ flash('升級要 ☀️'+U.cost+'——答題賺'); return; }
  G.sun-=U.cost; p.lv=lv+1;
  if(U.hp) p.hp=U.hp; if(U.cd) p.rate=U.cd; if(U.dmg) p.dmg=U.dmg;
  floats.push({x:OX+(p.col+.5)*CELL, y:p.row*CELL+CELL*.4, t:0, txt:'⬆️ '+U.txt, c:'#ffe27a', big:false});
  hud();
}
function strike(row){
  G.star=0; G.starMode=false;
  G.zombies.forEach(function(z){ if(z.row===row && !z.dead){ z.hp-=12; z.hit=.3; } });
  bolts.push({row:row, t:0}); floats.push({x:CW/2, y:row*CELL+CELL*.4, t:0, txt:'⚡ 雷擊！', c:'#e6c8ff', big:true});
  hud();
}

/* 🎧 聽力題：只用課本真人錄音（小鎮載好的那份；Owen 10-16：「聽機器聲沒有什麼幫助」）→ 沒登入過就不出，⛔ 不退回電腦語音 */
function listenHost(){ try{ if(EMBED && parent!==window && parent.CLIPS && parent.CLIPS.length && parent.clipPick && parent.clipPlay) return parent; }catch(e){} return null; }
function listenReady(){ var H=listenHost(); return H && !H.MUTED ? H : null; }   /* 11-09 Owen：守園中遇到靜音，聽力聽不了 → 靜音時不出聽力題 */
function listenQ(){
  var H=listenReady(); if(!H) return null; var c=null, bl=null;
  for(var t=0;t<6&&!bl;t++){ c=H.clipPick(); var ws=(c&&c.blank||[]).filter(function(x){ return x.t==='w'; }); if(ws.length) bl=ws[Math.floor(Math.random()*ws.length)]; }
  if(!bl) return null;
  var seen={}, opts=[bl.w]; seen[bl.w.toLowerCase()]=1;
  shuffle(H.CLIPS).slice(0,80).forEach(function(o){ if(opts.length>=4) return; (o.blank||[]).forEach(function(x){ var k=x.w.toLowerCase(); if(opts.length<4 && x.t==='w' && !seen[k] && Math.abs(x.w.length-bl.w.length)<=3){ seen[k]=1; opts.push(x.w); } }); });
  if(opts.length<3) return null;
  try{ H.S.qlast['L:'+c.id]=Date.now(); }catch(e){}
  return {k:'L:'+c.id, kind:'listen', q:c.text.slice(0,bl.a)+'_____'+c.text.slice(bl.b), right:bl.w, opts:opts, zh:'', note:'', topic:'listen-book', clip:c, row:null};
}
function listenPlay(c){ var H=listenHost(); if(!H||!c.clip) return; try{ var p=H.clipPlay({book:c.clip.book, track:c.clip.track, s:c.clip.s, e:c.clip.e}, 1); if(p&&p.catch) p.catch(function(){}); }catch(e){} }
function listenStop(){ var H=listenHost(); if(H&&H.clipStop) try{ H.clipStop(); }catch(e){} }
function nextQ(){
  if(!G || G.over) return; G.review=false;
  listenStop();
  if(G.rot%5===4){ var lq=listenQ(); if(lq){ G.rot++; G.lastTopic=lq.topic; G.q={c:lq, t0:clock, done:false}; renderQ(); listenPlay(lq); return; } }
  var kind = (G.rot%(towerRate()<.4?4:3)===0) ? 'type' : 'choose'; G.rot++;
  var c=null;
  var due=G.redo.filter(function(r){ return r.after<=0 && r.c.kind===kind; })[0];
  if(due){ c=due.c; G.redo.splice(G.redo.indexOf(due),1); }
  G.redo.forEach(function(r){ r.after--; });
  if(!c) c = kind==='type' ? pick(TYPE, G.lastTopic, true) : pick(CHOOSE, G.lastTopic, false);
  G.lastTopic=c.topic; G.q={c:c, t0:clock, done:false}; renderQ();
}

    box.innerHTML=head+qt+'<div class="accents" id="acc"></div><div class="inrow"><input id="inp" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" lang="fr" enterkeyhint="send" placeholder="打空格裡的字"><button id="go">送出</button></div><div class="fb" id="fb"></div>';

      b.addEventListener('pointerdown', function(e){ e.preventDefault(); var s=inp.selectionStart||inp.value.length, en=inp.selectionEnd||s; inp.value=inp.value.slice(0,s)+ch+inp.value.slice(en); inp.setSelectionRange(s+1,s+1); inp.focus({preventScroll:true}); });
      document.getElementById('acc').appendChild(b); });

    document.getElementById('go').addEventListener('pointerdown', function(e){ e.preventDefault(); answerType(inp.value); });
    setTimeout(function(){ inp.focus({preventScroll:true}); }, 30);
  } else {
    var opts=shuffle(c.opts);
    box.innerHTML=head+qt+'<div class="opts">'+opts.map(function(o,i){ return '<button data-i="'+i+'">'+esc(o)+'</button>'; }).join('')+'</div><div class="fb" id="fb"></div>';
    var ae=document.activeElement; if(ae && ae.blur) ae.blur();
    box.querySelectorAll('.opts button').forEach(function(b){ b.addEventListener('pointerdown', function(e){ e.preventDefault(); answerChoose(opts[+b.dataset.i], b); }); });
  }
  var zb=document.getElementById('zhb'); if(zb) zb.addEventListener('pointerdown', function(e){ e.preventDefault(); var z=document.getElementById('zht'); if(z) z.style.display=z.style.display==='none'?'':'none'; });

    document.getElementById('fb').innerHTML='<span class="why">跳過（不算錯）</span>'; setTimeout(nextQ, 350); });
}
/* 🎯 11-04 依 Habgood & Ainsworth（學習內容要在核心動作裡，不是答完領獎）：答對＝直接射一發，答得快打得重；可以點怪物選目標 */
function aimShot(dmg){
  var z=(G.aim&&!G.aim.dead&&G.zombies.indexOf(G.aim)>=0)?G.aim:null;
  if(!z) G.zombies.forEach(function(q){ if(!q.dead && q.x<COLS+.2 && (!z||q.x<z.x)) z=q; });
  if(!z) return; G.lastRow=z.row; z.hp-=dmg; z.hit=.25; zaps.push({x:OX+z.x*CELL, y:z.row*CELL+CELL*.45, t:0});
  floats.push({x:OX+z.x*CELL, y:z.row*CELL+CELL*.1, t:0, txt:'-'+dmg, c:'#fff', big:true});
}
function reward(base, bonus, fast){
  aimShot((base>=50?3:2)+(fast?1:0)+G.aimPlus);
  G.combo++; G.maxCombo=Math.max(G.maxCombo,G.combo); G.star=Math.min(G.starNeed,G.star+1);
  var sun=base+(fast?bonus:0)+Math.min(20,Math.max(0,G.combo-2)*2);
  G.sun+=sun; G.earned+=sun; totalEarned+=sun;
  floats.push({x:CW*.2, y:CELL*.6, t:0, txt:'☀️+'+sun+(fast?' 快！':''), c:'#ffe27a', big:fast});
  hud(); return sun;
}
/* ⭐ 11-02 Owen 10-29：「打掉怪物沒有加分也很奇怪」。金幣本來就有算（一隻 2🪙，回小鎮才一次給）→ 打倒當下就看得到；
   再給一點陽光（一隻 5，坦克 10）：⚖️ 比一題答對（35–50）少很多，10-21 的平衡還在，不答題仍守不住 */
var KILL_GOLD=2;
function killed(z){
  z.dead=1; z.dt=0; G.kills++; G.waveKills++;
  var sun=z.t==='tank'?10:5; G.sun+=sun;
  var x=OX+z.x*CELL, y=z.row*CELL+CELL*.45;
  floats.push({x:Math.max(CELL*1.2,Math.min(CW-CELL*1.2,x)), y:y-CELL*.3, t:0, txt:(EMBED?'+'+KILL_GOLD+'🪙 ':'')+'☀️+'+sun, c:'#ffe27a', big:false});
  for(var i=0;i<8;i++){ var a=i/8*6.28+Math.random()*.5, v=CELL*(1.2+Math.random()*1.3); puffs.push({x:x, y:y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, t:0}); }
  hud();
}
function miss(c){ G.combo=0; rec(c,false); G.waveMiss.push(c); wrongAll.push(sayOf(c.q, c.kind==='type'?c.show:c.right)); if(c.kind!=='listen') G.redo.push({c:c, after:4}); hud(); }
function wrongFb(c, ans){
  /* ⏸ 11-03 Owen：「答錯讀解釋時可以停下來嗎？」→ 答錯就停住戰場，按「下一題」才繼續 */
  G.review=true;
  var fb=document.getElementById('fb');
  fb.innerHTML='<div class="why">⏸ 戰場停著，看完再按下一題</div>✗ <span class="ans">'+esc(sayOf(c.q,ans))+'</span>'+(c.zh?'　<span class="why">'+esc(c.zh)+'</span>':'')+(c.note?'<div class="why">'+note(c.note)+'</div>':'')+
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-top:4px">'+repHtml(c)+'<button class="skipbtn" id="nx" style="color:var(--gold)">下一題 →</button></div>';
  document.getElementById('nx').addEventListener('pointerdown', function(e){ e.preventDefault(); nextQ(); });
}
function answerType(v){
  var q=G.q; if(q.done || !v.trim()) return; var c=q.c, secs=clock-q.t0, fb=document.getElementById('fb');
  var n=norm(v), res='no';
  c.alts.forEach(function(a){ [a, sayOf(c.q,a)].forEach(function(t){ if(norm(t)===n) res='ok'; else if(res!=='ok' && deacc(norm(t))===deacc(n)) res='accent'; }); });
  q.done=true; q.pick=v.trim(); var inp=document.getElementById('inp'); if(inp) inp.disabled=true;
  if(res!=='no'){ rec(c,true); reward(50,25,res==='ok'&&secs<4);
    fb.innerHTML=(res==='accent'?'✓ 對了——注意重音：<span class="ans">'+esc(c.show)+'</span>':'✓ <span class="ans">'+esc(sayOf(c.q,c.show))+'</span>');
    setTimeout(nextQ, 650);
  } else { miss(c); wrongFb(c, c.show); }
}
function answerChoose(o, btn){
  var q=G.q; if(q.done) return; q.done=true; q.pick=o; var c=q.c, secs=clock-q.t0, fb=document.getElementById('fb'), ok=o===c.right;
  document.querySelectorAll('.opts button').forEach(function(b){ if(b.textContent===c.right) b.classList.add('ok'); });
  if(ok){ rec(c,true); if(c.kind==='listen'){ reward(60,20,secs<7); if(G.earGun) G.zombies.forEach(function(z){ if(!z.dead && z.x<COLS+.2 && z.row===G.lastRow){ z.hp-=3; z.hit=.2; } }); } else reward(35,10,secs<3); fb.innerHTML='✓ <span class="ans">'+esc(sayOf(c.q,c.right))+'</span>'; setTimeout(nextQ, 650); }
  else { btn.classList.add('no'); miss(c); wrongFb(c, c.right); }
}

/* ============================================================
   迴圈
   ============================================================ */
var last=performance.now();
function loop(t){ var dt=Math.min(.05,(t-last)/1000); last=t; clock+=dt; if(G && G.plants && !G.paused && !G.review && !G.over) update(dt); draw(); requestAnimationFrame(loop); }
function update(dt){
  G.spawnT-=dt;
  if(G.queue.length && G.spawnT<=0){ spawnZ(); G.spawnT=(G.wave===1?9:Math.max(2.6, 6.5-.45*G.wave))+Math.random()*1.5; if(G.big && G.queue.length<=G.bigStart) G.spawnT=.9+Math.random()*.9; }
  G.plants.forEach(function(p){
    if(p.k==='shoot'||p.k==='ice'||p.k==='fire'){ p.cd-=dt; var target=G.zombies.some(function(z){ return !z.dead && z.row===p.row && z.x>p.col && z.x<COLS+.2; });
      if(target && p.cd<=0){ p.cd=(p.rate||1.35)*G.rateMul; peas.push({row:p.row, x:p.col+.7, sp:4, dmg:p.dmg||1, k:p.k, seen:[]}); } }
    if(p.k==='bomb'){ p.fuse-=dt; if(p.fuse<=0 && !p.boom){ p.boom=1; p.hp=0;
      G.zombies.forEach(function(z){ if(!z.dead && Math.abs(z.row-p.row)<=1 && Math.abs(z.x-(p.col+.5))<=1.6){ z.hp-=30; z.hit=.3; } });
      floats.push({x:OX+(p.col+.5)*CELL, y:p.row*CELL+CELL*.6, t:0, txt:'💥', c:'#fff', big:true}); } }
  });
  peas.forEach(function(b){ b.x+=b.sp*dt;
    var z=G.zombies.filter(function(z){ return !z.dead && z.row===b.row && Math.abs(z.x-b.x)<.35 && b.seen.indexOf(z)<0; })[0];
    if(z){ z.hp-=b.dmg||1; z.hit=.12; if(b.k==='ice') z.slow=2.5; if(b.k==='fire') b.seen.push(z); else b.dead=1; } if(b.x>COLS+.5) b.dead=1; });
  peas=peas.filter(function(b){ return !b.dead; });
  G.zombies.forEach(function(z){
    if(z.hit>0) z.hit-=dt;
    if(z.dead){ z.dt+=dt; return; }
    if(z.hp<=0){ killed(z); return; }
    var col=Math.floor(z.x-.2), block=G.plants.filter(function(p){ return p.row===z.row && p.col===col && p.hp>0 && p.k!=='bomb'; })[0];
    if(z.slow>0) z.slow-=dt;
    if(block){ z.eat+=dt; if(z.eat>=1){ z.eat=0; block.hp-=1; if(G.thorn && block.k==='wall'){ z.hp-=1; z.hit=.12; } } }
    else z.x-=ZOMB[z.t].sp*dt*(1+.05*(G.wave-1))*(z.slow>0?.5:1);
    if(z.x<-.3){ z.dead=1; z.dt=0; z.reached=1; G.hearts--; floats.push({x:OX*.5+CELL*.2, y:z.row*CELL+CELL*.6, t:0, txt:'💔', c:'#fff', big:true}); hud(); if(G.hearts<=0) gameOver(); }
  });
  G.zombies=G.zombies.filter(function(z){ return !z.dead || z.dt<.5; });
  G.plants=G.plants.filter(function(p){ return p.hp>0; });
  floats.forEach(function(f){ f.t+=dt; }); floats=floats.filter(function(f){ return f.t<1.1; });
  bolts.forEach(function(b){ b.t+=dt; }); bolts=bolts.filter(function(b){ return b.t<.4; });
  zaps.forEach(function(p){ p.t+=dt; }); zaps=zaps.filter(function(p){ return p.t<.22; });
  puffs.forEach(function(p){ p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; }); puffs=puffs.filter(function(p){ return p.t<.45; });
  if(!G.over && !G.queue.length && !G.zombies.some(function(z){ return !z.dead; })) waveEnd();
}
function draw(){
  cx.setTransform(DPR,0,0,DPR,0,0); cx.imageSmoothingEnabled=false;
  cx.fillStyle='#1b2b1f'; cx.fillRect(0,0,CW,CH);
  var home=pixImg('🏡');
  for(var r=0;r<ROWS;r++){ cx.fillStyle=r%2?'#6b5f52':'#74685a'; cx.fillRect(0,r*CELL,OX,CELL); if(home.complete) cx.drawImage(home, OX*.5-CELL*.38, r*CELL+CELL*.12, CELL*.76, CELL*.76); }
  for(var rr=0;rr<ROWS;rr++) for(var c=0;c<COLS;c++){ cx.fillStyle=((rr+c)%2)?'#4c9a4a':'#56a854'; if(c===COLS-1) cx.fillStyle=((rr+c)%2)?'#3f7c3e':'#478a45'; cx.fillRect(OX+c*CELL, rr*CELL, CELL, CELL); }
  if(G && G.sel){ cx.fillStyle='rgba(255,240,180,.10)'; cx.fillRect(OX,0,CELL*(COLS-1),CH); }
  if(G && G.starMode){ for(var s=0;s<ROWS;s++){ cx.strokeStyle='rgba(201,154,240,'+(.4+.3*Math.sin(clock*6))+')'; cx.lineWidth=2; cx.strokeRect(OX+2, s*CELL+2, CELL*COLS-4, CELL-4); } }
  if(!G || !G.plants) return;
  G.plants.forEach(function(p){ var P=PLANTS[p.k], im=pixImg(P.em), x=OX+p.col*CELL, y=p.row*CELL, sq=Math.max(0,.15-(clock-p.born))*2;
    var bob=p.k==='shoot'?Math.sin(clock*4+p.col)*CELL*.03:0;
    if(im.complete) cx.drawImage(im, x+CELL*.1, y+CELL*.08+bob, CELL*.8*(1+sq), CELL*.8*(1-sq));
    if(p.k==='bomb'){ cx.fillStyle='rgba(255,80,40,'+(.25+.25*Math.sin(clock*20))+')'; cx.beginPath(); cx.arc(x+CELL/2,y+CELL/2,CELL*.42,0,7); cx.fill(); }
    for(var lv=0;lv<(p.lv||0);lv++){ cx.fillStyle='#ffe27a'; cx.fillRect(x+CELL*.12+lv*CELL*.16, y+CELL*.06, CELL*.11, CELL*.11); }
    var maxHp=(p.k==='wall'&&p.lv)?UPG.wall[0].hp:P.hp;
    if(p.hp<maxHp && p.k!=='bomb'){ cx.fillStyle='#000'; cx.fillRect(x+CELL*.15,y+CELL*.9,CELL*.7,3); cx.fillStyle='#79d39a'; cx.fillRect(x+CELL*.15,y+CELL*.9,CELL*.7*p.hp/maxHp,3); } });
  peas.forEach(function(b){ cx.fillStyle=b.k==='ice'?'#9fdcff':(b.k==='fire'?'#ff9a4a':'#9be15d'); cx.strokeStyle='#1b3a14'; cx.lineWidth=1.5; cx.beginPath(); cx.arc(OX+b.x*CELL, b.row*CELL+CELL*.42, CELL*.1, 0, 7); cx.fill(); cx.stroke(); });
  G.zombies.slice().sort(function(a,b){ return a.row-b.row; }).forEach(function(z){ var Z=ZOMB[z.t], im=tile(Z.spr[0],Z.spr[1]), x=OX+z.x*CELL, y=z.row*CELL+CELL*.5;
    cx.globalAlpha=z.dead?Math.max(0,1-z.dt/.5):1;
    var hop=z.dead?0:Math.abs(Math.sin((clock-z.born)*(z.t==='fast'?12:6)))*CELL*.06, jx=z.hit>0?(Math.random()-.5)*4:0;
    if(im.complete){ cx.save(); cx.translate(x+jx,y-hop); if(z.t==='king') cx.scale(1.45,1.45); cx.drawImage(im,-CELL*.42,-CELL*.48,CELL*.84,CELL*.84); if(z.hit>0){ cx.globalCompositeOperation='lighter'; cx.globalAlpha*=.6; cx.drawImage(im,-CELL*.42,-CELL*.48,CELL*.84,CELL*.84); } cx.restore(); }
    if(!z.dead && z.hp<z.max){ cx.fillStyle='#000'; cx.fillRect(x-CELL*.35,y-CELL*.52,CELL*.7,3); cx.fillStyle='#e07a6a'; cx.fillRect(x-CELL*.35,y-CELL*.52,CELL*.7*Math.max(0,z.hp)/z.max,3); }
    cx.globalAlpha=1; });
  bolts.forEach(function(b){ cx.fillStyle='rgba(220,190,255,'+(1-b.t/.4)*.7+')'; cx.fillRect(OX, b.row*CELL+CELL*.3, CELL*COLS, CELL*.4); });
  zaps.forEach(function(p){ cx.strokeStyle='rgba(255,226,122,'+(1-p.t/.22)+')'; cx.lineWidth=3; cx.beginPath(); cx.moveTo(OX*.8,p.y); cx.lineTo(p.x,p.y); cx.stroke(); });
  if(G.aim&&!G.aim.dead&&G.zombies.indexOf(G.aim)>=0){ var ax=OX+G.aim.x*CELL, ay=G.aim.row*CELL+CELL*.45; cx.strokeStyle='#ffe27a'; cx.lineWidth=2; cx.beginPath(); cx.arc(ax,ay,CELL*.48+Math.sin(clock*6)*2,0,7); cx.stroke(); }
  puffs.forEach(function(p){ var q=Math.max(0,1-p.t/.45), w=Math.max(2,CELL*.09*q); cx.fillStyle='rgba(255,226,122,'+q+')'; cx.fillRect(p.x-w/2,p.y-w/2,w,w); });
  floats.forEach(function(f){ cx.globalAlpha=Math.max(0,1-f.t/1.1); cx.font=(f.big?'bold ':'')+Math.round(CELL*(f.big?.5:.36))+'px Cubic11, system-ui'; cx.textAlign='center';
    cx.fillStyle='#000'; cx.fillText(f.txt,f.x+1,f.y-f.t*CELL*.8+1); cx.fillStyle=f.c; cx.fillText(f.txt,f.x,f.y-f.t*CELL*.8); });
  cx.globalAlpha=1;
}

/* 結算 */
function openBox(html){ document.getElementById('box').innerHTML=html; document.getElementById('sheet').className='sheet on'; if(G) G.paused=true; }
function closeBox(){ document.getElementById('sheet').className='sheet'; if(G) G.paused=false; }
function missList(){
  var seen={}, out='';
  G.waveMiss.forEach(function(c){ if(seen[c.k]) return; seen[c.k]=1; var ans=c.kind==='type'?c.show:c.right;
    out+='<div class="miss"><span class="ans">'+esc(sayOf(c.q,ans))+'</span>'+(c.zh?'　<span class="muted">'+esc(c.zh)+'</span>':'')+(c.note?'<div class="why">'+note(c.note)+'</div>':'')+'</div>'; });
  return out;
}
function waveEnd(){
  if(EMBED && GOAL && G.wave>=GOAL && !G.won) return victory();
  listenStop();
  var h='<h2>'+ICON+' 第 '+G.wave+' 波守住了</h2><div class="stat"><span>打倒 '+G.waveKills+' 隻</span><span>答題賺 ☀️'+G.earned+'</span><span>最高連對 '+G.maxCombo+'</span></div>';
  h+=G.waveMiss.length?'<div class="muted">這幾句再看一眼（之後還會再出現）：</div>'+missList():'<div class="muted">這一波題目全對 ✨</div>';
  var pool=shuffle(DRAFT.filter(function(d){ return d.ok(); })).slice(0,3);
  var nb=!RAID && (G.wave+1)%3===0;
  h+='<div class="muted" style="margin-top:8px">'+(nb?'⚠️ <b>下一波是一大波，最後還有蟹王。</b>':'下一波：殭屍更多'+(G.wave===1?'，會出現跑得快的蝙蝠':G.wave===2?'，會出現很耐打的盔甲蟹':'')+'。')+'種好的植物會留著'+(G.hearts<3?'，家回 1 顆心':'')+'。</div>';
  if(pool.length) h+='<div class="muted" style="margin-top:8px"><b>選一樣帶進下一波：</b></div><div class="opts" id="draft">'+pool.map(function(d,i){ return '<button data-d="'+i+'">'+d.em+' <b>'+d.t+'</b>　'+d.d+'</button>'; }).join('')+'</div>';
  h+='<div class="row">'+(EMBED?'<button id="wquit" style="margin-right:8px;background:#24362b">回小鎮</button>':'')+'<button id="wnext">'+(pool.length?'都不要，':'')+'下一波 →</button></div>';
  /* ⚠️ 10-21 修（Owen：「第一關轉第二關卡住了，沒辦法繼續也無法跳出」）：
     這顆原本也叫 id="nx"，跟題目區答錯時的「下一題 →」撞名 → getElementById 綁到題目區那顆，結算畫面的按鈕按了沒反應，
     而結算畫面蓋住整個螢幕、左上角的離開也按不到。改名 wnext，嵌在小鎮時另外給一顆「回小鎮」，保證永遠出得去 */
  openBox(h);
  if(EMBED) document.getElementById('wquit').onclick=function(){ G.over=true; backToTown(G.won); };
  function go(){ G.wave++; G.hearts=Math.min(3,G.hearts+1); G.waveMiss=[]; G.waveKills=0; G.earned=0; buildWave(); hud(); closeBox(); }
  document.getElementById('wnext').onclick=go;
  document.querySelectorAll('[data-d]').forEach(function(b){ b.onclick=function(){ var d=pool[+b.dataset.d]; d.go(); if(GL) GL.event('tower_pick_'+d.k); go(); }; });
}
function victory(){
  G.over=true; save();
  var h='<h2>'+ICON+' '+esc(PLACE)+'守住了！</h2><div class="stat"><span>守了 '+G.wave+' 波</span><span>打倒 '+G.kills+' 隻</span><span>答題賺 ☀️'+totalEarned+'</span><span>最高連對 '+G.maxCombo+'</span></div>';
  h+=G.waveMiss.length?'<div class="muted">最後這一波卡住的：</div>'+missList():'<div class="muted">最後一波題目全對 ✨</div>';
  h+='<div class="row"><button id="more" style="margin-right:8px;background:#24362b">繼續守下去</button><button id="home">回小鎮領獎勵 →</button></div>';
  openBox(h); document.getElementById('home').onclick=function(){ backToTown(true); };
  /* 守住之後還想練就繼續，獎勵保留；回小鎮隨時可以 */
  document.getElementById('more').onclick=function(){ G.over=false; G.won=true; if(GL) GL.event('tower_endless'); waveEnd(); };
}
function gameOver(){
  G.over=true; var nb=G.wave>(S.best||0); if(nb) S.best=G.wave; save();
  var h='<h2>🧟 '+(RAID?'怪物衝進鎮上了':'家被攻破了')+'</h2><div class="stat"><span>撐到第 '+G.wave+' 波'+(nb?'　🏆 新紀錄':'')+'</span><span>打倒 '+G.kills+' 隻</span><span>最高連對 '+G.maxCombo+'</span></div>';
  h+=G.waveMiss.length?'<div class="muted">這一波卡住的：</div>'+missList():'';
  h+='<div class="row">'+(EMBED?'<button id="home" style="margin-right:8px;background:#24362b">回小鎮</button>':'')+'<button id="again">再守一次</button></div>';
  openBox(h); document.getElementById('again').onclick=function(){ closeBox(); totalEarned=0; wrongAll=[]; newGame(); };
  if(EMBED) document.getElementById('home').onclick=function(){ backToTown(false); };
}

/* 開場 */
resize(); requestAnimationFrame(loop);
document.getElementById('flag').addEventListener('click', function(e){ e.preventDefault(); if(G) G.paused=true; if(window.GameLog) GameLog.quickReport('tower', (RAID?'守夜':'守園')+'・第 '+(G?G.wave:0)+' 波・陽光 '+(G?G.sun:0)+'・心 '+(G?G.hearts:0)); if(G && document.getElementById('sheet').className.indexOf('on')<0) G.paused=false; });
document.getElementById('back').addEventListener('click', function(e){ if(EMBED){ e.preventDefault(); if(!G||G.over||confirm(RAID?'現在離開，這次守夜就不算了。要回小鎮嗎？':'現在離開，這次守園就不算了。要回小鎮嗎？')) backToTown(false); } });
if(EMBED){
  openBox('<h2>'+ICON+' '+esc(PLACE)+'告急！</h2><div>'+(RAID?'天黑了，史萊姆和蝙蝠趁夜朝鎮上進攻。<b>守住 '+(GOAL||3)+' 波</b>，鎮民的房子就保住了。':'史萊姆要來偷菜了。<b>守住 '+(GOAL||3)+' 波</b>就過關。')+'</div>'+
    '<div class="stat"><span>答題賺 ☀️</span><span>🌵 射手 🪨 石牆 💣 炸彈</span><span>⚡ 連對 5 題放雷擊</span></div>'+
    '<div class="muted">點下面的植物，再點草地格子種下去。🎯 答對會直接射一發，答得快打得重；點怪物可以選目標。⬆️ 點已經種好的 🌵／🪨 可以花陽光升級。答錯時戰場會停住，看完解釋再繼續。⏭ 跳過不算錯。</div><div class="row"><button id="start">'+(RAID?'開始守夜':'開始守園')+'</button></div>');
  document.getElementById('start').onclick=function(){ closeBox(); newGame(); };
} else
openBox('<h2>🌻 守園</h2><div>殭屍從右邊一路走向你的家。<br><b>答題賺 ☀️ 陽光</b>，再用陽光在草地上種東西擋住牠們。</div>'+
  '<div class="stat"><span>✍️ 打字題 ☀️50</span><span>🔤 四選一 ☀️35</span><span>答得快、連對＝更多 ☀️</span></div>'+
  '<div class="stat"><span>🌵 射手：自動射擊</span><span>🪨 石牆：擋住牠們</span><span>💣 炸彈：炸周圍九格</span><span>⚡ 連對 5 題：選一條路雷擊</span></div>'+
  '<div class="muted">點下面的植物，再點草地上的格子就種下去。🎯 答對會直接射一發，答得快打得重；點怪物可以選目標。⬆️ 點已經種好的 🌵／🪨 可以花陽光升級。題目照「打字 1 題、四選一 2 題」輪流出；⏭ 跳過不算錯。'+(S.best?'<br>最高紀錄：第 '+S.best+' 波':'')+'</div><div class="row"><button id="start">開始</button></div>');
document.getElementById('start').onclick=function(){ closeBox(); newGame(); };
</script>

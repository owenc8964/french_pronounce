  town.html — 走動型學習遊戲樣本 v2，2026-10-15
  依據：research/2026-10-14_走動型學習遊戲怎麼設計.md
  v1（10-14）Owen 回饋：「移動起來很不順暢，不像玩電動那樣移動」「人是一個人像在移動，頁面非常短」
                       「只是在其中動來動去而已，玩的目的很不明確，不知道終點會是什麼」
  → v2：畫布引擎（60fps、拖曳搖桿／方向鍵、鏡頭跟隨、全螢幕、像素素材、霧）＋三層目標
        （這一趟＝任務＋金色箭頭／這一區＝修橋開新區／整局＝重建小鎮＋背後的謎，Owen 10-15 選 A＋B）。
  ⭐ 房子的星星只認「站穩」：同一題（或同一個字）在不同的兩天都答對才算——鎮長大＝你長大（鏡子）。
  ⭐ 答錯照樣收、變瑕疵品；回城跳「這一趟的回顧」（錯在哪、為什麼、依手滑／自動化／概念三類給建議與正確整句、連發）。
  ⭐ 三層跳過：繞過（每個遭遇）／回城（整趟）／收工（今天）；蓋房子的那句「寫下來」也可以不寫。
  ⚠️ 原創法文（Owen 10-14 同意，無限城例外）：老鼠的「Le rat l'a pris／prise !」與第一章三張紙條，只用已學句型。其餘題目全出自 questions.js／chunks.js。
  ⚠️ 樣本：只存本機 town_sample_v2（不接同步、不寫 clb7_*）；只「讀」clb7_gram_stage／clb7_gender_seen 判斷錯誤類型。
  素材：Kenney「Tiny Town」「Tiny Dungeon」（CC0）。
-->

<script>
'use strict';
/* ============================================================
   資料：題目池（全部出自 questions.js；依「處理什麼資訊」分家，跟研究檔第五節同一張表）
   ============================================================ */
var FAM = {
  verb: /passe|imparfait|conditionnel|futur|subjonctif|reflexive|verbs|etre-avoir|imperative|accord-participe|pouvoir|gerondif|condition-si|discours|ilfaut|recit/,
  pron: /pronom|qui-que|on-vs-nous|cod/,
  noun: /article|adjective|demonstrative-adj|possessives|tout-chaque|comparaison|superlatif|cest-il|mise-en-relief|intensite/
};
function famOf(topic){ for(var k in FAM) if(FAM[k].test(topic)) return k; return null; }
var POOL = { verb:{choose:[],fill:[]}, pron:{choose:[],fill:[]}, noun:{choose:[],fill:[]} };
BANK.forEach(function(q, i){
  q._i = i;
  var f = famOf(q.topic); if(!f) return;
  /* 路上只出「法文句子」題：有空格，或選項本身是法文；⛔ 選項是中文的規則概念題不出（memory feedback_gram3_textbook_style） */
  var zh=function(x){ return /[\u4e00-\u9fff]/.test(x); };
  if(q.type==='choose' && q.opts && q.opts.length>=2 && (/_{2,}/.test(q.q) || !q.opts.some(zh))) POOL[f].choose.push(q);
  if(q.type==='fill') POOL[f].fill.push(q);
});

/* 陰陽性字庫：跟 quest.html 的 genderPool 同一個抽法（chunks.js「un／une／le／la＋單字名詞」與「l'… (m.)／(f.)」） */
var EMO={chien:'🐕',chat:'🐈',cheval:'🐎',lapin:'🐇',poisson:'🐟',poule:'🐔',vache:'🐄',canard:'🦆',renard:'🦊',loup:'🐺',lion:'🦁',rat:'🐀',
  pomme:'🍎',fraise:'🍓',banane:'🍌',orange:'🍊',citron:'🍋',tomate:'🍅',carotte:'🥕',pain:'🍞',fromage:'🧀',gâteau:'🍰',croissant:'🥐',
  livre:'📖',stylo:'🖊️',clé:'🔑',lampe:'💡',chaise:'🪑',table:'🪑',lit:'🛏️',porte:'🚪',fenêtre:'🪟',maison:'🏠',voiture:'🚗',vélo:'🚲',
  train:'🚆',avion:'✈️',bateau:'⛵',montre:'⌚',lunettes:'👓',chapeau:'🎩',robe:'👗',chemise:'👔',jupe:'👗',sac:'👜',valise:'🧳',
  fleur:'🌸',arbre:'🌳',soleil:'☀️',lune:'🌙',étoile:'⭐',montagne:'⛰️',mer:'🌊',plage:'🏖️',neige:'❄️',pluie:'🌧️',guitare:'🎸',
  piano:'🎹',ballon:'⚽',téléphone:'📞',ordinateur:'💻',bouteille:'🍾',tasse:'☕',verre:'🥛',assiette:'🍽️',couteau:'🔪',fourchette:'🍴',
  cuillère:'🥄',bougie:'🕯️',lettre:'✉️',carte:'🗺️',photo:'📷',parapluie:'☂️',tente:'⛺',dentiste:'🦷',pharmacie:'💊',jardin:'🌳'};
var GENDER = (function(){
  var W='[a-zàâçéèêëîïôûùüÿœæ-]+', re1=new RegExp('^(un|une|le|la)\\s+('+W+')$'), re2=new RegExp("^l['’]("+W+")\\s*\\((m|f)\\.\\)$");
  var map={}, bad={};
  (typeof CHUNKS!=='undefined'?CHUNKS:[]).forEach(function(c){
    var s=String(c.fr||'').trim(), m=s.match(re1), n, g, el=false;
    if(m){ n=m[2]; g=/^(une|la)$/.test(m[1])?'f':'m'; }
    else if((m=s.match(re2))){ n=m[1]; g=m[2]; el=true; }
    if(!n) return;
    var zh=String(c.zh||'').split(/[（(]/)[0].replace(/陽性|陰性/g,'').trim();
    if(map[n]&&map[n].g!==g) bad[n]=1;
    if(!map[n]&&zh) map[n]={n:n, g:g, zh:zh, el:el};
  });
  return Object.keys(map).filter(function(k){ return !bad[k]; }).map(function(k){ return map[k]; });
})();
var GENDER_RULES=[[/(tion|sion|xion)$/,'f','-tion／-sion 幾乎都是陰性'],[/té$/,'f','-té 幾乎都是陰性'],[/ée$/,'f','-ée 幾乎都是陰性'],
  [/ment$/,'m','-ment 幾乎都是陽性'],[/age$/,'m','-age 幾乎都是陽性'],[/ure$/,'f','-ure 多半是陰性'],[/ette$/,'f','-ette 多半是陰性'],[/euse$/,'f','-euse 多半是陰性']];
function whole(it){ return (it.g==='f'?'une ':'un ')+it.n; }
function genderWhy(it){
  for(var i=0;i<GENDER_RULES.length;i++){ var r=GENDER_RULES[i];
    if(r[0].test(it.n)) return r[1]===it.g ? r[2] : '例外：'+r[2]+'，但它是'+(it.g==='f'?'陰性':'陽性')+'，要單獨記'; }
  if(it.el) return "l' 開頭聽不出陰陽，要連 un／une 一起記";
  if(!/e$/.test(it.n) && it.g==='m') return '不是 -e 結尾的名詞，多半是陽性';
  return '字尾猜不到，只能整塊記';
}

/* ============================================================
   存檔：只在本機（樣本），⛔ 不寫 clb7_*
   ============================================================ */
var KEY='town_sample_v2';
function freshState(){ return { day:1, gold:0, bagCap:8, lamp:0, pick:0, trap:0, q:0, built:{stall:1, home:1}, starsShown:{},
  clues:{}, letter:0, solved:0, topic:{}, gword:{}, canSay:{}, qlast:{}, stand:{}, standFam:{}, seen:'' }; }
var S = (function(){ try{ return JSON.parse(localStorage.getItem(KEY))||null; }catch(e){ return null; } })() || freshState();
(function(){ var f=freshState(); for(var k in f) if(S[k]===undefined) S[k]=f[k]; })();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function readLS(k){ try{ return JSON.parse(localStorage.getItem(k)||'{}')||{}; }catch(e){ return {}; } }
var sheet=document.getElementById('sheet');

/* ============================================================
   素材（Kenney Tiny Town＝town/、Tiny Dungeon＝tiles/，16×16）
   ============================================================ */
var IMG={t:{}, d:{}};
function img(set, i){
  var k=set+i, c=IMG[set][i];
  if(!c){ c=new Image(); c.src='assets/game/'+(set==='t'?'town':'tiles')+'/tile_'+String(i).padStart(4,'0')+'.png'; IMG[set][i]=c; }
  return c;
}
var SPR={ hero:['d',88], rat:['d',123], keeper:['d',99], smith:['d',98], post:['d',100], baker:['d',85],
  ore:['d',24], boulder:['d',12], bush:['t',5], sign:['t',83], mound:['t',92], pick:['t',115], fish:['t',131] };

/* ============================================================
   世界：40×38 格。北＝河邊（過橋才到）／西＝森林／東＝礦坑／中＝麥田（老鼠）／南＝小鎮
   ============================================================ */
var W=40, H=38;
var rnd=(function(seed){ return function(){ seed=(seed*16807)%2147483647; return (seed-1)/2147483646; }; })(20261015);
function region(x,y){
  if(y<=7) return 'north';
  if(y<=9) return 'river';
  if(y>=23 && x>=13 && x<=27) return 'town';
  if(x<=12) return 'forest';
  if(x>=28) return 'mine';
  return 'field';
}
var ground=[], deco=[], solid=[];
var LOTS={
  /* 中間 x=19–20 是通往橋的路，房子分在兩旁 */
  stall: {x:22,y:24, name:'🏪 交貨攤', roof:'red',  door:[23,27]},
  forge: {x:14,y:24, name:'⚒ 鐵匠鋪', roof:'gray', door:[15,27], fam:'verb', famName:'動詞', cost:{ore:3, gold:30}},
  post:  {x:14,y:31, name:'📮 郵局',   roof:'red',  door:[15,34], fam:'pron', famName:'代名詞', cost:{fish:3, obj:2, gold:40}},
  bakery:{x:22,y:31, name:'🍞 麵包店', roof:'red',  door:[23,34], fam:'noun', famName:'名詞片語＋陰陽性', cost:{obj:4, fish:2, gold:50}},
  home:  {x:25,y:28, name:'🏡 你的家', roof:'gray', door:[26,31]}
};
var BRIDGE={x:19, y:8, cost:{ore:4, obj:4}, door:[19.9,10.3]};
var PLAZA={x:20.5, y:29.5};
var NODE_DEF=[
  /* 🌳 樹叢（森林）：名詞片語＋陰陽性 */
  [3,12],[7,13],[10,15],[2,17],[6,19],[10,21],[3,23],[8,25],[11,28],[4,29],[8,31],[2,32]
].map(function(p){ return {k:'bush',x:p[0],y:p[1]}; }).concat([
  /* 🪨 礦石（礦坑）：動詞 */
  [30,12],[34,13],[37,15],[31,17],[35,19],[29,21],[33,23],[37,25],[30,27],[34,29],[37,31],[31,32]
].map(function(p){ return {k:'rock',x:p[0],y:p[1]}; })).concat([
  /* 🎣 釣點（河的北岸，過了橋才釣得到）：聽一句、選意思 */
  [4,8],[9,8],[14,8],[26,8],[31,8],[36,8]
].map(function(p){ return {k:'fish',x:p[0],y:p[1]}; }));
var CLUES=[
  {id:'c1', x:7,  y:3,  topic:'accord-participe-passe'},
  {id:'c2', x:25, y:14, topic:'pronoms-y-en'},
  {id:'c3', x:37, y:28, topic:'pc-imparfait-recit'}
];
function isStar(n){ return n.k==='fish' || (n.k==='bush'&&(n.x<=4&&n.y>=23)) || (n.k==='rock'&&n.x>=36) || n.y<=13; }

function buildWorld(){
  for(var y=0;y<H;y++){ ground[y]=[]; deco[y]=[]; solid[y]=[];
    for(var x=0;x<W;x++){
      var r=region(x,y), g, d=null, s=false, v=rnd();
      if(r==='river'){ g='water'; s=true; }
      else if(r==='mine'){ g=['d',[48,48,49,50,51][Math.floor(v*5)]]; }
      else if(r==='town'){ g=['t',v<.88?25:(v<.95?39:40)]; }
      else if(r==='field'){ g=['t',v<.5?1:(v<.95?0:2)]; }
      else g=['t',v<.8?0:(v<.93?1:2)];
      if(x===0||x===W-1||y===0||y===H-1){ d=['t',[4,16,28][Math.floor(v*3)]]; s=true; }
      else if(r==='forest' && rnd()<.2){ d=['t',[4,16,28,3][Math.floor(rnd()*4)]]; s=true; }
      else if(r==='north' && rnd()<.09){ d=['t',[4,16,28][Math.floor(rnd()*3)]]; s=true; }
      else if(r==='mine' && rnd()<.1){ d=SPR.boulder; s=true; }
      else if(r==='field' && rnd()<.03){ d=['t',[92,29][Math.floor(rnd()*2)]]; }
      else if(r==='town' && (x===13||x===27) && rnd()<.5){ d=['t',[16,4][Math.floor(rnd()*2)]]; s=true; }
      ground[y][x]=g; deco[y][x]=d; solid[y][x]=s;
    }
  }
  /* 小路：鎮 → 橋 */
  for(var yy=10;yy<=23;yy++) for(var xx=19;xx<=20;xx++){ ground[yy][xx]=['t',25]; deco[yy][xx]=null; solid[yy][xx]=false; }
  /* 節點與線索的格子一定空出來，旁邊也是 */
  NODE_DEF.concat(CLUES).forEach(function(n){ for(var dy=-1;dy<=1;dy++) for(var dx=-1;dx<=1;dx++){ var X=n.x+dx, Y=n.y+dy;
    if(X>0&&Y>0&&X<W-1&&Y<H-1&&region(X,Y)!=='river'){ deco[Y][X]=null; solid[Y][X]=false; } } });
  applyBuildings();
  /* 走得到嗎？走不到就把擋路的樹清掉（從節點往小鎮方向） */
  NODE_DEF.concat(CLUES).forEach(function(n){
    var tx=n.y<=8?n.x:n.x, ty=n.y<=8?7:n.y; var guard=0;
    while(!reachable(tx,ty) && guard++<40){

/* 正確說法：有空格就把答案填回去，唸整句 */
function sayOf(q, ans){
  var s=String(q.q);
  if(!/_{2,}/.test(s)) return ans;
  var seg=s.split('→').filter(function(x){ return /_{2,}/.test(x); })[0]||s;   /* 只取有空格的那一段 */
  var qm=seg.match(/「([^」]*_{2,}[^」]*)」/); if(qm) seg=qm[1];                       /* 中文題幹裡「…」包著的法文 */
  seg=seg.replace(/（[^）]*）/g,'').replace(/\([^)]*[\u4e00-\u9fff][^)]*\)/g,'');      /* 全形括號一律是提示；半形的有中文才是 */
  seg=seg.replace(/「[^」]*」/g,function(m){ return /_{2,}/.test(m)?m:''; });           /* 去掉前面的中文翻譯「…」 */                       /* 去掉中文提示括號 */
  var c=Math.max(seg.lastIndexOf(':',seg.indexOf('_')), seg.lastIndexOf('：',seg.indexOf('_'))); if(c>=0 && c<seg.indexOf('_')) seg=seg.slice(c+1);   /* 去掉「Le contraire :」這種標籤 */
  return seg.replace(/_{2,}(\s*\([^)]*\))?/, ans).replace(/\s+/g,' ').trim();
}

/* ============================================================

function questInfo(){
  var b=S.built;

  if(!b.forge) return {t:'重建 <b>⚒ 鐵匠鋪</b>（⛏×3＋30🪙）', to: count('ore')>=3&&S.gold>=30?door('forge'):nearestNode(['rock'])};
  if(!b.bridge) return {t:'修好北邊的 <b>橋</b>（⛏×4 📦×4），過河', to: count('ore')>=4&&count('obj')>=4?{x:BRIDGE.door[0],y:BRIDGE.door[1]}:nearestNode(count('ore')<4?['rock']:['bush'])};
  if(!b.post) return {t:'到河邊釣魚，重建 <b>📮 郵局</b>（🐟×3 📦×2＋40🪙）', to: count('fish')>=3&&count('obj')>=2&&S.gold>=40?door('post'):nearestNode(count('fish')<3?['fish']:['bush'])};

function door(k){ var d=LOTS[k].door; return {x:d[0]+.5, y:d[1]+.5}; }
function nearestNode(kinds){
  var best=null, bd=1e9;
  nodes.forEach(function(n){ if(n.done||kinds.indexOf(n.k)<0) return; if(n.k==='fish'&&!S.built.bridge) return;
    var d=Math.hypot(n.x+.5-hero.x, n.y+.5-hero.y); if(d<bd){ bd=d; best={x:n.x+.5,y:n.y+.5}; } });
  return best;
}
function nearestClue(){
  var best=null, bd=1e9;
  CLUES.forEach(function(c){ if(S.clues[c.id]) return; var d=Math.hypot(c.x+.5-hero.x,c.y+.5-hero.y); if(d<bd){ bd=d; best={x:c.x+.5,y:c.y+.5}; } });
  return best;
}

function costHtml(c){ var p=[]; if(c.ore) p.push('⛏×'+c.ore+'（有 '+count('ore')+'）'); if(c.obj) p.push('📦×'+c.obj+'（有 '+count('obj')+'）'); if(c.fish) p.push('🐟×'+c.fish+'（有 '+count('fish')+'）'); if(c.gold) p.push(c.gold+'🪙（有 '+S.gold+'）'); return p.join('　'); }

function pay(c){ ['ore','obj','fish'].forEach(function(k){ for(var i=0;i<(c[k]||0);i++){ var j=bag.findIndex(function(b){ return b.k===k&&!b.good; }); if(j<0) j=bag.findIndex(function(b){ return b.k===k; }); bag.splice(j,1); } }); S.gold-=(c.gold||0); }

function classify(topic, nWrongNow){
  var t=S.topic[topic]||{r:0,w:0}, tot=t.r+t.w;
  var prevR=t.r, prevTot=tot-nWrongNow; /* 扣掉這一趟的錯來看「平常」 */
  if(nWrongNow===1 && prevTot>=5 && prevR/prevTot>=.8) return 'slip';
  var cs=S.canSay[topic];
  if(cs && Date.now()-cs.d<14*86400000) return cs.v?'auto':'concept';
  var p=topicLabel(topic).point;
  if(p && typeof gramStageOf==='function' && gramStageOf(p.id)>=3) return 'auto';
  return 'ask';
}

  if(nWrongNow===1 && tot>=4 && r/tot>=.8) return 'slip';
  return 'auto';
}

/* ============================================================
   主迴圈：移動、碰撞、觸發、老鼠、鏡頭、繪製
   ============================================================ */
var lastT=performance.now(), clock=0;
function update(dt){
  clock+=dt;
  floats.forEach(function(f){ f.t+=dt; }); floats=floats.filter(function(f){ return f.t<1.2; });
  if(hero.flash>0) hero.flash-=dt;
  if(busy){ hero.moving=0; return; }
  var v=inputVec(), sp=4.3;
  hero.moving=Math.hypot(v[0],v[1]);
  if(hero.moving>0.05){
    var nx=hero.x+v[0]*sp*dt, ny=hero.y+v[1]*sp*dt;
    if(!blocked(nx,hero.y)) hero.x=nx;
    if(!blocked(hero.x,ny)) hero.y=ny;
    if(Math.abs(v[0])>.1) hero.face=v[0]<0?-1:1;
    hero.bob+=dt*12*hero.moving;
    if(!inTown(hero)){ time-=dt*hero.moving; if(time<=0 && !night){ time=0; night=true; toast('🌙 天黑了，老鼠變多變快——回城吧'); spawnRat(); spawnRat(); } }
    reveal();
    if(Math.random()<dt) { save(); hud(); }
  }
  /* 進城 → 有東西就回顧 */
  var it=inTown(hero);
  if(it && !wasInTown){ wasInTown=true; if(log.length){ joy=null; keys={}; review(); return; } }
  if(!it) wasInTown=false;
  /* 碰到節點 */
  for(var i=0;i<nodes.length;i++){ var n=nodes[i]; if(n.done) continue;
    var R=n.k==='fish'?1.15:.85;
    if(Math.hypot(n.x+.5-hero.x, n.y+.5-hero.y)<R){
      if(n.k==='fish' && hero.y>8) continue;
      if(bag.length>=S.bagCap){ if(!n.warn){ toast('🎒 背包滿了——回城交貨吧'); n.warn=1; } continue; }
      n.warn=0; hero.moving=0; joy=null; keys={};
      if(n.k==='rock') mineRock(n); else if(n.k==='bush') shakeBush(n); else fishSpot(n);
      return;
    }
  }
  /* 紙條（郵局蓋好、信讀過才出現） */
  if(S.letter) for(var c=0;c<CLUES.length;c++){ var C=CLUES[c]; if(S.clues[C.id]) continue; if(C.cool>0){ C.cool-=dt; continue; }
    if(Math.hypot(C.x+.5-hero.x, C.y+.5-hero.y)<.8){ joy=null; keys={}; readClue(C); return; } }
  /* 門口 */
  /* 門口：⭐ 要「往上推」（往門的方向走）才會進門，路過不會跳出來 */
  var at=null, push=v[1]<-.35;
  for(var k in LOTS){ var d=LOTS[k].door; if(Math.abs(d[0]+.5-hero.x)<.6 && hero.y>d[1] && hero.y<d[1]+.9) at=k; }
  if(!S.built.bridge && Math.abs(BRIDGE.door[0]-hero.x)<1 && hero.y<10.8) at='bridge';
  if(!push && at!==lastDoor) at=null;
  if(at && at!==lastDoor){ lastDoor=at; joy=null; keys={};
    if(at==='bridge') buildPanel('北邊的橋', BRIDGE.cost, null, function(){ S.built.bridge=1; applyBuildings(); });
    else if(at==='stall' && log.length) review();
    else openLot(at);
    return; }
  if(!at) lastDoor=null;
  /* 老鼠 */
  rats.forEach(function(r){
    if(r.calm>0) r.calm-=dt; if(r.flee>0) r.flee-=dt;
    var chase = r.calm<=0 && bag.length && !inTown(hero) && Math.hypot(hero.x-r.x,hero.y-r.y)<(night?7:4.5) && Math.random()<(S.trap? .6 : 1);
    var tx=r.tx, ty=r.ty, spd=night?3.4:2.1;
    if(r.flee>0){ tx=r.x+(r.x-hero.x); ty=r.y+(r.y-hero.y); spd=5; }
    else if(chase){ tx=hero.x; ty=hero.y; }
    else if(Math.hypot(tx-r.x,ty-r.y)<.3 || Math.random()<dt*.3){ r.tx=14+Math.random()*13; r.ty=(night?11:11)+Math.random()*11; spd=1.2; }
    else spd=1.2;
    var dx=tx-r.x, dy=ty-r.y, L=Math.hypot(dx,dy)||1, nx=r.x+dx/L*spd*dt, ny=r.y+dy/L*spd*dt;
    var okR=function(x,y){ var reg=region(Math.floor(x),Math.floor(y)); return !blocked(x,y) && reg!=='town' && reg!=='river' && (night || reg==='field'); };
    if(okR(nx,r.y)) r.x=nx; if(okR(r.x,ny)) r.y=ny;
    if(Math.abs(dx)>.05) r.face=dx<0?-1:1;
  });
  for(var j=0;j<rats.length;j++){ var r=rats[j];
    if(r.calm<=0 && bag.length && !inTown(hero) && Math.hypot(hero.x-r.x,hero.y-r.y)<.55){ joy=null; keys={}; ratSteal(r); return; } }
}

function draw(){
  var w=cv.width, h=cv.height, ts=TS*DPR;
  cam.x+=(hero.x-cam.x)*.12; cam.y+=(hero.y-cam.y)*.12;
  var ox=w/2-cam.x*ts, oy=h/2-cam.y*ts;
  cx.imageSmoothingEnabled=false;
  cx.fillStyle='#0b0f0c'; cx.fillRect(0,0,w,h);
  var x0=Math.max(0,Math.floor(-ox/ts)), y0=Math.max(0,Math.floor(-oy/ts)), x1=Math.min(W-1,Math.ceil((w-ox)/ts)), y1=Math.min(H-1,Math.ceil((h-oy)/ts));
  /* 地面 */
  for(var y=y0;y<=y1;y++) for(var x=x0;x<=x1;x++){
    var g=ground[y][x], px=Math.floor(ox+x*ts), py=Math.floor(oy+y*ts), s=Math.ceil(ts);
    if(g==='water'){ cx.fillStyle='#3a74c4'; cx.fillRect(px,py,s,s); cx.fillStyle='rgba(255,255,255,.18)'; var wv=Math.sin(clock*2+x*.9+y)*ts*.18; cx.fillRect(px+ts*.2+wv,py+ts*.35,ts*.35,DPR*2); cx.fillRect(px+ts*.55-wv,py+ts*.72,ts*.3,DPR*2); }
    else { var im=img(g[0],g[1]); if(im.complete) cx.drawImage(im,px,py,s,s); }
  }
  /* 橋 */
  for(var by=8;by<=9;by++) for(var bx=19;bx<=20;bx++){ var px2=ox+bx*ts, py2=oy+by*ts;
    if(S.built.bridge){ cx.fillStyle='#8a5a32'; cx.fillRect(px2,py2,ts+1,ts+1); cx.fillStyle='#6b4224'; for(var l=0;l<4;l++) cx.fillRect(px2,py2+l*ts/4,ts+1,DPR*2); }
    else if(by===9 && bx===19){ cx.fillStyle='#6b4224'; cx.fillRect(px2+ts*.1,py2+ts*.5,ts*.2,ts*.5); cx.fillRect(px2+ts*1.7,py2+ts*.5,ts*.2,ts*.5); } }
  /* 要排序的東西（依 y） */
  var list=[];
  for(var y2=y0;y2<=y1;y2++) for(var x2=x0;x2<=x1;x2++){ var d=deco[y2][x2]; if(d) list.push({y:y2+1, f:drawTile(d,x2,y2,ox,oy,ts)}); }
  for(var k in LOTS) list.push({y:LOTS[k].y+3, f:drawLot(k,ox,oy,ts)});
  nodes.forEach(function(n){ list.push({y:n.y+1, f:drawNode(n,ox,oy,ts)}); });
  if(S.letter) CLUES.forEach(function(c){ if(!S.clues[c.id]) list.push({y:c.y+1, f:drawClue(c,ox,oy,ts)}); });
  npcs.forEach(function(p){ list.push({y:p.y, f:drawSprite(p.s,p.x,p.y,ox,oy,ts,1,Math.sin(clock*2+p.x)*.03)}); });
  rats.forEach(function(r){ list.push({y:r.y, f:drawSprite(SPR.rat,r.x,r.y,ox,oy,ts,r.face,Math.abs(Math.sin(clock*14))*.06)}); });
  list.push({y:hero.y, f:function(){
    var b=hero.moving>.05?Math.abs(Math.sin(hero.bob))*.12:Math.sin(clock*2)*.02;
    cx.fillStyle='rgba(0,0,0,.25)'; cx.beginPath(); cx.ellipse(ox+hero.x*ts, oy+hero.y*ts+ts*.38, ts*.28, ts*.1, 0, 0, 7); cx.fill();
    if(hero.flash>0 && Math.floor(clock*20)%2) return;
    drawSprite(SPR.hero,hero.x,hero.y,ox,oy,ts,hero.face,b)();
  }});
  list.sort(function(a,b){ return a.y-b.y; }).forEach(function(o){ o.f(); });
  /* 浮字 */
  cx.textAlign='center'; cx.font='bold '+Math.round(ts*.32)+'px system-ui';
  floats.forEach(function(f){ cx.globalAlpha=Math.max(0,1-f.t/1.2); cx.fillStyle='#000'; cx.fillText(f.txt, ox+f.x*ts+DPR, oy+(f.y-f.t*.8)*ts+DPR); cx.fillStyle=f.c; cx.fillText(f.txt, ox+f.x*ts, oy+(f.y-f.t*.8)*ts); });
  cx.globalAlpha=1;
  /* 夜晚 */
  var dusk=Math.max(0, 1-time/40); if(dusk>0){ cx.fillStyle='rgba(8,12,45,'+(dusk*.5)+')'; cx.fillRect(0,0,w,h); }
  /* 霧 */
  for(var y3=y0;y3<=y1;y3++) for(var x3=x0;x3<=x1;x3++){ if(seen[y3*W+x3]!=='1'){ cx.fillStyle='rgba(6,9,7,.92)'; cx.fillRect(Math.floor(ox+x3*ts),Math.floor(oy+y3*ts),Math.ceil(ts),Math.ceil(ts)); } }
  /* 金色箭頭 */
  var qi=questInfo(); if(qi.to && !busy) drawArrow(qi.to,ox,oy,ts,w,h);
  /* 搖桿 */
  if(joy){ cx.strokeStyle='rgba(255,255,255,.35)'; cx.lineWidth=3*DPR; cx.beginPath(); cx.arc(joy.ox*DPR,joy.oy*DPR,55*DPR,0,7); cx.stroke();
    var dx=joy.x-joy.ox, dy=joy.y-joy.oy, L=Math.hypot(dx,dy), m=Math.min(L,55)/(L||1);
    cx.fillStyle='rgba(255,255,255,.4)'; cx.beginPath(); cx.arc((joy.ox+dx*m)*DPR,(joy.oy+dy*m)*DPR,22*DPR,0,7); cx.fill(); }
}
function drawTile(d,x,y,ox,oy,ts){ return function(){ var im=img(d[0],d[1]); if(im.complete) cx.drawImage(im,Math.floor(ox+x*ts),Math.floor(oy+y*ts),Math.ceil(ts),Math.ceil(ts)); }; }
function drawSprite(s,x,y,ox,oy,ts,face,bob){ return function(){
  var im=img(s[0],s[1]); if(!im.complete) return;
  var px=ox+x*ts, py=oy+(y-bob)*ts;
  cx.save(); cx.translate(Math.floor(px),Math.floor(py)); cx.scale(face||1,1); cx.drawImage(im,-ts/2,-ts*.62,ts,ts); cx.restore(); }; }
function drawNode(n,ox,oy,ts){ return function(){
  var px=ox+n.x*ts, py=oy+n.y*ts;
  if(n.k==='fish'){
    if(n.done) return;
    var r=ts*(.25+.12*Math.sin(clock*3+n.x)); cx.strokeStyle='rgba(255,255,255,.7)'; cx.lineWidth=2*DPR; cx.beginPath(); cx.ellipse(px+ts/2,py+ts/2,r*1.4,r*.6,0,0,7); cx.stroke();
    cx.fillStyle='rgba(20,40,80,.5)'; cx.beginPath(); cx.ellipse(px+ts/2+Math.sin(clock+n.x)*ts*.15,py+ts*.55,ts*.18,ts*.07,0,0,7); cx.fill();
    return;
  }
  var im=img.apply(null, n.k==='rock'?SPR.ore:SPR.bush);
  cx.globalAlpha=n.done?.35:1; if(im.complete) cx.drawImage(im,Math.floor(px),Math.floor(py),Math.ceil(ts),Math.ceil(ts)); cx.globalAlpha=1;
  if(!n.done){ var sy=Math.sin(clock*4+n.x)*ts*.06; cx.fillStyle=isStar(n)?'#f0c95a':'#fff'; cx.font=Math.round(ts*.3)+'px system-ui'; cx.textAlign='center'; cx.fillText(isStar(n)?'★':'✦', px+ts*.82, py+ts*.18+sy); }
}; }
function drawClue(c,ox,oy,ts){ return function(){
  var px=ox+c.x*ts+ts/2, py=oy+c.y*ts+ts/2, g=.5+.5*Math.sin(clock*3);
  cx.fillStyle='rgba(240,201,90,'+(.25+.25*g)+')'; cx.beginPath(); cx.arc(px,py,ts*.45,0,7); cx.fill();
  cx.font=Math.round(ts*.55)+'px system-ui'; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText('📜',px,py); cx.textBaseline='alphabetic';
}; }
var ROOF={red:{top:[52,53,54],bot:[64,65,66],wall:[72,85,73]}, gray:{top:[48,49,50],bot:[60,61,62],wall:[76,89,77]}};
function drawLot(k,ox,oy,ts){ return function(){
  var L=LOTS[k], R=ROOF[L.roof], px=ox+L.x*ts, py=oy+L.y*ts, s=Math.ceil(ts);
  if(S.built[k]){
    for(var i=0;i<3;i++){ [R.top,R.bot,R.wall].forEach(function(row,j){ var im=img('t',row[i]); if(im.complete) cx.drawImage(im,Math.floor(px+i*ts),Math.floor(py+j*ts),s,s); }); }
    var o=starsOf(k); if(o){ cx.font=Math.round(ts*.32)+'px system-ui'; cx.textAlign='center'; var st=''; for(var q=0;q<3;q++) st+=q<o.s?'★':'☆'; cx.fillStyle='#000'; cx.fillText(st,px+ts*1.5+DPR,py-ts*.08+DPR); cx.fillStyle='#f0c95a'; cx.fillText(st,px+ts*1.5,py-ts*.08); }
  } else {
    [[0,2,'t',92],[2,2,'t',92],[1,1,'t',44],[0,1,'t',47]].forEach(function(p){ var im=img(p[2],p[3]); if(im.complete) cx.drawImage(im,Math.floor(px+p[0]*ts),Math.floor(py+p[1]*ts),s,s); });
    var sg=img('t',83); if(sg.complete) cx.drawImage(sg,Math.floor(px+ts),Math.floor(py+2*ts),s,s);
  }
  cx.font='bold '+Math.round(ts*.26)+'px system-ui'; cx.textAlign='center'; var label=(S.built[k]?'':'重建 ')+L.name;
  var tw=cx.measureText(label).width+ts*.2; cx.fillStyle='rgba(0,0,0,.55)'; cx.fillRect(px+ts*1.5-tw/2, py+ts*3.05, tw, ts*.36);
  cx.fillStyle='#fff'; cx.fillText(label, px+ts*1.5, py+ts*3.32);
}; }
function drawArrow(to,ox,oy,ts,w,h){
  var tx=ox+to.x*ts, ty=oy+to.y*ts, m=40*DPR, b=Math.sin(clock*5)*6*DPR;
  cx.fillStyle='#f0c95a'; cx.strokeStyle='#000'; cx.lineWidth=2*DPR;
  if(tx>m&&tx<w-m&&ty>m*2.5&&ty<h-m){
    cx.beginPath(); cx.moveTo(tx,ty-ts*.55+b); cx.lineTo(tx-ts*.22,ty-ts*.9+b); cx.lineTo(tx+ts*.22,ty-ts*.9+b); cx.closePath(); cx.fill(); cx.stroke(); return;
  }
  var cx0=w/2, cy0=h/2, a=Math.atan2(ty-cy0, tx-cx0), R=Math.min(w/2-m, h/2-m*2);
  var ax=cx0+Math.cos(a)*R, ay=cy0+Math.sin(a)*R;
  cx.save(); cx.translate(ax,ay); cx.rotate(a); cx.beginPath(); cx.moveTo(18*DPR+b,0); cx.lineTo(-8*DPR+b,-12*DPR); cx.lineTo(-8*DPR+b,12*DPR); cx.closePath(); cx.fill(); cx.stroke(); cx.restore();
}
function loop(t){
  var dt=Math.min(.05,(t-lastT)/1000); lastT=t;
  update(dt); draw();
  requestAnimationFrame(loop);
}

/* 按鈕 */
document.getElementById('bHome').onclick=function(){ if(busy) return; if(inTown(hero)){ toast('已經在小鎮裡了'); return; }
  fade(function(){ hero.x=PLAZA.x; hero.y=PLAZA.y; cam.x=hero.x; cam.y=hero.y; time=Math.max(0,time-5); }); };
document.getElementById('bRest').onclick=rest;

/* 開場 */
resize(); buildWorld(); initSeen(); newDay(true); reveal(); cam.x=hero.x; cam.y=hero.y;
Object.keys(SPR).forEach(function(k){ img.apply(null,SPR[k]); });
requestAnimationFrame(loop);
if(!S.intro){ S.intro=1; save();
  openSheet('<h3>🏘️ Val-Brume</h3><div class="story">你剛搬到魁北克一個沒落的小鎮。房子都塌了，鐘樓的鐘也停了很久——沒人說得出為什麼。</div>'+
    '<div class="muted">按住畫面任何地方拖曳就能走（電腦用方向鍵）。走到 🌳 ⛏ 旁邊會自動開始；跟著上方的 🎯 和金色箭頭走。</div><div class="row2"><span></span><button class="btn main" id="ok">出發</button></div>');
  document.getElementById('ok').onclick=closeSheet; }

</script>

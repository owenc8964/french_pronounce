  v1（10-14）Owen 回饋：「移動起來很不順暢，不像玩電動那樣移動」「人是一個人像在移動，頁面非常短」
                       「只是在其中動來動去而已，玩的目的很不明確，不知道終點會是什麼」
  → v2：畫布引擎（60fps、拖曳搖桿／方向鍵、鏡頭跟隨、全螢幕、像素素材、霧）＋三層目標
        （這一趟＝任務＋金色箭頭／這一區＝修橋開新區／整局＝重建小鎮＋背後的謎，Owen 10-15 選 A＋B）。
  ⭐ 房子的星星只認「站穩」：同一題（或同一個字）在不同的兩天都答對才算——鎮長大＝你長大（鏡子）。
  ⭐ 答錯照樣收、變瑕疵品；回城跳「這一趟的回顧」（錯在哪、為什麼、依手滑／自動化／概念三類給建議與正確整句、連發）。
  ⭐ 三層跳過：繞過（每個遭遇）／回城（整趟）／收工（今天）；蓋房子的那句「寫下來」也可以不寫。
  ⚠️ 原創法文（Owen 10-14 同意，無限城例外）：老鼠的「Le rat l'a pris／prise !」與第一章三張紙條，只用已學句型。其餘題目全出自 questions.js／chunks.js。
  ⚠️ 樣本：只存本機 town_sample_v2（不接同步、不寫 clb7_*）；只「讀」clb7_gram_stage／clb7_gender_seen 判斷錯誤類型。

<script>
'use strict';
/* ============================================================
   資料：題目池（全部出自 questions.js；依「處理什麼資訊」分家，跟研究檔第五節同一張表）
   ============================================================ */
var FAM = {
  verb: /passe|imparfait|conditionnel|futur|subjonctif|reflexive|(?<!ad)verbs|etre-avoir|imperative|accord-participe|pouvoir|gerondif|condition-si|discours|ilfaut|recit/,

  noun: /article|adjective|demonstrative-adj|possessives|tout-chaque|comparaison|superlatif|cest-il|mise-en-relief|intensite/
};
function famOf(topic){ for(var k in FAM) if(FAM[k].test(topic)) return k; return null; }
var POOL = { verb:{choose:[],fill:[]}, pron:{choose:[],fill:[]}, noun:{choose:[],fill:[]} };
BANK.forEach(function(q, i){
  q._i = i;
  var f = famOf(q.topic); if(!f) return;
  /* 路上只出「法文句子」題：有空格，或選項本身是法文；⛔ 選項是中文的規則概念題不出（memory feedback_gram3_textbook_style） */
  var zh=function(x){ return /[\u4e00-\u9fff]/.test(x); };
  if(q.type==='choose' && q.opts && q.opts.length>=2 && (/_{2,}/.test(q.q) || !q.opts.some(zh))) POOL[f].choose.push(q);
  if(q.type==='fill') POOL[f].fill.push(q);
});

/* ⭐ 10-15 擴充：fill 填空題轉成路上用的選擇題（tools/town_field_extra.js；題幹與正解原樣，只新增保證錯的干擾項，驗證腳本 tools/check_town_field_extra.js）
   ⛔ cue:true 的 24 題先不用（干擾項本身合文法，要靠題幹線索才判錯） */
(typeof FIELD_EXTRA!=='undefined'?FIELD_EXTRA:[]).forEach(function(x){
  if(x.cue || !POOL[x.fam] || !BANK[x.src]) return;
  var b=BANK[x.src];
  POOL[x.fam].choose.push({lesson:b.lesson, topic:x.topic, type:'choose', q:x.q, a:x.a, opts:x.opts, aNote:x.aNote, hint:x.hint||'', zh:x.zh||'', _i:x.src, _fx:1});
});
/* 陰陽性字庫：跟 quest.html 的 genderPool 同一個抽法（chunks.js「un／une／le／la＋單字名詞」與「l'… (m.)／(f.)」） */
var EMO={chien:'🐕',chat:'🐈',cheval:'🐎',lapin:'🐇',poisson:'🐟',poule:'🐔',vache:'🐄',canard:'🦆',renard:'🦊',loup:'🐺',lion:'🦁',rat:'🐀',
  pomme:'🍎',fraise:'🍓',banane:'🍌',orange:'🍊',citron:'🍋',tomate:'🍅',carotte:'🥕',pain:'🍞',fromage:'🧀',gâteau:'🍰',croissant:'🥐',
  livre:'📖',stylo:'🖊️',clé:'🔑',lampe:'💡',chaise:'🪑',table:'🪑',lit:'🛏️',porte:'🚪',fenêtre:'🪟',maison:'🏠',voiture:'🚗',vélo:'🚲',
  train:'🚆',avion:'✈️',bateau:'⛵',montre:'⌚',lunettes:'👓',chapeau:'🎩',robe:'👗',chemise:'👔',jupe:'👗',sac:'👜',valise:'🧳',
  fleur:'🌸',arbre:'🌳',soleil:'☀️',lune:'🌙',étoile:'⭐',montagne:'⛰️',mer:'🌊',plage:'🏖️',neige:'❄️',pluie:'🌧️',guitare:'🎸',
  piano:'🎹',ballon:'⚽',téléphone:'📞',ordinateur:'💻',bouteille:'🍾',tasse:'☕',verre:'🥛',assiette:'🍽️',couteau:'🔪',fourchette:'🍴',
  cuillère:'🥄',bougie:'🕯️',lettre:'✉️',carte:'🗺️',photo:'📷',parapluie:'☂️',tente:'⛺',dentiste:'🦷',pharmacie:'💊',jardin:'🌳'};
/* 圖鑑圖案：town 自己的 EMO 優先，再補 quest 的與 tools/town_emoji.js 的（10-16：原本 503 個字只有 26 個有圖案） */
[typeof DEX_EMOJI_QUEST!=='undefined'?DEX_EMOJI_QUEST:{}, typeof DEX_EMOJI!=='undefined'?DEX_EMOJI:{}].forEach(function(m){ for(var k in m) if(!EMO[k]) EMO[k]=m[k]; });
/* ⭐ emoji → 紅白機風像素圖（10-16 Owen：要寶可夢／紅白機的感覺；現成像素圖庫涵蓋不到這 503 個字）
   做法：大畫布畫 emoji → 縮到 20×20 → 顏色吸附到 PICO-8 擴充 32 色 → 加 1px 深色外框 → 用 image-rendering:pixelated 放大
   ⚠️ 在玩家自己的裝置上即時畫（iPhone 是 Apple 的 emoji），結果會快取，不下載任何圖 */
var PAL=[[0,0,0],[29,43,83],[126,37,83],[0,135,81],[171,82,54],[95,87,79],[194,195,199],[255,241,232],[255,0,77],[255,163,0],[255,236,39],[0,228,54],[41,173,255],[131,118,156],[255,119,168],[255,204,170],
  [41,24,20],[17,29,53],[66,33,54],[18,83,89],[116,47,41],[73,51,59],[162,136,121],[243,239,125],[190,18,80],[255,108,36],[168,231,46],[0,181,67],[6,90,181],[117,70,101],[255,110,89],[255,157,129]];
var PIXC={}, PIXN=20;   /* 格數：16 太糊（房子會像臉），20 比較認得出來 */
function pixURL(em){
  if(PIXC[em]) return PIXC[em];
  try{
    var B=document.createElement('canvas'); B.width=B.height=64; var b=B.getContext('2d');
    b.textAlign='center'; b.textBaseline='middle'; b.font='54px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; b.fillText(em,32,36);
    var N=PIXN, C=document.createElement('canvas'); C.width=C.height=N; var c=C.getContext('2d'); c.imageSmoothingEnabled=true; c.drawImage(B,1,1,N-2,N-2);
    var d=c.getImageData(0,0,N,N), p=d.data, op=new Array(N*N);
    for(var i=0;i<N*N;i++){ var a=p[i*4+3]; op[i]=a>=110;
      if(op[i]){ var r=p[i*4]*255/a, g=p[i*4+1]*255/a, bl=p[i*4+2]*255/a, best=0, bd=1e9;
        for(var k=0;k<PAL.length;k++){ var dr=r-PAL[k][0], dg=g-PAL[k][1], db=bl-PAL[k][2], dd=dr*dr*.3+dg*dg*.59+db*db*.11; if(dd<bd){ bd=dd; best=k; } }
        p[i*4]=PAL[best][0]; p[i*4+1]=PAL[best][1]; p[i*4+2]=PAL[best][2]; p[i*4+3]=255; } }
    for(var j=0;j<N*N;j++){ if(op[j]) continue; var x=j%N, y=(j/N)|0;
      var nb=(x>0&&op[j-1])||(x<N-1&&op[j+1])||(y>0&&op[j-N])||(y<N-1&&op[j+N]);
      if(nb){ p[j*4]=24; p[j*4+1]=20; p[j*4+2]=37; p[j*4+3]=255; } else p[j*4+3]=0; }
    c.putImageData(d,0,0); PIXC[em]=C.toDataURL();
  }catch(e){ PIXC[em]=''; }
  return PIXC[em];
}
function pix(em, size, extra){ var u=pixURL(em||'📦'); return u ? '<img class="pix" src="'+u+'" width="'+size+'" height="'+size+'" alt="" '+(extra||'')+'>' : '<span style="font-size:'+size*.8+'px">'+(em||'📦')+'</span>'; }
var GENDER = (function(){
  var W='[a-zàâçéèêëîïôûùüÿœæ-]+', re1=new RegExp('^(un|une|le|la)\\s+('+W+')$'), re2=new RegExp("^l['’]("+W+")\\s*\\((m|f)\\.\\)$");
  var map={}, bad={};
  (typeof CHUNKS!=='undefined'?CHUNKS:[]).forEach(function(c){

  openSheet('<h3>📜 紙條 '+(Object.keys(S.clues).length+1)+'／3</h3><div class="story">'+T.scene+'</div><div class="clue">'+esc(T.fr)+' '+spk(T.fr)+'</div><div class="muted">'+esc(T.gloss)+'</div>'+
    '<div class="qtext">'+esc(T.ask)+'</div><div class="opts">'+T.opts.map(function(o,i){ return '<button data-i="'+i+'" style="font-family:inherit">'+esc(o)+'</button>'; }).join('')+'</div><div class="fb" id="fb"></div><div class="row2"><button class="btn ghost" id="skip">↷ 先收起來</button><span id="slot"></span></div>');
  speak(T.fr);
  var done=false;
  sheet.querySelectorAll('.opts button').forEach(function(b){ b.onclick=function(){
    if(done) return; done=true;
    var ok=+b.dataset.i===T.a, ms=Date.now()-t0;
    rec('q', {topic:c.topic, _i:'clue-'+c.id, q:T.fr+'　'+T.ask, aNote:T.why, a:T.opts[T.a], say:T.fr}, ok, ms, {chosen:T.opts[+b.dataset.i], right:T.opts[T.a], where:'📜 紙條'});
    b.classList.add(ok?'ok':'no'); if(!ok) sheet.querySelector('[data-i="'+T.a+'"]').classList.add('ok');
    S.clues[c.id]=ok?1:2; save();
    document.getElementById('fb').innerHTML=(ok?'✓ 看穿了。':'<div class="story">'+esc(T.wrong)+'</div>')+'<div>🔎 '+esc(T.why)+'</div>';
    document.getElementById('slot').outerHTML='<button class="btn main" id="go">收進筆記</button>';
    document.getElementById('go').onclick=function(){ closeSheet(); hud(); if(Object.keys(S.clues).length>=3) toast('三張紙條都到手了——回 📮 郵局'); };
    document.getElementById('skip').style.visibility='hidden';
  }; });
  document.getElementById('skip').onclick=function(){ if(done) return; done=true; closeSheet(); c.cool=4; };
}
function solveChapter(){
  var opts=['鐘樓的鑰匙藏在橋下，麵包師傅每天晚上都去看它','鐘樓的鑰匙藏在橋下，麵包師傅只去過一次','帳本藏在橋下，麵包師傅正要出發去拿'];
  openSheet('<h3>📮 把三張紙條拼起來</h3><div class="story">紙條一：<span class="fr">Je l\'ai mise sous le pont.</span><br>紙條二：<span class="fr">Il en revient.</span><br>紙條三：<span class="fr">Chaque nuit, j\'allais au pont…</span></div>'+
    '<div class="qtext">所以，到底是怎麼回事？</div><div class="opts">'+opts.map(function(o,i){ return '<button data-i="'+i+'" style="font-family:inherit">'+esc(o)+'</button>'; }).join('')+'</div><div class="fb" id="fb"></div><div class="row2"><button class="btn ghost" id="skip">↷ 晚點再想</button><span id="slot"></span></div>', true);
  var done=false;
  sheet.querySelectorAll('.opts button').forEach(function(b){ b.onclick=function(){
    var i=+b.dataset.i;
    if(i!==0){ b.classList.add('no'); document.getElementById('fb').innerHTML=i===1?'🔎 再看紙條三：<span class="fr">j\'allais</span> 是 imparfait——那是習慣，不是一次。':'🔎 再看紙條一跟二：<span class="fr">mise</span> 是陰性（鑰匙不是帳本）；<span class="fr">il en revient</span> 是剛回來，不是正要去。'; return; }
    if(done) return; done=true; b.classList.add('ok'); S.solved=1; S.gold+=40; save(); hud();
    document.getElementById('fb').innerHTML='<div class="story">你走到橋下，在石縫裡摸到一把冰冷的鑰匙，上面刻著：<span class="fr">« Pour la cloche. »</span><br>你打開鐘樓的門——<b>鐘不見了。</b></div><div class="muted">第一章完　+40 🪙　（第二章待續）</div>';
    document.getElementById('slot').outerHTML='<button class="btn main" id="go">繼續</button>';
    document.getElementById('go').onclick=function(){ closeSheet(); };
    document.getElementById('skip').style.visibility='hidden';
  }; });
  document.getElementById('skip').onclick=function(){ closeSheet(); };
}

/* ============================================================
   目標鏈（畫面上方＋金色箭頭）。⭐ 每一步都可以不照順序玩；箭頭只是帶路
   ============================================================ */
function canAnyOrder(){ fillOrders(); return orders.some(function(o){ return count('ore')>=o.ore && count('obj')>=o.obj && count('fish')>=o.fish; }); }
/* 缺什麼就帶去哪：缺材料 → 對應的點；缺錢 → 交貨攤（交貨賺 🪙）；都夠 → 門口 */
function guide(cost, doorPt){
  if(count('ore')<(cost.ore||0)) return {to:nearestNode(['rock']), need:'⛏'};
  if(count('obj')<(cost.obj||0)) return {to:nearestNode(['bush']), need:'📦'};
  if(count('fish')<(cost.fish||0)) return {to:nearestNode(['fish']), need:'🐟'};
  if(S.gold<(cost.gold||0)) return {to:door('stall'), need:'🪙', money:true};
  return {to:doorPt, ready:true};
}
function questInfo(){
  var b=S.built, g, full=bag.length>=S.bagCap;
  if(!b.cottage) return {t:'走進 🌳 森林的草叢收集東西進 <b>📖 圖鑑</b>——再收 '+Math.max(1,DEX_MILESTONE-dexCount())+' 種，就會有人回到鎮上', to: region(Math.floor(hero.x),Math.floor(hero.y))==='forest' ? null : {x:8.5,y:19.5}};
  if(!relOf('clement').met){ var cv0=villagers[0]; return {t:'🏡 森林邊的小屋亮燈了——去跟 <b>Clément</b> 打招呼', to:cv0?{x:cv0.x,y:cv0.y}:door('cottage')}; }
  function step(txt, cost, doorPt){
    g=guide(cost, doorPt);
    if(full && !g.ready) return {t:'🎒 背包滿了 → 回 <b>🏪 交貨攤</b>交貨或賣掉幾件', to:door('stall')};
    return {t:txt+(g.ready?'　✅ 材料夠了':(g.money?'　（還差 🪙：去交貨賺）':'')), to:g.to};
  }
  if(!S.firstDeal){
    if(bag.length && canAnyOrder()) return {t:'回 <b>🏪 交貨攤</b>交第一單', to:door('stall')};
    if(full) return {t:'🎒 背包滿了 → 回 <b>🏪 交貨攤</b>', to:door('stall')};
    return {t:'去 ⛏ 礦坑或 🌳 森林採 2 件以上，回 <b>🏪 交貨攤</b>交第一單', to:nearestNode(count('ore')>=count('obj')?['bush','rock']:['rock','bush'])};
  }
  if(!b.forge) return step('重建 <b>⚒ 鐵匠鋪</b>（⛏×3）', LOTS.forge.cost, door('forge'));
  if(!b.bridge) return step('修好北邊的 <b>橋</b>（⛏×4 📦×3），過河', BRIDGE.cost, {x:BRIDGE.door[0],y:BRIDGE.door[1]});
  if(!b.post) return step('到河邊釣魚，重建 <b>📮 郵局</b>（🐟×3 📦×2＋30🪙）', LOTS.post.cost, door('post'));
  if(!S.letter) return {t:'郵局蓋好了——進去看看', to:door('post')};
  if(Object.keys(S.clues).length<3) return {t:'找三張 <b>📜 紙條</b>（'+Object.keys(S.clues).length+'／3）', to:nearestClue()};
  if(!S.solved) return {t:'回 <b>📮 郵局</b>把三張紙條拼起來', to:door('post')};
  if(!b.bakery) return step('第一章完。重建 <b>🍞 麵包店</b>（📦×4 🐟×2＋40🪙），白天變長', LOTS.bakery.cost, door('bakery'));
  return {t:'小鎮在長大：房子上的 ⭐ 只在你「隔天又答對」時才會亮', to:null};
}
function door(k){ var d=LOTS[k].door; return {x:d[0]+.5, y:d[1]+.5}; }
function nearestNode(kinds){
  var best=null, bd=1e9;
  nodes.forEach(function(n){ if(n.done||kinds.indexOf(n.k)<0) return; if(n.k==='fish'&&!S.built.bridge) return;
    var d=Math.hypot(n.x+.5-hero.x, n.y+.5-hero.y)+kinds.indexOf(n.k)*6; if(d<bd){ bd=d; best={x:n.x+.5,y:n.y+.5}; } });
  return best;
}
function nearestClue(){
  var best=null, bd=1e9;
  CLUES.forEach(function(c){ if(S.clues[c.id]) return; var d=Math.hypot(c.x+.5-hero.x,c.y+.5-hero.y); if(d<bd){ bd=d; best={x:c.x+.5,y:c.y+.5}; } });
  return best;
}

/* ============================================================
   🏗 蓋房子／修橋：材料＋金幣；那句「寫下來」可以不寫（跳過合法）
   ============================================================ */
function costHtml(c){ var p=[]; if(c.ore) p.push('⛏×'+c.ore+'（有 '+count('ore')+'）'); if(c.obj) p.push('📦×'+c.obj+'（有 '+count('obj')+'）'); if(c.fish) p.push('🐟×'+c.fish+'（有 '+count('fish')+'）'); if(c.gold) p.push(c.gold+'🪙（有 '+S.gold+'）'); return p.join('　'); }
function canPay(c){ return count('ore')>=(c.ore||0) && count('obj')>=(c.obj||0) && count('fish')>=(c.fish||0) && S.gold>=(c.gold||0); }
function pay(c){ ['ore','obj','fish'].forEach(function(k){ for(var i=0;i<(c[k]||0);i++){ var j=bag.findIndex(function(b){ return b.k===k&&!b.good; }); if(j<0) j=bag.findIndex(function(b){ return b.k===k; }); bag.splice(j,1); } }); S.gold-=(c.gold||0); }
function starsOf(k){ var L=LOTS[k]; if(!L.fam) return ''; var n=standCount(L.fam)+(L.fam==='noun'?0:0), s=n>=30?3:n>=15?2:n>=5?1:0; return {s:s, n:n}; }
function starHtml(k){ var o=starsOf(k); if(!o) return ''; var h=''; for(var i=0;i<3;i++) h+=i<o.s?'★':'<span class="off">★</span>'; return '<span class="stars">'+h+'</span>'; }
function openLot(k){
  var L=LOTS[k];
  if(k==='stall') return openStall();
  if(k==='home') return rest();
  if(k==='cottage'){
    if(!S.built.cottage){ var left=Math.max(0,DEX_MILESTONE-dexCount());
      openSheet('<h3>🏡 森林邊的小屋</h3><div class="story">門鎖著，窗台上積了灰。以前住在這裡的人，好像還會回來。</div><div class="muted">物品圖鑑再收 '+left+' 種，就會有人回來住。</div><div class="row2"><span></span><button class="btn main" id="ok">好</button></div>');
      document.getElementById('ok').onclick=closeSheet; return; }
    var v=villagers.filter(function(x){ return x.rid==='clement'; })[0]; if(v) return villager(v);
  }
  if(!S.built[k]) return buildPanel(L.name, L.cost, L.fam, function(){ S.built[k]=1; applyBuildings(); spawnNpcs(); if(k==='post') setTimeout(readLetter,400); });
  if(k==='post'){ if(!S.letter) return readLetter(); if(Object.keys(S.clues).length>=3 && !S.solved) return solveChapter(); }
  var o=starsOf(k);
  var h='<h3>'+L.name+' '+starHtml(k)+'</h3><div class="muted">這棟房子對應「'+L.famName+'」。⭐ 只在同一題「隔天又答對」時才會長：現在站穩 '+o.n+' 個（5／15／30 各一顆星）。</div>';
  if(k==='forge') h+='<div class="shop">'+buyBtn('pick','⛏ 好十字鎬：會心一擊更容易',costPick())+buyBtn('trap','🪤 捕鼠夾：老鼠比較不敢靠近',costTrap())+'</div>';
  if(k==='bakery') h+='<div class="muted" style="margin-top:6px">🍞 麵包店開了：每天的白天多 30 秒。</div>';
  if(k==='post') h+='<div class="muted" style="margin-top:6px">'+(S.solved?'第一章完。第二章待續。':'還差 '+(3-Object.keys(S.clues).length)+' 張紙條。')+'</div>';
  h+='<div class="row2"><span></span><button class="btn main" id="ok">離開</button></div>';
  openSheet(h);
  sheet.querySelectorAll('[data-buy]').forEach(function(b){ b.onclick=function(){ buy(b.dataset.buy, function(){ openLot(k); }); }; });
  document.getElementById('ok').onclick=closeSheet;
}
function buildPanel(name, cost, fam, done){
  var can=canPay(cost);
  openSheet('<h3>🏗 重建 '+name+'</h3><div class="muted">需要：'+costHtml(cost)+'</div>'+(can?'':'<div class="muted" style="margin-top:6px">材料還不夠，再出門一趟吧。</div>')+
    '<div class="row2"><button class="btn ghost" id="no">離開</button><button class="btn '+(can?'main':'')+'" id="yes" '+(can?'':'disabled style="opacity:.4"')+'>開工</button></div>');
  document.getElementById('no').onclick=closeSheet;
  document.getElementById('yes').onclick=function(){
    if(!canPay(cost)) return;
    pay(cost); hud();
    /* 產出：工頭要你把一句話寫下來（打字填空）。寫對 +10🪙，不寫照樣蓋好 */
    var pool=fam?POOL[fam].fill:POOL.noun.fill.concat(POOL.verb.fill), q=pickQ(pool.filter(function(x){ return x.q.length<160; }), false);
    writeOne('🏗 工頭要你寫下來 <small>寫對 +10🪙</small>', q, function(ok){ if(ok){ S.gold+=10; } done(); save(); hud();
      openSheet('<h3>✨ '+name+' 蓋好了</h3><div class="muted">'+(name.indexOf('橋')>=0?'河的北邊打開了——那裡可以釣魚。':'小鎮多了一棟房子。')+'</div><div class="row2"><span></span><button class="btn main" id="ok">好</button></div>');
      document.getElementById('ok').onclick=closeSheet; });
  };
}
/* 打字填空（產出）。cb(ok)；不寫＝cb(null) */
function writeOne(head, q, cb){
  var t0=Date.now(), rc={kind:'打字', ref:qRef(q), q:q.q, a:q.a};
  openSheet('<h3>'+head+'</h3>'+(q.zh?'<div class="muted">'+esc(q.zh)+'</div>':'')+
    '<div class="qtext fr">'+esc(q.q)+'</div>'+(q.hint?'<div class="hint">💡 '+esc(q.hint)+'</div>':'')+
    '<input class="fill" id="fin" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" lang="fr" placeholder="打空格裡的字（或整句）">'+
    '<div class="fb" id="fb"></div><div class="row2"><button class="btn ghost" id="skip">↷ 不寫</button><button class="btn main" id="sub">交出去</button></div>'+repSlot(rc), true);
  var inp=document.getElementById('fin'); setTimeout(function(){ inp.focus(); },50);
  document.getElementById('skip').onclick=function(){ cb(null); };
  var sent=false;
  function submit(){
    var v=inp.value.trim(); if(!v || sent) return; sent=true; inp.disabled=true; rc.pick=v;
    var alts=String(q.a).split('|'), ok=false, accentOnly=false;
    var low=function(x){ return String(x).toLowerCase().replace(/[’]/g,"'").replace(/\s+/g,' ').replace(/[.!?]\s*$/,'').trim(); };
    alts.forEach(function(a){
      var whole=sayOf(q,a);   /* 把空格填回去的整句也接受 */
      [a, whole].forEach(function(t){ if(low(v)===low(t)) ok=true; else if(normAns(v)===normAns(t)) accentOnly=true; });
    });
    if(accentOnly&&!ok) ok=true;
    var ms=Date.now()-t0, right=alts.slice().sort(function(a,b){ return a.length-b.length; })[0];
    var full=alts.slice().sort(function(a,b){ return b.length-a.length; })[0], said=/\s/.test(full)&&!/[一-鿿]/.test(full)?full:frOnly(sayOf(q,right));
    rec('q', q, ok, ms, {chosen:v, right:right, where:'✍️ 寫下來'});
    var fb=document.getElementById('fb');
    fb.innerHTML=(ok?'✓ '+(accentOnly?'意思對了（注意重音：<span class="say">'+esc(right)+'</span>）':'寫對了'):'差一點')+
      (said?'<div>👉 <span class="say">'+esc(said)+'</span> '+spk(said)+'</div>':'')+(!ok&&q.aNote?'<div class="muted">為什麼：'+note(q.aNote)+'</div>':'');
    if(said) speak(said);
    document.querySelector('.row2').innerHTML='<span></span><button class="btn main" id="back">繼續</button>';
    document.getElementById('back').onclick=function(){ cb(ok); };
  }
  document.getElementById('sub').onclick=submit;
  inp.addEventListener('keydown',function(e){ if(e.key==='Enter') submit(); });
}

/* ============================================================
   🏪 交貨攤：訂單要混合材料；交貨要打字填空，寫對整單翻倍
   ============================================================ */
var NPCS=['Madame Roy','Monsieur Gagnon','Julie','le boulanger','la pharmacienne','Marc'];
var orders=[];
function newOrder(){
  var o={who:NPCS[Math.floor(Math.random()*NPCS.length)], ore:0, obj:0, fish:0};
  var kinds=shuffle(S.built.bridge?['ore','obj','fish']:['ore','obj']);
  if(Math.random()<.5) o[kinds[0]]=2+Math.floor(Math.random()*2);
  else { o[kinds[0]]=1+Math.floor(Math.random()*2); o[kinds[1]]=1+Math.floor(Math.random()*2); }
  return o;
}
function fillOrders(){
  if(!S.firstDeal && !orders.length){ orders.push({who:'Madame Roy', ore:2, obj:0, fish:0}); orders.push({who:'Julie', ore:0, obj:2, fish:0}); }
  while(orders.length<3) orders.push(newOrder());
}
function openStall(){
  fillOrders();
  var h='<h3>🏪 交貨攤 <small>💰 '+S.gold+'</small></h3>';
  h+='<div class="muted">背包（點一件＝賣掉那一件，1 🪙）：</div><div class="bagrow">'+(bag.length?bag.map(function(b,i){ return '<span data-sell="'+i+'" style="cursor:pointer" class="'+(b.good?'':'bad')+'">'+pix(b.em,18)+' '+esc(b.name)+(b.good?'':' 瑕')+'</span>'; }).join(''):'<span>空的</span>')+'</div>';
  orders.forEach(function(o,i){
    var can=count('ore')>=o.ore && count('obj')>=o.obj && count('fish')>=o.fish;
    h+='<div class="order"><div><b>'+esc(o.who)+'</b><div class="need">要 '+(o.ore?'⛏×'+o.ore+' ':'')+(o.obj?'📦×'+o.obj+' ':'')+(o.fish?'🐟×'+o.fish:'')+'</div></div>'+
      '<button class="btn '+(can?'main':'')+'" data-o="'+i+'" '+(can?'':'disabled style="opacity:.4"')+'>交貨</button></div>';
  });
  h+='<div class="muted">完整品一件 5 🪙、瑕疵品 2 🪙；交貨時寫對一句，整單翻倍。⚠️ 蓋房子的材料要留著。</div>';
  h+='<div class="shop">'+buyBtn('bag','🎒 背包 +3',costBag())+buyBtn('lamp','🏮 提燈：白天 +40 秒',costLamp())+'</div>';
  h+='<div class="row2"><button class="btn ghost" id="dump">整包便宜賣掉…</button><button class="btn main" id="out">出門 →</button></div>';
  openSheet(h, true);
  sheet.querySelectorAll('[data-o]').forEach(function(b){ b.onclick=function(){ deliver(+b.dataset.o); }; });
  sheet.querySelectorAll('[data-buy]').forEach(function(b){ b.onclick=function(){ buy(b.dataset.buy, openStall); }; });
  sheet.querySelectorAll('[data-sell]').forEach(function(b){ b.onclick=function(){ bag.splice(+b.dataset.sell,1); S.gold+=1; save(); hud(); openStall(); }; });
  document.getElementById('dump').onclick=function(){ if(!bag.length) return; if(!confirm('把背包 '+bag.length+' 件全部用 1 🪙 賣掉？（蓋房子的材料也會一起賣掉）')) return; S.gold+=bag.length; bag=[]; save(); hud(); openStall(); };
  document.getElementById('out').onclick=function(){ closeSheet(); if(time<=0) toast('天黑了，今天先收工吧（🌙）'); };
}
function buyBtn(k,label,c){ var can=S.gold>=c; return '<button class="btn" data-buy="'+k+'" '+(can?'':'disabled style="opacity:.45"')+'>'+label+'（'+c+'🪙'+(can?'':'・還差 '+(c-S.gold))+'）</button>'; }
function costBag(){ return 30+S.bagCap*3; } function costLamp(){ return 40+S.lamp*30; } function costPick(){ return 35+S.pick*30; } function costTrap(){ return 40+S.trap*40; }
function buy(k, back){
  var c={bag:costBag,lamp:costLamp,pick:costPick,trap:costTrap}[k]();
  if(S.gold<c){ toast('還差 '+(c-S.gold)+' 🪙'); return; }
  S.gold-=c; if(k==='bag') S.bagCap+=3; if(k==='lamp'){ S.lamp++; time+=40; if(time>0) night=false; } if(k==='pick') S.pick++; if(k==='trap') S.trap++;
  save(); hud(); back();
}
function deliver(i){
  var o=orders[i], use=[];
  ['ore','obj','fish'].forEach(function(k){
    var cand=bag.filter(function(b){ return b.k===k; }).sort(function(a,b){ return (b.good?1:0)-(a.good?1:0); });
    use=use.concat(cand.slice(0,o[k]));
  });
  var base=use.reduce(function(s,b){ return s+(b.good?5:2); },0);
  var fam = o.ore>=o.obj ? 'verb' : 'noun';
  var q=pickQ(POOL[fam].fill.filter(function(x){ return x.q.length<160; }), false);
  writeOne('✍️ '+esc(o.who)+' 要你寫下來 <small>寫對整單翻倍</small>', q, function(ok){
    use.forEach(function(b){ bag.splice(bag.indexOf(b),1); });
    var got=base*(ok?2:1); S.gold+=got; orders.splice(i,1); fillOrders(); S.firstDeal=1; save(); hud();
    toast('交貨 +'+got+' 🪙'); openStall();

/* 分類（CLAUDE.md 教學鐵律）：

function classify(topic, nWrongNow){
  var t=S.topic[topic]||{r:0,w:0}, tot=t.r+t.w;
  var prevR=t.r, prevTot=tot-nWrongNow; /* 扣掉這一趟的錯來看「平常」 */
  if(nWrongNow===1 && prevTot>=5 && prevR/prevTot>=.8) return 'slip';
  var cs=S.canSay[topic];
  if(cs && Date.now()-cs.d<14*86400000) return cs.v?'auto':'concept';
  var p=topicLabel(topic).point;
  if(p && typeof gramStageOf==='function' && gramStageOf(p.id)>=3) return 'auto';

}

/* ---------- A3. 居民（路人）—— 每位居民＝scenes.js 裡「對方」那個角色 ----------
   role：你（Owen，剛搬來的人）在這個劇本扮演哪個角色；另一個角色就是居民
   ⭐ 居民名字沿用劇本裡的名字（台詞裡會叫到，例：Moi, c'est Clément Dupré.），⛔ 不改台詞      */
var PLAYER_ROLE={
  boulangerie:'client', restaurant:'client', 'restaurant-a2':'client', vetements:'client', tshirt:'client',

  {id:'proprio',  name:'La propriétaire',    spr:['d',100], lot:'home',   scenes:['logement'],                      sit:['logement']},
  {id:'thomas',   name:'Thomas',             spr:['d',98],  lot:null,     scenes:['rendez-vous','sport'],           sit:['rendez-vous','loisirs']},
  {id:'pharma',   name:'La pharmacienne',    spr:['d',100], lot:null,     scenes:['pharmacie'],                     sit:['sante']},

        Le monde en voyages）→ 不是鎮上的居民，建議做成「📮 郵局的公用電話」：打電話出去，⛔ 不算路人、不算關係值 */
];
/* 對方叫你的名字跟你不是同一個人（劇本裡你叫 M. Rousseau／monsieur Norin／Michel Barbier）：
   ① 居民說的話裡有這些名字 → 照樣顯示（那是他說的話，⛔ 不改）但標「（劇本裡的名字）」
   ② 「你」要說出別人的名字（Oui. Michel Barbier.）→ 這一格不出題，居民直接接下一句        */
var NOT_ME=/Michel Barbier|Norin|Rousseau|Joan|Loïc|Perrine/;
var REL_STAGE=[ {at:0,ic:'',   zh:'陌生'}, {at:1,ic:'🌱',zh:'認識'}, {at:6,ic:'🌿',zh:'熟客'},
                {at:14,ic:'🌳',zh:'信任'}, {at:24,ic:'🌸',zh:'朋友'} ];
var REL_GAIN={good:2, ok:1, bad:0, sceneDone:3};   /* ⛔ 沒有負數：關係只會停，不會退 */

/* ============================================================
   B. 🔀 岔路：crossroad(n)
   ============================================================ */
/* （岔路的程式在 tools/town_encounters_draft.js，這一版還沒接） */
var SCENE_BY_ID={}; (typeof SCENES!=='undefined'?SCENES:[]).forEach(function(s){ SCENE_BY_ID[s.id]=s; });

/* 存檔：S.rel[居民id] = { pts, met, sc:目前劇本, at:目前節點, done:{劇本:次數}, path:{劇本:{節點:1}}, last, mood:{d:日期, v:'warm'|'meh'} }
         S.vknown[劇本:節點] = { n:次數, last }   ← 「↷ 這句我會」的紀錄（物件形狀＋last，配合 sync 的物件合併慣例） */
function relOf(id){ S.rel=S.rel||{}; S.vknown=S.vknown||{}; return S.rel[id]||(S.rel[id]={pts:0, met:0, sc:null, at:null, done:{}, path:{}, last:0, mood:null}); }
function stageOf(pts){ var s=0; REL_STAGE.forEach(function(r,i){ if(pts>=r.at) s=i; }); return s; }
function residentById(id){ return RESIDENTS.filter(function(r){ return r.id===id; })[0]; }

/* 一個劇本裡「你」要開口的格子；good 有 1 個以上、而且有一個不是 good 的選項才算「有對錯」 */
function playerNodes(scene){
  var role=PLAYER_ROLE[scene.id], out=[];
  Object.keys(scene.nodes).forEach(function(id){ var n=scene.nodes[id];
    if(n.speaker!==role || !n.choices) return;
    var goods=n.choices.filter(function(c){ return c.tag==='good' && !c.constructed; });
    var graded=n.choices.some(function(c){ return c.tag!=='good'; });
    var clash=goods.some(function(c){ return NOT_ME.test(c.fr); });
    out.push({id:id, graded:graded, free:!graded && goods.length>=2, clash:clash});
  });
  return out;
}
/* 選下一個劇本：先把還沒走完的走完；都走過 → 回到走過的劇本，⭐ 從「還沒走過的分岔」那一格開始（feedback_play_then_memorize） */
function nextScene(R, st){
  for(var i=0;i<R.scenes.length;i++){ if(!st.done[R.scenes[i]]) return {sc:R.scenes[i], at:SCENE_BY_ID[R.scenes[i]].start}; }
  var sc=R.scenes[Math.floor(Math.random()*R.scenes.length)], S0=SCENE_BY_ID[sc], seenP=st.path[sc]||{};
  var unseen=Object.keys(S0.nodes).filter(function(k){ return !seenP[k] && S0.nodes[k].speaker===PLAYER_ROLE[sc]; });
  return {sc:sc, at:unseen.length ? findEntryBefore(S0, unseen[0]) : S0.start};
}
/* 從某個沒走過的格子往回找一個「居民先說話」的入口，讓這段對話有頭 */
function findEntryBefore(scene, target){
  var parent={}; Object.keys(scene.nodes).forEach(function(k){ var n=scene.nodes[k];
    (n.choices||[{next:n.next}]).forEach(function(c){ if(c.next && !parent[c.next]) parent[c.next]=k; }); });
  var p=parent[target]; return p || target;
}

function villager(v){
  var R=residentById(v.rid), st=relOf(R.id), today0=today();
  if(!st.sc || !SCENE_BY_ID[st.sc] || !st.at || st.at==='end'){ var nx=nextScene(R, st); st.sc=nx.sc; st.at=nx.at; }
  var scene=SCENE_BY_ID[st.sc], role=PLAYER_ROLE[scene.id];
  var MAX=2, asked=0, gained=0, anyBad=false, chat=[];
  var firstMeet=!st.met; st.met=1; if(firstMeet) st.pts=Math.max(st.pts,1);
  function head(){ var s=stageOf(st.pts); return '🧑 '+esc(R.name)+' '+(REL_STAGE[s].ic||'')+' <small>'+esc(scene.icon||'')+' '+esc(scene.fr||'')+'</small>'; }
  function bubble(who, fr){ chat.push('<div class="item"><b>'+esc(who)+'</b>：<span class="say">'+esc(fr)+'</span> '+spk(fr)+'</div>'); }
  function goodOf(n){ var g=n.choices.filter(function(c){ return c.tag==='good' && !c.constructed; }); return g[Math.floor(Math.random()*g.length)]||n.choices[0]; }
  function mark(id){ (st.path[st.sc]=st.path[st.sc]||{})[id]=1; }

  function step(){
    var n=scene.nodes[st.at];
    if(!n || n.speaker==='system' || st.at==='end') return sceneEnd();
    if(n.speaker!==role){                                   /* 居民說話：固定台詞，或居民那一方的 good 選項 */
      var c=n.line?{fr:n.line,next:n.next}:goodOf(n);
      bubble(R.name, c.fr); mark(st.at); st.at=c.next; return step();
    }
    if(n.line){ bubble('你', n.line); mark(st.at); st.at=n.next; return step(); }
    if(asked>=MAX) return pause();
    var goods=n.choices.filter(function(c){ return c.tag==='good' && !c.constructed; });
    if(goods.some(function(c){ return NOT_ME.test(c.fr); })){ var g0=goods[0]; bubble('你', g0.fr); mark(st.at); st.at=g0.next; return step(); }
    return ask(n);
  }
  function ask(n){
    var t0=Date.now(), done=false, opts=shuffle(n.choices.filter(function(c){ return !(c.constructed && c.tag==='good'); }));
    var last=chat.slice(-3).join('');
    openSheet('<h3>'+head()+'</h3>'+last+
      (n.tip?'<details class="hint"><summary>💡 情境</summary>'+esc(n.tip)+'</details>':'')+   /* 預設收起來（feedback_orientation_collapsed_by_choice） */
      '<div class="opts">'+opts.map(function(c,i){ return '<button data-i="'+i+'">'+esc(c.fr)+'</button>'; }).join('')+'</div>'+
      '<div class="fb" id="fb"></div><div class="row2"><span><button class="btn ghost" id="known">↷ 這句我會</button> <button class="btn ghost" id="bye">👋 點頭走過</button></span><span id="slot"></span></div>', true);
    sheet.querySelectorAll('.opts button').forEach(function(b){ b.onclick=function(){
      if(done) return; done=true;
      var c=opts[+b.dataset.i], ms=Date.now()-t0, graded=n.choices.some(function(x){ return x.tag!=='good'; });
      var good=c.tag==='good', best=good?c:goodOf(n);
      asked++; mark(st.at);
      /* 紀錄：沿用 town.html 的 rec（topic 用 'scene:<id>'，回顧那裡才分得出是哪個劇本） */
      if(graded) rec('q', {topic:'scene:'+scene.id, _i:'v:'+scene.id+':'+st.at, q:(chat.length?chat[chat.length-1].replace(/<[^>]+>/g,''):'')+'　→ 你要回什麼？',
                           a:best.fr, aNote:c.tag==='good'?(best.note||''):(c.note||''), say:best.fr, lesson:0},
                     c.tag!=='bad', ms, {chosen:c.fr, right:best.fr, where:'🧑 '+R.name});
      var gain=REL_GAIN[c.tag]||0; st.pts+=gain; gained+=gain; if(c.tag==='bad') anyBad=true;
      bubble('你', c.fr); speak(c.fr);
      sheet.querySelectorAll('.opts button').forEach(function(x){ var o=opts[+x.dataset.i]; if(o.tag==='good') x.classList.add('ok'); });
      if(c.tag==='bad') b.classList.add('no');
      var fb=document.getElementById('fb');
      /* 反應在居民身上：good＝笑、ok＝照樣接話但有一點怪、bad＝愣一下（⛔ 不罵他、不扣關係） */
      fb.innerHTML = c.tag==='good' ? '😊 <span class="muted">'+esc(c.zh||'')+'</span>'
        : c.tag==='ok' ? '🙂 '+esc(R.name)+' 照樣接話了。<div class="muted">'+note(c.note||'')+'</div><div>更自然：<span class="say">'+esc(best.fr)+'</span> '+spk(best.fr)+'</div>'
        : '😕 '+esc(R.name)+' 愣了一下。<div class="muted">'+note(c.note||'')+'</div><div>👉 <span class="say">'+esc(best.fr)+'</span> '+spk(best.fr)+'</div>';
      document.getElementById('known').parentNode.style.visibility='hidden';
      document.getElementById('slot').outerHTML='<button class="btn main" id="go">繼續</button>';
      document.getElementById('go').onclick=function(){ st.at=c.next; save(); step(); };
      if(c.tag==='good') setTimeout(function(){ var g=document.getElementById('go'); if(g) g.click(); }, 900);
    }; });
    /* ⭐ 跳過第一層：這一句我會 → 居民自己把話接下去（照 good 那條走），⛔ 不計分、不進回顧，記次數只拿來降低出現頻率 */
    document.getElementById('known').onclick=function(){ if(done) return; done=true;
      var k=scene.id+':'+st.at, o=S.vknown[k]||{n:0}; o.n++; o.last=Date.now(); S.vknown[k]=o;
      var g=goodOf(n); bubble('你', g.fr); mark(st.at); st.at=g.next; asked++; save(); step(); };
    /* ⭐ 跳過第二層：點頭走過 → 這段對話停在這裡，下次遇到從這裡接，⛔ 關係不變 */
    document.getElementById('bye').onclick=function(){ if(done) return; done=true; save(); closeSheet(); v.calm=25; v.wave=1.2; };
  }
  function pause(){                                          /* 一次遭遇最多回 2 句：劇本沒走完也先停，下次接著 */
    finishEncounter(false);
  }
  function sceneEnd(){
    st.done[st.sc]=(st.done[st.sc]||0)+1; st.pts+=REL_GAIN.sceneDone; gained+=REL_GAIN.sceneDone;
    st.sc=null; st.at=null; finishEncounter(true);
  }
  function finishEncounter(full){
    var before=stageOf(st.pts-gained), after=stageOf(st.pts);
    st.last=Date.now(); st.mood={d:today0, v:anyBad?'meh':'warm'}; save();
    var gift='';
    /* 禮物用金幣，⛔ 不塞進背包（背包的 obj 有陰陽性，老鼠題會拿它出題） */
    if(!anyBad && gained>0){ var g=2+stageOf(st.pts); S.gold+=g; hud(); gift='<div>🎁 '+esc(R.name)+' 請你喝了杯咖啡，還塞給你 '+g+' 🪙。</div>'; }
    var up = after>before ? '<div class="story">'+esc(R.name)+' 現在跟你是「'+REL_STAGE[after].zh+'」'+REL_STAGE[after].ic+(after===2?'——之後會到 🏪 交貨攤下訂單。':after===3?'——他好像有話想跟你說。':'')+'</div>' : '';
    openSheet('<h3>'+head()+'</h3>'+chat.slice(-4).join('')+gift+up+
      '<div class="muted">'+(full?'這段對話說完了。':'他還有話沒說完，下次遇到會接著聊。')+'</div>'+
      '<div class="row2"><span></span><button class="btn main" id="ok">再見</button></div>');
    document.getElementById('ok').onclick=function(){ closeSheet(); v.calm=25; v.wave=1.2; };
  }
  step();
}


/* ============================================================
   📖 物品圖鑑（10-16 Owen：拉力＝「看自己的地方變熱鬧」＋「把圖鑑收集完」；選動森型＝字就是那個東西）
   ⭐ 收服＝叫對 un／une；✨ 閃光＝2 秒內；🌟 進化＝同一樣東西在不同的兩天都收服（＝站穩）
   ⭐ 圖鑑收到 DEX_MILESTONE 種 → 以前的居民回到鎮上（鎮變熱鬧）。⛔ 不顯示「N／481」分母，缺的格子用剪影
   ============================================================ */
var DEX_MILESTONE=10, lastCatch=null, villagers=[], grassDist=0, lastWild=-99;
var RAR=['普通','少見','稀有'];
function rarity(it){ var l=it.lesson||0; return l>=29?2:(l>=13?1:0); }
function dexCount(){ return Object.keys(S.dex||{}).length; }
function dexCatch(it, ms){
  S.dex=S.dex||{}; var d=S.dex[it.n], t=today(), r={isNew:!d, shiny:false, evo:false};
  if(!d) d=S.dex[it.n]={t:Date.now(), days:[], shiny:0, evo:0};
  if(d.days.indexOf(t)<0){ d.days.push(t); if(d.days.length>3) d.days=d.days.slice(-3); }
  if(ms && ms<2000 && !d.shiny){ d.shiny=1; r.shiny=true; }
  if(!d.evo && d.days.length>=2){ d.evo=1; r.evo=true; }
  if(!S.built.cottage && dexCount()>=DEX_MILESTONE) S.moveIn=1;
  return r;
}
/* 出哪一隻：還沒收的 ×3（填圖鑑）、收過但今天還沒收（要進化）×2.2、已進化 ×0.35、錯過的 ×2；稀有的比較少出 */
function pickWild(){
  var gs=readLS('clb7_gender_seen'), now=Date.now(), best=null, bw=-1, t=today();
  shuffle(GENDER).slice(0,80).forEach(function(it){
    var d=(S.dex||{})[it.n], w= !d ? 3 : d.evo ? .35 : (d.days.indexOf(t)<0 ? 2.2 : .5);
    var mine=S.gword[it.n]||{}, r=gs[it.n]||{};
    if((mine.w||0)>(mine.r||0) || (r.w||0)>(r.c||r.r||0)) w*=2;
    w*=[1,.7,.45][rarity(it)];
    if(EMO[it.n]) w*=1.3;
    if(S.qlast['w:'+it.n] && now-S.qlast['w:'+it.n]<10*60000) w*=.1;
    w*=Math.random()+.3; if(w>bw){ bw=w; best=it; }
  });
  return best;
}
function wildEncounter(){
  var it=pickWild(), em=EMO[it.n]||'📦', rr=rarity(it);
  askGender('🌳 野生的 '+em+' 出現了！ <small>'+RAR[rr]+'・叫對 un／une 就收服</small>', it, function(ok,ms){
    S.qlast['w:'+it.n]=Date.now();
    if(ok===null){ closeSheet(); toast('牠鑽回草叢裡了'); return; }

    if(!ok){
      openSheet('<div class="catch"><div class="big" style="opacity:.35">'+pix(em,96)+'</div><div class="story">牠一溜煙跑回草叢了……</div><div class="muted">下次還會遇到牠。</div></div><div class="row2"><span></span><button class="btn main" id="ok">好</button></div>');
      document.getElementById('ok').onclick=closeSheet; return;
    }
    var c=lastCatch||{}, d=S.dex[it.n];
    if(bag.length<S.bagCap) bag.push({k:'obj', name:whole(it), n:it.n, g:it.g, em:em, good:true});
    hud(); save();
    var tags=(c.isNew?'<span class="tag-new">🆕 圖鑑新登錄</span>':'')+(c.shiny?'<span class="tag-new">✨ 閃光</span>':'')+(c.evo?'<span class="tag-new">🌟 進化：熟了</span>':'');
    var line=c.evo?'昨天收過的，今天又一眼認出來——這個字你站穩了。':c.isNew?'圖鑑第 '+dexCount()+' 種。':(d&&!d.evo?'明天再收一次，牠就會進化。':'');
    openSheet('<div class="catch"><div class="big"'+(d&&d.shiny?' style="filter:drop-shadow(0 0 10px #f0c95a)"':'')+'>'+pix(em,96)+'</div><div style="font-size:1.2em" class="fr">收服了！ <span class="say">'+esc(whole(it))+'</span> '+spk(whole(it))+'</div><div>'+tags+'</div><div class="muted">'+esc(it.zh)+(line?'　'+line:'')+'</div></div><div class="row2"><button class="btn ghost" id="dex">📖 看圖鑑</button><button class="btn main" id="ok">好</button></div>');
    document.getElementById('ok').onclick=closeSheet; document.getElementById('dex').onclick=openDex;
  });
}
function openDex(){
  var groups=[[],[],[]], caught=0, sh=0, ev=0;
  GENDER.forEach(function(it){ groups[rarity(it)].push(it); var d=(S.dex||{})[it.n]; if(d){ caught++; if(d.shiny) sh++; if(d.evo) ev++; } });
  var h='<h3>📖 物品圖鑑 <small>已收 '+caught+' 種'+(sh?'・✨ '+sh:'')+(ev?'・🌟 '+ev:'')+'</small></h3>';
  h+='<div class="muted">'+(!S.built.cottage?'再收 '+Math.max(0,DEX_MILESTONE-caught)+' 種，就會有人回到鎮上。':'鎮上的人慢慢回來了。之後還會有人回來。')+'　✨ 2 秒內收服＝閃光　🌟 隔天又收服＝進化</div>';
  groups.forEach(function(g,ri){

      if(!d) h+='<div class="dexcell no r'+ri+'"><div class="em">'+pix(em,40)+'</div><div>？？？</div></div>';
      else h+='<div class="dexcell r'+ri+(d.shiny?' shiny':'')+'" data-w="'+esc(whole(it))+'" data-zh="'+esc(it.zh)+'">'+(d.evo?'<span class="evo">🌟</span>':'')+'<div class="em">'+pix(em,40)+'</div><div class="fr">'+esc(whole(it))+'</div></div>';
    });

  });
  h+=bugDexHtml();

  openSheet(h, true);
  sheet.querySelectorAll('.dexcell[data-w]').forEach(function(c){ c.onclick=function(){ speak(c.dataset.w); toast(c.dataset.w+'＝'+c.dataset.zh); }; });
  document.getElementById('ok').onclick=closeSheet;
}
/* 居民回來（圖鑑里程碑） */
function spawnVillagers(){

  if(S.built.cottage) villagers.push({rid:'clement', s:['d',99], x:9.5, y:27.3, hx:9.5, hy:27.3, tx:9.5, ty:27.3, calm:1, face:1});

function updateVillagers(dt){
  for(var i=0;i<villagers.length;i++){ var v=villagers[i];
    if(v.calm>0) v.calm-=dt;
    if(Math.hypot(v.tx-v.x,v.ty-v.y)<.1 || Math.random()<dt*.15){ v.tx=v.hx+(Math.random()*3-1.5); v.ty=v.hy+(Math.random()*1.4-.4); if(blocked(v.tx,v.ty)){ v.tx=v.hx; v.ty=v.hy; } }
    var dx=v.tx-v.x, dy=v.ty-v.y, L=Math.hypot(dx,dy);
    if(L>.05){ var nx=v.x+dx/L*.8*dt, ny=v.y+dy/L*.8*dt; if(!blocked(nx,ny)){ v.x=nx; v.y=ny; } if(Math.abs(dx)>.05) v.face=dx<0?-1:1; }
    if(v.calm<=0 && !pending && Math.hypot(v.x-hero.x, v.y-hero.y)<.75){ v.calm=3; pending={t:.25, x:v.x, y:v.y-.5, fn:(function(v){ return function(){ villager(v); }; })(v)}; return true; }
  }
  return false;
}


/* ============================================================
   ❓ 方塊收服（10-16 Owen：「瑪利歐明確是因為操作那個刺激感」「先做方塊這招給我試玩」）
   野生的東西跳出來 → 旁邊冒出兩個 ❓方塊（un／une）→ 跑過去撞對的那個。⛔ 不開面板、不放倒數，牠只是會跑掉
   撞對：方塊彈起、噴金幣、收服進圖鑑；撞錯：方塊碎掉、牠溜走，這時才給正確答案＋中文（feedback_french_only_ui）
   ⭐ 不理牠＝走開，牠自己跑掉，⛔ 不記錯（跳過合法）
   ============================================================ */
var wild=null, PIXIMG={};
function pixImg(em){ if(!PIXIMG[em]){ var im=new Image(); im.src=pixURL(em); PIXIMG[em]=im; } return PIXIMG[em]; }
function freeSpot(x,y){ return x>1 && y>1 && x<W-1 && y<H-1 && !blocked(x,y) && region(Math.floor(x),Math.floor(y))!=='river'; }
function startWild(){
  var it=pickWild(), em=EMO[it.n]||'📦', f=hero.face||1;
  var cands=[[hero.x-1.9,hero.y-1.5],[hero.x+1.9,hero.y-1.5],[hero.x-1.9,hero.y+1.5],[hero.x+1.9,hero.y+1.5],[hero.x-2.4,hero.y],[hero.x+2.4,hero.y],[hero.x,hero.y-2.4],[hero.x,hero.y+2.4]].filter(function(p){ return freeSpot(p[0],p[1]); });
  var two=null;
  for(var i=0;i<cands.length && !two;i++) for(var j=i+1;j<cands.length;j++) if(Math.hypot(cands[i][0]-cands[j][0],cands[i][1]-cands[j][1])>=2.4){ two=[cands[i],cands[j]]; break; }
  /* 牠放在離兩個方塊都夠遠的地方，名字牌才不會蓋住方塊上的字 */
  var cpos=two && [[hero.x,hero.y-2.7],[hero.x+f*2.8,hero.y+.8],[hero.x-f*2.8,hero.y+.8],[hero.x,hero.y+2.6],[hero.x+f*3,hero.y-2.2],[hero.x-f*3,hero.y-2.2]].filter(function(p){
    return freeSpot(p[0],p[1]) && two.every(function(b){ return Math.hypot(p[0]-b[0],p[1]-b[1])>=1.8; }); })[0];
  var gs=shuffle(['m','f']);
  wild={it:it, em:em, x:cpos[0], y:cpos[1], t:0, phase:'idle', end:0,
        blocks:[{x:two[0][0],y:two[0][1],g:gs[0],st:'',a:0},{x:two[1][0],y:two[1][1],g:gs[1],st:'',a:0}]};
  rats.forEach(function(r){ r.calm=Math.max(r.calm,6); });
  pixImg(em);
}
function updateWild(dt){
  if(!wild) return false;
  var w=wild; w.t+=dt; w.blocks.forEach(function(b){ if(b.a>0) b.a-=dt; });
  if(w.phase==='done'){ w.end-=dt; if(w.end<=0) wild=null; return false; }
  /* 牠：先愣一下，然後慢慢往遠離你的方向跑 */
  if(w.t>1){
    var dx=w.x-hero.x, dy=w.y-hero.y, L=Math.hypot(dx,dy)||1, sp=w.phase==='dash'?5:1.25;
    var nx=w.x+dx/L*sp*dt+Math.sin(w.t*5)*.01, ny=w.y+dy/L*sp*dt;
    if(freeSpot(nx,w.y)) w.x=nx; if(freeSpot(w.x,ny)) w.y=ny;
    if(L>7.5 || w.t>9){ if(w.phase!=='dash') floatTxt(hero.x,hero.y-.8,'牠跑回草叢了','#ddd'); w.phase='done'; w.end=.4; return false; }
  }
  if(w.phase==='dash') return false;
  /* 撞方塊 */
  for(var i=0;i<w.blocks.length;i++){ var b=w.blocks[i];
    if(!b.st && Math.hypot(hero.x-b.x, hero.y-b.y)<.6){
      var ok=b.g===w.it.g, ms=Math.max(0,w.t*1000-600);
      rec('g', w.it, ok, ms, {where:'🌳 草叢'});
      S.qlast['w:'+w.it.n]=Date.now();
      var said=whole(w.it); speak(said);
      if(ok){
        b.st='hit'; b.a=.35; S.gold+=1; floatTxt(b.x,b.y-.9,'🪙+1','#ffd76a');
        if(bag.length<S.bagCap) bag.push({k:'obj', name:said, n:w.it.n, g:w.it.g, em:w.em, good:true});
        var c=lastCatch||{}, tag=(c.isNew?'🆕 圖鑑新登錄 ':'')+(c.shiny?'✨閃光 ':'')+(c.evo?'🌟進化 ':'');
        floatTxt(w.x,w.y-1,'收服！ '+said,'#fff');
        toast((tag||'收服了 ')+said+(c.isNew?'（第 '+dexCount()+' 種）':''));
        w.phase='done'; w.end=.9; w.caught=1;
      } else {
        b.st='broken'; b.a=.5; w.blocks.forEach(function(o){ if(o!==b) o.st='reveal'; });
        floatTxt(hero.x,hero.y-.9,'👉 '+said,'#ffd76a');
        toast('牠溜走了——是 '+said+'（'+w.it.zh+'）。'+genderWhy(w.it));
        w.phase='dash'; w.t=Math.max(w.t,1);
      }
      hud(); save(); return true;
    }
  }
  return false;
}
function drawWild(list,ox,oy,ts){
  if(!wild) return; var w=wild;
  w.blocks.forEach(function(b){ list.push({y:b.y+.4, f:function(){
    var px=ox+b.x*ts, py=oy+b.y*ts-(b.st==='hit'&&b.a>0?Math.sin(b.a/.35*Math.PI)*ts*.25:0), s=ts*.92;

/* ============================================================

var CONFUSE=[['suis','es','est','sommes','êtes','sont'],['ai','as','a','avons','avez','ont'],['a','à'],['le','la','les','un','une','des'],
  ['du','des','au','aux'],['mon','ma','mes','ton','ta','tes','son','sa','ses'],['ce','cette','ces'],['il','elle','ils','elles'],
  ['je','tu','nous','vous'],['à','au','aux','en','dans'],['et','est'],['ou','où'],['va','vas','vais','vont','allons','allez'],
  ['fait','fais','faites','font','faisons'],['peux','peut','peuvent','pouvons','pouvez'],['veux','veut','veulent','voulons','voulez'],
  ['pas','plus','jamais','rien'],['que','qui','quoi'],['de','du','des'],['pour','par','avec','sans'],
  ['moi','toi','lui','eux'],['me','te','se'],['ici','là'],['bon','bonne','bons','bonnes'],['petit','petite','petits','petites'],
  ['grand','grande','grands','grandes'],['nouveau','nouvelle','nouveaux'],['premier','première']];
function tileTok(a){
  return String(a).replace(/[’‘]/g,"'").split(/\s+/).map(function(t){ return t.replace(/^[«"“(]+|[.,!?;:»"”)]+$/g,''); })
    .filter(function(t){ return t && /[A-Za-zÀ-ÿ0-9]/.test(t); });
}
function tileKey(t){ return String(t).toLowerCase(); }
function tileTraps(real, lesson){
  var have={}, pool=[], out=[]; real.forEach(function(t){ have[tileKey(t)]=1; });
  real.forEach(function(t){ var k=tileKey(t); CONFUSE.forEach(function(g){ if(g.indexOf(k)>=0) g.forEach(function(x){ if(!have[x]&&pool.indexOf(x)<0) pool.push(x); }); }); });
  var want=real.length>=7?3:2;
  shuffle(pool).slice(0,want).forEach(function(x){ out.push(x); });
  if(out.length<want){   /* 同族字不夠：從同一課別題的答案裡補（真的學過的字） */
    var bag=[];
    BANK.forEach(function(q){ if(!q||typeof q.a!=='string'||q.lesson!==lesson) return;
      tileTok(q.a.split('|')[0]).forEach(function(w){ var k=tileKey(w); if(w.length>1&&!have[k]&&out.indexOf(k)<0&&bag.indexOf(k)<0) bag.push(k); }); });
    shuffle(bag).slice(0,want-out.length).forEach(function(w){ out.push(w); });
  }
  return out;
}
function lcsKeep(seq, ref){
  var n=seq.length, m=ref.length, dp=[], i, j;
  for(i=0;i<=n;i++){ var row=[]; for(j=0;j<=m;j++) row.push(0); dp.push(row); }
  for(i=1;i<=n;i++) for(j=1;j<=m;j++) dp[i][j]=(seq[i-1]===ref[j-1])?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);
  var keep=[], ii=n, jj=m;
  while(ii>0&&jj>0){ if(seq[ii-1]===ref[jj-1]){ keep.push(ii-1); ii--; jj--; } else if(dp[ii-1][jj]>=dp[ii][jj-1]) ii--; else jj--; }
  return keep.reverse();
}
var TILE_SRC=null;
function tileSources(){
  if(TILE_SRC) return TILE_SRC;
  function okN(a){ var n=tileTok(String(a).split('|')[0]).length; return n>=3&&n<=10; }
  function sentLike(x){ return x&&x.fr&&x.zh&&okN(x.fr)&&!/\s\/\s|…|\.\.\.|→|[（(]/.test(x.fr); }
  TILE_SRC={
    A: BANK.filter(function(q){ return q.type==='trans'&&typeof q.a==='string'&&q.q&&okN(q.a); }),
    S: (typeof SENTENCES!=='undefined'?SENTENCES:[]).filter(sentLike),
    C: (typeof CHUNKS!=='undefined'?CHUNKS:[]).filter(sentLike)
  };
  return TILE_SRC;
}
function tileQuestion(){
  var T=tileSources(), r=Math.random(), k=r<.34?'A':(r<.64?'S':'C');
  if(!T[k].length) k=T.A.length?'A':(T.S.length?'S':'C');
  var arr=T[k], seenT=S.tseen=S.tseen||{}, now=Date.now(), src=null;
  for(var tries=0;tries<12;tries++){ var c=arr[Math.floor(Math.random()*arr.length)], id=k==='A'?'q:'+c._i:k+':'+c.id;
    if(!seenT[id]||now-seenT[id]>36*3600000){ src=c; break; } src=c; }
  var q = k==='A' ? {zh:src.q, a:src.a, lesson:src.lesson, topic:src.topic, aNote:src.aNote||'', id:'q:'+src._i, bank:src}
                  : {zh:src.zh, a:src.fr, lesson:src.lesson, topic:'tiles', aNote:src.note||'', id:k+':'+src.id};
  var alts=String(q.a).split('|'), real=tileTok(alts[0]);
  q.full=alts[0];
  q.tiles=real.map(function(t,i){ return i===0 ? t.charAt(0).toLowerCase()+t.slice(1) : t; }).concat(tileTraps(real, q.lesson));
  q.alts=alts.map(function(a){ return tileTok(a).map(tileKey); });

}

var lastT=performance.now(), clock=0;
function update(dt){
  clock+=dt;
  floats.forEach(function(f){ f.t+=dt; }); floats=floats.filter(function(f){ return f.t<1.2; });
  if(hero.flash>0) hero.flash-=dt;
  if(busy){ hero.moving=0; return; }
  var v=pending?[0,0]:inputVec(), sp=4.3, inMag=Math.hypot(v[0],v[1]);
  var a=1-Math.exp(-dt/(inMag>.05?.08:.06));
  var wasMoving=hero.moving>.3;
  hero.vx+=(v[0]*sp-hero.vx)*a; hero.vy+=(v[1]*sp-hero.vy)*a;
  var spd=Math.hypot(hero.vx,hero.vy); hero.moving=Math.min(1,spd/sp);
  if(wasMoving && hero.moving<.15) hero.squash=.12;
  if(hero.squash>0) hero.squash-=dt;
  dusts.forEach(function(d){ d.t+=dt; }); dusts=dusts.filter(function(d){ return d.t<.45; });
  /* 遇到東西：先冒「！」、0.25 秒減速，再開面板（手感研究 8） */
  if(pending){ pending.t-=dt; if(pending.t<=0){ var f=pending.fn, keep=pending.keep; pending=null; if(!keep){ joy=null; keys={}; hero.vx=hero.vy=0; } f(); return; } }
  if(spd>0.05){
    var nx=hero.x+hero.vx*dt, ny=hero.y+hero.vy*dt;
    if(!blocked(nx,hero.y)) hero.x=nx; else nudge('y', hero.vx*dt);
    if(!blocked(hero.x,ny)) hero.y=ny; else nudge('x', hero.vy*dt);
    if(Math.abs(hero.vx)>.3) hero.face=hero.vx<0?-1:1;
    hero.bob+=dt*12*hero.moving;
    var inGrass=region(Math.floor(hero.x),Math.floor(hero.y))==='forest';
    hero.dust-=dt; if(hero.moving>.6 && hero.dust<=0){ hero.dust=.25; dusts.push({x:hero.x-hero.vx*.03, y:hero.y+.35, t:0, g:inGrass}); }
    /* 🌳 草叢：走著走著隨機跳出來（寶可夢手感） */
    if(inGrass && !pending){ grassDist+=spd*dt; if(grassDist>1.4){ grassDist=0; if(!wild && Math.random()<.28 && clock-lastWild>3){ lastWild=clock; pending={t:.3, x:hero.x, y:hero.y, fn:startWild, keep:1}; } } }
    /* 🦋 田裡偶爾飛出蝴蝶（形容詞圖鑑） */
    if(region(Math.floor(hero.x),Math.floor(hero.y))==='field' && !pending){ bugDist+=spd*dt; if(bugDist>2){ bugDist=0; if(!wild && Math.random()<.12 && clock-lastBug>25){ lastBug=clock; pending={t:.3, x:hero.x, y:hero.y, fn:bugCatch}; } } }
    if(!inTown(hero)){ time-=dt*hero.moving; if(time<=0 && !night){ time=0; night=true; toast('🌙 天黑了，老鼠變多變快——回城吧'); spawnRat(); spawnRat(); } }
    reveal();

  }
  if(S.moveIn && !S.built.cottage && !pending){ moveIn(); return; }
  if(updateVillagers(dt)) return;
  /* 進城 → 有東西就回顧 */

    if(hero.flash>0 && Math.floor(clock*20)%2) return;
    var sq=hero.squash>0?hero.squash/.12:0, im=img.apply(null,SPR.hero);
    if(im.complete){ cx.save(); cx.translate(Math.round(ox+hero.x*ts), Math.round(oy+(hero.y-b)*ts)); cx.scale((hero.face||1)*(1+.1*sq), 1-.1*sq); cx.drawImage(im,-ts/2,-ts*.62,ts,ts); cx.restore(); }
    if(pending){ cx.font='bold '+Math.round(ts*.45)+'px system-ui'; cx.textAlign='center'; cx.fillStyle='#000'; cx.fillText('！',ox+hero.x*ts+DPR,oy+(hero.y-.75)*ts+DPR); cx.fillStyle='#f0c95a'; cx.fillText('！',ox+hero.x*ts,oy+(hero.y-.75)*ts); }
  }});
  list.sort(function(a,b){ return a.y-b.y; }).forEach(function(o){ o.f(); });
  /* 浮字 */
  cx.textAlign='center'; cx.font='bold '+Math.round(ts*.32)+'px system-ui';
  floats.forEach(function(f){ cx.globalAlpha=Math.max(0,1-f.t/1.2); cx.fillStyle='#000'; cx.fillText(f.txt, ox+f.x*ts+DPR, oy+(f.y-f.t*.8)*ts+DPR); cx.fillStyle=f.c; cx.fillText(f.txt, ox+f.x*ts, oy+(f.y-f.t*.8)*ts); });
  cx.globalAlpha=1;
  /* 夜晚 */
  var dusk=Math.max(0, 1-time/40); if(dusk>0){ cx.fillStyle='rgba(8,12,45,'+(dusk*.5)+')'; cx.fillRect(0,0,w,h); }
  /* 霧 */
  for(var y3=y0;y3<=y1;y3++) for(var x3=x0;x3<=x1;x3++){ if(seen[y3*W+x3]!=='1'){ cx.fillStyle='rgba(6,9,7,.92)'; cx.fillRect(Math.floor(ox+x3*ts),Math.floor(oy+y3*ts),Math.ceil(ts),Math.ceil(ts)); } }
  /* 金色箭頭 */
  var qi=questInfo(); if(qi.to && !busy) drawArrow(qi.to,ox,oy,ts,w,h);
  /* 搖桿 */
  if(joy){ cx.strokeStyle='rgba(255,255,255,.35)'; cx.lineWidth=3*DPR; cx.beginPath(); cx.arc(joy.ox*DPR,joy.oy*DPR,40*DPR,0,7); cx.stroke();
    var dx=joy.x-joy.ox, dy=joy.y-joy.oy, L=Math.hypot(dx,dy), m=Math.min(L,40)/(L||1);
    cx.fillStyle='rgba(255,255,255,.4)'; cx.beginPath(); cx.arc((joy.ox+dx*m)*DPR,(joy.oy+dy*m)*DPR,22*DPR,0,7); cx.fill(); }
}
function drawTile(d,x,y,ox,oy,ts){ return function(){ var im=img(d[0],d[1]); if(im.complete) cx.drawImage(im,Math.floor(ox+x*ts),Math.floor(oy+y*ts),Math.ceil(ts),Math.ceil(ts)); }; }
function drawSprite(s,x,y,ox,oy,ts,face,bob){ return function(){
  var im=img(s[0],s[1]); if(!im.complete) return;
  var px=ox+x*ts, py=oy+(y-bob)*ts;
  cx.save(); cx.translate(Math.floor(px),Math.floor(py)); cx.scale(face||1,1); cx.drawImage(im,-ts/2,-ts*.62,ts,ts); cx.restore(); }; }
function drawNode(n,ox,oy,ts){ return function(){
  var px=ox+n.x*ts, py=oy+n.y*ts;
  if(n.k==='fish'){
    if(n.done) return;
    var r=ts*(.25+.12*Math.sin(clock*3+n.x)); cx.strokeStyle='rgba(255,255,255,.7)'; cx.lineWidth=2*DPR; cx.beginPath(); cx.ellipse(px+ts/2,py+ts/2,r*1.4,r*.6,0,0,7); cx.stroke();
    cx.fillStyle='rgba(20,40,80,.5)'; cx.beginPath(); cx.ellipse(px+ts/2+Math.sin(clock+n.x)*ts*.15,py+ts*.55,ts*.18,ts*.07,0,0,7); cx.fill();
    return;
  }
  var im=img.apply(null, n.k==='rock'?SPR.ore:SPR.bush);
  cx.globalAlpha=n.done?.35:1; if(im.complete) cx.drawImage(im,Math.floor(px),Math.floor(py),Math.ceil(ts),Math.ceil(ts)); cx.globalAlpha=1;
  if(!n.done){ var sy=Math.sin(clock*4+n.x)*ts*.06; cx.fillStyle=isStar(n)?'#f0c95a':'#fff'; cx.font=Math.round(ts*.3)+'px system-ui'; cx.textAlign='center'; cx.fillText(isStar(n)?'★':'✦', px+ts*.82, py+ts*.18+sy); }
}; }
function drawClue(c,ox,oy,ts){ return function(){
  var px=ox+c.x*ts+ts/2, py=oy+c.y*ts+ts/2, g=.5+.5*Math.sin(clock*3);
  cx.fillStyle='rgba(240,201,90,'+(.25+.25*g)+')'; cx.beginPath(); cx.arc(px,py,ts*.45,0,7); cx.fill();
  cx.font=Math.round(ts*.55)+'px system-ui'; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText('📜',px,py); cx.textBaseline='alphabetic';
}; }
var ROOF={red:{top:[52,53,54],bot:[64,65,66],wall:[72,85,73]}, gray:{top:[48,49,50],bot:[60,61,62],wall:[76,89,77]}};
function drawLot(k,ox,oy,ts){ return function(){
  var L=LOTS[k], R=ROOF[L.roof], px=ox+L.x*ts, py=oy+L.y*ts, s=Math.ceil(ts);
  if(S.built[k]){
    for(var i=0;i<3;i++){ [R.top,R.bot,R.wall].forEach(function(row,j){ var im=img('t',row[i]); if(im.complete) cx.drawImage(im,Math.floor(px+i*ts),Math.floor(py+j*ts),s,s); }); }
    var o=starsOf(k); if(o){ cx.font=Math.round(ts*.32)+'px system-ui'; cx.textAlign='center'; var st=''; for(var q=0;q<3;q++) st+=q<o.s?'★':'☆'; cx.fillStyle='#000'; cx.fillText(st,px+ts*1.5+DPR,py-ts*.08+DPR); cx.fillStyle='#f0c95a'; cx.fillText(st,px+ts*1.5,py-ts*.08); }
  } else {
    [[0,2,'t',92],[2,2,'t',92],[1,1,'t',44],[0,1,'t',47]].forEach(function(p){ var im=img(p[2],p[3]); if(im.complete) cx.drawImage(im,Math.floor(px+p[0]*ts),Math.floor(py+p[1]*ts),s,s); });
    var sg=img('t',83); if(sg.complete) cx.drawImage(sg,Math.floor(px+ts),Math.floor(py+2*ts),s,s);
  }
  cx.font='bold '+Math.round(ts*.26)+'px system-ui'; cx.textAlign='center'; var label=k==='cottage'?(S.built[k]?'🏡 Clément 的小屋':'🏚 空著的小屋'):(S.built[k]?'':'重建 ')+L.name;
  var tw=cx.measureText(label).width+ts*.2; cx.fillStyle='rgba(0,0,0,.55)'; cx.fillRect(px+ts*1.5-tw/2, py+ts*3.05, tw, ts*.36);
  cx.fillStyle='#fff'; cx.fillText(label, px+ts*1.5, py+ts*3.32);
}; }
function drawArrow(to,ox,oy,ts,w,h){
  var tx=ox+to.x*ts, ty=oy+to.y*ts, m=40*DPR, b=Math.sin(clock*5)*6*DPR;
  cx.fillStyle='#f0c95a'; cx.strokeStyle='#000'; cx.lineWidth=2*DPR;
  if(tx>m&&tx<w-m&&ty>m*2.5&&ty<h-m){
    cx.beginPath(); cx.moveTo(tx,ty-ts*.55+b); cx.lineTo(tx-ts*.22,ty-ts*.9+b); cx.lineTo(tx+ts*.22,ty-ts*.9+b); cx.closePath(); cx.fill(); cx.stroke(); return;
  }
  var cx0=w/2, cy0=h/2, a=Math.atan2(ty-cy0, tx-cx0), R=Math.min(w/2-m, h/2-m*2);
  var ax=cx0+Math.cos(a)*R, ay=cy0+Math.sin(a)*R;
  cx.save(); cx.translate(ax,ay); cx.rotate(a); cx.beginPath(); cx.moveTo(18*DPR+b,0); cx.lineTo(-8*DPR+b,-12*DPR); cx.lineTo(-8*DPR+b,12*DPR); cx.closePath(); cx.fill(); cx.stroke(); cx.restore();
}
function loop(t){
  var dt=Math.min(.05,(t-lastT)/1000); lastT=t;
  update(dt); draw(dt);
  requestAnimationFrame(loop);
}

/* 按鈕 */
document.getElementById('bHome').onclick=function(){ if(busy) return; if(inTown(hero)){ toast('已經在小鎮裡了'); return; }
  fade(function(){ hero.x=PLAZA.x; hero.y=PLAZA.y; cam.x=hero.x; cam.y=hero.y; time=Math.max(0,time-5); }); };
document.getElementById('bRest').onclick=rest;
document.getElementById('bDex').onclick=function(){ if(!busy) openDex(); };

/* 開場 */
if(window.GameLog) GameLog.start('town');
resize(); buildWorld(); initSeen(); newDay(true); reveal(); cam.x=hero.x; cam.y=hero.y;
Object.keys(SPR).forEach(function(k){ img.apply(null,SPR[k]); });
requestAnimationFrame(loop);
setTimeout(function(){ document.getElementById('toast').style.opacity=0; },4000);
if(!S.intro){ S.intro=1; save();
  openSheet('<h3>🏘️ Val-Brume</h3><div class="story">你剛搬到魁北克一個沒落的小鎮 Val-Brume，人幾乎都走光了。<br>鎮外的森林裡藏著各種東西——把它們一樣一樣收進 📖 圖鑑，鎮上的人就會慢慢回來。</div>'+
    '<div class="muted">按住畫面任何地方拖曳就能走（電腦用方向鍵）。走到 🌳 ⛏ 旁邊會自動開始；跟著上方的 🎯 和金色箭頭走。</div><div class="row2"><span></span><button class="btn main" id="ok">出發</button></div>');
  document.getElementById('ok').onclick=function(){ unlockTts(); closeSheet(); }; }

</script>

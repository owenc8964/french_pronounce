/* 多種說法任一個對就算對（日期可以不加 le、價錢可以加 centimes／et … centimes） */
function numJudgeAny(v, alts){ var best=null; for(var i=0;i<alts.length;i++){ var J=numJudge(v, alts[i]); if(J.ok && !J.note) return J; if(J.ok && !best) best=J; } return best||{ok:false, note:''}; }
var NUM_CHAIN=2;   /* 10-28 Owen 嫌太頻繁：連問 3 → 2、間隔 30 → 90 秒、機率 .18 → .12 */
/* 🔢 連問＋集點卡（10-19 Owen：「答對好像不能幹嘛」）
   ⭐ 答對後店家接著問「Et ça ?」，一次最多 3 個，金幣 1→2→3
   ⭐ 集點卡：答對又在 3 秒內開始打＝蓋章（0–99 每個數字一格＋年份）；一整排（例如 70–79）蓋滿 +10🪙；打錯會把那一格的章洗掉 */
function numStamp(n, fast, ok){
  S.numCard=S.numCard||{};
  if(!ok){ if(S.numCard[n]){ delete S.numCard[n]; return 'lost'; } return ''; }
  if(!fast || S.numCard[n]) return '';
  S.numCard[n]=Date.now();
  if(n<100){ var row=Math.floor(n/10), full=true; for(var k=row*10;k<row*10+10;k++) if(!S.numCard[k]) full=false;
    if(full){ S.gold+=10; return 'row'+row; } }
  return 'new';
}
function numEncounter(chain){
  chain=chain||1;
  var n=numPick(), I=numItem(n), ans=I.ans[0], t0=Date.now(), fk=0, rc={kind:'🔢 數字', ref:'n:'+n, q:I.show, a:ans};
  var who=numEncounter.who=chain>1?numEncounter.who:['la boulangère','le marchand','Madame Roy','Julie'][Math.floor(Math.random()*4)];
  var askTxt=chain>1?'Et ça ?':I.ask;
  openSheet('<h3>🔢 '+esc(who)+'：« '+askTxt+' » <small>'+(chain>1?'連問 '+chain+'／'+NUM_CHAIN:'')+'</small></h3>'+
    '<div class="qtext" style="text-align:center;font-size:2.4em;letter-spacing:2px">'+esc(I.show)+'</div>'+
    '<input class="fill" id="nin" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" lang="fr" placeholder="用法文打出來（空格或連字號都可以）">'+
    '<div class="fb" id="fb"></div><div class="row2"><button class="btn ghost" id="skip">↷ 繞過</button><button class="btn main" id="nsub">回答</button></div>'+repSlot(rc));
  var inp=document.getElementById('nin'), sent=false; setTimeout(function(){ inp.focus(); },50);
  inp.addEventListener('keydown', function(e){ if(!fk && e.key.length===1) fk=Date.now()-t0; if(e.key==='Enter') sub(); });
  document.getElementById('skip').onclick=function(){ if(sent) return; sent=true; if(window.GameLog) GameLog.answer(null,{kind:'🔢 數字', ref:rc.ref}); closeSheet(); };
  function sub(){ var v=inp.value.trim(); if(!v||sent) return; sent=true; inp.disabled=true; rc.pick=v;
    var ms=Date.now()-t0, J=numJudgeAny(v, I.ans), ok=J.ok, fast=!!fk && fk<3000;
    var Wl=S.numWrong=S.numWrong||[], wi=Wl.indexOf(n);
    if(!ok && wi<0){ Wl.push(n); if(Wl.length>30) Wl.shift(); } else if(ok && !J.note && wi>=0 && fast) Wl.splice(wi,1);
    S.num=S.num||{}; var h=S.num[n]||[]; h.push({o:ok?1:0, f:fk||ms}); S.num[n]=h.slice(-3);
    var st=typeof n==='number'?numStamp(n, fast && !J.note, ok):'';
    if(ok){ S.gold+=chain; } save(); hud();
    if(window.GameLog) GameLog.answer(ok, {kind:'🔢 數字', topic:'numbers', ref:rc.ref, ms:fk||ms, q:I.show, a:ans, pick:v});
    speak(ans);
    var stTxt= st==='new' ? '　🔖 集點卡 +1' : /^row/.test(st) ? '　🎉 集點卡 '+(+st.slice(3)*10)+'–'+(+st.slice(3)*10+9)+' 蓋滿了！+10🪙' : st==='lost' ? '　（這一格的章掉了）' : '';
    document.getElementById('fb').innerHTML=(ok?'✓ +'+chain+'🪙 '+(fk&&fk<2000?'<b style="color:var(--gold)">起手 '+(fk/1000).toFixed(1)+' 秒</b> ':''):'👉 ')+'<span class="say">'+esc(ans)+'</span> '+spk(ans)+
      (J.note?'<div class="muted">'+esc(J.note)+'</div>':'')+(stTxt?'<div class="muted">'+stTxt+'</div>':'');
    var more = ok && chain<NUM_CHAIN;
    if(ok && !J.note && !stTxt.match(/蓋滿/)) setTimeout(function(){ if(more) numEncounter(chain+1); else closeSheet(); }, 850);
    else { document.querySelector('.row2').innerHTML='<span></span><button class="btn main" id="go">'+(more?'下一個 →':'好')+'</button>'; document.getElementById('go').onclick=function(){ if(more) numEncounter(chain+1); else closeSheet(); }; }
  }
  document.getElementById('nsub').onclick=sub;
}
function numCardHtml(){
  var c=S.numCard||{}, h='<div class="dexhead">🔖 數字集點卡（答對又在 3 秒內開始打＝蓋章，一排蓋滿 +10🪙）</div><div class="numcard">';
  for(var n=0;n<100;n++) h+='<span class="'+(c[n]?'on':'')+'">'+n+'</span>';
  var yrs=Object.keys(c).filter(function(k){ return +k>=1900; }).sort();
  return h+'</div>'+(yrs.length?'<div class="muted">年份：'+yrs.join('、')+'</div>':'');
}
function drawChallenges(list,ox,oy,ts){
  CHALLENGES.forEach(function(ch){ list.push({y:ch.y+1, f:function(){
    var px=ox+ch.x*ts, py=oy+ch.y*ts, im=pixImg(ch.em);
    if(ch.kind==='palace'){ /* 木碼頭：從岸邊伸進河裡 */
      cx.fillStyle='#5a3d1e'; cx.fillRect(px+ts*.18, py-ts*1.1, ts*.08, ts*1.25); cx.fillRect(px+ts*.74, py-ts*1.1, ts*.08, ts*1.25);
      cx.fillStyle='#9a7040'; for(var k=0;k<5;k++) cx.fillRect(px+ts*.12, py-ts*1.05+k*ts*.27, ts*.76, ts*.2); }
    cx.fillStyle='#7a5a32'; cx.fillRect(px+ts*.05, py+ts*.55, ts*.9, ts*.38);
    if(im.complete){ cx.drawImage(im, px+ts*.05, py+ts*.05, ts*.9, ts*.9); }
    var b=Math.sin(clock*4)*ts*.06; cx.font=Math.round(ts*.38)+'px system-ui'; cx.textAlign='center'; cx.fillText({tiles:'🧩', isle:'💬', spot:'🔍', embed:'⭐', palace:'⛵', forge:'⚡'}[ch.kind]||'⚔️', px+ts*.5, py-ts*.05+b);
    cx.font='bold '+Math.round(ts*.24)+'px Cubic11, system-ui'; var lab=ch.name; var tw=cx.measureText(lab).width+ts*.2;
    cx.fillStyle='rgba(0,0,0,.55)'; cx.fillRect(px+ts*.5-tw/2, py+ts*1.02, tw, ts*.34); cx.fillStyle='#fff'; cx.fillText(lab, px+ts*.5, py+ts*1.27);
  }}); });
}

/* ============================================================
   主迴圈：移動、碰撞、觸發、老鼠、鏡頭、繪製
   ============================================================ */
var lastT=performance.now(), clock=0;
function update(dt){
  clock+=dt;
  floats.forEach(function(f){ f.t+=dt; }); floats=floats.filter(function(f){ return f.t<1.2; });
  if(hero.flash>0) hero.flash-=dt;
  if(busy){ hero.moving=0; return; }
  var v=pending?[0,0]:inputVec(), sp=4.3, inMag=Math.hypot(v[0],v[1]);
  var a=1-Math.exp(-dt/(inMag>.05?.08:.06));
  var wasMoving=hero.moving>.3;
  hero.vx+=(v[0]*sp-hero.vx)*a; hero.vy+=(v[1]*sp-hero.vy)*a;
  var spd=Math.hypot(hero.vx,hero.vy); hero.moving=Math.min(1,spd/sp);
  if(wasMoving && hero.moving<.15) hero.squash=.12;
  if(hero.squash>0) hero.squash-=dt;
  dusts.forEach(function(d){ d.t+=dt; }); dusts=dusts.filter(function(d){ return d.t<.45; });
  /* 遇到東西：先冒「！」、0.25 秒減速，再開面板（手感研究 8） */
  if(pending){ pending.t-=dt; if(pending.t<=0){ var f=pending.fn, keep=pending.keep; pending=null; if(!keep){ joy=null; keys={}; hero.vx=hero.vy=0; } f(); return; } }
  if(spd>0.05){
    var nx=hero.x+hero.vx*dt, ny=hero.y+hero.vy*dt;
    if(!blocked(nx,hero.y)) hero.x=nx; else nudge('y', hero.vx*dt);
    if(!blocked(hero.x,ny)) hero.y=ny; else nudge('x', hero.vy*dt);
    if(Math.abs(hero.vx)>.3) hero.face=hero.vx<0?-1:1;
    hero.bob+=dt*12*hero.moving;
    var inGrass=region(Math.floor(hero.x),Math.floor(hero.y))==='forest';
    hero.dust-=dt; if(hero.moving>.6 && hero.dust<=0){ hero.dust=.25; dusts.push({x:hero.x-hero.vx*.03, y:hero.y+.35, t:0, g:inGrass}); }
    /* 🌳 草叢：走著走著隨機跳出來（寶可夢手感） */
    if(inGrass && !pending){ grassDist+=spd*dt; if(grassDist>1.4){ grassDist=0; if(!wild && Math.random()<.28 && clock-lastWild>3){ lastWild=clock; pending={t:.3, x:hero.x, y:hero.y, fn:startWild, keep:1}; } } }
    /* 🔢 鎮上／往橋的小路上，偶爾有人問價錢 */
    var onPath=Math.floor(hero.x)>=19 && Math.floor(hero.x)<=20 && hero.y>=10 && hero.y<=23;
    if((inTown(hero)||onPath) && !pending){ numDist+=spd*dt; if(numDist>2){ numDist=0; if(!wild && Math.random()<.12 && clock-lastNum>90){ lastNum=clock; pending={t:.3, x:hero.x, y:hero.y, fn:function(){ numEncounter(1); }}; } } }
    /* 🦋 田裡偶爾飛出蝴蝶（形容詞圖鑑） */
    if(region(Math.floor(hero.x),Math.floor(hero.y))==='field' && !pending){ bugDist+=spd*dt; if(bugDist>2){ bugDist=0; if(!wild && Math.random()<.12 && clock-lastBug>25){ lastBug=clock; pending={t:.3, x:hero.x, y:hero.y, fn:bugCatch}; } } }
    if(!inTown(hero)){ time-=dt*hero.moving; if(time<=0 && !night){ time=0; night=true; toast(raidDue()?'🌙 天黑了——怪物朝小鎮來了，回去守夜！':'🌙 天黑了，老鼠變多變快——回城吧'); spawnRat(); spawnRat(); } }
    reveal();
    if(Math.random()<dt) { save(); hud(); }
  }
  if(S.moveIn && !S.built.cottage && !pending){ moveIn(); return; }
  if(updateVillagers(dt)) return;
  /* 進城 → 有東西就回顧 */
  var it=inTown(hero);
  if(it && !wasInTown){ wasInTown=true; if(log.some(function(l){ return l.ok===false; }) || log.length>=6){ joy=null; keys={}; review(); return; } if(night && raidDue()){ joy=null; keys={}; raidPanel(false); return; } if(maybeNews()) return; }
  if(!it) wasInTown=false;
  if(updateWild(dt)) return;
  for(var ci=0;ci<CHALLENGES.length && !wild;ci++){ var CH=CHALLENGES[ci]; if(CH.cool>0){ CH.cool-=dt; continue; }
    /* 10-26 Owen：「站在宮殿門口會一直進去，只能重新整理」→ 出來之後要先走開（離門口 1.5 格以上）才會再觸發 */
    if(CH.away){ if(Math.hypot(CH.x+.5-hero.x, CH.y+.5-hero.y)>1.5) CH.away=0; else continue; }
    if(Math.hypot(CH.x+.5-hero.x, CH.y+.5-hero.y)<.8 && !pending){ pending={t:.25, x:CH.x+.5, y:CH.y, fn:(function(CH){ return function(){ if(CH.kind==='tiles') tilesPanel(CH); else if(CH.kind==='isle') cafePanel(CH); else if(CH.kind==='spot') spotPanel(CH); else if(CH.kind==='embed') embedPanel(CH); else if(CH.kind==='palace'){ CH.away=1; archOpen(); } else if(CH.kind==='forge'){ CH.away=1; forgePanel(CH); } else challengePanel(CH); }; })(CH)}; break; } }
  /* 碰到節點 */
  for(var i=0;i<nodes.length && !wild;i++){ var n=nodes[i]; if(n.done) continue;
    var R=n.k==='fish'?1.15:.85;
    if(Math.hypot(n.x+.5-hero.x, n.y+.5-hero.y)<R){
      if(n.k==='fish' && hero.y>8) continue;
      if(bag.length>=S.bagCap){ if(!n.warn){ toast('🎒 背包滿了——回城交貨吧'); n.warn=1; } continue; }
      n.warn=0; if(pending) return;
      pending={t:.25, x:n.x+.5, y:n.y, fn:(function(n){ return function(){ if(n.k==='rock') mineRock(n); else if(n.k==='bush') shakeBush(n); else fishSpot(n); }; })(n)};
      return;
    }
  }
  /* 紙條（郵局蓋好、信讀過才出現） */
  if(S.letter) for(var c=0;c<CLUES.length;c++){ var C=CLUES[c]; if(S.clues[C.id]) continue; if(C.cool>0){ C.cool-=dt; continue; }
    if(Math.hypot(C.x+.5-hero.x, C.y+.5-hero.y)<.8){ if(!pending) pending={t:.25, x:C.x+.5, y:C.y, fn:(function(C){ return function(){ readClue(C); }; })(C)}; return; } }
  /* 門口 */
  /* 門口：⭐ 要「往上推」（往門的方向走）才會進門，路過不會跳出來 */
  var at=null, push=v[1]<-.35;
  for(var k in LOTS){ var d=LOTS[k].door; if(Math.abs(d[0]+.5-hero.x)<.6 && hero.y>d[1] && hero.y<d[1]+.9) at=k; }
  if(!S.built.bridge && Math.abs(BRIDGE.door[0]-hero.x)<1 && hero.y<10.8) at='bridge';
  if(!push && at!==lastDoor) at=null;
  if(at && at!==lastDoor){ lastDoor=at; joy=null; keys={};
    if(at==='bridge') buildPanel('北邊的橋', BRIDGE.cost, null, function(){ S.built.bridge=1; applyBuildings(); });
    else if(at==='stall' && log.length) review();
    else openLot(at);
    return; }
  if(!at) lastDoor=null;
  /* 老鼠 */
  rats.forEach(function(r){
    if(r.calm>0) r.calm-=dt; if(r.flee>0) r.flee-=dt;
    var chase = r.calm<=0 && bag.length && !inTown(hero) && Math.hypot(hero.x-r.x,hero.y-r.y)<(night?7:4.5) && Math.random()<(S.trap? .6 : 1);
    var tx=r.tx, ty=r.ty, spd=night?3.4:2.1;
    if(r.flee>0){ tx=r.x+(r.x-hero.x); ty=r.y+(r.y-hero.y); spd=5; }
    else if(chase){ tx=hero.x; ty=hero.y; }
    else if(Math.hypot(tx-r.x,ty-r.y)<.3 || Math.random()<dt*.3){ r.tx=14+Math.random()*13; r.ty=(night?11:11)+Math.random()*11; spd=1.2; }
    else spd=1.2;
    var dx=tx-r.x, dy=ty-r.y, L=Math.hypot(dx,dy)||1, nx=r.x+dx/L*spd*dt, ny=r.y+dy/L*spd*dt;
    var okR=function(x,y){ var reg=region(Math.floor(x),Math.floor(y)); return !blocked(x,y) && reg!=='town' && reg!=='river' && (night || reg==='field'); };
    if(okR(nx,r.y)) r.x=nx; if(okR(r.x,ny)) r.y=ny;
    if(Math.abs(dx)>.05) r.face=dx<0?-1:1;
  });
  for(var j=0;j<rats.length;j++){ var r=rats[j];
    if(!wild && r.calm<=0 && bag.length && !inTown(hero) && Math.hypot(hero.x-r.x,hero.y-r.y)<.55){ joy=null; keys={}; ratSteal(r); return; } }
}

function draw(dt){
  var w=cv.width, h=cv.height, ts=TS*DPR;
  var la=1-Math.exp(-3*dt); hero.lx+=(hero.vx*.3-hero.lx)*la; hero.ly+=(hero.vy*.3-hero.ly)*la;
  var k=1-Math.exp(-8*dt); cam.x+=(hero.x+hero.lx-cam.x)*k; cam.y+=(hero.y+hero.ly-cam.y)*k;
  var ox=Math.round(w/2-cam.x*ts), oy=Math.round(h/2-cam.y*ts);
  cx.imageSmoothingEnabled=false;
  cx.fillStyle='#0b0f0c'; cx.fillRect(0,0,w,h);
  var x0=Math.max(0,Math.floor(-ox/ts)), y0=Math.max(0,Math.floor(-oy/ts)), x1=Math.min(W-1,Math.ceil((w-ox)/ts)), y1=Math.min(H-1,Math.ceil((h-oy)/ts));
  /* 地面 */
  for(var y=y0;y<=y1;y++) for(var x=x0;x<=x1;x++){
    var g=ground[y][x], px=Math.floor(ox+x*ts), py=Math.floor(oy+y*ts), s=Math.ceil(ts);
    if(g==='water'){ cx.fillStyle='#3a74c4'; cx.fillRect(px,py,s,s); cx.fillStyle='rgba(255,255,255,.18)'; var wv=Math.sin(clock*2+x*.9+y)*ts*.18; cx.fillRect(px+ts*.2+wv,py+ts*.35,ts*.35,DPR*2); cx.fillRect(px+ts*.55-wv,py+ts*.72,ts*.3,DPR*2); }
    else { var im=img(g[0],g[1]); if(im.complete) cx.drawImage(im,px,py,s,s); }
  }
  /* 橋 */
  for(var by=8;by<=9;by++) for(var bx=19;bx<=20;bx++){ var px2=ox+bx*ts, py2=oy+by*ts;
    if(S.built.bridge){ cx.fillStyle='#8a5a32'; cx.fillRect(px2,py2,ts+1,ts+1); cx.fillStyle='#6b4224'; for(var l=0;l<4;l++) cx.fillRect(px2,py2+l*ts/4,ts+1,DPR*2); }
    else if(by===9 && bx===19){ cx.fillStyle='#6b4224'; cx.fillRect(px2+ts*.1,py2+ts*.5,ts*.2,ts*.5); cx.fillRect(px2+ts*1.7,py2+ts*.5,ts*.2,ts*.5); } }
  /* 要排序的東西（依 y） */
  var list=[];
  for(var y2=y0;y2<=y1;y2++) for(var x2=x0;x2<=x1;x2++){ var d=deco[y2][x2]; if(d) list.push({y:y2+1, f:drawTile(d,x2,y2,ox,oy,ts)}); }
  for(var k in LOTS) list.push({y:LOTS[k].y+3, f:drawLot(k,ox,oy,ts)});
  nodes.forEach(function(n){ list.push({y:n.y+1, f:drawNode(n,ox,oy,ts)}); });
  if(S.letter) CLUES.forEach(function(c){ if(!S.clues[c.id]) list.push({y:c.y+1, f:drawClue(c,ox,oy,ts)}); });
  npcs.forEach(function(p){ list.push({y:p.y, f:drawSprite(p.s,p.x,p.y,ox,oy,ts,1,Math.sin(clock*2+p.x)*.03)}); });
  villagers.forEach(function(v){ list.push({y:v.y, f:function(){ drawSprite(v.s,v.x,v.y,ox,oy,ts,v.face,Math.abs(Math.sin(clock*6))*.04)();
    var R=residentById(v.rid), st=relOf(v.rid), lab=(st.met?R.name:'？')+' '+(REL_STAGE[stageOf(st.pts)].ic||'');
    cx.font='bold '+Math.round(ts*.24)+'px system-ui'; cx.textAlign='center'; var tw=cx.measureText(lab).width+ts*.15;
    cx.fillStyle='rgba(0,0,0,.55)'; cx.fillRect(ox+v.x*ts-tw/2, oy+(v.y-1.05)*ts, tw, ts*.32); cx.fillStyle='#fff'; cx.fillText(lab, ox+v.x*ts, oy+(v.y-.82)*ts);
    if(!st.met){ cx.font=Math.round(ts*.4)+'px system-ui'; cx.fillText('💬', ox+v.x*ts+ts*.45, oy+(v.y-.6)*ts+Math.sin(clock*4)*ts*.05); } }}); });
  rats.forEach(function(r){ list.push({y:r.y, f:drawSprite(SPR.rat,r.x,r.y,ox,oy,ts,r.face,Math.abs(Math.sin(clock*14))*.06)}); });
  drawWild(list,ox,oy,ts);
  drawChallenges(list,ox,oy,ts);
  list.push({y:hero.y, f:function(){
    var b=hero.moving>.05?Math.abs(Math.sin(hero.bob))*.12:Math.sin(clock*2)*.02;
    cx.fillStyle='rgba(0,0,0,.25)'; cx.beginPath(); cx.ellipse(ox+hero.x*ts, oy+hero.y*ts+ts*.38, ts*.28, ts*.1, 0, 0, 7); cx.fill();
    dusts.forEach(function(d){ cx.fillStyle=(d.g?'rgba(120,200,110,':'rgba(230,210,170,')+(.5*(1-d.t/.45))+')'; cx.beginPath(); cx.arc(ox+d.x*ts, oy+d.y*ts-d.t*ts*.3, ts*(.06+d.t*.12), 0, 7); cx.fill(); });
    if(hero.flash>0 && Math.floor(clock*20)%2) return;
    var sq=hero.squash>0?hero.squash/.12:0, im=img.apply(null,SPR.hero);
    if(im.complete){ cx.save(); cx.translate(Math.round(ox+hero.x*ts), Math.round(oy+(hero.y-b)*ts)); cx.scale((hero.face||1)*(1+.1*sq), 1-.1*sq); cx.drawImage(im,-ts/2,-ts*.62,ts,ts); cx.restore(); }
    if(pending){ cx.font='bold '+Math.round(ts*.45)+'px system-ui'; cx.textAlign='center'; cx.fillStyle='#000'; cx.fillText('！',ox+hero.x*ts+DPR,oy+(hero.y-.75)*ts+DPR); cx.fillStyle='#f0c95a'; cx.fillText('！',ox+hero.x*ts,oy+(hero.y-.75)*ts); }
  }});
  list.sort(function(a,b){ return a.y-b.y; }).forEach(function(o){ o.f(); });
  /* 浮字 */
  cx.textAlign='center'; cx.font='bold '+Math.round(ts*.32)+'px system-ui';
  floats.forEach(function(f){ cx.globalAlpha=Math.max(0,1-f.t/1.2); cx.fillStyle='#000'; cx.fillText(f.txt, ox+f.x*ts+DPR, oy+(f.y-f.t*.8)*ts+DPR); cx.fillStyle=f.c; cx.fillText(f.txt, ox+f.x*ts, oy+(f.y-f.t*.8)*ts); });
  cx.globalAlpha=1;
  /* 天色（10-28 Owen：「天亮天黑應該也要有」）：一天剛開始是金黃的晨光 → 白天 → 後段轉成午後的橘 → 最後 40 秒入夜。
     ⭐ 晚上不是整片黑：角色身邊一圈亮、鎮上的家門口亮著燈 */
  var fr=Math.max(0,Math.min(1,time/dayLen()));
  if(fr>.85){ cx.fillStyle='rgba(255,196,110,'+((fr-.85)/.15*.2).toFixed(3)+')'; cx.fillRect(0,0,w,h); }
  else if(fr<.4 && time>=40){ cx.fillStyle='rgba(255,130,50,'+((.4-fr)/.4*.16).toFixed(3)+')'; cx.fillRect(0,0,w,h); }
  var dusk=night?1:Math.max(0, 1-time/40);
  if(dusk>0){ var hx=ox+hero.x*ts, hy=oy+hero.y*ts, a=(dusk*.62).toFixed(3), gr=cx.createRadialGradient(hx,hy,ts*1.1,hx,hy,ts*3.6);
    gr.addColorStop(0,'rgba(8,12,45,'+(dusk*.12).toFixed(3)+')'); gr.addColorStop(1,'rgba(8,12,45,'+a+')'); cx.fillStyle=gr; cx.fillRect(0,0,w,h);
    cx.globalCompositeOperation='lighter';
    for(var lk in LOTS){ if(!S.built[lk]) continue; var D=LOTS[lk].door, lx=ox+(D[0]+.5)*ts, ly=oy+(D[1]+.2)*ts, lg=cx.createRadialGradient(lx,ly,0,lx,ly,ts*1.6);
      lg.addColorStop(0,'rgba(255,190,90,'+(dusk*.35).toFixed(3)+')'); lg.addColorStop(1,'rgba(255,190,90,0)'); cx.fillStyle=lg; cx.fillRect(lx-ts*1.6,ly-ts*1.6,ts*3.2,ts*3.2); }
    cx.globalCompositeOperation='source-over'; }
  /* 霧 */
  for(var y3=y0;y3<=y1;y3++) for(var x3=x0;x3<=x1;x3++){ if(seen[y3*W+x3]!=='1'){ cx.fillStyle='rgba(6,9,7,.92)'; cx.fillRect(Math.floor(ox+x3*ts),Math.floor(oy+y3*ts),Math.ceil(ts),Math.ceil(ts)); } }
  /* ⭐ 挑戰點的標記浮在霧上（10-19 Owen：「我找不到植物打殭屍」——菜園被沒探索過的霧蓋住了） */
  CHALLENGES.forEach(function(ch){ if(seen[ch.y*W+ch.x]==='1') return; var px=ox+(ch.x+.5)*ts, py=oy+ch.y*ts, b=Math.sin(clock*3)*ts*.05;
    cx.font=Math.round(ts*.5)+'px system-ui'; cx.textAlign='center'; cx.globalAlpha=.9; cx.fillText(ch.em, px, py+ts*.4+b);
    cx.font='bold '+Math.round(ts*.24)+'px Cubic11, system-ui'; var tw=cx.measureText(ch.name).width+ts*.2; cx.fillStyle='rgba(0,0,0,.6)'; cx.fillRect(px-tw/2, py+ts*.6, tw, ts*.34); cx.fillStyle='#f0e0b0'; cx.fillText(ch.name, px, py+ts*.85); cx.globalAlpha=1; });
  /* 金色箭頭 */
  var qi=questInfo(); if(qi.to && !busy) drawArrow(qi.to,ox,oy,ts,w,h);
  /* 搖桿 */
  if(joy){ cx.strokeStyle='rgba(255,255,255,.35)'; cx.lineWidth=3*DPR; cx.beginPath(); cx.arc(joy.ox*DPR,joy.oy*DPR,40*DPR,0,7); cx.stroke();
    var dx=joy.x-joy.ox, dy=joy.y-joy.oy, L=Math.hypot(dx,dy), m=Math.min(L,40)/(L||1);
    cx.fillStyle='rgba(255,255,255,.4)'; cx.beginPath(); cx.arc((joy.ox+dx*m)*DPR,(joy.oy+dy*m)*DPR,22*DPR,0,7); cx.fill(); }
}
function drawTile(d,x,y,ox,oy,ts){ return function(){ var im=img(d[0],d[1]); if(im.complete) cx.drawImage(im,Math.floor(ox+x*ts),Math.floor(oy+y*ts),Math.ceil(ts),Math.ceil(ts)); }; }
function drawSprite(s,x,y,ox,oy,ts,face,bob){ return function(){
  var im=img(s[0],s[1]); if(!im.complete) return;
  var px=ox+x*ts, py=oy+(y-bob)*ts;
  cx.save(); cx.translate(Math.floor(px),Math.floor(py)); cx.scale(face||1,1); cx.drawImage(im,-ts/2,-ts*.62,ts,ts); cx.restore(); }; }
function drawNode(n,ox,oy,ts){ return function(){
  var px=ox+n.x*ts, py=oy+n.y*ts;
  if(n.k==='fish'){
    if(n.done) return;
    var r=ts*(.25+.12*Math.sin(clock*3+n.x)); cx.strokeStyle='rgba(255,255,255,.7)'; cx.lineWidth=2*DPR; cx.beginPath(); cx.ellipse(px+ts/2,py+ts/2,r*1.4,r*.6,0,0,7); cx.stroke();
    cx.fillStyle='rgba(20,40,80,.5)'; cx.beginPath(); cx.ellipse(px+ts/2+Math.sin(clock+n.x)*ts*.15,py+ts*.55,ts*.18,ts*.07,0,0,7); cx.fill();
    return;
  }
  var im=img.apply(null, n.k==='rock'?SPR.ore:SPR.bush);
  cx.globalAlpha=n.done?.35:1; if(im.complete) cx.drawImage(im,Math.floor(px),Math.floor(py),Math.ceil(ts),Math.ceil(ts)); cx.globalAlpha=1;
  if(!n.done){ var sy=Math.sin(clock*4+n.x)*ts*.06; cx.fillStyle=isStar(n)?'#f0c95a':'#fff'; cx.font=Math.round(ts*.3)+'px system-ui'; cx.textAlign='center'; cx.fillText(isStar(n)?'★':'✦', px+ts*.82, py+ts*.18+sy); }
}; }
function drawClue(c,ox,oy,ts){ return function(){
  var px=ox+c.x*ts+ts/2, py=oy+c.y*ts+ts/2, g=.5+.5*Math.sin(clock*3);
  cx.fillStyle='rgba(240,201,90,'+(.25+.25*g)+')'; cx.beginPath(); cx.arc(px,py,ts*.45,0,7); cx.fill();
  cx.font=Math.round(ts*.55)+'px system-ui'; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText('📜',px,py); cx.textBaseline='alphabetic';
}; }
var ROOF={red:{top:[52,53,54],bot:[64,65,66],wall:[72,85,73]}, gray:{top:[48,49,50],bot:[60,61,62],wall:[76,89,77]}};
function drawLot(k,ox,oy,ts){ return function(){
  var L=LOTS[k], R=ROOF[L.roof], px=ox+L.x*ts, py=oy+L.y*ts, s=Math.ceil(ts);
  if(S.built[k]){
    for(var i=0;i<3;i++){ [R.top,R.bot,R.wall].forEach(function(row,j){ var im=img('t',row[i]); if(im.complete) cx.drawImage(im,Math.floor(px+i*ts),Math.floor(py+j*ts),s,s); }); }
    if(S.broken===k){ /* 🌙 突襲後被打破的窗戶：裂痕＋💥，下次守住就修好 */
      cx.strokeStyle='rgba(20,10,5,.85)'; cx.lineWidth=Math.max(1,DPR*1.5); cx.beginPath(); var bx=px+ts*.9, by=py+ts*1.9;
      cx.moveTo(bx,by); cx.lineTo(bx+ts*.25,by+ts*.2); cx.lineTo(bx+ts*.15,by+ts*.45); cx.moveTo(bx+ts*.25,by+ts*.2); cx.lineTo(bx+ts*.55,by+ts*.1); cx.stroke();
      cx.font=Math.round(ts*.4)+'px system-ui'; cx.textAlign='center'; cx.fillText('💥', px+ts*2.3, py+ts*1.7+Math.sin(clock*3)*ts*.04); }
    var o=starsOf(k); if(o){ cx.font=Math.round(ts*.32)+'px system-ui'; cx.textAlign='center'; var st=''; for(var q=0;q<3;q++) st+=q<o.s?'★':'☆'; cx.fillStyle='#000'; cx.fillText(st,px+ts*1.5+DPR,py-ts*.08+DPR); cx.fillStyle='#f0c95a'; cx.fillText(st,px+ts*1.5,py-ts*.08); }
  } else {
    [[0,2,'t',92],[2,2,'t',92],[1,1,'t',44],[0,1,'t',47]].forEach(function(p){ var im=img(p[2],p[3]); if(im.complete) cx.drawImage(im,Math.floor(px+p[0]*ts),Math.floor(py+p[1]*ts),s,s); });
    var sg=img('t',83); if(sg.complete) cx.drawImage(sg,Math.floor(px+ts),Math.floor(py+2*ts),s,s);
  }
  cx.font='bold '+Math.round(ts*.26)+'px system-ui'; cx.textAlign='center'; var label=k==='cottage'?(S.built[k]?'🏡 Clément 的小屋':'🏚 空著的小屋'):(S.built[k]?'':'重建 ')+L.name;
  var tw=cx.measureText(label).width+ts*.2; cx.fillStyle='rgba(0,0,0,.55)'; cx.fillRect(px+ts*1.5-tw/2, py+ts*3.05, tw, ts*.36);
  cx.fillStyle='#fff'; cx.fillText(label, px+ts*1.5, py+ts*3.32);
}; }
function drawArrow(to,ox,oy,ts,w,h){
  var tx=ox+to.x*ts, ty=oy+to.y*ts, m=40*DPR, b=Math.sin(clock*5)*6*DPR;
  cx.fillStyle='#f0c95a'; cx.strokeStyle='#000'; cx.lineWidth=2*DPR;
  if(tx>m&&tx<w-m&&ty>m*2.5&&ty<h-m){
    cx.beginPath(); cx.moveTo(tx,ty-ts*.55+b); cx.lineTo(tx-ts*.22,ty-ts*.9+b); cx.lineTo(tx+ts*.22,ty-ts*.9+b); cx.closePath(); cx.fill(); cx.stroke(); return;
  }
  var cx0=w/2, cy0=h/2, a=Math.atan2(ty-cy0, tx-cx0), R=Math.min(w/2-m, h/2-m*2);
  var ax=cx0+Math.cos(a)*R, ay=cy0+Math.sin(a)*R;
  cx.save(); cx.translate(ax,ay); cx.rotate(a); cx.beginPath(); cx.moveTo(18*DPR+b,0); cx.lineTo(-8*DPR+b,-12*DPR); cx.lineTo(-8*DPR+b,12*DPR); cx.closePath(); cx.fill(); cx.stroke(); cx.restore();
}
function loop(t){
  var dt=Math.min(.05,(t-lastT)/1000); lastT=t;
  if(ISLE.on){ clock+=dt; isleUpdate(dt); isleDraw(dt); } else { update(dt); draw(dt); }
  requestAnimationFrame(loop);
}

/* 按鈕 */
document.getElementById('bHome').onclick=function(){ if(busy) return; if(inTown(hero)){ toast('已經在小鎮裡了'); return; }
  fade(function(){ hero.x=PLAZA.x; hero.y=PLAZA.y; cam.x=hero.x; cam.y=hero.y; time=Math.max(0,time-5); }); };
document.getElementById('bRest').onclick=rest;

/* 開場 */
if(window.GameLog) GameLog.start('town');
resize(); buildWorld(); initSeen(); newDay(true); makeQuests(); reveal(); cam.x=hero.x; cam.y=hero.y;
Object.keys(SPR).forEach(function(k){ img.apply(null,SPR[k]); });
requestAnimationFrame(loop);
setTimeout(function(){ document.getElementById('toast').style.opacity=0; },4000);
if(!S.intro){ S.intro=1; save();
  openSheet('<h3>🏘️ Val-Brume</h3><div class="story">你剛搬到魁北克一個沒落的小鎮 Val-Brume，人幾乎都走光了。<br>鎮外的森林裡藏著各種東西——把它們一樣一樣收進 📖 圖鑑，鎮上的人就會慢慢回來。</div>'+
    '<div class="muted">按住畫面任何地方拖曳就能走（電腦用方向鍵）。走到 🌳 ⛏ 旁邊會自動開始；跟著上方的 🎯 和金色箭頭走。</div><div class="row2"><span></span><button class="btn main" id="ok">出發</button></div>');
  document.getElementById('ok').onclick=function(){ unlockTts(); closeSheet(); }; }

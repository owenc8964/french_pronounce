                       「只是在其中動來動去而已，玩的目的很不明確，不知道終點會是什麼」
  → v2：畫布引擎（60fps、拖曳搖桿／方向鍵、鏡頭跟隨、全螢幕、像素素材、霧）＋三層目標

'use strict';
/* ============================================================
   資料：題目池（全部出自 questions.js；依「處理什麼資訊」分家，跟研究檔第五節同一張表）
   ============================================================ */
var FAM = {
  verb: /passe|imparfait|conditionnel|futur|subjonctif|reflexive|(?<!ad)verbs|etre-avoir|imperative|accord-participe|pouvoir|gerondif|condition-si|discours|ilfaut|recit/,
  pron: /pronom|qui-que|on-vs-nous|cod/,
  noun: /article|adjective|demonstrative-adj|possessives|tout-chaque|comparaison|superlatif|cest-il|mise-en-relief|intensite/
};
function famOf(topic){ for(var k in FAM) if(FAM[k].test(topic)) return k; return null; }
var POOL = { verb:{choose:[],fill:[]}, pron:{choose:[],fill:[]}, noun:{choose:[],fill:[]} };
BANK.forEach(function(q, i){
  q._i = i;

    if(L>R){ joy.ox+=dx/L*(L-R); joy.oy+=dy/L*(L-R); dx=joy.x-joy.ox; dy=joy.y-joy.oy; L=R; }   /* 底座跟著手指走：掉頭不用先把手指拉回來 */

var RECALL_GAP=[1,3,7], RECALL_DAY_CAP=15;
function recallAll(){ try{ return JSON.parse(localStorage.getItem('clb7_game_recall'))||{}; }catch(e){ return {}; } }
function sod(t){ var d=new Date(t); d.setHours(0,0,0,0); return d.getTime(); }
function recallKey(kind, item){ return kind==='g' ? 'g:'+item.n : kind==='c' ? 'c:'+item.id : kind==='L' ? 'L:'+item.id : qRef(item); }
function recallMark(kind, item, ok){
  if(ok===null || !item) return;
  var key=recallKey(kind,item); if(!key || /^(clue-|v:)/.test(key)) return;

  if(ok===false){
    if(!r || r.done){ var n=0; for(var k in R) if(R[k].add>=sod(now)) n++; if(n>=RECALL_DAY_CAP) return; r={step:0, add:now}; }
    r.step=0; r.due=sod(now)+RECALL_GAP[0]*86400000; r.last=now; delete r.done;
  } else if(r && !r.done && r.due<=now){
    r.step++; r.last=now; masteryBonus(3, '回收'); questBump('recall');
    if(r.step>=RECALL_GAP.length){ r.done=now; } else r.due=sod(now)+RECALL_GAP[r.step]*86400000;
  } else return;
  R[key]=r; try{ localStorage.setItem('clb7_game_recall', JSON.stringify(R)); }catch(e){}
}
function recallDue(list, keyOf){

/* 正確說法：有空格就把答案填回去，唸整句 */
function sayOf(q, ans){
  var s=String(q.q);
  if(!/_{2,}/.test(s)) return ans;
  var seg=s.split('→').filter(function(x){ return /_{2,}/.test(x); })[0]||s;   /* 只取有空格的那一段 */
  var qm=seg.match(/「([^」]*_{2,}[^」]*)」/); if(qm) seg=qm[1];                       /* 中文題幹裡「…」包著的法文 */
  seg=seg.replace(/（[^）]*）/g,'').replace(/\([^)]*[\u4e00-\u9fff][^)]*\)/g,'');      /* 全形括號一律是提示；半形的有中文才是 */
  seg=seg.replace(/「[^」]*」/g,function(m){ return /_{2,}/.test(m)?m:''; });           /* 去掉前面的中文翻譯「…」 */                       /* 去掉中文提示括號 */
  var c=Math.max(seg.lastIndexOf(':',seg.indexOf('_')), seg.lastIndexOf('：',seg.indexOf('_'))); if(c>=0 && c<seg.indexOf('_')) seg=seg.slice(c+1);   /* 去掉「Le contraire :」這種標籤 */
  return seg.replace(/_{2,}(\s*\([^)]*\))?/, ans).replace(/\s*\([^)]*\)\s*$/,'').replace(/\s+/g,' ').trim();
}

/* ② 只看中文寫整句（cb：true／false／'close'＝只差一個字） */
function askWhole(head, q, cb){
  var t0=Date.now(), right=clean(fmtRight(q)), zhs=fmtZh(q), rc={kind:'升格②', ref:qRef(q), q:q.q, a:q.a};
  var fulls=String(q.a).split('|').concat([right]).map(function(a){ return frOnly(sayOf(q, clean(a))); }).filter(function(x, i, arr){ return x && arr.indexOf(x)===i && x.split(/\s+/).length>1; });
  if(!fulls.length) fulls=[frOnly(sayOf(q,right))];
  /* ⚠️ 只看中文寫整句＝答案不只一種（時態、句型都能換）→ 會冤枉人。所以給一行提示把句型鎖住：
     實詞照順序露出來、功能詞變「＿」、要考的那塊挖空並附原題的提示（例如 (être)） */
  var mk=frOnly(sayOf(q, '\u0001'+right+'\u0002')), a1=mk.indexOf('\u0001'), a2=mk.indexOf('\u0002');
  var hintM=String(q.q).match(/_{2,}\s*(\([^)]*\)|（[^）]*）)/), hint=hintM?hintM[1]:'';
  var cueW=function(t){ return wparts(t).map(function(p){ return p.w ? (FUNC_W[wkey(p.t)] ? '＿' : esc(p.t)) : esc(p.t); }).join(''); };
  var cue = (a1>=0&&a2>a1) ? cueW(mk.slice(0,a1))+'<b>［＿＿'+(hint?' '+esc(hint):'')+'］</b>'+cueW(mk.slice(a2+1)) : '';
  openSheet('<h3>'+head+'</h3><div class="qtext">'+esc(zhs)+'</div>'+(cue?'<div class="qtext fr" style="opacity:.85">'+cue+'</div>':'')+(q.hint?'<div class="hint">💡 '+esc(q.hint)+'</div>':'')+
    '<textarea class="fill" id="win" rows="2" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" lang="fr" placeholder="用法文把整句寫出來"></textarea>'+
    '<div class="fb" id="fb"></div><div class="row2"><button class="btn ghost" id="skip">↷ 繞過</button><button class="btn main" id="wsub">交出去</button></div>'+repSlot(rc), true);
  var ta=document.getElementById('win'), sent=false; setTimeout(function(){ ta.focus(); },50);
  document.getElementById('skip').onclick=function(){ if(sent) return; sent=true; cb(null); };
  document.getElementById('wsub').onclick=function(){ var v=ta.value.trim(); if(!v||sent) return; sent=true; ta.disabled=true; rc.pick=v;
    var ms=Date.now()-t0, best=null;
    fulls.forEach(function(f){
      var parts=wparts(f), words=parts.filter(function(p){ return p.w; });
      var A=(v.match(WRE)||[]).map(wkey), B=words.map(function(p){ return wkey(p.t); });
      var A2=(v.match(WRE)||[]).map(function(w){ return w.toLowerCase().replace(/’/g,"'"); }).join(' '), B2=words.map(function(p){ return p.t.toLowerCase().replace(/’/g,"'"); }).join(' ');
      var keep=lcsKeep(B,A), miss=Math.max(B.length,A.length)-keep.length, mk={}; keep.forEach(function(i){ mk[i]=1; });
      var wi=-1, diff=parts.map(function(p){ if(!p.w) return esc(p.t); wi++; return mk[wi]?esc(p.t):'<u style="color:var(--gold)">'+esc(p.t)+'</u>'; }).join('');
      var res=A2===B2?'ok':(miss===0?'accent':(miss<=1?'close':'no'));
      var rank={ok:0,accent:1,close:2,no:3}[res];
      if(!best || rank<best.rank || (rank===best.rank && miss<best.miss)) best={res:res, rank:rank, miss:miss, f:f, diff:diff};
    });
    speak(best.f);
    var msg={ok:'✓ 整句寫對了', accent:'✓ 對了（注意重音）', close:'差一點——只差一個字，這次先不升也不退', no:'再看一次'}[best.res];
    document.getElementById('fb').innerHTML='<div>'+msg+'</div><div>👉 <span class="say">'+(best.res==='ok'?esc(best.f):best.diff)+'</span> '+spk(best.f)+'</div>'+(best.res==='no'?explainHtml(q, null, right, ''):'');
    var out=best.res==='ok'||best.res==='accent' ? true : best.res==='close' ? 'close' : false;
    document.querySelector('.row2').innerHTML='<span></span><button class="btn main" id="go">繼續</button>';
    document.getElementById('go').onclick=function(){ cb(out, ms, v, right); };
  };

/* ============================================================
   📋 今日委託（10-17 Owen：「每日會需要根據我比較需要訓練的題型或種類，或是缺乏練習時間的區域，優先引導我去完成那些訓練。這樣就不會有偏重的問題」）
   ⭐ 每天依紀錄自動挑 3 個（⛔ 不讓他自己選——memory feedback_menu_defaults_to_easiest）：

   ============================================================ */
var QPLACE={

  notice:{name:'📋 告示牌', re:/抓錯字/,           need:5, verb:'抓', unit:'句', pt:function(){ return chalPt('notice'); }},
  garden:{name:'🌻 菜園',  re:/^守園/,            need:8, verb:'答', unit:'題', pt:function(){ return chalPt('garden'); }},
  mine:  {name:'⛏ 礦坑',   re:/礦坑/,             need:4, verb:'答', unit:'題', pt:function(){ return nearestNode(['rock']); }},
  forest:{name:'🌳 森林',   re:/樹叢|草叢|陰陽性/,   need:4, verb:'答', unit:'題', pt:function(){ return nearestNode(['bush']); }},
  stones:{name:'🪨 石頭過河', re:/過河/,           need:2, verb:'過', unit:'段河', pt:function(){ return chalPt('stones'); }},
  run:   {name:'🚪 跑酷小徑', re:/跑酷/,           need:8, verb:'過', unit:'道門', pt:function(){ return chalPt('run'); }},
  river: {name:'🎣 河邊',   re:/聽力/,             need:3, verb:'答', unit:'題', pt:function(){ return nearestNode(['fish']); }, ok:function(){ return S.built.bridge; }}
};
function chalPt(id){ var c=CHALLENGES.filter(function(x){ return x.id===id; })[0]; return c?{x:c.x+.5, y:c.y+.5}:null; }
function placeOf(kind){ for(var p in QPLACE) if(QPLACE[p].re.test(kind||'')) return p; return null; }
function dots(n, need){ var h=''; for(var i=0;i<need;i++) h+=i<n?'●':'○'; return h; }
function makeQuests(){
  if(S.quests && S.quests.d===today()) return;
  var list=[], now=Date.now(), used={};
  /* ① 錯得多的題型：至少答過 3 次、錯的比例 ≥30%、一週內錯過 */
  var tops=Object.keys(S.topic||{}).map(function(t){ var s=S.topic[t]; return {t:t, n:s.r+s.w, rate:s.w/Math.max(1,s.r+s.w), lw:s.lastWrong||0}; })
    .filter(function(x){ return x.n>=3 && x.rate>=.3 && now-x.lw<7*86400000 && famOf(x.t); })
    .sort(function(a,b){ return b.rate-a.rate || b.lw-a.lw; });
  if(tops.length){ var t=tops[0].t, lb=topicLabel(t), place=famOf(t)==='verb'?'mine':'forest';
    list.push({type:'topic', key:t, need:4, prog:0, place:place, label:'答對 4 題「'+(lb.zh||lb.fr)+'」', why:'最近這類錯得比較多'}); used[place]=1; }
  /* ② 好幾天沒去的地方 */
  var lp=S.lastPlace||{};
  var stale=Object.keys(QPLACE).filter(function(p){ return !used[p] && (!QPLACE[p].ok || QPLACE[p].ok()); })
    .map(function(p){ return {p:p, age:now-(lp[p]||0)}; }).sort(function(a,b){ return b.age-a.age; });
  var s0=stale.shift(); if(s0){ var P=QPLACE[s0.p];
    list.push({type:'place', key:s0.p, need:P.need, prog:0, place:s0.p, label:'去 '+P.name+' '+P.verb+' '+P.need+' '+P.unit, why:lp[s0.p]?'好幾天沒去了':'還沒去過'}); used[s0.p]=1; }
  /* ③ 回收到期 → 否則快升格 → 否則再一個沒去的地方 */
  var R=recallAll(), due=0; for(var k in R) if(!R[k].done && R[k].due<=now) due++;
  var near=0; for(var f in (S.fmt||{})) if(S.fmt[f].days && S.fmt[f].days.length===1 && S.fmt[f].lv<2) near++;
  if(due>=2) list.push({type:'recall', key:'recall', need:Math.min(3,due), prog:0, place:null, label:'前幾天卡住的題，答對 '+Math.min(3,due)+' 題', why:'回收裡有題目到期了'});
  else if(near>=2) list.push({type:'upgrade', key:'upgrade', need:2, prog:0, place:null, label:'讓 2 題升格', why:'有幾題再答對一次就升格'});
  else { var s1=stale.filter(function(x){ return !used[x.p]; })[0]; if(s1){ var P1=QPLACE[s1.p]; list.push({type:'place', key:s1.p, need:P1.need, prog:0, place:s1.p, label:'去 '+P1.name+' '+P1.verb+' '+P1.need+' '+P1.unit, why:'換個地方練'}); } }
  S.quests={d:today(), list:list, allDone:false}; save();
  if(list.length) toast('📋 今天的委託貼出來了——點上方的任務列看');
}
function activeQuest(type){ var Q=S.quests; if(!Q||Q.d!==today()) return null; return Q.list.filter(function(q){ return q.type===type && q.prog<q.need; })[0]||null; }

  var Q=S.quests; if(!Q||Q.d!==today()) return;

    q.prog++; if(q.prog>=q.need){ S.gold+=15; toast('📋 委託完成：'+q.label.replace(/<[^>]+>/g,'')+'　+15🪙'); if(window.GameLog) GameLog.event('quest_'+q.type); } });

/* 🪙 金幣綁精熟（10-17，Duolingo 2024 的教訓：獎勵綁參與會讓人刷簡單題）：

function standCount(fam){ var n=0; for(var k in S.stand) if(S.standFam[k]===fam && S.stand[k].length>=2) n++; return n; }

                                 : kind==='c' ? {kind:'聽力', topic:'listen', q:item.fr, a:item.zh, pick:extra&&extra.chosen, ref:'c:'+item.id, ms:ms}
                                 : kind==='L' ? {kind:'課本聽力', topic:'listen-book', q:item.text, a:extra&&extra.right, pick:extra&&extra.chosen, ref:'L:'+item.id, ms:ms}
                                 : {kind:(extra&&extra.where)||'題目', topic:item.topic, q:item.q, a:item.a, pick:extra&&extra.chosen, ref:qRef(item), ms:ms});
  if(ok===null) return;
  recallMark(kind, item, ok);
  if(kind==='g'){ var g=S.gword[item.n]||{r:0,w:0}; g[ok?'r':'w']++; g.last=Date.now(); S.gword[item.n]=g; if(ok){ markStand('g:'+item.n,'noun'); lastCatch=dexCatch(item, ms); } else { lastCatch=null; dexMiss(item); } }
  else if(kind==='c'){ var c=S.gword['c:'+item.id]||{r:0,w:0}; c[ok?'r':'w']++; S.gword['c:'+item.id]=c; if(ok) markStand('c:'+item.id,'listen'); }
  else if(kind==='L'){ var l=S.gword['L:'+item.id]||{r:0,w:0}; l[ok?'r':'w']++; l.last=Date.now(); S.gword['L:'+item.id]=l; S.qlast['L:'+item.id]=Date.now(); if(ok) markStand('L:'+item.id,'listen'); }
  else { var t=S.topic[item.topic]||{r:0,w:0}; t[ok?'r':'w']++; if(!ok) t.lastWrong=Date.now(); S.topic[item.topic]=t; S.qlast[item._i]=Date.now();

  log.push({kind:kind, item:item, ok:ok, ms:ms, chosen:extra&&extra.chosen, right:extra&&extra.right, where:extra&&extra.where});
  save();

/* ⛏ 礦石：兩敲＝兩題動詞；兩題都對＝完整礦，錯一題＝瑕疵礦；兩題都快＝雙倍 */
function mineRock(n){
  if(!(n._pal && Date.now()-n._pal<60000) && palaceServe(function(){ n._pal=Date.now(); mineRock(n); })) return;
  var hits=[], star=isStar(n), i=0;
  function next(){
    if(i>=2) return finish();
    /* ⚡ 三成機率變成變位反應（委託題型進行中時讓位給委託） */
    var rr=Math.random(), cj=(!activeQuest('topic') && rr<.3) ? conjPick() : null;
    var ex=(!cj && !activeQuest('topic') && rr<.65) ? examPick(['time','hypo']) : null;
    if(ex){ askExam('⛏ 礦坑'+(star?' ★':'')+' <small>第 '+(i+1)+' 敲</small>', ex, function(ok,ms,ch){ rec('q', examItem(ex), ok, ms, {chosen:ch, right:EXAM_TYPES[ex.type].opts[ex.ans], where:'⛏ 礦坑'});
      hits.push(ok===null?'skip':ok?(ms<(6000+S.pick*2500)?'crit':'ok'):'no'); i++; next(); }); return; }
    if(cj){ askConj('⛏ 礦坑'+(star?' ★':'')+' <small>第 '+(i+1)+' 敲・⚡ 變位</small>', cj, function(ok,ms){
      hits.push(ok===null?'skip':ok?(ms<(5000+S.pick*2000)?'crit':'ok'):'no'); i++; next(); }); return; }
    var q=pickQ(questPool(POOL.verb.choose), star);
    askChoose('⛏ 礦坑'+(star?' ★':'')+' <small>第 '+(i+1)+' 敲・動詞</small>', q, function(ok,ms,ch,right){
      rec('q', q, ok, ms, {chosen:ch,right:right,where:'⛏ 礦坑'}); hits.push(ok===null?'skip':ok?(ms<(6000+S.pick*2500)?'crit':'ok'):'no');
      i++; next();
    });
  }
  function finish(){
    closeSheet(); n.done=true;
    var answered=hits.filter(function(h){ return h!=='skip'; });
    if(!answered.length){ toast('繞過了這塊礦石'); return; }
    var good=answered.every(function(h){ return h!=='no'; }), crit=hits.every(function(h){ return h==='crit'; });
    var cnt=(crit?2:1)*(star?2:1);
    for(var c=0;c<cnt;c++) addBag({k:'ore', name:'礦石', em:'⛏', good:good});
    floatTxt(n.x+.5,n.y,'+'+cnt+(good?' ⛏':' ⛏瑕')+(crit?' 會心！':''), good?'#ffd76a':'#bbb');
  }
  next();
}
/* ============================================================
   ⚖️ 動詞時態配比（10-18 Owen：「時態變化有點少，都集中在過去式，未來跟其他的好像沒出現」）
   查證：礦坑題庫 448 題裡過去類約 45%、現在式約 19%、未來 5.6%；
   語料（memory reference_corpus_what_to_produce）聽力：現在式 70%、複合過去 10%、未完成 4.9%、條件 2.5%、未來 4.7%、虛擬 1.5%
   → 照「目標比例 ÷ 題庫比例」調權重。目標＝語料為主，但現在式有一部分交給 ⚡ 變位反應，未來式依 Owen 要求拉到一成
   ============================================================ */
var TENSE_CAT=[
  ['present', /^(er-verbs|ir-re-verbs|irregular-verbs-3rd-group|etre-avoir|reflexive-verbs|pouvoir-vouloir|ilfaut-devoir)$/, .30],
  ['past',    /^(passe-compose|accord-participe-passe|pc-imparfait-recit|passe-recent)$/,                                     .20],
  ['imp',     /^imparfait$/,                                                                                             .10],
  ['fut',     /^(futur-simple|futur-proche)$/,                                                                           .10],
  ['cond',    /^(conditionnel-present|condition-si)$/,                                                                   .10],
  ['subj',    /^subjonctif-present$/,                                                                                    .05],
  ['other',   /./,                                                                                                       .15]
];
function tenseCat(topic){ for(var i=0;i<TENSE_CAT.length;i++) if(TENSE_CAT[i][1].test(topic)) return i; return TENSE_CAT.length-1; }
/* ⚠️ 不能用「乘權重」：pickQ 是抽 60 題取最高分，權重稍高的類別會壟斷（試跑時未來式跑到 60%）
   → 兩段式：先照目標比例抽「這題考哪一類」，再交給原本的挑題邏輯（錯題加權、委託加權照舊） */
function tenseSlice(list){
  if(!list.length || famOf(list[0].topic)!=='verb') return list;
  var by=TENSE_CAT.map(function(){ return []; }); list.forEach(function(q){ by[tenseCat(q.topic)].push(q); });
  var cats=by.map(function(a,i){ return a.length ? i : -1; }).filter(function(i){ return i>=0; });
  if(cats.length<2) return list;
  var tot=cats.reduce(function(a,i){ return a+TENSE_CAT[i][2]; },0), r=Math.random()*tot;
  for(var k=0;k<cats.length;k++){ r-=TENSE_CAT[cats[k]][2]; if(r<=0) return by[cats[k]]; }
  return by[cats[cats.length-1]];
}

/* ============================================================
   ⚡ 變位反應（10-18 Owen：「我原本那個你指定時態跟動詞主詞、讓我填空練反應的遊戲，感覺滿適合拿來玩的」＝verb_sprint.html）
   ⭐ 做成礦坑的遭遇（memory feedback_streak_and_constant_flow：一直走一直有題，⛔ 不另開選單）
   ⭐ 資料跟 verb_sprint 同一份：verbs_full.js 的 drillForms()、verb_freq.js 的語料權重、核心 11 個動詞
   ⭐ 紀錄寫回同一個格子（clb7_sprint_cells＋時態後綴，key＝動詞_人稱）→ 衝刺頁的熱力圖、儀表板一起亮
   ⭐ 反射＝最近 3 次都對、起手（第一個按鍵）中位數 ≤ 2 秒（跟 verb_sprint 同一把尺）；⛔ 不倒數
   ============================================================ */
var CONJ_VERBS=['être','avoir','faire','aller','devoir','pouvoir','vouloir','venir','prendre','savoir','voir'];
var CONJ_MODES=[ {tense:'present', label:'présent', suffix:'', gram:null, w:.36}, {tense:'passe-compose', label:'passé composé', suffix:'_pc', gram:'passe', w:.18},
  {tense:'imparfait', label:'imparfait', suffix:'_imp', gram:'imparfait', w:.12}, {tense:'futur-simple', label:'futur simple', suffix:'_fut', gram:'futur-simple', w:.14},
  {tense:'conditionnel', label:'conditionnel', suffix:'_cond', gram:'conditionnel', w:.12}, {tense:'subjonctif', label:'subjonctif', suffix:'_subj', gram:'subjonctif', w:.08},
  {tense:'plus-que-parfait', label:'plus-que-parfait', suffix:'_pqp', gram:'pluperfect', w:.06} ];   /* 10-28 加：第45課解鎖（suffix 跟 verb_sprint 同一格） */
var CONJ_PERS=['je','tu','il / elle','nous','vous','ils / elles'];
function conjModes(){ return CONJ_MODES.filter(function(m){ if(!m.gram) return true; if(typeof GRAM_POINTS==='undefined') return m.tense==='passe-compose'; var p=GRAM_POINTS.filter(function(x){ return x.id===m.gram; })[0]; return !!p && p.unlocked!==false; }); }
function conjCells(m){ try{ return JSON.parse(localStorage.getItem('clb7_sprint_cells'+m.suffix))||{}; }catch(e){ return {}; } }
function conjState(h){ if(!h||!h.length) return 'new'; if(!h[h.length-1].o) return 'weak'; var l=h.slice(-3); if(l.length===3 && l.every(function(x){ return x.o; })){ var f=l.map(function(x){ return x.f; }).sort(function(a,b){ return a-b; }); if(f[1]<=2000) return 'reflex'; } return 'slow'; }
function conjCorpus(inf, t){ if(typeof VERB_FREQ==='undefined') return 1; var f=VERB_FREQ[inf]; if(!f) return 1; var n=(f.t&&f.t[t])||0; return n>=100?3:n>=20?2:n>0?1.5:.5; }
function conjPick(){
  if(typeof VERBS_FULL==='undefined' || typeof drillForms!=='function') return null;
  var ms=conjModes(); if(!ms.length) return null;
  var tot=ms.reduce(function(a,m){ return a+m.w; },0), r=Math.random()*tot, m=ms[0];
  for(var i=0;i<ms.length;i++){ r-=ms[i].w; if(r<=0){ m=ms[i]; break; } }
  var cells=conjCells(m), pool=[], W={weak:4,new:3,slow:2,reflex:.5};
  CONJ_VERBS.forEach(function(inf){ var v=VERBS_FULL.filter(function(x){ return x.inf===inf; })[0]; if(!v) return; var forms=drillForms(v, m.tense); if(!forms) return;
    for(var pi=0;pi<6;pi++){ var key=inf+'_'+pi, w=W[conjState((cells[key]||{}).h)]*conjCorpus(inf, m.tense); pool.push({m:m, inf:inf, pi:pi, key:key, alts:String(forms[pi]).split('|'), w:w}); } });
  var sum=pool.reduce(function(a,x){ return a+x.w; },0), rr=Math.random()*sum;
  for(var j=0;j<pool.length;j++){ rr-=pool[j].w; if(rr<=0) return pool[j]; }
  return pool[pool.length-1];
}
function conjNorm(s){ return String(s).toLowerCase().trim().replace(/[’]/g,"'").normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/^(j|je|tu|il|elle|on|nous|vous|ils|elles)['\s]+/,'').replace(/\s+/g,''); }
function withPron(pi, form){ return (pi===0 && /^[aeiouâàéèêëîïôöûüùh]/i.test(form)) ? "j'"+form : ['je','tu','il','nous','vous','ils'][pi]+' '+form; }
/* cb(ok, ms)：跟 askChoose 一樣的回呼（礦坑拿來判斷會心） */
function askConj(head, c, cb){
  var t0=Date.now(), fk=0, rc={kind:'⚡ 變位', ref:'v:'+c.m.tense+':'+c.key, q:c.inf+' · '+c.m.label+' · '+CONJ_PERS[c.pi], a:c.alts.join('|')};
  openSheet('<h3>'+head+'</h3><div class="qtext fr" style="text-align:center;font-size:1.15em"><b>'+esc(c.inf)+'</b> · '+esc(c.m.label)+'<br><span style="font-size:1.3em">'+esc(CONJ_PERS[c.pi])+' …</span></div>'+
    '<input class="fill" id="cin" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" lang="fr" placeholder="打出變位（主詞可打可不打）">'+
    '<div class="fb" id="fb"></div><div class="row2"><button class="btn ghost" id="skip">↷ 繞過</button><button class="btn main" id="csub">敲下去</button></div>'+repSlot(rc), true);
  var inp=document.getElementById('cin'), sent=false; setTimeout(function(){ inp.focus(); },50);
  inp.addEventListener('keydown', function(e){ if(!fk && e.key.length===1) fk=Date.now()-t0; if(e.key==='Enter') sub(); });
  document.getElementById('skip').onclick=function(){ if(sent) return; sent=true; if(window.GameLog) GameLog.answer(null,{kind:'⚡ 變位', ref:rc.ref}); cb(null); };
  function sub(){ var v=inp.value.trim(); if(!v||sent) return; sent=true; inp.disabled=true; rc.pick=v;
    var ms=Date.now()-t0, n=conjNorm(v), ok=c.alts.some(function(a){ return conjNorm(a)===n; });
    var exact=ok && c.alts.some(function(a){ return a.toLowerCase().replace(/\s+/g,'')===v.toLowerCase().replace(/^(j|je|tu|il|elle|on|nous|vous|ils|elles)['\s]+/,'').replace(/\s+/g,''); });
    /* 寫回衝刺頁的格子（加 last，配合同步的物件合併） */
    var cells=conjCells(c.m), cell=cells[c.key]||{h:[]}, was=conjState(cell.h);
    cell.h.push({o:ok?1:0, f:Math.round(fk||ms), d:ms, t:Date.now()}); cell.h=cell.h.slice(-5); cell.last=Date.now(); cells[c.key]=cell;
    try{ localStorage.setItem('clb7_sprint_cells'+c.m.suffix, JSON.stringify(cells)); }catch(e){}
    if(window.GameLog) GameLog.answer(ok, {kind:'⚡ 變位', topic:'conj-'+c.m.tense, ref:rc.ref, ms:fk||ms, q:rc.q, a:c.alts[0], pick:v});
    var now=conjState(cell.h), show=withPron(c.pi, c.alts[0]); speak(show);
    if(now==='reflex' && was!=='reflex'){ masteryBonus(3,'反射'); toast('⚡ '+c.inf+'・'+c.m.label+'・'+['je','tu','il','nous','vous','ils'][c.pi]+' 變成反射了'); }
    document.getElementById('fb').innerHTML=(ok?'✓ '+(fk&&fk<2000?'<b style="color:var(--gold)">起手 '+(fk/1000).toFixed(1)+' 秒</b> ':'')+(exact?'':'（注意重音）'):'👉')+' <span class="say">'+esc(show)+'</span> '+spk(show);
    if(ok && exact) setTimeout(function(){ cb(true, ms); }, 800);
    else { document.querySelector('.row2').innerHTML='<span></span><button class="btn main" id="go">繼續</button>'; document.getElementById('go').onclick=function(){ cb(ok, ms); }; }
  }

/* ============================================================
   🔨 鐵砧（10-28 Owen：「遊戲中沒有時態變化的那個遊戲耶——給原形、時態／文法，變形成哪個樣子，輸入跟選擇都可以」）
   查證：⚡ 變位只藏在礦坑（三成機率，又常被宮殿複習、委託蓋掉）→ 10-14～10-27 兩週答了約 140 題，變位 0 題
   ⭐ 鐵匠鋪旁一座鐵砧：一爐＝一個時態、敲 8 下（同結構連發＝壓縮練習），原形＋人稱 → 變形
   ⭐ 打字或選擇 ⛔ 不給他自己選（memory feedback_menu_defaults_to_easiest）：這格沒碰過／上次錯 → 選擇（先認得）；選對過、打對過 → 打字（產出）
   ⭐ 紀錄跟 ⚡ 變位、verb_sprint 同一份格子（clb7_sprint_cells＋時態後綴）；選擇題答對記 f=9999（⛔ 不算反射，只讓下次改打字）
   ⭐ 跳過三層：這格「↷ 跳過」（不記錄）、整爐「今天先到這」、整個鐵砧不擋任何東西
   ============================================================ */
var FORGE_N=8;
var FORGE_TZ={'present':'現在式','passe-compose':'複合過去','imparfait':'未完成過去','futur-simple':'簡單未來','conditionnel':'條件式','subjonctif':'虛擬式','plus-que-parfait':'愈過去'};
function forgeVerbs(){ return (typeof VERBS_FULL==='undefined')?[]:VERBS_FULL.filter(function(v){ return v.inf!=='falloir' && v.inf!=='pleuvoir'; }); }
function forgeCells(m){ var cells=conjCells(m), pool=[], W={weak:4,new:3,slow:2,reflex:.4};
  forgeVerbs().forEach(function(v){ var fs=null; try{ fs=drillForms(v, m.tense); }catch(e){} if(!fs) return;
    for(var pi=0;pi<6;pi++){ if(!fs[pi]) continue; var key=v.inf+'_'+pi, st=conjState((cells[key]||{}).h);
      pool.push({m:m, inf:v.inf, pi:pi, key:key, alts:String(fs[pi]).split('|'), st:st, w:W[st]*conjCorpus(v.inf, m.tense)*(CONJ_VERBS.indexOf(v.inf)>=0?1.6:1)}); } });
  return pool; }
/* 這一爐挑哪個時態：照配比，再往「還沒站穩的格子多」的時態傾斜 */
function forgeMode(){ var ms=conjModes(); if(!ms.length) return null;
  var sc=ms.map(function(m){ var p=forgeCells(m), soft=p.filter(function(x){ return x.st!=='reflex'; }).length/Math.max(1,p.length); return m.w*(.4+soft)*(Math.random()+.5); });
  var bi=0; sc.forEach(function(s,i){ if(s>sc[bi]) bi=i; }); return ms[bi]; }
function forgeDraw(pool, used){ var c=pool.filter(function(x){ return used.indexOf(x.key)<0; }); if(!c.length) c=pool;
  var sum=c.reduce(function(a,x){ return a+x.w; },0), r=Math.random()*sum; for(var i=0;i<c.length;i++){ r-=c[i].w; if(r<=0) return c[i]; } return c[c.length-1]; }
function forgeSay(c, form){ var s=withPron(c.pi, form); if(c.m.tense!=='subjonctif') return s; return (/^[aeiouh]/i.test(s)?"qu'":"que ")+s; }
/* 選擇題的干擾項：同一個動詞、同一個人稱的別的時態＋同時態的別的人稱（都是真的存在的形，⛔ 不自己造錯字） */
function forgeOpts(c){ var v=VERBS_FULL.filter(function(x){ return x.inf===c.inf; })[0], right=c.alts[0], seen={}, out=[];
  function add(f){ if(!f) return; f=String(f).split('|')[0]; var k=conjNorm(f); if(seen[k]) return; seen[k]=1; out.push(f); }
  add(right);
  var other=[]; conjModes().forEach(function(m){ if(m.tense===c.m.tense) return; var fs=null; try{ fs=drillForms(v,m.tense); }catch(e){} if(fs) other.push(fs[c.pi]); });
  var same=[]; var fs0=drillForms(v,c.m.tense); for(var i=0;i<6;i++) if(i!==c.pi && fs0[i]) same.push(fs0[i]);
  shuffle(other).slice(0,2).forEach(add); shuffle(same).forEach(function(f){ if(out.length<4) add(f); }); shuffle(other).forEach(function(f){ if(out.length<4) add(f); });
  return shuffle(out); }
function askForgeChoice(head, c, cb){
  var t0=Date.now(), done=false, opts=forgeOpts(c), rc={kind:'🔨 鐵砧', ref:'v:'+c.m.tense+':'+c.key, q:c.inf+' · '+c.m.label+' · '+CONJ_PERS[c.pi], a:c.alts.join('|')};
  openSheet('<h3>'+head+'</h3><div class="qtext fr" style="text-align:center;font-size:1.15em"><b>'+esc(c.inf)+'</b> · '+esc(c.m.label)+'<br><span style="font-size:1.3em">'+esc(CONJ_PERS[c.pi])+' …</span></div>'+
    '<div class="opts">'+opts.map(function(o){ return '<button class="fr" data-f="'+esc(o)+'">'+esc(forgeSay(c,o))+'</button>'; }).join('')+'</div>'+
    '<div class="fb" id="fb"></div><div class="row2"><button class="btn ghost" id="skip">↷ 這格跳過</button><span id="slot"></span></div>'+repSlot(rc), true);
  sheet.querySelectorAll('.opts button').forEach(function(b){ b.onclick=function(){ if(done) return; done=true;
    var f=b.dataset.f, ok=c.alts.some(function(a){ return conjNorm(a)===conjNorm(f); }), ms=Date.now()-t0; rc.pick=f;
    sheet.querySelectorAll('.opts button').forEach(function(x){ if(c.alts.some(function(a){ return conjNorm(a)===conjNorm(x.dataset.f); })) x.classList.add('ok'); }); if(!ok) b.classList.add('no');
    var cells=conjCells(c.m), cell=cells[c.key]||{h:[]};
    cell.h.push({o:ok?1:0, f:ok?9999:ms, d:ms, t:Date.now(), c:1}); cell.h=cell.h.slice(-5); cell.last=Date.now(); cells[c.key]=cell;
    try{ localStorage.setItem('clb7_sprint_cells'+c.m.suffix, JSON.stringify(cells)); }catch(e){}
    if(window.GameLog) GameLog.answer(ok, {kind:'🔨 鐵砧', topic:'conj-'+c.m.tense, ref:rc.ref, ms:ms, q:rc.q, a:c.alts[0], pick:f});
    var show=forgeSay(c, c.alts[0]); speak(show); document.getElementById('skip').style.visibility='hidden';
    document.getElementById('fb').innerHTML=(ok?'✓ <span class="muted">下次這格換你打出來</span> ':'👉 ')+'<span class="say">'+esc(show)+'</span> '+spk(show);
    if(ok) setTimeout(function(){ cb(true, ms); }, 900);
    else { document.getElementById('slot').outerHTML='<button class="btn main" id="go">繼續</button>'; document.getElementById('go').onclick=function(){ cb(false, ms); }; }
  }; });
  document.getElementById('skip').onclick=function(){ if(done) return; done=true; cb(null); };
}
function forgePanel(ch){
  if(!forgeVerbs().length || typeof drillForms!=='function'){ toast('鐵砧還冷著（動詞資料沒載入）'); return; }
  var m=forgeMode(); if(!m) return;

    '<div class="qtext" style="text-align:center"><span class="fr" style="font-size:1.25em"><b>'+esc(m.label)+'</b></span><br><span class="muted">'+esc(FORGE_TZ[m.tense]||'')+'・一爐敲 '+FORGE_N+' 下</span></div>'+

function forgeRun(m){
  var pool=forgeCells(m), used=[], i=0, got=0;
  function next(){
    if(i>=FORGE_N) return finish();
    var c=forgeDraw(pool, used); used.push(c.key);
    var head='🔨 鐵砧 <small>'+esc(m.label)+'・第 '+(i+1)+' 下</small> <button class="btn ghost" id="fstop" style="float:right;padding:2px 8px">今天先到這</button>';
    var after=function(ok){ if(ok){ got++; S.gold+=1; } i++; save(); hud(); next(); };
    if(c.st==='new' || c.st==='weak') askForgeChoice(head, c, after); else askConj(head, c, after);
    var st=document.getElementById('fstop'); if(st) st.onclick=function(){ finish(); };
  }

function guide(cost, doorPt){
  if(count('ore')<(cost.ore||0)) return {to:nearestNode(['rock']), need:'⛏'};
  if(count('obj')<(cost.obj||0)) return {to:nearestNode(['bush']), need:'📦'};
  if(count('fish')<(cost.fish||0)) return {to:nearestNode(['fish']), need:'🐟'};

}

function door(k){ var d=LOTS[k].door; return {x:d[0]+.5, y:d[1]+.5}; }
function nearestNode(kinds){

  nodes.forEach(function(n){ if(n.done||kinds.indexOf(n.k)<0) return; if(n.k==='fish'&&!S.built.bridge) return;

  return best;
}

function starsOf(k){ var L=LOTS[k]; if(!L.fam) return ''; var n=standCount(L.fam)+(L.fam==='noun'?0:0), s=n>=30?3:n>=15?2:n>=5?1:0; return {s:s, n:n}; }

/* 打字填空（產出）。cb(ok)；不寫＝cb(null) */
function writeOne(head, q, cb){
  var t0=Date.now(), rc={kind:'打字', ref:qRef(q), q:q.q, a:q.a};
  openSheet('<h3>'+head+'</h3>'+(q.zh?'<div class="muted">'+esc(q.zh)+'</div>':'')+
    '<div class="qtext fr">'+esc(q.q)+'</div>'+(q.hint?'<div class="hint">💡 '+esc(q.hint)+'</div>':'')+
    '<input class="fill" id="fin" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" lang="fr" placeholder="打空格裡的字（或整句）">'+
    '<div class="fb" id="fb"></div><div class="row2"><button class="btn ghost" id="skip">↷ 不寫</button><button class="btn main" id="sub">交出去</button></div>'+repSlot(rc), true);
  var inp=document.getElementById('fin'); setTimeout(function(){ inp.focus(); },50);
  document.getElementById('skip').onclick=function(){ cb(null); };
  var sent=false;
  function submit(){
    var v=inp.value.trim(); if(!v || sent) return; sent=true; inp.disabled=true; rc.pick=v;
    var alts=String(q.a).split('|'), ok=false, accentOnly=false;
    var low=function(x){ return String(x).toLowerCase().replace(/[’]/g,"'").replace(/\s+/g,' ').replace(/[.!?]\s*$/,'').trim(); };
    alts.forEach(function(a){
      var whole=sayOf(q,a);   /* 把空格填回去的整句也接受 */
      [a, whole].forEach(function(t){ if(low(v)===low(t)) ok=true; else if(normAns(v)===normAns(t)) accentOnly=true; });
    });
    if(accentOnly&&!ok) ok=true;
    var ms=Date.now()-t0, right=alts.slice().sort(function(a,b){ return a.length-b.length; })[0];
    var full=alts.slice().sort(function(a,b){ return b.length-a.length; })[0], said=/\s/.test(full)&&!/[一-鿿]/.test(full)?full:frOnly(sayOf(q,right));
    rec('q', q, ok, ms, {chosen:v, right:right, where:'✍️ 寫下來'});
    var fb=document.getElementById('fb');
    fb.innerHTML=(ok?'✓ '+(accentOnly?'意思對了（注意重音：<span class="say">'+esc(right)+'</span>）':'寫對了'):'差一點')+
      (ok?(said?'<div>👉 <span class="say">'+esc(said)+'</span> '+spk(said)+'</div>':''):explainHtml(q, v, right, said||right));

    document.getElementById('back').onclick=function(){ cb(ok); };
  }
  document.getElementById('sub').onclick=submit;
  inp.addEventListener('keydown',function(e){ if(e.key==='Enter') submit(); });
}

function topicLabel(t){
  if(/^exam-/.test(t) && typeof EXAM_TYPES!=='undefined'){ var T=EXAM_TYPES[t.slice(5)]; return {fr:T?T.label:t, zh:'理解型（考試樣式）', point:null}; }
  if(/^scene:/.test(t)){ var sc=(typeof SCENE_BY_ID!=='undefined')&&SCENE_BY_ID[t.slice(6)]; return {fr:sc?sc.fr:'Dialogue', zh:'情境對話'+(sc?'・'+sc.zh:''), point:null}; }
  var p=(typeof gramPointOfTopic==='function')?gramPointOfTopic(t):null;
  var fr=(typeof TOPIC_LABELS_FR!=='undefined'&&TOPIC_LABELS_FR[t])||t;
  return {fr:fr, zh:p&&p.rule?p.rule.title.split(/[—－-]/)[0].trim():'', point:p};
}
/* 分類（CLAUDE.md 教學鐵律）：
   ⚡ 手滑：這個主題平常都對（≥80%，至少 5 次），這一趟只錯一次
   ✂️ 自動化缺口：規則講得出來（文法點階段 ≥3「遮規則」，或他自己說講得出來）但還是錯
   🧠 概念缺口：他說講不出來
   ❓ 不明：問他一句「這個規則你講得出來嗎？」 */
function classify(topic, nWrongNow){
  var t=S.topic[topic]||{r:0,w:0}, tot=t.r+t.w;
  var prevR=t.r, prevTot=tot-nWrongNow; /* 扣掉這一趟的錯來看「平常」 */
  if(nWrongNow===1 && prevTot>=5 && prevR/prevTot>=.8) return 'slip';
  var cs=S.canSay[topic];
  if(cs && Date.now()-cs.d<14*86400000) return cs.v?'auto':'concept';
  var p=topicLabel(topic).point;
  if(p && typeof gramStageOf==='function' && gramStageOf(p.id)>=3) return 'auto';
  return 'ask';
}
function classifyG(it, nWrongNow){
  var gs=readLS('clb7_gender_seen')[it.n]||{}, mine=S.gword[it.n]||{r:0,w:0};
  var r=(gs.c||gs.r||0)+mine.r, tot=r+(gs.w||0)+mine.w-nWrongNow;
  if(nWrongNow===1 && tot>=4 && r/tot>=.8) return 'slip';
  return 'auto';
}
var TAG={scene:'💬 情境', slip:'⚡ 手滑', auto:'✂️ 要練到不用想', concept:'🧠 規則還沒到位', ask:'❓'};
var lastTrip=null;
function review(again){
  var trip=again||log; if(!again) log=[]; lastTrip=trip;
  var ok=trip.filter(function(l){ return l.ok; }), wrong=trip.filter(function(l){ return l.ok===false; });
  var fast=ok.filter(function(l){ return l.ms; }).sort(function(a,b){ return a.ms-b.ms; })[0];
  /* 結算：這趟帶回什麼（⛔ 不秀分母、不說錯幾題） */
  var loot={ore:0,obj:0,fish:0,bad:0}; bag.forEach(function(b){ loot[b.k]=(loot[b.k]||0)+1; if(!b.good) loot.bad++; });
  var h='<h3>🏘️ 這一趟 <small>💰 '+S.gold+'</small></h3>';
  h+='<div class="bagrow">'+(loot.ore?'<span>⛏ ×'+loot.ore+'</span>':'')+(loot.obj?'<span>📦 ×'+loot.obj+'</span>':'')+(loot.fish?'<span>🐟 ×'+loot.fish+'</span>':'')+(loot.bad?'<span class="bad">其中瑕疵 '+loot.bad+'</span>':'')+(bag.length?'':'<span>背包是空的</span>')+'</div>';
  h+='<div class="rv-top">'+(fast?'最快的一下 '+(fast.ms/1000).toFixed(1)+' 秒。':'')+(wrong.length?'下面這幾個再看一眼——每組最上面那行就是建議。':'這一趟全部是完整品 ✨')+'</div>';
  /* 答對但慢：沒把握的對，回饋最有用（Butler 2008）。最多 3 句，灰字 */
  var slow=ok.filter(function(l){ return l.kind==='q' && l.ms>6000 && l.item && l.item.q && !l.item.say; }).slice(0,3);
  if(slow.length) h+='<div class="rv-grp"><div class="t">答對了，但想了一下 <small>再看一眼就好</small></div>'+slow.map(function(l){ var q=l.item, said=frOnly(sayOf(q,clean(l.right||String(q.a).split('|')[0]))); return '<div class="item">'+(said?'<span class="say">'+esc(said)+'</span> '+spk(said):esc(l.right||''))+' <span class="muted">'+(l.ms/1000).toFixed(0)+' 秒</span></div>'; }).join('')+'</div>';
  /* 依主題分組；陰陽性另成一組 */
  var groups={}, order=[];

  order.sort(function(a,b){ return groups[b].length-groups[a].length; });
  order.forEach(function(k){

    if(k==='__gender'){

      h+='<div class="rv-grp"><div class="t">陰陽性 <small>Genre des noms</small><span class="tag">'+TAG[cls]+'</span></div>';
      h+='<div class="advice">'+(cls==='slip'?'平常這個字都對，這次手滑。看一眼就好。':
        '👉 不要分析字尾，<b>整塊說出來</b>：連冠詞一起唸三遍，讓 un／une 跟著字一起出來。'+(g.length>=2?' <button class="btn main" data-drill="__gender">連發 6 個</button>':''))+'</div>';
      g.forEach(function(l){ var w=whole(l.item); h+='<div class="item"><span class="say">'+(EMO[l.item.n]||'')+' '+w+'</span> '+spk(w)+' <span class="muted">（'+esc(l.item.zh)+'）</span><div class="why">'+esc(genderWhy(l.item))+'</div></div>'; });
      h+='</div>'; return;
    }
    if(k==='__listen'){
      h+='<div class="rv-grp"><div class="t">聽力・詞彙 <small>Compréhension orale</small><span class="tag">👂 聽到要認得</span></div>';
      h+='<div class="advice">👉 點 🔊 聽三次，<b>跟著唸一次</b>——聽得出來的前提是自己唸過。</div>';
      g.forEach(function(l){ h+='<div class="item"><span class="say">'+esc(l.item.fr)+'</span> '+spk(l.item.fr)+' <span class="muted">'+esc(l.item.zh)+'</span><div class="mine">你選的：'+esc(l.chosen||'')+'</div></div>'; });
      h+='</div>'; return;
    }
    var lab=topicLabel(k), cls=/^scene:/.test(k)?'scene':classify(k,g.length);
    h+='<div class="rv-grp" data-topic="'+k+'"><div class="t">'+(lab.zh?esc(lab.zh)+' ':'')+'<small>'+esc(lab.fr)+'</small><span class="tag">'+(cls==='ask'?'':TAG[cls])+'</span></div>';
    h+='<div class="advice" data-adv="'+k+'">'+adviceHtml(k,cls,g.length)+'</div>';
    g.forEach(function(l){
      var q=l.item, longest=String(q.a).split('|').sort(function(a,b){ return b.length-a.length; })[0];
      var said=q.say||(q.type==='fill'&&/\s/.test(longest)&&!/[\u4e00-\u9fff]/.test(longest)?longest:frOnly(sayOf(q,clean(l.right||String(q.a).split('|')[0]))));
      h+='<div class="item">'+(said?'<span class="say">'+esc(said)+'</span> '+spk(said):'<span class="say">'+esc(l.right)+'</span>')+
        '<div class="mine">'+esc(l.where||'')+'｜題目：'+esc(q.q)+'<br>你選的：'+esc(clean(l.chosen||'')||l.chosen||'')+'</div>'+
        (q.aNote?'<div class="why">為什麼：'+note(q.aNote)+'</div>':'')+'</div>';
    });
    h+='</div>';
  });
  h+='<div class="row2"><span class="muted">跳過的不算、也不會出現在這裡。</span><button class="btn main" id="rvgo">好，回小鎮</button></div>';
  openSheet(h, true);

function adviceHtml(k,cls,n){

      ' <div style="margin-top:6px"><button class="btn" data-drill="'+k+'">看懂了，連發 6 題</button></div>';
  }
  return '這個規則你講得出來嗎？ <button class="btn" data-say-rule="1" data-k="'+k+'">講得出來</button> <button class="btn" data-say-rule="0" data-k="'+k+'">講不出來</button>';
}
function bindReview(){
  sheet.querySelectorAll('[data-say-rule]').forEach(function(b){ b.onclick=function(){
    var k=b.dataset.k, v=b.dataset.sayRule==='1'; S.canSay[k]={v:v,d:Date.now()}; save();
    var cls=v?'auto':'concept', box=sheet.querySelector('[data-adv="'+k+'"]');
    box.innerHTML=adviceHtml(k,cls,1); sheet.querySelector('[data-topic="'+k+'"] .tag').textContent=TAG[cls]; bindReview();
  }; });
  sheet.querySelectorAll('[data-drill]').forEach(function(b){ b.onclick=function(){ drill(b.dataset.drill); }; });
  var go=document.getElementById('rvgo'); if(go) go.onclick=function(){ closeSheet(); };
}
/* 連發：同一個結構 6 題，快、不講課（自動化缺口的處方）；每題對 +1 🪙，可以隨時停 */
function drill(k){
  var n=0, got=0, isG=k==='__gender';
  var list=isG?null:BANK.filter(function(q){ return q.topic===k && q.type==='choose' && q.opts && (/_{2,}/.test(q.q) || !q.opts.some(function(o){ return /[\u4e00-\u9fff]/.test(o); })); }), ended=false;
  function next(){
    if(n>=6 || (!isG&&!list.length)){ if(ended) return; ended=true; S.gold+=got; save(); hud();
      openSheet('<h3>連發結束 <small>+'+got+' 🪙</small></h3><div class="muted">練到這裡就好。</div><div class="row2"><span></span><button class="btn main" id="dgo">回到回顧</button></div>');
      document.getElementById('dgo').onclick=function(){ if(lastTrip) review(lastTrip); else closeSheet(); }; return; }
    n++;
    var stopBtn=function(){ var s=document.createElement('button'); s.className='btn ghost'; s.textContent='■ 停'; s.onclick=function(){ n=99; next(); }; var k=document.getElementById('skip'); if(k) k.after(s); };
    if(isG){ var it=pickGender(); askGender('連發 '+n+'／6 <small>整塊說出來</small>', it, function(ok,ms){ rec('g',it,ok,ms,{where:'連發'}); if(ok) got++; next(); }); }
    else { var q=pickQ(list,false); askChoose('連發 '+n+'／6 <small>'+esc(topicLabel(k).fr)+'</small>', q, function(ok,ms,ch,right){ rec('q',q,ok,ms,{chosen:ch,right:right,where:'連發'}); if(ok) got++; next(); }); }
    stopBtn();
  }
  next();
}


/* ---------- A3. 居民（路人）—— 每位居民＝scenes.js 裡「對方」那個角色 ----------
   role：你（Owen，剛搬來的人）在這個劇本扮演哪個角色；另一個角色就是居民
   ⭐ 居民名字沿用劇本裡的名字（台詞裡會叫到，例：Moi, c'est Clément Dupré.），⛔ 不改台詞      */
var PLAYER_ROLE={
  boulangerie:'client', restaurant:'client', 'restaurant-a2':'client', vetements:'client', tshirt:'client',
  chemin:'touriste', hotel:'touriste', 'hotel-modif':'client', medecin:'patient', pharmacie:'client',
  logement:'locataire', agence:'client', voisin:'nouveau', banque:'client', aeroport:'loic',
  'rendez-vous':'perrine', sport:'moi', entretien:'candidat'
};
var RESIDENTS=[  /* 10-16 樣本：先接 Clément（其餘居民等圖鑑擴充後再開） */
  /* 第一批（先做這 6 位）。lot＝住哪棟（蓋好之後白天會站在門口）；sit＝situations.js 的情境（插話題從這裡抽） */
  {id:'clement',  name:'Clément Dupré',      spr:['d',99],  lot:'home',   scenes:['voisin'],                        sit:['logement','se-presenter'], first:1},
  {id:'boulanger',name:'La boulangère',      spr:['d',85],  lot:'bakery', scenes:['boulangerie'],                   sit:['courses'],                 first:1},
  {id:'proprio',  name:'La propriétaire',    spr:['d',100], lot:'home',   scenes:['logement'],                      sit:['logement']},
  {id:'thomas',   name:'Thomas',             spr:['d',98],  lot:null,     scenes:['rendez-vous','sport'],           sit:['rendez-vous','loisirs']},
  {id:'pharma',   name:'La pharmacienne',    spr:['d',100], lot:null,     scenes:['pharmacie'],                     sit:['sante']},
  {id:'docteure', name:'La docteure',        spr:['d',99],  lot:null,     scenes:['medecin'],                       sit:['sante']},
  /* 第二批（v2）：Marina（aeroport）、Le serveur（restaurant／restaurant-a2）、Le vendeur（vetements／tshirt）、
     Le monsieur（chemin，只問路不交朋友）、鎮長（entretien，第一天登記用）。
     ⚠️ hotel／hotel-modif／banque／agence 台詞裡報的是外地的店名（Hôtel Atlantique、Hôtel Solis、Banque du Nord、
        Le monde en voyages）→ 不是鎮上的居民，建議做成「📮 郵局的公用電話」：打電話出去，⛔ 不算路人、不算關係值 */
];
/* 對方叫你的名字跟你不是同一個人（劇本裡你叫 M. Rousseau／monsieur Norin／Michel Barbier）：
   ① 居民說的話裡有這些名字 → 照樣顯示（那是他說的話，⛔ 不改）但標「（劇本裡的名字）」
   ② 「你」要說出別人的名字（Oui. Michel Barbier.）→ 這一格不出題，居民直接接下一句        */
var NOT_ME=/Michel Barbier|Norin|Rousseau|Joan|Loïc|Perrine/;
var REL_STAGE=[ {at:0,ic:'',   zh:'陌生'}, {at:1,ic:'🌱',zh:'認識'}, {at:6,ic:'🌿',zh:'熟客'},
                {at:14,ic:'🌳',zh:'信任'}, {at:24,ic:'🌸',zh:'朋友'} ];
var REL_GAIN={good:2, ok:1, bad:0, sceneDone:3};   /* ⛔ 沒有負數：關係只會停，不會退 */

/* ============================================================
   B. 🔀 岔路：crossroad(n)
   ============================================================ */
/* （岔路的程式在 tools/town_encounters_draft.js，這一版還沒接） */
var SCENE_BY_ID={}; (typeof SCENES!=='undefined'?SCENES:[]).forEach(function(s){ SCENE_BY_ID[s.id]=s; });

/* 存檔：S.rel[居民id] = { pts, met, sc:目前劇本, at:目前節點, done:{劇本:次數}, path:{劇本:{節點:1}}, last, mood:{d:日期, v:'warm'|'meh'} }
         S.vknown[劇本:節點] = { n:次數, last }   ← 「↷ 這句我會」的紀錄（物件形狀＋last，配合 sync 的物件合併慣例） */
function relOf(id){ S.rel=S.rel||{}; S.vknown=S.vknown||{}; return S.rel[id]||(S.rel[id]={pts:0, met:0, sc:null, at:null, done:{}, path:{}, last:0, mood:null}); }
function stageOf(pts){ var s=0; REL_STAGE.forEach(function(r,i){ if(pts>=r.at) s=i; }); return s; }
function residentById(id){ return RESIDENTS.filter(function(r){ return r.id===id; })[0]; }

/* 一個劇本裡「你」要開口的格子；good 有 1 個以上、而且有一個不是 good 的選項才算「有對錯」 */
function playerNodes(scene){
  var role=PLAYER_ROLE[scene.id], out=[];
  Object.keys(scene.nodes).forEach(function(id){ var n=scene.nodes[id];
    if(n.speaker!==role || !n.choices) return;
    var goods=n.choices.filter(function(c){ return c.tag==='good' && !c.constructed; });
    var graded=n.choices.some(function(c){ return c.tag!=='good'; });
    var clash=goods.some(function(c){ return NOT_ME.test(c.fr); });
    out.push({id:id, graded:graded, free:!graded && goods.length>=2, clash:clash});
  });
  return out;
}
/* 選下一個劇本：先把還沒走完的走完；都走過 → 回到走過的劇本，⭐ 從「還沒走過的分岔」那一格開始（feedback_play_then_memorize） */
function nextScene(R, st){
  for(var i=0;i<R.scenes.length;i++){ if(!st.done[R.scenes[i]]) return {sc:R.scenes[i], at:SCENE_BY_ID[R.scenes[i]].start}; }
  var sc=R.scenes[Math.floor(Math.random()*R.scenes.length)], S0=SCENE_BY_ID[sc], seenP=st.path[sc]||{};
  var unseen=Object.keys(S0.nodes).filter(function(k){ return !seenP[k] && S0.nodes[k].speaker===PLAYER_ROLE[sc]; });
  return {sc:sc, at:unseen.length ? findEntryBefore(S0, unseen[0]) : S0.start};
}
/* 從某個沒走過的格子往回找一個「居民先說話」的入口，讓這段對話有頭 */
function findEntryBefore(scene, target){
  var parent={}; Object.keys(scene.nodes).forEach(function(k){ var n=scene.nodes[k];
    (n.choices||[{next:n.next}]).forEach(function(c){ if(c.next && !parent[c.next]) parent[c.next]=k; }); });
  var p=parent[target]; return p || target;
}

function villager(v){
  var R=residentById(v.rid), st=relOf(R.id), today0=today();
  if(!st.sc || !SCENE_BY_ID[st.sc] || !st.at || st.at==='end'){ var nx=nextScene(R, st); st.sc=nx.sc; st.at=nx.at; }
  var scene=SCENE_BY_ID[st.sc], role=PLAYER_ROLE[scene.id];
  var MAX=2, asked=0, gained=0, anyBad=false, chat=[];
  var firstMeet=!st.met; st.met=1; if(firstMeet) st.pts=Math.max(st.pts,1);
  function head(){ var s=stageOf(st.pts); return '🧑 '+esc(R.name)+' '+(REL_STAGE[s].ic||'')+' <small>'+esc(scene.icon||'')+' '+esc(scene.fr||'')+'</small>'; }
  function bubble(who, fr){ chat.push('<div class="item"><b>'+esc(who)+'</b>：<span class="say">'+esc(fr)+'</span> '+spk(fr)+'</div>'); }
  function goodOf(n){ var g=n.choices.filter(function(c){ return c.tag==='good' && !c.constructed; }); return g[Math.floor(Math.random()*g.length)]||n.choices[0]; }
  function mark(id){ (st.path[st.sc]=st.path[st.sc]||{})[id]=1; }

  function step(){
    var n=scene.nodes[st.at];
    if(!n || n.speaker==='system' || st.at==='end') return sceneEnd();
    if(n.speaker!==role){                                   /* 居民說話：固定台詞，或居民那一方的 good 選項 */
      var c=n.line?{fr:n.line,next:n.next}:goodOf(n);
      bubble(R.name, c.fr); mark(st.at); st.at=c.next; return step();
    }
    if(n.line){ bubble('你', n.line); mark(st.at); st.at=n.next; return step(); }
    if(asked>=MAX) return pause();
    var goods=n.choices.filter(function(c){ return c.tag==='good' && !c.constructed; });
    if(goods.some(function(c){ return NOT_ME.test(c.fr); })){ var g0=goods[0]; bubble('你', g0.fr); mark(st.at); st.at=g0.next; return step(); }
    return ask(n);
  }
  function ask(n){
    var t0=Date.now(), done=false, opts=shuffle(n.choices.filter(function(c){ return !(c.constructed && c.tag==='good'); }));
    var last=chat.slice(-3).join('');
    openSheet('<h3>'+head()+'</h3>'+last+
      (n.tip?'<details class="hint"><summary>💡 情境</summary>'+esc(n.tip)+'</details>':'')+   /* 預設收起來（feedback_orientation_collapsed_by_choice） */
      '<div class="opts">'+opts.map(function(c,i){ return '<button data-i="'+i+'">'+esc(c.fr)+'</button>'; }).join('')+'</div>'+
      '<div class="fb" id="fb"></div><div class="row2"><span><button class="btn ghost" id="known">↷ 這句我會</button> <button class="btn ghost" id="bye">👋 點頭走過</button></span><span id="slot"></span></div>', true);
    sheet.querySelectorAll('.opts button').forEach(function(b){ b.onclick=function(){
      if(done) return; done=true;
      var c=opts[+b.dataset.i], ms=Date.now()-t0, graded=n.choices.some(function(x){ return x.tag!=='good'; });
      var good=c.tag==='good', best=good?c:goodOf(n);
      asked++; mark(st.at);
      /* 紀錄：沿用 town.html 的 rec（topic 用 'scene:<id>'，回顧那裡才分得出是哪個劇本） */
      if(graded) rec('q', {topic:'scene:'+scene.id, _i:'v:'+scene.id+':'+st.at, q:(chat.length?chat[chat.length-1].replace(/<[^>]+>/g,''):'')+'　→ 你要回什麼？',
                           a:best.fr, aNote:c.tag==='good'?(best.note||''):(c.note||''), say:best.fr, lesson:0},
                     c.tag!=='bad', ms, {chosen:c.fr, right:best.fr, where:'🧑 '+R.name});
      var gain=REL_GAIN[c.tag]||0; st.pts+=gain; gained+=gain; if(c.tag==='bad') anyBad=true;
      bubble('你', c.fr); speak(c.fr);
      sheet.querySelectorAll('.opts button').forEach(function(x){ var o=opts[+x.dataset.i]; if(o.tag==='good') x.classList.add('ok'); });
      if(c.tag==='bad') b.classList.add('no');
      var fb=document.getElementById('fb');
      /* 反應在居民身上：good＝笑、ok＝照樣接話但有一點怪、bad＝愣一下（⛔ 不罵他、不扣關係） */
      fb.innerHTML = c.tag==='good' ? '😊 <span class="muted">'+esc(c.zh||'')+'</span>'
        : c.tag==='ok' ? '🙂 '+esc(R.name)+' 照樣接話了。<div class="muted">'+note(c.note||'')+'</div><div>更自然：<span class="say">'+esc(best.fr)+'</span> '+spk(best.fr)+'</div>'
        : '😕 '+esc(R.name)+' 愣了一下。<div class="muted">'+note(c.note||'')+'</div><div>👉 <span class="say">'+esc(best.fr)+'</span> '+spk(best.fr)+'</div>';
      document.getElementById('known').parentNode.style.visibility='hidden';
      document.getElementById('slot').outerHTML='<button class="btn main" id="go">繼續</button>';
      document.getElementById('go').onclick=function(){ st.at=c.next; save(); step(); };
      if(c.tag==='good') setTimeout(function(){ var g=document.getElementById('go'); if(g) g.click(); }, 900);
    }; });
    /* ⭐ 跳過第一層：這一句我會 → 居民自己把話接下去（照 good 那條走），⛔ 不計分、不進回顧，記次數只拿來降低出現頻率 */
    document.getElementById('known').onclick=function(){ if(done) return; done=true;
      var k=scene.id+':'+st.at, o=S.vknown[k]||{n:0}; o.n++; o.last=Date.now(); S.vknown[k]=o;
      var g=goodOf(n); bubble('你', g.fr); mark(st.at); st.at=g.next; asked++; save(); step(); };
    /* ⭐ 跳過第二層：點頭走過 → 這段對話停在這裡，下次遇到從這裡接，⛔ 關係不變 */
    document.getElementById('bye').onclick=function(){ if(done) return; done=true; save(); closeSheet(); v.calm=25; v.wave=1.2; };
  }
  function pause(){                                          /* 一次遭遇最多回 2 句：劇本沒走完也先停，下次接著 */
    finishEncounter(false);
  }
  function sceneEnd(){
    st.done[st.sc]=(st.done[st.sc]||0)+1; st.pts+=REL_GAIN.sceneDone; gained+=REL_GAIN.sceneDone;
    st.sc=null; st.at=null; finishEncounter(true);
  }
  function finishEncounter(full){
    var before=stageOf(st.pts-gained), after=stageOf(st.pts);
    st.last=Date.now(); st.mood={d:today0, v:anyBad?'meh':'warm'}; save();
    var gift='';
    /* 禮物用金幣，⛔ 不塞進背包（背包的 obj 有陰陽性，老鼠題會拿它出題） */
    if(!anyBad && gained>0){ var g=2+stageOf(st.pts); S.gold+=g; hud(); gift='<div>🎁 '+esc(R.name)+' 請你喝了杯咖啡，還塞給你 '+g+' 🪙。</div>'; }
    var up = after>before ? '<div class="story">'+esc(R.name)+' 現在跟你是「'+REL_STAGE[after].zh+'」'+REL_STAGE[after].ic+(after===2?'——之後會到 🏪 交貨攤下訂單。':after===3?'——他好像有話想跟你說。':'')+'</div>' : '';
    openSheet('<h3>'+head()+'</h3>'+chat.slice(-4).join('')+gift+up+
      '<div class="muted">'+(full?'這段對話說完了。':'他還有話沒說完，下次遇到會接著聊。')+'</div>'+
      '<div class="row2"><span></span><button class="btn main" id="ok">再見</button></div>');
    document.getElementById('ok').onclick=function(){ closeSheet(); v.calm=25; v.wave=1.2; };
  }
  step();
}


/* ============================================================
   📖 物品圖鑑（10-16 Owen：拉力＝「看自己的地方變熱鬧」＋「把圖鑑收集完」；選動森型＝字就是那個東西）
   ⭐ 收服＝叫對 un／une；✨ 閃光＝2 秒內；🌟 進化＝同一樣東西在不同的兩天都收服（＝站穩）
   ⭐ 圖鑑收到 DEX_MILESTONE 種 → 以前的居民回到鎮上（鎮變熱鬧）。⛔ 不顯示「N／481」分母，缺的格子用剪影
   ============================================================ */
var DEX_MILESTONE=10, lastCatch=null, villagers=[], grassDist=0, lastWild=-99;
var RAR=['普通','少見','稀有'];
function rarity(it){ var l=it.lesson||0; return l>=29?2:(l>=13?1:0); }
function dexCount(){ return Object.keys(S.dex||{}).length; }
/* ============================================================
   📖 圖鑑收服規則（10-18 Owen：「2 3 沒問題，甚至過一段時間需要重新收服」）
   ⏳ 確定過一次（半透明）→ 收服＝兩個不同天都「答對＋很確定」→ 過 7 天褪色 🔁 要重新收服
   → 重新收服後間隔拉長 21 天、60 天（每次 +★）；收服過的答錯／需要重練＝馬上要重新收服
   d = { t, days[], conf, due, lv, shiny, last }   ⚠️ 舊存檔：evo＝已收服、沒 evo＝確定過一次
   ============================================================ */
var DEX_GAP=[7,21,60];
function dexState(d){
  if(!d) return 'none';
  if(d.conf==null){ d.conf=d.evo?1:0; if(d.conf){ d.lv=0; d.due=Date.now()+DEX_GAP[0]*86400000; } }
  if(!d.conf) return 'pending';
  return Date.now()>=d.due ? 'fading' : 'caught';
}
function dexCatch(it, ms){
  S.dex=S.dex||{}; var d=S.dex[it.n], t=today(), st=dexState(d), r={isNew:!d, shiny:false, evo:false, recap:false, pend:false};
  if(!d) d=S.dex[it.n]={t:Date.now(), days:[], conf:0, lv:0, shiny:0};
  d.last=Date.now();
  if(ms!=null && ms<2000 && !d.shiny){ d.shiny=1; r.shiny=true; }
  if(st==='none' || st==='pending'){
    if(d.days.indexOf(t)<0){ d.days.push(t); if(d.days.length>3) d.days=d.days.slice(-3); }
    if(d.days.length>=2){ d.conf=1; d.evo=1; d.lv=0; d.due=Date.now()+DEX_GAP[0]*86400000; r.evo=true; }
    else r.pend=true;
  } else if(st==='fading'){
    d.lv=Math.min((d.lv||0)+1, DEX_GAP.length-1); d.due=Date.now()+DEX_GAP[d.lv]*86400000; r.recap=true; masteryBonus(3,'重新收服');
  }
  if(!S.built.cottage && dexCount()>=DEX_MILESTONE) S.moveIn=1;
  return r;
}
function dexMiss(it){ var d=(S.dex||{})[it.n]; if(!d) return; var st=dexState(d); if(st==='caught'){ d.due=Date.now(); d.last=Date.now(); } }
function catchLine(c){ return c.evo?'🌟 收服了！兩天都確定——這個字站穩了。':c.recap?'🔁 重新收服！下次要隔更久才會褪色。':c.pend?'⏳ 先記下了——改天再確定一次才算收服。':''; }
/* 出哪一隻：還沒收的 ×3（填圖鑑）、收過但今天還沒收（要進化）×2.2、已進化 ×0.35、錯過的 ×2；稀有的比較少出 */
function pickWild(){
  var rw=recallServe(recallDue(GENDER, function(it){ return 'g:'+it.n; })); if(rw) return rw;
  var gs=readLS('clb7_gender_seen'), now=Date.now(), best=null, bw=-1, t=today();
  shuffle(GENDER).slice(0,80).forEach(function(it){
    var d=(S.dex||{})[it.n], ds=dexState(d), w= ds==='none' ? 3 : ds==='fading' ? 2.5 : ds==='caught' ? .3 : (d.days.indexOf(t)<0 ? 2.5 : .4);
    var mine=S.gword[it.n]||{}, r=gs[it.n]||{};
    if((mine.w||0)>(mine.r||0) || (r.w||0)>(r.c||r.r||0)) w*=2;
    w*=[1,.7,.45][rarity(it)];
    if(EMO[it.n]) w*=1.3;
    if(S.qlast['w:'+it.n] && now-S.qlast['w:'+it.n]<10*60000) w*=.1;
    w*=Math.random()+.3; if(w>bw){ bw=w; best=it; }
  });
  return best;
}
function wildEncounter(){
  var it=pickWild(), em=EMO[it.n]||'📦', rr=rarity(it);
  askGender('🌳 野生的 '+em+' 出現了！ <small>'+RAR[rr]+'・叫對 un／une 就收服</small>', it, function(ok,ms,info){
    S.qlast['w:'+it.n]=Date.now();

function freeNear(x,y){
  for(var r=0;r<6;r++) for(var dy=-r;dy<=r;dy++) for(var dx=-r;dx<=r;dx++){ if(Math.max(Math.abs(dx),Math.abs(dy))!==r) continue;

  return {x:x, y:y};
}

function updateVillagers(dt){

var wild=null, PIXIMG={};

function freeSpot(x,y){ return x>1 && y>1 && x<W-1 && y<H-1 && !blocked(x,y) && region(Math.floor(x),Math.floor(y))!=='river'; }
function startWild(){
  var it=pickWild(), em=EMO[it.n]||'📦', f=hero.face||1;

  var two=null;
  for(var i=0;i<cands.length && !two;i++) for(var j=i+1;j<cands.length;j++) if(Math.hypot(cands[i][0]-cands[j][0],cands[i][1]-cands[j][1])>=2.4){ two=[cands[i],cands[j]]; break; }

  var cpos=two && [[hero.x,hero.y-2.7],[hero.x+f*2.8,hero.y+.8],[hero.x-f*2.8,hero.y+.8],[hero.x,hero.y+2.6],[hero.x+f*3,hero.y-2.2],[hero.x-f*3,hero.y-2.2]].filter(function(p){

  if(!two || !cpos){ var ring=[]; for(var R=1.8;R<=3.4;R+=.4) for(var A=0;A<16;A++){ var px=hero.x+Math.cos(A*Math.PI/8)*R, py=hero.y+Math.sin(A*Math.PI/8)*R; if(freeSpot(px,py)) ring.push([px,py]); }
    two=null; cpos=null;
    for(var a=0;a<ring.length && !cpos;a++) for(var b2=a+1;b2<ring.length && !cpos;b2++){ if(Math.hypot(ring[a][0]-ring[b2][0],ring[a][1]-ring[b2][1])<2.4) continue;
      var tw=[ring[a],ring[b2]]; cpos=ring.filter(function(p){ return tw.every(function(b){ return Math.hypot(p[0]-b[0],p[1]-b[1])>=1.8; }); })[0]||null; if(cpos) two=tw; }

        blocks:[{x:two[0][0],y:two[0][1],g:gs[0],st:'',a:0},{x:two[1][0],y:two[1][1],g:gs[1],st:'',a:0}]};

function updateWild(dt){

      joy=null; keys={};   /* ⚠️ 不設 busy：讓方塊彈起來的動畫跑完 */
      setTimeout(function(){ genderAfter(it, ok, ms, function(fin, ms2, info){

        if(fin){ S.gold+=1; if(bag.length<S.bagCap) bag.push({k:'obj', name:said, n:it.n, g:it.g, em:em, good:true});

function drawWild(list,ox,oy,ts){

    if(b.st==='broken'){ var k=1-Math.max(0,b.a)/.5; cx.globalAlpha=Math.max(0,1-k); cx.fillStyle='#b8752a';
      for(var q=0;q<4;q++){ var ax=(q%2?1:-1)*k*ts*.6, ay=(q<2?-1:1)*k*ts*.4+k*k*ts; cx.fillRect(px+ax-s*.18, py+ay-s*.18, s*.36, s*.36); } cx.globalAlpha=1; return; }

    cx.fillStyle='#2a1a08'; [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(function(c){ cx.fillRect(px+c[0]*s*.36-DPR, py+c[1]*s*.36-DPR, DPR*3, DPR*3); });
    cx.textAlign='center'; cx.textBaseline='middle'; cx.font=Math.round(ts*.36)+'px Cubic11, system-ui'; cx.fillStyle=used?'#f0e0c0':'#3a2208';

  }}); });

var CONFUSE=[['suis','es','est','sommes','êtes','sont'],['ai','as','a','avons','avez','ont'],['a','à'],['le','la','les','un','une','des'],
  ['du','des','au','aux'],['mon','ma','mes','ton','ta','tes','son','sa','ses'],['ce','cette','ces'],['il','elle','ils','elles'],
  ['je','tu','nous','vous'],['à','au','aux','en','dans'],['et','est'],['ou','où'],['va','vas','vais','vont','allons','allez'],
  ['fait','fais','faites','font','faisons'],['peux','peut','peuvent','pouvons','pouvez'],['veux','veut','veulent','voulons','voulez'],
  ['pas','plus','jamais','rien'],['que','qui','quoi'],['de','du','des'],['pour','par','avec','sans'],
  ['moi','toi','lui','eux'],['me','te','se'],['ici','là'],['bon','bonne','bons','bonnes'],['petit','petite','petits','petites'],

function tileTok(a){
  return String(a).replace(/[’‘]/g,"'").split(/\s+/).map(function(t){ return t.replace(/^[«"“(]+|[.,!?;:»"”)]+$/g,''); })
    .filter(function(t){ return t && /[A-Za-zÀ-ÿ0-9]/.test(t); });
}
function tileKey(t){ return String(t).toLowerCase(); }
function tileTraps(real, lesson){
  var have={}, pool=[], out=[]; real.forEach(function(t){ have[tileKey(t)]=1; });
  real.forEach(function(t){ var k=tileKey(t); CONFUSE.forEach(function(g){ if(g.indexOf(k)>=0) g.forEach(function(x){ if(!have[x]&&pool.indexOf(x)<0) pool.push(x); }); }); });
  var want=real.length>=7?3:2;
  shuffle(pool).slice(0,want).forEach(function(x){ out.push(x); });
  if(out.length<want){   /* 同族字不夠：從同一課別題的答案裡補（真的學過的字） */
    var bag=[];
    BANK.forEach(function(q){ if(!q||typeof q.a!=='string'||q.lesson!==lesson) return;
      tileTok(q.a.split('|')[0]).forEach(function(w){ var k=tileKey(w); if(w.length>1&&!have[k]&&out.indexOf(k)<0&&bag.indexOf(k)<0) bag.push(k); }); });
    shuffle(bag).slice(0,want-out.length).forEach(function(w){ out.push(w); });
  }

}
function lcsKeep(seq, ref){

  for(i=0;i<=n;i++){ var row=[]; for(j=0;j<=m;j++) row.push(0); dp.push(row); }
  for(i=1;i<=n;i++) for(j=1;j<=m;j++) dp[i][j]=(seq[i-1]===ref[j-1])?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);
  var keep=[], ii=n, jj=m;
  while(ii>0&&jj>0){ if(seq[ii-1]===ref[jj-1]){ keep.push(ii-1); ii--; jj--; } else if(dp[ii-1][jj]>=dp[ii][jj-1]) ii--; else jj--; }

var TILE_SRC=null;
function tileSources(){

  function sentLike(x){ return x&&x.fr&&x.zh&&okN(x.fr)&&!/\s\/\s|…|\.\.\.|→|[（(]/.test(x.fr); }
  TILE_SRC={
    A: BANK.filter(function(q){ return q.type==='trans'&&typeof q.a==='string'&&q.q&&okN(q.a); }),
    S: (typeof SENTENCES!=='undefined'?SENTENCES:[]).filter(sentLike),
    C: (typeof CHUNKS!=='undefined'?CHUNKS:[]).filter(sentLike)
  };
  return TILE_SRC;
}
function tileQuestion(){
  var T=tileSources(), r=Math.random(), k=r<.34?'A':(r<.64?'S':'C');
  if(!T[k].length) k=T.A.length?'A':(T.S.length?'S':'C');
  var arr=T[k], seenT=S.tseen=S.tseen||{}, now=Date.now(), src=null;
  for(var tries=0;tries<12;tries++){ var c=arr[Math.floor(Math.random()*arr.length)], id=k==='A'?'q:'+c._i:k+':'+c.id;
    if(!seenT[id]||now-seenT[id]>36*3600000){ src=c; break; } src=c; }
  var q = k==='A' ? {zh:src.q, a:src.a, lesson:src.lesson, topic:src.topic, aNote:src.aNote||'', id:'q:'+src._i, bank:src}
                  : {zh:src.zh, a:src.fr, lesson:src.lesson, topic:'tiles', aNote:src.note||'', id:k+':'+src.id};

  g.forEach(function(x){ used[x.rc[0]+','+x.rc[1]]=x; });
  var grid='';
  for(var r=0;r<6;r++) for(var c=0;c<6;c++){ var x=used[r+','+c];
    if(!x){ grid+='<div class="pcell empty"></div>'; continue; }
    var st=pst(x.ref), col=['#e8e1cf','#8fc3ff','#f0c95a'][st.st];
    grid+='<button class="pcell" data-pn="'+x.n+'" style="border-color:'+(st.last?col:'rgba(255,255,255,.18)')+'">'+pix(x.em, Math.round(cell*.55))+'<small>'+x.n+'</small></button>'; }
  var me=g[(at||1)-1]||g[0];
  openSheet('<h3>🏛 '+esc(I.title)+' <small>的房間</small></h3><div class="proom" style="--pc:'+cell+'px">'+grid+
    '<div class="pme" id="pme" style="left:'+(me.rc[1]*cell)+'px;top:'+(me.rc[0]*cell)+'px">🧍</div></div>'+
    '<div class="muted" style="margin-top:6px">順序：從左上角的門口沿著牆走一圈，再走內圈。</div>'+
    '<div class="row2"><button class="btn ghost" id="pback">← 其他房間</button><button class="btn main" id="ptour">▶ 照順序走一圈</button></div>', true);
  function walkTo(x, then){ var m=document.getElementById('pme'); if(m){ m.style.left=(x.rc[1]*cell)+'px'; m.style.top=(x.rc[0]*cell)+'px'; } setTimeout(then, 380); }
  sheet.querySelectorAll('[data-pn]').forEach(function(b){ b.onclick=function(){ var x=g[+b.dataset.pn-1]; walkTo(x, function(){ palaceOpen(x, function(){ palaceRoom(I, x.n); }); }); }; });
  document.getElementById('pback').onclick=ISLE.on ? closeSheet : palaceHall;
  document.getElementById('ptour').onclick=function(){ var i=0;
    (function step(){ if(i>=g.length){ palaceRoom(I, g.length); toast('🏛 走完一圈了'); return; } var x=g[i++];
      palaceRoom(I, i>1?g[i-2].n:1); walkTo(x, function(){ palaceOpen(x, step, function(){ palaceRoom(I, x.n); }); }); })(); };
}

function palaceOpen(g, done, stop){
  done=done||closeSheet; stop=stop||done;

  /* ⏰ 對上了 → 隔天；只剩位置又對上 → 3、7、21 天；沒對上 → 退一階（退到認識就要回房間再學） */

    if(res==='ok'){ if(o.st>=2) k=Math.min((o.k||0)+1, PAL_GAP.length-1); due=sod(now)+PAL_GAP[k]*86400000; }
    else if(res==='no' && n>=1) due=sod(now)+86400000;

      '<div class="row2"><button class="btn ghost" id="pclose">'+(stop!==done?'先到這':'再看看')+'</button><button class="btn main" id="pok">記住了，試試看 →</button></div>', true);

  var cue = g.review ? '<div class="qtext">'+lead+'</div><div class="muted">'+esc(s.zh)+'</div><div id="pfl"><button class="btn ghost" id="pfirst" style="padding:3px 10px;font-size:.85em">給我首字母</button></div>'
          : st===1 ? '<div class="qtext">'+esc(s.zh)+'</div><div class="clue fr">'+esc(firstLetters(s.fr))+'</div>'
          : '<div class="qtext">'+pix(g.em,28)+' 這件東西上放的是哪一句？</div><details><summary class="muted">給我中文</summary><div class="muted">'+esc(s.zh)+'</div></details>';
  openSheet(head+'<div style="text-align:center;margin:4px 0">'+pix(g.em,56)+'</div>'+cue+'<div class="muted">先在心裡或出聲講一遍，再翻開。</div><div id="prev"></div>'+
    '<div class="row2" id="prow"><button class="btn ghost" id="pclose">'+(stop!==done?'先到這':'晚點')+'</button>'+(g.review?'<button class="btn ghost" id="prelearn">再學一次</button>':'')+'<button class="btn main" id="pflip">翻開</button></div>', true);
  document.getElementById('pclose').onclick=stop;
  var pf=document.getElementById('pfirst'); if(pf) pf.onclick=function(){ document.getElementById('pfl').innerHTML='<div class="clue fr">'+esc(firstLetters(s.fr))+'</div>'; };
  var rl=document.getElementById('prelearn'); if(rl) rl.onclick=function(){ setSt(0,'relearn'); speak(s.fr);
    document.getElementById('prev').innerHTML=full+'<div class="muted">沒關係，多看幾次。下次進 '+esc(g.R.name)+' 房再練它。</div>';
    document.getElementById('prow').innerHTML='<span></span><button class="btn main" id="pgo">好</button>'; document.getElementById('pgo').onclick=done; };
  document.getElementById('pflip').onclick=function(){ speak(s.fr);
    document.getElementById('prev').innerHTML=full+mineBox(g.ref, s.fr);
    document.getElementById('prow').innerHTML='<button class="btn" id="pno">沒對上</button><button class="btn main" id="pyes">對上了 ✓</button>';
    document.getElementById('pyes').onclick=function(){ if(window.GameLog) GameLog.answer(true,{kind:'🏛 宮殿', topic:'palace', ref:'pal:'+g.ref, q:s.zh, a:s.fr}); setSt(2,'ok'); if(g.review) masteryBonus(2,'🏛 宮殿'); toast(st===1?'明天回來再看一次':'記得 ✓'); done(); };

  };
}

/* ============================================================
   🕵️ 告示牌：抓錯字（10-17）
   ⭐ 題源：questions.js 法文挖空選擇題（只有一個正解、選項全法文）——把一個「錯的選項」填回句子，句子就有一個錯
   ⭐ ⛔ 不自創法文：錯的那塊本來就是題庫裡的錯誤選項；點到它＝抓到

var SPOT=null;
/* ⭐ 只收「看形式就能判斷」的題型（10-17 逐句檢查 301 句後定的）。
   ⛔ 排除：代名詞 y／en／COD／COI、命令式＋代名詞、間接引語、過去時態搭配——原題靠前後文或題目指定才判錯，
      單獨一句時錯誤選項常常合文法（Dis-le-moi si tu viens.／Elle me demande pourquoi ce poste t'intéresse.／Vous avez cherché un vol…） */

function spotPool(){
  if(SPOT) return SPOT; SPOT=[];
  var zh=function(s){ return /[一-鿿]/.test(s); };
  BANK.forEach(function(q){
    if(q.type!=='choose'||!q.opts||q.opts.length<3||!/_{2,}/.test(q.q)||q.opts.some(zh)) return;
    var stem=String(q.q).replace(/^「/,'').replace(/」.*$/,''); if(zh(stem) || (stem.match(/_{2,}/g)||[]).length!==1) return;
    /* ⚠️ 只收文法題（動詞／代名詞／名詞片語三家）：詞彙題的錯誤選項放進句子常常語意也通（le plus petit rongeur du monde）＝冤枉；題幹太短（只有一個空）也不收 */
    if(!SPOT_OK.test(q.topic) || stem.replace(/_{2,}/,'').trim().split(/\s+/).length<3) return;

    /* ⚠️ 只收「錯的那塊 ≤ 2 個字」：整個子句當選項的題，錯誤選項常常本身合文法、只是不符合題目指定的句型（例：S'il fait froid, vous pouvez m'appeler.）→ 放進句子裡會冤枉人 */
    var nw=function(x){ return String(x).trim().split(/\s+/).length; };
    if(nw(right[0])>2) return;
    var wrong=q.opts.filter(function(o){ return o!==right[0] && normAns(o)!==normAns(right[0]) && /[A-Za-zÀ-ÿ]/.test(o) && nw(o)<=2; }); if(!wrong.length) return;

/* ============================================================
   🔢 數字反應（10-18 Owen：「看數字打出來法文，我覺得這也要練反應」）
   ⭐ 在鎮上／往橋的小路上走，偶爾有店家問價錢 → 看阿拉伯數字，打出法文；記起手（第一個按鍵）時間
   ⭐ frNum：標準拼法（70–99、71 加 et、80 有 s／81 沒有、deux cents／deux cent trois、mille 不加 s），35 個已知答案驗證過
   ⭐ 1990 改革的全連字號（vingt-et-un、deux-cent-trois）也算對；⛔ cents／vingts 的 s 寫錯算錯（寫作會扣分）；只差重音＝對但提醒
   ⭐ 出題：0–20／21–69／70–99／100–999／年份 1900–2099，權重 1：2：4：2：2（70–99 最常卡）；打錯過的數字 40% 機率再出
   ⛔ 數字的拼法是規則推出來的，不是自創句子
   ============================================================ */
function frNum(n){
  var U=['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize'];
  var T={20:'vingt',30:'trente',40:'quarante',50:'cinquante',60:'soixante'};
  function u100(n){ /* 0–99 */
    if(n<=16) return U[n];
    if(n<20) return 'dix-'+U[n-10];
    if(n<70){ var t=Math.floor(n/10)*10, r=n%10; return T[t]+(r===0?'':r===1?' et un':'-'+U[r]); }
    if(n<80){ var r2=n-60; return 'soixante'+(r2===11?' et onze':'-'+u100(r2)); }
    if(n===80) return 'quatre-vingts';
    return 'quatre-vingt-'+u100(n-80);
  }
  function u1000(n){ /* 0–999 */
    if(n<100) return u100(n);
    var h=Math.floor(n/100), r=n%100;
    var head=(h===1?'cent':U[h]+' cent'+(r===0?'s':''));
    return r===0?head:head+' '+u100(r);
  }
  if(n<1000) return u1000(n);
  var th=Math.floor(n/1000), rr=n%1000;
  var hd=(th===1?'mille':u1000(th).replace(/(vingts|cents)$/,function(m){ return m.slice(0,-1); })+' mille');
  return rr===0?hd:hd+' '+u1000(rr);
}

var NUM_BUCKETS=[[0,20,1,'整數'],[21,69,2,'價格'],[70,99,4,'價格'],[100,999,2,'價格'],[1900,2099,2,'年份']], numDist=0, lastNum=-99;
/* 10-28 Owen：「數字題目太頻繁了；可以混雜有小數點的、及時間跟日期」→ 一半時間出這四種（key 是字串，整數題仍是數字）
   p:價錢帶零錢（3,50 € → trois euros cinquante）／d:小數（2,5 → deux virgule cinq）／t:時刻（14 h 30）／D:日期（14/07 → le quatorze juillet） */

}

function numNorm(x){ return String(x).toLowerCase().trim().replace(/[’]/g,"'").replace(/[-\s]+/g,' '); }
function numPick(){
  S.numWrong=S.numWrong||[];
  if(S.numWrong.length && Math.random()<.4) return S.numWrong[Math.floor(Math.random()*S.numWrong.length)];
  if(Math.random()<.5){ var kt=NUM_KINDS.reduce(function(a,b){ return a+b[1]; },0), kr=Math.random()*kt; for(var j=0;j<NUM_KINDS.length;j++){ kr-=NUM_KINDS[j][1]; if(kr<=0) return numKindKey(NUM_KINDS[j][0]); } }

/* 判定（10-19 Owen：「唸出數字是要連槓都打出來才算對嗎？」→ 空格／連字號本來就都算；再放寬兩種，算對但提醒）
   ① 字黏在一起（vingtdeux）→ 對，提醒要分開寫  ② 只差 vingts／cents 的 s → 對，提醒 s 的規則  ③ 只差重音 → 對，提醒重音 */
function numJudge(v, ans){

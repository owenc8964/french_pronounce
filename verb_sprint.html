<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sprint · CLB7</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #07080f; color: #ddd8cc;
  font-family: 'Segoe UI', system-ui, sans-serif;
  min-height: 100vh; padding: 24px 16px 80px;
  max-width: 680px; margin: 0 auto;
}

/* Header */
.header { text-align: center; margin-bottom: 20px; }
.header h1 { font-size: 1.2rem; letter-spacing: 2px; color: #f0c060;
  text-shadow: 0 0 20px rgba(240,192,96,0.35); }
.header .back { font-size: 0.72rem; color: #445060; text-decoration: none;
  display: inline-block; margin-bottom: 8px; }
.header .back:hover { color: #f0c060; }
.header .sub { font-size: 0.7rem; color: #445060; margin-top: 4px; }

/* Cards */
.card {
  background: #0d1020; border: 1px solid #1a2438;
  border-radius: 12px; padding: 16px 18px; margin-bottom: 16px;
}
.card-title { font-size: 0.65rem; color: #445060; text-transform: uppercase;
  letter-spacing: 1.5px; margin-bottom: 12px; }

/* Heatmap */
.hm-table { width: 100%; border-collapse: separate; border-spacing: 3px; }
.hm-table th { font-size: 0.6rem; color: #445060; font-weight: 600; padding: 2px;
  text-transform: none; }
.hm-table td.verb-name { font-size: 0.7rem; color: #8a94a8; text-align: right;
  padding-right: 6px; white-space: nowrap; font-weight: 600; }
.hm-cell { height: 26px; border-radius: 5px; text-align: center;
  font-size: 0.58rem; color: rgba(255,255,255,0.55); min-width: 34px; }
.hm-new    { background: #141928; }
.hm-weak   { background: #5a2420; }
.hm-slow   { background: #5a4a18; }
.hm-reflex { background: #1d5035; }
.hm-legend { display: flex; gap: 14px; margin-top: 10px; flex-wrap: wrap; }
.hm-legend span { font-size: 0.62rem; color: #445060; display: flex; align-items: center; gap: 5px; }
.hm-legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.hm-summary { font-size: 0.82rem; color: #ddd8cc; margin-bottom: 10px; }
.hm-summary b { color: #60d090; font-size: 1.05rem; }

/* Start button */
.start-btn {
  width: 100%; padding: 16px; border: none; border-radius: 12px;
  background: linear-gradient(135deg, #1d5035, #2a7048);
  color: #d0f0d8; font-size: 1rem; font-weight: 700; cursor: pointer;
  font-family: inherit; letter-spacing: 1px; margin-bottom: 16px;
}
.start-btn:hover { filter: brightness(1.15); }

/* Sprint area */
.sprint-strip {
  display: flex; align-items: center; justify-content: space-between;
  background: #0d1020; border: 1px solid #1a2438;
  border-radius: 10px; padding: 10px 18px; margin-bottom: 16px;
}
.timer-val { font-size: 1.4rem; font-weight: 700; color: #60a0d0;
  font-variant-numeric: tabular-nums; }
.timer-val.urgent { color: #d07060; }
.strip-label { font-size: 0.62rem; color: #445060; text-transform: uppercase; letter-spacing: 1px; }
.score-live { font-size: 0.95rem; font-weight: 700; color: #60d090; }
.phase-tag { font-size: 0.62rem; padding: 3px 10px; border-radius: 8px;
  background: #141928; color: #60a0d0; border: 1px solid #1a2438; }
.phase-tag.review { color: #f0c060; }

.prompt-card { text-align: center; padding: 34px 18px 28px; }
.prompt-verb { display: inline-block; font-size: 0.78rem; color: #60a0d0;
  background: #141928; border: 1px solid #1a2438; border-radius: 10px;
  padding: 4px 14px; margin-bottom: 18px; letter-spacing: 1px; }
.prompt-line { font-size: 2rem; font-weight: 700; color: #ddd8cc; margin-bottom: 24px; }
.prompt-line .blank { color: #f0c060; }
.answer-input {
  width: 100%; max-width: 320px; padding: 13px 16px; border-radius: 10px;
  background: #141928; border: 2px solid #2a3858; color: #ddd8cc;
  font-size: 1.15rem; font-family: inherit; text-align: center; outline: none;
}
.answer-input:focus { border-color: #60a0d0; }
.answer-input.flash-ok { border-color: #60d090; background: #0a1a0c; }
.answer-input.flash-bad { border-color: #d07060; background: #1a0c0a; }

.feedback-box { margin-top: 18px; font-size: 0.95rem; min-height: 52px; }
.fb-wrong { color: #d07060; }
.fb-wrong b { color: #60d090; font-size: 1.2rem; }
.fb-hint { font-size: 0.68rem; color: #445060; margin-top: 8px; }
.next-btn {
  margin-top: 12px; padding: 10px 28px; border: none; border-radius: 10px;
  background: #1a2438; color: #60a0d0; font-size: 0.88rem; font-weight: 700;
  cursor: pointer; font-family: inherit;
}
.next-btn:hover { filter: brightness(1.3); }

/* Done screen */
.done-score { text-align: center; padding: 10px 0 4px; }
.done-big { font-size: 2.4rem; font-weight: 700; color: #f0c060; }
.done-label { font-size: 0.68rem; color: #445060; text-transform: uppercase; letter-spacing: 1px; }
.done-stats { display: flex; gap: 10px; margin: 16px 0; }
.ds-box { flex: 1; background: #141928; border: 1px solid #1a2438; border-radius: 10px;
  padding: 10px; text-align: center; }
.ds-val { font-size: 1.05rem; font-weight: 700; color: #60a0d0; }
.ds-val.good { color: #60d090; }
.ds-label { font-size: 0.6rem; color: #445060; margin-top: 3px; }
.improved-line { font-size: 0.8rem; color: #60d090; text-align: center; margin-bottom: 8px; }

textarea.fb-input {
  width: 100%; background: #141928; border: 1px solid #1a2438; border-radius: 8px;
  color: #ddd8cc; font-size: 0.85rem; padding: 10px; resize: none; height: 70px;
  font-family: inherit;
}
textarea.fb-input:focus { outline: none; border-color: #f0c060; }
.fb-save {
  margin-top: 8px; width: 100%; padding: 9px; background: #1d5035; color: #60d090;
  border: none; border-radius: 8px; font-size: 0.82rem; cursor: pointer; font-family: inherit;
}
.btn-row { display: flex; gap: 10px; margin-top: 16px; }
.btn-again {
  flex: 1; padding: 13px; border: none; border-radius: 10px;
  background: linear-gradient(135deg, #1d5035, #2a7048); color: #d0f0d8;
  font-size: 0.92rem; font-weight: 700; cursor: pointer; font-family: inherit;
}
.btn-home {
  flex: 1; padding: 13px; border: 1px solid #1a2438; border-radius: 10px;
  background: #141928; color: #8a94a8; font-size: 0.92rem; font-weight: 700;
  cursor: pointer; font-family: inherit; text-align: center; text-decoration: none;
}
.hidden { display: none; }
</style>
</head>
<body>

<div class="header">
  <a class="back" href="dashboard.html">← Retour au tableau de bord</a>
  <h1>⚡ SPRINT DE VERBES</h1>
  <div class="sub">核心 9 動詞 × 6 人稱 — 練到反射，不是練到會</div>
</div>

<!-- ── Start screen ── -->
<div id="startScreen">
  <div class="card">
    <div class="card-title">反射熱力圖 — Présent</div>
    <div class="hm-summary">已達反射 <b id="hmReflexCount">0</b> / 54 格</div>
    <div id="heatmap"></div>
    <div class="hm-legend">
      <span><i class="hm-reflex"></i>反射（連 3 對且 &lt; 2 秒起手）</span>
      <span><i class="hm-slow"></i>會但慢</span>
      <span><i class="hm-weak"></i>上次答錯</span>
      <span><i class="hm-new"></i>未測</span>
    </div>
  </div>
  <button class="start-btn" id="startBtn">▶ 開始 60 秒衝刺</button>
  <div class="card" id="recentCard" style="display:none">
    <div class="card-title">最近衝刺</div>
    <div id="recentList" style="font-size:0.78rem;color:#8a94a8;line-height:1.9"></div>
  </div>
</div>

<!-- ── Sprint screen ── -->
<div id="sprintScreen" class="hidden">
  <div class="sprint-strip">
    <div><div class="strip-label">Temps</div><div class="timer-val" id="timerVal">1:00</div></div>
    <span class="phase-tag" id="phaseTag">衝刺</span>
    <div style="text-align:right"><div class="strip-label">Score</div><div class="score-live" id="scoreLive">0</div></div>
  </div>
  <div class="card prompt-card">
    <div class="prompt-verb" id="promptVerb"></div>
    <div class="prompt-line"><span id="promptPerson"></span> <span class="blank">_____</span></div>
    <input class="answer-input" id="answerInput" type="text"
      autocomplete="off" autocapitalize="off" spellcheck="false"
      placeholder="輸入變位，按 Enter">
    <div class="feedback-box" id="feedbackBox"></div>
  </div>
</div>

<!-- ── Done screen ── -->
<div id="doneScreen" class="hidden">
  <div class="card">
    <div class="done-score">
      <div class="done-big" id="doneScore">—</div>
      <div class="done-label">60 秒答對題數</div>
    </div>
    <div class="done-stats">
      <div class="ds-box"><div class="ds-val" id="doneAcc">—</div><div class="ds-label">正確率</div></div>
      <div class="ds-box"><div class="ds-val" id="doneRT">—</div><div class="ds-label">平均起手速度</div></div>
      <div class="ds-box"><div class="ds-val good" id="doneReflex">—</div><div class="ds-label">反射格數</div></div>
    </div>
    <div class="improved-line" id="improvedLine"></div>
  </div>
  <div class="card">
    <div class="card-title">反射熱力圖</div>
    <div id="heatmapDone"></div>
  </div>
  <div class="card">
    <div class="card-title">本次回饋（存給 Claude 看）</div>
    <textarea class="fb-input" id="fbText" placeholder="哪個動詞卡住？想調整什麼？"></textarea>
    <button class="fb-save" id="fbSave">儲存回饋</button>
  </div>
  <div class="btn-row">
    <button class="btn-again" id="againBtn">⚡ 再來一輪</button>
    <a class="btn-home" href="dashboard.html">回指揮中心</a>
  </div>
</div>

<script>
// ── 動詞資料（présent）─────────────────────────────────────────
const PERSONS = ['je', 'tu', 'il / elle', 'nous', 'vous', 'ils / elles'];
const VERBS = [
  { inf: 'être',    forms: ['suis','es','est','sommes','êtes','sont'] },
  { inf: 'avoir',   forms: ['ai','as','a','avons','avez','ont'] },
  { inf: 'faire',   forms: ['fais','fais','fait','faisons','faites','font'] },
  { inf: 'aller',   forms: ['vais','vas','va','allons','allez','vont'] },
  { inf: 'devoir',  forms: ['dois','dois','doit','devons','devez','doivent'] },
  { inf: 'pouvoir', forms: ['peux','peux','peut','pouvons','pouvez','peuvent'] },
  { inf: 'vouloir', forms: ['veux','veux','veut','voulons','voulez','veulent'] },
  { inf: 'venir',   forms: ['viens','viens','vient','venons','venez','viennent'] },
  { inf: 'prendre', forms: ['prends','prends','prend','prenons','prenez','prennent'] },
];
const TOTAL_CELLS = VERBS.length * 6;
const SPRINT_SEC = 60;
const REFLEX_MS = 2000;   // 起手（第一個按鍵）2 秒內 = 反射
const HIST_MAX = 5;       // 每格保留最近 5 次

// ── localStorage ─────────────────────────────────────────────
function getCells()    { try { return JSON.parse(localStorage.getItem('clb7_sprint_cells')) || {}; } catch { return {}; } }
function saveCells(c)  { localStorage.setItem('clb7_sprint_cells', JSON.stringify(c)); }
function getSessions() { try { return JSON.parse(localStorage.getItem('clb7_sprint_sessions')) || []; } catch { return []; } }
function saveSession(s) {
  const arr = getSessions(); arr.push(s);
  localStorage.setItem('clb7_sprint_sessions', JSON.stringify(arr.slice(-50)));
}
function todayStr() {
  return new Date().toLocaleDateString('zh-TW', {year:'numeric',month:'2-digit',day:'2-digit'});
}
function cellKey(vi, pi) { return VERBS[vi].inf + '_' + pi; }

// ── 格子狀態 ──────────────────────────────────────────────────
// new    未測 / weak 上次錯 / slow 會但慢 / reflex 連3對且中位起手<2s
function cellState(hist) {
  if (!hist || !hist.length) return 'new';
  if (!hist[hist.length-1].o) return 'weak';
  const last3 = hist.slice(-3);
  if (last3.length === 3 && last3.every(h => h.o)) {
    const fks = last3.map(h => h.f).sort((a,b)=>a-b);
    if (fks[1] <= REFLEX_MS) return 'reflex';
  }
  return 'slow';
}
function reflexCount(cells) {
  let n = 0;
  VERBS.forEach((v,vi) => { for (let pi=0; pi<6; pi++) {
    if (cellState((cells[cellKey(vi,pi)]||{}).h) === 'reflex') n++;
  }});
  return n;
}

// ── 答案比對（去重音、去代名詞、容錯）───────────────────────────
function normalize(s) {
  return s.toLowerCase().trim()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')   // 去重音
    .replace(/^(j|je|tu|il|elle|on|nous|vous|ils|elles)['\s]+/, '') // 去開頭代名詞
    .replace(/\s+/g, '');
}
function isCorrect(input, vi, pi) {
  return normalize(input) === normalize(VERBS[vi].forms[pi]);
}

// ── 加權取樣 ──────────────────────────────────────────────────
const WEIGHT = { weak: 4, new: 3, slow: 2, reflex: 1 };
let lastCell = null;
function pickCell(cells) {
  const pool = [];
  VERBS.forEach((v,vi) => { for (let pi=0; pi<6; pi++) {
    const key = cellKey(vi,pi);
    if (key === lastCell) continue;               // 不連續出同一格
    const w = WEIGHT[cellState((cells[key]||{}).h)];
    for (let i=0; i<w; i++) pool.push([vi,pi]);
  }});
  const [vi,pi] = pool[Math.floor(Math.random()*pool.length)];
  lastCell = cellKey(vi,pi);
  return [vi,pi];
}

// ── 熱力圖渲染 ────────────────────────────────────────────────
function renderHeatmap(elId) {
  const cells = getCells();
  const short = ['je','tu','il','nous','vous','ils'];
  let html = '<table class="hm-table"><tr><th></th>' +
    short.map(p=>`<th>${p}</th>`).join('') + '</tr>';
  VERBS.forEach((v,vi) => {
    html += `<tr><td class="verb-name">${v.inf}</td>`;
    for (let pi=0; pi<6; pi++) {
      const st = cellState((cells[cellKey(vi,pi)]||{}).h);
      html += `<td class="hm-cell hm-${st}" title="${PERSONS[pi]} ${v.inf} → ${v.forms[pi]}"></td>`;
    }
    html += '</tr>';
  });
  html += '</table>';
  document.getElementById(elId).innerHTML = html;
  const rc = document.getElementById('hmReflexCount');
  if (rc) rc.textContent = reflexCount(cells);
}

// ── State ─────────────────────────────────────────────────────
let phase = 'idle';        // idle | sprint | review | done
let timeLeft = SPRINT_SEC;
let timerInt = null;
let paused = false;
let cur = null;            // [vi, pi]
let promptTs = 0;          // 出題時間
let firstKeyTs = 0;        // 第一個按鍵時間
let sprintCorrect = 0, sprintAttempts = 0;
let fkList = [];           // 答對題的起手時間
let wrongCells = [];       // 衝刺輪錯的格子（進複習輪）
let reviewQueue = [], reviewWrong = [], reviewIdx = 0;
let reflexBefore = 0;

// ── 流程 ─────────────────────────────────────────────────────
function startSprint() {
  phase = 'sprint';
  timeLeft = SPRINT_SEC; paused = false;
  sprintCorrect = 0; sprintAttempts = 0;
  fkList = []; wrongCells = []; lastCell = null;
  reflexBefore = reflexCount(getCells());
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('doneScreen').classList.add('hidden');
  document.getElementById('sprintScreen').classList.remove('hidden');
  document.getElementById('phaseTag').textContent = '衝刺';
  document.getElementById('phaseTag').classList.remove('review');
  document.getElementById('scoreLive').textContent = '0';
  updateTimer();
  timerInt = setInterval(() => {
    if (paused) return;
    timeLeft--;
    updateTimer();
    if (timeLeft <= 0) { clearInterval(timerInt); endSprint(); }
  }, 1000);
  nextQuestion();
}

function updateTimer() {
  const m = Math.floor(timeLeft/60), s = timeLeft%60;
  const el = document.getElementById('timerVal');
  el.textContent = `${m}:${String(s).padStart(2,'0')}`;
  el.classList.toggle('urgent', timeLeft <= 10 && phase === 'sprint');
}

function nextQuestion() {
  if (phase === 'sprint') {
    cur = pickCell(getCells());
  } else { // review
    if (reviewIdx >= reviewQueue.length) {
      if (reviewWrong.length) {           // 開下一複習子輪
        reviewQueue = [...reviewWrong]; reviewWrong = []; reviewIdx = 0;
      } else { showDone(); return; }
    }
    cur = reviewQueue[reviewIdx];
  }
  const [vi,pi] = cur;
  document.getElementById('promptVerb').textContent = VERBS[vi].inf;
  document.getElementById('promptPerson').textContent = PERSONS[pi];
  const inp = document.getElementById('answerInput');
  inp.value = ''; inp.disabled = false;
  inp.classList.remove('flash-ok','flash-bad');
  document.getElementById('feedbackBox').innerHTML = '';
  inp.focus();
  promptTs = performance.now(); firstKeyTs = 0;
}

function recordAttempt(vi, pi, ok, fk) {
  const cells = getCells();
  const key = cellKey(vi,pi);
  if (!cells[key]) cells[key] = { h: [] };
  cells[key].h.push({ o: ok ? 1 : 0, f: Math.round(fk), t: Date.now() });
  cells[key].h = cells[key].h.slice(-HIST_MAX);
  saveCells(cells);
  if (!ok) {
    const v = VERBS[vi];
    logWrong({
      src: 'sprint',
      q: `${PERSONS[pi]} _____ (${v.inf})`,
      a: `${PERSONS[pi]} ${v.forms[pi]}`,
      note: v.inf + '：' + PERSONS.map((p,i) => `${p} ${v.forms[i]}`).join(' · '),
    });
  }
}

// ── 今日錯題本（dashboard 讀 clb7_wrong_log）──────────────────
function logWrong(entry) {
  try {
    const log = JSON.parse(localStorage.getItem('clb7_wrong_log')) || [];
    const d = todayStr();
    const dup = log.find(e => e.d === d && e.src === entry.src && e.q === entry.q);
    if (dup) { dup.n = (dup.n||1) + 1; dup.t = Date.now(); }
    else log.push({ ...entry, d, t: Date.now(), n: 1 });
    localStorage.setItem('clb7_wrong_log', JSON.stringify(log.slice(-300)));
  } catch(e) {}
}

function submit() {
  const inp = document.getElementById('answerInput');
  if (inp.disabled || !inp.value.trim()) return;
  const [vi,pi] = cur;
  const ok = isCorrect(inp.value, vi, pi);
  const fk = firstKeyTs ? firstKeyTs - promptTs : 9999;
  recordAttempt(vi, pi, ok, fk);

  if (phase === 'sprint') {
    sprintAttempts++;
    if (ok) { sprintCorrect++; fkList.push(fk); }
    else if (!wrongCells.some(([a,b]) => a===vi && b===pi)) wrongCells.push([vi,pi]);
    document.getElementById('scoreLive').textContent = sprintCorrect;
  } else {
    reviewIdx++;
    if (!ok) {
      // 例外：子輪只剩這 1 格且答錯 → 重試此格，不開新輪
      if (reviewQueue.length === 1) reviewIdx = 0;
      else if (!reviewWrong.some(([a,b]) => a===vi && b===pi)) reviewWrong.push([vi,pi]);
    }
  }

  if (ok) {
    inp.classList.add('flash-ok'); inp.disabled = true;
    setTimeout(() => { if (phase === 'sprint' && timeLeft <= 0) return; nextQuestion(); }, 180);
  } else {
    // 答錯：暫停計時，顯示正解，手動繼續（消化時間）
    paused = true;
    inp.classList.add('flash-bad'); inp.disabled = true;
    const fb = document.getElementById('feedbackBox');
    fb.innerHTML = `<div class="fb-wrong">✗ 正確：<b>${PERSONS[pi]} ${VERBS[vi].forms[pi]}</b>（${VERBS[vi].inf}）</div>
      <button class="next-btn" id="contBtn">繼續 →（Enter）</button>
      <div class="fb-hint">唸出聲再繼續，嘴巴也要記得</div>`;
    document.getElementById('contBtn').onclick = resumeAfterWrong;
  }
}

function resumeAfterWrong() {
  paused = false;
  if (phase === 'sprint' && timeLeft <= 0) { endSprint(); return; }
  nextQuestion();
}

function endSprint() {
  if (wrongCells.length) {
    phase = 'review';
    reviewQueue = [...wrongCells]; reviewWrong = []; reviewIdx = 0;
    paused = false;
    document.getElementById('phaseTag').textContent = `複習輪（${reviewQueue.length} 格）`;
    document.getElementById('phaseTag').classList.add('review');
    document.getElementById('timerVal').textContent = '—';
    document.getElementById('timerVal').classList.remove('urgent');
    nextQuestion();
  } else {
    showDone();
  }
}

function showDone() {
  phase = 'done';
  document.getElementById('sprintScreen').classList.add('hidden');
  document.getElementById('doneScreen').classList.remove('hidden');

  const acc = sprintAttempts ? Math.round(sprintCorrect/sprintAttempts*100) : 0;
  const avgFk = fkList.length ? Math.round(fkList.reduce((a,b)=>a+b,0)/fkList.length) : null;
  const reflexNow = reflexCount(getCells());

  document.getElementById('doneScore').textContent = sprintCorrect;
  document.getElementById('doneAcc').textContent = acc + '%';
  document.getElementById('doneRT').textContent = avgFk != null ? (avgFk/1000).toFixed(1)+'s' : '—';
  document.getElementById('doneReflex').textContent = `${reflexNow}/54`;
  const diff = reflexNow - reflexBefore;
  document.getElementById('improvedLine').textContent =
    diff > 0 ? `🎉 本輪新增 ${diff} 格反射！` : (diff < 0 ? `📉 掉了 ${-diff} 格反射，再衝一輪拿回來` : '');

  renderHeatmap('heatmapDone');

  saveSession({
    date: todayStr(), att: sprintAttempts, cor: sprintCorrect,
    avgFk: avgFk, reflex: reflexNow, sec: SPRINT_SEC,
  });
  document.getElementById('fbText').value = '';
}

// ── 事件 ─────────────────────────────────────────────────────
document.getElementById('answerInput').addEventListener('keydown', e => {
  if (!firstKeyTs && e.key.length === 1) firstKeyTs = performance.now();
  if (e.key === 'Enter') {
    e.stopPropagation();   // 不讓送出的 Enter 冒泡到「繼續」監聽器
    submit();
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && paused) { e.preventDefault(); resumeAfterWrong(); }
});
document.getElementById('startBtn').addEventListener('click', startSprint);
document.getElementById('againBtn').addEventListener('click', startSprint);
document.getElementById('fbSave').addEventListener('click', () => {
  const txt = document.getElementById('fbText').value.trim();
  if (!txt) return;
  const arr = getSessions();
  if (arr.length) { arr[arr.length-1].fb = txt;
    localStorage.setItem('clb7_sprint_sessions', JSON.stringify(arr)); }
  document.getElementById('fbSave').textContent = '✓ 已儲存';
  setTimeout(() => document.getElementById('fbSave').textContent = '儲存回饋', 1500);
});

// ── 初始化 ────────────────────────────────────────────────────
renderHeatmap('heatmap');
(() => {
  const ses = getSessions();
  if (ses.length) {
    document.getElementById('recentCard').style.display = '';
    document.getElementById('recentList').innerHTML = ses.slice(-5).reverse().map(s =>
      `${s.date} — ${s.cor} 題 · 正確率 ${s.att?Math.round(s.cor/s.att*100):0}% · 起手 ${s.avgFk?(s.avgFk/1000).toFixed(1)+'s':'—'} · 反射 ${s.reflex}/54`
    ).join('<br>');
  }
})();
if (new URLSearchParams(location.search).get('guided') === '1') startSprint();
</script>

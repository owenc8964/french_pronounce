<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lecture · CLB7</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #07080f; color: #ddd8cc;
  font-family: 'Segoe UI', system-ui, sans-serif;
  min-height: 100vh; padding: 24px 16px 80px;
  max-width: 680px; margin: 0 auto;
}

/* Header */
.header { text-align: center; margin-bottom: 20px; }
.header h1 { font-size: 1.2rem; letter-spacing: 2px; color: #f0c060;
  text-shadow: 0 0 20px rgba(240,192,96,0.35); }
.header .back { font-size: 0.72rem; color: #445060; text-decoration: none;
  display: inline-block; margin-bottom: 8px; }
.header .back:hover { color: #f0c060; }

/* Timer strip */
.timer-strip {
  background: #0d1020; border: 1px solid #1a2438;
  border-radius: 10px; padding: 10px 18px;
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.timer-val { font-size: 1.4rem; font-weight: 700; color: #60a0d0; font-variant-numeric: tabular-nums; }
.timer-label { font-size: 0.65rem; color: #445060; text-transform: uppercase; letter-spacing: 1px; }
.score-live { font-size: 0.88rem; font-weight: 700; color: #60d090; }

/* Article selector */
.article-select {
  background: #0d1020; border: 1px solid #1a2438;
  border-radius: 12px; padding: 16px 18px; margin-bottom: 16px;
}
.sel-title { font-size: 0.65rem; color: #445060; text-transform: uppercase;
  letter-spacing: 1.5px; margin-bottom: 12px; }
.article-list { display: flex; flex-direction: column; gap: 8px; }
.article-btn {
  display: flex; align-items: center; gap: 12px;
  background: #141928; border: 1px solid #1a2438;
  border-radius: 8px; padding: 12px 14px;
  cursor: pointer; color: inherit; font-family: inherit;
  transition: border-color 0.15s, transform 0.1s; text-align: left;
}
.article-btn:hover { border-color: #445060; transform: translateX(2px); }
.article-btn.done { opacity: 0.5; }
.article-btn.done .art-badge { background: #0a1a0c; color: #60d090; border-color: #1a4a1a; }
.art-num { font-size: 0.72rem; color: #445060; min-width: 22px; font-weight: 700; }
.art-body { flex: 1; }
.art-title { font-size: 0.88rem; font-weight: 600; color: #ddd8cc; }
.art-meta { font-size: 0.68rem; color: #445060; margin-top: 2px; }
.art-badge {
  font-size: 0.62rem; padding: 2px 8px; border-radius: 8px; white-space: nowrap;
  background: #141928; color: #445060; border: 1px solid #1a2438;
}

/* Reading panel */
.reading-panel { display: none; }
.reading-panel.active { display: block; }

.article-card {
  background: #0d1020; border: 1px solid #1a2438;
  border-radius: 12px; padding: 20px 22px; margin-bottom: 16px;
}
.article-card .art-heading {
  font-size: 0.65rem; color: #445060; text-transform: uppercase;
  letter-spacing: 1.5px; margin-bottom: 10px;
}
.article-text {
  font-size: 0.92rem; line-height: 1.75; color: #c8c4b8;
  font-family: Georgia, 'Times New Roman', serif;
}
.article-text strong { color: #ddd8cc; }

/* Questions */
.questions-block { display: flex; flex-direction: column; gap: 14px; margin-bottom: 20px; }
.q-card {
  background: #0d1020; border: 1px solid #1a2438;
  border-radius: 10px; padding: 16px 18px;
}
.q-num { font-size: 0.65rem; color: #445060; letter-spacing: 1px; margin-bottom: 6px; }
.q-text { font-size: 0.9rem; font-weight: 600; color: #ddd8cc; margin-bottom: 12px; line-height: 1.5; }
.options { display: flex; flex-direction: column; gap: 7px; }
.opt-btn {
  background: #141928; border: 1.5px solid #1a2438;
  border-radius: 8px; padding: 10px 14px;
  font-size: 0.84rem; color: #aaa8a0; font-family: inherit;
  cursor: pointer; text-align: left; transition: all 0.12s;
}
.opt-btn:hover:not(:disabled) { border-color: #445060; color: #ddd8cc; }
.opt-btn.selected { border-color: #f0c060; color: #f0c060; background: #1a1800; }
.opt-btn.correct  { border-color: #60d090; color: #60d090; background: #0a1a0c; }
.opt-btn.wrong    { border-color: #d07060; color: #d07060; background: #1a0a08; }
.opt-btn:disabled { cursor: default; }

/* Feedback */
.q-feedback {
  margin-top: 10px; padding: 10px 12px;
  border-radius: 7px; font-size: 0.8rem; line-height: 1.5;
  display: none;
}
.q-feedback.show { display: block; }
.q-feedback.correct-fb { background: #0a1a0c; border: 1px solid #1a4a1a; color: #60d090; }
.q-feedback.wrong-fb   { background: #1a0a08; border: 1px solid #4a1a18; color: #d07060; }

/* Submit row */
.submit-row { display: flex; gap: 10px; margin-bottom: 24px; }
.submit-btn {
  flex: 1; padding: 14px;
  background: linear-gradient(135deg, #1d5035, #2a7a50);
  color: #60d090; border: none; border-radius: 10px;
  font-size: 0.95rem; font-weight: 700; cursor: pointer; font-family: inherit;
  transition: opacity 0.15s, transform 0.1s;
}
.submit-btn:hover { opacity: 0.9; transform: translateY(-1px); }
.submit-btn:disabled { opacity: 0.4; cursor: default; transform: none; }
.back-list-btn {
  padding: 14px 20px;
  background: #141928; color: #445060; border: 1px solid #1a2438;
  border-radius: 10px; font-size: 0.85rem; cursor: pointer; font-family: inherit;
  transition: border-color 0.15s;
}
.back-list-btn:hover { border-color: #445060; color: #ddd8cc; }

/* Result panel */
.result-panel {
  background: #0d1020; border: 1px solid #1a2438;
  border-radius: 12px; padding: 24px 22px; margin-bottom: 16px;
  text-align: center;
}
.result-score { font-size: 3rem; font-weight: 700; color: #f0c060; margin-bottom: 6px; }
.result-label { font-size: 0.75rem; color: #445060; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px; }
.result-time  { font-size: 0.82rem; color: #60a0d0; margin-bottom: 20px; }
.result-msg   { font-size: 0.9rem; color: #aaa8a0; margin-bottom: 24px; line-height: 1.6; }
.result-actions { display: flex; gap: 10px; }
.btn-retry {
  flex: 1; padding: 13px;
  background: #141928; color: #ddd8cc; border: 1px solid #1a2438;
  border-radius: 10px; font-size: 0.85rem; cursor: pointer; font-family: inherit;
}
.btn-next {
  flex: 1; padding: 13px;
  background: linear-gradient(135deg, #1d5035, #2a7a50);
  color: #60d090; border: none; border-radius: 10px;
  font-size: 0.85rem; font-weight: 700; cursor: pointer; font-family: inherit;
}

/* History */
.history-card {
  background: #0d1020; border: 1px solid #1a2438;
  border-radius: 10px; padding: 16px 18px; margin-bottom: 16px;
}
.history-title { font-size: 0.65rem; color: #445060; text-transform: uppercase;
  letter-spacing: 1.5px; margin-bottom: 12px; }
.history-row {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 0; border-bottom: 1px solid #0d1020; font-size: 0.78rem;
}
.history-row:last-child { border-bottom: none; }
.h-date { color: #445060; min-width: 80px; }
.h-art  { flex: 1; color: #aaa8a0; }
.h-score { font-weight: 700; min-width: 40px; text-align: right; }
.h-score.perfect { color: #60d090; }
.h-score.good    { color: #c09040; }
.h-score.poor    { color: #d07060; }
</style>
</head>
<body>

<div class="header">
  <a class="back" href="dashboard.html">← Retour au tableau de bord</a>
  <h1>📖 LECTURE</h1>
</div>

<!-- Timer strip -->
<div class="timer-strip">
  <div>
    <div class="timer-label">Temps</div>
    <div class="timer-val" id="timerVal">0:00</div>
  </div>
  <div style="text-align:right">
    <div class="timer-label">Score du jour</div>
    <div class="score-live" id="scoreLive">—</div>
  </div>
</div>

<!-- Article list panel -->
<div id="listPanel">
  <div class="article-select">
    <div class="sel-title">Choisir un texte</div>
    <div class="article-list" id="articleList"></div>
  </div>

  <div class="history-card" id="historyCard" style="display:none">
    <div class="history-title">Historique récent</div>
    <div id="historyRows"></div>
  </div>
</div>

<!-- Reading panel -->
<div class="reading-panel" id="readingPanel">
  <div class="article-card">
    <div class="art-heading" id="panelHeading"></div>
    <!-- 發音三層控制列（tts_reader.js 自己填內容）──整段／單句／單字 -->
    <div id="ttsBar"></div>
    <div class="article-text" id="panelText"></div>
  </div>

  <div class="questions-block" id="questionsBlock"></div>

  <div class="submit-row">
    <button class="back-list-btn" onclick="showList()">← Liste</button>
    <button class="submit-btn" id="submitBtn" onclick="submitAnswers()">Vérifier mes réponses</button>
  </div>
  <div style="text-align:center;font-size:0.7rem;color:#556;margin-top:8px;" id="reviewHint"></div>
</div>

<!-- Result panel -->
<div class="reading-panel" id="resultPanel">
  <div class="result-panel">
    <div class="result-score" id="resultScore"></div>
    <div class="result-label">Questions correctes</div>
    <div class="result-time" id="resultTime"></div>
    <div class="result-msg" id="resultMsg"></div>
    <div class="result-actions">
      <button class="btn-retry" onclick="retryArticle()">Réessayer</button>
      <button class="btn-next" onclick="showList()">Choisir un autre texte</button>
    </div>
  </div>
</div>

<script>
// ── Article bank ──────────────────────────────────────────────
const ARTICLES = [
  {
    id: 'a1',
    title: 'La famille de Marie',
    level: 'A1',
    theme: 'Famille',
    text: `Marie habite à Montréal avec sa famille. Elle a un frère qui s'appelle Thomas et une sœur qui s'appelle Léa. Son père travaille dans un hôpital. Il est médecin. Sa mère est professeure dans une école primaire. Le dimanche, toute la famille mange ensemble. Marie aime beaucoup ces repas en famille.`,
    questions: [
      {
        q: "Combien d'enfants y a-t-il dans la famille de Marie ?",
        opts: ["Un", "Deux", "Trois", "Quatre"],
        ans: 2,
        expl: "Marie + son frère Thomas + sa sœur Léa = trois enfants. Le texte ne donne pas le chiffre — il faut compter soi-même, et ne pas oublier Marie."
      },
      {
        q: "Qui travaille avec des enfants ?",
        opts: ["Le père", "La mère", "Thomas", "Léa"],
        ans: 1,
        expl: "La mère est « professeure dans une école primaire » — une école primaire, c'est des enfants. Le père, lui, travaille à l'hôpital."
      },
      {
        q: "Qu'est-ce qui est vrai ?",
        opts: ["La famille se retrouve une fois par semaine", "Marie n'aime pas les repas en famille", "Le père travaille dans une école", "Marie a deux frères"],
        ans: 0,
        expl: "« Le dimanche, toute la famille mange ensemble » = une fois par semaine. Les autres options contredisent le texte : Marie aime ces repas, le père est à l'hôpital, elle a un frère et une sœur."
      }
    ]
  },
  {
    id: 'a2',
    title: 'Mon appartement',
    level: 'A1',
    theme: 'Logement',
    text: `J'ai un petit appartement au troisième étage. Il y a un salon, une cuisine, une chambre et une salle de bain. La cuisine est petite mais moderne. Dans le salon, j'ai un canapé bleu et une grande télévision. Ma chambre est calme parce qu'elle donne sur un jardin. J'aime beaucoup mon appartement.`,
    questions: [
      {
        q: "Combien de pièces y a-t-il dans l'appartement (salle de bain incluse) ?",
        opts: ["Deux", "Trois", "Quatre", "Cinq"],
        ans: 2,
        expl: "Un salon + une cuisine + une chambre + une salle de bain = quatre pièces. Le texte ne donne pas le total, il faut compter."
      },
      {
        q: "Pourquoi n'entend-on pas le bruit de la rue dans la chambre ?",
        opts: ["Elle est au sous-sol", "Sa fenêtre est du côté du jardin", "Les murs sont épais", "Elle est très grande"],
        ans: 1,
        expl: "« Elle donne sur un jardin » = sa fenêtre s'ouvre sur le jardin, pas sur la rue. C'est pour ça qu'elle est calme — le texte le dit avec d'autres mots."
      },
      {
        q: "Qu'est-ce que le texte ne dit PAS ?",
        opts: ["La couleur du canapé", "L'étage de l'appartement", "La taille de la cuisine", "Le prix du loyer"],
        ans: 3,
        expl: "Le canapé est bleu, l'appartement est au troisième étage, la cuisine est petite — tout ça est dans le texte. Le loyer n'est jamais mentionné."
      }
    ]
  },
  {
    id: 'a3',
    title: 'Une journée à l\'école',
    level: 'A1+',
    theme: 'Routine',
    text: `Lucas a douze ans. Il va à l'école du lundi au vendredi. Il se lève à sept heures. Il prend son petit-déjeuner : du pain avec du beurre et un verre de lait. À huit heures, il prend le bus. Les cours commencent à huit heures et demie. Il a six heures de cours par jour. Après l'école, il fait ses devoirs et il joue avec ses amis.`,
    questions: [
      {
        q: "Combien de temps y a-t-il entre le lever de Lucas et le début des cours ?",
        opts: ["Trente minutes", "Une heure", "Une heure et demie", "Deux heures"],
        ans: 2,
        expl: "Il se lève à 7 h et les cours commencent à 8 h 30 → 1 h 30. Il faut trouver les deux heures dans le texte et calculer la différence."
      },
      {
        q: "Quel jour Lucas ne va-t-il PAS à l'école ?",
        opts: ["Le mardi", "Le jeudi", "Le vendredi", "Le dimanche"],
        ans: 3,
        expl: "« Il va à l'école du lundi au vendredi » → le week-end (samedi et dimanche) n'est pas dans cette liste. Le texte ne dit jamais « dimanche », il faut le déduire."
      },
      {
        q: "Que fait Lucas en premier après l'école ?",
        opts: ["Il joue avec ses amis", "Il fait ses devoirs", "Il prend le bus", "Il mange du pain"],
        ans: 1,
        expl: "« Après l'école, il fait ses devoirs et il joue avec ses amis » — l'ordre de la phrase donne l'ordre des actions : d'abord les devoirs, ensuite les amis."
      }
    ]
  },
  {
    id: 'a4',
    title: 'Au marché',
    level: 'A1+',
    theme: 'Achats',
    text: `Tous les samedis matin, Madame Dupont va au marché. Elle achète des légumes frais : des carottes, des tomates et des courgettes. Elle achète aussi du fromage et du poulet pour le repas du dimanche. Aujourd'hui, elle dépense vingt-cinq euros. Le marchand lui donne un sac en papier. Madame Dupont est contente parce que les légumes sont beaux et pas trop chers.`,
    questions: [
      {
        q: "À quelle fréquence Madame Dupont va-t-elle au marché ?",
        opts: ["Tous les jours", "Une fois par semaine", "Deux fois par mois", "Une fois par mois"],
        ans: 1,
        expl: "« Tous les samedis matin » = chaque samedi, donc une fois par semaine. Il faut traduire l'expression en fréquence."
      },
      {
        q: "Pourquoi achète-t-elle du poulet ?",
        opts: ["Pour le repas du lendemain", "Pour ce soir", "Pour le congeler", "Pour ses voisins"],
        ans: 0,
        expl: "Elle fait le marché le samedi, et le poulet est « pour le repas du dimanche » — le dimanche, c'est le lendemain du samedi."
      },
      {
        q: "Qu'est-ce qui rend Madame Dupont contente ?",
        opts: ["Le sac en papier gratuit", "La qualité et le prix des légumes", "Le beau temps", "La gentillesse du marchand"],
        ans: 1,
        expl: "« Les légumes sont beaux et pas trop chers » = bonne qualité + bon prix. La réponse reformule le texte avec d'autres mots."
      }
    ]
  },
  {
    id: 'a5',
    title: 'Un message de Sophie',
    level: 'A1+',
    theme: 'Communication',
    text: `Salut Antoine,\n\nJe t'écris pour te donner des nouvelles. Je suis en vacances à Nice depuis lundi. Il fait très beau et il fait trente degrés ! Je vais à la plage tous les jours. J'ai visité le vieux Nice hier : c'est vraiment magnifique ! Je rentre à Montréal samedi prochain. On peut se voir dimanche ?\n\nBisous,\nSophie`,
    questions: [
      {
        q: "Pourquoi Sophie écrit-elle ce message ?",
        opts: ["Pour demander de l'argent", "Pour raconter ses vacances et proposer une rencontre", "Pour inviter Antoine à Nice", "Pour annuler un rendez-vous"],
        ans: 1,
        expl: "Elle « donne des nouvelles » de ses vacances ET termine par « On peut se voir dimanche ? » — le message a deux buts. C'est une question sur l'intention globale, pas sur un détail."
      },
      {
        q: "Où Sophie habite-t-elle normalement ?",
        opts: ["À Nice", "À Montréal", "À Paris", "Le texte ne le dit pas"],
        ans: 1,
        expl: "« Je rentre à Montréal » — on « rentre » chez soi. Nice, c'est seulement les vacances. Le texte ne dit jamais « j'habite à Montréal », il faut le déduire du verbe rentrer."
      },
      {
        q: "Quand Sophie veut-elle voir Antoine ?",
        opts: ["Le jour de son retour", "Le lendemain de son retour", "Une semaine après son retour", "Avant de partir"],
        ans: 1,
        expl: "Elle rentre samedi et propose de se voir dimanche → dimanche est le jour après samedi, donc le lendemain de son retour. Il faut relier les deux dates."
      }
    ]
  },
  {
    id: 'a6',
    title: 'La recette de la soupe',
    level: 'A1+',
    theme: 'Recette',
    text: `Ingrédients pour 4 personnes : 3 carottes, 2 pommes de terre, 1 oignon, 1 litre de bouillon de légumes, sel et poivre.\n\nPréparation : Coupez les légumes en petits morceaux. Faites chauffer le bouillon dans une grande casserole. Ajoutez les légumes. Faites cuire pendant vingt minutes. Mixez la soupe. Ajoutez du sel et du poivre. Servez chaud avec du pain frais.`,
    questions: [
      {
        q: "Combien de sortes de légumes faut-il pour cette soupe ?",
        opts: ["Deux", "Trois", "Quatre", "Cinq"],
        ans: 1,
        expl: "Carottes, pommes de terre, oignon = trois sortes de légumes. Le bouillon est un liquide, pas un légume à compter. Il faut trier la liste d'ingrédients."
      },
      {
        q: "Que fait-on juste avant de mixer la soupe ?",
        opts: ["On coupe les légumes", "On fait cuire vingt minutes", "On ajoute le sel", "On sert avec du pain"],
        ans: 1,
        expl: "L'ordre des étapes : couper → chauffer le bouillon → ajouter les légumes → cuire 20 minutes → mixer. L'étape juste avant « mixez » est donc la cuisson."
      },
      {
        q: "Qu'est-ce qu'on ne met PAS dans cette soupe ?",
        opts: ["Du poivre", "Du sel", "De la crème", "Des oignons"],
        ans: 2,
        expl: "Le sel, le poivre et l'oignon sont dans la recette. La crème n'est jamais mentionnée — attention, beaucoup de soupes ont de la crème, mais pas celle-ci."
      }
    ]
  },
  {
    id: 'a7',
    title: 'Les transports à Montréal',
    level: 'A1+',
    theme: 'Ville',
    text: `Montréal a un bon réseau de transports en commun. Il y a le métro, les bus et les vélos en libre-service. Le métro a quatre lignes et plus de soixante-huit stations. Il fonctionne tous les jours de cinq heures à une heure du matin. Un trajet coûte trois dollars cinquante. On peut aussi acheter un abonnement mensuel pour économiser de l'argent.`,
    questions: [
      {
        q: "À trois heures du matin, peut-on prendre le métro ?",
        opts: ["Oui, il est ouvert toute la nuit", "Non, il est fermé", "Oui, mais seulement le week-end", "Non, il ferme à minuit"],
        ans: 1,
        expl: "Le métro fonctionne « de cinq heures à une heure du matin » → à 3 h, c'est fermé. Attention au piège : il ne ferme pas à minuit mais à 1 h — l'option D est fausse aussi."
      },
      {
        q: "On prend le métro deux fois par jour, tous les jours. Quelle est la solution la plus économique ?",
        opts: ["Un billet à chaque trajet", "L'abonnement mensuel", "Prendre un taxi", "Le texte ne le dit pas"],
        ans: 1,
        expl: "« On peut acheter un abonnement mensuel pour économiser de l'argent » — pour un usage quotidien, l'abonnement revient moins cher que des billets à 3,50 $ l'unité."
      },
      {
        q: "Combien coûtent deux trajets en métro ?",
        opts: ["Trois dollars cinquante", "Cinq dollars", "Sept dollars", "Six dollars cinquante"],
        ans: 2,
        expl: "Un trajet coûte 3,50 $ → 3,50 × 2 = 7 $. Le texte ne donne que le prix d'un trajet, il faut multiplier."
      }
    ]
  },
  {
    id: 'a8',
    title: 'Une annonce d\'appartement',
    level: 'A1+',
    theme: 'Logement',
    text: `À LOUER — Grand appartement lumineux\n\nSitué au 2e étage, cet appartement de 65 m² comprend : un salon spacieux, deux chambres, une cuisine équipée et une salle de bain. Chauffage inclus dans le loyer. Parking disponible en supplément. Proche du métro (5 minutes à pied). Loyer : 1 400 $ par mois. Disponible à partir du 1er août. Pour plus d'informations, appelez le 514-555-0192.`,
    questions: [
      {
        q: "Qu'est-ce qu'il faut payer en plus du loyer ?",
        opts: ["Le chauffage", "Le parking", "L'eau chaude", "Rien"],
        ans: 1,
        expl: "Le chauffage est « inclus dans le loyer », mais le parking est « disponible en supplément » — supplément = il faut payer en plus. Deux mots-clés opposés : inclus vs en supplément."
      },
      {
        q: "Comment va-t-on de l'appartement au métro ?",
        opts: ["En bus", "En voiture", "À pied, en cinq minutes", "Le texte ne le dit pas"],
        ans: 2,
        expl: "« Proche du métro (5 minutes à pied) » — la distance est donnée en temps de marche."
      },
      {
        q: "Nous sommes le 1er juillet. Quand peut-on emménager ?",
        opts: ["Tout de suite", "Dans un mois", "Dans deux mois", "Dans une semaine"],
        ans: 1,
        expl: "L'appartement est disponible « à partir du 1er août ». Du 1er juillet au 1er août, il y a un mois. Il faut calculer à partir de la date donnée dans la question."

        opts: ["On entendait le chant des oiseaux", "Nous avons fait l'ascension d'une colline", "Nous mangions du poisson grillé", "L'odeur de la mer était partout"],
        ans: 1,
        expl: "C'est le seul passé composé : « nous avons fait » = une fois, un jour précis (le texte dit d'ailleurs « Un jour »). Les trois autres sont à l'imparfait et décrivent le décor ou ce qui se répétait chaque jour."
      },
      {
        q: "Pourquoi le narrateur pense-t-il encore à ce voyage aujourd'hui ?",
        opts: ["Il regarde des photos", "Une odeur le lui rappelle", "Il y retourne chaque année", "Ses amis lui en parlent"],
        ans: 1,
        expl: "« Quand je sens l'odeur de la mer, ça me replonge dans ce voyage. » C'est l'odorat qui déclenche le souvenir — le texte ne parle ni de photos, ni d'un retour sur l'île."
      }
    ]
  }
];

// ── State ──────────────────────────────────────────────────────
let currentArticleIdx = null;
let userAnswers = {};
let submitted = false;
let startTime = null;
let timerInterval = null;
let elapsedSec = 0;
let ttsCtl = null;              // 目前這篇的朗讀控制器（tts_reader.js）

// ── Init ──────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  renderArticleList();
  renderHistory();
  updateScoreLive();
  startTimer();
});

// ── Timer ──────────────────────────────────────────────────────
function startTimer() {
  startTime = Date.now();
  elapsedSec = 0;
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    elapsedSec = Math.floor((Date.now() - startTime) / 1000);
    const m = Math.floor(elapsedSec / 60);
    const s = elapsedSec % 60;
    document.getElementById('timerVal').textContent = `${m}:${s.toString().padStart(2,'0')}`;
  }, 500);
}

function fmtTime(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${m} min ${s.toString().padStart(2,'0')} sec`;
}

// ── Score ──────────────────────────────────────────────────────
function updateScoreLive() {
  const records = getRecords();
  const today = todayStr();
  const todayRecs = records.filter(r => r.date === today);
  if (!todayRecs.length) { document.getElementById('scoreLive').textContent = '—'; return; }
  const total = todayRecs.reduce((a,b) => a + b.total, 0);
  const correct = todayRecs.reduce((a,b) => a + b.correct, 0);
  document.getElementById('scoreLive').textContent = `${correct}/${total}`;
}

function todayStr() {
  // 用本地日期，不用 toISOString()（UTC 會讓早上的記錄變成前一天）
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function getRecords() {
  try { return JSON.parse(localStorage.getItem('clb7_reading') || '[]'); } catch { return []; }
}

function saveRecord(rec) {
  const records = getRecords();
  records.push(rec);
  localStorage.setItem('clb7_reading', JSON.stringify(records));
  if (window.ClbSync) ClbSync.push(); // 做完立刻嘗試同步，不等debounce
}

// ── 自動計時：練習時間自動記入 clb7_tracker（type: auto-reading）─
(function(){
  const TYPE='reading', TICK=15, IDLE_MS=60000;
  let acc=0, lastAct=Date.now();
  ['keydown','pointerdown','scroll','touchstart'].forEach(ev =>
    document.addEventListener(ev, () => lastAct=Date.now(), {passive:true}));
  setInterval(() => {
    if (document.visibilityState==='visible' && Date.now()-lastAct < IDLE_MS) acc += TICK;
  }, TICK*1000);
  function flushTime(){
    if (window.ClbSession && window.ClbSession.isActive()) { acc = 0; return; } // session 進行中由 session_timer 統一計時，避免雙重計入
    if (acc < 30) return;
    try {
      const d = new Date();
      const data = JSON.parse(localStorage.getItem('clb7_tracker')) || [];
      data.push({ ts: Date.now(),
        date: `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`,
        type: 'auto-'+TYPE, sec: acc });
      localStorage.setItem('clb7_tracker', JSON.stringify(data));
      acc = 0;
    } catch(e) {}
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState==='hidden') flushTime(); });
  window.addEventListener('pagehide', flushTime);
})();

// ── 今日錯題本（dashboard 讀 clb7_wrong_log）──────────────────
function logWrong(entry) {
  try {
    const log = JSON.parse(localStorage.getItem('clb7_wrong_log')) || [];
    const d = new Date().toLocaleDateString('zh-TW', {year:'numeric',month:'2-digit',day:'2-digit'});
    const dup = log.find(e => e.d === d && e.src === entry.src && e.q === entry.q);
    if (dup) { dup.n = (dup.n||1) + 1; dup.t = Date.now(); }
    else log.push({ ...entry, d, t: Date.now(), n: 1 });
    localStorage.setItem('clb7_wrong_log', JSON.stringify(log.slice(-300)));
  } catch(e) {}
}

// ── Article list ──────────────────────────────────────────────
function renderArticleList() {
  const records = getRecords();
  const doneIds = new Set(records.map(r => r.id));

  const list = document.getElementById('articleList');
  list.innerHTML = '';
  ARTICLES.forEach((a, idx) => {
    const done = doneIds.has(a.id);
    const lastScore = records.filter(r => r.id === a.id).slice(-1)[0];
    const scoreText = lastScore ? `${lastScore.correct}/${lastScore.total}` : a.level;

    const btn = document.createElement('button');
    btn.className = 'article-btn' + (done ? ' done' : '');
    btn.innerHTML = `
      <div class="art-num">${idx + 1}</div>
      <div class="art-body">
        <div class="art-title">${a.title}</div>
        <div class="art-meta">${a.theme} · ${a.questions.length} questions</div>
      </div>
      <div class="art-badge">${done ? '✓ ' + scoreText : a.level}</div>
    `;
    btn.onclick = () => openArticle(idx);
    list.appendChild(btn);
  });
}

// ── Open article ──────────────────────────────────────────────
function openArticle(idx) {
  currentArticleIdx = idx;
  userAnswers = {};
  submitted = false;
  const a = ARTICLES[idx];

  document.getElementById('panelHeading').textContent = `${a.level} · ${a.theme}  —  ${a.title}`;

  // 發音三層：整段連續朗讀＋高亮／點句／點字（tts_reader.js，全站共用）
  // mount() 會先 stopAll()，所以切文章一定不會跟上一篇疊音
  if (window.TtsReader) {
    ttsCtl = TtsReader.mount({
      textEl: document.getElementById('panelText'),
      barEl:  document.getElementById('ttsBar'),
      text:   a.text
    });
  } else {
    document.getElementById('panelText').innerHTML = a.text.replace(/\n/g, '<br>');
  }

  // Build questions
  const block = document.getElementById('questionsBlock');
  block.innerHTML = '';
  a.questions.forEach((q, qi) => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = `qcard-${qi}`;
    card.innerHTML = `
      <div class="q-num">QUESTION ${qi + 1}</div>
      <div class="q-text">${q.q}</div>
      <div class="options" id="opts-${qi}">
        ${q.opts.map((o, oi) => `
          <button class="opt-btn" data-qi="${qi}" data-oi="${oi}" onclick="selectOpt(${qi},${oi})">${o}</button>
        `).join('')}
      </div>
      <div class="q-feedback" id="fb-${qi}"></div>
    `;
    block.appendChild(card);
  });

  const btn = document.getElementById('submitBtn');
  btn.disabled = false;
  btn.textContent = 'Vérifier mes réponses';
  btn.onclick = submitAnswers;   // 重置成原本的驗證行為（上一篇若答完會被改成查看結果）
  document.getElementById('reviewHint').textContent = '';

  showPanel('readingPanel');
}

// ── Select option ─────────────────────────────────────────────
function selectOpt(qi, oi) {
  if (submitted) return;
  userAnswers[qi] = oi;
  const opts = document.querySelectorAll(`#opts-${qi} .opt-btn`);
  opts.forEach((b, i) => {
    b.classList.toggle('selected', i === oi);
  });
}

// ── Submit ────────────────────────────────────────────────────
function submitAnswers() {
  const a = ARTICLES[currentArticleIdx];
  const totalQ = a.questions.length;
  const answered = Object.keys(userAnswers).length;

  if (answered < totalQ) {
    const unanswered = totalQ - answered;
    if (!confirm(`Il reste ${unanswered} question(s) sans réponse. Continuer quand même ?`)) return;
  }

  submitted = true;
  let correct = 0;

  a.questions.forEach((q, qi) => {
    const chosen = userAnswers[qi];
    const isCorrect = chosen === q.ans;
    if (isCorrect) correct++;

    const opts = document.querySelectorAll(`#opts-${qi} .opt-btn`);
    opts.forEach((b, i) => {
      b.disabled = true;
      if (i === q.ans) b.classList.add('correct');
      if (i === chosen && !isCorrect) b.classList.add('wrong');
    });

    const fb = document.getElementById(`fb-${qi}`);
    fb.className = 'q-feedback show ' + (isCorrect ? 'correct-fb' : 'wrong-fb');
    fb.textContent = (isCorrect ? '✓ ' : '✗ ') + q.expl;

    if (!isCorrect) logWrong({ src:'reading', q: q.q, a: q.opts[q.ans], note: q.expl, title: a.title });
  });

  // Save record
  const timeTaken = elapsedSec;
  saveRecord({
    id: a.id,
    title: a.title,
    date: todayStr(),
    correct,
    total: totalQ,
    sec: timeTaken
  });

  // 07-16修復：不再自動800ms跳結果（沒時間看解說）——改成按鈕留在畫面上，
  // Owen 自己看完每題解說、想繼續了再手動點「查看結果」
  const btn = document.getElementById('submitBtn');
  btn.textContent = 'Voir le résultat →';
  btn.onclick = () => showResult(correct, totalQ, timeTaken);
  document.getElementById('reviewHint').textContent = '慢慢看每題的解說，看完再點上面的按鈕看總分';
}

// ── Result panel ──────────────────────────────────────────────
function showResult(correct, total, sec) {
  document.getElementById('resultScore').textContent = `${correct} / ${total}`;
  document.getElementById('resultTime').textContent = `Temps : ${fmtTime(sec)}`;

  const pct = Math.round(correct / total * 100);
  let msg = '';
  if (pct === 100) msg = 'Parfait ! Vous avez tout compris. 🎉';
  else if (pct >= 67) msg = 'Bien ! Relisez les explications pour les erreurs.';
  else msg = 'Continuez à pratiquer. La lecture s\'améliore avec la répétition.';

  document.getElementById('resultMsg').textContent = msg;
  showPanel('resultPanel');
  updateScoreLive();
  renderArticleList();
  renderHistory();
}

function retryArticle() {
  openArticle(currentArticleIdx);
}

// ── Panel switching ───────────────────────────────────────────
function showList() {
  submitted = false;
  currentArticleIdx = null;
  showPanel('listPanel');
}

function showPanel(id) {
  // 離開閱讀面板一定要中止朗讀（不然會在清單／結果頁繼續唸）
  if (id !== 'readingPanel' && window.TtsReader) TtsReader.stopAll();
  ['listPanel','readingPanel','resultPanel'].forEach(p => {
    const el = document.getElementById(p);
    if (p === 'listPanel') el.style.display = (p === id ? 'block' : 'none');
    else el.classList.toggle('active', p === id);
  });
}

// ── History ───────────────────────────────────────────────────
function renderHistory() {
  const records = getRecords();
  const card = document.getElementById('historyCard');
  if (!records.length) { card.style.display = 'none'; return; }
  card.style.display = 'block';

  const recent = records.slice(-8).reverse();
  const rows = document.getElementById('historyRows');
  rows.innerHTML = recent.map(r => {
    const pct = Math.round(r.correct / r.total * 100);
    const cls = pct === 100 ? 'perfect' : pct >= 67 ? 'good' : 'poor';
    return `<div class="history-row">
      <div class="h-date">${r.date}</div>
      <div class="h-art">${r.title}</div>
      <div class="h-score ${cls}">${r.correct}/${r.total}</div>
    </div>`;
  }).join('');
}

// Init panel state
document.getElementById('listPanel').style.display = 'block';
</script>
